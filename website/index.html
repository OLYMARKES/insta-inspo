    "path": "data/vi_vse_nepr_export/posts_md/2019-12-03__43__нас_анонимных_наркоманах_система_наставничества_наставник_нас.md",
    "source": "Vi Vse Nepr",
    "filename": "2019-12-03__43__нас_анонимных_наркоманах_система_наставничества_наставник_нас",
    "full_content": "2019-12-03 — нас анонимных наркоманах система наставничества наставник нас\n*From*: Вы все живёте неправильно\n\nУ нас в анонимных наркоманах есть система наставничества. Наставник у нас называется «спонсор», ну и соответственно есть «подспонсорные». Нет одного стиля ведения человека по шагам, есть совершенно разные подходы. Кто-то любит держать подспонсорных в жесткой дисциплине, типа - звони раз в неделю, или я тебя не веду. Кто-то может указывать, что делать, а что не делать. У меня и со спонсором, и с моими подопечными - полная свобода. Каждый несет ответственность за свою жизнь, я переживаю, если мои мне долго не звонять, моя спонсор переживает, когда не звоню я.\n\nЯ долго не звонила, потому что в шаге у меня ступор. И мне надо как-то себя пересилить, перевернуть все смыслы и найти выход из этой комнаты: нужны еще люди, которым я нанесла ущерб. Какой это ущерб? В чем? Все ситуации, которые пришли на ум, я написала. Но это слишком мало, этого не хватает.\n\nПроблема в том, что я терпила. Даже в ситуации с астрологом, знаете что я думаю? А вдруг она читает как меня защищают и ей плохо от этого? Вдруг она с хорошими помыслами? Вот я бы могла потерпеть и промолчать. Я ведь привыкла амортизировать и вывозить все своим ресурсом, поэтому обычно я говорю себе сама: нихуя тебе не тяжело, раз справляешься.\n\nКонечно, иногда моему терпению приходит конец, и вот когда я посылаю человека подальше, я начинаю умирать от чувства вины. И это такое дискомфортное чувство, что терпеть, пожалуй, даже приятнее. Я привыкла терпеть, и каждый раз в Екб меня макает в мое детство, и я вспоминаю, откуда растут ноги.\n\nОбычно я просто рассказываю спонсору: у меня так и так, вот так я это проживаю. И первый раз за четыре года было не так. Я позвонила, чтобы жаловаться. Я жаловалась и жаловалась. Я взяла и вывалила все, с чем не могла справиться. И мне так полегчало, вы даже не представляете. Вроде такая очевидная вещь - но для меня она совсем не стандартная. Обычно я как будто немного над ситуацией. Есть у меня ощущение: ну ведь я живу? А это значит, я справляюсь.\n\nКогда я разводилась, я просто сказала: я развожусь. Когда у нас были конфликты я говорила: мне тяжело, мне страшно, это пиздец, но в целом я в порядке. Обычно у меня нет сомнений в том, что я делаю, и у меня почти всегда есть решение.\n\nМоя главная проблема - мне может не хватать сил, я постоянно выпадаю из ресурса, но не могу отменить свои дела и расписание, я ненавижу подводить людей, а себя мне вообще не жалко.\n\nТак можно пробежать марафон, или отъездить тур с младенцем и дырой с палец в челюсти. И в целом сделать это так, что никто и думать не будет о том, что тебе сложно. Мне пиздец, но я ебашу. И в целом я не падаю в эмоциональную яму. То есть даже когда мне пиздец, я в общем-то бодрячком. Я знаю людей в депрессии, я умею сравнивать, так вот я прежде всего вывожу все это эмоционально, а потом уже - все остальное.\n\nДа, люди видят во мне сверхчеловека, но не видят механизмы внутри меня, которые толкают по зеленому полю этот ходячий замок. А механизмы эти не то что бы здоровые.\n\nВ Екб я думала - как мне удалось выжить? Я помню это ощущение, когда хочется щипать себя и царапать, чтобы отвлечь от душевной боли. Или повторять «сдохнутьсдохнутьсдохнуть» миллион раз подряд.\n\nВзрослые научили меня терпеть. Наверное во многом так. Рецепт успеха в том, чтобы стереть свои границы и личность и ни на что никогда не претендовать. Рецепт счастья в том, чтобы никогда не забывать о том, какое ты ничтожество - ты просто уверен, что счастье невозможно заработать такому человеку, как ты. Но его можно взрастить в себе и передать другим, потому что даже капля для тебя - это много. Если повезет, можешь стать настоящим монахом, если тебя, конечно, не сломает. Меня просто не сломало.\n\n«И больше всего я ненавижу утро, когда ты не принадлежишь себе, но в середине уже не так трудно» - пела я в Уфе «Бесконечное Го», и эти строчки о моем детстве.\n\nМне казалось, что если я пережила это, я смогу пережить все. Чтобы быть счастливым человеком, мне пришлось не только научится видеть свет, когда я закрываю глаза, сидя внутри своего тела, как в одиночной камере. Видеть Бога там, где нет ничего кроме боли.",
    "final_title": "Наставник у нас называется «спонсор», ну и соответственно есть «подспонсорные»",

    "full_content": "2022-12-09 — дурге возвращалась сцены гримерку падала эту пучину\n\nДурге возвращалась со сцены в гримерку и падала в эту пучину боли, у которой не было предела. Когда казалось, что физическое тело на грани смерти, она писала ему. Он приходил, обнимал, и боль уходила. И стоило только восстановиться, как она снова попадала в этот бэд трип: триггер - желание вырвать эту любовь из себя - невыносимая боль абстиненции. Просто еще один зависимый круг, в котором не было реального человека, а был додуманный враг и злая капитуляция в те моменты, когда не хватало сил быть стойкой в своём: «никогда больше не подходи ко мне»\n\nВчера он сказал мне все, что нужно было услышать тогда. Все те слова, все то видение меня, которого мне так не хватало. Я почувствовала себя особенной, я почувствовала себя сильной, красивой внутри и снаружи, мощной, чувствительной, хрупкой. Я все передала той девочке.. И мне кажется, она успокоилась. Мне кажется, она поняла, что с ней все в порядке, и больше не нужно казаться сильнее, чем она есть на самом деле.\n\nИз этого же - недавно Вера рассказала мне, что песня «Каждую мою весну» - про меня. Почему-то внутри себя я думала, что про другую нашу подругу. Я даже не могла примерить на себя, что Веры со мной такие отношения. Но когда я переслушала текст, я все поняла. Недавно в Ереване мы с ней об этом говорили. О том, что когда она сильно любит кого-то, она боится исчезнуть, раствориться, быть поглощённой. Поэтому она защищается от меня и это вечное ощущение конфронтации делало мне больно и изматывало столько лет. Когда человек, которого ты любишь, демонстрирует тебе независимость.\n\n ⁃ Но в моих руках оказавшийся кольт стреляет в тебя у первой стены. Мне всегда больно, когда люди, которые меня глубоко трогают внутри, которых я люблю, начинают от меня защищаться. Этот месседж «ты для меня опасна» превращает меня в грустное чудовище из аленького цветка. Много одиночества и изоляции, и так много жизненнных примеров, как важные для меня люди, не видя уязвимости, превращали меня в демона в своих глазах, и я сама через их взгляд на себя начинала себя ненавидеть. Вчера был важный для меня день, и я думаю, еще много раз буду к нему возвращаться и думать об этих событиях. Спасибо, что разделили со мной эти чувства.",

    "filename": "2019-07-09__18__когда_турили_была_игра_или_город_или",
    "full_content": "2019-07-09 — когда турили была игра или город или\n*From*: Вы все живёте неправильно\n\nЕще когда мы турили, у меня была игра: или я город, или он меня. Если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня. Если собираю волю в кулак, иду бегать по незнакомым улицам, думаю о питании, отказываюсь от сладкого и всякой дряни, которую всегда в туре проще найти - значит я его.\n\nМы с городами играли. Питер меня не принимал. Однажды я приехала в него на «лечебном голодании» - на самом деле просто не ела две недели, потому что друзья наркоманы сказали, что я поправилась от своего зожа. Ну а как иначе. И вот Питер меня заколбасил особенно в тот раз - после концерта в моде, кажется, я ела на корточках в подворотне ягодное лукошко и запивала ряженкой, потом - горечь, глинтвейн, и дальше - можно было выбрасывать открытку на месяц трезвости от анонимных.. Но потом я вернулась, и я бежала по мостам через два острова и один континент, и все уже было иначе потом.\n\nСейчас как и 10 лет назад я радуюсь, когда выхожу на пробежку в незнакомом городе, и направление выбирает меня, и я просто бегу. За это время я избегала столько городов, сделала столько тренировок в парках, гостиницах и съемных квартирах - этого не сосчитать, даже если сильно стараться.\n\nК чему это я - читала тут алмазного огранщика и думала о правилах успеха. У меня они совсем другие, чем во всяких бизнес-книгах, но когда я слышу в книгах кино или фильмах что-то похожее, буквально фразу одну - это открывает мне мою локальную истину: о, это про меня.\n\n«и так я годами трахала свое тело, пока полностью не подчинила его себе» - услышала я лет в 16, в мультике про Фину (кстати, антимульт.ру делают сейчас портал зожник) когда еще курила сигареты и не только. Какой-то колокольчик прозвенел внутри и я надолго забыла это, но всегда помнила. Когда я ела грибы, моим главным инсайдом было: пиздец я живу неправильно. И все вокруг меня тыкало носом в то, что я живу не так, как нужно - от боли в теле до… Короче неважно.\n\nКогда я начала бегать, тренить, правильно питаться - я срывалась, я уходила в крайности, я допускала много ошибок. Но это был правильный путь. Сначала я трахала свое тело всем этим, и голову свою тоже трахала, а потом.. Не то что бы я его подчинила, но что-то произошло. Все эти вещи - и тренировки, и бег, и хорошая еда - они стали моими союзниками, моим любимым ритуалом, который делает меня сильнее. Это - как обучится единоборству и больше уметь, чем учиться.\n\nИ каждая эта точка - когда я пробежала, когда я делала тренировку - это как в «соедини точки с цифрами и получи картинку». В моем воображении все они светятся и создают карту, которую я нарисовала на своей жизни. Я делала хорошие вещи и они привели меня к хорошему. Такое простое правило получается… Делай хорошие вещи. А плохие вещи не делай.",
    "final_title": "если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня",
    "final_annotation": "Если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня. Но потом я вернулась, и я бежала по мостам через два острова и один континент, и все уже было иначе потом. Сейчас как и 10 лет назад я радуюсь, когда выхожу на пробежку в незнакомом городе, и направление выбирает меня, и я просто бегу",

    "full_content": "(no title)\n\n12.07.09\tJimbo:\tЗдравствуйте, Ольга!\nМы готовим интернет-журнал о музыке в нашем регионе, в связи с этим хотелось бы задать несколько вопросов касательно вашей группы. Ждем вашего согласия\n12.07.09\tОльга:\tПривет! задавайте )\n12.07.09\tJimbo:\tЧем развернутее будут ответы - тем лучше!\n1 - Как давно существует ваша группа?\n2 - На что вы расчитывали создавая группу? Что получилось?\n3 - Можно ли вас назвать популярной успешной группой?\n4 - узнают ли вас на улицах?\n5 - востребована ли ваша музыка?\n6 - Как долго вы собираетесь заниматься музыкой?\n7 - чем вы занимаетесь помимо музыки?\n8 - какие книги вы и другие участники группы считаете лучшими, окозавшими на вас какое-либо влияние?\n9 - какие музыкальные альбомы?\n10 - фильмы, мультфильмы?\n11 - не кажется ли вам что вы сдаете обороты, ведь многие из ваших песен стали похожи друг на друга?\n12 - Что бы вы хотели поменять в группе?\n13 - В городе, в стране, в мире?,?,?\n14 - в ваших песнях встречаются ямайские религиозные мотивы - откуда это в вас??\n15 - ваше отношение к наркотикам, алкоголю\n16 - планы на ближайшее будующее\n17 - пару слов вашим слушателям\n12.07.09\tОльга:\tу меня есть принцип - я закончила журфак, и дала клятву гиппократа что я никогда не буду делать работу за коллег и на вопросы буду отвечать только устно. Но у меня есть моя группа и мы живем вместе и я попросила парней ответить на вопросы, вот\n1-Наша группа Образовалась две недели назад.К Нам пришел новый барабанщик.\n2-Я расчитывал увидеть много голых тёлок.А получилось,что пока увидел только одну(Костя-трубач)\n3-Популярность группы зависит от количества популярных людей в группе!Например у нас недавно опять лишился девственности секс - символ группы, Костя так напился, что поддался на очередное изнасилование,А однояичковый Шапо до сих пор свободный.\n4-Да меня постоянно пытаются увести из группы цыгане.Ходят на каждый концерт и поджидают на улице(Дима-Гитарист)\n5-Как то мы с любовником нашего директора красили его гараж,и я пошёл в киоск за водой.Там встретил молодого чувака который спрашивал,есть ли у меня с собой наша аудио касета.По моему это придел всех мечтаний для музыканта живущего в 21веке.(Дима-гитарист)\n6-Мы не строим планы кто сколько будет этим заниматься,можно задать лишь вопрос кто сколько собирается прожить,потому что жить без музыки для нас полный SUCKS(Дима-гитарист)\n7-В родном городе мы занимались кто чем.В культурной столице мы все вместе занимаемся спортом,бегаем катаем йогу,смотрим как наш друг паша катается на Маунтин Борде,А под вечер когда все ложатся спать мы с костей надираемся в хламину.(Дима-Гитарист)\n8-(Костя)-Я дочитываю седьмую версию камасутры,в сентябре перехожу на практику.На меня оказала влияние только единственная книга Майлса Девиса-(автобиография),может быть,потому что это единственная книга которую я читал.\n9-(Костя)-Мой любимы альбом,и музыкальный совместный проект,это Борис Моисеев И Костя Трубач!!!\n(Дима-гитарист)-Мой любимый альбом 30х годов,цыганского,трёх-палого гитариста Джанго Рейнхарда!!!Когда об это узнали цыгане,они решили отыскать меня и отрезать мне два пальца!!!\n10-(Костя- трубач) С переездом в Петербург у нас показывает канал 2X2 , а телевизор у нас стоит только на кухне, и мы когда вместе завтракаем или обедаем одновременно смотрим мультики, например Скуби ду\n11- Каждая песня Alai Oli живет своей жизнью и для каждого человека она значит что то особое и неповторимое, например для нас песня это что то вроде выращенного вместе ребенка, от зачатия до взросления, у Оли рождаются мысли в голове, а мы с группой стараемся вырастить из этих мыслей что то стоящее.(Костя трубач)\n12-( Костя - трубач) Я бы хотел видеть на каждом концерте трех негритянок на подтанцовках, только не знаю как к этому отнесется наша вокалистка.(Оля Маркес)-Пошёл в вон.\n13-(дима_гитарист)-Больше глутомата натрия!\n14-(Дима-гитарист)-Моя бабушка перед тем как я проснусь напевала мне религиозные ямайские мотивы.Откуда это в нашей музыке только ей известно.\n15-Если мы связываем свою жизнь с музыкой,это значит,что мы постоянно сталкиваемся с наркотиками,так что эта тема актуальна в нашей жизни, но сейчас мы регулярно посещаем собрания анонимных наркоманов и это помогает нам не торчать!\nМы собираемся в ближайшем будущем собрать Олимпийский и потом уехать в Индию, учится йоге в одном из университетов в горах.\nэээээээээээ........ среди вас есть красивые и умные девушки? (Костя) Хотя.... Нафига нам умные? (Дима) )))",

    "filename": "2024-08-15__378__проснулась_под_дождь_классно_когда_не_надо",
    "full_content": "2024-08-15 — проснулась под дождь классно когда не надо\n\nПроснулась под дождь. Как же классно, когда не надо НИКУДА вставать и нет внутренней тревоги. Иногда бывает нет рабочих задач, но все равно надо бежать к детям их кормить, ощущение что все там происходит и как то надо включаться.\n\nМы валялись, болтали, рассказывали сны. Потом утренняя тренировка в кайф, Дима приготовил завтрак. В лес не пошли, потому что дождик все еще шел.\n\nЯ смотрела «Выживших», серию «Наркоблогеры» и потом пыталась узнать что случилось с этими героями. Очень много там такого, что было и в моем.. когда тебе 20 ты думаешь, что ты уже взрослый. Но в 37 тебе очевидно что ты в том возрасте ничего не соображал. Мне тогда мои друзья казались уникальными: красивые, умные, модные. И так все и было на самом деле. Ну да, торчали. Но все практически вокруг или пили или торчали, и нарко туса всегда была даже более интеллигентной. Но эти исписанные стены, эти диваны, лежательные поверхности - это все осталось даже на фотках у меня.\n\nОсобенно мне понравилась девочка Лера. Говорят у нее все плохо. И рыжий мальчик, который рассказывал что у него в 23 высшее образование и 10 научных статей, и что он учился в Эрмитаже. Такой классный, такой живой, такой светлый ум. Так и вижу в нем гениального мальчишку, которого все обожают. Он уже умер.\n\nЯ лежала в реб.центрах и ходила на группы со своих 19 лет, я это все видела вживую, даже если не была прямым участником. И это полезно освежить в памяти. Понять, что этот мир где-то существует сейчас, и там живые люди, большая часть из которых уже обречена, но всегда есть немого надежды на хороший конец. Как же хочется, чтобы у них получилось найти путь к свету.\n\nТак, возвращаюсь к своему дню. Созвонились с Дориновым, обсуждали документальный фильм, который уже есть (где-то на половину), и который был показан у меня на ДР. Но там хочется больше архивных кадров и больше той истории. О том, что было в начале. Так что договорились работать дальше, искать партнеров/спонсоров, чтобы зафинансировать команду. С Alai Oli я вообще не беру никаких денег, кроме 1/7 части с концертов. И даже такой важный проект финансировать сама не хочу, это должно быть нужно еще кому-то кроме меня и Доринова. Так решили.\n\nПосле звонка копалась с архивами и билась с Vk чтобы найти мои заметки старые. Там есть прям важные раритеты.\n\nПотом записала всякие мини интервьюшки для команды. Попросила Gconf дать немного инфы рабочих кейсов для одной из программ секты (без спойлеров))\n\nКстати мы анонсировали поиск протагонистов - AI контентмейкеров на следующий поток Gconf\n\nПотом приехали Вадим и дети. Дети сразу убежали с друзьям, а мы сидели на крыше и пили какао на закате втроем.\n\nВечером мы с Димой заехали в баню «Чертовы Ворота» и классно друг друга попарили веничками. Туда и обратно ехали под подкаст Хубермана с Dr Martha Beck - у нее три гарвардские степени и она тоже живет с двумя партнерами.\n\nУ нее там в подкасте оч крутые мысли про отношении, например, в вольном переводе: «когда твой партнер имеет зависимость от того, как ты удовлетворяешь его потребности (you pleasing him) у тебя появляется созависимость от его реакций, и ты теряешь себя». Иногда для отношений полезна «жесткая любовь» где ты говоришь: «я не буду это делать, не буду предавать себя» и ты даешь человеку принять/не принять тебя в твоей правде.\n\nВечером классно поболтали со старшими детьми. Они задавали вопросы про зависимость, в том числе про мой опыт, как я с этим справилась. Все это по мотивам встречи с их папой. Надеюсь, там все тоже будет хорошо. Хочется верить.\n\nПод конец вечера все таки победила VK, нашла свои заметки и читаю 2007 год. Уф.\n\nLinks:\n- \n- \n- \n-",
    "final_title": "2024-08-15 — проснулась под дождь классно когда не надо\n\nпроснулась под дождь",

    "full_content": "Четверг - день, когда я рассказываю о зависимости и о том, как с ней жить 😄\n⠀\nСобрания разных групп часто показывают в кино, обычно это - просторные комнаты или залы. Однажды во Франции я была на группе в очень красивом соборе. В России помещения у большинства групп неказистые, маленькие и мрачные. Группы живут на добровольные пожертвования членов, денег у них не много, и они снимают комнаты у различных социальных центров помощи гражданам.\n⠀\nГруппы ведут волонтеры. Обычно те, кто сами ходят в это помещение/на это время. Пока я жила в Питере, я вела свою «домашнюю» группу по вторникам. Брала ключ, открывала помещение за 10 минут до собрания. В назначенное время я начинала читать приветственный текст. Во всех сообществах есть некая «преамбула» - она читается перед каждым собранием в одном и том же виде. Там содержится информация о сообществе, о 12 шагах, кто и зачем собирается. Группа состоится, если придет еще хотя бы один человек. Если нет - я посижу час, подожду, потому что вдруг где-то идет новичок, которому это собрание очень нужно.\n⠀\nОднажды мы в Риге приехали на такую группу. Мы с моим другом были единственными гостями, кроме нас был только ведущий и девушка, они просто сидели и ждали. Они были нам очень рады, и для нас провели собрание на русском. Я стараюсь посещать собрания в разных странах, даже если не знаю языка. Во всех странах люди с похожими проблемами - похожи.\n⠀\nПосле преамбулы читается ежедневник, его я часто выкладываю в сториз. Там - размышления на разные темы, всего - 365, на каждый день. Там всегда есть о чем задуматься.\n⠀\nПосле ежедневника ведущий разрешает высказываться. И вот в течение 2-3-5-7 минут (зависит от количества людей) каждый говорит о своем радостном или наболевшем. Можно задать тему, чтобы другие делились опытом. Можно не говорить ничего, а только слушать. Если на собрании новичок - есть тема «Для новичка», и все рассказывают о том, как они сюда попали и что им это дало. Никто не комментирует высказывания других и не дает советов. Важно говорить о себе и своем опыте. Градус откровенности ты задаешь сам. (Продолжение в фото) #12шагов_olymarkes",
    "final_title": "Однажды во Франции я была на группе в очень красивом соборе",
    "final_annotation": "В России помещения у большинства групп неказистые, маленькие и мрачные. Группы живут на добровольные пожертвования членов, денег у них не много, и они снимают комнаты у различных социальных центров помощи гражданам. Обычно те, кто сами ходят в это помещение/на это время",

    "path": "data/ig_organized/long_200_md/2020-04-09.md",

    "full_content": "«Чистый» четверг. По четвергам я пишу о «12 шагах» - это письменная работа, которую делают люди, у которых есть разные зависимости или сложные состояния. Я уже 7 лет пишу шаги, и это очень важная часть моей жизни.\n⠀\nСейчас я начала десятый шаг. Он звучит так: “Мы продолжали самоанализ и когда допускали ошибки, сразу признавали это”\n⠀\nЗа все время глубоких самокопаний я поняла, что самую большую боль я испытываю тогда, когда мои действия расходятся с моим же внутренним компасом. То есть все это началось с простого определения этого когнитивного диссонанса: я употребляю алкоголь/наркотики, и мне это мне не нравится, но я не могу остановиться.\n⠀\nКазалось, что ничего не употреблять - этого достаточно, но потом я поняла, что проблема в целом лежит в моем компульсивном поведении, когда я испытываю обиду, страх, боль, я часто начинаю творить то, за что мне потом бывает стыдно. Я могу рубить с плеча, расставаться с людьми, обрубать связи. Мне иногда проще перестать общаться с человеком, притвориться, что его не существует, только чтобы не встречаться со своими чувствами.\n⠀\nКогда я не права - я часто начинаю убеждать себя в обратном, я не умею отлавливать эти расхождения с внутренним компасом на первых этапах, и мне постоянно приходится возвращаться к себе к вопросом:\n⠀\n- Как на самом деле ты хочешь поступить?\n⠀\nИногда я отвечаю себе так:\n⠀\n- Мне просто хочется извиниться. Мне просто хочется сказать, что не смотря на конфликт интересов, мне важны эти отношения.\n⠀\nИногда я думаю:\n⠀\n- На самом деле я не хочу общаться с этим человеком, я продолжаю это делать, потому что мне страшно, что он разозлится/обидится.\n⠀\nКогда я начинаю отслеживать свои истинные состояния, следующая часть - это начать поступать так, как считаешь нужным. Классно, что ты работаешь с этим в своем темпе, и начинаешь поступать по-другому именно тогда, когда ты реально готов.\n⠀\nЖить в соответствии с собственным компасом - это огромное облегчение. Вот о чем я хотела поговорить с вами сегодня 🙂 #12шагов_olymarkes",

    "full_content": "По четвергам я пишу о 12 шагах, терапии и внутренних метаниях.\n⠀\n«Дай мне разум и душевный покой принять то, что я не в силах изменить, мужество, изменить то, что могу и мудрость отделить одно от другого» - такой молитвой на разных языках молятся люди разных религий, пришедшие на собрания групп взаимоподдержки.\n⠀\nДве вещи, которые чаще всего пугают и отталкивают в 12 шаговой программе - это Бог и Бессилие. Но по сути дела ты можешь быть очень сильным и волевым неверующим человеком и так же эффективно использовать все инструменты программы, правильно определив для себя эти концепции.\n⠀\nРасскажу на примере: завтра я должна была лететь в Сочи. Мне очень хотелось поехать на каталку, ухватить последний снег в горах. Я читала миллион статей о том, что надо сидеть дома, сократить контакты и не путешествовать. И у меня внутри постоянно шли торги: но ведь я соблюдаю правила предосторожности, но ведь эпид.ситуация не такая серьезная и т.д. Все внутри меня искало аргументы «чтобы полететь». И так я вспомнила, что при общении действующие наркоманы делают так же: ищут 10 причин, почему именно им не нужно прекращать употребление наркотиков.\nЗавс-мость - это болезнь эгоизма. И я бессильна перед своим эгоизмом. Я не могу взять и стать сверх-эмпатичным активистом, который упорнее всех сортирует мусор, первым садится на карантин и первым выступает по всем важным вопросам. У меня чаще всего нет вообще никакого мнения о том, что не касается меня конкретно. Мне понадобилось время, чтобы понять, что это - не меняется, и в глубине души я себя за это ненавижу.\n⠀\nВ тот момент, когда я понимаю свой компульсивный порыв думать только о себе, я обращаюсь к чему-то высшему. Я могу использовать обращение к Богу, но покажу вам как это работает без него. Я прошу:\n⠀\n«Пусть во мне созреет или на меня свалится готовность, решимость поступить так, как я бы поступила, если бы я не была таким эгоистичным человеком. Пусть в моей голове хорошие намерения победят эгоистичные».\n(продолжение во 2 фото)",

    "full_content": "2020-11-22 — антон многое открывал кажется рассказал плите собираются\n\nАнтон многое мне открывал. Кажется, это он рассказал мне, что на «Плите» собираются неформалы - и что-то в этом меня очень задело. Мне так захотелось стать частью этой тусовки «не таких, как все», что в один день я пришла из школы, закинула рюкзак в ящик для картофеля, который стоял у нас в подъезде, взяла проездной и отправилась на трамвайную остановку.\n\nМеня потряхивало от страха. Я еще никогда не пользовалась транспортом без взрослых. Мне казалось, что папа в любой момент может проехать мимо меня на машине, и я торопила трамвай, который все не шел. Меня научили спрашивать у взрослых дорогу, и как-то я узнала, какой именно трамвай мне нужен. А может быть, я села на первый попавшийся, и мне просто повезло.\n\nВ трамвае я ехала пригнувшись, потому что боялась, что папа будет проезжать мимо на машине, и увидит меня в окно, и выдаст мне на орехи. Но все прошло благополучно - я вышла на трамвайной остановке между памятником Ленину и сквером. Этот сквер и называли «плитой». По периметру обычно стояли лотки с неформальскими аксессуарами - браслеты, банданы и торбы с названиями групп, сережки для пирсинга и многое другое, что при правильном применении создавало визуальное отличие - делало тебя не обывателем, а неформалом.\n\nУ памятника Ленину все время шла вялотекущая демонстрация коммунистов с красными флагами, мегафонами и плакатами. Никто не обращал на них внимание, никто не разгонял и уж тем более не воспринимал их как угрозу действующей власти. Это сейчас на контрасте все эти несанкционированные митинги и шествия выглядят даже как-то героически - тогда свобода была во всем, и для нас, детей, она была не в новинку, как для наших родителей. Для нас свобода была данностью. Все эти лотки и палатки с торговлей всем на свете, субкультурность, ставшая разрешенной и массовой - все это родилось у нас на глазах, но быстро стало обыденным - мы совсем не ценили этой свободы, а родители были только рады поменять все это на какую-то уверенность в завтрашнем дне.\n\nЯ стояла в центре сквера и от адреналина у меня срывалось дыхание, я видела группку «неформалов» и понимала, что мне надо подойти к ним и познакомиться - ведь это и было моей целью. Мне было страшно, что меня отвергнут и не возьмут к себе - это уже происходило со мной в школе, и если произойдет и здесь - это бы разбило мне сердце. Но я решила все-таки сделать это: выдохнула и подошла.\n\nСпич мой был какой-то максимально наивный: я сказала, что идентефицировала их, как неформалов, и хотела бы стать частью их тусовки. Девушка, к которой я обращалась, повела себя достаточно снисходительно - спросила, как мое «погоняло» - и когда узнала, что у меня его нет, предложила ряд своих вариантов. Я запомнила только «Бритвочка» - кажется, на нем мы остановились.\n\nМне сразу было предложено выпить немного водки и пойти на «Башню» - заброшенная гигантская телевышка в центре Екатеринбурга, которую снесли несколько лет назад - долгие годы она была символом города, возвышаясь над центром - пустые окна, торчащая арматура и еле различимые фигуры смельчаков, которые залезали на двухсотметровую высоту по внешней лестнице или по арматуре или по наружной лестнице из скоб. Однажды, и я окажусь там. Но не в этот раз.\n\nМы только дошли до башни, я увидела ее огромное основание, утонувшее в зарослях сорняка, в рисунках и в мусоре - мне стало страшно - а вдруг меня изнасилуют? А вдруг эти люди плохие? Но самое страшное - это если папа узнает и будет ругаться. Я попрощалась и побежала в сторону дома.",

    "filename": "2009-10-21__5475__знаешь_где_фу",
    "full_content": "Знаешь, где \"Фу\" ?\n\n- Оль, знаешь кризисную поговорку? – Юля (\njuliez_makarova\n)  хитро улыбалась, - Не имей сто друзей, а имей сто рублей!\n- Ну-ну.\nМой статус в контакте – отличное рекламное место. Попадание в 3 тыс. человек target group – стопроцентное. Последнее время я активно этим пользовалась. Началось всё с того, что одногрупница написала: «Оль, не знаешь, кому гитара нужна?». Лот номер один ушёл через несколько часов.\n- Пакуряяям! – радостно подумала я и написала в статусе: «Здесь могла бы быть ваша реклама!»\nПотом таким же макаром был отправлен айфон, который Паша выйграл на БГВ. Ещё через несколько дней – место в машине до Магнитки…\nСкорее всего, в этот жж вы забрели, благодаря моему статусу )) А мне всегда говорили: «Ну и нафиг ты их всех добавляешь?», а я просто не могу отказать в дружбе, даже если этот отказ - электронный, символический.\nЧто там у нас в личных сообщениях? «В Вашем ящике 9056 сообщений. На странице сообщения #1-20.»\nПоследнее время я, правда, удаляю те, на которые отвечаю – так легче ориентироваться.\n«Вы отправили 7343 сообщения. На странице показаны сообщения #1-20.»\n… и почти не отстаю. Больше я нигде не работаю ) Хожу на репетиции, занимаюсь спортом, расплываюсь мыслью по древу, ищу вдохновения, внимательно смотрю по сторонам, слушаю город.. Слушаю, как говорят люди. Как они живут, как любят. Учусь видеть сложное в простом. По-идее, когда это даёт плоды (пример: я музыкант, и мою музыку слушают не только мои родственники) - кто-то должен сделать так, чтобы мне и моим музыкантам всегда было хотя бы 1. что есть 2. где жить.\nМне, как биг боссу, стыдно перед парнями. Я говорила – вот давайте ещё постараемся, и жизнь изменится к лучшему. И дело нашей жизни начнёт приносить хоть какой-то доход… Конечно, они меня ни в чём не обвиняют. Просто скоро найдут себе «приличные» работы, и времени на гастроли и репетиции не останется.\nБу бу бу. Навеяны мысли тем, что нам с Юлей нечем платить за квартиру. За нашу маленькую любимую квартирку с оранжевыми стенами.\n- Если бы все мои друзья вконтакте скинулись по 8 рублей, нам было бы чем заплатить… О… так и напишу!\nМы с Юлей решили устроить встречу с хозяйкой, попросить её скинуть нам квартплату. Но даже если скинет.. .Следующий концерт, в Гринго – благотворительный. А нам самим, блин, гуманитарная помощь нужна. Юля, как настоящая бедная актриса, целыми днями сидит дома, читает Станиславского и есть одни бичпакеты.\nАня Шубина, моя одногрупница – самая добрая девушка на свете, сразу перешла к конструктивным действиям:\n- Оля, давай создадим группу, организуем сбор денег..! – написала она мне в аську, прочитав статус.\n- Нуууу.. Я не знаю как… Да и вообще…\nПотом я почитала стену – народ помочь хочет.. Почему бы и нет? Нет, не так. Почему не стыдно принять помощь? Альбом «Снежная Барселона» мы записывали за настоящие большие деньги, а выложили, отдали всем-всем абсолютно бесплатно. Я даже не перевожу в бабос человеко-труд (запись, репетиции, творческие процессы). Чисто технически - на студии и на сведение ушло ровно 100 т.р. Ощутимая сумма для молодой группы? Ога. Мы даже не пытались «отбить» эти деньги, потому что тогда финансовый вопрос стоял не так остро. Сейчас другое дело.\nСоздала заметку с реквизитами Яндекс.Деньги, какая-то девочка в комментариях написала «Фу.»\nТак и подмывало ответить: ««Фу!» - у тебя в штанах. Не нравится - проходи мимо.»\nНо я промолчала. Господь терпел и нам велел ) И эти времена пройдут, и может быть буду я вальяжно ездить на лимо, жрать фуа-гра, отращу себе «авторитет» и буду со смехом вспоминать это сложное время. А может – устроюсь журналистом в «Вечерний Екатеринбург», буду носить очки в роговой оправе и писать скучные статьи про озеленение жилых массивов Вторчермета.\nФаккенщет. Это - лучшее место на земле.",
    "final_title": "Снежная Барселона: создание альбома",
    "final_annotation": "Воспоминания о Барселоне, где шел снег и создавался альбом. О творчестве, которое рождается в непривычных условиях. О том периоде жизни, когда музыка была способом выживания и самовыражения. История о месте, которое навсегда осталось в памяти и в песнях.",
    "display_date": "2009-10-21T22:53:00+00:00"

    "full_content": "(no title)\n\nТут очень высокие потолки… Высокие потолки и обшрапанные стены, а ещё – окно. На окне длинная зелёная штора. А за окном – лёд тает и блестит на солнце, по нему шагают люди без шапок. Я сижу на стуле рядом с кроватью, скрестив ноги. Я смотрю на Пашу.\nПаша ещё находится где-то в параллельной реальности. Минуту назад он приоткрыл один глаз и еле слышно прошептал: «…что…операции…не было…?»\n- Была, Паш.. – я улыбаюсь и беру его за руку, - доктор сказал, что всё хорошо.\nНо он уже не слышит. Снова спит. Но это – такой болезненный сон, когда человек чувствует боль, но ещё не осознаёт её. Может к утру проснётся – обнаружит все эти бинты на себе, торчащие из тела трубки, какие-то пластиковые баночки с кровью. И каково ему будет – одному, в этой большой больничной палате? Даже некого попросить, чтобы воды принесли. Вот он, минус VIP – одноместного размещения.\nНо я смотрю на него и улыбаюсь. Я спокойна и счастлива, потому что сейчас уже всё хорошо. И можно выдохнуть и перестать боятся.\n***\nК нам приезжал Парень из Африки.\n«Красивый город, но может ты скажешь, куда мне ехать…?!» - прочитала я смс и офигела.\nМы с Юлей сидели в нашем новом доме на Мамина-Сибиряка 126. На вечер того дня у нас была запланирована фотосессия в джакузи с дискоболом, мы ждали в гости Сергея Никифорова (нашего оф. фотографа) и самые сливки группы Alai Oli – Бро и Диму.\nФотосессия прошла отлично. Пока что у меня есть только одна картинка (см. вконтакте аватар), но позже вы всё увидите. Ещё решили сделать нашему менеджеру приятно (см. вконтакте фотоальбом Боже Храни Менеджера!).\nСледующий день гуляли с Парнем из Африки по городу, а потом я ходила на читку пьесы «Китайская Стена» в театр Коляды. Вдохновилась…\nПеред концертом мы с Игорем (пареньизафрики – слишком длинно) и Бро съездили на студию к Тополю, чтобы бахнуть пару совместных треков. По пути зашли в Спид-центр, сделали экспресс-тесты на ВИЧ (ну это входит в программу развлечений для гостей нашего города). Отличный саундтрек – песня Noize MC «Кантемировская», как раз на днях закачала музыки в телефон, чтобы слушать через новые блютуз наушники. К слову – все результаты - отрицательные.\nТусовка в 2КУ прошла отлично. И самая жесть была, когда я увидела в зале нашего менеджера. Он специально прилетел из Питера… или из Москвы? Отправил на концерт KREC&CHEK своего заместителя, а сам приехал к нам… Неожиданно и очень радостно. Во время концерта находила его взглядом в толпе, и было мне так хорошо от этого! Ещё я познакомилась с одной из своих подруг по переписке: она подарила мне маленького золотого львёнка на шею. Типа на 8е марта… Тоже – с ума сойти как приятно )\nПотом, как обычно, менеджер превратил нашу жизнь в праздник. Накупил кучу еды и выпивки для тех, кто пьёт (половина Alai Oli постится, а я – не пью вообще), у нас на Мамина Сибиряка собралась огромная компания, я приготовила макароны по-флотски, Костю напоили водкой. Все кричали «ПЕЙ! ПЕЙ! ПЕЙ!» и наливали рюмку за рюмкой. Наш московский хэдлайнер Игорь тоже нормально принял на грудь ) Потом все отправились в Квартиру. Я оставила Бро ответственным за москвича и свалила домой.\nВ воскресенье мы с нашим менеджером и его девушкой Катей отправились кататься на Ежовую. Ещё с нами поехал Паша. Он вообще все эти дни «тусовался». Ходил на своих двух ногах, ожидая, что после выходных его положат в больницу, и всё-таки сделают операцию.\nПозвонил Бро. Рассказал, что еле донёс Игоря до поезда в Омск. Потом, уже из Омска Игорь написал: «Тут меня тоже не встретили. На вокзале мне дали по почкам и отобрали все вещи. А гитара у вас?». Гитару, как выяснилось позже, Бро положил на полку в поезде. Пакурям, гитара! Ну, о приключениях Парня из Африки на гастролях можно написать отдельный пост, или целый иронический детектив в стиле Дарьи Донцовой. Не мой стайл.\n***\nВ понедельник Паше сказали, что надо ехать в Челябинск и делать операцию по месту прописки. Во вторник он приехал в Челябинск, где ему сказали: «Ну ты, чувак, даёшь… Тусуешься, а у тебя всё это время позвонок проседает и разрушается!». Потыкали указкой в снимки МРТ, чтобы Паша понял: где осколки позвонка, а где – спинной мозг, И ещё популярно объяснили, что будет, если осколки и спинной мозг встретятся – ноги откажут и всё в этом роде. А если не сделать операцию прямо сейчас (130 тысяч), то всё будет плохо.\nНа следующий день Паша вернулся в Екатеринбург, и я позвонила Жене Ройзману. Если почитать его ЖЖ можно понять ход моих мыслей – я не могу даже представить, кого ещё я могла попросить о помощи. Изначально, просьба была такая – позвонить глав. Врачу 36ой больницы (там сказали – операция стоит всего 30 тысяч!) и попросить его, чтобы хирурги починили неместного Пашу. Если позвоню я – меня пошлют куда подальше, сами понимаете. А если позвонит Ройзман, его как минимум послушают, и он успеет сказать что Паша – многократный чемпион России по маунтинборду, плюс ещё вице-чемпион мира, и вообще – не последний человек в экстримальном спорте.\nДва дня Женя нянчился с нами, обзванивал врачей, мы пробовали сделать Паше временную прописку и страховой полис – но всё это слишком растягивалось по времени, а тянуть было уже нельзя. В пятницу мы снова съездили с утра на Компрессорный в 36ую, а потом Женя договорился с Институтом травматологии, мы приехали туда и Пашу, наконец, оформили. Без полиса и паспорта. В отличную одноместную палату с холодильником(!!). И отпустили на выходные домой, потому что в понедельник – все анализы, а операция – только во вторник.\n***\nЕщё приехал Михей – учитель йоги. Мы со Здоми занимались у него, когда были на ГОА. И Здоми организовал ему семинар. Два дня – четыре занятия. Хорошо, конечно, но в Индии мне нравилось больше…\n***\nВ понедельник я ходила на «Амиго», куда меня позвала Саша Чичканова – помощник режиссера Коляды-театра. Она сказала, что именно этот спектакль по настроению схож с моим творчеством. И знаете – да… Плакать и улыбаться.\nРазговаривали с ней потом в коридоре – я всякие истории про себя рассказывала. Актёры уходили домой, проходя мимо нас – прощались с Сашей. Поймала себя на том, что я многих из них знаю по именам. А Ягодина я раньше даже и представить не могла в амплуа гениального актёра – хоть мы и были знакомы: с Курарой мы нередко оказывались на одной сцене, а вот в театр этот я как-то не попадала.\nПотом за мной пришла Юля и мы пошли домойс. Просыпаюсь рядом с лучшим другом – и весь день потом хожу заряженная. А ещё лучше – весь день не расставаться. Раньше мы с Юю всё-всё делали вместе, а сейчас – стали ещё ближе. И никакие расстояния нас не смогут разделить. И никакие временные промежутки. Слышишь, Юль..? Я люблю тебя.\n***\nОчень много хороших новостей.\n«… записывать альбомы, снимать клипы.. Смотри: перед нами все двери сейчас открыты» (с) Крэк",
    "final_title": "(no title)\n\nТут очень высокие потолки… Высокие потолки и обшрапанные стены, а ещ...",

    "path": "data/lj_export_clean/posts_md/72404__sattamassagana_ch3_-_мексика.md",

    "filename": "72404__sattamassagana_ch3_-_мексика",
    "full_content": "SATTAMASSAGANA ch3 - Мексика.\n\nТы просишь меня рассказать тебе про Мексику, мой маленький? Знаешь, знаешь о чем просить.\nНа самом деле здесь все гораздо хитрее, чем ты можешь себе представить. И каждая краска в этой картине имеет свою историю.\nЗдесь переплелось множество нитей из моей жизни. И твоя.\nС чего начнем? Может быть с мескалина?  Мне было лет 14, я возвращалась из ночных рейдов по клубам еще в таком воздушном, розовом кайфе без отходняков, который бывает только в самом начале.\nИ вот, когда город только просыпался – светлым и тихим воскресным утром я  включала гоа-транс и читала Кастанеду. Тогда его мескалиновые трипы под руководством Дона Хуана вызывали во мне острые приступы зависти,  я выкуривала кропаль плана с фольги и меня отпускало.\nПотом было много много много много всего, много лет, наполненных событиями. В числе прочего – несколько лет на ботанике, «золотой век» - начало нашей дружбы, нашей семьи – Наташа, ее братья и сестры, мама, ее огромная квартира –и мне в этой семье нашлось место… Мои странные болезни – одна за другой, и все все все градации физической боли, которые я проживала – и погружалась в такие глубины реальности…. Вы даже не можете представить себе, что может вынести человеческий мозг.\nСовсем не наркотики сделали меня тем, кто я есть. Совсем не желание доказать врагам и родителям, что я могу. Только лишь эта физическая боль, растянувшая минуты до бесконечности, то место, где я всегда была одна – и никто не мог разделить со мной это.\nБоря (младший брат Наташи) очень заботился обо мне. В шкафу-гроубоксе у нас в комнате росло несколько кустов самых прущих сортов саттивы, и когда у меня в глазах совсем темнело от боли, Боря срывал для меня несколько листочков и сушил их утюгом. Я выкуривала колпачок свежей травки с ягодным ароматом, и боль немного отступала. Не зря раковым больным в Америке прописывают это, как лекарство. Ни одно обезболивающее не облегчало моих страданий в то время, а вот травка немного помогала.  Кстати, после этого я уже не могла курить дурь для удовольствия или от скуки. Из всех наркотиков первой меня оставил этот – возможно мой мозг связывал травку и эту боль, и  не хотела больше ничего, что было с ней связано.\nТам, в той комнате, в той кровати со мной происходили самые сакральные вещи. Под одеялом под всеми толщами земли в самой горячей точке ада в самой ледяной точке ада в самой острой точке ада в самой в самой беспощадной точке ада  – он ложился рядом, обнимал меня и мне становилось чуточку легче. И это «чуточку» - это по энергоемкости как вся йога, сделаная мной за всю мою жизнь, как все творчество, как все все все…. На самом деле «чуточку» - это может быть очень много.\nЯ никогда не говорила ему, как я благодарна – слишком тесны для этого слова…   Да и не понять никому, кроме меня.\nПрошли еще месяцы, сложились в годы… Вы смотрели фильм «искусственный разум» про маленького мальчика-робота? Так вот, моя реальность тоже была пустынна и залита водой, затоплена на многие миллиарды километров – и я была на самом самом дне.  Прошлое оставалось в прошлом, я даже и не вспоминала обо всех этих вещах, и совсем другое казалось мне важным.\nИ вот тогда мы с мескалином встретились.  Я и Щекалев  искали хоть-какой-нибудь наркоты, но чтобы этим нельзя было ширяться и это нельзя было бы нюхать, потому что мы старались перестать торчать)  гы гы гы. И вот один нащ друг нашел некое количество «волшебного вещества» из моего кастанедовского детства.\nОни (наши друзья) попробовали его, но ничего особенного не произошло.  Про нас такого сказать нельзя… Не буду устраивать тут трип репорт. Не могу даже.\nЯ открыла глаза, и обнаружила себя на ботанике, в той самой комнате. Мы с Наташей не общались долгое время, и по этому мое нахождение в этой комнате было пиздец каким странным фактом. И у меня было множество мест, куда я могла пойти. Почему я пошла туда???? И в тот момент до меня дошло.  Я лежала на ТОЙ САМОЙ кровати, и… и вокруг меня были обои… обои со светящимися в темноте звездочками. Такие же обои были теперь у меня в комнате.. я из сотен вариантов обоев выбрала именно эти… Бессознательно…  Те же самые обои!!!\nЯ так долго не помнила кто я и где мой дом. И где то место, где меня протащило  по всем кругам ада, и где те люди, которые любили меня тогда, когда я была никому не нужной развалиной… Место, где я умерла первый раз и родилась заново.  Это было здесь.  Гроубокс стоял заброшеным, Боря уже давно жил в Москве…\nЯ вышла из дома на летний бульвар района моей мечты и больше никогда не забывала кто я и где мой дом. Больше никогда не забывала.\n«Я выхожу за дверь,\nВ джунгли Ботаники.\nЧерез двадцать лет эта аллея будет тенистой…\nИ я буду всегда любить тебя, мой маленький.\nНо так, чтобы мы оба не падали вниз.»\nВот, это было про одну строчку…  «Мне бы мескалина, и я доберусь до дома…»\nТак и за многими фразами и образами в песнях скрывается очень много…\n«Здесь у хижины моей кактусы считают на небе звездные точки…Та, другая страна спит под белым покрывалом каждую ночь»\nЯ бывала в очень красивых и энергитически-сильных местах,  я встречала много людей, которые хотели там остаться.  В моей жизни бывали такие моменты – любой бы хотел оказаться на моем месте… Но я в тот момент хотела быть в другом.\nТак и бабки, красота и слава не имеют значения – они бесполезны в тот момент, когда тебе просто хочется уткнуться в шею кому-то за десятки тысяч километров от тебя… И воспоминание о счастье как бесконечная тоска вливается в сердце, побеждая теплый южный воздух,  крики чаек и кокаиновый флер.\nЯ не могу себя наебать. Я всегда буду хотеть к тем, с кем мне было хорошо. И это всегда воспоминание о прошлой жизни, в которую уже никогда не вернуться. Ни за какие деньги… В том консульстве выдают только одну визу на целую жизнь.\nТеперь ты знаешь, что нужно делать, мой маленький.  Только нужно ли? Счастье неуловимо и никому не нужно, вся соль в погоне за ним.. И наша бесконечная драма вполне вписывается в эту концепцию, пока будет она – будут новые песни.",
    "final_title": "SATTAMASSAGANA: Мексика",
    "final_annotation": "Глава о Мексике и человеке, связанном с этим местом. Воспоминания о событиях, которые изменили жизнь. О географии души, где каждое место связано с людьми и чувствами. История о том, как страны и города становятся частью личной мифологии.",

    "full_content": "Обо всём на свете!\n\nТри месяца абсолютно трезвого сознания.  Никак не могу перестать считать, для меня каждый такой день праздник. Помню, три месяца назад мне Игорь (Парень из Африки), писал по аське: \"Я молился, чтобы ты ничего не употребляла..\" Тогда я подумала что он - настоящий друг.\n***\nСтолько всего происходит - каждый день наполнен событиями и передвижениями. Последнюю неделю мне срывало крышу по моему велосипеду, и даже при наличии автомобиля под окном я не могла заставить себя выйти на улицу без байка. В хорошую погоду сидеть в машине и жать на педали мне кажется каким-то маразмом, гораздо круче гонять на 20inches bmx по сухому асфальту - летать, перепрыгивая всякие препятствия, запрыгивать на бортики, прыгать дропы... На машине каждый дурак может, а вот баннихоп прыгать - 'это вам не сцепление плавно отпускать.\nОднако, всё не так просто. Пару дней назад на велике попала под ливень. У Ашана... Пока доехала до дома, у меня ни осталось ни одного сухого пятнышка на одежде, плюс ещё грязевая ванна из-под заднего колеса... С таким удовольствием дома переоделась в сухую и тёплую кишку и поехала на машине в Коляда-театр. В тот вечер там читали пьесу \"Фронтовичка\". В очередной раз чувствую себя так, будто мне повезло прикоснуться к чуду.\nГоняла в Тагил поддержать друга, он открыл там группу NA, что это - можете прочитать\nздесь\n, например\nЧерез несколько дней уезжаем в Питер на неделю. Будет несколько концертов, съёмки видео, фотосессии - мы берём с собой нашего официального фотографа Сергея Никифорова, организаторы даже спонсируют его трансфер, так что Жёлтый теперь совсем как член группы.. Будет снимать не только нас, но и Крека с Чеком и крутого Dj Tonetrack, с ними мы последний раз тусили на квартире нашего (Боже, храни..) Менеджера в Москве.\nВ Питер я собралась ехать автостопом. Благо, погода позволяет. Но наш непостижимо прекрасный Артём сказал: \"Никаких автостопов! Если с тобой что-нибудь случится, мы влетим на бабки!\". Вот такое скоцтво, представляете?! НЕ \"как я буду жить без тебя, родная?!\" и даже не \"Я волнуюсь, что ты не напишешь ещё столько прекрасных песен...!\". Хрен, блин!!! А я каждые пол часа его фотографию тряпочкой протираю, чтобы не запылилась..! О, эта агония неразделённой любви!\nВ Питере мы снова будем жить в той оргоменной хате, где джакузи, водяной матрас и много комнат. Ещё из Москвы на наш концерт собираются несколько тусовок. В числе прочих - Михей\nracoonscrew\n, наш со Здоми учитель йоги из freeflow yoga центра в Индии.\n16 мая придётся вернутся, буду в жюри на\nTeleRock Шоу\n***\nПришла ко мне новая песня -  \"Дельфины\", очень она мне нравится.. Если с Димой постараемся, то сыграем её в акустике в Питере. Не могу не поделится парой строчек из неё.\n\" Помоги мне забыть о дельфинах,\nЛуна отражается в их мокрых спинах.\nНаписала моё имя на стекле. Напротив окна\nЯ каждую ночь просыпаюсь одна.\nВ моём городе нет моря,\nНо куда бы я не шла - моё море со мной.\nпросыпаюсь под нежные звуки прибоя...\n...ах, какая у них нежная кожа,\n...какие там на дне звёзды и крабы\nПобудь ещё немного моим другом,\nПобудь ещё хотя бы в мыслях моих рядом\nЯ не умею дышать под водой.\nСкажи, как мне унять боль?\nСкажу Borron Y Cuento Nuevo\nКогда море придёт за мной.\"",

    "filename": "2025-01-12__1189__одна_практика_лешей_тантре_показала_силу_даосских",
    "full_content": "2025-01-12 — одна практика лешей тантре показала силу даосских\n\nОдна практика с Лешей на тантре показала мне силу даосских практик, партнер с таким опытом может тебе показать другой уровень чувствительности энергетической. Первая же групповая терапия с Юлей показала, насколько ультра-честность и смелость могут изменить все групповое пространство. Юля научила меня, как работать у Куприянова, и я с тех пор всегда пользуюсь ее опытом. Ну и как пара они - просто космос. Они были вместе, потом расходились, и вот когда встретились после расставания и решили быть вместе - там конечно такое ощущение power couple что не рассказать в тексте, это надо видеть. И мне было классно погреться рядом с ними в этой любви и в кругу их близких друзей.\n\nОткрытие поездки - это сестра Юли, Кристина. Мне было очень хорошо с ней, мы занимались йогой, болтали и вообще ощущалось, что так может продолжаться очень очень долго. И то, что я увожу с собой, что любящая вселенная всегда найдет в любой точке мира человека самой тонкой материи, чтобы прикоснуться ко мне своей любящей рукой, и я не буду чувствовать себя одиноко. С Кристиной я чувствовала, что сама вселенная говорит мне, что я прекрасна, и я любуюсь ей в ответ.\n\nВ ретритном центре ко мне подошло несколько девушек. Одна - доктор восточной медицины, она приехала учится у мастера Монтека Чиа, и знает обо мне от своей пациентки, при этом она сказала, что моего мужчину зовут Педро. Я посмеялась, что он сделал меня более популярной)). Вторая девушка знала меня по ретритам Пемы, она в команде Пемы одна из «хэлперов». Спросила, будем ли мы делать новый ретрит, и я ей сказала что Пема как раз написала нам утром по поводу наших дат - ждем окончательного согласования, чтобы начать процесс подготовки длинной почти в 9 месяцев.\n\nпро движение:\n\nМного ходила пешком\nсделала 2 тренировки Soft/super power и у меня болят ягодички.\nс Кристиной несколько классных крий кундалини йоги и поняла, чем буду заниматься, пока мои тазобедренные суставы отдыхают от flow практик. Кундалини отлично дает йогическое состояние.\n\nПоследний час последнего перелета слушаю подкаст про дофамин, очень рекомендую всем, кому хочется разобраться в зависимом поведении.\n\nИнтересно послушать, у кого какой drug of choice, расскажу немного про мои:\n\nв наркотиках я всегда предпочитала стимуляторы, видимо, это было self-medication от сдвг, давало мне возможность сосредоточится\n\nСигареты (которые я уже не курю) и кофе (которого я все еще потребляю много) это для меня про успокоение/заземление\n\nВ интернете мой наркотик - это комментарии. Причем я тут вспоминаю раннее время, когда меня никто не знал, я писала на разных форумах, писала рассказы «креативы» и мечтала, чтобы кто-то прочитал и написал мне ответ, отрефлексировал, то есть мой самый вкусный дофаминчик направлен на достижение глубоких резонирующих (при этом не обязательно хвалебных) ответов. И я не залипаю на видосах в интернете, но я могу обновлять соц.сети чтобы прочитать директ и комментарии. И собственно произвожу разный контент и смотрю на него отклик.\n\nВ еде наркотические тенденции были только тогда, когда были ограничения. Я торчала на мороженом и особенно его хотела и особенно от него кайфовала, и его надо было заслужить. Потом когда его стало можно всегда, и я наелась его вдоволь, и отношение стало ровное.\n\nНо конечно главное мое достижение, которым я горжусь - добываю ежедневно дофамин, как советует доктор Лембке - в разнообразном движении. Очень важно встать с дивана и начать двигаться. Ну и благодаря моему СДВГ мы в секте создаем продукт для мне подобных, без однообразия, эффективно расходующий время и силы и тд и тп.\n\nТеперь, когда вы знаете мой главный торч - вы знаете, как сделать мне больно)) Просто НЕ писать комментарии а ставить эти бесполезные реакции. Но мне правда интересно, кто из моих читателей на чем торчит.\n\nLinks:\n-",

    "full_content": "2025-02-26 — достаточно продуктивное настроение вообще все успеваю последнего\n\nУ меня достаточно продуктивное настроение и я вообще все успеваю. Из последнего - практикую больше времени одна. Но не в плане совсем одна, а скорее без самых близких. И с Димой, и Вадимом у нас есть тенденция залипать в общение в нашем баббле. Например, часто интереснее поесть вдвоем/втроем, обсудить что-то уязвимое или рабочее. И вроде много людей вокруг на бали классных, и друзей, и знакомых интересных, но так хорошо не удается пообщаться.\n\nИ вот последние 2 дня я одна гоняю на серф, пока еду на байке слушаю Марка Гафни «unique self» - книга просто подарок для смены фокуса взгляда на себя. Я часто читаю, что людям не хватает энергии, смелости жить, много осуждения и страха. С этим работает интегральный подход в терапии - ты находишь, как именно ты вставляешь палки себе в колеса и перестаешь это делать. Чем больше я слушаю - тем больше у меня понимания как именно я пришла в эту точку моей жизни. Смелость, вера, честность с собой и с другими, желание проживать себя настоящую, а не идеальную - все это как-то вырабатывалось по пути.\n\nТо есть мое юник селф мне говорило: тебе нельзя ничего употреблять и никак менять сознание, но мои ранки и уникальные шрамы - это боль и чувствительность, и как с ними найти способ проживать это без веществ и анастезии? Я не знаю ответа но я ищу - группы зависимых, шаги, годы попыток и вот получилось. Так же и с работой: «я хочу своей работой приносить пользу» - я не знала как, и часто казалось что вот группа - она даже больше людей раздражает, чем радует. Разве тут я реализую свою миссию?\n\nНу и конечно говно говнишечко родное. Зависть, ревность, осуждение, злорадство - смотреть в себя честно неприятно. Хочется всячески оправдывать себя или говорить: «о нет конечно я это не чувствую или вообще не иду туда» но вот последние годы терапии мы смотрели в темноту и присваивали себе все, и она стала менее деструктивной - когда ты достаешь это из тени, оно перестает тобой владеть, освобождается много энергии.\n “a good rule of life might be: self-acknowledged assholes are easier and more fun to hang out with than assholes in denial.”\n\nПоэтому я советую всем этот путь - если не терапию, то почитать книгу или даже книги из\nсписка литературы Куприянова, он дает нам много всего, но тут мы поделились мини-версией. Если есть проблема и чувствуете что не живете свою жизнь на полную - это надо решать!\n\nУ меня точно есть чувство что я живу свою жизнь, где-то ебанутую, нелогичную, но точно не редактирую ее под правила и под то, что скажут люди. И вот на этом этапе у меня очень прикольное чувство, что меня в этом любят и поддерживают родители - в том числе бабушка с дедушкой, самые близкие любимые люди и мои дети. Это как будто тоже хороший маячок. Я думаю, что я бы не смогла идти против близких, но вот как это получается что ты можешь себя всего принести близким и дать им себя полюбить до глубин внутренней тьмы? Это результат труда? Если да - то какого именно?\n\nТак, я вообще рассказывала о том, что я делаю одна) Так вот, завтракаю обедаю болтаю со всеми, созваниваюсь с родными, серфлю, тренируюсь, учусь стоять на руках, готовлю ADHD коворкинг, продолжаю обустраивать дом и отдыхать в нем. Осталась неделя на Бали, и мне даже нравится уезжать приезжать, как-то ярче тут все, когда возвращается. Чувство дома очень хорошее.\n\nLinks:\n-",

    "filename": "2022-09-10__164__две_реальности_сливаются_одну_сижу_спонтанном_бизнесе",
    "full_content": "2022-09-10 — две реальности сливаются одну сижу спонтанном бизнесе\n*From*: Вы все живёте неправильно\n\nДве реальности сливаются в одну. Там я сижу в спонтанном бизнесе LA - Москва, который ты взял мне за 10 часов до вылета, когда я еще была Сан Фран. Это как вылет из Москвы, когда ты допустим сидишь и завтракаешь в «Мечтателях» на Фонтанке в Питере. Но я тогда успела. Мой сосед весь полет удивляется, как можно плакать десять часов подряд. Гора салфеток и полная невозможность заснуть не смотря на такое удобное кресло, раскладывающееся в кровать. В этой реальности я никуда не спешила, потому что до Звартноца от дома всего 20 минут, мы поужинали, и я просто села в такси. И бизнес, конечно, тут стоит не такой космос. Сто лет себя не баловала сама, а тут захотелось.\n\nВ этой реальности я просыпаюсь на посадке, уши заложило, и я сквозь сон я продуваю их, как фридайвер, опускаясь все ниже и ниже в глубину. В той реальности я считаю минуты до посадки. Мое сердце давно так не стучало. И я выбегаю из самолета одной из первых, чтобы быстрее успеть на паспортный. У меня нет багажа, только коврик и рюкзак. Самолетная кишка обдаёт ноябрьским холодом, и выходя из неё я ныряю в поток людей - никогда не спящий Шарик принимает каждый час десятки рейсов Аэрофлота - и лавируя в пестро-чемоданной толпе, текущей по коридору, я привычно стараюсь угадать - откуда этот рейс. Гоа? Дубаи? Париж? Хельсинки?\n\nВ этой реальности меня так же обдаёт холодом, но теперь коридор пуст. Наш единственный рейс Ереван - Москва выпускает в просторную белизну аэропорта тонкую чернильную струйку пассажиров. Ни людей, ни очередей. У меня так же нет багажа, и «в Москве опять никто не встречает».\n\nТам вокруг багажных лент стоят плотные ряды ожидающих, кто-то везёт тележки и чемоданы к выходу на таможню. Я радостно миную этот этап, но на таможне меня тормозят и заставляют выпотрошить мой белый рюкзак SHU, так плотно забитый вещами, что я недовольно ворчу. - И как потом все это обратно засовывать?\n\nМои красные заплаканные глаза и нервный вид? Так хорошо пристрелен взгляд у работницы Шереметьево, но в этот раз - мимо, дело совсем в другом. И меня отпускают.\n\nТолпе приезжающих - толпа встречающих, и я помню эту зеленую стену у эскалатора, именно этот выход, только теперь все пустое, как будто Титаник из моих воспоминаний, но уже без людей, и весь заполненный водой. И там, в моих воспоминаниях ты встречаешь меня во всем чёрном и в маске, и я смотрю вниз, как мои кроссовки наступают с блестящего керамогранита на дорожку эскалатора, которая вырастает в ступени, ведущие вверх.\n\nТам я уже не плачу, потому что нечем. Зато здесь.. Каким же другим был мир, и это все вокруг, и зачем же они все это сделали. В той реальности я еще не знаю, какой нам уготован путь. И в этой реальности тоже не знаю. Просто ты - это последнее, что я любила в Москве. Поэтому так ярко запечаталось все это воспоминания, и я, если честно, не хочу забывать.",

    "path": "data/vi_vse_nepr_export/posts_md/2020-11-18__98__каталась_велосипеде_горы_огромными_камнями_приходила_домой.md",
    "source": "Vi Vse Nepr",
    "filename": "2020-11-18__98__каталась_велосипеде_горы_огромными_камнями_приходила_домой",
    "full_content": "2020-11-18 — каталась велосипеде горы огромными камнями приходила домой\n\nЯ каталась на велосипеде с горы с огромными камнями, приходила домой с ободранными коленками, придумывала «мороженное» из жимолости и ревня. Сначала ревень надо было аккуратно очистить, вуаля - и можно наслаждаться. С жимолостью было сложнее: откусить верхнюю часть ягоды, аккуратно выдавить содержимое через дырочку, облизывать, как эскимо. Потом съесть кожурку от ягоды - как вафельный стаканчик от рожка. Жимолость и ревень до сих пор мои любимые дачные продукты.\n\nДачным праздником для меня были поездки на рынок «Арамильский привоз» - там была сокровищница всякой бесполезной фигни, пластмассовых игрушек - я помню, что бабушка все покупала, но приходилось выпрашивать. Дедушка вел машину, а бабушка всегда комментировала, «командовала», как у нас это называлось. Папа постоянно говорил, что она - как героиня Фаины Раневской «Муля, не нервируй меня!» - и правда, очень похожа.\n\nПо пути с «Привоза» обратно на дачу я выискивала глазами цыган с табунами лошадей. И сильно-сильно загадывала желание, чтобы у меня тоже случился свой цыган и обязательно с конями.\n\nДача - это Лев Кассиль. «Кондуит и швамбрания», «Будьте готовы, ваше высочество!», его книги про войну и мальчишек. Я зачитывалась, и забывала о далеком желанном городе, о дворе. Дача становилась моим миром: особенно пыльный второй этаж, на который так редко ступала чья-то нога.\n\nОднажды мы с соседкой Оксаной играли в королев. По очереди мы сидели на стремянке и «повелевали». Я первый раз в жизни услышала щелчок в голове: «О, это максимально моё». В тот же момент мне стало смешно: королевой в этой жизни мне точно не светит стать.\n\nЕще однажды я играла топором. Изо всех сил размахивалась и втыкала в поленницу. И вот, как в замедленом кино я вижу, как топор летит в моё колено: я уже понимала, что будет страшное количество кровищи и ужасная боль, и знала, что у меня есть немного времени болевого шока - совсем недавно я ободралась на велосипеде, но боль пришла не сразу - я знала, что так будет и здесь, но последствия топора в колене будут серьезнее.\n\nА потом как будто произошла монтажная склейка: я стою, топор в руке и колено абсолютно целое.\n\n - Ого. - подумала я. В очередной раз я знала, что это не та история, которую можно рассказать, и которой поверят - но я в этот момент твердо поверила, что меня защищают какие-то высшие силы, и нельзя этим злоупотреблять. Всю жизнь я буду отмечать про себя эти моменты и всегда буду благодарить высшие силы, защищающие меня, за те моменты, когда они отвели от меня беду. И в тот момент я положила топор и пошла в дом.\n\nБабушка любила меня и старалась контролировать кажжый мой шаг и пугать меня опасностями, которые подстерегают меня на каждом шагу, а мне очень хотелось личного пространства и свободы. Проходили недели, и я начинала ужасно скучать по папе - он ассоциировался у меня со свободой, с тайнами ночного города, с какими-то интересными взрослыми тусовками, которые манили меня. Я сидела у телефона и ждала звонка, а потом, когда папа должен был приехать, я могла провести у окна весь день, мечтая, чтобы следующая машина оказалась нашей. И вот, я прыгала на заднее сидение, и машина везла меня в мой мир. Какой он? Изменился ли он? Существует ли он до сих пор, или все изменилось за ту вечность, которую я провела на даче?\n\nЯ не помню, в какой момент я поняла, что я влюбилась. Но я помню лето, свою кровать на Фрунзе 62, двор, который вдруг стал ощущаться по-особенному. Моя компания, к которой я тянулась, наше время вместе - все стало тягучим, как карамель. Мысли стали такими щекочущими, мир постепенно менялся - одинокая качель во дворе, скамейки, кусты вокруг дома напротив - все наполнялось этой упругой энергетикой нового чувства, и я не могла понять, откуда оно исходит и куда направленно.",
    "final_title": "Сначала ревень надо было аккуратно очистить, вуаля - и можно наслаждаться",

    "path": "data/vi_vse_nepr_export/posts_md/2024-01-31__236__переслушивала_последний_ушедших_берегу_океана_пока_ждала.md",
    "source": "Vi Vse Nepr",
    "filename": "2024-01-31__236__переслушивала_последний_ушедших_берегу_океана_пока_ждала",
    "full_content": "2024-01-31 — переслушивала последний ушедших берегу океана пока ждала\n\nЯ переслушивала «Последний из ушедших» на берегу океана, пока ждала человека, благодаря которому появились эти песни.\n\nПрошло уже больше двух лет с этих первых моментов, но всегда именно их я вспоминаю с особенной нежностью. И в какой то бесконечной отсылке к прошлому есть ожидание, предвкушение новой встречи. Раньше оно просыпалось во мне тревогой, страхом перед танцующей Дурге, которая на этом вайбе готова разрушить все. Но последний цикл - это было что-то другое. Теперь ожидание нового живет во мне спокойным океанов в ожидании свелла, который, как надо помнить, тоже пройдёт.\n\n«Чёрный лебедь» которого я читала в московском метро, написанный языком и на примерах для финансистов, экономистов и политиков, рассказывал мне другую историю, и классик Адиль Оралбекович выразил эту мысль максимально емко:\n\n«никогда не знаешь что произойдет».\n\nКажется, что все скатывается в одно и то же говно. Но нет. Иногда все может пойти по неожиданно охуенному сценарию. Тогда, в московском метро, я прочитала мысль Талеба именно так. И в этой ситуации работа над собой - и духовная, и физическая, это очень rewarding process. Если все станет хуже, хотя бы ты в этом станешь сильнее и крепче духом. Это поможет тебе выстоять в испытаниях, если все вдруг станет хуже, чем сейчас. А если вдруг станет лучше - штош, значит станет лучше по всем фронтам.\n\nЭто я к чему? К тому, что в ожидании своего чёрного лебедя я не сидела на месте, это как рыть тоннель с двух сторон. Я была готова к этому, и все вокруг меня было готово.\n\nКогда ты входишь в жизнь значимого для тебя человека, ты сначала можешь не отстреливать все, что происходит. Мы каждый день узнаём новых людей, иногда, как в “Everything Everywhere All at Once” у меня перед глазами пролетает целая жизнь, в которой этот человек становится мне родным. Иногда так и происходит, но чаще - нет. Поэтому я дропаю все, что мне шепчет интуиция, и просто иду дальше.\n\nНо потом, когда проходит время и что-то проходит испытания им, все, что происходит после и вокруг оказывается менее ярким и значимым, ты понимаешь всю сакральность тех моментов. Ты возвращается в памяти к каждому из них и помещаешь эти воспоминания в сияющую рамку на стенах внутреннего храма. Как хорошо, что у меня для этого есть песни. «Для меня нет ничего слаще текста, потому что текст остаётся»\n\nНе все удаётся уместить в них. Как например я захожу в этот дом первый раз. Эти воспоминания в слоумо, всегда превращаются немного в мультик. Я захожу в ванну, там есть стена-перегородка, отделанная кафелем, чуть выше плеча - и вся она заставлена маленькими бутылочками с аромамаслами. Мне нравится этот запах. И всегда даже такая маленькая часть реальности распадается у меня на атомы. Как много девушек так же входили сюда? Чувствовали этот запах? Смотрели на себя в это зеркало?\n\n(Продолжение для тех кто любит Лонг Лонг риды и отсылки к отсылкам)\n\nLinks:\n- \n-",
    "final_title": "Прошло уже больше двух лет с этих первых моментов, но всегда именно их я вспомин...",
    "final_annotation": "Прошло уже больше двух лет с этих первых моментов, но всегда именно их я вспоминаю с особенной нежностью. И в какой то бесконечной отсылке к прошлому есть ожидание, предвкушение новой встречи. Раньше оно просыпалось во мне тревогой, страхом перед танцующей Дурге, которая на этом вайбе готова разрушить все.",

    "filename": "2024-11-10__253__смотрю_свои_руки_сначала_тыльные_стороны_потом",
    "full_content": "2024-11-10 — смотрю свои руки сначала тыльные стороны потом\n*From*: Вы все живёте неправильно\n\nЯ смотрю на свои руки. Сначала на тыльные стороны, потом на ладони. Отношу их ближе и дальше. Потом снимаю кольцо с пальца, тянусь вперед, я сижу на коленях и мое движение похоже на поклон. Я кладу кольцо на середину матраса.\n\nЭтот теплый приглушенный свет в Лагаре, музыка из плейлиста Пемы, но какая-то не та песня. Я не люблю такие. Эта песня кажется специально подобрана для «соблазнительного танца». Из какой энергии вы соблазняете? Из какого состояния? Я вижу боковым зрением движения бедрами, такие женственные кошачие движения. Я не умею так, я никогда так не делаю. Это не я.\n\nЯ снова поднимаю руки, смотрю на предплечья с одной и с другой стороны. Я снимаю браслет и аккуратно кладу его рядом с кольцом. Я снимаю подвеску с черным камнем и повторяю свой маленький ритуал. И вторую, которая с бисером и маской. Потом третью, которая Joser. Там надо повозиться с застежкой, и я сначала делаю бу губами: «it will take some time».\n\nЯ осматриваю свои руки и трогаю шею: больше ничего нет. Оглядываю себя. Ну что ж, время футболки. Я вздыхаю и стягиваю ее через голову, аккуратно складываю и отправляю туда, где лежат остальные предметы. Я помню, как нам отдавали украшения Тани. Ее сережки и кольца. У Хаула было много разных амулетов на стенах. Каждый имел свой особенный заряд. Мои подвески даже больше часть меня, и сейчас они лежат рядом с футболкой, я смотрю на них там, и на меня тут и чувствую такую уязвимость. Как будто это место - алтарь, на который я приношу частички себя, такие маленькие и такие важные. Я поднимаю глаза и смотрю на него.\n\nТам внутри целый пантеон божеств и фантастических тварей, кто смотрит сейчас через мои глаза? Это не Дурге, которая всегда несет с собой высокомерную усмешку. Знаю ли я эту себя, которая сейчас смотрит? Тут есть вызов, но не такой вызов, как будто я зову поиграть. И не вызов на бой. Это просто я. Как в песне «Море и Небо». Там так точно было про этот вызов. Дерзкий вызов реальности.\n\nВ этот момент я осознаю свою тотальность во всем - свою хрупкость и силу, такую несовместимую с жизнью чувствительность и тем не менее способность выносить всю боль и красоту.\n\nЯ снимаю шорты, складываю их и кладу рядом с футболкой.\n\nЯ стою прямо, опустив руки. Мое тело - храм жизни, в нем горит маленький костер. Я чувствую его в самом центре живота. Я чувствую себя такой маленькой и такой выносливой. Я чувствую способность этого тела пропускать через себя и не разрушаться. Это тело подарило жизнь моим детям. Это тело умеет чувствовать такие тонкие прикосновения. Оно умеет танцевать, но не соблазнительные танцы. Только шаманские.\n\nЯ поворачиваюсь одним боком, потом другим. Потом спиной. Это я со всех сторон. Три дэ я. Маленькая девочка в огромном мире, которая делала очень смелые поступки и всегда шла только за своим сердцем. Я двигаюсь очень просто. Но в этих движениях что-то есть.\n\nЯ снимаю с себя все, что осталось и смотрю на себя. Кладу руки на грудь, потом делаю пунь пунь сосочкам. Я смеюсь. Я делаю несколько забавных движений.\n\n - Slowly calm down your movements and sit on the side of mattress - слышу я голос Пемы. И мое сознание отмечает идеальный тайминг моего «танца». Как всегда вовремя) Как же это у нас получается?\n\nВажна только моя практика. Мой танец. Мое проявление. Но бывают исключения из правил. Бывает, что на пути ты встречаешь что-то, что заставляет тебя остановить машину на обочине. Ты делаешь шаг, другой и лес зовет тебя. И ты идешь между деревьев и внезапно земля проваливается под тобой. Так я смотрю в глаза - там напротив меня сознание, и храм жизни, и тысячи историй. И я готова свидетельствовать его танец.",
    "final_title": "Йога и духовные практики",
    "final_annotation": "О йоге как способе познания себя и работы с телом. Размышления о том, как физическая практика меняет сознание и помогает справляться с внутренними демонами. История освоения практики и того, как она становится образом жизни и философией.",

    "path": "data/vi_vse_nepr_export/posts_md/2019-07-07__17__поездка_нас_была_классной_особенно_вчера_ночью.md",

    "full_content": "2019-07-07 — поездка нас была классной особенно вчера ночью\n*From*: Вы все живёте неправильно\n\nПоездка у нас была классной. Особенно вчера ночью. Мы встретили Женю и Влада на автостанции Валдай, они сели в машину и мне пришла в голову идея: надо, чтобы Влад рассказал о себе - мы все уже давно знакомы, а про него знаем только что то, что его Худстритфуд делает лучшие веганские фишроллы во всей галактике.\nНо чтобы все было органично, мы решили все по очереди рассказать о себе.\n\nИ вот про Лилю я узнала, что мама отпустила ее в питер благодаря гадалке, а ещё она пела гроулингом в рок-группе в Башкирии и мечтала стать робототехником, но ей не хватило баллов, что рекрутер в модельное агенство поймал ее на улице, и она объездила весь мир как модель, чтобы узнать что для модельного бизнеса у неё слишком длинные ноги.\n\nЖеня рассказывала про все свои увлечения и кружки, она была президентом школы и участвовала во всех возможных съездах типа «мы - будущее России» «дети за путина» «путин за детей», как она занималась реконструкцией, ирландскими танцами, играла в КВН, ЧГК, как работала в майонезе и как попала в секту, Вадимчик рассказывал, как делал бар VNVNC, задумывал его таким местом с вином и тонкой эстетикой, а получился чад кутежа на конюшне, как играл во всяких группах и почему больше не хочет этого делать, Влад рассказывал, как всю школу и универ занимался гандболом, и их команда занимала вторые места (а первые занимал мой универ - Лесгафта), как работал барменом в штакете, как учился готовить, как они открыли первую точку Худа и как они развивались, ну и мы с Шапо рассказали о себе - я так вообще могу бесконечно рассказывать, у меня миллион историй внутри одной.\n\n5 часов дороги прошли незаметно, я думала о том, какие классные люди со мной едут плыть по холоднючему озеру, и как здорово, что мы не бухаем и не торчим, и каждый занимается своим любимым делом: Шапо музыкой, Лиля чаем, Влад едой, Вадим гитарами, Женя - директор секты, а я - всего лишь окно в вечность.",
    "final_title": "Но чтобы все было органично, мы решили все по очереди рассказать о себе",
    "final_annotation": "2019-07-07 — поездка нас была классной особенно вчера ночью\n*From*: Вы все живёте неправильно\n\nПоездка у нас была классной. Но чтобы все было органично, мы решили все по очереди рассказать о себе.",

    "path": "data/vi_vse_nepr_export/posts_md/2021-10-02__133__могла_так_мной_говорить_так_будто_не.md",

    "filename": "2021-10-02__133__могла_так_мной_говорить_так_будто_не",
    "full_content": "2021-10-02 — могла так мной говорить так будто не\n\nОна могла так со мной говорить, так быть - как будто я не живу на земле, а живу только там, оттуда приходят тексты и образы. Она обращалась к моему бессознательному, к моему облаку, рядом с ней все мое существо разговаривало о самом главном, но смыслом были не слова, а все светящиеся потоки, которые лились вместе с символами и звуками. Мне казалось, что главное - этот процесс, и нет ничего важнее него, но все вокруг ловило отголоски этого состояния.\n\n ⁃ Так вот как ты написал свои лучшие треки. - думала я. - ну ничего, теперь эта муза и мне открыла маленький портальчик.\n\nМне казалось, что я нашла человека с одной планеты со мной, и как же приятно, когда есть в жизни хотя бы один собеседник, с которым ты говоришь на родном языке. И мне казалось, что я просто готова опуститься на колени и положить лоб на её ладони - и это будет лучшим выражением моего чувства. Она была такой женственной и плавной, по сравнению со мной - мне кажется, я железная банка с гвоздями и петардами, маленькая модель большого взрыва, и там же черная дыра и окно в холодный космос. А она - луна и млечный путь, и мне хотелось об нее успокаиваться. Эти ее длинные белые волосы… И в целом она часто говорила, что до Диего у нее были только девочки. А я ну вообще не по девочкам, 100% стрэйт, и от этого моя любовь к ней была такой чистой, и мне казалось, что как и другие дружеские отношения это останется со мной навсегда.\n\nНо то ли месть подается холодной, то ли… Короче, эта история в самом конце скрутит меня в такой узел, что я еще долго буду ходить в нее за вдохновением. Но конец не всегда так важен, как начало - поэтому Ману всегда вспоминает то, что было в начале. В начале были звезды над пустынным Абхазским пляжем и текст, который струится светом из самого сердца через пальцы к светящемуся экрану, и небытие пожирает прошлое и мир под тобой и за тобой, оставляет тебе только дорогу вперет и тянет тебя за твои же нити из света вперед, только вперед - и ты в очень мягком прогибе откидываешься в невесомости и просто паришь, и нет во вселенной ничего лучше.\n\nДля меня писать - это концентрированное счастье.",
    "final_title": "SATTAMASSAGANA: Фрида",
    "final_annotation": "Глава о Фриде - человеке, который читал мой блог и которому я могла писать как письма. История о встрече не вовремя, о красоте и харизме, которые не замечаешь, когда занята другим. Воспоминания о человеке, который стал важной частью истории, несмотря на неправильное время.",
