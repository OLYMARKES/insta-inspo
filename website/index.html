    "filename": "2021-04-22",
    "full_content": "По четвергам я пишу про зависимость.\n⠀\nСегодня дам небольшую вводную для новичков, которые часто пишут мне:\n⠀\n- Так от чего у вас зависимость?\n⠀\n15 лет назад я думала, что у меня проблемы с наркотиками. Я хотела завязать с ними, и оставить все остальное - косячок, бокал вина по вечерам, тусовки с текилой по выходным. В те моменты, когда я методом силы воли бросала употреблять, просыпалась моя булимия и я начинала напиваться гораздо чаще, чем хотелось - я не связывала все это воедино, пока не узнала, что зависимость всегда найдет лазейку, чтобы проявиться - и надо постоянно работать с ней, как будто у тебя диабет.\n⠀\nПотом я начала видеть, как мое зависимое поведение проявляется во всем - в дружбе, отношениях, в работе. Зависимость - это эгоцентризм, и как следствие - обидчивость, ранимость, сосредоточенность на своих чувствах, невозможность выходить из круговорота боли.\n⠀\nПросто трезвость не решала эти проблемы - я срывалась после года чистоты, после 2х лет чистоты, пока не поняла, что дело не в трезвости самой по себе а в том, что мне нужно разобраться в причинах.\n⠀\nТогда я начала письменную работу по программе «12 шагов» - изначально ее создали алкоголики, но она была адаптирована сначала для наркоманов, а потом - для многих других видов зависимости, да и вообще - для многих ситуаций, которые вроде бы не связаны с зависимостью. С 12 шагами люди переживают утрату, поддерживают себя в болезнях - короче, как в бойцовском клубе. Есть много групп, но суть не в группах а в письменной работе.\n⠀\nЯ пишу 12 шагов уже 9 лет, не тороплюсь, стараюсь прописать каждую мелочь, прожить каждый раздел. Сейчас я - в середине 11 шага. По сути - это просто ответы на вопросы из книги, я пишу свой опыт, примеры из жизни и потом обсуждаю со «спонсором» - это волонтер из программы, у которого опыта больше, чем у меня. Это бесплатно, анонимно и не требует много времени. Кажется, что это сложная работа, но сложно только начать: найти подходящее сообщество, спонсора и впрыгнуть в работу. Когда я допишу 12 шаг, я просто начну заново. Потому что суть в процессе, и нет конечной точки. Есть просто жизнь без желания самоуничтожится, и это - ценность. #12шагов_olymarkes",

    "path": "data/vi_vse_nepr_export/posts_md/2021-10-22__147__отличает_зависимых_людей_независимых_торчках_употребление_чего-то.md",
    "source": "Vi Vse Nepr",
    "filename": "2021-10-22__147__отличает_зависимых_людей_независимых_торчках_употребление_чего-то",
    "full_content": "2021-10-22 — отличает зависимых людей независимых торчках употребление чего-то\n\n… Это и отличает зависимых людей от независимых - в торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы.\n\nОстальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\n\nКогда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\n\nГоворят, что боль уходит.\n\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\n\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\n\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\n\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается момент расщепления «я»и ты случайно отделяешь себя от своего желания торчать.\n\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\n\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\n\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\n\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом.",

    "full_content": "По четвергам я пишу о своем зависимом поведении, и сегодня отвечу на частые вопросы.\n⠀\n❓О какой зависимости идет речь?\n⠀\nРаньше я разделяла на «от чего ты зависим», но потом я поняла, что в основе лежит один и тот же механизм.\n⠀\nС 12 лет я начала курить и курила без перерывов до 20 лет\nС 12 лет я употребляла легкие наркотики (ТГК) с различной периодичностью + регулярный алкоголь\n16-19 лет - редкие эксперименты с химией, в основном все - натурально, но зато очень регулярно. Галлюциногены, курительные - это все было частью моей жизни и я просто не считала это наркотиками.\n⠀\nС 20 лет я периодически употребляла, в т.ч. и внутривенно, но самой главной моей проблемой были нарушения пищевого поведения, булимия - все эти эпизоды чередовались с долгим временем «чистоты».\n⠀\nЯ боролась, я пыталась оставаться трезвой, и все равно периодически возвращалась к эпизодам употребления. С 20 лет я в программе 12 шагов, и это помогало мне поддерживать самые продолжительные периоды абсолютной трезвости. Когда я начала более активную часть программы с «написанием шагов» - у меня стали уходить и другие проявления компульсива: с отношениями, с деньгами, с едой. Чтобы проработать все письменные задания, я ездила в 12 шаговый ребцентр. То есть у меня была задача не просто прекратить употреблять (это я уже умела), но отойти далеко от этой границы, где я срываюсь, как начать жить качественно и реализовывать весь свой потенциал.\n⠀\nПоследний «срыв» у меня был 8,5 лет назад. До этого я оставалсь чистой 2 года. До этого - еще год. То есть не смотря на срывы, у меня было 99,9% чистых дней в отличие от моего тинейджерства, где таких дней было по пальцам пересчитать.\n⠀\n❓Мешает ли то, что я рассказываю о своей зависимости?\n⠀\nЯ открыта, ведь мой опыт может быть полезен другим людям. Это моя жизнь, мой путь проб и ошибок, и я не хочу его стесняться. Принимать себя со своим опытом - это тоже результат многолетней работы.\n⠀\nМногие из нас не совершенны, но это не значит, что мы должы перестать стремиться к лучшей жизни для себя. Зависимость - это огромная сила, которую ты направляешь на саморазрушение, и эту силу можно направить в другое русло. #12шагов_olymarkes",

    "full_content": "Transsiberian back2black\n\nMarkes: Тут все спят а я опять не могу\nD: Не можешь?\nD: Ножки крутит?\nMarkes: Крутит всё\nD: Ой\nD: Плохо\nD: Ты в поезде? Щас подумаю что можно сделать.\nD: Меня помню кумарило в поезде, как собаку. Хочешь расскажу?\nMarkes: Да )\nD: Ну, слушай\nЭто произошло, когда я в очередной раз решил соскочить с хмурого.\nСтепень одержимости была такой, что я даже обыскал дознувшегося на лестнице наркомана, совершенно мертвого и очень окоченелого.\nМной найден был шприц с раствором, который тот не успел себе ввести до конца (ибо содержимое представляло из себя смертельную смесь, которая убила его еще по пути к радостному приходу). Я сидел на лестнице рядом с мертвым телом и обдумывал перспективу помереть тут же.\n«Разум или безумие?» - конечно, желание вмазки проникло под кожу и зудело, словно впившийся клещ. Я вмазался из шприца только что покинувшего этот мир очередного неудачника. И...  Я не умер.\nДругой вопрос, что прикорнув на плече жмура, я был обнаружен своими знакомыми, которым ад наркомании был известен исключительно по фильмам с дебильным содержанием.\nМеня вознесли в квартиру и устроили импровизированный консилиум\nПродолжать?\nЛадно, у нас видимо односторонняя связь, ибо в таежной глуши, где следует твой поезд, лампочка Ильича и первое радио появятся лет через сорок.\nD: Итак, правда о твоем муже: продолжение.\nСовещание длилось несколько часов, пока я умиротворенно парил в астрале. Резолюция гласила: сдать негодяя в клинику, запереть дома или отвезти в такое место, где появление человека вызывает бурю эмоций у основных обитателей - белок.\nСперва меня пытались приложить в больницу. Как только мои друзья оплачивали курс детоксикации, я тут же проявлял природную смекалку: через час после ухода обозначенных лиц вваливался в приемную к врачу и писал письменный отказ от лечения.\nИ чудо: деньги, которые за меня платили, я получал на руки, за вычетом тридцати процентов. Это было не плохо, так считал и мой барыга.\nПоэтому, когда после шестого или седьмого раза я высадился в дом с мааааленькими зрачками и любовью к миру,  было принято решение запереть меня в четырех стенах.\nНу что же, длинную нитку и пустую сигаретную пачку никто не отменял, а схему товар - деньги не отменяли и подавно. Тут все было просто: по утрам мои приятели, выпив свой утренний кофе с белым хлебом и слегка вспотевшим ноздреватым сыром, отправлялись по своим делам.\nЯ же оставался на весь день дома, и у меня имелись солидные денежные запасы. Несколько волнительных манипуляций, и искомое оказывалось у меня в руках. Я устроил нехитрый тайничок в ванной, и часами, присев на краешке, игрался со струйкой воды.\nЭто так весело: она бежит, ты ее пытаешься подхватить. А она убегает. И так до бесконечности. Отличная забава могла продолжаться вечно, если бы не моя жадность. Посчитав, что цвет у порошка не тот, бухнул в ложку в два раза больше.\nНашли меня привалившимся к стене с художественной слюной – ниткой. Ванна наполнилась и текла через край, назревал скандал с соседями. Если бы я уронил свое тело в чугунное нутро, я бы попросту захлебнулся, предвосхитив события, произошедшие с винти хьюстон. Но бог берег меня дурака, я упал не в ванну.\nДальнейшие разговоры были бесполезны. У одного из подающих надежды дизайнеров нашелся какой-то дальний родственник, живущий на отшибе уральского полуострова. Бля. Я еду даже не в Мурманск. Я еду до Мурманска, а дальше на машине еще несколько часов. Сбежать оттуда можно только в Норвегию, но что мне там делать? Их язык пугающе напоминает лай.\nИтак,  я в чреве зеленого вагона, постукивающего своими колесами и поскрипывающего фанерными стенками, переборками и прочей мелкой чушью. За окном маленькие городки, больше похожие на деревеньки, глядя на которые хочется удивиться и сказать в сердцах:\n- Ни хера себе, и здесь люди живут. Вот это да.\nВторые сутки пути. Меня дико кумарит.\nКонечно, заветная пятерка была взята с собой, но она кончилась еще вчера вечером: «вроде и нет прихода уже, но я еще немножко, завтра будет завтра»\nВагон полупустой, поэтому я развлекаюсь тем, что меняю места дислокации. Я даже полежал на боковушке у туалета.\nНаступил час че.\nВернее, пиздец мне наступил. У меня адский дозняк, утром мне необходима инъекция нормального весового грамма - не барыжьей куцей херни, а полноценного такого грамма в щи.\nСначала меня пробило в пот. Это предвестник того, что скоро в животе начнет крутить, и усидеть на месте станет довольно-таки сложно. Ты не можешь провести в одной позе даже пяти сраных секунд. Меняешь положение, но облегчения нет.\nЗатем наступает очередь соплей из носа -  обильные вожжи текут ручьями. Кажется, что они сейчас начнут затапливать коридор, а в это время сосед по купе подозрительно смотрит, как его попутчик из веселого паренька - рубахи превращается в разваливающийся кусок дерьма.\nЭто был я.\nЗа окном - миллион деревьев, каждое из которых напоминает о тяжелой судьбине русского народа;\nMarkes: Ыыыыыы, мне уже легче становится, понимаю что мои муки несущественны))\nD: :))\nНеожиданно я понял, что на самом деле я очень несчастен. Есть такая вещь в кумачах: когда наркотик выходит, ты становишься таким чувствительным. Я смотрел на людей и плакал от жалости. Мне было жалко себя, их, их семьи и даже машиниста поезда.За то, что возможно он хотел быть летчиком - испытателем, а занимается тем, что на маленьком отрезке гоняет туда-сюда локомотив.\nИ тут, в процессе твоего осмысления ничтожности и бесполезности жизни приходит он.\nТы должна спросить - кто он?\nMarkes: Кто?))\nD: Адский по своему масштабу ПОНОС. Настолько ужасный, что одновременно с ним приходит и безудержная рвота.\nMarkes: Очень неудобно.\nD: Ты бежишь в туалет, и как в известном фильме попадаешь в отвратительную ситуацию. Но это еще не самое страшное. Напомню тебе, что вынести жгучую боль и неудобство от нахождения в одной позе ты не можешь.\nИ тут жизнь начинает тебя испытывать на прочность по-настоящему. Твои руки и ноги становятся, словно у буратино  Завтра едем в пустой город.\nМне было хорошо, и даже запах кошачьей ссанины не мог перебить удовлетворения. Пустой город - так пустой город. Завтра было так далеко, пусть хоть на луну. Я еще не знал, что это такое, а если бы знал, то возможно это бы и послужило неплохим мотивом для ускоренной программы отвыкания от наркотиков.\nMarkes: а дальше?\nD: дальше страшно.\nMarkes: `ну расскажи.\nЧасть 3.\n- Петрович, ну ты можешь не так гнать то, а?\nНаш проводник - местный сталкер Петрович, с натяжкой походил на персонажа из Стругацких. Ну, во всяком случае в моей голове плотно закрепился образ Кайдановского в этой роли, но никак не мужичка, с лопатообразной бородой и ростом метр пятьдесят (последние пятьдесят – крайне сомнительные). Однако, видом и нравом своим Петрович был намного круче сентиментального и склонного к философии сталкера.\nЗа всю дорогу Петрович не произнес ни одной фразы. Лишь изредка он комментировал взлеты и падения автомобиля марки уаз (в простонародии - «буханка»). Отвратительно говнистого цвета автомобиль, способный подбросить вас так, что голова произведет очередной «бооом» об низкий потолок против вашей воли.\n- Ух, бля, ебись конем а! - эту фразу Петрович изрекал, когда мы попадали в яму.\n- Вот жеж блять курва-а! - так он комментировал очередной камень на дороге, вызывающий многобальное автотрясение в отдельно взятом средстве передвижения.\n- Город этот был построен под военных - вещал лекторским, унылым тоном Анатолич, принявший с утра дозу пиртосодержащего напитка в простонародии именующегося «взбодрин» в размере трех граненых стаканов. - Так вот. Место это было засекречено и на картах его не было. Места здесь дикие, но граница рядом. Норвеги, было, сунулись разнюхать, но говорят никто на ту сторону так и не вернулся.\n- Да. Были времена, - неожиданно молвил Петрович, - вот блять, курва! - машину трясло и ей было нехорошо. У меня вообще были все основания полагать, что наша ознакомительно-воспитательная экскурсия закончится за ближайшим поворотом. И хотя настроение было омерзительным, я испытывал интерес к месту, куда мы прорывались излечивать меня от болезни.\n- Позже там построили училище. Элитное, летчицкое - Анатолич был в ударе. Смакуя детали, он плел из рассказа огромный свитер, которым можно было укрыть не только нас, но и пару ближайших поселков.\n- Сам Гагарин учился там, о чем естественно имеется мемориальная доска в домике, где он жил. Дорога туда одна. И все бы ничего, но незадолго до всех этих перестроечных дел город окончательно засекретили и движение по дороге полностью прекратилось. Ну, у военных свои дела, никто туда не лез, но слухи-то - они быстрее, чем птица - поэтому через пару дней уже вовсю обсуждалось вот что: город - не поселок, а целый город! - с населением тридцать тысяч человек - исчез.\nПетрович многозначительно посмотрел на меня, чтобы я оценил важнось полученной информации. Делать нечего, по правилам следовало изобразить удивление. И хотя мне было абсолютно насрать на исчезновение какого-то там гарнизона, я сделал глаза круглыми, а брови соответственно приподнятыми:\n- Да вы что! Что же случилось?\nАнатолич был удовлетворен, и повернувшись вполоборота ко мне, пунцовый от удовольствия, по слогам ответил:\n- Никто этого не знает.\nТо есть по факту - был небольшой городок со своей инфраструктурой, аккуратными домами и даже Домом Культуры. Люди там жили, рождались, умирали. А в какой-то момент просто раз - и никого не стало. Ничего удивительного я в этой истории не увидел.\n- Так и чего?\n- а того! - Петрович разозлился моей тупости. - Ты понимаешь, в город дорога - одна. Вот мы по ней едем. А тогда по ней никто не проезжал. Тридцать тысяч человек - это сколько машин, автобусов должно было быть?\n- Ну так улетели.\n- Да как улетели-то? Там взлетная полоса для военных истребителей, там обычным самолетам ни взлететь, ни сесть.\nИ тут мне стало не по себе. Шутки на этом месте закончились, и мозг в мгновение собрал картинку того, что могло произойти там, куда мы почти уже приехали. У меня чертовски хорошее воображение, и поэтому возможных сценариев развития было около пятидесяти: от безобидного исхода сквозь леса на территорию соседнего государства до внеземного вторжения космических монстров.\n- И что было дальше? - теперь мой вопрос носил действительно практический интерес, потому что эти джентельмены собирались привезти меня в какое-то мифическое место и оставить там ОДНОГО на целые сутки. Мне идея поездки вдруг разонравилась так сильно, что я начал поцарапывать стекло.\n- А ничего. Никого не встретили, понимаешь? Ни одной души! Даже животных не осталось - ни кошки, ни собаки. Говорят что потом уже, несколько лет спустя, видели некоторых знакомых отсюда - но они старались уходить от ответа или делали вид, что не понимают о чем идет речь.\nВ конце концов, подумал я, бывал я и раньше в странных и не очень понятных местах. Почему бы не побывать еще в одном?\nНаконец чудо советского автопрома выплюнуло нас из очередного поворота и глазам представилась странная картина: перед нами, словно на ладони, у подножия небольшой сопки, лежал городок. Слева от горки виднелись постройки военного назначения.\n- Аэродром. - ткнул пальцем Анатолич.\nПравее был непосредственно сам город. Как и все северные городки, вид он имел скорее неряшливый и дома стояли там, где земля позволяла установить сваи.\n- Вот, смотри, - мимо нас проплывал выкрашенный синей, облупившейся от времени краской, бревенчатый домишко. – это - дом Первого Космонавта.\nДействительно, о великом жителе гласила старая мемориальная доска. Далее мы свернули на главную улицу, по обе стороны от нас стояли в ряд кирпичные пятиэтажки. Стекла во многих окнах были выбиты, и через них можно было рассмотреть, что вся мебель оставалась на своих местах, словно хозяева жилищ просто уехали в отпуск, а дворовые хулиганы, побили стекла и теперь прячутся где то за углом.\nВообще создавалось впечатление, что место это было покинуто. Не оставлено, не брошено, а именно покинуто, по каким-то неведомым причинам. Мужики замолчали, и только рев старого двигаеля раздавался вокруг, отражаясь от стен и создавая причудливую какофонию из хрюканья, стука и надрывного гула.\n- Вот он - символ города.\nМы выехали на небольшой пятачок – по-видимому на главную площадь городка. На ражвом постаменте стоял старый истребитель с приваренным к брюху штырем - один из первых реактивных МИГов. Время поработало над ним, и поэтому памятник имел вид очень изношенный.\nПетрович заглушил машину и, открыв скрипнувшую дверь, шагнул на землю.\n- Приехали. - Анатолич засуетился. - Вот смотри, здесь тебе еды до завтра.\nЯ начинал терять связь с реальностью. Если все мои предыдущие поездки в подобного рода места носили чисто рабочий или познавательный характер, то сейчас эти двое привезли меня хер знает зачем в такое, блять, место, где можно и привидение повстречать. Мало того, они собираются меня здесь оставить одного, с одной единственной целью: здесь меня должно попустить. Да в пизду.\n- Слушай, анатолич, а может не надо этого ничего, а? Я как бы впечатлен, и готов ехать обратно.\n- Но, - Петрович шумно открыл капот. - у Валерки помнишь, сын? Мы его возили сюда - пятый год, как бросил дерьмо это. А у Ленки – дочку тоже сюда свезли. Она, правда, потом в психушку попала – но не колется же. - Петрович поднял палец вверх, будто это был ответ на все мои вопросы.\n- Мужики, я не против того, чтобы сделать, как вы говорите, но обьясните мне: какого хера мы приехали сюда, и назовите хоть одну вескую причину, какого хуя я должен здесь остаться? Причем, блять, остаться один.\n- Ты пойми, - Анатолич положил мне руку на плечо, - когда люди-то пропали, сюда повадились молодые ездить. Пьянки, танцы - дело молодое. Никто против не был, да и в гроде тише стало. Так вот: одна компания поехала сюда очередной какой-то праздник отмечать, на двух машинах, семь человек. Что тут произошло – не понятно, но на следующий день они вернулись словно другие.\nПонимаешь, до этого они гудели чуть ли не каждый день, а тут приехали - и все. Тише воды-ниже травы. Ну, тут Петрович и смекнул, что не просто так это. Сел и поехал сюда. Как положено - взял вещей, остался ночевать. Петрович, давай ты теперь расскажи парню!\nПетрович отвлекся наконец от металлических кишочек своей любимицы, и, вытирая руку промасленной тряпкой, начал говорить. И вот что он поведал: ночью Петрович услышал голос, который вступил с ним в диалог. Голос рассказал ему то, в чем Петрович себе признаваться боялся. Например то, что жизнь он свою губит пьянками, а дети его ненавидят за это. И можно – де - все исправить, достаточно прямо сейчас прекратить.\n- И ты понимаешь, я как бы вроде и не вижу никого, а в голове идет разговор. Ну, я тогда понял, что не просто так отсюда люди то ушли. По совести-то жить, не каждый захочет. А тут такое. Бубнилка в голове и давит тебе на мозг, и так давит, что аж до слез пробирает.\nПетрович вроде не был похож на идиота. Да и я не особо верил в подобные сказки.\n- Вот, ну и стал я возить сюда ребятишек, кто по жизни потерялся. А что - никакого обмана, и никакой мистики. - Петрович улыбнулся своими коричневыми от табака зубами и снова ткнул вверх пальцем. – Ты, главное, не робей.\nДверь машины захлопнулась, на прощание меня обдало сизым вонючим дымом, и я остался один. Через какое-то время тишина стала настолько пронзительной, что я начал петь, чтобы заглушить звук ничего. На самом деле мне было ну очень нехорошо, а еще я боялся услышать звук. Любой. Это бы означало, что я тут не один. И хотя рассказ Петровича зародил во мне сомнения во вменяемости моих товарищей, сталкиваться с чем-то, что могло бы как минимум удивить меня - мне не хотелось вовсе.\nЗа полтора часа я обошел весь городок, присматривая место для ночлега, и удостоверился в том, что в город действительно необитаем. Даже маленькой птички не повстречалось на моем пути. Вернувшись на площадь, я без удовольствия съел грубоватую еду, приготовленную заботливым Анатоличем, и стал смотреть на самолет.\nТяжеленная махина висела, пришпиленная нехитрым замыслом к пьедесталу, и небольшие порывы ветра слегка покачивали ее крылья. Разадавался ржавый неприятный звук. Разглядывая его, я испытал какое-то разочарование. Нет, скорее грусть. Какое-то время назад эта штука наверняка радовала детей, внушала надежду людям, которые здесь служили… Не понятно на что, но мне так хотелось, чтобы она давала надежу. А потом люди ушли, или их похитили инопланетяне -  а этот символ теперь стоит тут в одиночестве. И так будет, пока его не изьест ржавчина до такого состояния, что вся конструкция просто рухнет на землю, но никто этого даже не увидит.\nТемнеет на севере поздно. Полярный день - интересная штука, но мне не повезло: тучи затянули небо и быстро сделали всё темнее, а следовательно - тревожнее.\nЯ решил заночевать в одной из квартир в доме, который находился рядом с музеем летчика - испытателя. Хотелось, конечно, лечь на кровати героя и понять, как ему там спалось, но на двери был гигантский ржавый амбарный замок, а в лютой абстиненции у меня сил едва хватало, чтобы сигарету прикурить. Поэтому, не особо обращая внимания на окружающее, я проследовал в первую же открытую квартиру.\nОбстановка там не отличалась от той, что была у того же Анатолича - тот же ковер, стенка на полкомнаты. Единственная разница была в том, что все было пыльное и какое-то дряхлое, плюс ко всему было холодно. Я завалился на кровать и стал ждать сна. Разные мысли обуревали мой мозг, мне мерещилось, что за дверью комнаты кто-то стоит и вот-вот войдет сюда. Тогда я стал смотреть в ту точку, и смотрел так долго, что глаза заболели и стали слезиться, но ни одного постороннего шума или шороха я так и не услышал.\nНеожиданно для себя я впал в сон. Пробуждение было резким и странным, словно я только закрыл глаза, а когда открыл их, вокруг было темно - хотя ночи в этих местах можно было сравнить с четырьмя часами пополудни в Питере. Однако, я не видел абсолютно ничего, лишь угадывал контуры предметов… и эта тишина - она давила в голову так, что в ушах появился нарастающий звон.\n- Блять, блять - мне стало не по себе. И тут в моей голове раздался (только не стоит считать меня клиническим больным) голос. Он не был похож ни на один из тех, что я слышал когда-либо. Тоесть его не было, но он был. Я не понимал произношения, но он был спокойным и каким-то, теплым, что ли.\nС удивлением я обнаружил,что кумарные боли прошли, и я больше не мерзну, как пес на морозе. Прошли даже боли внизу живота, которые сопровождают наркомана всю первую неделю отмены от наркотиков. Постепенно я начал различать смысл, и стал слушать.\nЭто «что-то» говорило мне о том, какой опасности я подвергаю себя и близких мне людей, когда делаю себе иньекции. Каждое проникновение в меня наркотика позволяет проникнуть сюда чему-то плохому, и чем больше я это делаю, тем больше Их здесь. Голос так и сказал - тем больше Их здесь.\nКонечно, блять, я бодрячком. Лежу на кровати неизвестных мне людей, которые лет двадцать назад как по какой-то причине слились из города всем составом, а в голове у меня - хер знает откуда взявшийся голос, который читает мне мораль о греховной составляющей моей жизни. Поэтому я, будучи весьма прагматичным чуваком - решил идти до конца и, преодолевая сомнения, осторожно, в голове же задал вопрос\n- А позвольте спросить, о ком идет речь? - Типа прикинулся дураком. И зря.\nГолос умолк, и звенящая тишина снова сдавила виски. Кроме того я понял, что я лежу на кровати и не могу шевельнуть ни одним мускулом своего тела. Подвижны только глаза.\nИ тут в окно стукнул камень. Если бы я мог, то наверное обгадился бы на месте, но мой желудок был пуст, как и мочевой пузырь, а поэтому я оставался в положении мумии в Эрмитаже и с ужасом ругал себя - на хера я вечно лезу со своими вопросами так не вовремя?!\nЗвук раздался еще раз и еще сильнее. - Так, я не паникую. Это всего лишь камешек в окно, который кто-то или что-то бросает, - волосы на голове зашевелились от представленной картинки, кто это может быть. По спине побежал строй муравьев.\nВдруг деревянная рама скрипнула и приоткрылась. Всё, это уже слишком. Я волевым движением рванулся и ...остался в том же положении. Сказать, что мне стало страшно - это не сказать ничего. Нечто бесформенное, черное и меняющее очертания, проникало в комнату.\nИздавая шипящий звук, неведомая тварь проталкивалась через узкую щель. Тут я понял, что достаточно уже с меня необычного и начал просто повторять, словно заклинание, детскую считалку. Мне очень хотелось закрыть глаза, но я не мог этого сделать. Это было словно в страшном дестком сне, когда ты видишь что-то очень нехорошее, но ты слишком мал, чтобы противостоять этому, а родители спят в соседней комнате, и ты даже не можешь крикнуть, чтобы разбудить их.\nНаконец мерзкая тварь плюхнулась на пол и издавая шипящие звуки поползла к кровати. Она пульсировала и меняла свои формы. Никуда не торопясь, она проползла к моим ногам и с силой сдавила их, поднимаясь все выше и выше.\nЯ чувствовал холод, словно по мне тащили ледяную глыбу. Настолько холодную, что ломило кости. В странном бесформии я начал угадывать какие-то черты. Мерзость меняла очертания, то принимая формы черт чьих-то лиц, то раздуваясь, как мохнатый мяч. Наконец, мразь достигла моей груди и выпустила что-то похожее на хоботок или жало. Он, подрагивая, словно обнюхивал меня, и двигался вверх, вверх.\nВнутри себя я кричал. Ничего сильнее я не переживал никогда, невероятным усилием я попытался вжаться в кровать и ...открыл глаза.\nВ окно светило солнце и раздавался звук клаксона.\n- Эйййй! - Петрович, милый Петрович! Пожалуй, никогда я не радовался так человеческому голосу. Это был сон, просто сон. Вскочив с кровати я схватил сумку и тут я увидел: створка окна была приоткрыта, а на подоконнике лежали два маленьких камешка.\nЕсли бы за скоростное перемещение через брошенные города давали медали, я бы стал чемпионом мира. Всю обратную доррогу я молчал и на все вопросы Петровича отвечал односложно - да или нет.\nЧерез два дня я купил себе билет в кассах и не откладывая сорвался обратно домой. Анатолич передал связку сушеных грибов, рыбы и прочие подарки родственникам, пригласил приехать на следующий год. Весь путь я просидел на полке, боясь закрыть глаза. Шипящий звук то и дело возникал у меня в голове.\nПитер встретил жарой и улыбающимися людьми.\n- Стой, давай-ка сюда. - водитель-таджик, плохо разбирающийся в устройстве улиц, наконец довез меня до знакомой парадной.\n- О, ты где пропал то? - Ча только проснулся и имел скучающий вид.\nМы сидели на маленькой кухне в хрущевке.\n- Че, вмажемся? - Ча протянул мне баян, заряженный прозрачным раствором. Я замер.\nОтчетливый звук стукнувшего камешка в стекло вызвал во мне животный ужас… стоп, я же взрослый человек.\n- Ты чего? -Ча удивленно смотрел на меня.\n- А, ничо, херня всякая в голову лезет.Подержи руку...\nFrom Spb 2 Transsiberian Trains feb. 2013\nот редактора: первая часть текста была написана в сообщениях, по строчке, и с нежностью выписывалась мной из телефона. Мой любимый писатель рассказывает мне истории на ночь, когда я не могу уснуть, некоторыми из них я просто не могу не делится.",

    "full_content": "hard diving\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один парень умер от наркотиков, и много я прочитала в те дни - о том, что надо было спасать, или о том, что надо было предпринимать меры. Я, конечно, в очередной раз примерила на себя эту историю. Никто не мог помочь, никто не мог спасти. Это всегда история только про тебя.\nСтранная это штука, во многом определившая мою жизнь. Это и отличает зависимых людей от независимых -\nв торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы. Остальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\nПо сравнению с настоящими наркоманами фактически я употребляла очень мало. Настолько, что я могу вспомнить каждый раз, количество, обстоятельства. Это были не такие длительные периоды, но каждый раз я встречалась со своим пределом. Когда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\nГоворят, что боль уходит.\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Были разы, дни между месяцами и годами чистоты. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается (или не случается) момент расщепления «я».\nЕсли случается, то ты случайно отделяешь себя от своего желания торчать.\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом. В шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо этого внутри меня стало постепенно оживать что-то. Интерес - вот самое лучшее чувство, за которым уже идет все остальное. Ты осуществляешь действие - видишь результат - радуешься. Я не радуюсь от того, что не является результатом моего труда. Такое у меня устройство. И вот когда я поняла это - я начала делать. Вернее не так, я делала и делала много до этого, но внутри была такая каша, что я не понимала, что именно это меня радует.\nТак я поняла, почему я люблю тренировки. Почему я люблю писать. Почему я люблю вести йогу - мне нравится действие, направленное на что-то хорошее. И дальше все это было уже как снежный ком. Ком, в сердцевине которого был зародившийся интерес к жизни, ко всему тому, что было мне непонятным.\nЯ обязательно напишу еще, и про свои рехабы, и про открытия в самоанализе, и про свои дефекты характера, и про то, как я училась и учусь по мааааленьким ступенькам поступать по-новому в рамках собственного безумия. Я буду писать, потому что гипотетически есть какой-то такой,\nпохожий на меня человек, которому мой опыт будет полезен. А я очень мало им делюсь, самым ценным и тяжелым - а надо бы, надо бы.\nАнастезии нет. Нет и всё. Ты просто начинаешь жить и однажды перестаешь задыхаться. И это невероятно похоже на тренировки - у тебя появляются силы так постепенно, что порой ты этого не замечаешь. Просто ты оглядываешься и понимаешь, что плывешь. Зависимость - это удивительная болезнь, которая может открыть такое зазеркалье твоей реальности, что слов не найдется, чтобы описать. Вот поэтому для меня наркотики - это такая вещь, мало кто поймет, если я скажу, что я благодарна за то, что это было в моей жизни.\nАнастезии нет. И ты все еще являешься собой во всей этой уязвимости. И жизнь все еще похожа на то, как будто ты идешь по канату, или куда-то бесконечно падаешь. Просто теперь уже точно нет никакой иллюзии, что ты можешь что-либо контролировать в этом глобальном процессе, поэтому тебе спокойно, и в процессе падения ты наконец-то можешь открыть глаза, оглядеться по сторонам и начать жить.",

    "full_content": "#ПоможемНикеСпастиЖизнь\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офигенно, ну, это я так считала.\nСледующий кадр – я с какими-то пакетами иду по поселку Арамиль и рыдаю в три ручья, мне так плохо, что не хочется жить – причем уже давно, даже когда я не торчу, даже когда мне удается прожить без наркотиков несколько дней – ну, по той причине что денег на них уже нет, или потому, что все мои друзья уже отказываются иметь со мной хоть какие-то дела, - мне хочется сдохнуть, потому что жизнь эта не имеет ни цели, ни смысла.\nИ вот – иду я по поселку Арамиль в реабилитационный центр «Зазеркалье», а Ника меня встречает на дороге, обнимает, улыбается и гладит меня: «Ну чегооо ты… Плачешь, девочка? Ну поплачь…» наверное с этого момента Ника всегда была мне мамой.\nОна такая маленькая, такая хрупкая – ниже меня на голову целую, ее можно обхватить и спрятать… Но при этом она – такой ЧЕЛОВЕК. Она как будто находила нас в темном-темном месте и отводила туда, где свет.. Я помню со мной в той реабилитации лежал один парень, ему было 30 лет и кололся он из них половину. И он не мог поверить в Бога, и я помню тот самый момент когда что-то изменилось… Ника всегда находила такие слова, которых не находилось у меня - даже в голове.. И в тот момент она нашла слова для него. И он сказал… «да». Сейчас у него двое детей.\nЕсли бы не она – не было бы этого альбома – Снежная Барселона. На этом диске даже есть ей персональное, огромное СПАСИБО. И за все, что было после – за все наши записи и концерты (а они ведь наши дети) я благодарна ей, она всегда была рядом.\nЕе голос – я так люблю ее слушать, ее вот эту вот манеру смеятся, жестикулировать, что-то показывать. Если ее увидеть один раз – никогда не забудешь, если один раз с ней провести время – подсядешь навсегда.\nПоследние годы она жила на Красных Воротах в маленькой комнате в коммунальной квартире – там никто не мог ужиться из за сумасшедшей соседки Линды Эдмундовны. И только Ника смогла с ней совладать. Так вот – мы с Alai Oli приезжали в Москву выступать, и могли всей группой завалится ночевать к ней – она никогда не отказывала нам, самый терпеливый человек на свете… Как же хочется отплатить тебе, Ника, за все тепло, которое ты дала мне и моим друзьям.\nНика уникальная. Она уникальная, невероятная харизма – такой метр с кепкой, при этом самая настоящая женщина, красивая, нежная, открытая, дерзкая, веселая до разрыва и печенок… и мудрая настолько, что на несколько тысяч человек хватает ее мудрости, и так хочется, чтобы ее узнали еще больше людей… Чтобы она помогла и другим. Чтобы она была здорова, счаслива и всегда, всегда, всегда рядом.\nДля меня это очень, очень важно.\nСейчас у Ники нашли рак, и она конечно никогда не скажет и не попросит сама, но ей очень нужна наша поддержка, наши молитвы, наша помощь. Лечение очень дорогое, но нас много и вместе мы его потянем, и если у вас в сердце отозвалась история моего друга и учителя Ники, то вы тоже можете помочь. Мы все, ее друзья, будем вам очень благодарны.\nВот это реквизиты для финансовой помощи:\nВы можете положить деньги на этот счет: 5331572019702601, в любом салоне связи ЕВРОСЕТЬ.\nА так же, перевести сумму на карту Сбербанка: 4276380066196630.\nА вот группа вконтакте, где вы можете написать Нике слова поддержки!",

    "full_content": "По горячим следам отвечаю на вопрос прошлого поста: Зачем и как прописывать обиды?\n⠀\nКонечно, иногда я жалею, что программа 12 шагов не так доступна и адаптирована для большинства людей - настолько это мощный инструмент самостоятельной психологической помощи... Но к счастью, в России становятся популярны 12 шагов для пищевых зависимых, для созависимых, для детей зависимых. Если что - все эти группы бесплатны.\n⠀\nС обид начинается работа над четвертым шагом. Сначала ты описываешь ситуацию, свои чувства, свое поведение, а потом - ищешь свою нечестность, свою сторону в этой обиде. Эта работа настолько многогранна, она дает множество уроков - и чем дольше ты в этом процессе - тем больше ты узнаешь о себе и о других.\n⠀\nОбиды запускают разные процессы в нашей жизни. Мы не знаем, как себя вести, кто на самом деле виноват, прощать или прожить - все эти вопросы занимают кучу оперативной памяти, какие-то события портят настроение, какие -то портят отношения. Есть обиды, которые тянутся годами, есть такие, которые раз за разом бьют нас в больное место.\n⠀\nВ процессе мы узнаем не только то, какие вещи обижают нас, но и то, как себя чувствуют другие от нашего поведения. Мы начинаем понимать, что часто ждем от других любви, принятия, чтобы нас слушали, чтобы нас слушались - но сами мы не готовы отдавать это во многих ситуациях с другими людьми. Мы обнаруживаем, что зависли между низкой самооценкой и критическим уровнем эгоцентризма. Мы отстаиваем право на свое мнение, но не всегда даем это право другим людям.\n⠀\nМы обнаруживаем, что наша самооценка зависит от оценки других людей.\nМы обнаруживаем, что ожидаем от людей определенного поведения и не готовы сталкиваться с реальностью.\nМы обнаруживаем, что хотим получать, хотим, чтобы все было легко и спокойно. И совсем не хотим проходить трудные уроки, которые на самом деле и делают нас сильнее и мудрее.\n⠀\nПрописывать каждую обиду - это сначала боль и труд, а потом - невероятный кайф. Сначала ты вычищаешь авгиевы конюшни, скопившиеся за всю жизнь. Вдоволь себя жалеешь и поддерживаешь, а потом - ⤵️⤵️",

    "full_content": "По четвергам я пишу о зависимости.\n⠀\nПрограмма 12 шагов заставляет тебя смотреть на себя честно и беспристрастно. Если ты не работаешь по программе - жизнь начинает преподавать тебе болезненные уроки. Тебе все равно приходится смотреть на себя, но уже не в «учебной» среде. \n⠀\nПисать ответы на «шаговые» вопросы - дело не самое легкое и приятное, но проживать жизненные уроки гораздо, гораздо неприятнее.\n⠀\nЯ помню, как однажды у меня были серьезные проблемы на работе, и мой друг из 12шагового сообщества, опытный бизнесмен, траблшуттер, был тем человеком, к которому я обратилась за консультацией по своей проблеме. Он сказал тогда что-то вроде: «я бы мог тебе долго рассказывать всякое, но скажу тебе главное: начни уже писать шаги. Когда ты этого не делаешь - ты постоянно совершаешь ошибки, ты сама будто вставляешь палку в колесо своего велосипеда. Так работает мозг зависимого человека». Я тогда хотела других рецептов, и мне было не до шагов. И совершенно зря.\n⠀\nЧерез несколько лет просто трезвости, я поняла, что дело не в ней. Если не работать с головой, я постоянно делаю все не так, говорю не так, совершаю ошибку за ошибкой, обижаю людей, сама обижаюсь и остаюсь в изоляции. Естественно, это проникает во все сферы жизни. Зависимость похожа на черный спрут, и самое страшное в какой-то момент ты перестаешь отделять зависимое поведение от самого себя. Поэтому многие не хотят работать с собой и бросать вещества - им кажется, что без всего этого они потеряют себя.\n⠀\nПотом, когда начинаешь писать шаги, ум очень очищается, ты уверен в каждом своем действии, тебя сложно обидеть или задеть, и самое главное - ты начинаешь делать одно правильное решение за другим. Это не про то, что шаги гарантируют успешный успех. Для этого нужно слишком много факторов. Но ты трезво оцениваешь себя, свои возможности и можешь делать действия, а не гонять в голове из пустого в порожнее, ничего не предпринимая.\n⠀\nСейчас я не пишу шаги регулярно, и явно наблюдаю, как с     "full_content": "Scar Tissue автореферат\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу отложить телефон, читая Двач до 2х часов ночи. Когда я одна - я как будто остаюсь дома без родителей. Когда нет жесткого контроля извне - я как будто разрешаю себе все. Но разве при людях я запрещаю? Разве люди являются гарантом моего правильного поведения? Ну нет же (это я успокаиваю себя). Если бы я чаще была одна - это бы устаканилось. Я бы компенсировала себе все, а потом бы вернулась на привычные рельсы. Но одиночество - это недоступная.. не буду говорить, что роскошь. Опция. Недоступная в длительной продолжительности опция.\nКогда-то анонимные наркоманы сказали мне: может быть торчать ты еще будешь, но удовольствие мы тебе точно попортим. Не сказать, что я получала удовольствие от наркотиков до этого. Во всем этом было очень много истерики - я хочу, хочу так сильно, как ничего на свете не хотела. Даже не так: мне надо. Мне просто надо. Есть? Дайте. Есть сильнее? Дайте. Есть больше? Дайте. Точно так же анонимные наркоманы попортили мне удовольствие от многих других вещей в трезвости- например, от втыкания в телефон или от покупок. Даже если я продолжаю делать что-то подобное - я осознаю, когда мной руководит зависимое поведение. Я не употребляю 6 лет и 7 месяцев, но при этом я каждый день ловлю себя на зависимом поведении. Думаю, именно это помогает мне оставаться в потоке - продолжать писать шаги и не пробовать изменять сознание в надежде, что сейчас это приведет меня куда-то в место поприятнее, чем то, где я была 10 лет назад.\nДля начала я нарисую вам хронологию своей зависимости, я же никогда этого не делала раньше в своих лонгридах, только в тетрадке из реб.центра, которую никто из вас не читал. Все равно придется делать это в мемуарах) Так что подарю вам эксклюзивчик.\nИтак. 12 лет - я начинаю курить сигареты, пробую травку. Мне некомфортно, кажется что я предаю что-то в себе, что-то важное. У меня есть подаренный мне пакет травки - я не пользуюсь им, предлагаю его папиной подруге, которая курит. Она рассказывает папе, он достаточно жестко реагирует, отвозит меня в общественный центр для наркоманов, пол года я на домашнем аресте, ко мне относятся как к наркоманке, мне показывают фильмы про подвалы дыбенко, я вообще не понимаю - за что так со мной. У меня же была своя голова… Была. Когда к тебе относятся, как к наркоману - ты уже в принципе привыкаешь к этому состоянию. Я привыкла. Думаю, когда детям говорят, что Элджей и его музыка может сделать их наркоманами - это работает примерно так же. Моя зависимость была заложена во мне, но всегда есть тот триггер, который запускает этот механизм.\n(на фото уже 9-10 классы, с 7ого класса я курила. К началу универа выкуривала по две пачки в день)\nВ то время у меня пропало желание не-торчать. Я была готова пробовать, я стала открыта для этого мира и людей в нем. Я читала сайт\ndrugusers\nо внутривенном употреблении , я пыталась понять суть зависимости и зависимых. Мне было 13-14 лет. В то время я встала на сторону идеологии «I dont want to choose life. I choose something else». Мне не нравился лживый мир взрослых - они сами не могли быть примерами трезвости или чистоты, они не были эмпатичными, они не старались понять нас и выслушать. Я хотела связать свою жизнь с социальной журналистикой и программами типа «Снижение вреда» - кстати, почти за 20 последующих лет я успела побыть и клиентом подобных центров, и их амбассадором.\nЛет в 16-17 я нашла Ital-идеологию в растафарианстве. Чистота и естественность. Вегетерианство, травка, никакой химии. На тот момент я уже попробовала ряд наркотиков - несколько клубных сетов - я поняла, что танцевать под наркотиками - это не мое. Но лежать с закрытыми глазами - это, пожалуй, да. Мое употребление химии до 16 лет было эпизодичным, раз 10, максимум - 1-2 дня подряд. Не было денег, не было компании, в которой были тяжелые наркотики. Но по поводу легких - все это было, и это было лучше, чем алкоголь.\nАлкоголь иногда все таки появлялся в нашей жизни - но в качестве редкого веселья. Был долгий период отказа от алко, но ни начала ни конца я не могу вспомнить. Скорее всего весь первый курс университета. Тогда мы начали есть грибы, у меня серьезно повернулась сознание. В тот момент я заплела дреды и взяла достаточно строгую аскезу. Рассталась с парнем, с которым встречалась с 9ого класса, много времени проводила в церкви. Мне хотелось очистится, казалось, что я неправильно живу и все вокруг тоже совершают ошибки. Я чувствовала: мы все должны быть чистыми и невинными, как дети. А мы были далеко от этого.\n(2004-2005)\nКогда я нашла идеологию чистоты в I-tal и православие, я была уверена, что это навсегда. Прошло года 3, мы выпустили альбом, попали в реггей среду, я нашла свое место и ощущение правильности всего, что я делаю. Между мной и химией лежала, как мне казалось, целая вечность. Я осуждала тяжелых наркоманов, считая это слабостью и тупостью. Я успела даже осознать зависимость от гашиша - оказавшись без вещества тгк на неделю, я чуть не сошла с ума. Конечно, это не героиновая ломка - это другое, но психологически очень неприятно. Зато после этого перерыва, я перестала нуждаться в тгк каждый день, и начала относиться к этому спокойнее. В то время, мне кажется, я была ближе всего к психологии независимых людей. Могла бухать с друзьями по выходным, когда мы идем в клуб, а в будни ходить в офис, курить время от времени. Меня это не беспокоило. Тогда я начала кататься на велике, знакомиться со своим запущенным здоровьем и телом, экспериментировать с питанием.\n(2006-2007 первые шаги в здоровом образе жизни. Я наконец-то начала выглядеть лучше, бросила курить!)\nПотом что-то пошло не так. Я встретила любовь, my siberian ragga, мне казалось, что это - ваааааааааа бесподобное нечто, и теперь все будет иначе. Я как будто поменяла свою внутреннюю химию, перестала чувствовать себя тем человеком, который жил и устоялся до этого. И когда мы оказались в Питере -  мне захотелось употребить что-то сильное. Мне казалось, что мы несокрушимы, что ничего не сможет нас разлучить или сломать. Отличное решение на этой волне убиться дешевыми влажными питерскими спидами. И когда я это сделала - это убило всё. И нового воздушного человека во мне, и химию, и любовь. Первое употребление после долгого перерыва выжгло меня изнутри, всю мою идеологию и ощущение правильности, и вообще все. Кстати, где-то в этот период я завела жж, может на несколько месяцев позже. И еще песня «Ищу Тебя» о том моменте. Любовь была у меня, но я потеряла ее в себе.\nКто после этого начал употреблять - я не знаю. Какая-то пустая оболочка без смысла и идеологии.\n21-22 года - это время моего самого активного употребления без контроля и понимания, что со мной происходит. Мне было надо. Мне хотелось. Я искала возможности и способы. Мне конечно хотелось при этом контролировать употребление и не терять свою жизнь. И у меня были способы. Например - не торчать в Екатеринбурге. Я продержалась в этой концепции месяцев 7-8, меня откачивали в турах, в итоге я практически переехала в Ижевск.\nсентрябрь 2008, i am so bad\nБыли моменты, когда я пыталась перестать сама. Я не торчала на героине, но стимуляторы тоже подсаживают тебя на систему, хоть и не такую жесткую. Я пробовала так: например - разогнать дозу до такого, чтобы было уже невозможно употреблять (плохой способ). Отказаться от стимуляторов и употреблять только несинтетические наркотики - лсд, грибы, мескалин. В конце уже не было денег на экзотику, мы со Щекалевым съели семена гавайской розы (я совершила эту ошибку второй раз в жизни). Отравление было таким сильным, что почти сутки я падала в обмороки и испытывала боль во всем теле. Было так плохо, что после этого любое состояние было хорошим. Т.е. Меня больше не кумарило.\nМы уехали автостопом на юг, перед этим я познакомилась с Никой Суринович, которая сказала: хехе, у тебя проблемы. Осознаешь - приходи. И я, с трезвостью в неделю или две, усмехалась в ответ: я могу сама. Вот увидишь. Через месяца полтора трезвости я осталась одна и выпила глинтвейн. А что такого? Это же не наркотики. Теперь можно.\nМного раз за эти два года я пыталась заменить наркотики на алкоголь. Это были и веселые вечеринки, и просто несколько термосов глинтвейна с водкой, без которых я не выходила из дома как раз в тот период - вот в один из этих выползок я пела для ВИЧ+ ребят в помещении группы анонимных наркоманов, многие думают что в тот период я была уже трезвая. Видимо в употреблении я не выглядела так, как представляют себе торчков. Просто грустная.\nВообще все относились ко мне нормально. Юля меня поддерживала и всегда была рядом, одногруппники помогали с учебой, моя группа старалась понять меня. Конечно я вела себя безумно, я психовала, сама отталкивала от себя людей - во многом я хотела сама все потерять, чтобы нащупать дно и оттолкнуться от него, но у меня никак не получалось. Возвращение к наркотикам после перерыва, когда «ты сам» - это болезненно. Казалось, что я падала еще ниже. Мне отчасти нравилась эта эстетика дна, мне было больно в душе, но не страшно. Я употребляла внутривенно, я делала это одна. И вот так казалось все и должно закончится. В какой - то момент ты не хочешь никуда выбираться, не хочешь, чтобы тебе становилось лучше. Ты просто жалеешь, что не можешь умереть прямо сейчас.\nТем не менее употреблять больше недели я не могла. То есть когда я пишу о своем торче, многие представляют меня, как Андрея - который 10 лет ежедневно кололся и искал дозу с редкими перерывами на детоксы. У меня была другая система - я могла употреблять 2-3 дня, наркотики заканчивались или я их выбрасывала раньше. Потом я пыталась компенсировать себе выходы - начинала бегать через силу, еле передвигая ноги, по вечерам - заливаться алкоголем, превращая все это в атмосферу праздника - могу, умею, практикую. Друзья = эндорфины. Пару дней - и я была в норме, ничем не отличалась от других людей, которые бухают по выходным. Так можно жить годами, и многие, многие так живут до сих пор. Особенно в Питере, где Северное техно и вся инфраструктура. Но в Питер, кстати, я переезжала уже на другой волне.\nВ целом у меня было все: друзья по всей стране, прогресс во всех сферах жизни, много полезных связей, деньги на все необходимое, независимость от родителей - мой торч был отвратителен или прекрасен тем, что давал моему «я сама» большую веру и моему эго большую подпитку - а это значит, что мне претила сама идея обращения за помощью. Я понимаю Лил Пипа, понимаю всех этих фрешменов, которые умирают до 25ти. В своем первом ребцентре я рисовала картинку: я держу в руках столько дел, людей, все вокруг меня и завязано на мне - а подо мной бездна, а в ней - огонь. И мне уже жжет пятки.  Но я могу писать песни, могу выходить на сцену, черт возьми, я даже могу подготовиться к экзаменам и сдать сессию, написать охрененное эссе, статью в газету факультета. Я все успеваю - и жить, и умирать.\nЭто было самым сложным в том периоде, да и вообще в любом из последующих. Если в этой жизни ты держишься на уровне нормальных людей, держишь свою жизнь в шатком балансе, то что в той, другой жизни без наркотиков и алкоголя? Норма не измеряется твоими успехами, достижениями, положением общества. Норма - это то, что на твоих внутренних приборах. И строить курс надо по этим приборам, а не по внешним ориентирам. Быть в норме, как все другие люди еще не значит быть в твоей личной норме. Тогда я не знала никого, кто жил бы так, как я и испытывал бы подобное. Если бы мне тогда попалась книга Киддиса Scar Tissue - возможно, я бы лучше поняла, что происходит.\nОчередная моя чистота началась решительно: я пообещала Юле - пол года никаких наркотиков, а она подарила мне абонемент в фитнес клуб, где я попала на первую в жизни йогу, а в последствии - вообще прописалась там, пробуя все все виды групповых и индивидуальных программ. Я решила ходить к Нике в реб.центр, изредка оставаясь там на ночь - просто подсмотреть, как лечат зависимых. Но я выполняла все задания. Ужасом для меня было то, что они говорили об алкоголе - что это такой же наркотик. Я не могла и не хотела с этим соглашаться - настолько он бы интегрирован в жизнь.. Это была норма. Все так отдыхали. Когда в компании я пробовала отказаться от алкоголя - я чувствовала себя несчастной, как единственный ребенок из всех, которому запретили мороженное;\n(разговор с Никой, октябрь 2008)\nНу можно я буду пить но не буду торчать? - ну давай, хе-хе-хе… - Вот так примерно мне отвечала Ника. И я пробовала.\nТогда, после очередного разового срыва на наркотики (около месяца я продержалась с алкоголем и на обещании Юле). И вот тогда я пошла на группу. Она была, кажется, на улице Луначарского. Люди мне не понравились. Все было ужасно, меня стебали, кривили лицо - я была там вообще «не от мира сего», но я как-то покорилась. Кажется в тот момент я приняла бессилие: с алкоголем не получится, я устала, я хочу попробовать так, как вы говорите.\nПервым моим шагом в настоящую трезвость без полумер было абсолютное понимание, что контролировать употребление я не могу, понять зачем я употребляю - я тоже не могу. Не было ясности, что будет дальше, как я там буду — но первый раз в жизни я была готова отказаться от всего: от алкоголя и любых видов наркотиков.\nЭто была осень 2008 года. Мой последний год обучения в университете, год, когда мы выпускали Снежную Барселону. За 2008-2009 год мне едва ли удавалось набрать 1-2-3 месяца трезвости без срывов, но во всяком случае уже большую часть времени я проводила абсолютно чистой - без алкоголя и даже легких наркотиков. Проживала день за днем. Это - первая часть рассказа. Остальное напишу в следующий раз.",

    "full_content": "Часть 3. На фото - 2011 год. Я живу без приступов, у меня около года трезвости, #sekta только - только появилась, как сообщество в жж. \nМое желание разобраться с саморазрушением и желанием исчезнуть привело меня в сообщество анонимных наркоманов. Там все было сложно и непонятно, и когда я начала отказываться полностью от наркотиков и алкоголя - моя пищевая зависимость начала возобновляться, я анализировала свои приступы, их причины, училась работать с тревожностью, которая их запускает. Как у любого срыва -у них всегда были причины. Булимия - это проявление болезни зависимости, и есть много материалов, например у Валентины Новиковой, которые помогают разобраться в причинах и механизмах, которые руководят зависимым поведением, компульсивным поведением, тоннельным мышлением. Пришлось очень много в себе проработать - свои обиды, страхи, все, что запускало механизмы тревожности. Я не помню момент, когда приступы прекратились, потому что я перестала фокусироваться на них - я внимательно следила за своими реакциями на мир и на внешние раздражители. Моим фокусом стал душевный покой и все, что ему способствует. Моим\nфокусом стали изменения в моем внутреннем мире, работа с моими дефектами, с моим эгоцентризмом - когда я видела в себе позитивные перемены, у меня не было никаких причин ненавидеть себя и наказывать. До начала работы по 4ому шагу приступы иногда возвращались - в самые стрессовые моменты, но они были разовыми, без запоев, как раньше. Но уже больше 5 лет я живу в абсолютной свободе от этого, столько же я сохраняю абсолютную трезвость - от алкоголя и любых других веществ. Это связанные вещи, они идут рука об руку. \nСейчас я верю в то, булимия излечима, если заниматься этим вопросом и не притворяться, что ничего не происходит. Программа 12 шагов, хороший психолог или психотерапевт, который научит работать не с едой, а зависимостью. Потом - заново учиться есть: чувствовать голод и аппетит, разделять их, кормить себя полноценно и регулярно. Любить себя, находить и создавать новые причины, чтобы любить себя - это все процесс на годы, главное - это запустить его.",
    "final_title": "Год трезвости, Секта и жизнь без приступов",
    "final_annotation": "О периоде жизни с годом трезвости, когда Секта только-только появилась. О жизни без панических приступов, о том, как зависимость отступает, но не исчезает. Личная история о том, как строится новая жизнь, когда наркотики остаются в прошлом, а будущее только начинает проявляться.",
    "display_date": "2018-09-07"
  },

    "path": "data/ig_organized/long_200_md/2021-03-11.md",
    "source": "Instagram",
    "filename": "2021-03-11",
    "full_content": "По четвергам я пишу о зависимости. В начале января я писала, как отвезла подругу на реабилитацию. Думала - на две недели, но она решила остаться там на три месяца, чему я несказанно рада. Почему я думала, что она останется на две недели? У нее не было проблем с веществами, а алкоголь - это слишком легкая и очень социально приемлемая история, и всем кажется, что ничего в этом страшного нет. Но в зависимости употребение чего-то - это всего лишь следствие. Работать по 12 шагам помогает, когда ты умираешь внутри, чувствуешь пустоту, и пытаешься заполнить эту пустоту разными способами.\n⠀\nЧерез месяц у меня будет 9 лет трезвости и чистоты от любых веществ. О «12 шагах» и разных «анонимных сообществах», я узнала 13 лет назад. Я думала, что такое бывает только в кино, в моем любимом «Бойцовском клубе», но оказалось, что группы есть даже в Екатеринбурге. У меня тогда не было социальных проблем - я училась в универе, в который поступила сама, у меня уже была известная в наших кругах музыкальная группа, все считали меня классной, многие хотели дружить, я нравилась парням. Мне было весело пить с друзьями по выходным, я была уверена, что я могу жить без наркотиков - мое употребление было эпизодическим, скорее - форс-мажоры, что-то случайное, а в целом я считала себя абсолютно нормальной. Я никак не связывала свою булимию со всем этим, а постоянный клубок напряжения, обид и страхов внутри меня - это казалось мне структурной частью моей личности.\n⠀\nОбычно люди смотрели на меня и не догадывались, как больно мне внутри. И вот когда я случайно познакомилась с Никой (у нее тогда уже было чуть меньше 10 лет чистоты, как у меня сейчас), она разглядела во мне все это. Она никогда не навязывала мне помощь, просто она рассказала мне кратко о зависимости и о том, почему мне все это может помочь, если станет совсем плохо. И прежде чем обратиться за помощью, я прошла несколько циклов «я все могу сама», и потом, следующие годы я уже без сомнения пользовалась инструментами 12 шагов, потому что поняла, что сама я не могу.\n⠀\n(Продолжение в фото) #12шагов_olymarkes",
    "final_title": "9 лет трезвости и помощь подруге попасть в реабилитацию",
    "final_annotation": "В начале года отвезла подругу на реабилитацию. Размышления о девяти годах собственной трезвости через призму помощи другому человеку. О том, что значит поддерживать кого-то на пути в выздоровление, какие чувства это вызывает, и как собственный опыт помогает быть полезной другим зависимым.",
    "display_date": "2021-03-11"
  },
  {
    "path": "data/ig_organized/long_200_md/2019-04-30.md",
    "source": "Instagram",
    "filename": "2019-04-30",
    "full_content": "Вот она, дата, важнее многих. Для многих зависимых юбилей чистого времени - это второй день рождения. Так же и у меня.\n⠀\nЯ считаю, что это день моей души. 7 лет без капли веществ, изменяющих сознание. Ни алкоголя, ни легких наркотиков, ничего. На этой медальке могло бы быть написано “Х”, но срывы, которые были на первых годах - это тоже важный опыт.\n⠀\nМногие люди могут употреблять наркотики и алкоголь, и это никак не влияет на их жизнь. Кому - то надо быть абсолютно чистым. Кто-то нормально живет и так, а кому-то нужна постоянная работа с личностью и характером. Поэтому уже 7 лет я пишу шаги - бесплатную терапию для зависимых людей.\n⠀\nМне важно говорить об этом, о моём пути и моём опыте, потому что есть люди, похожие на меня, и их не мало.\n⠀\nЕсли однажды вы почувствуете себя зависимым - от наркотиков, алкоголя, людей, еды - знайте, есть 12-шаговые группы, которые помогают понять причины своего поведения и перестать страдать. Это бесплатно, анонимно и добровольно от начала до конца. Ты идёшь по этому пути сам, но никогда не чувствуешь себя одиноким.\n⠀\nPs: в комментариях много вопросов, как найти группы. Ищите в интернете «Анонимные Наркоманы», «Анонимные Алкоголики», «Анонимные Созависимые», «Анонимные Переедающие», «Анонимные булимики и анорексики», есть ещё сексоголики, игроки, депрессивные и другие группы взаимопомощи. Ищите в своём городе собрания, приходите на них. Сейчас так же есть группы в скайпе, их тоже можно найти в интернете.",
    "final_title": "Юбилей чистого времени - второй день рождения",
    "final_annotation": "Для многих зависимых дата начала трезвости важнее биологического дня рождения. О традиции отмечать годовщины чистого времени в сообществе. Размышления о том, почему эта дата так значима, что она символизирует, и как празднование помогает осознать пройденный путь. История о ценности каждого трезвого дня.",
    "display_date": "2019-04-30"

    "path": "data/lj_export_clean/posts_md/2011-11-21__71404__-_переверните_паттабхи_джойса_на_спину.md",
    "source": "LiveJournal",
    "filename": "2011-11-21__71404__-_переверните_паттабхи_джойса_на_спину",
    "full_content": "- переверните Паттабхи Джойса на спину!!\n\nУ меня есть друг, можно даже сказать брат – мы лежали с ним вместе в рехэбе под Екатеринбургом несколько лет назад. Я, 20ти летняя пигалица и он – чувак из Тагила уже за 30, минимум десять из которых он ебашил по вене, вряд ли когда-нибудь стали общаться в другом месте.\nНо там мы стали по-настоящему близки – иначе и не бывает на войне… И у каждого из нас был свой враг. Он не верил в Бога, а я слишком сильно верила в то, что смогу сама со всем разобраться…. С нами были еще люди там, но они, кажется, заторчали потом. А Виталик – нет. Он вернулся в Тагил и открыл первую группу Анонимных Наркоманов там – я даже ездила на своей старой восьмерочке на ее открытие, это была первая далекая поездка за рулем, еще и такого драндулета. Еще он женился и у него родилась дочка. Ей уже скоро годик…\nИ он пишет мне: «Мне кажется, что мы живем в разных измерениях. У тебя жизнь быстрее, что-ли…»\nЯ только усмехаюсь - и меня кроет мурашками от радости, что мой брат идет теперь по своей жизни семимильными шагами, наверстывая упущенное. И у него теперь есть семья, и он ЖИВОЙ…. Это ты живешь быстро, бро. А я…\nМалышка на миллион, которая празднует день рождения, хуяча по груше со всей дури. Меняю за неделю по десять городов, мои вещи раскиданы по разным квартирам в Москве и Питере, и я даже примерно уже не знаю, что у меня есть кроме того набора, что в чемодане.\nМузыка музыка музыка.. Еще у меня есть один друг – не побоюсь этого слова )) Вы можете часто видеть его в комментариях к этому жж. Он говорит, что все это – тление напоказ, бесполезный культ моей личности, который рано или поздно закончится и я умру в муках и попаду в ад, и знаете – он прав.\nЯ уже давно на этом пути, и много раз собиралась сваливать – ну не чувствую я, что занимаюсь я нужным делом. Не чувствую я, что помогаю людям. Ну да – пишут что песни делают их жизнь лучше, но делают ли они лучше их самих?\nМеня гнало по этому пути невиданной силой, розгами и железными тисками на сердце, который заставляли меня оставить все больше и больше вещей, очищаться – и вот появилась йога, и секта – здесь все мои знания и опыт оказались реально полезными,,,, И даже не обязательным мне оказалось идти колотить табуретки, чтобы приностить людям радость и пользу. Я пошла преподавать йогу и меня вскрыло..\nЯ научилась читать людей, чувствовать их, раскрывать и вытаскивать на новый уровень восприятия себя, своего тела и души… Сложно это объяснить, но вот смотрите: ни одну из благодарностей по поводу музыки я не могу принять на свой счет, а вот эти счастливые глаза… И когда они подходят ко мне и говорят: «Оля, мне так хорошо просто в твоем присутствии! Оно дает мне силу. Ты вдохновляешь меня…» меня от счастья просто подкидывает. Я чувствую, что им не нужен мой идеализированный образ – рядом со своими учениками я всегда бесконечно настоящая. Я считаю, что изначально нужно принять свою природу, свою козлиную личность – и только когда ты будешь собой, ты сможешь начинать поступать по-новому, поступать лучше.\nКогда я преподаю и у людей получается, я чувствую себя на своем месте. Чувствую себя безгранично счастливой. И спасибо моей любимой одногрупнице Ане Шубиной за то, что она осуществила эту мою мечту – построила Дом Солнца на море, куда я могу приезжать к своим ученикам и полностью погружаться в практику.\nпосмотреть на успехи моих учеников )",
    "final_title": "Переверните Паттабхи Джойса: йога и путь к трезвости",
    "final_annotation": "О друге-брате и йоге как способе выживания. История о том, как практика помогает справляться с зависимостью, и о людях, которые остаются рядом в самые сложные периоды. Размышления о том, как физическая практика меняет не только тело, но и сознание, давая инструменты для работы с собой.",
    "display_date": "2011-11-21T09:52:00+00:00"
  },
  {
    "path": "data/lj_export_clean/posts_md/84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм.md",
    "source": "LiveJournal",
    "filename": "84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм",
    "full_content": "почему надо выходить замуж за бандитов а не за свою космическую любовь (или письмо лизе сидориной)\n\nСидорина спрашивает меня: почему. И вот пока я лечу от Москвы до Питера у меня есть немного времени.. Постараюсь тебе объяснить, Лизочек.\nКосмическая любовь - она для космоса. Она для вдохновения, для новых песен, для того, чтобы чувствовать всю глубину, силу и боль бытия. «Это все понятно» - скажешь ты, и будешь абсолютно права. Но есть еще кое-что. Мне кажется, что она не совместима с жизнью. Не совместима с реальностью, с грубым миром, с твердым миром, с миром вещей, всех остальных людей, миром жэка, паспортного стола, налоговой, мудака соседа, который делает ремонт после 23:00, психа, который следит за тобой и пишет всем твоим и прочего вполне себе некосмического дерьма. А если она совместима - то это уже не космическая любовь, а вполне земная. Я даже думаю так - космическая любовь несовместима с сексом. Потому что секс - это очень земная штука, а наше тонкое тело - не очень. И можно, конечно, все совмещать, но на практике и по факту это мало кому удается, особенно в долгосрочной перспективе.\nЧто касается бандитов. Ты тут спросила меня про Сергея Бодрова, типа не мой ли это гипотетический идеал. А я в этот момент как раз пялилась в глаза Марка Рентона, нарисованного Гордеем, и сказала тебе: «Слушай, ну Сергей все равно был творческим человеком.. А вот Данила Багров - это тот самый типаж». Потому что сложно найти что-то более привлекательное, чем простой парень, который умеет обращаться с оружием и решать вопросы с людьми, сильнее, богаче и влиятельнее. Нет ничего круче характера, который проявляется в реальных делах в этом, твердом мире. Ну что я тебе рассказываю? У меня были и творческие, и космические, но когда дело доходило до каких-то реальных вопросов, где надо было врубить мужскую ответственность, врубалась она быстрее у меня.\nА еще говорят, что это я такая типа телка с яйцами, которая не может играть фэйр плэй. Да нифига, я много могу сама, но не все. И я очень беззащитна во многих вопросах, и иногда хочу на ручки и ничего не хочу решать. Пусть мой мужчина разбирается. И с одной стороны очень дисциплинирует и воспитывает, когда ты все сама, все сама, а твоя космическая любовь только дарит тебе глубину бытия, наполняя тебя силами для всех твоих свершений. Но вот нихуяшечки я не считаю это идеальным раскладом.\nНу и про Рэнтбоя теперь, почему я питаю к нему такую нежность. Его круто рассматривать в контексте остальных персонажей, и только тогда можно увидеть все оттенки - боюсь описать у меня получится крайне топорно, но надеюсь суть ты поймешь. Во-первых зависимость - это с одной только стороны чума и проклятие. Зависимый человек - это система, которая работает определенным образом. И являясь сама зависимым человеком, я всегда предпочту totally addictive\nчеловеку, который может контролировать свою жизнь. Любой контроль - это всего лишь иллюзия, и большинство людей сидят в ней по уши. Зависимый человек знает, что он бессилен. И 12 шагах принять бессилие - это самый первый шаг. Большинство людей никогда не сделают его, и мне их даже отчасти жаль по этому поводу. Рэнтбой - он абсолютно бессилен, и так в этом невероятно мил.\nИ если смотреть постфактум\n- не было плохих периодов, все придумано для чего-то. Когда ты на системе, все в мире относительно. Это даже чем-то похоже на триатлон, только в торче никто не оценит твоих ежедневных подвигов, ибо совершаешь ты их во имя зла, самоуничтожения и тотального деструктива. Но! Ты их все-таки совершаешь, и навыки остаются, и мышление, и границы возможного. Этика как раз таки всегда заложена в характер - и тут у Рэнтбоя как раз все в порядке, с этим. Торчать можно по-разному, и у каждого свое дно. Ну и вообще у большинства людей в моем окружении все в порядке с жизненными принципами, это чтобы ты не думала что абсолютно все бывшие торчки - хорошие. В трезвости зависимые люди тоже бывают редкостными мудаками, и в торче бывают люди хорошие, так что это я не про всех.. Про отдельных людей скорее.\nТак вот, такие люди привыкли надеятся только на себя, но кстати параллельно могут решить и твои вопросы, если ты будешь нуждаться в помощи. Ну и что касается всего остального - помнишь, как Данила Багров вытаскивал эту рашн проститьют Мэрелин? Вот как-то так надо, чтобы человек относился ко всем, кто слабее его. А не только к самым родным. Мужчина чувствует, что если не он - то никто. И просто делает. И знаешь, на самом деле мир полон таких мужчин - только мы с тобой телочки из творческой среды, и как раз здесь их остро не хватает.\nВ детстве моими героями были Робин Гуд и Д’артаньян, со временем в эту историю добавилось много чего еще, начиная от двух высших заканчивая умением делать инъекции, пиздить людей голыми руками и метко стрелять от бедра. Сочетание силы и бессилия, преобладание реального над космическим, но при этом - духовность, основанная на встроенных аспектах характера. То есть не напускная и вышколенная доброта, учтивость и бла бла, а что-то такое, чего человек сам в себе не видит и не осознает, но оно присутствует и очевидно всем окружающим.\nНу и в конце этой истории надо отдать дань и космической любви тоже. Love is not a crime. Преступление - это каждой своей космической любви стараться придать земную форму, пытаясь убить сразу двух зайцев. Помнишь фильм, который мы смотрели сегодня? Так вот, я думаю что эта брюнетка была права: «You totally fucked up, Margo» - потому что все границы только в нашей голове, и они лишают нас счастья чувствовать сразу все: мы разрешаем себе только одну форму любви - вытекающую в обладание. Хотя есть и другие способы. Стоять, и ничего не трогать… В моей жизни были такие встречи, такие люди - и самым чистым образом, через абсолютную, божественную любовь они дотрагивались до моего сердца. И знаешь, я потом уже поняла - люди разные, а космос - он один. И когда мне что-то попадает в сердце, я преклоняю колено перед Богом, а не перед человеком, через которого он мне является. Потому что если опуститься на колени через человеком, вряд ли он будет вести себя корректно - скорее всего, он офигеет от такой чести -\nи будет прав. Нечего путать понятия, моросить и все такое. Любить космос и любить человека - это все таки разные понятия. И вот когда ты встретишь человека и полюбишь в нем человеческое - ты поймешь, о чем я говорила. И, кстати, ему не обязательно быть бандитом. Это я вообще пошутила, если что)\np.s.\nхочу запомнить эту неделю, когда мы ложились в 5 утра, как будто нам всем по 19 - сводили песни, монтировали клипы, смотрели фильмы с Бодровым, пили чай и выбирались из дома только в сааааааааамой крайней необходимости: в кафе через дорогу, на съемку, на студию, на концерт, в перекресток за… ну, короче.\nесли жизнь проходит, то в эту секунду я чувствую, что проходит она правильно. я вижу внизу огни Питера, за сим заканчиваю свое письмо, и до встречи завтра",
