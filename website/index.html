    "full_content": "2024-10-20 — жизнь засосала прямом переносном смысле\n\nЖизнь засосала) в прямом и переносном смысле.\n\nКогда долго не пишешь, накапливается ту мач и не знаешь что выгрузить. Что радует, что беспокоит, что произошло сегодня/вчера/за неделю. О чем думала, что чувствовала.\n\nЯ думала о том, какие качества от меня наследуют дети. Вадим предложил свой вариант: Ежи - любовь к друзьям движухе и невозможность сидеть на месте, при этом способность все успевать и даже сделать домашку за неделю за пару часов. Мирон - творчество, предпринимательский ум и чувствительность. «А Рома… твою агрессию пожалуй!» . Ржу, на самом деле Рома - это прям Вадим, но с моей импульсивностью)))\n\nЯ чувствую, что у меня очень много энергии и на этом вообще все строится. У меня больше энергии чем у всех, кого я знаю. И она выплескивается на разные сферы жизни - сколько держать процессов, проектов, людей в управлении - это оказывается не все могут, даже если им дать это и сказать: ну все, действуй. Так же не все могут генерить идеи, создавать продукты, а еще долго работать с ними, улучшать, а не бросать что-то после первых сложностей.\n\nОткуда это у меня - фиг вообще знает. В какой момент вызрело, что повлияло - я не могу сказать. Но 100% трезвость стала переломным моментом. Я не говорю, что у всех так, но именно у меня употребление и обслуживание своего внутреннего демона съедало всю энергию, которая рвалась наружу. Мне было сложно оседлать этого дракона и научиться на нем летать, но вот сама трезвость и 12 шагов в этом помогли.\n\nЯ смотрю даже на серфинг, как тут проявляется и раскрывается мой характер, как я взаимодействую со сложным, со страхом, с умением анализировать, с эмоциями - это так интересно себя через это осознавать. Во мне много нейтральности, умения не думать ни хорошо ни плохо о явлениях, а скорее рассматривать их бытие с разных сторон.\n\nЧувствительность моя - это про грустить о мелочах или о том, чего я не могу изменить. О людях, которые не рядом, о тех, с кем я в ссоре. Что я ценю каждый день? То, как мои близкие счастливы и я могу быть свидетелем маленьких моментов этого счастья. И еще я очень люблю индонезийцев. Я просто люблю смотреть как они живут и работают и отдыхают. Все остальное - галочки, галочки, галочки на чек листе. Мне говорили когда-то получишь диплом, снимешь квартиру, станешь самостоятельной - вот тогда радоваться можно. Потом говорили что надо выйти замуж, родить, сделать бизнес. Потом говорили что надо разные источники дохода. Потом говорили что надо понять, что ты сам хочешь на самом деле. Потом стали говорить, что нужен какой-то другой паспорт, и вот тогда можно будет радоваться\nПодвох сразу был понятен, но я подумала, что не буду бунтовать против галочек. И правда, еще ни разу не пожалела о достигнутом, и о том, что в процессе получалось радоваться, и не откладывать радость на потом.\n\nЖизнь такая красивая и такая хрупкая. Хочется успевать радоваться каждый день, иногда вопреки всему даже. Такое вот у меня сегодня родилось.",

    "full_content": "Как поддержать человека после реабилитации?\n⠀\nСамое главное - это новая среда. Если человек вернется туда, где пьют/употребляет - даже после года в реб.центре ему будет сложно удержаться.\n⠀\nМне в свое время очень помогло, что мои друзья перестали употреблять даже алкоголь, чтобы поддержать меня в первые годы трезвости. Да, алкоголь - это тоже наркотик, и для зависимого человека необходима полная трезвость, поэтому никаких «ну бокальчик-то тебе можно!». Мои друзья были готовы растерзать каждого, кто предлагал мне алкоголь.\n⠀\nЧеловеку после реб. центра надо посещать собрания - первые годы особенно. Зачем? Во-первых, чтобы впитывать опыт других зависимых, во-вторых для создания новой среды общения, новой нормы, где люди работают с эмоциями в трезвости, а не глушат их. Собрания - это не веселье, это - труд. И сначала человеку нужна поддержка, чтобы была возможность посещать эти собрания.\n⠀\nЧеловеку после реб.центра нужна вера. Он сам может быть атеистом, вся семья/друзья могут быть атеистами, но никак нельзя обесценивать эту часть выздоровления от активной зависимости. Можно не говорить слово «Бог», можно говорить «вселенная» или «высшая сила», важно знать, что зависимому нужен внешний конструкт, на который можно положиться, обозначая свое намерение оставаться в трезвости. У зависимых не работает сила воли, но если они будут полагаться на внешнюю силу, то у них все будет получаться.\n⠀\nЭто сложная концепция бессилия и веры, но она работает для миллионов завсисимых уже десятки лет, поэтому задача близких - это не высмеивать и не обесценивать (даже если человек сам пытается это сделать) а попытаться понять эту часть программы.\n⠀\nКогда человек выходит из реб.центра - ему надо научиться простой работе, полагаться только на себя, не ставить перед собой сложных задач и не брать ответственность за других. Нужен годик-другой, чтобы окрепнуть, утвердиться. Хорошо, если человек будет стремиться помогать в работе по дому, выстроит себе рутину - простые повторяющиеся действия на каждый день. Тогда через какое-то время он заново научится «ходить» и быстро наберет силы.\n⠀\nЭто все - исключительно мой опыт, мнение и видение. Точно не истина для всех, но то, чем я хотела поделиться.",

    "full_content": "2022-09-14 — сутки спустя после всех ваших комментариев пишу\n*From*: Вы все живёте неправильно\n\nСутки спустя и после всех ваших комментариев пишу чтобы поделиться выводами. Реально, много углов вы мне подсветили, и это было полезно.\n\n 1. Про зависимость. Это наверное ключевое. Я давно не хожу на группы - а именно эта часть всегда даёт мне самую большую стабильность. Когда хожу регулярно и пишу шаг - становлюсь практически неуязвимой - то есть меня очень мало вещей триггерит, и практически ничего не сваливает в такую долгосрочную яму.\n\nОбострение зависимости - это про болезненную чувствительность от всякой хуйни. Вот ты не планировал расстраиваться, а тебя вынесло на пол дня или на сутки по какой-то совсем нелепой причине. И это сначала случается раз в месяц, потом раз в неделю, потом каждый день. И вот я вспоминаю что до 12 шагов я так жила - меня постоянно все трогало и задевало и я просто жить нормально не могла. Как минное поле.\n\nКстати песня Joshua Tree Bird об этом состоянии\n\nУ меня есть птица даже две\nРядом с сердцем, другая правее\nНо не работает защита от тех, кто попадает прямо в цель\nВ меня столько попадает вещей - и мне потом плохо.\n«Да ты смешная»\n ⁃ Но я слишком много чувствую, выпала из сна и снова пусто, Так я от себя устаю. Омут. От хаоса до Ома, на расстоянии руки.\n\n 2. Болезненное эго, эгоцентризм, желание власти, плавающая самооценка - это все туда же, в матрешку зависимости. Именно так и выглядит обострение. Но так же классно вспоминать те состояния, когда у тебя такая внутри благодарность, изобилие, что ты вообще ничего не принимаешь на свой счёт. Я это состояние помню и его хочу. 3. Что обо мне подумают, почему рекламировать плохо и тд - подумала на этот счёт. Да мне действительно хочется быть понятой правильно. То есть мне ок что кто то меня ненавидит/бесится от меня такой какая я есть, но вот если кто то подумал обо мне что я делаю это ради денег, а я на самом деле делаю не ради денег - это мне обидно. При этом ради денег делать что-то тоже ок. Просто вот это «меня неправильно интерпретируют» мучительно. А в идеале хочется чтобы было все равно. 4. Точно присутствует обида на себя, на ситуацию, на стол и Веру, но разбираться с ней я буду сама, в том плане что зависимые обиды не лечатся даже если кто-то захочет успокоить, они не из-за других возникают, а из-за внутренней этой болезненной интерпретации реальности не в свою пользу. 5. Точно не присутствует тема «ах могли бы больше на благотворительность собрать а теперь другой промокод». В этом плане я в финансовом плане радуюсь когда близкие зарабатывают, и это даже больше кайф чем благотворительность. Мне не легко допустим отдавать деньги незнакомым фондам в которых я не знаю что куда идёт, а друзьям гораздо проще. И рекламу делать друзьям я люблю просто так. Севаре например. 6. Что именно задело? Я ощутила как будто теперь что не смогу писать про стол, потому что это будет не мой экслюзивный контент, а какой-то массово-рекламный, и что этот облом внутренний произошёл не из-за какого-то левого человека, а в контексте кого-то близкого. То есть жалко контент, который почему-то теперь не хочется делать. Нормально, что Вера начала рекламировать стол. Не нормально, что мне при этом расхотелось. Наверное изначально мотивация у меня была какая-то туманная. Спасательно - эксклюзивнеческая. В этом плане финансовая просто заработать с них денег возможно была бы честнее и проще. Ребятам со столами хочется максимального процветания, и я уверена что многие блогеры могут с ними сотрудничать, влюбляться сами и влюблять аудиторию.\n\n 7. Ну и возвращаясь к началу - контент сам тоже не мой, это вообще Димин стол и его сетапчик, его привычка работать стоя со всякими фишками. Он мне все показал, он мне отдал этот стол, перекладину, подушечки, а я так проперлась что это открыло во мне рекламную чакру и я впервые в жизни взяла такое партнёрство. И вот в идеале я думаю, что надо сделать Димин промокод и я с удовольствием буду рекламировать этот стол с его промиком и каждый раз говорить спасибо за то, что он открыл для меня этот новый мир в работе).",
    "final_title": "Сутки спустя: реакция на комментарии",

    "path": "data/vi_vse_nepr_export/posts_md/2025-01-10__255__первые_4_часа_полета_прочитала_300_страниц.md",

    "full_content": "2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*From*: Вы все живёте неправильно\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давало мне поддержку в трезвости, но не давало душевного покоя.\n\nВ 24, после рехаба (который состоялся после срыва - 2 года чистоты и снова отчаяние, что надо начинать с нуля), начала собственно работу по «руководству» 12 шагов. Каждый шаг содержит несколько десятков вопросов, на которые ты отвечаешь примерами из своей жизни, и потом зачитываешь их «спонсору» - волонтеру из программы, у которого опыта больше, чем у тебя. Спонсор дает тебе обратную связь. В «Эйфории» классно показаны отношения Ру и ее спонсора.\n\nЯ написала все 12 шагов, причем дольше всего я писала 4й шаг (4 года) и раздел «обиды» - он занял у меня около 3х лет. Это самая мощная в плане дисциплины и усидчивости терапевтическая работа, которую я проделала в своей жизни. Это исцелило меня от многих навязчивых состояний, которые меня преследовали - прежде всего от болезненных реакций на взаимодействие с миром. Пока я писала шаги - случалось некоторое дерьмо во всех сферах жизни, и все это было отличным полигоном для практики и рефлексии. И когда меня спрашивают, что в жизни дало тебе самый большой буст, я отвечаю: трезвость и шаги. Причем первые 6 лет трезвость без шагов работала плохо, мне надо было разобраться с причиной моей зависимости, чтобы перестать жить ту жизнь, которая доставляла мне боль.\n\nПервый терапевт у меня появился после развода. Я начинала тогда отношения с Вадимом и была в ужасе от перспективы потратить годы жизни прекрасного человека и в итоге как обычно все разрушить, разочаровать его и себя, повторить свой дурге-цикл и остаться с ощущением, что всё говно и я говно. Смешно, что тут вспомнила свое стихотворение школьных времен:\n\n «Брачо ходит злой.\n На дворе зима.\n Люди все говно.\n Да и я сама»\n\nПервый терапевт мужчина неплохо так меня поправил, во-первых я поняла, что для брака моего я сделала очень много, и что не все в отношениях зависит от меня, и все может быть прекрасно, а может и не быть, но в любом случает само по себе имеет смысл, как и то, какая я во всех своих травмах и компенсациях и есть то, в числе прочего, за что меня любят и хотят со мной быть. Я перестала демонизировать и отвергать свою дурге-часть, оставила тревоги и позволила счастью личной жизни быть со мной в моменте, а в терапии перешла к проблемам на работе. Почувствовала, что мой терапевт от этих тем скучает и нет у него такой страсти к этой теме, и это стало толчком для смены терапевта.\n\nПоследние лет 6 я в терапии с опытной женщиной, кандидатом наук и по моим ощущениям очень классическим системным терапевтом. В эту терапию я зашла с непринятием своей жесткой части. У меня была такая метафора: я хочу быть Белоснежкой, а на самом деле я злая королева. В соц сетях я играю в «свет мой зеркальце скажи», постоянно присутствую своей хорошей частью, а плохую стыдливо прячу, я не хочу быть жесткой, я хочу быть мягкой, я хочу быть доброй, я хочу, чтобы меня все любили, а меня не любят и я их за это ненавижу, и себя ненавижу. У меня не было границ на работе, я все принимала очень лично, с сотрудниками я часто была в позиции маленькой девочки и хотела их одобрения, я страдала заискиванием и пипл-плизингом, при этом тень прорывалась заскоками, истериками, жестокостью и неадекватными поступками, за которые я потом себя винила. То есть я понимала, как бы я хотела себя вести и каким боссом я хотела быть, но почему-то у меня не получалось. Я играла роль, с которой я не справлялась. Носила маску из которой торчала неприглядная тень. Это все бесило и создавало лав-хейт отношения с работой.\n\nЛонг стори шорт: эта терапия создала вау-эффект. Вот когда я читаю книги Ялома, мне хочется написать и про мой процесс, а еще лучше - узнать, как это было с другой стороны, как терапевт видит нашу работу.",
    "final_title": "300 страниц за 4 часа полета: погружение в чтение",
    "final_annotation": "В самолете за первые 4 часа полета прочитала 300 страниц. О состоянии полного погружения в текст, когда время останавливается. Заметка о том, как в отрыве от обычной жизни - в самолете, вне интернета и суеты - возвращается способность читать глубоко и долго. Радость от этого почти забытого опыта.",
    "display_date": "2025-01-10"

    "full_content": "2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*From*: Olymarkes Daily\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давало мне поддержку в трезвости, но не давало душевного покоя.\n\nВ 24, после рехаба (который состоялся после срыва - 2 года чистоты и снова отчаяние, что надо начинать с нуля), начала собственно работу по «руководству» 12 шагов. Каждый шаг содержит несколько десятков вопросов, на которые ты отвечаешь примерами из своей жизни, и потом зачитываешь их «спонсору» - волонтеру из программы, у которого опыта больше, чем у тебя. Спонсор дает тебе обратную связь. В «Эйфории» классно показаны отношения Ру и ее спонсора.\n\nЯ написала все 12 шагов, причем дольше всего я писала 4й шаг (4 года) и раздел «обиды» - он занял у меня около 3х лет. Это самая мощная в плане дисциплины и усидчивости терапевтическая работа, которую я проделала в своей жизни. Это исцелило меня от многих навязчивых состояний, которые меня преследовали - прежде всего от болезненных реакций на взаимодействие с миром. Пока я писала шаги - случалось некоторое дерьмо во всех сферах жизни, и все это было отличным полигоном для практики и рефлексии. И когда меня спрашивают, что в жизни дало тебе самый большой буст, я отвечаю: трезвость и шаги. Причем первые 6 лет трезвость без шагов работала плохо, мне надо было разобраться с причиной моей зависимости, чтобы перестать жить ту жизнь, которая доставляла мне боль.\n\nПервый терапевт у меня появился после развода. Я начинала тогда отношения с Вадимом и была в ужасе от перспективы потратить годы жизни прекрасного человека и в итоге как обычно все разрушить, разочаровать его и себя, повторить свой дурге-цикл и остаться с ощущением, что всё говно и я говно. Смешно, что тут вспомнила свое стихотворение школьных времен:\n\n «Брачо ходит злой.\n На дворе зима.\n Люди все говно.\n Да и я сама»\n\nПервый терапевт мужчина неплохо так меня поправил, во-первых я поняла, что для брака моего я сделала очень много, и что не все в отношениях зависит от меня, и все может быть прекрасно, а может и не быть, но в любом случает само по себе имеет смысл, как и то, какая я во всех своих травмах и компенсациях и есть то, в числе прочего, за что меня любят и хотят со мной быть. Я перестала демонизировать и отвергать свою дурге-часть, оставила тревоги и позволила счастью личной жизни быть со мной в моменте, а в терапии перешла к проблемам на работе. Почувствовала, что мой терапевт от этих тем скучает и нет у него такой страсти к этой теме, и это стало толчком для смены терапевта.\n\nПоследние лет 6 я в терапии с опытной женщиной, кандидатом наук и по моим ощущениям очень классическим системным терапевтом. В эту терапию я зашла с непринятием своей жесткой части. У меня была такая метафора: я хочу быть Белоснежкой, а на самом деле я злая королева. В соц сетях я играю в «свет мой зеркальце скажи», постоянно присутствую своей хорошей частью, а плохую стыдливо прячу, я не хочу быть жесткой, я хочу быть мягкой, я хочу быть доброй, я хочу, чтобы меня все любили, а меня не любят и я их за это ненавижу, и себя ненавижу. У меня не было границ на работе, я все принимала очень лично, с сотрудниками я часто была в позиции маленькой девочки и хотела их одобрения, я страдала заискиванием и пипл-плизингом, при этом тень прорывалась заскоками, истериками, жестокостью и неадекватными поступками, за которые я потом себя винила. То есть я понимала, как бы я хотела себя вести и каким боссом я хотела быть, но почему-то у меня не получалось. Я играла роль, с которой я не справлялась. Носила маску из которой торчала неприглядная тень. Это все бесило и создавало лав-хейт отношения с работой.\n\nЛонг стори шорт: эта терапия создала вау-эффект. Вот когда я читаю книги Ялома, мне хочется написать и про мой процесс, а еще лучше - узнать, как это было с другой стороны, как терапевт видит нашу работу.",

    "full_content": "фак энд панч\n\nВообще-то у меня есть тайный жж, в котором отобранные методом придирчивого айкью тестирования ценители прикасаются к самому ценному, потому что сюда порой забредают бараны, от комментариев которых мне хочется убить себя фэйспалмом. Но я знаю, что есть здесь и такие, которые молчат - но им это нужно, как глоток воздуха.\nТак вот, с разрешения моего самого любимого писателя я покажу вам пару его текстов. Лютейший эксклюзив, наслаждайтесь.\nPizza time\nУх, как я не люблю вспоминать этот период жизни.Ты бы знал.\nЛадно. Я наконец-то запутался в своем вранье, и стало очевидно, что героин наконец-то победил мое желание заниматься интересными делами. Итог: я словно побитый пес живу у мамы, которая все чаще спрашивает меня, как долго я тут буду, и не хочу ли я наконец уже взять себя в руки пойти найти себе нормальную работу.\nМой внешний вид убог и жалок. У меня есть пятьдесят кило костей и кожи, а также прическа эйнштейна и рыжая борода. Я рассекаю по дому в зеленом халате: в одном кармане фурик и вата, в другом – баян двадцатка. Приехали.\nПравый рукав уже не сгибается от заскорузлой крови из свежих дырок от уколов. Я осознаю свое положение, но мой ебаный гений внутри говорит: - чувак это все хуйня, тебя просто не понимают.\nБлять, мало того, что от меня отвернулись даже малознакомые люди - мой барыга боится встречаться со мной.\n- Ты стал таким агрессивным и я боюсь поворачиваться к тебе спиной. Отныне встречаемся только на улице.\nЯ целыми днями сижу за монитором, клепая какую-то бесполезную хуйню, которую никто так никогда и не увидит. Диски с отснятыми материалами растут в аккуратную стопку, чтобы потом быть раскидаными и разломаными в приступе гнева и жалости к себе и своей бесполезности, когда кайф переданный мне через сигаретную пачку на ниточке, улетит за забор на стройку.\n- Ты должен найти себе работу.\nВодить машину – единственное, что я еще мог вменяемо делать. Я так думал.\n“Требуется доставщик пиццы”. Бля, говно. Я слишком охуителен для такого.\n- Ты на себя в зеркало посмотри, - говорит мама.\n…\n- Вредные привычки - не имею.\nТетка смотрит на меня с сомнением. Прячу руки под стол и ненавижу себя. Я нашел работу, но поделиться с этим не с кем. Все, кто меня знают - перехоят на другую сторону улицы. Я должен уже всем от Восстания до Фонтанки.\n- Смотри, здесь формируется заказ, и ты должен его за пятнадцаь минут доставить. Чаевые твои. Работа не пыльная.\nЯ и сам думал, что хуйня - но можно было быстро накопить на свои цели и отвалить.\nМолодой парень смущенно обьясняет мне кухню. Его лишили прав, и он вынужден искать себе другое занятие.\n- Главное – если нарушать, то осторожно. Сам понимаешь, что по этим пробкам…. блять, дебил ты смотришь куда едешь вообще?!! - мы прорываемся на Мойку через адовую пробку на маленьком и ушатанном дэу матиз - машине, которой суждено стать моим инструментом для добывания денег. Опять же - на доход барыг и в бюджет таджикистана или казахстана, смотря откуда привезен кайф.\n- На случай полной задницы есть мотоцикл. Права не нужны, все равно никто не остановит. Пойдем покажу-научу.\nИтак, я доставляю пиццу. Занятие странное. Ты оголтело едешь на адрес и там какой нибудь педик с кислым ебалом нехотя принимает у тебя коробку типа “не очень хотелось но раз привезли ладно”.\nОсобая статья - офисы.Там люди вырывают у тебя из рук еду и суют крупные купюры, лишь бы ты сьебал и не мешал им делать бизнес.\n- Сдачи не надо.\nСладкие слова. За день я успевал собрать сумму для того, чтобы напоить небольшую компанию в хорошем заведении. Однако, деньги применялись немного в другом направлении.\n- Сдачи не надо.\nУнизительная фраза, определяющая твое положение в этом мире. Твою никчемность и признание поражения в жизни.Тебе дают и ты берешь. Мне до сих пор не очень уютно, когда рассчитываюсь в заведениях и случайно говорю эту фразу. Это оскорбительно. Правда.\nОдин адрес мне очень нравился тем, что чувак постоянно был под кислотой и сделав заказ, через пару часов забывал об этом и делал его снова. Так повторялось до восьми раз за день. Я стал лучше выглядеть, так как регулярные иньекции, имеющие вид системы, приводят в чувство организм и не дают зеленеть, блевать и сраться на каждом углу.\nДождь заебал. На приемке скучно и идет обсуждение погоды.\n- Привет, че как. - голос барыги ленив и высокомерен, - я уеду через двадцать минут за город буду послезавтра, если хочешь чего взять приезжай сейчас.\nБлять. С Казанской на Восстания на машине не доехать.\n- Я возьму двухколесного прокачусь .\n- А, ладно, недолго только, скоро начнут вечерение заказы делать.\nЕбаное говно. Два урока езды толком не научили ничему. Главная подстава для меня в том, что я так и не усвоил где сцепление, а где тормоз. Ладно, времени нет. Не скажу, что мне понравилось ездить на мотоцикле.Может я просто торопился, а может дождь, который прошивал меня насквозь, портил картинку, не знаю.\nК Литейному я уже освоился и лихо повернул на него прямо с Невского, лавируя, чтобы выйти на жуки и домчать до адреса. Сделав поворот, я словил каких-то особо крупных капель, и практически ослеп. Запаниковав, начал хватать руками ручки, и вместо тормоза, естественно, выжал сцепление - остановки не призошло, случайно рванул газ, впереди стоял уаз пэтриот. Это было больно.\nОчень больно и обидно. Очнулся в луже с кровью. Железный конь лежал рядом, а надо мной стоял чувак и удивленно смотрел на мою голову.\n- Ни хуя. Твоя голова как колокол на всю улицу брякнула.Ты как живой-то остался? – недоумевал он.\nДилиньдилинь. Где эта трубка?\n- Да.\n- Ну ты идешь или нет? Я ждать не буду.\nСука, молча я встал на четвереньки и истекая кровью, сжав зубы, сначала полз по дороге, а потом хромал к заветному грамму, который стоил мне всего: моей проебанной жизни, достоинства, самоуважения, в конце концов этого ебаного мотоцикла. Но мне было похуй.\n- Ого,- барыга смотрела на меня испуганно. - ты где так?\n- Воду неси.\nЖадно курил и плакал от отчаяния, понимая,что выхода у меня нет, и то секундное удовольствие от прихода и есть самая главная цель для меня. Но, самое страшное, что оно не стоит на самом деле нихуя. Ни одной самой маленькой жертвы, которую я принес. Так зачем же я?\nМужик возился с передним колесом.\n- О, ты вернулся, смотри, все норм, я крыло выправил тебе, давай довезу, у меня пикап.\nЯ молча закатил искалеченный механизм на склад и пошел домой. В руке сжимал отсыревший порошок, перемещанный с собственной кровью. Забыть, забыть блять.\nНа следующий день в заведение пришел человек, который узнал меня, и сладким шепотом сообщил администратору о моей пагубной привычке. Был неприятный разговор, я сдал ключи и отправился… Не знаю куда я отправился. Даже такая бесполезная ебаная работа и та была не для меня. Все это принимало какие-то странные контуры, и в поиске ответа я дознулся дома на кухне.\nМеня нашел муж мамы и ему потребоавалось немало сил, чтобы восстановить мне дыхание. Я даже не сказал ему спасибо, а просто сидел на подоконнике, как в детстве, и смотрел на башню с часами. Впереди было еще три года.Три года потерь и движения к концу.\nDogz\nДоброе утро. Я говно. Не то,чтобы это стало новостью для меня.\nБудь я сраным фотохудожником, ходил бы сейчас и делал эпические портреты людей с зонтами. У нас в районе весь день идет гаденький такой дождик. Вроде и капель не видно,а все мокрое. От этого раздражаешься,потому что если дождь-так извольте дождь, а не этот насморк. Если снег, то, чтобы занесло по ангела на шпиле Адмиралтейства. А тут какие то полумеры, которые, как известно - нам не помогали.\nСегодня утром у меня одно из тех состояний, в которых я себе очень не нравлюсь. Однако, именно в таком состоянии мне довелось однажды находиться около двух месяцев. Круглосуточно.\n«Период отчуждения был не особо воспринимаем мною. В то время я уже находился на пути к первой реабилитации, а пока мне нужна была работа. Я пиздатый и гениальный, так почему же от меня все в стороны шарахаются. А, понятно, я наркоман.  Прийдя к такому выводу, наугад выбрал обьявление о работе.\n- Смотри, - маленький, коренастый еврейчик отчаянно жестикулировал и мечтательно поднимал глаза к небу - У нас три - ты понимаешь - три машины. Наша фишка, помимо того,что у нас две ветклиники - это перевозка животных. В чем плюсы: животным похуй на комфорт, они всегда трезвые и их хозяева как правило готовы платить сколько угодно, лишь бы ты довез их тварь куда требуется.\nМое лицо выражало следующее - НИЧЕГО.\n- А чаевых тебе будуть давать, мммм. - Моисеич затрясся мелкой дрожью, видимо сожалея, что чаевые будут платить не ему. - Плюс, как у сотрудника нашей фирмы, у тебя будет охуительная желтая жилетка.\nЭтот довод убедил меня, что надо оставаться. Вечером я был уже на работе. Вопрос «какого хуя я тут делаю» возникал все время работы в том заведении, но, еврейчик не спиздел, платили действительно хорошо и при моем зверском наркотическом аппетите я не успевал тратить деньги.\nСуть занятия заключалась в следующем. Помимо ебаной жилетки с псом на спине, я являлся владельцем серого пежо партнер. Ну что партнер, погнали на процедуры - вопрошал я каждый раз, собираясь за кайфом. В мои задачи входило всегда быть на связи, и даже ночью в максимально короткое время добраться до любой страждущей киски, собачки, пичужки, чтобы препроводить ее с почестями до клиники или выставки. Вот и все. Но,нюансов была тьма.\nНапример, время от времени мне в салон загружали полудиких волкодавов и я вез этих тварей в область охранять обьекты. Как правило, кроме меня не было никого в машине, так как этих монстров просто боялись, а за время пути несколько конфеток превращали зверюг в мягких пушистиков и обожателей людей. Поэтому,вместо рычащих охранников принимающая сторона видела виляющих хвостом бесполезных друзей человека.\nОднажды ночью поступил заказ и я, опаздывая на мосты, чуть не влетел в фонарь на повороте. Девочка в слезах и соплях стояла на улице под желтым светилом и рядом с ней стоял огромный аквариум. С половину меня в высоту с зеленой водой.\n- Моей рыбке плохо,нам надо отвезти ее в больницу. -\nна поверхности кверху брюхом плавало то, что осталось от глубинного обитателя.\n- Так он сдох. - вымолвил я.\n- Так и я не трезва, - вымолвила барышня.\n- Могу взбодрить,предложил я и угостил ее порошком,который она вынюхала прямо в машине.\n- Ну, что ж давай тогда пока.\n- Подожди. - Мы взяли большой камень и разьебошили этот чудо аквариум, дабы не тратить силы и не тащить его обратно домой...\n…\n- Доброй ночи, мой Марсик сломал переднюю лапку... - мерзкий,  дрожащий тойтерьер вызывал желание выкинуть его в окно, а его хозяйке хотелось прочитать лекцию о человеческой глупости и ее пагубном влиянии на организм... Марсик скулил и смотрел своими выпученными глазками вокруг...\n- Доброй ночи, мой Марсик...\nЭто повторилось через два дня и через неделю.Мерзкая гадина ломала себе лапы с завидным постоянством...\n- Доброй ночи...Что опять Марсик...Да...Дама, выбросите его в помойку.\nТуда отправили другого водителя... Отдельного внимания заслуживают выставки зверей. Хозяева породистых животных рубят бабки на происхождении и заклеймованных письках питомцев. Если бы питомцы знали об этом, революция была бы неизбежна. А так они вместе с хозяевами бегают по кругу и показывают спеам свою охуительную пушистость, вызывая восторг у первых и слезы радости у владельцев, то есть у вторых. Я жду, пока эта ярмарка тщеславия наконец закончится, чтобы погрузить коробки с мелкими собаками в авто и развезти их по домам.\n- Что я тут делаю. - Внеочередной укол в туалете заставляет на время забыть об этом... Мой телефон молчит уже второй месяц, звонят только на служебный, скоро я изучу язык зверей... Самое неприятное, это когда у тебя в машине умирает пес. Собака умирает благородно и с достоинством. Своим взглядом она словно извиняется, что доставляет неудобство и до последнего вздоха смотрит тебе в глаза. Как то раз я взял такого пациента. Белого бобтейла с раной в животе и торопясь развернулся на сплошной,мне очень хотелось довезти его до больницы.\n- Водитель номер остановитесь.\n- Сука.\nВальяжно и слегка приседая ко мне подошел дпсник.\n- У меня собака умирает,поэтому и нарушил.\n- Собака че освобождает от ответственности чтоле. - Тон был хамоват,и очень захотелось дать в морду.\n- Берите документы,делайте че там надо.\nЯ остался сидеть с псом и пока он не умер, держал руку у него на спине.\n- Ну, ты документы то возьми, извини, что так вышло.\nСлезы душили меня, я молча забрал свои права и поехал, куда, это уже не имело значения. Чем больше я узнаю собак,тем меньше мне нравятся люди. За это время я много видел животных,которых добрые люди обваривали кипятком, отрезали им лапы, выжигали глаза и творили прочие мерзости. Постепенно вопрос что я тут делаю перешел в другой - а зачем так все происходит. Воспаленный от постоянных уколов мозг отказывался принимать информацию и делать хоть какие то выводу. В свободное время я сидел на крутящемся табурете в клинике, запершись в лаборантской,  и вовсю использовал спиртовую горелку.\n- Иди сюда, помоги, тут пса на усыпление привезли. - Старый мастино неаполетано трясся и видимо понимал что сейчас будет. Хозяйка лила слезы в три ручья , - иди отсюда. - она с воем выскочиа в коридор.\n- Так, хороший, успокойся. -  изловчившись мы вкололи ему снотворного. Еще десять минут пес ходил, скулил и прикладывался на пол. В конце концов он заснул.\n- Теперь бери баян вон наполни той жидкостью...\nВсе эти сказки про то что животных усыпляют, и они умирают с улыбкой на морде - пиздеж. Усыпляют их так: сначала накачивают снотворным, потом колят в вену раствор содержащий всякую хрень, забивающую им артерии и сосуды сердца. Если животное не умирает, процедуру повторят. Единственный момент - все это происходит во сне. Но, в моем случае, пес жил еще полчаса. И ему было больно.\n- Все, иди, завтра в крематорий отвезешь.\nЕсть еще одна услуга в зоотакси - это собирать дохлый псов по городу и отправлять их на планомерное сжигание в печи. Я как раз годился для такой работы, ибо уже был похож на смерть и весу во мне было 45 а может 46 кг. Набив машину ароматными трупами, я решил завернуть к барыге и слегка взбодриться. Героин был адов, и добравшись до машины я понял, что если не посплю хотя бы час, то ближайшим адресом куда я приеду, будет стена дома во дворе.\nПсы были словно деревянные и мне пришлось потрудиться,чтобы соорудить из них некое подобие кровати. Запах уже не смущал, поэтому мы поспали заебись. Крематорий был к моменту пробуждения открыт,машину мне надо было отдать сменщику через два часа.\n- Простите мои дохлые друзья.\nВсе отправились в канаву, и я поехал проветривать автомобиль. Я уже написал, что благодаря этой работе как-то по другому стал смотреть на животных и людей. Однако то, как я успел опуститься за эти два месяца, довело меня до желания вздернуться. Глубоко ночью в дороге мой телефон зазвонил\n- Надо приехать в клинику и забрать.....только быстрее...где тебя носит...\nСтоп, дальше притворяться в то что я живу, сил не было. Я резко развернулся и поехал домой. Машину оставил у памятника Пушкину, позвонил сменщику и сообщил где можно забрать авто и деньги. Желтая жилетка отправилась в бак. Я собирался сдохнуть\n________________________________________\n_____\nСпасибо за внимание тем, кто еще умеет читать.",
    "final_title": "Фак энд панч: о тайном дневнике",

    "full_content": "null/ this is the eeeend\n\nУ меня болит голова. Очень сложно писать в таких нечеловеческих условиях, но тут уже требуют продолжения. Так вот, на чем я закончила? А, на грустном. Так вот, для полноты картины тут наверное надо представить себе все, начиная от бесконечных вопросов про развод - в аск.фм прежде всего, потому что лично спросить все боялись, до собственно временного контекста - это самые первые дни нового года, и тут начинают аккуратно анонимные братья задавать вопросы, типа «беспокоимся за твое выздоровление», и некоторые совсем уж близкие начинают песню из серии «дописала четвертый шаг и ушла в сухой срыв». Это когда ты типа не употребляешь наркотики, но весь такой в зависимом поведении. У всех, собственно, стоял один вопрос на повестке дня: почему я разъебываю свою жизнь. И тут должно было быть какое-то разоблачение, типа муж меня бил, или не любил, или я его не любила - потому что других историй не бывает, видимо. Но тут не так, мы жили душа в душу и любили друг друга, да и любим до сих пор. Но для того, чтобы жизнь шла дальше и шла хорошо - нам надо расстаться. Вот есть же какой-то такой момент переломный на пути,\nот стадии, когда люди любят друг друга и решают быть вместе и делать семью - и до другой крайности, где они ненавидят друг друга и терпят друг друга, или до измены, например. Вот если переломный момент наступает и до крайности еще очень далеко - это самое время что-то изменить, оставаясь честным в отношениях. Я хочу оставить эту историю чистой. Еще один шаг вперед - и этого уже не спасти.\nВ этой ситуации я не жертва, роль жертвы мне знакома и понятна, а вот к роли Дурге-разъебывающей-все я никак не могу привыкнуть. Что чувствовать? Сознание отправило меня в отпуск. Просто ничего, никаких чувств, и из интересов - только сноуборд, танцы и пожрать. Примитивно, как пиздец. Никаких лишних движений и мыслей - кажется что идешь по доске в кипящей лаве, и такой типа: все нормально, я просто иду по полу. Просто иду по линии на полу. Я не бухой, так что пройти по линии - это не проблема для меня. Потому что если свалится в эту лаву - начинаешь жалеть и себя, и множество вещей, которые ты разъебал, и все моменты, и все ритуалы, привычки, воспоминания. Просто нельзя об этом думать, потому что суть и правда не меняются. Я все правильно делаю, главное - не оглядываться назад.\nПоэтому мы танцевали. Сто лет не делала этого, честно говоря. Но потом этот странный плейлист на закрытии Мачт, концерт Сюзанны, потом просто Юнион, потом вся Конюшенная - «Молодость все прощает» на Танц. площадке, и стоишь под ней и ржешь. Потому что если молодость все прощает, то в 30 лет хахах, ой держите меня…\nПотому что в 30 лет ты сделал все, чтобы от тебя наконец отъебались со всеми этими вопросами - А что образование? А когда замуж? А дети? А когда за вторым? А квартиру-то свою покупать будете? Чтобы отстал весь социум, отстал от тебя, от твоих родителей, бабуль и дедуль, чтобы им было что соседям рассказывать. Подарила папе джип с огромным бантом на 50 лет, родила детей не отрываясь от производства, ебашила все - и музло с концертами, и лекции/тренировки по всему миру, и бизнесы всякие пробовала, нанимала/увольняла, ебашила по 12 шагам, чтобы крыша на месте была от всего этого дерьма, и аспирантура, и почему бы мать его IRONMAN не ебануть, у меня ведь так дохера свободного времени. Я все тащила, ничего не бросила. И вот теперь мне хочется чтобы все просто отъебались от меня (хотя на самом деле никто и не доебывался, кроме, собственно, меня самой, это я вам просто пытаюсь передать ощущение). Я ничего не хочу делать. Я просто хочу, чтобы моя голова отстегнулась от меня и осталась дома, а сама я пойду танцевать. Вот, чего я хочу. Конечно, сначала чувство вины немного отравляло мне вкус безалкогольного винишка. Чувство вины за то, что не читаю диссертации и не хожу в офис. Потом я вспомнила, что сейчас новогодние праздники… И мы взяли микроавтобус и уехали в Коробицыно.\nИ мы так танцевали каждый день, как в последний раз, или нет - как в тот раз в PV в Березовском на хэппи хардкоре. Мы танцевали на улице у машины, мы танцевали дома, в магазинах под любую музыку из колонок, на горе, пристегнутые к доскам, по дороге, в машине. Мы танцевали, потому что на самом деле это было самое волшебное ощущение. Когда тебе тридцать лет, и ты наконец-то от себя отъебался.\nВ это время я не писала музыку и альбом стоял на паузе. И Шапо тоже понимал что как-то немного не до этого сейчас. А вот Катя считает, что Алиса - это мощный эгрегор, десятки тысяч Алис воплощенные в этом образе пришли в мою жизнь и все разрушили. Зы считает, что я просто снимаю с себя кожу каждый раз перед таким релизом, который приходит не из головы. Юля считает, что это невероятно - то, что мы сделали… Сделали и не осознали, и что то, что я сделала со своей жизнью - я не осознала это так же, но энергетически все оказалось в балансе. Я принесла жертву и у меня получилось то, что получилось. Мир услышит это чуть позже, но пока я на самых последних неделях, и это ни с чем не сравнится. Об этом потом напишу, сейчас о другом.\nЯ хочу запомнить этот январь, как один из самых счастливых месяцев в моей жизни. Может быть, даже, самый счастливый. И это не связано с тем, что у меня все было хорошо. Нет, все было не так. Странным образом я соединялась эмоционально не с проблемами, которые вокруг меня были, а с правдой, которая победила и была в моем сердце. С какой-то чистотой намерения, с честностью. С пятым шагом, который я практиковала. Я танцевала без горечи, без страха, что будет дальше, не заботясь, что обо мне подумают. С ощущением, что я все уже сделала, сдала сессию, поставила все печати… Короче если вы хотите знать что-то важное про 30 лет - просто постарайтесь работать не выдыхая с 25, и тогда в 30 вы возможно узнаете, что такое настоящие каникулы.\nИ знаете что еще? Во всей этой истории нет никакого трагизма. Только любовь. Поэтому мне немного странно, когда меня жалеют или сочувствуют; Еще понимаю, когда анонимно пишут: «Желаю Андрею счастье и не с такой мозгоебкой, как ты», это хотя бы забавно. Знаете, мозгоебы и мозгоебки - это хотя бы весело. А уж прожить 5 лет душа в душу, будучи совершенно отбитыми и разными - это огромное счастье, гораздо лучше, чем найти себе какое-нибудь УГ и чтобы оно тебя терпело. Я думаю, что жизнь нужно праздновать, а не пытаться пройти ее на легком уровне. Но тут скорее дело вкуса.\nЧто касается будущего - понятия не имею, что там. Надеюсь меня с моими друзьями поместят в один дом престарелых. По крайней мере так я точно готова встретить закат жизни. Остальное пока не знаю.",
    "final_title": "This is the end: когда писать в нечеловеческих условиях",
    "final_annotation": "Пост, написанный в состоянии, когда болит голова и писать очень сложно. О попытках продолжать делать то, что важно, даже когда физическое состояние против. Метафора про \"конец\" чего-то и начало нового. Честность о том, что не всегда есть силы, но иногда надо писать именно через \"не могу\".",

    "full_content": "не про тебя, надеюсь\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и в свободное время я часто приходила туда бухать. Если помните, была у меня такая фотография - где я грустная в шапке и с тысячной бумажкой, положила подбородок на руки на барной стойке. Вот это оттуда.\nТам Ника рассказала мне про анонимных наркоманов. Я поржала, потому что не знала, что это дерьмо бывает в реальности - это же не мать его фильм про Тайлера Дердена. Потом можно следующий кадр - как я иду по дороге в Арамиле - это такой поселок недалеко от Екатеринбурга. Иду по дороге с какими-то тяжелыми пакетами и плачу от того, как мне себя жалко. Иду в свой первый реб.центр, сама, не потому что кто-то меня туда захотел положить, и даже не потому, что я проторчала все - нет..\nПросто боль была такой невыносимой, и я совершенно не знала с чего начать.\n- Ну как же я не буду бухать по выходным с друзьями в клубах?! Зачем вообще тогда жить, работать, терпеть всю эту херню которая в жизни происходит?\n- Не можешь не бухать - бухай, - сказала Ника. - Иди и бухай.\nИ я конечно пробовала без наркотиков, но с алкоголем. Я помню эти «восемь глинтвейнов, пожалуйста, четыре белых четыре красных». Еще до этого было реально такое лето, когда я смогла. Я бегала каждый день, я отлично выглядела - конечно это было тоже после неприятных событий, крайне неприятных. После очень нехорошего апреля и мая. Там был такой период, когда я очень напугала всех друзей. И вот в конце меня сильно тряхнуло, и я перестала. Там было два месяца абсолютной трезвости, просто чтобы доказать себе, что я могу. Чтобы снова почувствовать себя сильной, светлой, быть в себе.\nЯ до сих пор помню это путешествие: мы с Артемом проехали от Екатеринбурга до Анапы автостопом, жили в палатке на берегу. Потом я выпила бокал глинтвейна в уличном кафе Джемете и все - я вдруг не продолжила, не стала думать о наркотиках. Мне казалось, что я излечилась. Что я наконец-то полностью независимый человек. Но ха-ха-ха, святая наивность.\nНу и вот через месяца полтора эта картина: иду по Арамилю и плачу. И там меня встречает Ника и отводит в такой простой кирпичный коттедж, просто дом. Не больница. И вот там я аккуратно заглядываю в себя одним глазком. Я даже не ложусь в этот реб.центр. Я в него приезжаю, прихожу.. Делаю все, что делают пациенты, но как бы не сдаюсь совсем. Я ведь не такая, я особенная, я сильная, и не проторчала еще свою жизнь.\nВот помню что там я нарисовала такой рисунок: вот стою я, держу в своих руках много ответственности: группа, университет, работу, что-то там еще… А подо мной пылающая бездна. Помню, как рассказывала Нике, как у меня вообще-то нет проблем с наркотиками, зато есть со всем остальным, с восприятием тела, с моей реализацией, с моими недостатками.. Она только грустно усмехалась. Я ее понимаю, сейчас я тоже грустно усмехаюсь, когда смотрю в прошлое… Это было только начало, я вообще ничего не понимала тогда, не умела блять думать тупой своей головой.\nНе смотря на пять последующих лет, не смотря еще на один реб.центр в конце этого периода, я почему-то считаю, что я легко сдалась. Мне как-то очень сильно повезло, что я пошла в эту сторону, что из меня какой-то кувалдой жизнь не только выбивала саму возможность употребления веществ, но и заставила меня нырнуть в саму природу зависимости. К этому я и шла эти 5 лет - до 2012 года.\nКогда меня спрашивают, что такое шаги - я теряюсь, как отвечать на такое. Удивительные есть люди, которые начинают это делать, хотя жизнь не проезжается по ним катком. Возможно ли такое? Можно ли получить от них пользу, если ты хотя бы раз не причинил сам себе пиздец, близкий к смерти? Не знаю, чувак, не знаю, как рассказать тебе, что это такое, эти шаги..\nМожет быть попробуешь юнгианский анализ?\nНика до сих пор лечит наркоманов, вон открыла реб.центр. А я стала таким адептом трезвости, что люди при мне даже бухать стесняются. Кто бы мог подумать. Другая сторона реальности - она такая другая. Ты чёткий, как ретина, и уже забываешь как это - хотеть изменить этот факт. Но твоя личная бездна - она никуда не уходит, ты умеешь черпать из нее такие вещи… Короче, грущу я от того факта, что весь этот огромный опыт невозможно впихнуть ни в пост, ни в разговор, ни даже в книгу, чтобы показать, что решение любой моей проблемы на самом деле было в том, чтобы войти в реальность на 100% и осознать себя на 100%. А для этого нужно было не просто сохранять трезвость, для этого нужно было понять, почему я когда-то начала и продолжила изменять сознание. И это невозможно сделать простым размышлением. Для этого нужно работать по правилам. По правилам, которые ты готов принять, когда чувствуешь, что тебе полный пиздец. У кого-то пиздец не наступает до самой смерти, а кому-то больше везет. Но ты права, все это для чего-то нужно. И у каждого своя «ментальная горсточка». Видимо, я еще до этого целый черпак размутила, так, что мне еще на жизнь вперед хватит.",

    "filename": "2025-01-22__1253__приветики_столько_всего_хочется_написать_столько_идей",
    "full_content": "2025-01-22 — приветики столько всего хочется написать столько идей\n\nПриветики. Столько всего хочется написать, столько идей приходит в течение дня, но к вечеру остается мало сил на рефлексию.\n\nЧувствую себя сверх продуктивной. У меня в чате нового альбома 10 песен, в которых мне очень нравится главное: тексты. Мне осталось дописать один припев про который я думаю - нужен он вообще или нет? Сегодня одну песню слушала на повторе и просто не могла переключить. А песня про Таню наконец-то стала такая прямо танина, вся искрится.\n\nЯ много времени провожу в шкафу (где записываю вокал). А еще много ем. У меня ПМС и мне не очень нравится, как я выгляжу, и еще живот постоянно то ли полный, то ли bloated, но при этом все мышцы в тонусе и я чувствую себя спорт-машиной.\n\nВчера было смешно, мы гуляли на закате и я рассказывала про все, что я успеваю сделать - просто супер движение по всем проектам. И Дима с Вадимом угорали, что я должна написать песню про сверх продуктивность. Я сразу же предложила мою любимую фразу с которой я берусь за все, надо представлять ее в стиле дэдметал: «ЯЯЯЯ ВЫ@БУ ЭТИ ДЕЛАААА» - а потом мы подумали что надо выпустить альбом с 8 версиями этого трека в разных жанрах, от LoFi и реггей до металла) И везде одна строчка. Надо включать перед рабочим днем, чтобы все получилось сделать)\n\nИнтересно еще про хейт. Я вот не понимаю, это эффект терапии, Куприянова или всего сразу - но мне что-то в этом даже нравится. Раньше мне было сложно выдерживать волны негатива в мой адрес, когда не один человек, а прям много людей осуждают меня. Я могла плохо спать, тело было в тревоге. Сейчас вообще ничего такого нет (тут выходили всякие разборы на подкасты, юморист какой-то делал рилз, впервые можно сказать такое внимание от левых людей), и мне с этим нормально, я могу почитать даже самые оскорбительные комментарии, мне интересно). Вообще ушла иллюзия, что люди про меня что-то думают постоянно плохое, в основном люди думают о себе, а чужая жизнь их если и отвлекает от себя - то крайне ненадолго. Возможно, если бы я была еще честнее - меня осуждали бы еще больше. И у меня есть такая цель, открываться этому миру без страха, чтобы не влияло это мелочное желание чтобы меня все любили, чтобы оно не владело мной.\n\nПри этом мне кажется у этого захода в уязвимость есть и хороший эффект - я чувствую очень близкий контакт с моим читателем, с моей аудиторией. И это даже не про мои каналы - как будто даже к хейту и других комментариев много, и люди не просто защищают меня, они как-то очень круто пишут о своем мнении (например, что им не близка полиамория), но они знают меня давно и хорошо чувствуют и понимают, и нет причины загонять меня в привычные рамки - типа «дайте Оле жить, как она живет)». И многие пишут, что читают меня давно, и слушают мои песни, и что в целом ничего нового - я давно ищу ответы на все эти вопросы и пытаюсь быть честной, и делюсь этим со всеми, кто читает.\n\nА так день хороший. Серфинг, тренировочка, закат - все было, не только работа. А еще вечером ужинала с Ирис (хозяйкой Muka, из которой все мои супер штаны шелковые и много всего) и с Никой Суринович, оказывается они давние подруги. Ника - важный человек в моей жизни, в мои 18 лет она рассказала мне про «анонимных наркоманов», она открывала ребцентр в Екатеринбурге и это был мой первый ребцентр. Но это отдельная история, не для моего маленького дневника.",

    "full_content": "Еженедельная рубрика «Зависимость» в эфире.\n⠀\nКаждый четверг после моих постов мне заваливают Директ с вопросами: «Посоветуй специалиста по 12 шагам» «куда бежать кому платить». Сложность в том, что никуда и никому, потому что «Шаги» - это бесплатная история, а это значит, что никому не будет нужно больше, чем тебе.\n⠀\nИтак, я накидала для вас инструкцию. Что делать, если вы поняли, что вы - зависимый человек?\n⠀\n1. Определите основную «проблему»: алкоголь, наркотики, игромания, переедание, депрессия, сексоголизм, созависимость, или может быть вы - взрослый ребенок алкоголиков/наркоманов? Если что-нибудь из этого про вас - идем дальше. Нет - возможно, с вашей проблемой вам лучше к психологу/психотерапевту.\n⠀\n2. Найдите группу взаимопомощи по вашей зависимости в своем городе или онлайн. Как гуглить: «Анонимные Алкоголики (ващ город)», «Анонимные Наркоманы (ваш город)», Анонимные Созависимые. И т.д. Нашли в своем городе - идите на живое собрание. Не нашли - ищите собрания онлайн, подключайтесь на него.\n⠀\n3. Что делать на группе? Вы должны представится и сказать, что вы - новичок. Вам не надо обязательно говорить что-то еще, рассказывать о своей проблеме и о жизни. Можно просто молчать. По одному собранию невозможно составить представление о шагах и сообществе, поэтому надо просто начать ходить. Обычно рекомендуют ходить на собрания три месяца, не пропуская.\n⠀\n4. На собрании надо слушать высказывания, и когда вам понравится кто-то из группы, кто-то вдохновит (человек одного с вами пола, или тот, к которому у вас не будет влечения) - вы можете подойти и попросить стать вашим «спонсором». Так называются волонтеры-впередиидущие по программе, которые помогают новичкам, и часто делают это годами. Если он согласится - вы становитесь его «подспонсорным», он делится опытом о том, как он писал и проходил шаги. Он дает вам задания по книге/руководству. Например: напиши ответы на три вопроса по три примера на каждый. Спонсор может поставить условия: сдавай задания раз в неделю, или я не буду с тобой работать. Спонсора можно менять в любой момент.\n⠀\nСложно, но если прижмет и ничего больше не помогает - и не такое освоишь 🙂 Сегодня на этом всё! #12шагов_olymarkes",
    "final_title": "Еженедельная рубрика «Зависимость» в эфире",

    "full_content": "изнанка\n\nПосле концерта ты выходишь из светящегося моря в такой контрастный коридор. Этот запах и цвет бэкстейджа ни с чем не спутаешь - какая-то смесь пива и еще чего-то.. Клуб, его самая не-парадная часть. Изнанка. Ты идешь по такому коридору, в котором очень мало парадного, в нем вообще ничего нет, что можно было бы пожелать. И я иду по нему с мыслью, насколько это все символично. Люди не видят изнанку, а мы в ней живем.\nМомент встречи - это момент истины, момент соединения времен и судеб, воспоминаний и настоящего момента. Ты встречаешься со всем, что когда-либо было важно для тебя. Концерт - это rush, а все остальное - это мутки и отходняки. Это жизнь;  Но ради этого взрыва ты продолжаешь делать очень много, потому что… Просто потому что.\nЗа сценой происходит очень важная часть шоу - и это я сейчас про Москву и Питер. Ко мне приходят важные для меня люди и создают особенную атмосферу. Юля и Света все в мерче стоят на мерче, Маша красит, парни заходят поздороваться, Лиза громко смеется - значит все на своих местах. Кто-то приходит познакомиться, сектанты тоже тут - обязательно.. И такая приятная суета. Мне не нужно в ней сосредотачиваться. Я хочу в ней раствориться.\nЭти райдерные бутерброды - господи, этот стол с едой -как еще один член группы - повсюду, в любом городе, один и тот же состав. С радостью съедаю один бутер на черном хлебе и пару помидорок черри, остальное - для парней, но никто никогда не съедает это все полностью, и вот этот стол с райдером - это просто бич)) Просто для того, чтобы вы представили себе полностью картинку. Мест, чтобы сидеть, редко бывает достаточно. Из развлечений - разговаривать, ржать, втыкать в телефон. Так выглядят музыканты перед выходом на сцену (если они, как мы, не бухают).\nНо вот время выходить на сцену - здесь, конечно, все собирается в одну точку внимания. И ты выходишь и живешь - даже не на сцене, а в сердце своих эмоций, в своей душе, которая может страдать, а может купаться в радотсти. Мне нравятся отношения в группе - я отношусь с любовью и уважением ко всем: к каждому музыканту и технику. Именно поэтому меня очень много - я со всеми едина, и я под защитой всех этих прекрасных парней. Я очень счастлива, что они за моей спиной и за пультом в зале. И сегодня у всех все получается: я не думаю о звуке, все хорошо;\nМы играем песни, которые не играли сто лет - и я счастлива. Нам понадобилось два года, чтобы выучить и старенькое - и сейчас мы можем снова играть все-все-все, что попадает в настроение. Ну не все… Осталось еще процентов 30. Пусть все постепенно укладывается.\nПесни эти, которые мы поем сегодня,  - это основа, и начало начал. Я писала их, когда вообще не было никакой «публики», и поэтому это самый чистый месседж. Нет адресата, никто не будет оценивать. Можно просто быть собой.\nМногие из этих песен я писала для Фили, и конечно я знала, что совершенно не важно - услышит ли он их. Любовь - это всегда история одного человека. У меня была такая любовь к нему, да и есть до сих пор, которая не про отношения, и даже не про общение. Это про такой мощный заряд, который ты получаешь в самое сердце - и ты начинаешь дышать. Ты понимаешь, что не жил до этого. Когда мы встретились - я начала дышать, и дышу до сих пор, ощущая его душу во всем, что я делаю. И конечно, все эти песни - они до сих пор живы, как живо то чувство. Я до сих пор могу писать и обращаться к нему - это неиссякаемый источник любви.\n«Я пересекаю моря, океаны, горы, чтобы пройти мимо тебя, опустив голову» - ничто лучше не опишет моей любви. Когда ты просто в другой плоскости чувствуешь, где материальное не может выразить - даже взгляд… После того, как я начала дышать, все наши встречи заканчивались очень быстро. Я могла выдавить из себя несколько слов, и убегала, и пряталась, стараясь не увидеть.. Конечно он не знал, как важно было для меня, что мы выступаем на одной сцене. Последний раз подарила ему диск «Барселоны», но продолжаю до сих пор дарить ему каждую из этих песен… Много лет его уже нет, но не для меня. «Люди идут, и машины едут мимо, будто ничего не случилось. Если тебя бы не стало - жизнь бы просто остановилась».\nВ моей внутренней вселенной это - целая галактика. Но есть и другие. Гордей принес мне РентБоя, Марка, в котором тоже так много для меня. Конечно, это символ - и уверена, для меня это что-то совершенно свое. Свое, как причина, по которой каждый из наркоманов убивает себя. Реально, зависимость - одна, но природа - она отличается. Считаю, что мне повезло побыть во всех ролях. Я была Рентоном, и конечно, была его телочкой. И эти роли всегда живы, как trainspotting на паузе. Мне это нравится. Я всегда болтаю ногами над пропастью, и это помогает мне быть свободной в настоящем. Я не выбираю жизнь, я выбираю что-то еще. Я во всем этом «еще» так глубоко, что времени на жизнь просто не остается. Вся моя ответственность, вся моя вселенная крутится, как мяч на пальце. И я ни на секунду не забываю, кто я на самом деле. И это вообще абсолютно нормально - особенно, если другие тоже в курсе.\nПоэтому все мои песни, бэйб, они по большей части об этих двух сторонах внутренней реальности. Потому что все или о любви, или о бездне, над которой я зависаю. Ну и еще о дружбе.\nДружба - это сложная штука. Мне нужно еще лет 10, чтобы понять, что это такое. Но о ней я тоже пою.\nЭтот концерт - он был таким п;здатым, конечно - все эти сюрпризы, они так оживляют меня. Мы готовимся и вы, вы с изнанки тоже готовитесь к нашей встрече. Это уже не потребительство, это уже обмен самый настоящий и равноценный - я чувствую, что я получила не меньше, чем отдала. И эти мелочи играют роль.\nРаньше я выходила со сцены и брала в руки телефон, чтобы посмотреть: как это было?! Какие фотки? Какие отзывы? Парни сидят в гримерке и сразу читают. Я… Я не беру телефон еще долго, наслаждаюсь послевкусием. Наслаждаюсь воспоминанием, чувствами; Они не только о концерте, они обо всем: о пути, прежде всего. Когда ты далеко-далеко уже от начала пути - ты видишь его весь. А раньше видел гораздо меньше. Чем больше ты видишь - тем больше твоя вселенная внутри.\nНичто не умирает. Все множится, становится глубже, лучше, полноценнее, светлее.. Так я вижу мир. Такой у меня складывается паззл.\nКонечно, еще хочется написать много чувств после концерта Jane Air, но я забыла пароль от Дурге. А еще - завтра у меня 5 лет трезвости. 5 удивительных лет, которые начались однажды с большого взрыва, из которого получился.…\nНо об этом, конечно, не в этот раз.\nПс. Кристина твои фотки рассказывают все лучше, чем я. Вот как ты так))",
    "final_title": "изнанка\n\nПосле концерта ты выходишь из светящегося моря в такой контрастный кори...",

    "full_content": "Почему я не люблю наркоманов и алкоголиков\n\n... особенно тех, которые думают что\n1) это все х.ня, они в любой момент могут бросить и т.д.\n2)  тех, кто думает что алкоголь\\травка\\клубная химия - это ещё типа фигня, и нечего бояца. Вообще - все всегда уверены, что бывает и хуже. Например, многие в\\в употребляющие считают, что всё ещё ништяк, если они в пах не коляца.\nпотому я знаю, насколько глубоки такого рода  заблуждения, и как легко в это заблуждение впасть и вводить остальных.  Можно всю жизнь позволять этому дерьму обманывать себя, а себе - обманывать друзей, и барахтаться в луже \"контролируемых\" зависимостей... Барахтаться целыми тусовками, убеждая друг друга что всё это - нормально.\nМне страшно, когда я заглядываю в своё прошлое. Мне страшно, потому что я думаю - а я могла ведь и не увидить всего этого...  Счастья и гармонии в абсолютной трезвости. Мне нравятся очень простые вещи, заполняющие мой день: мне нравиться водить тачку, гулять по городу, ходить в кино, проводить время с лучшими людьми на свете, заниматься музыкой, йогой, вообще - спортом, на байке своём кататься, на борде...  И с каждым новым днём без \"доппингов\" я  чувствую себя сильнее и  счастливее )\nАлко-треш, бесспорно, весело - ...?? Один раз, два.. А потом это превращается в постоянную погоню за весельем, саморазвлечением. Вся жизнь - как х.евый театр...  Я могу по этому поводу долго рассуждать. Не с высоты колокольни 3х недель без алкоголя ))))\nПросто смотрю на себя, на свой опыт - как хорошо, что мне ещё раз не пожалели здравомыслия и сил остановится, сказать \"стоп\", пока я не успела в очередной раз растерять душевную гармонию и любовь внутри меня.\nХочется ли мне иногда? Да, хочется. И самое большое желание моё - чтобы не хотелось никогда. И чтобы друзьям моим не хотелось...\nНу и вдогонку - видяшечка... Посмотрела два раза аж. Реквием по мечте - только всё так сочно, по-голливудски. У нас реальность по-другому пахнет и выглядит, господа...",

    "path": "data/lj_export_clean/posts_md/75702__muzikalnaya_gonzo_recenzya.md",

    "filename": "75702__muzikalnaya_gonzo_recenzya",
    "full_content": "Muzikalnaya Gonzo Recenzya\n\nЗдравстуйте, дорогие читатели. Несколько дней назад в железном почтовом ящике у дороги я обнаружила конверт. Содержимое его повергло меня в ужас: организаторы эпического фестиваля «Кубана» умоляли меня оценить творчество молодых российских исполнителей и помочь выбрать лучшего.\n– это, блять, смешно! – ну какой из меня музыкант, и тем более, блять, эксперт? - воскликнула я, и уже собралась выбросить конверт в мусорное ведро под раковиной.. Но меня остановил грозный возглас:\n– Стой! Что там у тебя?\nМой друг – культовая личность, и человек, чьего имени нельзя произносить (связь со мной может запятнать его репутацию в правительственных кругах) – он настоял на том, чтобы мы прослушали все предложенные группы и беспристрастно написали рецензию.\nМы отложили нарды, подкинули дров в камин и приступили к работе.\nГруппа ***1.\nОн предполагает, что группа ***1 – это старые институтские друзья, которые в светлое время дня торгуют опалубкой и алюминивым прутком, а после работы собираются и играют прифанкованую авторскую песню. Безусловно, если бы они выступали на Грушинском Фестивале, их бы закидали камнями, как авангардистов.\nМне же группа понравилась, особенно песня “***1”. Нежные гитарные партии, теплый, скрипучий, как старое седло, голос вокалиста – хороший саундтрек для дождливого питерского вечера.\nПить и блевать под эту музыку мне бы не очень понравилось, так что на Кубане я эту группу представляю с трудом.\nГруппа ***2!\nМой друг, слушая эту группу, плакал, потому что это ввергло его в пучину ностальгических воспоминаний о временах его студенчества. В то время стипендию выдавали советскими рублями, а город, из которого эта группа родом назывался “Горький”. Курт Кобэйн еще не задумывался о самоубийстве, а Мистер Малой во что бы то не стало собирался умереть молодым. Грув бомбил дискотеки песней “Счастье Есть”, а начинающую группу “Сплин” на ее первых выступлениях закидывали банками.\nНе дослушав первую песню до конца, мой друг побежал в магазин за шортами, клечатой рубашкой и плеером Sony Walkman; Я же осталась, чтобы дать музыкальному творчеству группы адекватную оценку.\nМне очень понравилась группа ***2! - такие бодрые, веселые ребята. Я бы с удовольствием порекомендовала бы их к участию на Кубане, но наш барабанщик Ляпа, который по совместительству играет на басу в группе Bzik, заколбасит меня на ближайшей репетиции. Поэтому – простите, ребята.\nГруппа ***3!\nК тому моменту, как я дослушала группу ***2 и перешла к группе ***3 мой друг как раз вернулся – в поп-панк экипировке и первым альбомом группы «Кирпичи» в руке. На третьем треке он разложил все в центре комнаты и устроил ритуальный костер. Стягивая с себя клечатую рубашку и белые носки он плакал – не в силах смирится с тем, как постарел Дима Спирин, что группы I.F.K. больше нет и тех, кто знает группу Scang практически не осталось в живых.\nМне группа ***3 очень понравилась, я бы с радостью пила и блевала бы под них на Кубане… Но боюсь если мы возьмем их – группа ***2 обидится.\nГруппа Scang Sattawood\nУвидев обложку диска я почувствовала неладное, и предчувствие не обмануло меня. Группа оказалась феноменально охуительной.\nПод трек Dark Is Eyed я бы прямо сейчас вмазалась героином, но боюсь тогда выступление группы ТТП на Кубане придется отменить, к тому же напротив сидит мой директор Катя, а справа - нарколог, который присматривает за мной после моего недавнего побега из реабилитационного центра для наркоманов под Псковом. Со слезами на глазах мне пришлось выключить этот гениальный трек и перейти к прослушиванию группы Алоэ Вера.\nМой друг же за это короткое время снова предался воспоминаниям: дождливый ночной лиговский проспект, с его абсолютно депрессивным красным светом фонарей и абсолютным счастьем от качественно вколотой дозы практически неразбавленного героина. Счастье омрачено только косматым неопрятным псом, который пытается вступить с ним в интимную близость сзади, пользуясь его абсолютной беспомощностью и тем, что тело лежит на тротуаре. «Даа, хорошая группа» - грустно вздыхает он.\nГруппа Алоэ Вера.\n- Это демонизированное творчество Иосифа Кобзона! – воскликнул мой друг, заткнул уши и начал раскачиваться, как старые еврей на молитве.\nЯ же не могу адекватно оценивать творчество группы Алоэ Вера, потому что они – наши бывшие друзья.\nГруппа Кактус.\nПосле прослушивания новейшей российской музыки, мы с горя решили заняться сексом. Осталась только группа Кактус и… все прошло неплохо. Так что наш эксперный совет предлагает эту группу в качестве участников самого охуенного фестиваля на свете.\nП.С. Авторы рецензии снимают с себя всю ответственность за написанное ввиду клинического идиотизма.",
    "final_title": "Muzikalnaya Gonzo Recenzya\n\nЗдравстуйте, дорогие читатели",

    "filename": "2021-07-29",
    "full_content": "Четверг - тема «зависимости»\n⠀\nВ 12 шаговых программах есть система наставничества. Наставник «Спонсор» - это такой же зависимый, который имеет больше опыта в программе, при этом - человек, одного пола с тобой или одной сексуальной ориентации (это важно, чтобы отношения оставались чистыми и никак не сексуализировались). Нет условий, чтобы «спонсор» прошел все 12 шагов, или чтобы у него было много лет трезвости - каждый сам решает, когда он готов брать подопечных. Но надо, чтобы тебя еще и выбрали.\n⠀\nНовичок в программе сам ищет себе спонсора - слушает на собраниях высказывания, если чей-то опыт особенно отзывается, если думаешь: «мы с этим человеком похожи» или «хотел бы я мыслить так же» - после собрания можно подойти к человеку и попросить его стать наставником. Это не значит, что человек сразу согласится. Иногда приходится искать своего спонсора какое-то время.\n⠀\nЕсть еще система рекомендаций - твои друзья из 12-шагового сообщества могут посоветовать человека, который классно ведет по шагам и может тебе подойти. Ты получишь контакт и можешь попросить о встрече.\n⠀\nУ разных спонсоров могут быть разные системы ведения. Один будет более авторитарен, скажет: ты должен звонить мне каждый день и раз в неделю мы читаем шаг. Другой скажет: ты двигаешься в своем потоке, раз в несколько месяцев мы встречаемся и обсуждаем твои выводы по шагу. Мой спонсор ведет меня в свободном стиле, с авторитарным я бы не смогла работать, но я знаю людей, которые ищут именно таких. Я сама веду своих подопечных без строгих правил. Они сами решают, как быстро им писать, когда мне звонить.\n⠀\nЛюди могут брать паузы и возвращаться к написанию шагов - я не тороплю и просто даю ощущение, что я буду рядом и через пол года, и через год.\n⠀\nМои подопечные со мной годами, и это - очень важные для меня отношения.\n⠀\nКогда они пишут шаги, я проживаю все вместе с ними, получаю их опыт себе в копилочку, напоминаю себе о важных вещах. Я как будто укрепляю свои знания и веру, идя путь вместе с ними. Моя наставница дает мне ощущение твердого плеча и кладези опыта - я могу делиться с ней самыми сложными вещами, это - 100% доверия. (Продолжение - листайте фото!) ⏯ #12шагов_olymarkes",
    "final_title": "Четверг - тема «зависимости»\n⠀\nВ 12 шаговых программах есть система наставничест...",

    "filename": "2020-12-31",
    "full_content": "Символично, что год заканчивается в этот день. Что это утро я провела на собрании зависимых с одним из моих sponsee. У меня в душе очень хорошо от этого финального аккорда.\n⠀\nВ этом году я начала свои «чистые четверги» - писала о зависимом поведении и о своем пути в этой теме. Вчера рождественский выпуск сериала «Эйфория» на нетфликсе, и вся серия - это разговор главной героини со своим «спонсором» (так называются наставники -волонтеры в 12 шаговых сообществах). Я думала: так удивительно слышать это с экрана, и так здорово. И у меня были такие разговоры. И я была и на месте Ру, и через годы - уже на месте ее спонсора. У меня не на все есть ответы, но у меня есть мой опыт, и я им делюсь.\n⠀\nЗнаете, какой шаг является двенадцатым? Несение вести тем зависимым, которые все еще страдают. Кто написал сценарий этой серии «Эйфории» - они тоже сделали свой 12 шаг, и мы не узнаем, кто именно - в этом и есть принцип «анонимности». Но когда звезды рассказывают о своем пути в 12 шагах - например, Киддис в своей биографии, это тоже помогает многим. Я в свое время оказалась в программе, потому что девушка рассказала мне о музыкантах, которые выздоравливали от употребления с помощью 12 шагов.\n⠀\nНесколько лет до этого я служила иначе: вела группы, общалась с подопечными. В этом году этого не хватало. Я не хотела нарушать принцип «анонимности», поэтому я рассказывала обо всех 12-шаговых программах в целом, не акцентируя внимания на конкретно своей проблеме. И это сработало очень интересным образом.\n⠀\nЗа этот год многие мне писали в личку: «я пошла на анонимных переедающих», «я узнала о сообществе CODA и хожу на группы созависимых», «я начал писать шаги по ВДА(взрослые дети алкоголиков». Это важно для меня, и у меня есть ощущение, что я все делала правильно, не стесняясь писать на эту тему.\n⠀\nМне писали и родственники зависимых - благодарили за мои посты, что они помогли лучше понять близких, понять, как поддерживать после реабилитации - я очень рада, что это было полезным. У постов есть тег и все их можно найти и прочитать в любой нужный момент.\n⠀\nВ этой сфере моей жизни в этом году главное - это весть, которая нашла своего адресата. Спасибо, что читали и делились ❤️",

    "full_content": "#bigsektabattle2 \nПосле моей первой неудачной Индии жить стало как-то полегче. Я первый раз в жизни признала, что вредные привычки свои я ненавижу. Кажется, что это очевидно - но на самом деле все было не так. Тяжело жить, когда с одной стороны ты любишь здоровый и спортивный вид своего тела, а с другой стороны ты любишь алкоголь, наркотики и сигареты. Мне казалось, что я люблю все вредное - но той зимой я окончательно приняла, что любовь и зависимость - это совершенно разные вещи, хотя по ощущениям они похожи. Любовь тебя не разрушает и не заставляет тебя страдать. А зависимость - заставляет. И так я наконец-то обрела почву под ногами. Конечно, она все еще шаталась…\n\nПол года в фитнес-клубе, несколько месяцев шаткой полной трезвости.. Тогда мы как-раз только -только выпустили альбом «Снежная Барселона», и поехали в небольшой тур в его поддержку. Во-первых я была жутко недовольна альбомом, и очень горько плакала. Во-вторых в одном из городов я встретила моих друзей-наркоманов, один из которых поднял мою футболку и, защипнув жирок на животе, сказал: «Ооооо… Кто-то поправился!». Я помню как в тот вечер я не могла заснуть из-за страшной боли в груди. А как же все мои усилия? Я пол года не вылезала из зала, стараясь оставаться в форме и в трезвости… Но неужели это невозможно?! Боль была такой сильной, что я нашла только один способ, как ее снять. Я просто перестала есть. Вообще. Прочитала про «лечебное голодание» и все его прелести и подумала, что это - очень хорошая идея. Но это была очень, очень, очень плохая идея… Особенно для тех обстоятельств, в которых я находилась. \nНу и немного фактов: я поправилась с 49 до 56 кг. И это фото сделано в 56. Эта фотосессия была для меня психотерапией, я убеждала себя в том, что у меня - красивое и сильное тело, что я люблю его и могу им гордиться.. Но внешний голос иногда может быть громче внутреннего, поэтому моя терапия не сработала в тот момент.. Но она была важным началом, фундаментом, который я оценила уже сильно после… #mysektaway",

    "full_content": "По четвергам я пишу о зависимости, как о хроническом заболевании, которое затрагивает все сферы нашей жизни.\n⠀\nСегодня говорила с подругой, которая с января находится в реабилитационном центре. Я в один из четвергов о ней писала. Сегодня она сказала, что хочет остаться еще на несколько месяцев.\n⠀\nКак? Серьезно?! - сказали многие близкие, - ведь у нее не было ТАКИХ проблем. - Да и сложно представить извне, что там такого происходит за стенами РЦ, что ты внезапно хочешь остаться.\n⠀\nВчера я писала о бизнесе, о моем подходе к делам: что я стараюсь приносить пользу и радость ближним. Отчасти, так было всегда, но с «изнанки» это отличалось.\n⠀\nСчитается, что зависимые люди очень эгоцентричны, и в любое действие мы делаем, закручивая реальность вокруг себя\n⠀\nЧтобы МЕНЯ полюбили\nМЕНЯ оценили\nМЕНЯ заметили\n⠀\nИ мне, и многим моим друзьям, похожим на меня, никогда не было достаточно, неутолимое Я всегда было недовольно\n⠀\n«Я» ведь могу лучше\nЯ недостаточно стараюсь\nЯ сам во всем виноват\nЯ мог бы жить и вести себя иначе\n⠀\nПостоянно Я. Ничего кроме бесконечного Я, МЕНЯ, МНЕ - и все это связано с болью несбыточности.\n⠀\n12 шагов, по моему опыту, с одной стороны заставляют глубоко копать в себя, а с другой стороны - очень отвлекают от «Я», и помогают сосредоточится на служении близким, на простой ответственности за простые действия. Ты заправляешь кровать, подметаешь дом, помогаешь новичку, ведешь группу - и в помощи другим ты становишься спокойным и счастливым, даже если никто не замечает твоего труда. Возможно мои дети, собаки, работы - это все мой личный реб.центр. Ответственность и труд - это мое освобождение от мук эгоцентризма.\n⠀\nМоя подруга сказала, что после РЦ хочет стать волонтером, помогать зависимым людям, поучиться на консультанта по работе с зависимыми. Я слышу в ее голосе, что из этого может получится что-то классное. Мы с ней обе очень любим отдавать, и я помню, как сама пыталась отдавать последнее, когда во мне все было пусто и выжжено. С тех пор мало что изменилось для людей снаружи, но внутри я совсем другой человек. Даже когда я устаю, я больше никогда не бываю такой опустошенной как 10 или 15 лет назад, до появления 12 шагов в моей жизни. #12шагов_olymarkes",
    "final_title": "По четвергам я пишу о зависимости, как о хроническом заболевании, которое затраг...",
    "final_annotation": "⠀\nСегодня говорила с подругой, которая с января находится в реабилитационном центре. Я в один из четвергов о ней писала. Сегодня она сказала, что хочет остаться еще на несколько месяцев. Сегодня она сказала, что хочет остаться еще на несколько месяцев. ⠀\nКак? Серьезно?! - сказали многие близкие, - ведь у нее не было ТАКИХ проблем",

    "filename": "2020-08-13",
    "full_content": "Спасибо всем, кто вчера рассказал мне о нашем знакомстве - для меня это важный заряд. Я рада, что вас вдохновляют мои рассказы о разных сферах жизни, и здорово, что вы так любите четверги и мои посты про зависимое поведение - сегодня и продолжу об этом.\n⠀\nЧто самое сложно в пути зависимого человека? Сначала сложно понять, почему тебе нужно отказаться от всех веществ, изменяющих сознание. Особенно сложно, если в твоей среде это - норма. Но многие мои друзья могли остановиться - а я не могла, так я поняла, что я не могу контролировать употребление.\n⠀\nВторое - это вопрос, чем заполнить пустоту, которая приходит, когда отказываешься от алкоголя, наркотиков, сигарет. Это сложно, потому что похоже на жажду, и потому что кажется, что мир бесконечно скучный. Часть этих ощущений проходит со временем, но частично пустота остается - и вот здесь как раз без 12 шагов я постоянно срывалась и возвращалась к прежнему.\n⠀\nЯ умею держаться на силе воли, но терпение - это ограниченный ресурс, и поэтому меня возвращало к прежнему режиму, пока я не начала разбираться в глубоких причинах.\n⠀\n12 шагов - это бесплатно, добровольно и поэтому - так сложно. Иногда совершенно невозможно заставить себя помогать самому себе. Кажется - ну такая чушь, такая мелочь - задать себе пару вопросов и ответить на них письменно, зайти на группу в Зуме. А нет, сложнее этого ничего нет.\n⠀\nДаже долгая трезвость не гарантирует счастья и душевного покоя, если ты не задаешь себе правильные вопросы. Если не работать со своим внутренним миром, зависимость найдет лазейки: еда, отношения, работа, деньги, интернет - все будет доведено до крайности и станет оружием саморазрушения.\n⠀\nКогда в жизни есть шаги и работа по ним - есть ощущение, что ты держишь свою жизнь в своих руках. Когда зависимость берет верх - кажется, что ты падаешь в свою жизнь, как в бурную реку, и она несет тебя - а ты только барахтаешься и пытаешься вдохнуть.\n⠀\nПоэтому главное в работе с зависимостью - это не трезвость, а состояние. Вот за ним приходится постоянно наблюдать и в случае чего - сразу искать причины и работать с ними. #12шагов_olymarkes",
