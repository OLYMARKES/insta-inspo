    "path": "data/vi_vse_nepr_export/posts_md/2020-11-17__93__кружок_едущих_кипр_стал_самым_манящим_эти.md",
    "source": "Vi Vse Nepr",
    "filename": "2020-11-17__93__кружок_едущих_кипр_стал_самым_манящим_эти",
    "full_content": "2020-11-17 — кружок едущих кипр стал самым манящим эти\n*From*: Вы все живёте неправильно\n\nКружок «едущих на Кипр» стал самым манящим - эти и без того далекие обеспеченные девочки теперь после каждого урока собирались в кружок, и до меня то и дело долетали обрывки их разговоров о том, как им будет весело.\n\nОднажды я была за границей, в Прибалтике. Уже с папой и мамой Аллой, она как раз была беременна сестрой. Я помню песчаные барханы и то, что дети не играли со мной, потому что я русская. Они знали русский язык, но специально при мне говорили на литовском. Еще я помню, что у меня болели уши, и родители искали ножницы - я была абсолютно уверена в том, что мне хотят их отрезать\n\nНо Кипр казался совершенно другой планетой. Там были голубые лагуны из рекламы Баунти, белоснежные камни, бассейны у отеля - мне казалось, я видела все это своими глазами - так хорошо работала моя фантазия. Почему-то я очень хотела, чтобы они уже уехали и перестали об этом так радостно разговаривать - это раздражало даже больше чем понимание того, что я никогда не поеду на этот дурацкий Кипр.\n\nЗато этим летом мама Алла и бабушка Валя отвезли нас в Анапу. Мы жили далеко от моря, идти нужно было целую вечность. Все, что меня интересовало - это лягушки. Вообще желание найти в природе что-то живое было настолько навязчивым, что с этим связано одно из первых моих воспоминаний - года в два. На мне новый голубой комбинезончик, передо мной канава, время года - самая слякотная осень, родители недалеко набирают в канистры воду из источника. Я думаю: если я лягу на живот на деревянном мостике через канаву, смогу я увидеть лягушку в воде? Внутри меня есть ощущение, что я делаю что-то неправильное, и что у моего действия будут последствия, и они как-то связаны с голубым комбинезончиком.\n\nНо я ложусь. И как на зло - ни одной лягушки.\n\nКогда я оглядываю свой комбинезончик, я вижу широкие коричневые разводы грязи, и в этот же момент я слышу крик родителей, которые тоже видят эту картину.\n\nНо вернемся в Анапу.\n\nДорога к морю шла через сотни луж, и лягушек там было полно. Я их ловила и отпускала и очень этому радовалась. Тем летом у меня появился плеер и кассета группы «Руки Вверх» - самый первый их альбом «Дышите Равномерно». Это было нечто. РВ тогда набрали популярность, но еще не были попсой. Когда я включала трек «Двигай Телом» я улетала в космос - там была недоступная для меня клубная культура, взрослые истории и проблемы, такой классный речетатив в этом треке и такой классический хаус конца девяностых - я уже тогда знала, что к моей взрослой жизни все это закончится, и лучшие тусовки проходят мимо меня, проходят навсегда.\n\nВообще, эти поездки на юга были особенной песней. Семьи ехали в выбранный случайно (в основном, выбирали между галечным пляжем в Адлере и песчаным в Анапе) город, там выходили на вокзале или в аэропорту, получали багаж, выходили на привокзальную или приаэродромную площадь и попадали в аналоговый вариант Airbnb - бабули стояли с картонками, на которых было написано: «10 минут до Пляжа! 200 рублей сутки!». На всех картонках было написано примерно одно и то же, и бабули накидывались на приезжающих равномерной гурьбой. У особо продвинутых бабуль были фотографии жилища, но такие обычно стоили аут оф баджет, и мы выбирали бабуль исключительно по внешности и напускной сердобольности.\n\nДальше бабуля вела или везла в свое жилище - к хозяйскому дому были пристроены скромные сарайчики для отдыхающих, на улице организовывалась кухня, бельевые веревки, душ с водой из бака - так мы и отдыхали. Время пешком до моря нужно было умножать в два, а то и в три раза. Особенно из-за количества вещей, которые надо было нести с собой: покрывало, зонтик (он почему-то покупался в Екатеринбурге, весил тонну и успевал страшно надоесть еще до момента первого втыкания в землю), еду, воду, надувные круги, матрасы. На пляж собирались и шли, как на войну.",
    "final_title": "Однажды я была за границей, в Прибалтике",

    "path": "data/vi_vse_nepr_export/posts_md/2023-07-09__218__даже_предполагая_наши_отношения_закончатся_будешь_любить.md",
    "source": "Vi Vse Nepr",
    "filename": "2023-07-09__218__даже_предполагая_наши_отношения_закончатся_будешь_любить",
    "full_content": "2023-07-09 — даже предполагая наши отношения закончатся будешь любить\n*From*: Liza Snagovskaia 09.07.2023 17:52:42\n\n\"Даже предполагая, что наши отношения закончатся и ты будешь любить других людей, будешь любить кого-то еще, я хочу сейчас, в это мгновение, в этот период жизни просто быть на все 100, быть с тобой, быть в этих отношениях, наслаждаться каждой минутой.\nИ если твое внимание к другим делает мне больно, я хочу эту боль тоже видеть как космос. Я хочу иметь возможность разделить ее с тобой, показать тебе ее, показать, что это тоже какая-то сторона моей любви к тебе.\nЯ не хочу тебя менять. Я не хочу ограничивать твою аутентичность. Я хочу чтобы ты проявлялся, я хочу, чтобы ты встречал других людей, дарил им свои энергию и брал от них энергию. И хочу чтобы как можно больше классных вещей случалось с тобой в контакте с другими людьми.\nНе хочу, чтобы я была единственным вот этим вот космосом. Я и сама хочу так же встречать других людей и обмениваться с ними энергией. И это никогда не будет преступлением против нашей любви, потому что наша любовь, родившаяся в одно мгновение, уже стала вечностью\".",
    "final_title": "И если твое внимание к другим делает мне больно, я хочу эту боль тоже видеть ...",
    "final_annotation": "Я хочу иметь возможность разделить ее с тобой, показать тебе ее, показать, что это тоже какая-то сторона моей любви к тебе. Я не хочу ограничивать твою аутентичность. Я хочу чтобы ты проявлялся, я хочу, чтобы ты встречал других людей, дарил им свои энергию и брал от них энергию.",

    "filename": "2020-11-17__92__потом_случилось_страшное_одна_девочек_элитной_тусовки",
    "full_content": "2020-11-17 — потом случилось страшное одна девочек элитной тусовки\n\nПотом случилось страшное. Одна из девочек из элитной тусовки обратила на меня внимание, но в каком-то негативном ключе. Когда на меня не обращают внимание - это грустно, но не страшно. Когда меня недолюблтвают - вот это действительно мой пунктик. Моему брату, например, было плевать на мнение других. Я же наоборот всегда сосредотачивалась всеми мыслями на моем недоброжелателе и не могла думать о чем-то другом. Мне казалось, что я в опасности. Что человек, который меня недолюбливает, тоже все время думает обо мне и о том, как испортить мне жизнь.\n\nМарина носила очки, хвостик, еще она была младше нас всех на год, но при этом чувствовала она себя очень уверено. Как-то раз я пришла к маме и рассказала, что Марина меня не любит и мне тревожно. Мама предложила подарить девочке подарок. Так мы и сделали: пошли в ближайший ларек Роспечати и купили пластмассовое кольцо с пластмассовым алмазиком. Марина подарок приняла, я радовалась заключенному перемирию, но потом что-то произошло, и она снова начала меня задирать какими-то обидными словами. И я разбила ей нос.\n\nСо мной пришла разбиратся ее старшая сестра. Конечно, я цепенела перед старшими, и мне не хватило сил объяснить, что она сама виновата. К тому же тот, кто срывается на насилие не может говорить о справедливости - надо уметь постоять за себя словами. Я не умела.\n\nВ следующий раз я разбила Марине очки. Она шла передо мной на физкультуре и повторяла что-то обидное. И я психанула снова. Очки упали, весь класс ползал и искал отлетевший винтик, я смотрела на это и чувствовала себя очень плохой. Я чувствовала, что сейчас Марина - жертва, весь класс - спасители, а я - насильник, и это было полное поражение. Уже тогда я начала понимать, что разбитые очки врага не могут быть победой, победа - это если бы все защищали меня, искали бы мой потеряный винтик и жалели меня. Я очень хотела быть на ее месте, чтобы все были на моей стороне.\n\nМне постоянно было стыдно. Часто чувство, что я какая-то не такая, сменяла злость. Я помню, как шла из школы домой, а за мной шли две мамы девочек из моего класса:\n\n - Хорошая девочка, аккуратная. И колготочки всегда чистые. - что-то такое они обо мне говорили, может быть, хотели подбодрить между делом, а может быть просто обсуждали - но я хотела провалиться под землю, потому что на колготках моих вечно были дырки, за всю жизнь у меня ни разу не было даже хиленькой косы, только хвостик, и любые комплименты я воспринимала скорее как издевательство, потому что никто не хвалил меня за то, в чем я действительно была хороша. Никто не знал, и я сама не знала.\n\nЭто сейчас я понимаю, что в детстве я просто не могла чувствовать себя реализованной - слишком высокий у меня был запрос на качественную обратную связь, на одобрение - это должно было быть глубокое одобрение от человека, который видит мою суть. Мне хотелось встретить учителя, которому будет интересен мой внутренний мир, но я не была интересна. Меня надо было раскрыть, со мной надо было говорить - а кому может быт интересен отдельный ребенок в коллективе из 30, из 120 детей.\n\nШкола у нас, действительно, была сильная. Нам говорили об этом каждый день, и на переферии, видимо, для отстройки от чего-то всегда маячила соседняя - 175ая школа. Как только что-то шло не так, учитель мог ввернуть:\n\n - Сложно? Ну иди в сто семьдесят пятую, там легко.\n\nИ так - по любому поводу. Пойти учится туда - это значило, признать поражение по жизни. Стать человеком второго сорта. На этом ощущении исключительности строилось очень многое.\n\nОднажды в нашем классе случилось оживление. Наша учительница объявила: «мы едем на Кипр!». Конечно, едут те, кто запишется и оплатит до определенной даты. «Поговорите с родителями».",
    "final_title": "2020-11-17 — потом случилось страшное одна девочек элитной тусовки\n\nПотом слу...",

    "path": "data/vi_vse_nepr_export/posts_md/2022-12-09__169__вчера_кое-что_поняла_всех_людей_которых_встречаю.md",
    "source": "Vi Vse Nepr",
    "filename": "2022-12-09__169__вчера_кое-что_поняла_всех_людей_которых_встречаю",
    "full_content": "2022-12-09 — вчера кое-что поняла всех людей которых встречаю\n*From*: Вы все живёте неправильно\n\nВчера я кое-что поняла. Всех людей, которых я встречаю, можно разделить на две категории. Одни видят мою силу, другие - мою уязвимость. Это не значит, что они не видят другого, но как будто фокус наведён на что-то одно. Что оно на первом плане.\n\nЛюди, которые видят мою силу, реагируют на меня через свои триггеры. Кто-то защищается от меня, кто-то конкурирует со мной, кто-то пытается задеть меня, из любопытства найти слабое место, и через это почувствовать близость. Это не значит, что они меня не любят. Могут сильно любить, мы можем дружить, но я всегда чувствую этот фокус внимания на моей силе и то, как они транслируют: «ты для меня опасна»\n\nКогда со мной соревнуются в силе, я начинаю играть в эту игру. Когда от меня защищаются - я нападаю, когда со мной конкурируют - я чувствую небезопасность и защищаюсь, когда мне делают больно, я выстраиваю защиты и выдавливаю человека из своей жизни. Я ненавижу себя в этих защитных реакциях, но я могу зайти очень далеко.\n\nВ какой-то момент в моей жизни начали появляться люди, которые видят мою уязвимость. Наверное, Юля была первой. Это такое чувство удивительное, когда мою силу начинают воспринимать так же, как я чувствую ее изнутри, как нечто компенсаторное, пассивное, вынужденное. Человек может чувствовать, что если со мной не конкурировать, от меня не защищаться и не тыкать меня в больные места - я просто расслабляюсь в любовь. Лена Дегтярь сказала мне: удивительно, но ты - тот друг, который меня никогда не ранил. И я знаю это свое качество, абсолютной сдачи в эту уязвимость и беззащитность.\n\nВчера у нас была очень целительная встреча с моим главным бывшим. Ох, как мы тогда соревновались, у кого из нас более железные яйца. Ни разу не говорили друг другу «я тебя люблю», или «я тебя ревную». У нас были открытые отношения, в которых я если честно все остальные контакты себе устраивала, только чтобы попытаться переключиться - настолько сильно мне хотелось быть только с ним. И я была уверенна, что ему на меня пофиг, что он просто со всеми и всегда, и вчера мы просто сидели и разговаривали о том, как оно все было на самом деле.\n\nЯ сижу в слезах и соплях, мне выходить петь фит с ВКТР, я вытираю слезы вместе с мэйком, выхожу на сцену, пою, возвращаюсь со сцены и снова ныряю в этот разговор.\n\n ⁃ Когда ты была рядом, вселенная просто исчезала за пределами нашего поля. Если бы я знал, что это все чувства про меня…\n\nЯ давала ему почитать «Дурге» несколько месяцев назад. Не все, некоторые главы. «Еда не помогает совсем, потому что не несёт в себе никакой развлекательной функции, не обладает ни вкусом, ни запахом». Я физически перенеслась в это ощущение и была в нем последние несколько дней, и к нашей встрече я пришла прям в таком состоянии, в котором я была 10 лет назад. Только теперь мне не надо было казаться сильнее, чем я есть. И ему тоже.\n\n ⁃ Там ты писала про все вещи, которые не помогают. Я помню это: как сижу в туровом басе и считаю, что и на сколько мне помогает. Я точно так же себя чувствовал. И пока я был с тобой у меня вообще больше никого не было, никогда.\n\nМы сидели и жалели друг друга, обнимали, говорили друг другу все, что должны были сказать тогда. Я была подключена ко всем тем пластам боли внутри, и это было удивительное путешествие через время, как будто человек, с которым связана эта боль, берет тебя за руку и говорит: я люблю тебя, я с тобой, я рядом, все хорошо, тебе не надо защищаться, тебе не надо вырывать меня из сердца, я просто могу тебя обнять и больше нам не надо соревноваться, кто сильнее.\n\nВ таком состоянии, как вчера, я не выступала давно. Настолько уязвимой и слабой… Дурге, та героиня из книжки, 10 лет назад вытаскивала себя на сцену, и потом падала в гримерку не в силах двигаться от боли - боль души бывает настолько физической, что разрушает тело. И там было так. Вчера на сцене мне казалось, что я упаду в обморок. Я чувствовала, как пульсирует голова, как болят почки, и все эти ощущения были мне так знакомы. Я едва могла двигаться. Я знаю, что это такое, плакать во время песни.",
    "final_title": "Всех людей, которых я встречаю, можно разделить на две категории",
    "final_annotation": "Одни видят мою силу, другие - мою уязвимость. Это не значит, что они не видят другого, но как будто фокус наведён на что-то одно. Люди, которые видят мою силу, реагируют на меня через свои триггеры.",

    "path": "data/vi_vse_nepr_export/posts_md/2020-11-18__105__делать_все_хотелось_впечатлить_его_было_не.md",
    "source": "Vi Vse Nepr",
    "filename": "2020-11-18__105__делать_все_хотелось_впечатлить_его_было_не",
    "full_content": "2020-11-18 — делать все хотелось впечатлить его было не\n\nделать все это - мне хотелось впечатлить его, но это было не минутное желание, оно как будто стало частью меня, оно трансформировало меня на клеточном уровне. Я хотела стать тем человеком, в которого я бы влюбилась, будь я Антоном. Я пыталась смотреть на себя его глазами и оценивала очень строго, но по сути дела это было когнитивным искажением - я додумывала его требования, пропуская их через призму своих идеалов, взятых из книг и моего внутреннего мира. Я представляла, какой я должна быть, и мне очень нравилась эта картинка - но без Антона у меня бы не было желания стать кем-то более сильным и интересным.\n\nВ тот момент я первый раз ощутила то, чем я отличаюсь от других. Мне было больно и невыносимо в какие-то моменты, но это чувство так же было и моей суперсилой. Используя его, как топливо, я могла сделать всё, что я хочу.\n\nРеальный Антон не искал никакой глубины, мне кажется у него вообще не было никаких ожиданий. Он купался в девчачей любви и плыл по течению своей жизни зная, как он чертовски хорош. А для меня он стал первым учителем, даже особо не принимая участия в этом процессе обучения.\n\nЯ постепенно осознавала, что это - романтическое чувство, о котором говорят взрослые и пишут в книгах, и теперь я пыталась нащупать его границы. Было понятно, что есть любовь, но я не могла осознать суть просиходящего во всей ее глубине. Я как будто оказалась на опушке леса, и я не знала, на сколько километров он тянется, как высоки деревья. Я могла оглядется, примерно понимала, как я здесь оказалась, но совершенно не имела понятия - куда двигаться? Что меня ждет? Как я выберусь отсюда?\n\nЛюбовь была безвыходным местом, в которое меня поместили обстоятельства. В один день я обнаружила в центре своей груди окончательно оформившееся физическое ощущение, которое не оставляло меня ни на минуту. Как будто это был тот огромный каменный шар, раздавивший меня в одном из моих снов-на-яву, только он теперь был во мне. Этот шар окатывался горячей лавой, падал вниз, как на американских горках - я понимала, что это чувство связано с Антоном, но не было совершенно никакого понимания, что с этим делать дальше. Мне так хотелось вытащить из себя этот ком, мне хотелось понять - это все так чувствуют? Это чувство может быть «счастливым»? Это что - навсегда? Что я могу сделать, чтобы мне стало хоть немного полегче?\n\nЯ знала, что я люблю всех своих друзей, играть с ними в казаки-разбойники, прыгать на резиночках - но без Антона все это было на 2 из 10, а с ним - просто космос. Я смотрела на него, как на сияющее неземное существо в декорациях реальности. Для меня он как будто отделялся от фона, живя сразу в нескольких измерениях. Встреча с ним и любое взаимодействие помогало мне не чувстовать острую боль, но чувство все равно было таким огромным, что не вписывалось в рамки доступных мне действий, и я просто ходила, а за мной по двору ходил смерч - он начинался в точке между моих лопаток и уходил в стратосферу, заканчиваясь там чёрной дырой, и это бесконечное сосущее чувство в гуди не давало мне покоя долгие месяцы.\n\nКогда мы начали всей компанией играть в «бутылочку», это было сплошным издевательством: со Стасиком с пятого этажа, понятное дело, никто не целовался - он был младше и какой-то слюнявый. Девочка с девочкой - это бе, оставался только Антон. И мне кажется, с ним были готовы целоваться только я и еще одна Оля, которая Клюкина, а когда бутылочка указывала на другие варианты, мы просто пропускали ход.\n\nКак целоваться - это нам объяснила Алла, старшая сестра Антона. Она сказала: «Один человек засасывает нижнюю губу, а другой - верхнюю», это называлось «взасос». Потом, уже в процессе практики, мы поняли, что это как-то странно, и не стоит этим ограничиваться. Вообще, я помню те вечера на двух скамейках, которые стояли друг напротив друга, они были самыми счастливыми. Мне казалось, что все хорошо. Но потом что-то изменилось, и я не могла понять, что именно.\n\nЯ до сих пор не могу забыть первое четверостишье первого грустного стихотворения о любви, которое я написала во втором классе:\n\n«И вот, уже другую ты\nВ подъезде прижимаешь\nЦелуешь,",
    "final_title": "Йога и духовные практики",

    "full_content": "2019-11-17 — чет тогда радовалась успеху ep хи сборам\n*From*: Вы все живёте неправильно\n\nЧет я тогда радовалась, то ли успеху EP’хи, то ли сборам на концертах - даже не количеству людей, а геометрической прогрессии. Тарас тогда сделал такое лицо, типа горькой улыбки. Запомни малышка так будет не всегда. Они жили в этом лимбе после огромной популярности, стадионов и орущих фанаток, и вроде все еще есть - может залы не такие большие в регионах, но не сказать, что дно - тем болезненнее это ощущалось, так они в компании любили слово «остывший» - оно означало тотально мертвый, и если обратиться к самому этому слову, а не к трактовке\n\nто «менее горячий чем раньше» даст вам ключ\n\nПредставь, что ты живешь в остывающем теле любимого дела, и всем своим существом чувствуешь, что так теперь будет всегда. Вернее, будет становиться только хуже. Рост прекратился. Пришло существование. Потом будут судорожные попытки оставаться на одном уровне, быстрое перебирание лапками по скользкому склону, как та несчастная белка с орехом. Вот ты кто теперь.\n\nТо есть больно не само по себе ощущение пустого зала перед тобой, не маленькое количество проданных билетов, больно само соскальзывание в эту яму, тенденция, звук, с которым тебя засасывает, как вода вытекает из ванны - убрррруббббрррр - вот так понятная тебе жизнь, где ты вкладывался и чувствовал отдачу, так она уходит, тлеет. Тенденция умирания. Вот что я чувствовала в этих словах. В этой горечи за меня. Что если есть успех - будет и эта часть. Чем выше забираешься, тем больнее падать.\n\nТогда я написала «Космос», «Главное», «Искры», и я была очень довольна собой. Все что происходило с нами, было заслуженным. Я вырвала «зачем ты под черного легла», как сорняк, и посадила на его место что-то более прекрасное, более вечное, и оно прижилось, и оно дало плоды. Наша аудитория всегда была другой. Не вся, но ее сердцевина.\n\nНо я никогда не впадала в иллюзиию. Все остывает. Но в наших силах делать все, что мы делаем более теплосберегающим, более вечным. Лучше дерево, которое цветет каждый год мелкими цветочками, чем огромный цветок на один сезон.\n\nВчера я вышла на сцену полупустого зала и спросила себя: - Ну что, вот оно? Значит вот так это происходит? Значит именно сейчас тот момент, когда надо сказать: Так, всё. И больше никогда не ездить по регионам, потому что хватит значит хватит. Я думала о том, как напишу в этот канал про Тараса и про то, что он был прав, и да, это больно, когда ты не принимаешь своевременного решения остановиться, что лошадь надо похоронить прежде, чем она разложилась - и все такое.\n\nА потом через три песни в клуб зашло еще столько же… И все такие горячие. Так что, наверное, еще не время. Есть ощущение сохранения тепла, и даже такое ощущение - увеличения температуры на несколько градусов. Так же было и с сектой - в начале мы взлетели, потому что были одни, потом рынок вырос и мы больно упали, а потом - сначала перестали падать, взяли свою стабильную высоту, выровнялись, и любой рост из той точки уже совершенно по другому ощущался. Есть успех, когда ты нашел золотую жилу, а есть успех, когда ты заслужил хорошую репутацию и постоянных клиентов - я всегда хотела второй вариант, потому что найти золотую жилу может любой дурак счастливец, а вот заработать репутацию - это уже результат труда.\n\n Но с бизнесом - это совсем другое ощущение. Там ты можешь работать над услугой и ее упаковкой. В творчестве ты выносишь свое сердце в руках, как Данко. И смотришь, насколько ярко оно освещает зал. Как громко они кричат. Как яростно танцуют. И думаешь - зря ты его вытащил из себя или не зря. Думаю, что сотни и тысячи Данко в разные времена думали: «лучше бы я с мотыгой… что ж я за дурак такой». Спрятать свое сердце обратно - порой более мужественный поступок, чем его достать.",
    "final_title": "Тарас тогда сделал такое лицо, типа горькой улыбки",
    "final_annotation": "Запомни малышка так будет не всегда. Вернее, будет становиться только хуже. Потом будут судорожные попытки оставаться на одном уровне, быстрое перебирание лапками по скользкому склону, как та несчастная белка с орехом.",

    "path": "data/vi_vse_nepr_export/posts_md/2025-09-03__259__отношения_расстоянии_интересная_штука.md",
    "source": "Vi Vse Nepr",
    "filename": "2025-09-03__259__отношения_расстоянии_интересная_штука",
    "full_content": "2025-09-03 — отношения расстоянии интересная штука\n*From*: Вы все живёте неправильно\n\nотношения на расстоянии это очень интересная штука\nТы живешь постоянно в каком-то фокусе и ожидании встречи, и у тебя есть какая-то подпитка любви, но в то же время ощущение нехватки человека. С другой стороны присутствие даже на расстоянии может быть невероятным, и ожидания писем, и когда ты сам думаешь письмами, и пишешь, рассказываешь о себе. Или такие ценные минуты звонков. У меня как будто до этого не было опыта отношений на расстоянии, и тут я это проживала на полную\n\nИнтересная вещь происходила когда разлука заканчивалась, встреча была уже вот-вот или уже происходила, какое-то огромное напряжение встречи с реальностью, страха, во что выльется все это ожидание, еще одно новое для меня состояние. Но потом проходила пара дней и все становилось на свои места, и было очень хорошо, и там появлялся такой совместный новый мир, выход за пределы моего обычного - и в плане языка и культуры и истории, я так много всего узнавала. Мой опыт показывал: если ты встречаешься с чувством такой силы, you need to praise it. Я все делала так, как я чувствую, и я сейчас даже не могу сказать в какой момент что-то пошло не так. Оглядываюсь назад и понимаю, что видимо эта история была прожита полностью в том виде, в котором была дана.\n\nЭто случилось как раз перед (или даже в моменте) встречи после долгой разлуки. Мы были на дыхательной практике, и каждый проживал что-то очень мощное, и в этом уже было прощание. В какой-то момент я встала и танцевала с закрытыми глазами, и это был танец Дурге, которая разрушает все. Мне было страшно, но я использовала мыслительное упражнение: что бы сделала та я, которая бесстрашная? Я бы сказала самую страшную фразу. То, что обычно хочется обернуть в разные смягчяющие штуки, вывести вперед что-то хорошее про любовь и радость и надежду, а это.. может спрятать в конструкцию «часть меня думает что… ». Бесстрашная я знала, что все это можно сказать потом.\n\nМне знакомо это состояние, когда ты до конца не знаешь, скажешь ты в итоге это, или все таки нет. Но я сказала. Я начала с самой страшной фразы: «мне кажется у нас нет будущего». Это не отменяет всей любви и всей важности, и всех усилий и надежды вложенных, но это такая внутренняя правда, которую просто нечестно скрывать. Мы можем еще что-то пробовать, мы можем строить отношения на этом знании, но это важно озвучить.\n\nУ меня возникают чувства к новым людям. У меня есть огромная любовь к Вадиму, и это любовь не формальная, а очень живая, в которой есть все - игривость, нежность, присутствие, страсть. Есть Дима, с которым наше расставание по факту так и не случилось окончательно, потому что там тоже есть любовь. И вот то что было у нас - оно само по себе такое объемное, оно не может ютиться где-то на краешке, оно должно занимать все место, и пытаться вместить эту любовь в свободный слот - это насилие над ней и над нами.\n\nНу вот а потом мы как-то это процессили. По факту мне не хотелось расставаться и было очень сложно отлепить себя, выдернуть из этого прекрасного кокона нежности заботы принятия и чистой радости. Педро взял это на себя, поставил точку, после которой у нас был живой афтекрер с очень нежным прощанием, а потом - жесткая тишина на месяц, которая далась мне наверное в этой истории тяжелее всего. Когда мы расставались с Димой, мы болтали каждый день по часу, а еще не прекращали семейную терапию (ржу)) может поэтому наша сепарация не удалась, но думаю что мы просто этого на самом деле не хотели. В истории с Педро сепарация была решительной и как по учебнику. И я не скажу, что это прошло бесследно - я точно до сих пор перевариваю все, что со мной в этом процессе было.\n\nИ вот прошло уже пол года, мы встречались и общались, и там не осталось драмы и напряжения, и точно для каждого из нас это была очень важная история. После этого у меня еще были истории, которые можно рассказать, и может быть я сделаю это когда-нибудь потом. Я люблю рассказывать о своем опыте, но мне не всегда нравится реакция людей, хайп вокруг всего чем я делилась вокруг личной жизни в этом году был слишком токсичным, и после этого как-то предпочитала рассказывать поменьше.",
    "final_title": "Йога и духовные практики",
    "final_annotation": "О йоге как способе познания себя и работы с телом. Размышления о том, как физическая практика меняет сознание и помогает справляться с внутренними демонами. История освоения практики и того, как она становится образом жизни и философией.",

    "filename": "77824__про_то_чем_я_сейчас_занимаюсь",
    "full_content": "Про то, чем я сейчас занимаюсь.\n\nВот она, моя\n#sekta\n17 марта мы открыли свой первый филиал - Питерский.  Ну а где нам еще открываться? )) Только тут есть MadStyle на Невском, вид на крыши, кирпичные стены, огромные зеркала -  такая атмосфера танцевальных школ Нью-Йорка, что я до сих пор не верю, что нам так повезло с местом...\nВсе сделали, как чувствовали - и систему, и чтобы у человека никаких финансовых преград не было для занятий. И вот итог: первый набор - 44 абонемента на очное обучение, еще 10 - на заочное. Полный зал каждый вечер, все выкладываются, все работают на полную. По воскресеньям - день открытых дверей, тусовка, чай, бесплатная йога... Всё так, как мы мечтали.\nЯ говорила: да сколько можно - в этих турах всю жизнь можно прожить, и не заметить... И продолжать делать одно и то же годами! А я так хочу, чтобы ко мне приходили люди, с которыми я могу разговаривать, которым я могу помогать, чтобы они удивлялись, анализируя свои успехи: \"ого, я и не знал, что я так могу!\". Я так устала от истории \"обо мне\" - а в музыке по другому не получается..  Я теперь хочу истории о них, о моих учениках... И пускай будет так, если высшим силам будет угодно.\nвот здесь группа, где можно пошерудить:\n\nу себя на странице я выкладываю всё, что важно\n\nмой инстаграм - olymarkes и в твиттере - так же.\nУ меня все еще есть живот, и быть ему еще два месяца. Все это время я буду вести занятия, в апреле скатаюсь наконец-то в Барселону и вернусь сюда, к питерским крышам, в свой новый дом на Васильевском Острове. Я волнуюсь, какой я буду мамой - но сто пудов могу сказать сейчас, я еще ничего так не ждала в жизни, как рождения этого пацана ))\nЖелаю всем света, ну и закину сюда еще один пост из VK про мою работу с магазином Yogin\n\nУ меня всегда была мечта - заниматься любимым делом. Не ради денег, не ради чувства самореализации - мне просто хотелось, чтобы каждый день мой был занят тем, от чего меня прёт.\nИ вот, наконец-то это происходит. Я чувствую себя самым счастливым человеком на свете -\n#sekta\nработает, и я занята ей целиком и полностью. Ну, и мне очень хочется рассказывать вам о своих директорских приключениях.\nИтак, рассказ первый. Еще на прошлой неделе мы решили, что каждое воскресенье у нас будет бесплатная йога и день открытых дверей.\nИ вот, наступает среда, и я осознаю что... у нас нет ковриков для йоги!!! в Мэдстайле есть пенки, но их не хватает даже на нашу группу - многие занимаются на полу, или на своих.\nИ вот, я начинаю искать, где купить в Питере нормальные ковры с оптовой скидкой. Минимум что я нахожу - это \"фрукты\" за 590 на Гороховой 49; Отстой.\nЗвоню в Москву, в магазин Yogin - пару недель назад они просто так (бесплатно и по своей инициативе) взяли и привезли к нам на московское занятие две коробки ковриков, чтобы люди не мучились на пенках.\n- Ребята, мне надо 17 самых базовых ковриков!! Можно мне скидку? И как бы мне их в Питер получить.\n- Щас решим!! - говорят на том конце провода.\nЯ уже готова оплачивать кому-нибудь из московских йогов дорогу, чтобы он по пути зацепил и привез нам эти коврики, но тут выясняется что у Йогина есть отделение в Питере, и там как раз есть нужное количество. От 10 ковриков цена за 1 получается всего 350 р (!!!!!!!), нормальных матов за такую цену вообще не найти.\nЯ тут же пишу своей группе: \"ребята, есть маза взять коврики по 350рэ, приносите мне вечером на занятие деньги, и завтра я вам куплю\".\nВ итоге сегодня я покупала 37 ковриков!!!! ))))))) В магазине меня встретила Наргиз - такая красивая и приветливая девушка с дредами. Пока она подбирала коврики, я ударилась мерить майки, футболки и платья.\n- А хочешь, мы тебе сумку для коврика подарим?\nНу какой йог откажется от такой крутой сумки? )) Я проторчала в магазине часа два, мы пили чай, Наргиз рассказывала мне про все-все-все виды ковриков, я пробовала их на \"липучесть\", и в итоге мы нашли коврик, как у меня - т.к. я его не покупала, я не знала как именно он называется, а ему как бы уже конец приходит - стёрся он практически до дыр сквозных.\nТеперь у моего йогамата будет преемник))\nА еще все из\n#sekta\nтеперь могут покупать там все со скидкой 10 процентов ) вот их сайт -\n\n, мне хочется сделать им приятно и рассказать, какие они классные люди:\nВот казалось бы - бизнес и бизнес, в йоге тоже крутятся деньги, люди зарабатывают на йога-турах, центрах, семинарах, на продаже техники для нее.. Все в этом мире создано, чтобы каждый занимался своим делом, и при этом мог кормить себя и семью - я давно поняла, что в этом нет ничего такого... Но вот КАК люди это делают?!\nЯ не говорю там о скидках или подарках... Но хотя бы отношение, забота! В некоторые йога-центры приходишь, и тебе даже не улыбнутся... И я привыкла ожидать, что люди гонятся за своей выгодой и только. А тут, знаете.. Такой, чисто питерский бизнес по настроению: как будто друг делает для друга, помогает, и все счастливы.",
    "final_title": "Йога и духовные практики",
    "final_annotation": "О йоге как способе познания себя и работы с телом. Размышления о том, как физическая практика меняет сознание и помогает справляться с внутренними демонами. История освоения практики и того, как она становится образом жизни и философией.",

    "full_content": "вообще я сама не могу поверить что я зануда - на всех видео я ржу как конь )))\n\n- Оля ты употребляешь героин?!\nте кто поскромнее просто исподтешка смотрят на сгибы моих рук.\nВ Екатеринбурге все и так знают, как у меня дела. Говорят: \"ДА Я ЧИТАЛ В ТВОЕМ ЖЖ! а про кого это?\"\nЕкатеринбург - это Сан Франциско. Лучший друг, семья, любимые улицы и небо, и лучшие в мире ресторанчики. В деке моей тачки патриотично качает Восточный Округ, я ложусь спать в пять утра и веду богемный образ жизни - шляюсь по ресторанам, кино и гостям.\nПрочитала \"Беглецы и Бродяги\" Паланика, так вот - я напишу по любому такой же путеводитель по ЕКБ.\nГринвич.\n\"....Когда то здесь был супермаркет МАРИЯ. Он был большой а еды там было мало. Теперь Гринвич огромный, там куча всякого дерьма. По ночам это место становится центром вселенной. Если вы хотите повстречать кого-нибудь из  культовых персонажей Екатеринбурга - отправляйтесь в Гринвич после часа, когда улицы города опустеют. Богема не работает с 9 утра, этим модникам не надо рано вставать, и они медленно гуляют по нарядным рядам дорогой и качественной жратвы, холодно здороваясь с другими представителями богемы....\"\nТак тесно и по-семейному все здесь, все про всех все знают и почему то недолюбливают за глаза. Это просто от того, что уже любить друг друга устали. Истории развиваются циклично, любовь и ненависть, несуетливое творчество, одни и те же названия на разных афишах...\nПочему-то я немного побаиваюсь этих людей. Кажется что в момент моей слабости и боли они просто будут равнодушно скользить глазами по тем, что раньше было мной. Просто с кем-то нужно поздароваться, а с кем-то не обязательно. Это и есть тусовка.\nИ рассказать мне особо нечего всем знакомым - они читают мой жж. Может и правда, к черту эту графоманию?  Буду снимать ролики для ютьюба по сумасшедших людей вокруг меня.\nА еще, кстати, ночью у Гринвича ко мне подошел очень пьяный и при этом очень милый мальчик. Он так мне понравился, что я ему даже написала телефон на бумажке.\n- Оля.\n- Я знаю...\nНо он так и не позвонил. Обломись, Оля, обломись!!! ))))))\nАвторский метод моего младшего брата ))))) хит!!!\n- Паша... У меня нет сил. Я не могу больше идти. Я пойду только если ты наденешь эту кофту.\n- Хорошо. Я пойду в этой кофте и без трусов.\n- !!!!!!\n- Ну ладно. В трусах. - снимая штаны.\n﻿",

    "full_content": "EP \"Главное\". 7 марта Спб (Космонавт) 8 марта Мск (P!pl)\n\n1. Долбаный Космос.\nЭто было где-то …\nНочь. Мы уезжаем из клуба, через часик после концерта. Собрали инструменты, загрузились в легковушки. Парни в одной, мы с Катей и организатором в другой.  Они включают музыку…\n- Кто это?... – в середине трека спрашиваю я\n- Энимал Джаз… Ты не слышала их что ли??\n- Нет…\nИ мы едем по маленькому, заснеженному городу -  и вдруг я вижу ребят с нашего концерта, небольшую компанию: кто-то держится за руки, кто-то прыгает вокруг, ну.. идут по улице, гуляют, бесятся… Хороший, значит, был концерт – даже если по пути не отпускает…  И у меня сердце наполняется такой радостью, оно переплетается с музыкой.\nЯ скучаю по одному хорошему другу. Они тоже где-то в туре, и наши «космические шаттлы» - от Иркутска до Киева, во всех часовых поясах рисуют зиг-заги на карте, неделю за неделей… И дни летят, как секунды – и я не замечаю, что я не вижу родных по пол года.\nЯ забываю, как открывается дверь в моем подъезде. Я забываю, какая у меня одежда в шкафу.  Я забываю, как это – ночевать в одном месте больше одного раза.\nНо есть кто-то, о ком сложно забыть даже на минуту. И это – не больно. Я чувствую, что этого тепла хватит, чтобы укутать весь земной шар. После каждой встречи я задерживаю дыхание, и весь мир – непостижимый  и красивый до рези в глазах – он весь связан с тобой. Эти цветы и звездочки в моих легких…  Знаете, так бывает: когда ты выходишь из дома, и готов на все-все-все-все-все-все, когда ты все любишь, когда ты всем живым существам дочь, сестра и мама.\nЯ хочу так жить! В нашей стране столько городов, и в каждом есть эти ребята. Эти охуительные, неповторимые, нереальные чуваки – и я когда то была такой же в своем Екатеринбурге. И я когда-то ждала этих концертов в моем городе, и смотрела глазами, полными огня, на сцену.\nВ музыке – любовь, сила и надежда. Мне не нужно ничего кроме этого чувства – я почтальон и… принесла эту весть: «Все хорошо, родной мой человек! Мы – вместе! Таких как мы – тысячи! Мы живые, настоящие… У нас все сбудется!» и я смотрю в глаза, и чувствую – они понимают! Я не ошибалась. Я не придумала их – таких же как я людей.  Мы с одной планеты. И это все – для них…  Это все для вас.\nСколько вас!! Такие красивые, такие разные и теплые.. Ваши подарки, ваши письма, записки, журавлики – это все так важно для меня! Делать для вас музыку, записывать ее на самой лучшей студии Питера и выкладывать в интернет бесплатно… - это то же самое… Труд и лишения, которые в радость…\nПо итогу знаете что получается?? В нашем круговороте нет корыстных целей  -  мы живем, чтобы радовать вас… И пока вы радуетесь, мы будем.\nВы приходите на наши концерты, платите за билеты,  мы берем эти деньги и несем на студию, записываем новую музыку и… вы снова ждете нас, чтобы услышать ее в живую… )) Прекрасный круговорот космической энергии…\nЭти три песни – для вас, про вас и…. Вам. Со всем моим почтением, признательностью, сердечной благодарностью за все ваши теплые слова, руки, глаза… ВО МНЕ СТОЛЬКО ЛЮБВИ И РАДОСТИ, ЧТО ЕЕ НЕ ОПИСАТЬ ))))\nНо наш EP “Главное” – он вместил все чувства от и до. Особенно песня \"Долбаный космос\".  Она тем, кто любил нас и поддерживал все это время. И ОСОБЕННО тем, кто принимал нас в трудные времена. Тем, кто разделил нашу боль \"SattaMassagana\". Пожалуйста, знайте как вы важны для нас.. и...  И скоро вы все услышите сами…. ;)",

    "path": "data/lj_export_clean/posts_md/2013-03-21__78394__невыносимая_жесткость_бытия.md",

    "filename": "2013-03-21__78394__невыносимая_жесткость_бытия",
    "full_content": "невыносимая жесткость бытия\n\nЕсть такой миф, что люди с возрастом выдыхаются. Теряют градус, как крепкий алкоголь, оставленный без крышки. Нет, малыш. Мы все те же. Только жестче, в миллион раз жестче.\nУ меня было много классных парней – да да, ты никогда не согласишься с этим, в твоем понимании все мои бывшие должны быть отправлены в печь, но с какой-то стороны они действительно были классными. Даже со всех сторон, если оглядывать придирчивым взором только те грани, которые лежат на поверхности.\nКрасавец, душа компании, супер-тусовщик . Те качества, которыми принято обладать, чтобы нравиться людям и девочкам в частности. Но стоит подойти поближе, копнуть поглубже… оуууууууууу соу боринг, соу факин боринг.  Нет нет, ничего личного, мальчики – вы классные, но это не то, не то..\nЯ жесткая. Я очень жесткая. Я не такая жесткая, как Лидия Ланч – секс нельзя записать в перечень моих одержимостей. Я не такая конченая, как Эми Вайнхаус –- из нас двоих героин предпочитаешь ты. Я не такая мудрая, как Улицкая, но работаю над этим, возможно, ближе к старости? Я никогда не буду хорошо петь и писать, и моя жесткость совсем не в этом. О ней никто не знает – все видят лишь ее отголоски, ее отражение в этом мире.\nМне постоянно снится что я лечу. Не «ПОНЕБУЛЕЧУ» а так, немного – на порыве ветра делаю вдох и отрываюсь от земли сантиметров на пять. Могу так секунд 40 продержаться. И вот вся моя жизнь представляется мне таким аттракционом: я сделала вдох, оторвалась от земли,  но скоро это закончится. А все думают, что я неебически воспарила.\nНо ты.. ты!! ТЫЫЫ!!!  Как можно, как можно было переплюнуть меня в моей жесткости? По тебе ведь с виду и не скажешь. Ты, как истиный конспиратор, не создаешь никакой иллюминации. Ты охуительно хитрый лис. Тебе не нужно никому нравится, ты не тратишь силы, чтобы стать всеми желанной бумажкой в сто баксов.\nТы просто берешь и ебашишь.\nНет, сейчас я не про это.. Ты ебашишь, как телеканалы Дискавери, БиБиСи, Энимал Плэнет, Хистори Ченнел, ты ебашишь, как большая советская энциклопедия, как чертова библиотека конгресса. Ты ебашишь тексты, как Паланик и Ирвин Уэлш, но не так занудно.. ты вообще самый незанудный человек из всех, кого я встречала. Ты - невероятная, охуительная бездна. Я – тупая пизда )\nМы с тобой попали в интересную передрягу – как если бы у Тайлера и Марлы родился ребенок и бегал бы по этому полу-разрушенному дому, где с дырявой крыши течет вода, а угрюмые, молчаливые чуваки варят мыло из человеческого жира.  Почему это не сделало нас мягче, спокойнее, скучнее? Визуально – может быть, но там, внутри…  Истиная наша природа не меняется.  Мы с тобой настолько одинаково больны, что даже смешно.  Когда мне снится, что мы торчим вместе (а не по очереди,  навещая друг друга в рехэбах,  как это принято у нас в семье, бгагага) даже во сне всему настает полный феерический пиздец. Еще одного шанса у нас не будет, так что весь треш оставим для следущей жизни.\nЕсли бы мы жили в Вегасе и бухали, я бы выходила за тебя замуж каждый день.  Моя обаятельная мразь, обожаемая сволочь. Веди себя хорошо, ты мне нужен, понял, да??  Пиздец как. Вот.",
    "final_title": "невыносимая жесткость бытия\n\nЕсть такой миф, что люди с возрастом выдыхаются",
    "final_annotation": "Теряют градус, как крепкий алкоголь, оставленный без крышки. Только жестче, в миллион раз жестче. У меня было много классных парней – да да, ты никогда не согласишься с этим, в твоем понимании все мои бывшие должны быть отправлены в печь, но с какой-то стороны они действительно были классными.",

    "full_content": "Олди.\n\nОлди говорил: тебя уже никакой стафф не вставит, даже самый качественный - и смысла нет. Он говорил: \"не можешь быть отравлена, ни проклята ты. И смеялся так: \"хе хе хе.. Вот так-то, тетя Оля!\"\nОн говорил: \"когда мы Филю хоронили, на небе тучи расступились - это его душа улетела, Бог ее принял.\" А я как раз Филе так много не успела сказать, так много не успела я ему сказать в последние наши встречи. \"..бездонного ленинграда\", русский рутс в моей крови с любовью к этому голубоглазому. В бэкстейдже московских больших клубов - Горбушка, Б1 максимум - \"я пересекаю моря, океаны, горы, чтобы пройти мимо тебя, опустив голову.\", ну хуле - не могла я из себя ничего выдавить в атмосфере фестивального кипиша.\n- Расскажи о нем еще.\nС тех пор я всегда все успевала. Первая и последняя волна русского реггей встретились в лесах под Калининградом, пели и гуляли вдвоем и я спрашивала все-все-все что придет на ум, и была тем влюбленным подростком с плейлистом из одного комитета охраны тепла в плеере, и была уже собой - взрослой, циничной, разочаровавшейся во всем и вся, и в русском реггей в том числе, попустившейся и тем счастливой. Просто квинтессенцией быдла были мы, сидя на газоне Марсова поля. Мимо нас маршировали женщины - милиционеры, мы ждали его дочку из школы было жесть как солнечно и у нас была куча времени.\nЯ все успела - и даже на репетиции Комитета побывала на чердаке раста-комунны. Мы с Димой остались там ночевать, он накурился в слюни и сопли а я наелась бутиков с домашним маслом и сыром, посидели у костра и легли спать.\nНочью я проснулась, нашла ногами кеды у кровати, и по спящему дому стала тихонько пробираться к выходу. За окнами я увидела утренний туман, он окутал дом странной звенящей тишиной.\nСпустилась по лестнице, повернула на кухню - вот тут-то передо мной вырос Олди.\n- О, это ты... Эта... Регги-певица эта, да? Чо не спишь?\n- Я это, пи-пи . Щас вернусь.\nЯ так и не легла спать в тот день. Промочила кеды в росе, испачкала белые джинсы. \"Держись!\" - говорил он, оттопыривая локоть руки, торчащей из кармана. Я чувствовала себя неловко, но не решалась ему отказать - хваталась за его руку и мы шли гулять по пустынной деревне.\nВ следующий раз мы встретились в Питере. Оказалось, мы живем чуть ли не в соседних домах - он звонил, и мы шли гулять. И все эти разговоры очень важны для меня. Может быть когда-нибудь я напишу все, что помню из них. Или пускай останутся только моими...\n- А еще Филя мне подарил кольцо, которое когда-то подарил ему ты. Филя сказал, что у меня все получится.. А когда-то ты сказал ему так же.\nПотом он пришел ночью, позвонил - говорит: у меня для тебя кое-что есть. А я сплю, прямо сил нет встать.\n- Дим, сходишь? Там Олди у арки ждет.\nВот сейчас смотрю на этот его подарок и думаю: две мои любимые группы - Карибасы и Комитет Охраны Тепла, лидеров обеих нет уже здесь, и не было после них русского реггей для меня. И оба они оставили очень много во мне, и своими песнями и разговорами со мной. Как будто кто-то сверху послал мне учителей, и дал мне немного времени побыть рядом с ними. Мы не знакомились, мы встречались как будто не в первый раз, и сразу много информации обрушивалось на меня. И не важны подарки - вещи. Важны подарки - встречи. Ведь они уже там, а я - здесь, одна.\nПочему я больше не хочу Alai Oli? Не бойтесь, я не брошу дела. Будет и третий альбом, и будут концерты. Просто время подходит к концу, и я это чувствую. Чутье меня никогда не обманывает.\nНе было у меня никаких амбиций, просто я делала то что хочется и всегда буду - пока прет музыка, будет музыка. пока прет йога - будет йога. Главное ведь быть с собой честным и делать то, что нравица. Разве нет?",
    "final_title": "Йога и духовные практики",

    "full_content": "давайте делится - вкусы они вообще разные или всем нравится одно и то же?\n\nРаз уж тут весна, май, вся фигня - рассказывайте, каков он - ваш идеал.\nНу типа человек, с которым вы бы хотели объявить себя парой и заселится в отдельный домик, ахаха. Ну или хотя бы на кого вы на улице обернетесь ))\nпро мальчика\n1. Внешность\n\"Героиновый шык\" - это не в моем вкусе. Мне нравяцо подтянутые крепкие мальчики, ну чтобы могли медведя голыми руками ну или хотя бы 5 раз подтянуться. Рост около моего.\n2. Обвес\nТатуировки - да, пирсинг - ну так, дреды - ну смотря как он за ними следит.\n3. Прикид.\nХипстеры мне не очень нравяцо - адепты секты журнала Афиша. Главное в человеке это обувь, конечно. И эта обувь - кеды. Gravis, Supra - высший пилотаж. Конверс - классика, любые скейтерские - неплохо, Найк и Рибок в основном арэнбишная попугаечность, но лучше чем туфли.\nМне нравяца парни \"на скейтерском\" - чтобы одежда была простая, удобная, недорогая, но при этом красивая. Animal, Burton, Analog, Volcom, Matix, DC - все эти бренды делают хорошие вещи и для телок и для мужыков.\nСумка Gravis лучше чем рюкзак Dakine. Часы Nixon лучше чем G-shock. Браслеты из кожи лучше чем фенечки. Подвеска из черной кости лучше чем бусики.\n4. Богатый внутренний мир/род деятельности\nМне нравяца безработные раздолбаи, но не сидящие на родительской шее, а живущие на свои гонорары )) Нравяца бедные музыканты поэты художники диджеи фотографы прорайдеры звукорежиссеры актеры театров\nесли слушать, то лучше русский рэп чем американский, дабстеп и дансхолл лучше чем транс и минимал, Ленни Кравиц лучше чем Депеш Мод. Радио Максимум лучше чем Наше радио. АК47 - стопудова нет. 2h company - стопудова да.\nЛюбить книжки лучше, чем ничего не читать. Менс Хелс лучше чем Maxim.\nбыть чистым лучше, чем курить, бухать и торчать.\nно лучше бухать и курить, чем быть занудой.\nВерить в любую высшую силу лучше, чем не верить вообще.\nДевочки.\n1. Внешность\nЗдоровая, мягкая, женственная - минимум косметики и обвеса, телосложение не имеет значения, я люблю в женщинах внутренний свет и ощущение что это существо спокойно и счастливо.\n2. Обвес\nТатуировки очень редко мне нравятся, только у девушки Бро - Светы. Вот у нее крутые ) Дреды - да, пирсинг - нууу.... Бывает и красивый.\n3. Прикид\nТапочки, мягкие мокасины, кеды конверс, балетки, сапожки без каблука. Круто когда девушка может побежать за автобусом или за мечтой, там ))\nда все что угодно )) обожаю девушек которые одеваются как девушки, а не как тети. Лучше больше одежды, чем меньше. Девочки на хип хопе - моя особенная страсть, если при этом они не теряют женственности в повадках. Этно наряды мне не очень, но бывают исключения.\n4. Внутренний мир.\nДдя меня женская душа - потемки. Я и в женскую дружбу с трудом верю, и вообще слабый пол не очень хорошо понимаю, у меня всю жизнь с чуваками лучше дружить получалось. Но если бы я выбирала себе девушку - я бы хотела, чтобы она была сильной - это обычно девушки, которые занимались/занимаются спортом или катаются на чем-нибудь.\n﻿\nМожно написать только про противоположный пол! )) или выкладывать фотки, если вы уже нашли.",
    "final_title": "давайте делится - вкусы они вообще разные или всем нравится одно и то же?\n\nРа...",
    "final_annotation": "Ну типа человек, с которым вы бы хотели объявить себя парой и заселится в отдельный домик, ахаха. Ну или хотя бы на кого вы на улице обернетесь ))\nпро мальчика\n1. Внешность\n\"Героиновый шык\" - это не в моем вкусе.",

    "filename": "2012-05-21__75919__julliet",
    "full_content": "Julliet\n\n«Джульетта спит, а я рядом просто жду\nКогда подействуют таблетки и я уйду\nМедленно в пустоту…»\nЯ люблю когда она включает этот трек. Маленькая сучка достает вещи из шкафа, примеряет и разбрасывает их по полу. Ненавижу, когда она так делает. Особенно, когда она торопится куда-нибудь она даже не может – какого черта?! – собрать все это в аккуратную кучку.\nИ все эти разноцветные майки из топшопа, шорты, леггинсы, кеды – все это как яркие кляксы мозолит мои глаза. Она уже в прихожей. Сейчас вернется, хах. Вот, слышите – прыгает на одной ноге. Другая уже в белом кеде. Забавная, такая она у меня забавная. Я достаю из кармана ключи от квартиры и подсовываю под одну из тряпок на полу.\nОна ищет. Злится. Ругается. Ууууу, какие слова! Ну? Ну? На тумбочке – холодно. В другой сумке? Холодно!\n- Блять блять блять блять блять ну где, где эти чертовы ключи, а?! - хнычет так жалостливо, что я уже жалею, что так далеко их спрятал.\nОна садится на пол в окружении своих вещей и начинает аккуратно их складывать.\n- Понятное дело, такой хаос развела – ничего не найти. О… ОООО! КАК ОНИ ЗДЕСЬ ОКАЗАЛИСЬ!?\nНа одной ноге она прыгает обратно и я слышу, как закрывается дверь – два оборота ключа – это четыре щелчка. Почему она всегда закрывает только на нижний замок? Ну почему, почему она опять не выключила свет в ванной? И дверь не открыла – там сейчас будет влажно и жарко, и будут плодится болезнетворные бактерии.\nИ вот, Что мне нужно сделать? Я вздыхаю и принимаюсь за дела. Для начала выключаю из розетки утюг. Выключаю свет, открываю двери в ванной, все форточки. Отламываю немного багета, жую. Она опять забыла убрать хлеб в пакет – засохнет ведь!! Ну и поделом, пускай потом сухарь грызет. Целую буханку на случай, если она задумает его выбросить. Съедаю самую мягкую помидорину из миски – я ведь знаю, что она всегда выбирает самые твердые.\nПотом я подхожу к компьютеру и нажимаю на пробел на клавиатуре – музыка пропадает. Я остаюсь в тишине и сажусь ждать ее. Мне нравится лежать на широком подоконнике и смотреть в окно. Я могу проводить так все время. Люди в других квартирах смотрят телевизор – я слышу голоса дикторов и актеров, в них нет настоящего. Камера искажает реальность еще до того, как они открыли рот.. Глупые, какие глупые люди – они смотрят в экраны и мониторы, они видят целый мир, хотя знают – ЗНАЮТ – это лишь ноли и единицы, единицы и ноли.\nРеальны лишь облака. Они – огромные информационные буферы, текут через пространство и время, захватывая все самое важное что происходит в этом мире. Не политика, не природные катаклизмы. Я знаю, как рождаются самые красивые песни и самые честные книги. Я слышу голоса в голове Чака Паланика – обрывки фраз героев, цитаты, целые главы – то, что облака успевают захватить, пролетая над его домом. Облака ловят информацию, которая течет сверху вниз и снизу вверх – в космос. Так что когда кто-то достигает духовного пробуждения – я тоже узнаю об этом. Этот хлопок одной ладонью, эти книги, идеи и песни – больше в мире нет ничего важного.\nИногда она уходит надолго. Я начинаю грустить, когда вижу посреди комнаты ее большую сумку – моя девочка бегает вокруг нее, как заведенная - скидывает туда тряпки и тюбики, а потом упихивает все ногой, чтобы застегнуть молнию. Она забавная, забавная, забавная. Я буду скучать.\nИ каждый день так – даже когда она уходит ненадолго – я боюсь, что она не вернется вечером. Пускай возвращается. Мне больше ничего не нужно.\nИногда она возвращается не одна. Ну и вку-у-у-у-ус….. Это вообще что такое? Штаны висят, кепка, походка будто в штаны наложил? Сижу на кухне. Утром плюю ему в чай.\n- Чай горький;\n- Понятно, горький! Это ж пуэр.\nСудя по лицу она и сама не рада. Бедная моя. Тем вечером она в пижаме обнимала большую плюшевую рыбу и говорила, что больше никого и никогда здесь не будет – и в ее душе не будет ничей ноги, потому что все эти существа глупы и бесполезны, а любовь придумали чтобы кино было интересно смотреть.\nМы смотрели кино, и я уснул рядом с ней. Как я мог упустить этот момент? Нам нельзя, нельзя это делать. Ка-те-го-ри-че-ски. Вообще я считаю, что все это предрассудки прошлого. В конце-концов за нами никто не следит. Только облака. Но кому они могут рассказать о нас? И кому было до этого дело?\nЯ живу на этом месте тысячи лет, и вокруг многое менялось. Домовой? Да вы с ума сошли. Я был здесь еще до того, как появилось слово «дом» и то, что оно обозначает. Мое сознание тоже менялось много раз – я как облака впитываю эту реальность и меняюсь навсегда. Но одно остается неизменным – я дух этого места. Когда появились люди – все стало сложнее. Тогда и появились первые правила. Нельзя привязываться к ним. Нельзя уходить за ними. Нельзя нельзя нельзя нельзя – и никто не объясняет почему, но все это знают.\nИ я открыл глаза рядом с ней, и я первый раз вспомнил все. Все – это не только этот год, и прошлый и несколько предыдущих – я никогда, никогда не думаю о прошлом, потому что на самом деле его не существует – разве что в каких-то ситуациях я вспоминаю: «О, а в прошлом году она больше любила твердый сыр – а в этом она любит мягкий». Я вспомнил все.\nСначала была длинная зима; И я смотрел на облака – они пели мне о тишине и покое. Потом были взрывы и на небе зажглись светящиеся пятна – и облака стали звенеть, как колокольчики – ведь во всей вселенной зарождалась жизнь – а это похоже на звук маленьких серебряных капель. Нет ничего прекраснее, чем жизнь. Она и есть абсолютная красота.\nЯ вспомнил все. Миллиарды лет и тысячи тысяч живых существ, которые жили и умирали здесь. И я не могу вспомнить ни одного, которое было бы прекраснее, чем эта девочка. Ее каштановые кудри пахли шоколадом и нежностью, и аккруатный носик тихо вдыхал маленькие пылинки вместе с воздухом – и каждый теплый выдох оказывался именно тем самым – концентрацией жизни, ее истиным смыслом – и я гладил ее волосы и я дышал вместе с ней, и прижимался всем своим существом к ее хрупкой спине – моя, моя, моя, моя….\n- Я не хочу никуда идти, мне дома хорошо. - и она вешает трубку, и это – высший бал за все мои труды. С тех пор она всегда ночевала дома и я спал вместе с ней.\nА потом я снова увидел эту сумку. Наверное, если бы у меня было сердце – оно бы сжалось, или заболело бы.. Но ей нужно было уехать - и это я тоже знал.\nИ вернулась она не одна. Как она смотрела на него… Когда идет война, облака приносят красную рябь. Она стекает дождем по стеклу и я слышу крики и вижу слезы, вспышки и кровь . Война – это ненависть и боль. И я почувствовал то же самое в тот момент. Ненависть и боль.\nЯ сидел у стены и смотрел. Как он снимает с нее футболку и нежно целует ее шею, и ключицы, и ниже, ниже – и как она улыбается и смотрит ему в глаза и шепчет что-то такое ласковое… Я бы так хотел хотя бы раз услышать, что она говорит так… со мной.\nОни любили друг друга так, что не замечали меня – я разбил чашку, хлопнул форточкой – ноль внимания… Тогда я просто встал рядом с кроватью и…\n- Я только что видел тень.\n- Не бойся, у меня здесь домовой. Он офигенный, ты ему понравишься… Ты ведь нравишься мне – значит и ему тоже…\n«Ага, как бы не так» - думаю я.\nЧто делают в таком случае люди? Они уходят. Куда могу уйти я? Как мне жить без …. Даже не буду рассказывать, что я делал. В любом случае это выглядит смешно и жалко. Как будто все здесь устроенно так, чтобы я не мог ничего изменить.\nЕсли бы я мог плакать от бессилия – я бы плакал. Когда я видел, как она счастлива – мне хотелось лечь и стать одной из ее цветастых тряпок на полу – они валялись вокруг кровати и я видел, как они стягивают с себя эту лишню кожу, не переставая целовать друг друга ни на секудну. И ее теплые выдохи становились чаще и я не мог оторвать своего взгляда от нее даже в эти минуты – так она была прекрасна. Мне хотелось просто избавится от этой боли. Ее было невозможно терпеть.\nЗато теперь я понимал многипе «нельзя».\nПотом они заснули. Я подошел и поцеловал ее шоколадные кудри, я прижался к ее спине. Я послушал, как бьется ее сердце. И я коснулся ее глаз и его глаз тоже. Я могу подарить людям очень крепкий сон, чтобы они не мешали мне делать свои дела - чтобы случайно не проснулись и не увидели меня, и не испугались… Мы должны быть невидимыми. И сегодня мне нужно, чтобы они очень крепко спали.\nЯ пошел на кухню и повернул все ручки на газовой плите, открыл духовку, проверил, чтобы все форточки были закрыты. Потом я лег на свой любимый подоконник и стал смотреть на облака.\nМне казалось, что вечность несколько раз растянула и сжала время. Я боялся вставать и я пытался услышать что-то в той комнате, где спала моя… моя… моя любовь?!\nТогда все во мне взорвалось и вспыхнуло миллиардами криков отчаяния – всеми войнами и муками голода и боли, услышаными мной когда-либо – через доли секунды я стоял над ней и..\nКаждая кудряшка. Глаза, носик, немного приоткрытые губы – такая нежная, когда спит. Плечи, тонкие руки, кисти. Каждая линия ее тела, каждая ее черточка – все то же самое… Я знаю его наизусть. Я люблю каждую клеточку.\nИ я обнял ее и… как той длинной, бесконечной зимой.. ничего. ничего. ничего. ничего. ничего. Все тоже самое, только тишина, тишина, тишина. Все то же самое, только сердце больше не бьется.\nТогда моя боль сжала меня в точку, и я продолжал уменьшатся, и меня стиснули миллиарды атмосфер пока вся моя боль, слившись со мной, не дошла до последнего предела – и эта точка вспыхнула и взорвалась, и эта самая искра была последней секундой – и последнее что я видел – огромный взрыв…. Огромный взрыв. Тот самый огромный взрыв, который породил нашу вселенную.\nТак что больше не спрашивай меня о том, что было «ДО». Мне больно вспоминать об этом.",
    "final_title": "Julliet\n\n«Джульетта спит, а я рядом просто жду\nКогда подействуют таблетки и я...",
    "final_annotation": "Маленькая сучка достает вещи из шкафа, примеряет и разбрасывает их по полу. Особенно, когда она торопится куда-нибудь она даже не может – какого черта?! – собрать все это в аккуратную кучку. И все эти разноцветные майки из топшопа, шорты, леггинсы, кеды – все это как яркие кляксы мозолит мои глаза.",
    "display_date": "2012-05-21T21:28:00+00:00"

    "filename": "22314__after_party",
    "full_content": "after party\n\nВ Ижевске 8.30, сейчас парни поедят макарошки, мы прыгнем в тачку и поедем в Москву. Надеемся быть там уже этой ночью.\nКонцерт был невероятно крутющий - звук, свет, около 600 человек - и все такие качевые ))) Шорты были гвоздем программы, и достались в итоге симпатичной девушке в первом ряду.\nГолос у меня был как у Монсеррат Кабалье, видимо не зря я выпила 4 литра молока с медом - я вообще кроме молока в день концерта ничего не ела ))\nГлавные герои шоу\nПотом была долгая афтограф-сессия, пресс-конференция и тусовка дома у наших друзей WTQ, там мы провели весь Димин день рождения.\nКутеж удался, гастроли удались.\nА так - для меня Ижевск всегда был местом с двойным дном. Офигенные концерты, а то что творилось за сценой - это целая глава моей личной истории. Первый раз, когда мы оказались здесь, я съела столько наркотиков, что выпала из жизни на несколько суток. Мы влюбились в WTQ и не расставались с ними следующие пол года: то они к нам, то мы к ним. Потом мы с Щекалевым пол страны автостопом изколесили. Когда я возвращаюсь сюда, мое желание жить, не употребляя ничего, всегда подвергалось испытанию. Я боялась, что мне снова захочется всего этого треша и угара, и раньше мне хотелось.. А теперь совсем нет. От этого очень радостно - я теперь могу тусить с моими ижевскими друзьями, чтобы они не делали, и не напрягаться.",
    "final_title": "30, сейчас парни поедят макарошки, мы прыгнем в тачку и поедем в Москву",
    "final_annotation": "Надеемся быть там уже этой ночью. Концерт был невероятно крутющий - звук, свет, около 600 человек - и все такие качевые ))) Шорты были гвоздем программы, и достались в итоге симпатичной девушке в первом ряду. А так - для меня Ижевск всегда был местом с двойным дном.",
    "display_date": "22 сентября 2009, 08:25"
  },

    "full_content": "из подмосковья в подмосковье\n\nя объелась роллов. я обняла стопку старых журналов Men's Health, хожу с ними туда-сюда и роняю скупые слёзы на пол. Эх, были же времена - Алексей Яблоков был главным редактором моего любимого журнала. Но речь не о том.\nВчера был концерт в Москве. Пользуясь случаем, хочу передать привет всем тем, кто говорил, что мы не соберём Икру 3 января. Бе бе бе )) Да ладно, я и сама не ожидала настолько полного зала.\nБыло очень круто. Мы сыграли всё - новое и старое, Дима с Жиром даже рэп почитали, а я играла на барабанах..\nНочью была афтапати в большой и красивой квартире на Проспекте Мира. Дима опять зажигал, цыганская морда. Кстати, вам я ещё не рассказывала, как он трахнул буфетчицу вагона-ресторана?\n- Оля. Она мне сказала: \"Корми свою тёлку, пои её кофе, отводи в свой вагон и возвращайся\". Что мне делать?\n- Тёлку это меня чтоли?\n- Ага.\n- Ну дак пои меня кофе, да я пойду! Хоть будет что рассказать!\nНайдется хоть одна женщина, которая покорит его сердце, а не кое-что другое?!?\n***\nСегодня был концерт в Коломне. Это 2 часа на электричке от столицы. Было как-то тяжело мне, и даже часовая программа далась мне с трудом. Потом ещё ехать на электроне обратно...\nСтоим у клуба, ждём такси. Подъезжает чёрный крузак, из него вываливается наш друг Виталик Королёв с очаровательным букетом цветов и с друзьями.\n- ?!?!?! Мы опоздали?! 200 километров ехали, блин, чтобы на концерт попасть!\nВ результате мы с Бро попрощались с алайоли фэмили и поехали в Пушкино, в дом, где живет Виталик.\nМы быстро быстро летели по пустынным трассам, изредка включая сирену. Машины прижимались к обочинам а мы ехали дальше. Я прослушала новый альбом Гуфа, и мне неожиданно понравилось. Разные знакомые поговаривали, что его бросила подруга и он снова начал торчать, так что я как-то не ожидала от него сенсаций... А тут - такое качество. И минуса, и тексты хорошие. Молодец Гуф, крутой альбом жахнул.\nДоехали до Пушкино под такие саундреки, купили роллов в ресторанчике, куда нас не пустили из-за отсутствия каблуков на ногах женской части тусовки.\nПотом у Виталика в комнате я нашла МэнсХэлс, обняла стопку журналов и стало мне счастье. Боже, храни моих друзей во всех концах этой страны и земного шара, их уютные дома, тёплые глаза и руки и добрые души ) И ещё - храни Алексея Яблокова, любимого моего.\nЗавтра утром самолёт в Питер.",

    "path": "data/lj_export_clean/posts_md/80114__записки_графоманские.md",

    "filename": "80114__записки_графоманские",
    "full_content": "записки графоманские\n\nМне чудовищно тесно в одном человеке. Но жаловаться, конечно, грех. Пару дней назад вышел наш новый клип «Тлен» - как ни странно, благодаря паре эпиграфов большинство зрителей поняли смысл. Это хорошо. Это хорошо, потому что одно из моих внутренних «я» - которое творческое - оно остановилось в своем закономерном развитии и не заматерело, мне все еще важно говорить с моим слушателем, мне все еще важно знать, ради чего все эти концерты и бесконечная студия и репетиции и вообще все это - то, что не щекочет эго, не приносит денег, то, что огромный труд и вообще мне не по силам.\nПри этом в жизни не-творческой в данный период моей жизни я чувствую себя на миллион долларов. На 1000%. У меня есть некие жизненные принципы, которые, как оказалось, очень противоречат принятым стандартам в неких сферах  - например, в бизнесе. Вот я не знаю, рождаются ли люди мошенниками, ворами, подлецами и высокомерными стяжателями - или их где-то этому учат? Возможно, есть такой институт, или «лидерские курсы» где говорят, что чтобы быть успешным и эффективным, тебе надо идти по головам, красть идеи, заниматься чернухой. Короче, так работает очень много людей - и это печаль.\nС другой стороны, мне с моей\n#sekta\nгораздо проще. Когда люди понимают, как все работает внутри, они остаются с нами навсегда… Это не о том, что они ходят к нам круглый год - нет, они остаются с нами внутренне, что гораздо важнее. Мы не участвуем в конкурентной гонке, мы не «продаем». Я забочусь о своих сотрудниках, о цели и об общей идее. Сотрудники заботятся от других сотрудниках и об учениках. Тема эксплуатации, обмана, неуважения к людям настолько чужда всей нашей структуре.. Думаю именно это оставляет в нашей команде самых альтруистичных и влюбленных в человечество людей: кому-то действительно важно знать, что он работает на светлой стороне.\nДа, может быть «Ночной Дозор» далек от лакшери, но это то, что реально наполняет и дает силы жить и работать. К чему это я - каждый день где-то человек создает свою секту, думая что люди - это глупое стадо, которое мечтает об одном: похудеть любой ценой. Что люди настолько глупы, что они покупаются на украденные «до и после» или проплаченные посты в акканутах знаменитостей. Я считаю, что нет лучшей рекламы, чем ее отсутствие. Если ты хочешь быть востребованным - постарайся заниматься тем, что ты любишь, только в этом ты станешь действительно хорош. Я не лукавила, когда говорила что если не будет денег - мы будем работать и бесплатно. Не все 300 человек, но многие. И работать - это не значит «помогать людям разобраться с питанием», это значит быть полезными руками, головой - чем угодно. Я никогда не забываю историю о том, что «Завтра была война».\nТы никогда не знаешь, что будет завтра. Для меня твердо стоять на ногах - это явно не про финансовую стабильность и устойчивость экономики страны. Для меня это прежде всего про твердость нематериальных ценностей. И вот вопрос, ответ на который меня интересует: неужели и правда все эти люди, которые жаждут наживы, не испытывают такой искренней потребности быть чище, ближе к Богу, каким бы именем они его не называли? Мне почти 30 лет, а я все еще не верю, что есть люди, которые глубоко внутри не тянутся к свету.. Мне кажется, мы все рождены, чтобы взаимодействовать и лечить раны друг друга.. А не ранить. Наполнять, а не высасывать все соки. Хочу однажды проснуться в таком мире.. Пусть даже и через тысячу лет.\nТеперь снова о творчестве. Человеку нужен человек. Каждый, имеющий голос, несет огромную ответственность за то, что говорит. Мне говорят: «научись не воспринимать критику». Такой бесполезный совет я давала сама себе много раз. Оказывается, действительно «воспринимается» критика только от тех, кто имеет авторитет - критика остальных ранит. Она ранит, как когда люди не видят твоих истинных намерений. Когда родители несправедливо наказывают тебя. «Критика ранит твое Эго» - да, но Эго - это тоже часть меня, которая может быть конструктивной и деструктивной. Мое конструктивное эго пишет песни, деструктивное эго говорит: «не покажем их этим злым людям». Мой внутренний наблюдатель всегда за то, чтобы молчать. А внешние авторитеты регулируют процесс, то есть люди все равно являются двигателями деятельности. Но это - эффект толпы.. коллективное бессознательное.. То есть у меня есть ощущение, что в целом и это является вполне гармоничным процессом.\nЯ написала альбом за несколько лет - и он наполнен сутью до краев. Он - не бесконечная песня об одном переживании, это жизнь - моя жизнь и мое видение мира. То, что я успела собрать в долгом путешествии… Если бы я писала альбом два месяца - возможно, он бы получился текстово-музыкальным, демонстрацией моего умения писать предложения и подбирать трогающие меня темы - но это была бы не я. Я могла бы быть техничнее, злободневнее и т.д. - но тогда я бы заигрывала с людьми и старалась бы удовлетворить их запрос. Балансируя между любовью и ненавистью к абстрактному слушателю, я отстаиваю перед собой право оставаться собой и желание развиваться. Когда кто-то со стороны говорит тебе: иди и делай то-то, ты сначала тратишь кучу времени и сил чтобы доказать себе, что ты и без этих отличных советов справляешься. Бунт нужен для того, чтобы нащупать собственный путь, чтобы не быть ведомым и не чувствовать себя ведомым. После бунта ты можешь все-таки принять, что тебе необходимо развиваться.. Но я часто думаю: если бы люди действовали конструктивнее, мир развивался бы быстрее. Например: 10 лет мне говорили, что я ужасно пою. Я переживала по этому поводу, но у меня не было возможности заниматься вокалом регулярно и с хорошим педагогом. И вот два года назад моя подруга, божественного таланта певица, просто дала мне своего преподавателя и… И я научилась петь. Чуть-чуть. Я просто больше не срываю голос и умею четко произносить все слова, которые пою. Для меня это больше не мука, а вполне себе удовольствие… И в этом альбоме я наконец-то спела все так, как хотелось и слышалось внутри. Мораль здесь в том, что если ты не можешь помочь человеку делом - твои советы делают больно. Но скорее всего и это является частью великого замысла, поэтому ты мог все это и не читать. It is as it is.\nДругие говорят, что надо творить, как конвеер или завод - это, типа, мастерство. Художник должен жить каждый день производя свой контент, чтобы радовать почитателей и набивать руку. Я не считаю свое творчество плодом «мастерства» - оно не является целью моей жизни, скорее это - саундтрек и зарисовки сути. Ценность истории, которая произошла - а не искусного замысла. Дело не в том, что такой тип искусства я считаю правильным - нет, скорее это тот стиль, который выбрал меня, как в свое время на первом курсе журфака гонзо-журналистика выбрала меня, и я была верна ей до самого диплома. Когда кто-то торопит меня или старается переделать - я нервничаю. От того, что я нервничаю, скорее всего не случится никакого прорыва в творческом процессе - возможно я напишу песню о том, как мудаки одолевали меня своими бесценными советами, а я слушала только свое сердце и тишину, но кажется, у меня уже была такая песня. В моей жизни много замечательных событий и людей, приятных и не очень - но «замечательные» - это качество, которое не о позитивности, а о силе тех или иных явлений. Я помню самых верных фэнов, самых язвительных и умных хэйтеров, самых ярких маньяков. Они действительно меняют реальность. Все остальное - трясина, которая не дает вдохновения и сил. «Вдохновляй меня, ведь ты считаешь себя правым. Но не бывает правды. Нет ничего, в чем можно быть уверенным на все 100. Просто вдохновляй меня». Эти строки всегда пульсируют в запястье. Не каждый из вас меняет мою реальность. Но вселенная работает вашими руками.\n\"Меня так много, мне тесно в любой комнате\". Как журналист, я могу чувствовать любое медиа-пространство и адаптировать под него контент. Но я не могу вписаться целиком ни в одно из них. Мне чертовски тесно в инстаграмме, но зато он помогает мне встречать \"моих\" людей в реальности. В инста мне не хватает места, чтобы описать реальность в полутонах, и поэтому мне самой бывает противно от своего образа там. Но нюансы никому не нужны. Всем нужна суть. Но суть без нюансов лжива..  Аудитория ВК не располагает к разговору. В Фэйсбуке меня никто не читает кроме друзей, и это хорошо. В твиттере я могу пошутить и поговорить про рэпчик. Перископ это вообще площадка для онлайн-лекций, но мои знания и компетенции - это не я. Мое окружение, страны, в которых я бываю, мой бизнес - это не я. Мне чертовски тесно в одном человеке, и я не знаю, сталкиваются ли с этим другие люди. Я вижу мир, как мама, как женщина, как атлет, как бизнесмен, влюбленный в свое дело, как работодатель и ответственный гражданин, как творческий человек, как любитель рэпчика, в конце концов.. Как журналист, который хочет описывать мир из каждой из этих точек самоосознания. Как человек, который всегда видит свое несовершенство во всех этих проявлениях и жаждет уже не совершенства, а осознанности.. Осознанности, как четкого ощущения своих рук и ног и всех проявлений своей личности - а не как абстрактного понятия о том, чтобы казаться лучше, чем ты есть на самом деле.\nБесконечный процесс и поиск. Бесконечный (а на самом-то деле вполне конечный в перспективе) колодец, в котором только первую четверть как-то размышляешь об одиночестве и неуютности происходящего. Потом как-то привыкаешь, постигаешь физические законы, перестаешь бороться с непобедимым, наконец-то начинаешь вглядываться в происходящее, картинка каждую секунду меняется, меняешься и ты - и эта бесконечная новизна обстоятельств затягивает.  И знаете, особенное удовольствие в круговороте вдруг обнаружить в этом свободном падении ночь, тихий дом, тропический ливень за окнами, стол, ноутбук, ромашковый чай, невидимого, но такого приятного абстрактного собеседника, с которым хочется поделится мыслями - просто рассказать о том, каким я вижу мир сегодня.. Алиса падает вниз, а рядом падает банка малинового варенья. А как у вас?\nза фото спасибо\nmika_sueno",
    "final_title": "записки графоманские\n\nМне чудовищно тесно в одном человеке",
    "final_annotation": "Пару дней назад вышел наш новый клип «Тлен» - как ни странно, благодаря паре эпиграфов большинство зрителей поняли смысл. При этом в жизни не-творческой в данный период моей жизни я чувствую себя на миллион долларов. У меня есть некие жизненные принципы, которые, как оказалось, очень противоречат принятым стандартам в неких сферах  - например, в бизнесе.",

                    <div class="post-meta">
                        <span class="post-source">${escapeHtml(post.source)}</span>
                        <span class="post-date">${escapeHtml(post.display_date)}</span>
                    </div>
                    <div class="post-title">${escapeHtml(post.final_title)}</div>
                    <div class="post-annotation">${escapeHtml(post.final_annotation)}</div>
                </div>
            `).join('');
        }

        function openPost(index) {
            const posts = currentSection === 1 ? section1Posts : section2Posts;
            const post = posts[index];
            const modal = document.getElementById('modal');
            const header = document.getElementById('modalHeader');
            const body = document.getElementById('modalBody');
            header.innerHTML = `
                <div class="modal-meta">
                    <span class="modal-source">${escapeHtml(post.source)}</span>
                    <span class="modal-date">${escapeHtml(post.display_date)}</span>
                </div>
                <div class="modal-title">${escapeHtml(post.final_title)}</div>
            `;
            body.innerHTML = `
                <div class="modal-annotation">${escapeHtml(post.final_annotation)}</div>
                <div class="modal-text">${escapeHtml(post.full_content)}</div>
            `;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function handleModalClick(event) {
            if (event.target.id === 'modal') closeModal();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function getPluralForm(number, one, two, five) {
            let n = Math.abs(number);
            n %= 100;
            if (n >= 5 && n <= 20) return five;
            n %= 10;
            if (n === 1) return one;
            if (n >= 2 && n <= 4) return two;
            return five;
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts();
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        });
    </script>
</body>
</html>
