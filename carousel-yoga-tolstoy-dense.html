<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Йога-практика в стиле позднего Толстого · dense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --cream:        #ede4d0;
  --cream-soft:   #f3ecdb;
  --cream-dim:    #e2d8c0;
  --ink:          #1c1612;
  --ink-soft:     #3a2d22;
  --ink-mute:     #6b5a48;
  --burgundy:     #9b2c2c;
  --burgundy-dk:  #7a2020;
  --burgundy-tint:#e9c8b8;
  --swatch-red-bg:    #e8b9a8;
  --swatch-red-dk:    #a83f2a;
  --swatch-green-bg:  #c5d3b3;
  --swatch-green-dk:  #4f6a3a;
  --font-display: 'Spectral', 'Lora', Georgia, serif;
  --font-body:    'Lora', 'Spectral', Georgia, serif;
  --font-ui:      'Inter', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background:#1a1a1a; font-family: var(--font-ui); color:#bbb; overflow: hidden; }

/* ─── TOP TOOLBAR ─── */
.toolbar {
  background:#0e0e0e; border-bottom:1px solid rgba(255,255,255,0.06);
  padding:12px 22px; display:flex; gap:16px; align-items:center; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}
.tb-group { display:flex; gap:6px; align-items:center; }
.tb-label {
  font-size:9px; font-weight:600; letter-spacing:2.5px;
  text-transform:uppercase; opacity:0.4; margin-right:4px;
}
.tb-btn {
  font-family: var(--font-ui);
  font-size:10px; font-weight:500; padding:6px 12px;
  border:1px solid rgba(255,255,255,0.12); border-radius:100px;
  background:transparent; color:rgba(255,255,255,0.45); cursor:pointer;
  transition: all 0.15s; white-space:nowrap;
}
.tb-btn.active, .tb-btn:hover {
  background: rgba(255,255,255,0.08); color:#fff; border-color:rgba(255,255,255,0.3);
}
.tb-btn.danger {
  border-color: rgba(220,80,80,0.3); color: rgba(220,140,140,0.7);
}
.tb-btn.danger:hover { background: rgba(220,80,80,0.12); color: #ffb0b0; }
.tb-btn.export {
  border-color: rgba(155,44,44,0.45); background: rgba(155,44,44,0.12); color:#d8736a;
}
.tb-btn.export:hover { background: rgba(155,44,44,0.22); color:#fff; }
.tb-divider { width:1px; height:18px; background:rgba(255,255,255,0.08); margin:0 4px; }

/* ─── LAYOUT: preview + side panel ─── */
.workspace {
  display: grid;
  grid-template-columns: 1fr 380px;
  height: calc(100vh - 50px);
}
.preview-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 24px 20px;
  overflow-y: auto;
  background: linear-gradient(180deg, #1a1a1a 0%, #151515 100%);
}
.editor-panel {
  background:#0d0d0d; border-left:1px solid rgba(255,255,255,0.06);
  overflow-y: auto;
  padding: 20px 18px 32px;
  color:#aaa;
}

/* ─── CARD ─── */
.card-frame {
  display:flex; justify-content:center; overflow:hidden;
  margin-bottom: 16px;
}
.card {
  width:1080px; height:1350px; position:relative; overflow:hidden;
  background: var(--cream); color: var(--ink);
  font-family: var(--font-body);
  padding:88px 78px 112px;
  display:flex; flex-direction:column;
  flex-shrink:0; transform-origin: top center;
}

.card .wm {
  position:absolute; bottom:44px; left:78px;
  font-family: var(--font-mono);
  font-size:18px; letter-spacing:0.5px;
  color: var(--ink-mute); opacity:0.7;
}
.card .pager { position:absolute; bottom:50px; right:78px; display:flex; gap:8px; align-items:center; }
.card .pager .pd {
  width:7px; height:7px; border-radius:50%;
  background: var(--ink); opacity:0.18;
}
.card .pager .pd.cur { opacity:0.85; }

/* ─── LAYOUTS ─── */
.layout-cover { justify-content:center; }
.layout-body  { justify-content:flex-start; padding-top:108px; }
.layout-quote { justify-content:center; }
.layout-cta   { justify-content:flex-start; padding-top:108px; }

/* vertical alignment overrides */
.card.v-top    { justify-content:flex-start; padding-top:108px; }
.card.v-center { justify-content:center; padding-top:88px; }
.card.v-bottom { justify-content:flex-end; padding-bottom:160px; }

/* horizontal alignment */
.card.a-left   { align-items:flex-start; text-align:left; }
.card.a-center { align-items:center; text-align:center; }
.card.a-center .b-h2,
.card.a-center .b-p,
.card.a-center .b-lead,
.card.a-center .b-callout,
.card.a-center .b-cta-q,
.card.a-center .b-cta-sub,
.card.a-center .b-cover-h1,
.card.a-center .b-cover-sub,
.card.a-center .b-quote-text { margin-left:auto; margin-right:auto; }
.card.a-center .b-callout { border-left:none; border-top:3px solid var(--burgundy); padding:18px 0 0 0; }
.card.a-center .b-bullet { justify-content:center; }
.card.a-center .b-rule { margin-left:auto; margin-right:auto; }

/* font pair: applied to .card */
.card.font-spectral { --font-display: 'Spectral', 'Lora', Georgia, serif; --font-body: 'Lora', 'Spectral', Georgia, serif; }
.card.font-cormorant { --font-display: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; --font-body: 'EB Garamond', 'Cormorant Garamond', Georgia, serif; }
.card.font-playfair { --font-display: 'Playfair Display', 'Source Serif 4', Georgia, serif; --font-body: 'Source Serif 4', 'Playfair Display', Georgia, serif; }
/* Cormorant и Playfair требуют чуть меньшего letter-spacing для display */
.card.font-cormorant .b-cover-h1 { letter-spacing:-2px; font-weight:700; }
.card.font-playfair .b-cover-h1  { letter-spacing:-1px; font-weight:800; }

/* ─── BLOCKS ─── */
.b-top-stripe {
  width: calc(38px * var(--scale, 1));
  height: calc(4px * var(--scale, 1));
  background: var(--burgundy);
  margin-bottom: calc(18px * var(--scale, 1));
}
.b-tag {
  font-family: var(--font-ui);
  font-size: calc(12px * var(--scale, 1));
  font-weight:600; letter-spacing:3.5px; text-transform:uppercase;
  color: var(--ink-mute);
  margin-bottom: calc(36px * var(--scale, 1));
}
.b-tag[data-size="S"]  { font-size: calc(10px * var(--scale, 1)); }
.b-tag[data-size="L"]  { font-size: calc(14px * var(--scale, 1)); }
.b-tag[data-size="XL"] { font-size: calc(16px * var(--scale, 1)); }

.b-cover-h1 {
  font-family: var(--font-display);
  font-weight:800; font-size: calc(104px * var(--scale, 1));
  line-height:1.0; letter-spacing:-1.5px;
  color: var(--burgundy);
  margin-bottom: calc(36px * var(--scale, 1));
  max-width:900px;
}
.b-cover-h1[data-size="S"]  { font-size: calc(84px * var(--scale, 1)); }
.b-cover-h1[data-size="L"]  { font-size: calc(124px * var(--scale, 1)); }
.b-cover-h1[data-size="XL"] { font-size: calc(140px * var(--scale, 1)); }

.b-rule {
  width:220px; height:2px; background: var(--burgundy);
  margin-bottom: calc(28px * var(--scale, 1));
}

.b-cover-sub {
  font-family: var(--font-body);
  font-size: calc(28px * var(--scale, 1));
  line-height:1.45;
  color: var(--ink-soft); font-weight:400; max-width:780px;
  margin-bottom: calc(20px * var(--scale, 1));
}
.b-cover-sub[data-size="S"]  { font-size: calc(24px * var(--scale, 1)); }
.b-cover-sub[data-size="L"]  { font-size: calc(32px * var(--scale, 1)); }
.b-cover-sub[data-size="XL"] { font-size: calc(36px * var(--scale, 1)); }

.b-h2 {
  font-family: var(--font-display);
  font-weight:700; font-size: calc(54px * var(--scale, 1));
  line-height:1.12; letter-spacing:-0.5px;
  color: var(--ink);
  margin-bottom: calc(30px * var(--scale, 1));
  max-width:900px;
}
.b-h2[data-size="S"]  { font-size: calc(42px * var(--scale, 1)); }
.b-h2[data-size="L"]  { font-size: calc(64px * var(--scale, 1)); }
.b-h2[data-size="XL"] { font-size: calc(74px * var(--scale, 1)); }

.b-p {
  font-family: var(--font-body);
  font-size: calc(26px * var(--scale, 1));
  line-height:1.55;
  color: var(--ink-soft); font-weight:400; max-width:900px;
  margin-bottom: calc(20px * var(--scale, 1));
}
.b-p[data-size="S"]  { font-size: calc(22px * var(--scale, 1)); }
.b-p[data-size="L"]  { font-size: calc(30px * var(--scale, 1)); }
.b-p[data-size="XL"] { font-size: calc(34px * var(--scale, 1)); }

.b-lead {
  font-family: var(--font-body);
  font-size: calc(30px * var(--scale, 1));
  line-height:1.5; color: var(--ink); font-weight:500;
  max-width:900px; margin-bottom: calc(20px * var(--scale, 1));
}
.b-lead[data-size="S"]  { font-size: calc(26px * var(--scale, 1)); }
.b-lead[data-size="L"]  { font-size: calc(34px * var(--scale, 1)); }
.b-lead[data-size="XL"] { font-size: calc(38px * var(--scale, 1)); }

.b-bullet {
  display:flex; gap: calc(18px * var(--scale, 1)); align-items:baseline;
  font-family: var(--font-body);
  font-size: calc(26px * var(--scale, 1));
  line-height:1.5;
  color: var(--ink-soft); margin-bottom: calc(14px * var(--scale, 1));
  max-width:900px;
}
.b-bullet::before {
  content:'—'; color: var(--burgundy); font-weight:700; flex-shrink:0;
}
.b-bullet[data-size="S"]  { font-size: calc(22px * var(--scale, 1)); }
.b-bullet[data-size="L"]  { font-size: calc(30px * var(--scale, 1)); }
.b-bullet[data-size="XL"] { font-size: calc(34px * var(--scale, 1)); }

.b-callout {
  border-left: 3px solid var(--burgundy);
  padding: 6px 0 6px 22px;
  margin-top: calc(18px * var(--scale, 1));
  margin-bottom: calc(18px * var(--scale, 1));
  font-family: var(--font-body);
  font-size: calc(26px * var(--scale, 1));
  line-height:1.5;
  color: var(--ink); font-weight:500;
  max-width:900px;
}
.b-callout[data-size="S"]  { font-size: calc(22px * var(--scale, 1)); }
.b-callout[data-size="L"]  { font-size: calc(30px * var(--scale, 1)); }
.b-callout[data-size="XL"] { font-size: calc(34px * var(--scale, 1)); }

.b-dark-quote {
  background: var(--ink); color: var(--cream);
  padding: 26px 32px; border-radius:6px;
  font-family: var(--font-display);
  font-style:italic; font-weight:500;
  font-size: calc(26px * var(--scale, 1));
  line-height:1.45;
  margin-top: calc(18px * var(--scale, 1));
  margin-bottom: calc(18px * var(--scale, 1));
}
.b-dark-quote[data-size="S"]  { font-size: calc(22px * var(--scale, 1)); }
.b-dark-quote[data-size="L"]  { font-size: calc(30px * var(--scale, 1)); }
.b-dark-quote[data-size="XL"] { font-size: calc(34px * var(--scale, 1)); }
.b-dark-quote .src {
  font-style:normal; font-family: var(--font-ui);
  font-size:13px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase;
  color: var(--burgundy-tint);
  display:block; margin-top:14px; opacity:0.85;
}

.b-eng-stack { margin: 8px 0 24px; }
.b-eng-stack .eng {
  font-family: var(--font-display);
  font-style:italic; font-weight:500;
  font-size: calc(46px * var(--scale, 1));
  line-height:1.25;
  color: var(--ink); margin-bottom: calc(12px * var(--scale, 1));
}
.b-eng-stack[data-size="S"] .eng  { font-size: calc(38px * var(--scale, 1)); }
.b-eng-stack[data-size="L"] .eng  { font-size: calc(54px * var(--scale, 1)); }
.b-eng-stack[data-size="XL"] .eng { font-size: calc(62px * var(--scale, 1)); }

.b-cmp-row {
  display:grid; grid-template-columns:1fr 1fr; gap:20px;
  margin: calc(14px * var(--scale, 1)) 0 calc(20px * var(--scale, 1));
}
.b-cmp-box {
  border-radius:8px; padding:24px 26px;
  font-family: var(--font-body);
}
.b-cmp-box.red   { background: var(--swatch-red-bg);   color:#4a1a10; }
.b-cmp-box.green { background: var(--swatch-green-bg); color:#2c3a20; }
.b-cmp-box .cmp-head {
  font-family: var(--font-ui);
  font-size: calc(13px * var(--scale, 1));
  font-weight:700; letter-spacing:3.5px; text-transform:uppercase;
  display:flex; align-items:center; gap:10px;
  margin-bottom:18px; padding-bottom:14px;
  border-bottom:1px solid currentColor; opacity:0.85;
}
.b-cmp-box .cmp-head .dot { width:11px; height:11px; border-radius:3px; }
.b-cmp-box.red .cmp-head .dot   { background: var(--swatch-red-dk); }
.b-cmp-box.green .cmp-head .dot { background: var(--swatch-green-dk); }
.b-cmp-box .pair {
  font-size: calc(19px * var(--scale, 1));
  line-height:1.4;
  margin-bottom:10px;
  font-family: var(--font-body);
}
.b-cmp-box .pair:last-child { margin-bottom:0; }
.b-cmp-box.red .pair  { font-style:italic; opacity:0.85; }
.b-cmp-box.green .pair { font-weight:500; }

.b-qmark {
  font-family: var(--font-display);
  font-weight:700; font-size: calc(180px * var(--scale, 1));
  line-height:0.5;
  color: var(--burgundy); opacity:0.55;
  margin-bottom: calc(30px * var(--scale, 1));
}

.b-quote-text {
  font-family: var(--font-display);
  font-weight:500; font-size: calc(46px * var(--scale, 1));
  line-height:1.32;
  color: var(--ink); margin-bottom: calc(38px * var(--scale, 1));
  max-width:900px;
}
.b-quote-text[data-size="S"]  { font-size: calc(38px * var(--scale, 1)); }
.b-quote-text[data-size="L"]  { font-size: calc(54px * var(--scale, 1)); }
.b-quote-text[data-size="XL"] { font-size: calc(62px * var(--scale, 1)); }

.b-qsrc {
  font-family: var(--font-ui);
  font-size: calc(14px * var(--scale, 1));
  font-weight:600; letter-spacing:3px; text-transform:uppercase;
  color: var(--ink-mute);
}

.b-cta-q {
  font-family: var(--font-display);
  font-weight:700; font-size: calc(48px * var(--scale, 1));
  line-height:1.2;
  color: var(--ink);
  margin-bottom: calc(24px * var(--scale, 1));
  max-width:900px;
}
.b-cta-q[data-size="S"]  { font-size: calc(40px * var(--scale, 1)); }
.b-cta-q[data-size="L"]  { font-size: calc(56px * var(--scale, 1)); }
.b-cta-q[data-size="XL"] { font-size: calc(64px * var(--scale, 1)); }

.b-cta-sub {
  font-family: var(--font-body);
  font-size: calc(25px * var(--scale, 1));
  line-height:1.5;
  color: var(--ink-soft);
  max-width:900px; margin-bottom: calc(32px * var(--scale, 1));
}

.b-tg-pre {
  font-family: var(--font-body);
  font-size: calc(23px * var(--scale, 1));
  color: var(--ink-mute);
  margin-bottom: calc(14px * var(--scale, 1));
}

.b-cta-handle {
  font-family: var(--font-display);
  font-weight:800; font-size: calc(88px * var(--scale, 1));
  letter-spacing:-1.5px;
  color: var(--burgundy); line-height:1;
  margin-bottom: calc(22px * var(--scale, 1));
}
.b-cta-handle[data-size="S"]  { font-size: calc(72px * var(--scale, 1)); }
.b-cta-handle[data-size="L"]  { font-size: calc(104px * var(--scale, 1)); }
.b-cta-handle[data-size="XL"] { font-size: calc(120px * var(--scale, 1)); }

.b-cta-tail {
  font-family: var(--font-body);
  font-size: calc(23px * var(--scale, 1));
  line-height:1.5; color: var(--ink-soft); max-width:780px;
}

/* ─── INLINE СЕМАНТИЧЕСКИЕ ВЫДЕЛЕНИЯ ─── */
/* Применяются внутри html-блоков. Привязаны к смыслу, не к виду. */
.card .accent { color: var(--burgundy); font-weight: 700; }                                    /* ключевое слово */
.card .hl     { background: rgba(155,44,44,0.18); padding: 0 0.2em; border-radius: 2px; }      /* маркер */
.card .under  { background-image: linear-gradient(transparent 80%, rgba(155,44,44,0.4) 80%); padding-bottom:2px; }  /* подчёркивание */
.card .strike { text-decoration: line-through; text-decoration-color: var(--burgundy); text-decoration-thickness: 2px; opacity: 0.7; }
.card .dim    { color: var(--ink-mute); }                                                       /* приглушённое */
.card .small  { font-size: 0.78em; }                                                            /* меньше окружения */
.card .caps   { text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.85em; font-weight: 600; }
.card .num    { font-family: var(--font-mono); font-weight: 500; font-feature-settings: "tnum"; } /* табличные цифры */

/* ─── TABLE BLOCK (произвольная таблица) ─── */
.b-table {
  margin: calc(14px * var(--scale, 1)) 0 calc(20px * var(--scale, 1));
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-body);
}
.b-table[data-size="S"]  { font-size: calc(18px * var(--scale, 1)); }
.b-table                 { font-size: calc(22px * var(--scale, 1)); }
.b-table[data-size="L"]  { font-size: calc(26px * var(--scale, 1)); }
.b-table[data-size="XL"] { font-size: calc(30px * var(--scale, 1)); }
.b-table .trow {
  display: grid;
  border-bottom: 1px solid rgba(28,22,18,0.18);
  padding: 14px 0;
}
.b-table .trow:last-child { border-bottom: none; }
.b-table .trow.thead {
  font-family: var(--font-ui);
  font-size: 0.55em; font-weight: 700;
  letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--ink-mute);
  padding: 10px 0;
  border-bottom: 1px solid var(--ink);
}
.b-table .tcell {
  padding: 0 18px 0 0;
  line-height: 1.4;
  color: var(--ink-soft);
}
.b-table .tcell:last-child { padding-right: 0; }
.b-table .tcell:first-child { font-weight: 500; color: var(--ink); }

/* ─── EDITABLE STATE ─── */
[contenteditable="true"] { outline: none; cursor: text; }
[contenteditable="true"]:focus {
  background: rgba(155,44,44,0.05);
  box-shadow: 0 0 0 1px rgba(155,44,44,0.25);
  border-radius: 4px;
}
[contenteditable="true"]:hover:not(:focus) {
  background: rgba(155,44,44,0.025);
  border-radius: 4px;
}

/* ─── FLOATING INLINE-FORMAT TOOLBAR ─── */
.fmt-toolbar {
  position: fixed; z-index: 100;
  display: none;
  background: #0d0d0d; color: #fff;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  padding: 4px;
  gap: 2px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  font-family: var(--font-ui);
}
.fmt-toolbar.show { display: flex; }
.fmt-toolbar button {
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.65);
  font-family: var(--font-ui);
  font-size: 11px; font-weight: 600;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.12s;
  min-width: 24px;
}
.fmt-toolbar button:hover {
  background: rgba(155,44,44,0.25); color: #fff;
}
.fmt-toolbar button.clear { color: rgba(255,255,255,0.4); font-weight: 400; }
.fmt-toolbar .sep { width:1px; background: rgba(255,255,255,0.1); margin: 2px 2px; }

/* ─── EDITOR PANEL ─── */
.ep-section { margin-bottom: 22px; }
.ep-h {
  font-size:10px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
  color: rgba(255,255,255,0.5); margin-bottom:10px;
}
.ep-current-slide {

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.slides || !Array.isArray(s.slides)) return null;
    return s;
  } catch(e) { return null; }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function resetState() {
  if (!confirm('Сбросить все правки и вернуть исходные слайды?')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

/* ════════════════════════════════════════════════════════
   RENDER — слайд из JSON
   ════════════════════════════════════════════════════════ */
function renderBlock(block, slideIdx, blockIdx) {
  const t = block.type;
  const size = block.size || 'M';
  const sizeAttr = size !== 'M' ? ` data-size="${size}"` : '';
  const cePath = `data-slide="${slideIdx}" data-block="${blockIdx}"`;

  switch(t) {
    case 'top-stripe': return `<div class="b-top-stripe" ${cePath}></div>`;
    case 'rule':       return `<div class="b-rule" ${cePath}></div>`;
    case 'qmark':      return `<div class="b-qmark" ${cePath}>«</div>`;

    case 'tag':
    case 'cover-h1':
    case 'cover-sub':
    case 'h2':
    case 'p':
    case 'lead':
    case 'callout':
    case 'eng-stack':  // see below
    case 'quote-text':
    case 'qsrc':
    case 'cta-q':
    case 'cta-sub':
    case 'tg-pre':
    case 'cta-handle':
    case 'cta-tail':
    case 'bullet':
      // simple text/html block
      if (t === 'eng-stack') {
        const items = Array.isArray(block.items) ? block.items : (block.html || block.text || '').split('\n');
        return `<div class="b-eng-stack"${sizeAttr} ${cePath}>${
          items.map((s,i) => `<div class="eng" contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-engidx="${i}">${s}</div>`).join('')
        }</div>`;
      }
      const inner = block.html || escapeHtml(block.text || '');
      return `<div class="b-${t}"${sizeAttr} contenteditable="true" ${cePath}>${inner}</div>`;

    case 'dark-quote':
      const dqInner = block.html || escapeHtml(block.text || '');
      const dqSrc = escapeHtml(block.src || '');
      return `<div class="b-dark-quote"${sizeAttr} ${cePath}>
        <span contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-field="text">${dqInner}</span>
        <span class="src" contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-field="src">${dqSrc}</span>
      </div>`;

    case 'cmp-row':
      const r = block.red || { head:'было', pairs:[] };
      const g = block.green || { head:'стало', pairs:[] };
      const renderPairs = (arr, ce) => arr.map((p, i) =>
        `<div class="pair" contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-cmp="${ce}" data-pidx="${i}">${escapeHtml(p)}</div>`
      ).join('');
      return `<div class="b-cmp-row"${sizeAttr} ${cePath}>
        <div class="b-cmp-box red">
          <div class="cmp-head"><span class="dot"></span><span contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-cmp="red" data-field="head">${escapeHtml(r.head)}</span></div>
          ${renderPairs(r.pairs || [], 'red')}
        </div>
        <div class="b-cmp-box green">
          <div class="cmp-head"><span class="dot"></span><span contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-cmp="green" data-field="head">${escapeHtml(g.head)}</span></div>
          ${renderPairs(g.pairs || [], 'green')}
        </div>
      </div>`;

    case 'table': {
      const headers = Array.isArray(block.headers) ? block.headers : ['col 1','col 2'];
      const rows = Array.isArray(block.rows) ? block.rows : [];
      const cols = headers.length;
      const gridStyle = `grid-template-columns: repeat(${cols}, 1fr);`;
      const headHtml = headers.map((h, ci) =>
        `<div class="tcell" contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-tbl="head" data-cidx="${ci}">${escapeHtml(h)}</div>`
      ).join('');
      const rowsHtml = rows.map((row, ri) => {
        const cells = (row || []).map((c, ci) =>
          `<div class="tcell" contenteditable="true" data-slide="${slideIdx}" data-block="${blockIdx}" data-tbl="cell" data-ridx="${ri}" data-cidx="${ci}">${block.cellHtml ? c : escapeHtml(c)}</div>`
        ).join('');
        return `<div class="trow" style="${gridStyle}">${cells}</div>`;
      }).join('');
      return `<div class="b-table"${sizeAttr} ${cePath}>
        <div class="trow thead" style="${gridStyle}">${headHtml}</div>
        ${rowsHtml}
      </div>`;
    }

    default:
      return `<div style="color:red">Unknown block: ${t}</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
}

function activeBlocks(slide) {
  const av = slide.activeVariant || 0;
  if (av === 0 || !Array.isArray(slide.variants) || !slide.variants[av-1]) return slide.blocks;
  return slide.variants[av-1].blocks;
}

function renderSlide() {
  const slide = state.slides[state.currentSlide];
  const card = document.getElementById('card');
  const sc = document.getElementById('slideContent');
  const layout = slide.layout || 'body';
  const valign = slide.valign ? ' v-' + slide.valign : '';
  const halign = slide.halign ? ' a-' + slide.halign : ' a-left';
  const fontCls = ' font-' + (state.font || 'spectral');
  card.className = 'card layout-' + layout + valign + halign + fontCls;
  card.style.setProperty('--scale', slide.sizeScale || 1);
  const blocks = activeBlocks(slide);
  sc.innerHTML = blocks.map((b, i) => renderBlock(b, state.currentSlide, i)).join('');
  attachEditableListeners();

  document.getElementById('dots').innerHTML = state.slides.map((_, i) =>
    `<div class="dot${i === state.currentSlide ? ' active' : ''}" onclick="goTo(${i})"></div>`
  ).join('');
  document.getElementById('pager').innerHTML = state.slides.map((_, i) =>
    `<div class="pd${i === state.currentSlide ? ' cur' : ''}"></div>`
  ).join('');
  document.getElementById('slideCounter').textContent = `${state.currentSlide + 1} / ${state.slides.length}`;
}

function attachEditableListeners() {
  document.querySelectorAll('[contenteditable="true"]').forEach(el => {
    el.addEventListener('blur', onEditableBlur);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && el.dataset.field !== 'src' && el.dataset.cmp !== 'red' && el.dataset.cmp !== 'green') {
        // allow shift+enter for line breaks; plain enter blurs
        if (el.classList && (el.classList.contains('eng') || el.classList.contains('pair'))) {
          // for stacks/pairs let enter create new item — handled below
          return;
        }
      }
    });
  });
}

function onEditableBlur(e) {
  const el = e.currentTarget;
  const slideIdx = +el.dataset.slide;
  const blockIdx = +el.dataset.block;
  const block = activeBlocks(state.slides[slideIdx])[blockIdx];
  if (!block) return;
  const html = el.innerHTML.trim();

  if (el.dataset.field === 'src') {
    block.src = el.textContent.trim();
  } else if (el.dataset.field === 'text') {
    block.html = html;
    delete block.text;
  } else if (el.dataset.cmp === 'red' || el.dataset.cmp === 'green') {
    if (el.dataset.field === 'head') {
      if (!block[el.dataset.cmp]) block[el.dataset.cmp] = { head: '', pairs: [] };
      block[el.dataset.cmp].head = el.textContent.trim();
    } else if (el.dataset.pidx !== undefined) {
      if (!block[el.dataset.cmp]) block[el.dataset.cmp] = { head: '', pairs: [] };
      block[el.dataset.cmp].pairs[+el.dataset.pidx] = el.textContent.trim();
    }
  } else if (el.dataset.engidx !== undefined) {
    if (!Array.isArray(block.items)) {
      block.items = (block.html || block.text || '').split('\n');
      delete block.html; delete block.text;
    }
    block.items[+el.dataset.engidx] = el.textContent.trim();
  } else if (el.dataset.tbl === 'head') {
    if (!Array.isArray(block.headers)) block.headers = [];
    block.headers[+el.dataset.cidx] = el.textContent.trim();
  } else if (el.dataset.tbl === 'cell') {
    if (!Array.isArray(block.rows)) block.rows = [];
    const ri = +el.dataset.ridx, ci = +el.dataset.cidx;
    if (!block.rows[ri]) block.rows[ri] = [];
    // сохраняем html, чтобы inline-выделения работали в ячейках
    block.rows[ri][ci] = html;
    block.cellHtml = true;
  } else {
    block.html = html;
    delete block.text;
  }
  saveState();
  renderEditor();
}

/* ════════════════════════════════════════════════════════
   EDITOR PANEL
   ════════════════════════════════════════════════════════ */
function renderEditor() {
  const slide = state.slides[state.currentSlide];
  const ep = document.getElementById('editorPanel');

  const layoutChips = ['cover','body','quote','cta'].map(l =>
    `<button class="ep-chip${slide.layout === l ? ' active' : ''}" onclick="setLayout('${l}')">${l}</button>`
  ).join('');

  const sizeScaleChips = [['XS', 0.85],['S', 1],['M', 1.15],['L', 1.3]].map(([label, val]) => {
    const active = (slide.sizeScale || 1) === val;
    return `<button class="ep-chip${active ? ' active' : ''}" onclick="setSlideScale(${val})">${label}</button>`;
  }).join('');

  const halignChips = ['left','center'].map(v => {
    const active = (slide.halign || 'left') === v;
    return `<button class="ep-chip${active ? ' active' : ''}" onclick="setHalign('${v}')">${v}</button>`;
  }).join('');
  const valignChips = ['top','center','bottom'].map(v => {
    const active = (slide.valign || (slide.layout === 'cover' || slide.layout === 'quote' ? 'center' : 'top')) === v;
    return `<button class="ep-chip${active ? ' active' : ''}" onclick="setValign('${v}')">${v}</button>`;
  }).join('');

  // variants chips
  const av = slide.activeVariant || 0;
  const variantsCount = (slide.variants?.length || 0) + 1;
  const variantChips = Array.from({length: variantsCount}, (_, i) => {
    const label = String.fromCharCode(65 + i);
    return `<button class="ep-chip${av === i ? ' active' : ''}" onclick="setVariant(${i})">${label}</button>`;
  }).join('') +
    `<button class="ep-chip add" onclick="addVariant()" title="скопировать текущий как новый вариант">+</button>` +
    (av > 0 ? `<button class="ep-chip del-variant" onclick="deleteVariant()" title="удалить активный вариант">×</button>` : '');

  const currentBlocks = activeBlocks(slide);
  const blockList = currentBlocks.map((b, i) => {
    const meta = BLOCK_META[b.type] || { name: b.type };
    const previewText = (b.text || b.html || (Array.isArray(b.items) ? b.items.join(' / ') : '') || (b.red ? `${b.red.head} ↔ ${b.green?.head}` : '')).replace(/<[^>]+>/g,'').slice(0, 40);
    const sizeOptions = ['S','M','L','XL'].map(s => `<option value="${s}"${(b.size || 'M')===s?' selected':''}>${s}</option>`).join('');
    return `
      <div class="ep-block-item" data-bidx="${i}">
        <div class="name-wrap">
          <div class="name">${meta.name}</div>
          <span class="preview">${escapeHtml(previewText) || '—'}</span>
        </div>
        <select class="ic-btn size-select" onchange="setBlockSize(${i}, this.value)" title="размер">${sizeOptions}</select>
        <button class="ic-btn" onclick="moveBlock(${i}, -1)" title="вверх">↑</button>
        <button class="ic-btn" onclick="moveBlock(${i}, 1)" title="вниз">↓</button>
        <button class="ic-btn del" onclick="deleteBlock(${i})" title="удалить">×</button>
      </div>`;
  }).join('');

  const addButtons = BLOCK_ORDER_FOR_ADD
    .filter(t => {
      const meta = BLOCK_META[t];
      return !meta.layouts || meta.layouts.includes(slide.layout || 'body');
    })
    .map(t => {
      const meta = BLOCK_META[t];
      return `<button class="add-btn" onclick="addBlock('${t}')">+ ${meta.name}<span class="cap">${typeDescription(t)}</span></button>`;
    }).join('');

  ep.innerHTML = `
    <div class="ep-current-slide">
      <span class="label">Слайд ${state.currentSlide + 1}</span>
      <span class="total">из ${state.slides.length}</span>
    </div>

    <div class="ep-section">
      <div class="ep-h">варианты текста</div>
      <div class="ep-row">${variantChips}</div>
    </div>

    <div class="ep-section">
      <div class="ep-h">layout</div>
      <div class="ep-row">${layoutChips}</div>
    </div>

    <div class="ep-section">
      <div class="ep-h">размер слайда</div>
      <div class="ep-row">${sizeScaleChips}</div>
    </div>

    <div class="ep-section">
      <div class="ep-h">размещение текста</div>
      <div class="ep-row">${halignChips}</div>
      <div class="ep-row" style="margin-top:6px">${valignChips}</div>
    </div>

    <div class="ep-section">
      <div class="ep-h">блоки (${currentBlocks.length})</div>
      <div class="ep-block-list">${blockList || '<div style="opacity:0.4;font-size:11px;padding:8px 4px">пусто — добавь блок ниже</div>'}</div>
    </div>

    <div class="ep-section">
      <div class="ep-h">добавить блок</div>
      <div class="ep-add-grid">${addButtons}</div>
    </div>
  `;
}

    'table':'свободная таблица N×M',
    'qmark':'« 180px',

function setLayout(l) {
  state.slides[state.currentSlide].layout = l;
  saveState(); renderSlide(); renderEditor();
}
function setSlideScale(v) {
  state.slides[state.currentSlide].sizeScale = v;
  saveState(); renderSlide(); renderEditor();
}
function setHalign(v) {
  state.slides[state.currentSlide].halign = v;
  saveState(); renderSlide(); renderEditor();
}
function setValign(v) {
  state.slides[state.currentSlide].valign = v;
  saveState(); renderSlide(); renderEditor();
}
function setBlockSize(i, s) {
  activeBlocks(state.slides[state.currentSlide])[i].size = s;
  saveState(); renderSlide(); renderEditor();
}
function moveBlock(i, dir) {
  const blocks = activeBlocks(state.slides[state.currentSlide]);
  const j = i + dir;
  if (j < 0 || j >= blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  saveState(); renderSlide(); renderEditor();
}
function deleteBlock(i) {
  activeBlocks(state.slides[state.currentSlide]).splice(i, 1);
  saveState(); renderSlide(); renderEditor();
}
function addBlock(type) {
  const meta = BLOCK_META[type];
  const block = { type };
  if (meta.editable) {
    if (type === 'eng-stack' && Array.isArray(meta.default)) {
      block.items = [...meta.default];
    } else if (type === 'cmp-row' && typeof meta.default === 'object') {
      block.red = { ...meta.default.red, pairs: [...meta.default.red.pairs] };
      block.green = { ...meta.default.green, pairs: [...meta.default.green.pairs] };
    } else if (type === 'table' && typeof meta.default === 'object') {
      block.headers = [...meta.default.headers];
      block.rows = meta.default.rows.map(r => [...r]);
    } else if (type === 'dark-quote') {
      block.text = meta.default;
      block.src = meta.extra?.src || '';
    } else {
      block.text = meta.default;
    }
  }
  activeBlocks(state.slides[state.currentSlide]).push(block);
  saveState(); renderSlide(); renderEditor();
}

/* ─── VARIANTS ─── */
function setVariant(idx) {
  state.slides[state.currentSlide].activeVariant = idx;
  saveState(); renderSlide(); renderEditor();
}
function addVariant() {
  const slide = state.slides[state.currentSlide];
  if (!Array.isArray(slide.variants)) slide.variants = [];
  slide.variants.push({ blocks: structuredClone(activeBlocks(slide)) });
  slide.activeVariant = slide.variants.length;
  saveState(); renderSlide(); renderEditor();
}
function deleteVariant() {
  const slide = state.slides[state.currentSlide];
  const av = slide.activeVariant || 0;
  if (av === 0) return;
  if (!confirm(`Удалить вариант ${String.fromCharCode(64 + av + 1)}?`)) return;
  slide.variants.splice(av - 1, 1);
  slide.activeVariant = Math.min(av, slide.variants.length);
  if (slide.variants.length === 0) delete slide.variants;
  saveState(); renderSlide(); renderEditor();
}

/* ─── PARSER: text → slides JSON ─── */
function parseTextToSlides() {
  const ti = document.getElementById('textInput');
  const raw = ti.value;
  state.rawText = raw;
  const slides = textToSlides(raw);
  if (!slides.length) {
    alert('Не нашлось слайдов. Используй ## для нового слайда или === как разделитель.');
    return;
  }
  state.slides = slides;
  state.currentSlide = 0;
  saveState();
  setMode('visual');
  renderSlide();
  renderEditor();
}

function textToSlides(raw) {
  // Делим на блоки слайдов: разделитель — `## ` в начале строки или `===` строкой целиком,
  // или `# ` (только если это первый слайд — cover-h1).
  const lines = raw.replace(/\r\n/g, '\n').split('\n');
  const slideTexts = [];
  let cur = [];
  let firstSlideHasCover = false;

  const flush = () => {
    if (cur.length) { slideTexts.push(cur.join('\n')); cur = []; }
  };

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    const tr = ln.trim();
    if (/^={3,}\s*$/.test(tr)) { flush(); continue; }
    if (/^##\s+/.test(tr)) { flush(); cur.push(ln); continue; }
    if (/^#\s+/.test(tr) && slideTexts.length === 0 && !firstSlideHasCover) {
      // cover (первый слайд): # ... — h1
      flush(); cur.push(ln); firstSlideHasCover = true; continue;
    }
    cur.push(ln);
  }
  flush();

  return slideTexts.map((t, idx) => parseSlideBlock(t, idx === 0)).filter(s => s && s.blocks.length);
}

function parseSlideBlock(text, isFirst) {
  const lines = text.split('\n').map(l => l.trimEnd());
  const blocks = [];
  let layout = isFirst ? 'cover' : 'body';
  let coverH1Done = false;
  let buf = [];

  const flushP = () => {
    if (!buf.length) return;
    const joined = buf.join(' ').trim();
    if (joined) {
      // если содержит инлайн-разметку — конвертируем
      blocks.push({ type: 'p', html: inlineFormat(joined) });
    }
    buf = [];
  };

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const ln = raw.trim();
    if (!ln) { flushP(); continue; }

    // # cover-h1 — только в первом слайде
    if (/^#\s+/.test(ln) && isFirst && !coverH1Done) {
      flushP();
      blocks.push({ type: 'top-stripe' });
      blocks.push({ type: 'cover-h1', html: inlineFormat(ln.replace(/^#\s+/, '')) });
      blocks.push({ type: 'rule' });
      coverH1Done = true; layout = 'cover';
      continue;
    }
    // ## h2 — заголовок слайда
    if (/^##\s+/.test(ln)) {
      flushP();
      blocks.push({ type: 'h2', html: inlineFormat(ln.replace(/^##\s+/, '')) });
      continue;
    }
    // --- tag ---
    let m = ln.match(/^---\s+(.+?)\s+---$/);
    if (m) { flushP(); blocks.push({ type: 'tag', text: m[1] }); continue; }
    // -- lead
    if (/^--\s+/.test(ln)) { flushP(); blocks.push({ type: 'lead', html: inlineFormat(ln.replace(/^--\s+/, '')) }); continue; }
    // >> dark-quote
    if (/^>>\s+/.test(ln)) {
      flushP();
      let body = ln.replace(/^>>\s+/, '');
      let src = '';
      const sm = body.match(/^(.*?)\s+--\s+(.+)$/);
      if (sm) { body = sm[1]; src = sm[2]; }
      blocks.push({ type: 'dark-quote', html: inlineFormat(body), src });
      continue;
    }
    // > callout
    if (/^>\s+/.test(ln)) { flushP(); blocks.push({ type: 'callout', html: inlineFormat(ln.replace(/^>\s+/, '')) }); continue; }
    // - bullet
    if (/^[-—]\s+/.test(ln)) { flushP(); blocks.push({ type: 'bullet', html: inlineFormat(ln.replace(/^[-—]\s+/, '')) }); continue; }
    // * eng-stack строка (соберём в один блок eng-stack если идёт подряд)
    if (/^\*\s+(.+)\s+\*$/.test(ln)) {
      flushP();
      const stackItems = [];
      while (i < lines.length && /^\*\s+(.+)\s+\*$/.test(lines[i].trim())) {
        stackItems.push(lines[i].trim().replace(/^\*\s+/, '').replace(/\s+\*$/, ''));
        i++;
      }
      i--;
      blocks.push({ type: 'eng-stack', items: stackItems });
      continue;
    }
    // @handle → cta
    if (/^@\w+/.test(ln)) {
      flushP();
      // если сверху уже есть параграф — он становится cta-q или tg-pre
      // простая эвристика: предыдущий блок без типа h2 → cta-sub, иначе tg-pre
      blocks.push({ type: 'cta-handle', text: ln });
      layout = 'cta';
      continue;
    }
    // обычный текст → буферим параграф
    buf.push(ln);
  }
  flushP();

  // эвристика: если в слайде есть cover-h1 — layout=cover, последний параграф → cover-sub
  if (coverH1Done) {
    layout = 'cover';
    // ищем первый p после rule — конвертируем в cover-sub
    const ruleIdx = blocks.findIndex(b => b.type === 'rule');
    if (ruleIdx !== -1 && blocks[ruleIdx+1]?.type === 'p') {
      blocks[ruleIdx+1] = { type: 'cover-sub', html: blocks[ruleIdx+1].html };
    }
  }

  // эвристика: если есть cta-handle — layout=cta. Параграф непосредственно перед handle → tg-pre.
  // Параграф между h2 и tg-pre → cta-sub. h2 → cta-q.
  const hi = blocks.findIndex(b => b.type === 'cta-handle');
  if (hi !== -1) {
    layout = 'cta';
    if (blocks[hi-1]?.type === 'p') blocks[hi-1] = { type: 'tg-pre', html: blocks[hi-1].html };
    // h2 → cta-q
    blocks.forEach((b, i) => { if (b.type === 'h2') blocks[i] = { type: 'cta-q', html: b.html }; });
  }

  return { layout, blocks };
}

function inlineFormat(s) {
  // **слово** → accent, ==слово== → hl, ~~слово~~ → strike, __слово__ → under, %слово% → dim
  let out = String(s);
  // экранируем сначала?
  out = out.replace(/\*\*(.+?)\*\*/g, '<b class="accent">$1</b>');
  out = out.replace(/==(.+?)==/g, '<span class="hl">$1</span>');
  out = out.replace(/~~(.+?)~~/g, '<span class="strike">$1</span>');
  out = out.replace(/__(.+?)__/g, '<span class="under">$1</span>');
  out = out.replace(/%([^%\n]+?)%/g, '<span class="dim">$1</span>');
  return out;
}

function slidesToText(slides) {
  return slides.map((s, idx) => {
    const lines = [];
    const blocks = activeBlocks(s);
    blocks.forEach(b => {
      const txt = b.html ? stripHtml(b.html) : (b.text || '');
      switch (b.type) {
        case 'top-stripe': case 'rule': case 'qmark': break;
        case 'cover-h1': lines.push('# ' + txt); break;
        case 'cover-sub': lines.push(txt); break;
        case 'h2': case 'cta-q': lines.push('## ' + txt); break;
        case 'tag': lines.push('--- ' + txt + ' ---'); break;
        case 'lead': lines.push('-- ' + txt); break;
        case 'callout': lines.push('> ' + txt); break;
        case 'dark-quote': lines.push('>> ' + txt + (b.src ? ' -- ' + b.src : '')); break;
        case 'bullet': lines.push('- ' + txt); break;
        case 'eng-stack':
          (b.items || []).forEach(it => lines.push('* ' + it + ' *'));
          break;
        case 'cta-handle': lines.push(txt); break;
        case 'tg-pre': case 'cta-sub': case 'cta-tail': lines.push(txt); break;
        default: lines.push(txt);
      }
    });
    return lines.join('\n');
  }).join('\n\n=== \n\n');
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  // оставляем разметку маркерами
  tmp.querySelectorAll('b.accent').forEach(el => el.replaceWith('**' + el.textContent + '**'));
  tmp.querySelectorAll('.hl').forEach(el => el.replaceWith('==' + el.textContent + '=='));
  tmp.querySelectorAll('.strike').forEach(el => el.replaceWith('~~' + el.textContent + '~~'));
  tmp.querySelectorAll('.under').forEach(el => el.replaceWith('__' + el.textContent + '__'));
  tmp.querySelectorAll('.dim').forEach(el => el.replaceWith('%' + el.textContent + '%'));
  tmp.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
  return tmp.textContent.replace(/&nbsp;/g, ' ').trim();
}

/* ─── INLINE FORMAT (floating toolbar) ─── */
let savedSelection = null;
function saveSelection() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) savedSelection = sel.getRangeAt(0).cloneRange();
}
function restoreSelection() {
  if (!savedSelection) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedSelection);
}
function wrapSelection(cls) {
  restoreSelection();
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  // если уже обёрнуто в этот класс — снимаем
  const parent = range.commonAncestorContainer.parentElement;
  if (parent && parent.tagName === 'SPAN' && parent.classList.contains(cls)) {
    const t = document.createTextNode(parent.textContent);
    parent.replaceWith(t);
  } else {
    const span = document.createElement('span');
    span.className = cls;
    try { range.surroundContents(span); }
    catch(e) {
      // multi-element — fallback через extract
      const frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
  }
  // синхронизируем изменения с state
  const ce = (parent || range.startContainer.parentElement).closest('[contenteditable="true"]');
  if (ce) ce.dispatchEvent(new Event('blur'));
  hideFmtToolbar();
}
function clearSelectionFormat() {
  restoreSelection();
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const text = range.toString();
  range.deleteContents();
  range.insertNode(document.createTextNode(text));
  const ce = range.startContainer.parentElement?.closest('[contenteditable="true"]');
  if (ce) ce.dispatchEvent(new Event('blur'));
  hideFmtToolbar();
}
function showFmtToolbar() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { hideFmtToolbar(); return; }
  const ce = sel.anchorNode?.parentElement?.closest('[contenteditable="true"]');
  if (!ce) { hideFmtToolbar(); return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if (rect.width < 1 && rect.height < 1) { hideFmtToolbar(); return; }
  const tb = document.getElementById('fmtToolbar');
  tb.classList.add('show');
  const tbRect = tb.getBoundingClientRect();
  const top = Math.max(8, rect.top - tbRect.height - 8);
  const left = Math.max(8, Math.min(window.innerWidth - tbRect.width - 8, rect.left + rect.width/2 - tbRect.width/2));
  tb.style.top = top + 'px';
  tb.style.left = left + 'px';
  saveSelection();
}
function hideFmtToolbar() {
  document.getElementById('fmtToolbar').classList.remove('show');
}

/* ════════════════════════════════════════════════════════
   SLIDE ACTIONS
   ════════════════════════════════════════════════════════ */
function addSlide(layout) {
  state.slides.splice(state.currentSlide + 1, 0, {
    layout: layout || 'body',
    blocks: [
      { type: 'tag', text: 'новый слайд' },
      { type: 'h2', text: 'Заголовок' },
    ],
  });
  state.currentSlide++;
  saveState(); renderSlide(); renderEditor();
}
function duplicateSlide() {
  const copy = structuredClone(state.slides[state.currentSlide]);
  state.slides.splice(state.currentSlide + 1, 0, copy);
  state.currentSlide++;
  saveState(); renderSlide(); renderEditor();
}
function deleteSlide() {
  if (state.slides.length <= 1) { alert('Нельзя удалить единственный слайд'); return; }
  if (!confirm(`Удалить слайд ${state.currentSlide + 1}?`)) return;
  state.slides.splice(state.currentSlide, 1);
  if (state.currentSlide >= state.slides.length) state.currentSlide = state.slides.length - 1;
  saveState(); renderSlide(); renderEditor();
}

/* ════════════════════════════════════════════════════════
   NAV
   ════════════════════════════════════════════════════════ */
function next() {
  state.currentSlide = (state.currentSlide + 1) % state.slides.length;
  saveState(); renderSlide(); renderEditor();
}
function prev() {
  state.currentSlide = (state.currentSlide - 1 + state.slides.length) % state.slides.length;
  saveState(); renderSlide(); renderEditor();
}
function goTo(i) {
  state.currentSlide = i;
  saveState(); renderSlide(); renderEditor();
}

   FORMAT / BG
   ════════════════════════════════════════════════════════ */
function setRatio(key) {
  state.ratio = key;
  const r = ratios[key];
  cardW = r.w; cardH = r.h;
  const card = document.getElementById('card');
  card.style.width = cardW + 'px';
  card.style.height = cardH + 'px';
  document.querySelectorAll('[data-ratio]').forEach(b => b.classList.toggle('active', b.dataset.ratio === key));
  saveState();
  scaleCard();
}
function setBg(name) {
  state.bg = name;
  const map = { 'cream':'#ede4d0', 'cream-soft':'#f3ecdb', 'cream-dim':'#e2d8c0' };
  document.documentElement.style.setProperty('--cream', map[name]);
  document.querySelectorAll('[data-bg]').forEach(b => b.classList.toggle('active', b.dataset.bg === name));
  saveState();
}

function scaleCard() {
  const card = document.getElementById('card');
  const area = document.querySelector('.preview-area');
  const maxW = area.clientWidth - 40;
  const maxH = area.clientHeight - 140;
  const s = Math.min(maxW / cardW, maxH / cardH, 0.65);
  card.style.transform = `scale(${s})`;
  document.querySelector('.card-frame').style.height = Math.ceil(cardH * s) + 'px';
  document.querySelector('.card-frame').style.width = Math.ceil(cardW * s) + 'px';
}

/* ════════════════════════════════════════════════════════
   EXPORT
   ════════════════════════════════════════════════════════ */
async function exportOne() {
  const status = document.getElementById('exportStatus');
  status.textContent = 'рендерю...';
  const card = document.getElementById('card');
  const orig = card.style.transform;
  card.style.transform = 'scale(1)';
  await new Promise(r => setTimeout(r, 100));
  try {
    const canvas = await html2canvas(card, { width: cardW, height: cardH, scale: 1, useCORS: true, backgroundColor: null });
    card.style.transform = orig;
    const link = document.createElement('a');
    link.download = `slide_${String(state.currentSlide + 1).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    status.textContent = 'готово!';
  } catch(e) {
    card.style.transform = orig;
    status.textContent = 'ошибка: ' + e.message;
  }
  setTimeout(() => status.textContent = '', 3000);
}

async function exportAll() {
  const btn = document.getElementById('exportBtn');
  const status = document.getElementById('exportStatus');
  btn.style.opacity = '0.4';
  const card = document.getElementById('card');
  const origT = card.style.transform;
  const origS = state.currentSlide;
  for (let i = 0; i < state.slides.length; i++) {
    status.textContent = `слайд ${i + 1} из ${state.slides.length}...`;
    state.currentSlide = i; renderSlide();
    card.style.transform = 'scale(1)';
    await new Promise(r => setTimeout(r, 200));
    try {
      const canvas = await html2canvas(card, { width: cardW, height: cardH, scale: 1, useCORS: true, backgroundColor: null });
      const link = document.createElement('a');
      link.download = `slide_${String(i + 1).padStart(2,'0')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      await new Promise(r => setTimeout(r, 300));
    } catch(e) {}
  }
  state.currentSlide = origS; renderSlide(); renderEditor();
  card.style.transform = origT; scaleCard();
  btn.style.opacity = '1';
  status.textContent = `все ${state.slides.length} слайдов скачаны!`;
  setTimeout(() => status.textContent = '', 4000);
}

/* ════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════ */
(function init() {
  if (!state.font) state.font = 'spectral';
  setBg(state.bg);
  setFont(state.font);
  setRatio(state.ratio);
  renderSlide();
  renderEditor();
  scaleCard();
  window.addEventListener('resize', scaleCard);
  document.addEventListener('keydown', e => {
    if (e.target.isContentEditable) return;
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  // floating selection toolbar
  let fmtTimer;
  document.addEventListener('selectionchange', () => {
    clearTimeout(fmtTimer);
    fmtTimer = setTimeout(() => {
      const sel = window.getSelection();
      if (sel.rangeCount === 0 || sel.isCollapsed) { hideFmtToolbar(); return; }
      const ce = sel.anchorNode?.parentElement?.closest?.('[contenteditable="true"]');
      if (!ce || !document.getElementById('card').contains(ce)) { hideFmtToolbar(); return; }
      showFmtToolbar();
    }, 80);
  });
  document.addEventListener('mousedown', e => {
    if (e.target.closest('.fmt-toolbar')) { e.preventDefault(); /* keep selection */ }
  });

  // text mode init
  initTextMode();
})();
</script>
