<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✅ Файл открылся!</h1>
        <p>Если вы видите это сообщение, значит HTML файлы открываются нормально.</p>
        <p style="margin-top: 20px;">Проблема может быть в JavaScript или в размере данных.</p>
    </div>
</body>
</html>
