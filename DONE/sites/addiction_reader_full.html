 недель времени интенсива по постановке вокала. После этого петь было уже не больно. И я больше не заканчиваю концерт раньше времени по причине того, что связки отказали… Это не чудо. Это та часть, которую я сделала сама.\nПотом конечно ребята.. Дэн, Эндрю, Руслан - я чет даже не надеялась, что будет так, как сейчас. Я думала, ну сыграемся мы… Ну будем выступать..  Ну какие тут могут быть чувства. Помните, я же совсем не думала о музыке? А музыка где-то далеко дядя а может музыки и нет вообще здесь музыка везде ужеееееее… И когда я смотрю на этих парней во время концерта, мне хочется плакать от благодарности им, за то, что я услышала свои песни так, как они звучали у меня внутри.. Что я могу закрыть глаза и танцевать, и лететь, и плыть. И то, что задумывалось как средство выживания, ожило само..  И конечно Бро и Флю. Как форма, как тесто - то, что скрепляет, держит, сохраняет. Они все спасли. И было потом что возрождать. А сейчас - вот эти три концерта даже - это совершенно новый организм, весь пронизанный светом, и существующий ради музыки.\nТак вот, рассказ о том, как я поняла наших F. Этот год меня сильно поколбасил. Я не жалуюсь, воспринимаю все, как данность и необходимые мне уроки. Но вот жизнь не всегда сахар - и это факт. Иногда тебе плохо, и ты не знаешь, куда деть себя от ответственности, от сложных решений, от боли, которую испытываешь - но тогда ты надеваешь наушники и все исчезает. Есть только музыка. Она не обязательно должна быть идеальной, хорошей, модной, нравится твоему мужу, она должна просто работать для тебя. А дальше ай донт гив э фак - и пусть весь мир перевернется, это моя музыка. И вот сидишь ты, грустишь, а твоя любимая группа через полторы недели выступает в соседнем городе. И ничего, что это - Таллин. Ты собираешь друзей, покупаешь билеты на Радарио, снимаешь гостиницу прямо напротив клуба… И конечно приходишь вовремя, прямо к тому времени, которое написано на билете. Почему? Потому что не хочешь пропустить начало, вот почему.\nИ в очереди конечно знакомишься с кем-нибудь, болтаешь.. Потом ждешь дооооолго начала концерта, и танцуешь под диджея - и все это так охрененно круто, даже не важно уже, какой будет концерт. Уже на этот момент так хорошо и весело, что стоило всех усилий.\nА потом начинается шоу, и ты знаешь все песни наизусть, ты прыгаешь и танцуешь от начала до конца.. И даже если не лезть в толпу, в самое пекло - все равно энергии столько, что потом еще на неделю хватает. Раньше я вообще этого не понимала - как можно веселиться на концерте? Как. Можно. Это. Делать. Как можно ждать… Считать дни.. Покупать заранее билет, смотреть на него, радоваться. Какого большого количества радости я была лишена все это время! Отказываясь принципиально покупать билеты на коллег я прежде всего обкрадывала себя… Музыка - это живое волшебство.\nМы никогда не сможем записаться так, как звучим на концерте. Мы никогда не сможем передать эту энергетику, которая рождается у нас с залом.. Я теперь понимаю тех людей, которые стоят в зале. Я понимаю, какого момента они ждут, какого переживания, каких эмоций.. И я стараюсь для того, чтобы у нас получилось. А для этого нужно…\nТреники. Кроссы. Футбу REBEL c Эми, с Эмичкой моей Вайнхауз, чтобы тех.команда во главе с Антошей и этот нереальный свет, чтобы орать в зал без микрофона и прыгать в толпу, и и держаться за руки с первым рядом, чтобы были все эти парни со мной на сцене, и чтобы слышать себя охуительно в ухе и из зала, чтобы были мои высокие частоты, чтобы прослушивался весь мой диапазон, чтобы составлять новый плейлист на каждый концерт, и играть по два часа, но чтобы они летели как пять минут - чтобы прыгать высоко, и чтобы конееееееееечно танцевать и ржать в гримерке, и обниматься со старыми друзьями…\nOHHHHH ITS SOOOOO FUCKING GOOOOOOOD TO BE ON TOOOOOUR\nТак хорошо, что хочется купить свой микрик, написать на нем Alai Oli и отправится в путешествие на месяц-два, и воооообще ни о чем не думать. Написать целый альбом танцевальных песен, чтобы качать головой изо всех сил и прыгать выше головы, и смотреть, как вы их поете. Вот, чего я на самом деле хочу. Вот что я люблю прямо сейчас.\nСамара, 24.10.16. Аэропорт, 15 минут до посадки.\n"}, {"path": "data/lj_export_clean/posts_md/22314__after_party.md", "source": "LiveJournal", "date": "Unknown", "filename": "22314__after_party", "content": "# after party\n*Date*: 22 сентября 2009, 08:25\n*URL*: https://olymarkes.livejournal.com/22314.html\n\nВ Ижевске 8.30, сейчас парни поедят макарошки, мы прыгнем в тачку и поедем в Москву. Надеемся быть там уже этой ночью.\nКонцерт был невероятно крутющий - звук, свет, около 600 человек - и все такие качевые ))) Шорты были гвоздем программы, и достались в итоге симпатичной девушке в первом ряду.\nГолос у меня был как у Монсеррат Кабалье, видимо не зря я выпила 4 литра молока с медом - я вообще кроме мо", "full_content": "# after party\n*Date*: 22 сентября 2009, 08:25\n*URL*: https://olymarkes.livejournal.com/22314.html\n\nВ Ижевске 8.30, сейчас парни поедят макарошки, мы прыгнем в тачку и поедем в Москву. Надеемся быть там уже этой ночью.\nКонцерт был невероятно крутющий - звук, свет, около 600 человек - и все такие качевые ))) Шорты были гвоздем программы, и достались в итоге симпатичной девушке в первом ряду.\nГолос у меня был как у Монсеррат Кабалье, видимо не зря я выпила 4 литра молока с медом - я вообще кроме молока в день концерта ничего не ела ))\nГлавные герои шоу\nПотом была долгая афтограф-сессия, пресс-конференция и тусовка дома у наших друзей WTQ, там мы провели весь Димин день рождения.\nКутеж удался, гастроли удались.\nА так - для меня Ижевск всегда был местом с двойным дном. Офигенные концерты, а то что творилось за сценой - это целая глава моей личной истории. Первый раз, когда мы оказались здесь, я съела столько наркотиков, что выпала из жизни на несколько суток. Мы влюбились в WTQ и не расставались с ними следующие пол года: то они к нам, то мы к ним. Потом мы с Щекалевым пол страны автостопом изколесили. Когда я возвращаюсь сюда, мое желание жить, не употребляя ничего, всегда подвергалось испытанию. Я боялась, что мне снова захочется всего этого треша и угара, и раньше мне хотелось.. А теперь совсем нет. От этого очень радостно - я теперь могу тусить с моими ижевскими друзьями, чтобы они не делали, и не напрягаться.\n"}, {"path": "data/lj_export_clean/posts_md/8142__no_title.md", "source": "LiveJournal", "date": "Unknown", "filename": "8142__no_title", "content": "# (no title)\n*Date*: 18 марта 2009, 02:38\n*URL*: https://olymarkes.livejournal.com/8142.html\n*Tags*: Паша, Юля, менеджер, репортаж с места событий\n\nТут очень высокие потолки… Высокие потолки и обшрапанные стены, а ещё – окно. На окне длинная зелёная штора. А за окном – лёд тает и блестит на солнце, по нему шагают люди без шапок. Я сижу на стуле рядом с кроватью, скрестив ноги. Я смотрю на Пашу.\nПаша ещё находится где-то в параллельной реальности. Минуту назад он приоткрыл один глаз и еле слышно ", "full_content": "# (no title)\n*Date*: 18 марта 2009, 02:38\n*URL*: https://olymarkes.livejournal.com/8142.html\n*Tags*: Паша, Юля, менеджер, репортаж с места событий\n\nТут очень высокие потолки… Высокие потолки и обшрапанные стены, а ещё – окно. На окне длинная зелёная штора. А за окном – лёд тает и блестит на солнце, по нему шагают люди без шапок. Я сижу на стуле рядом с кроватью, скрестив ноги. Я смотрю на Пашу.\nПаша ещё находится где-то в параллельной реальности. Минуту назад он приоткрыл один глаз и еле слышно прошептал: «…что…операции…не было…?»\n- Была, Паш.. – я улыбаюсь и беру его за руку, - доктор сказал, что всё хорошо.\nНо он уже не слышит. Снова спит. Но это – такой болезненный сон, когда человек чувствует боль, но ещё не осознаёт её. Может к утру проснётся – обнаружит все эти бинты на себе,  торчащие из тела трубки, какие-то пластиковые баночки с кровью. И каково ему будет – одному, в этой большой больничной палате? Даже некого попросить, чтобы воды принесли. Вот он, минус VIP – одноместного размещения.\nНо я смотрю на него и улыбаюсь. Я спокойна и счастлива, потому что сейчас уже всё хорошо. И можно выдохнуть и перестать боятся.\n***\nК нам приезжал Парень из Африки.\n«Красивый город, но может ты скажешь, куда мне ехать…?!»  - прочитала я смс и офигела.\nМы с Юлей сидели в нашем новом доме на Мамина-Сибиряка 126. На вечер того дня у нас была запланирована фотосессия в джакузи с дискоболом, мы ждали в гости Сергея Никифорова (нашего оф. фотографа) и самые сливки группы Alai Oli – Бро и Диму.\nФотосессия прошла отлично. Пока что у меня есть только одна картинка (см. вконтакте аватар), но позже вы всё увидите. Ещё решили сделать нашему менеджеру приятно (см. вконтакте фотоальбом Боже Храни Менеджера!).\nСледующий день гуляли с Парнем из Африки по городу, а потом я ходила на читку  пьесы «Китайская Стена»  в театр Коляды. Вдохновилась…\nПеред концертом мы с Игорем (пареньизафрики – слишком длинно) и Бро съездили на студию к Тополю, чтобы бахнуть пару совместных треков. По пути зашли в Спид-центр, сделали экспресс-тесты на ВИЧ  (ну это входит в программу развлечений для гостей нашего города). Отличный саундтрек – песня Noize MC «Кантемировская»,  как раз на днях закачала музыки в телефон, чтобы слушать через новые блютуз наушники. К слову – все результаты - отрицательные.\nТусовка в 2КУ прошла отлично. И самая жесть была, когда я увидела в зале нашего менеджера. Он специально прилетел из Питера… или из Москвы? Отправил на концерт  KREC&CHEK своего заместителя, а сам приехал к нам… Неожиданно и очень радостно. Во время концерта находила его взглядом в толпе, и было мне так хорошо от этого!  Ещё я познакомилась с одной из своих подруг по переписке: она подарила мне маленького золотого львёнка на шею. Типа на 8е марта…  Тоже – с ума сойти как приятно )\nПотом, как обычно, менеджер превратил нашу жизнь в праздник. Накупил кучу еды и выпивки для тех, кто пьёт (половина Alai Oli постится, а я – не пью вообще), у нас на Мамина Сибиряка собралась огромная компания, я приготовила макароны по-флотски, Костю напоили водкой. Все кричали «ПЕЙ! ПЕЙ! ПЕЙ!» и наливали рюмку за рюмкой. Наш московский хэдлайнер Игорь тоже нормально принял на грудь ) Потом все отправились в Квартиру. Я оставила Бро ответственным за москвича и свалила домой.\nВ воскресенье мы с нашим менеджером и его девушкой Катей отправились кататься на Ежовую. Ещё с нами поехал Паша. Он вообще все эти дни «тусовался». Ходил на своих двух ногах, ожидая, что после выходных его положат в больницу, и всё-таки сделают операцию.\nПозвонил Бро. Рассказал, что еле донёс Игоря до поезда в Омск. Потом, уже из Омска Игорь написал: «Тут меня тоже не встретили. На вокзале мне дали по почкам и отобрали все вещи. А гитара у вас?». Гитару, как выяснилось позже, Бро положил на полку в поезде. Пакурям, гитара! Ну, о приключениях Парня из Африки на гастролях можно написать отдельный пост, или целый иронический детектив в стиле Дарьи Донцовой. Не мой стайл.\n***\nВ понедельник Паше сказали, что надо ехать в Челябинск и делать операцию по месту прописки. Во вторник он приехал в Челябинск, где ему сказали: «Ну ты, чувак, даёшь… Тусуешься, а у тебя всё это время позвонок проседает и разрушается!». Потыкали указкой в снимки МРТ, чтобы Паша понял: где осколки позвонка, а где – спинной мозг, И ещё популярно объяснили, что будет, если осколки и спинной мозг встретятся  – ноги откажут и всё в этом роде. А если не сделать операцию прямо сейчас (130 тысяч), то всё будет плохо.\nНа следующий день  Паша вернулся в Екатеринбург, и я позвонила Жене Ройзману. Если почитать его ЖЖ можно понять ход моих мыслей – я не могу даже представить, кого ещё я могла попросить о помощи. Изначально, просьба была такая – позвонить глав. Врачу 36ой больницы (там сказали – операция стоит всего 30 тысяч!) и попросить его, чтобы хирурги починили неместного Пашу. Если позвоню я – меня пошлют куда подальше, сами понимаете. А если позвонит Ройзман, его как минимум послушают, и он успеет сказать что Паша –  многократный чемпион России по маунтинборду, плюс ещё вице-чемпион мира, и вообще – не последний человек в экстримальном спорте.\nДва дня Женя нянчился с нами, обзванивал врачей, мы пробовали сделать Паше временную прописку и страховой полис – но всё это слишком растягивалось по времени, а тянуть было уже нельзя. В пятницу мы снова съездили с утра на Компрессорный в 36ую, а потом Женя договорился с Институтом травматологии, мы приехали туда и Пашу, наконец, оформили. Без полиса и паспорта. В отличную одноместную палату с холодильником(!!). И отпустили на выходные домой, потому что в понедельник – все анализы, а операция – только во вторник.\n***\nЕщё приехал Михей – учитель йоги. Мы со Здоми занимались у него, когда были на ГОА. И Здоми организовал ему семинар. Два дня – четыре занятия. Хорошо, конечно, но в Индии мне нравилось больше…\n***\nВ понедельник я ходила на «Амиго», куда меня позвала Саша Чичканова – помощник режиссера Коляды-театра. Она сказала, что именно этот спектакль по настроению схож с моим творчеством. И знаете – да… Плакать и улыбаться.\nРазговаривали с ней потом в коридоре – я всякие истории про себя рассказывала. Актёры уходили домой, проходя мимо нас – прощались с Сашей. Поймала себя на том, что я  многих из них знаю по именам. А Ягодина я раньше даже и представить не могла в амплуа гениального актёра – хоть мы и были знакомы: с Курарой мы нередко оказывались на одной сцене, а вот в театр этот я как-то не попадала.\nПотом за мной пришла Юля и мы пошли домойс. Просыпаюсь рядом с лучшим другом – и весь день потом хожу заряженная. А ещё лучше – весь день не расставаться. Раньше мы с Юю всё-всё делали вместе, а сейчас – стали ещё ближе. И никакие расстояния нас не смогут разделить. И никакие временные промежутки. Слышишь, Юль..? Я люблю тебя.\n***\nОчень много хороших новостей.\n«… записывать альбомы, снимать клипы.. Смотри: перед нами все двери сейчас открыты»  (с) Крэк\n"}, {"path": "data/lj_export_clean/posts_md/14243__куча_куча_куча_куча_всего_со_мной_произошлао.md", "source": "LiveJournal", "date": "Unknown", "filename": "14243__куча_куча_куча_куча_всего_со_мной_произошлао", "content": "# Куча куча куча куча всего со мной произошла(о?) )))\n*Date*: 20 июня 2009, 22:50\n*URL*: https://olymarkes.livejournal.com/14243.html\n*Tags*: Бро, Паша, Сергей Никифоров, репортаж с места событий, фото, экстрим\n\nЗа последнюю неделю со мной произошло столько интересных вещей, что половину я даже успела забыть.\nБуду рассказывать всё в обратной последовательности – ха ха – прикиньте, чтобы ещё что-то не забыть -  Totally Gonzo!\n5.\tСуббота. 13.00. Гаи *****ского района.\n- Мне нужно оформить ДТП… - я", "full_content": "# Куча куча куча куча всего со мной произошла(о?) )))\n*Date*: 20 июня 2009, 22:50\n*URL*: https://olymarkes.livejournal.com/14243.html\n*Tags*: Бро, Паша, Сергей Никифоров, репортаж с места событий, фото, экстрим\n\nЗа последнюю неделю со мной произошло столько интересных вещей, что половину я даже успела забыть.\nБуду рассказывать всё в обратной последовательности – ха ха – прикиньте, чтобы ещё что-то не забыть -  Totally Gonzo!\n5.\tСуббота. 13.00. Гаи *****ского района.\n- Мне нужно оформить ДТП… - я заглядываю  в дверь кабинета номер шесть, где на меня с любопытством смотрят 6 загорелых гаишниковских лиц.  Я в строгом костюме. У меня в руках – папка с документами.\n- …… Ольга?! – на меня смотрит большой чувак в штатском лет 45ти, с чёрными-чёрными глазами – Тебя же Ольга зовут?\n- …. Ну да.\n-  Откуда я тебя знаю? Откуда-то я тебя знааа-ааааю….  Иди, пиши объяснительную.\n15 минут спустя я сижу в другом кабинете за столом этого гайца, он всё так же безрезультатно  пытается вспомнить, откуда он может знать меня. Перечисляет возможных общих знакомых, какие-то места… - нифига.\n- А… Может водку будешь? – с надеждой смотрит он на меня.\n- Нет. Я не пью. Спасибо.\n- А пиво?\n- Я вообще не пью.\nСнимает телефонную трубку, вызывает откуда-то другого гайца, видимо званием помладше.\n- Садись. Оформляй её.\n- !?!?! – младший смотрин на моего протектора с возмущением – Да я там других оформляю! Закончить-то дайте!\n- Садись я сказал.\nМладший обречённо садится и оформляет моё ДТП, сам заполняет за меня все нужные бумаги, я в шоке и а*уе смотрю на всё это дело – неужели не снится?!\n- Что-то я так и не вспомнил, откуда я тебя знаю.. Ну ладно.\nЯ забираю нужную справку, вежливо прощаюсь и ухожу, слабо веря в то, что со мной произошло. Никогда ещё в подобных заведениях со мной не были так вежливы, ещё никогда Система не отпускала меня из своих стен, предварительно не вынеся мне мозги. А тут –меньше получаса и никакого геморроя!\n- Дааа… внатуре, хорошо быть мной! – уже на улице говорю я Лере Колью, её я взяла в качестве команды поддержки, предполагая, что в ГАИ я проторчу пол дня…\n4. 9.00 а.m. Главный Корпус УрГУ.\nЯ стою перед большим зеркалом  внизу и нравлюсь себе, как никогда. Костюмчик от Sisley сидит как влитой – признаюсь, я сомневалась, что он будет мне впору, ведь мне его покупали 2 года назад – тогда я была юна, стройна, работала в рекламном агентстве, и на переговоры надо было ходить в приличном виде.\n- Какой это размер? – размышляла я вслух, доставая костюм в чехле из шкафа.  – КАКОООЙ?!  - на лэйбе стояла цифра 40. – Это типа ошибка?\nХотя мне даже не пришлось садится на диету, видно за 2 года ничего не изменилось, но в 40 размер я не верю. Как минимум 42, не меньше. Не хочу быть дистрофиком!!!!!!!!!!!!!!\nЯ наконец отрываюсь от зеркала и вижу заспанные щщи Бро. Вот настоящий лучший друг пришёл меня поддержать на защите диплома!  Наш фотограф Сергей Никифоров – вообще герой – приехал аж с Химмаша, ещё и после ночных съёмок – слава и хвала ему. Ещё приехал мой папа – короче, я целую тусовку собрала.\n.\nБро, я,папа и мой обожаемый науч.рук - Владимир Фёдорович Олешко\nостальные фото вконтакте!\nЗащитная речь моя лилась прямо из сердца, и «научности» там было грамма два, зато эмоций - … Я страстно рассказывала про свою любимую Гонзо журналистику, меня реально пёрло.\nЗащитилась на пять. Теперь я – дипломированный специалист!! У меня высшее образование. Я человек – не жук! )))))\n***\n3. уже суббота 03.30.am Мамина-Сибиряка 126.\nЯ уже почти не рыдаю.  Юля учит какие-то стихи для поступления в ЕГТИ.\n***\n02.40 a.m.\nМамина-Сибиряка 126.\n- И что мне теперь делать?! – я занудно гнусавлю в телефонную трубку – ГАИ говорят, что они на такую фигню не выезжают! А в страховой сказали – надо им из ГАИ справку стопудова!!!!\n- Оля. Забей. Ложись спать. У тебя завтра защита, мать твою!!!\n01.30\na.m.\nМамина-Сибиряка 126.\nЯ рыдаю.\n01.00 a.m\nМамина-Сибиряка 126, двор.\nЯ рыдаю.\n00.50 a.m\nМамина-Сибиряка 126\nЯ пытаюсь заехать в дырку между двумя бетонными столбами  на подземной парковке. Охранник показывает мне жестами:\n- Двигайся на меня.\n-….. ХШШШШШШ – машина чиркает боком об бетонный столб слева - !!!!!!!!!!!!!!!!!!! мой мозг взрывается.  Занавес.\n***\n2. Пятница\n.\nЕкатеринбург WTQ\nДень перед защитой диплома? О да, конечно! За окном такое лето – я просыпаюсь вместе с первыми лучами солнца – за окном розовый рассвет, я почему то счастлива так, что меня подкидывает с кровати. Болтаю с менеджеромпо аське, он ещё не ложился. Говорит – у них там тоже рассвет…ага.\nВ 6 утра мы с Пашей уже выходим на улицу. Я в голубеньком платишке, на ногах -  офигенные босоножки с бисерными цветами, лёгкая накидка – одни рукава –  весь прикид от Roxy, и к нему - голубая тряпичная сумка Биллабонг. В прошлом году мы с Юлей так развлекались в Экспансии, Юля из меня куколку-девочку сделала – убедила меня, что платье мне идёт. ))\nИдём в А-продукт на Родонитовой, покупаем сухой завтрак (цельнозерновые хлопья с сухофруктами) и молоко. У меня в сумке – две плошки и две ложки. Между Родонитовой и Крестинского есть две школы и зелёный стадион. На травке расстилаем арафатку и устраиваем завтрак – пикник. В семь утра уже жарко. Я щурюсь на солнышке, вытягиваю босые ноги на травке – опять счастливая до безобразия.\nВ 11 утра заваливаемся к нашему бывшему гитаристу Банану – там Паша обретает две новых татуировки. Рыбку Поню и Янтру – ловушку для злых духов.\n.\n3 дня до отъезда, надо всё успеть сделать. Вечером йога на горе с Аней Шубиной и Мишей… - к защите я готова.\n1. Вторник – Среда – Четверг. ГЛЦ\n\"Ежовая\"\nЯ + Паша + Серёжа грузимся в тачку и едем на гору Ежовую. Там Паша строит самый большой дёрт-парк в России, Серёжа ему помогает, а я…. Я взяла с собой коврик для йоги и книгу, но никакого дзена не получилось. Там было столько насекомых, что на месте сидеть было не возможно. В результате я как настоящий мужик копала дёрты лопатой – не всё время, конечно, но у меня есть повод собой гордится и чувствовать свою причастность к этому произведению шейперского искусства.\nСтроительство парка – это творчество. В прошлом году я смотрела, как Паша строит и шейпит зимний парк, даже ездила с ним в ратраке, который как утюг разглаживал приземления, ночью под такими огромными звёздами – романтика…. Летний парк – это гораздо жестче, там нет специальной техники, и я с восхищением наблюдала, как на пустом месте появились серия из трёх огромных  фигур.\nПаша крут. Всё что он делает – он делает идеально, с полной отдачей, с максимальной продуктивностью. Он может дирижировать самосвалами и экскаваторами, а потом делать всю оставшуюся работу лопатой и своими руками, не боясь огромного объёма работы, тонн земли, которые придётся перекидать… Я им восхищаюсь. Самый крутой мужик, которого я знаю. Вот\n.\nуезжаем в понедельник. Поедем через Нижний Новгород, зарулим на дачу к нашему лучшему в мире менеджеру\nМолочный продукт (19:12:44 20/06/2009)\nпоедете через нижний новгород-остановитесь у бабушки моей\nМолочный продукт (19:13:01 20/06/2009)\nна даче.молоко и прочее в программу входит бесплатно\nа мы только за!!!\n"}, {"path": "data/lj_export_clean/posts_md/48796__я_устала_пздец.md", "source": "LiveJournal", "date": "Unknown", "filename": "48796__я_устала_пздец", "content": "# я устала п*здец.\n*Date*: 14 апреля 2010, 15:06\n*URL*: https://olymarkes.livejournal.com/48796.html\n\n***\nДумала той, первой ночью: вот сейчас напишу пост в жж с телефона, и позвоню в его дверь. Среди ночи, чтобы в очередной раз убедится что мы созданы друг для друга. Сбежать с вечеринки после концерта, ехать за рулем по пустынному городу, лететь, качая головой под любимые треки - кто там сидел за пультом радио Максимум?  Любимый город был в солнце был под звездами был в утренней дымке, а мы не ", "full_content": "# я устала п*здец.\n*Date*: 14 апреля 2010, 15:06\n*URL*: https://olymarkes.livejournal.com/48796.html\n\n***\nДумала той, первой ночью: вот сейчас напишу пост в жж с телефона, и позвоню в его дверь. Среди ночи, чтобы в очередной раз убедится что мы созданы друг для друга. Сбежать с вечеринки после концерта, ехать за рулем по пустынному городу, лететь, качая головой под любимые треки - кто там сидел за пультом радио Максимум?  Любимый город был в солнце был под звездами был в утренней дымке, а мы не спали. И как тут спать? Он такой красивый, что глазам горячо. Он такой... его тело хочется рисовать, прошло три месяца или четыре а он стал еще красивее - такие руки и плечи и вообще все все все - татуировки на икрах и предплечьях, на этой самой идеальной спине - маянские иероглифы, и дреды стали длиннее  и все те же светлые кудряшки...\nЯ боялась что вернусь однажды, и будет уже поздно. Я вообще не трусливая, а этого боялась. Ну да, я не могу \"быть\" с одним человеком. Не могу быть рядом с ним 24 часа в сутки - может потому, что развивается тяжелая форма зависимости, и я впадаю в крайность - не могу сделать без него ни шага, ни одной ночи не могу провести вне его теплых ласковых объятий.  Это, блять, рай на земле, и ничего нахрен не нужно. Гораздо продуктивнее в плане творчества не быть вместе, а заниматься пиздострадальчеством и всех сравнивать с ним, каждый раз убеждаясь что этот мальчик и есть любовь всей моей жизни.\n***\nафтерпати затянулось\nв коляда-театре мне взорвали мозг спектаклем \"Бог любит\"\nя прыгнула с 70 метровой вышки с веревкой\nя наездила километров триста по городу из одних гостей в другие\nпробежала с первого раза уктусские 5км\nсходила на самую гламурную йогу в Екб\nсъела три большие пасхи\n***\nпоторчала на студии Леши Маэстро 2 раза - вчера подхватили рэп бацилу и вот такая отрыжка вышла )))\nШевроле Ланос - Ланос Шевроле\nвроде тачка так себе,  зато у меня их две\nоля гонит сто сорок, качая головой под раггу\nспасибо страховым компаниям за КАСКО и ОСАГО\nПускай здесь нету гидроусилителя руля,\nЗато бицуху накачала за неделю, мля.\nЗалезай скорее Бро в мое авто\nДовезу, а ты заправь  рублей на сто - о - о\nа дверь тут открывается только снаружи - брак!\nно это только бонус, если ты  - маньяк\nзато моя ориджинал ба два икса\nподарила на литье четыре колеса\nШевроле Ланос - Ланос Шевроле\nСеребристая стелит по Питеру\nЧерная по Екб\nВ одной -  диск Леши Маэстро\nВ другой - Ассаи\nреспект всем друзьям, где бы вы ни были - Ай!\n"}, {"path": "data/lj_export_clean/posts_md/65843__хочешь_похудеть_-_спроси_меня_как.md", "source": "LiveJournal", "date": "Unknown", "filename": "65843__хочешь_похудеть_-_спроси_меня_как", "content": "# Хочешь похудеть - спроси меня \"Как?\"\n*Date*: 13 января 2011, 01:05\n*URL*: https://olymarkes.livejournal.com/65843.html\n\nЗа окном моей любимой квартиры на Ботанике дым из труб сливается с облаками. Мне так хорошо и спокойно в этот раз – чувствую себя в своей тарелке. Когда хорошо – писать совсем не хочется.\nЗачем я вообще это делаю? Время показывает мне, что единственное ценное, чем мы обладаем – это опыт. Не знания, а именно прохаванные на своей шкуре вещи.\nЯ нихера не святая, и мы все это зна", "full_content": "# Хочешь похудеть - спроси меня \"Как?\"\n*Date*: 13 января 2011, 01:05\n*URL*: https://olymarkes.livejournal.com/65843.html\n\nЗа окном моей любимой квартиры на Ботанике дым из труб сливается с облаками. Мне так хорошо и спокойно в этот раз – чувствую себя в своей тарелке. Когда хорошо – писать совсем не хочется.\nЗачем я вообще это делаю? Время показывает мне, что единственное ценное, чем мы обладаем – это опыт. Не знания, а именно прохаванные на своей шкуре вещи.\nЯ нихера не святая, и мы все это знаем – как и большинство людей то горжусь собой, то ненавижу за слабости, мне то прет – то не прет, и я бьюсь, как рыба об лед только чтобы узнать – как мне быть собой, как быть счастливой и как приносить миру пользу, а не вред. (n.b. советы на эту тему не принимаются).\nСегодня я немного выпаду из роли ТП, побуду взрослой и серьезной девушкой.\nУ меня высшее образование, я много лет работала/подрабатывала журналистом, в том числе и в передаче «Формула Здоровья», гг ) затем - в сфере рекламы.\nВсе это время я параллельно занималась Alai Oli – раньше у нас не было менеджера, и все дела решали мы сами. И это еще не все – я тусовалась, курила и бухала и вела ни разу не здоровый образ жизни.\nКурить сигареты и дудку я начала в 12 лет, лет до 19ти я искренне считала, что спорт – вреден. Не гоняла на физкультуру, не ходила пешком даже до следующей остановки. Короче – не человек, а тряпка.\nО том , как я пришла к трезвому образу жизни – в следующий раз. Сегодня о спорте и правильном питании\nУ меня в семье любят вкусно поесть – все жирное, аппетитное, приготовленное с любовью )) И члены семьи все такие – упитанные. Даже младший брат соточку весит почти. У кого-то есть способность жрать что попало и не поправлятся, но это – явно не про нас.\nДо 1 курса я любила и принимала себя такой, какая есть. Потом все изменилось: фотографии с концертов, свисающий над ремнем живот и бока – это любую девушку расстроит. Мне было реально больно – я не знала, как мне быть и с чего начать. Мой рацион состоял из огромных порций курицы с картошкой и майонезом, дошика, белого хлеба, нескольких сплиффов дури, 2х пачек сигарет и шоколадки Альпенгольд. Может, в одежде я и не выглядела толстой, но тело мое было рыхлым и пухлым – полный отстой, короче.\nЯ не говорю: я похудела. Это не единоразовая херня, а интересная игра с природой и собственным телом – движуха на всю жизнь. На сегодня я изменила образ жизни для того, чтобы быть красивой, здоровой, нравится себе и получать удовольствие. У меня накопилось куча знаний на эту тему – от разработки правильных спортивных рационов до аюрведического питания – работы с дошами, временами года и географическим местоположением. Все это проверено только на мне, и не претендует ни на какую объективность, так что возьмите нужное вам – ненужное отбросьте.\nБыли у меня и ошибки: я голодала и торчала, ограничивала себя в какой-то определенной пище, считала калории, не ела после 6 - ну, типичный наборчик. Все это помогает, но недолго.\nСейчас у меня миновало время глобальных перемен – я просто живу и получаю удовольствие от того, как я питаюсь, как колбашу спорт и как я выгляжу. Я очень люблю помогать другим добиться цели, я чувствую себя счастливой, когда мой опыт полезен.\nЕсли ты весишь меньше 52х кг – мне нечем тебе помочь ) А вот для остальных – следующая часть этого поста.\nМногие девушки пишут мне: как ты питаешься? Что мне делать, чтобы похудеть?\nДо конца февраля я не в туре, и я готова консультировать каждую из вас лично.\nОт вас требуются: неебическая мотивация и честность с собой.\nЗамутим команду, будем друг друга поддерживать и помогать. Через несколько месяцев посмотрим, что получится.\nПомни - если ты можешь принять себя такой, какая\\ой ты есть - ты уже просветленнее меня на порядок ) я же хочу иметь дело с такими же ебанутыми, как я сама.\nЗаписываться в комментариях к этому посту. Нужна история - ты должна\\должен рассказать о себе и о том, зачем ты хочешь измениться )\n"}, {"path": "data/lj_export_clean/posts_md/80114__записки_графоманские.md", "source": "LiveJournal", "date": "Unknown", "filename": "80114__записки_графоманские", "content": "# записки графоманские\n*Date*: 17 января 2016, 00:32\n*URL*: https://olymarkes.livejournal.com/80114.html\n\nМне чудовищно тесно в одном человеке. Но жаловаться, конечно, грех. Пару дней назад вышел наш новый клип «Тлен» - как ни странно, благодаря паре эпиграфов большинство зрителей поняли смысл. Это хорошо. Это хорошо, потому что одно из моих внутренних «я» - которое творческое - оно остановилось в своем закономерном развитии и не заматерело, мне все еще важно говорить с моим слушателем, мне все ", "full_content": "# записки графоманские\n*Date*: 17 января 2016, 00:32\n*URL*: https://olymarkes.livejournal.com/80114.html\n\nМне чудовищно тесно в одном человеке. Но жаловаться, конечно, грех. Пару дней назад вышел наш новый клип «Тлен» - как ни странно, благодаря паре эпиграфов большинство зрителей поняли смысл. Это хорошо. Это хорошо, потому что одно из моих внутренних «я» - которое творческое - оно остановилось в своем закономерном развитии и не заматерело, мне все еще важно говорить с моим слушателем, мне все еще важно знать, ради чего все эти концерты и бесконечная студия и репетиции и вообще все это - то, что не щекочет эго, не приносит денег, то, что огромный труд и вообще мне не по силам.\nПри этом в жизни не-творческой в данный период моей жизни я чувствую себя на миллион долларов. На 1000%. У меня есть некие жизненные принципы, которые, как оказалось, очень противоречат принятым стандартам в неких сферах  - например, в бизнесе. Вот я не знаю, рождаются ли люди мошенниками, ворами, подлецами и высокомерными стяжателями - или их где-то этому учат? Возможно, есть такой институт, или «лидерские курсы» где говорят, что чтобы быть успешным и эффективным, тебе надо идти по головам, красть идеи, заниматься чернухой. Короче, так работает очень много людей - и это печаль.\nС другой стороны, мне с моей\n#sekta\nгораздо проще. Когда люди понимают, как все работает внутри, они остаются с нами навсегда… Это не о том, что они ходят к нам круглый год - нет, они остаются с нами внутренне, что гораздо важнее. Мы не участвуем в конкурентной гонке, мы не «продаем». Я забочусь о своих сотрудниках, о цели и об общей идее. Сотрудники заботятся от других сотрудниках и об учениках. Тема эксплуатации, обмана, неуважения к людям настолько чужда всей нашей структуре.. Думаю именно это оставляет в нашей команде самых альтруистичных и влюбленных в человечество людей: кому-то действительно важно знать, что он работает на светлой стороне.\nДа, может быть «Ночной Дозор» далек от лакшери, но это то, что реально наполняет и дает силы жить и работать. К чему это я - каждый день где-то человек создает свою секту, думая что люди - это глупое стадо, которое мечтает об одном: похудеть любой ценой. Что люди настолько глупы, что они покупаются на украденные «до и после» или проплаченные посты в акканутах знаменитостей. Я считаю, что нет лучшей рекламы, чем ее отсутствие. Если ты хочешь быть востребованным - постарайся заниматься тем, что ты любишь, только в этом ты станешь действительно хорош. Я не лукавила, когда говорила что если не будет денег - мы будем работать и бесплатно. Не все 300 человек, но многие. И работать - это не значит «помогать людям разобраться с питанием», это значит быть полезными руками, головой - чем угодно. Я никогда не забываю историю о том, что «Завтра была война».\nТы никогда не знаешь, что будет завтра. Для меня твердо стоять на ногах - это явно не про финансовую стабильность и устойчивость экономики страны. Для меня это прежде всего про твердость нематериальных ценностей. И вот вопрос, ответ на который меня интересует: неужели и правда все эти люди, которые жаждут наживы, не испытывают такой искренней потребности быть чище, ближе к Богу, каким бы именем они его не называли? Мне почти 30 лет, а я все еще не верю, что есть люди, которые глубоко внутри не тянутся к свету.. Мне кажется, мы все рождены, чтобы взаимодействовать и лечить раны друг друга.. А не ранить. Наполнять, а не высасывать все соки. Хочу однажды проснуться в таком мире.. Пусть даже и через тысячу лет.\nТеперь снова о творчестве. Человеку нужен человек. Каждый, имеющий голос, несет огромную ответственность за то, что говорит. Мне говорят: «научись не воспринимать критику». Такой бесполезный совет я давала сама себе много раз. Оказывается, действительно «воспринимается» критика только от тех, кто имеет авторитет - критика остальных ранит. Она ранит, как когда люди не видят твоих истинных намерений. Когда родители несправедливо наказывают тебя. «Критика ранит твое Эго» - да, но Эго - это тоже часть меня, которая может быть конструктивной и деструктивной. Мое конструктивное эго пишет песни, деструктивное эго говорит: «не покажем их этим злым людям». Мой внутренний наблюдатель всегда за то, чтобы молчать. А внешние авторитеты регулируют процесс, то есть люди все равно являются двигателями деятельности. Но это - эффект толпы.. коллективное бессознательное.. То есть у меня есть ощущение, что в целом и это является вполне гармоничным процессом.\nЯ написала альбом за несколько лет - и он наполнен сутью до краев. Он - не бесконечная песня об одном переживании, это жизнь - моя жизнь и мое видение мира. То, что я успела собрать в долгом путешествии… Если бы я писала альбом два месяца - возможно, он бы получился текстово-музыкальным, демонстрацией моего умения писать предложения и подбирать трогающие меня темы - но это была бы не я. Я могла бы быть техничнее, злободневнее и т.д. - но тогда я бы заигрывала с людьми и старалась бы удовлетворить их запрос. Балансируя между любовью и ненавистью к абстрактному слушателю, я отстаиваю перед собой право оставаться собой и желание развиваться. Когда кто-то со стороны говорит тебе: иди и делай то-то, ты сначала тратишь кучу времени и сил чтобы доказать себе, что ты и без этих отличных советов справляешься. Бунт нужен для того, чтобы нащупать собственный путь, чтобы не быть ведомым и не чувствовать себя ведомым. После бунта ты можешь все-таки принять, что тебе необходимо развиваться.. Но я часто думаю: если бы люди действовали конструктивнее, мир развивался бы быстрее. Например: 10 лет мне говорили, что я ужасно пою. Я переживала по этому поводу, но у меня не было возможности заниматься вокалом регулярно и с хорошим педагогом. И вот два года назад моя подруга, божественного таланта певица, просто дала мне своего преподавателя и… И я научилась петь. Чуть-чуть. Я просто больше не срываю голос и умею четко произносить все слова, которые пою. Для меня это больше не мука, а вполне себе удовольствие… И в этом альбоме я наконец-то спела все так, как хотелось и слышалось внутри. Мораль здесь в том, что если ты не можешь помочь человеку делом - твои советы делают больно. Но скорее всего и это является частью великого замысла, поэтому ты мог все это и не читать. It is as it is.\nДругие говорят, что надо творить, как конвеер или завод - это, типа, мастерство. Художник должен жить каждый день производя свой контент, чтобы радовать почитателей и набивать руку. Я не считаю свое творчество плодом «мастерства» - оно не является целью моей жизни, скорее это - саундтрек и зарисовки сути. Ценность истории, которая произошла - а не искусного замысла. Дело не в том, что такой тип искусства я считаю правильным - нет, скорее это тот стиль, который выбрал меня, как в свое время на первом курсе журфака гонзо-журналистика выбрала меня, и я была верна ей до самого диплома. Когда кто-то торопит меня или старается переделать - я нервничаю. От того, что я нервничаю, скорее всего не случится никакого прорыва в творческом процессе - возможно я напишу песню о том, как мудаки одолевали меня своими бесценными советами, а я слушала только свое сердце и тишину, но кажется, у меня уже была такая песня. В моей жизни много замечательных событий и людей, приятных и не очень - но «замечательные» - это качество, которое не о позитивности, а о силе тех или иных явлений. Я помню самых верных фэнов, самых язвительных и умных хэйтеров, самых ярких маньяков. Они действительно меняют реальность. Все остальное - трясина, которая не дает вдохновения и сил. «Вдохновляй меня, ведь ты считаешь себя правым. Но не бывает правды. Нет ничего, в чем можно быть уверенным на все 100. Просто вдохновляй меня». Эти строки всегда пульсируют в запястье. Не каждый из вас меняет мою реальность. Но вселенная работает вашими руками.\n\"Меня так много, мне тесно в любой комнате\". Как журналист, я могу чувствовать любое медиа-пространство и адаптировать под него контент. Но я не могу вписаться целиком ни в одно из них. Мне чертовски тесно в инстаграмме, но зато он помогает мне встречать \"моих\" людей в реальности. В инста мне не хватает места, чтобы описать реальность в полутонах, и поэтому мне самой бывает противно от своего образа там. Но нюансы никому не нужны. Всем нужна суть. Но суть без нюансов лжива..  Аудитория ВК не располагает к разговору. В Фэйсбуке меня никто не читает кроме друзей, и это хорошо. В твиттере я могу пошутить и поговорить про рэпчик. Перископ это вообще площадка для онлайн-лекций, но мои знания и компетенции - это не я. Мое окружение, страны, в которых я бываю, мой бизнес - это не я. Мне чертовски тесно в одном человеке, и я не знаю, сталкиваются ли с этим другие люди. Я вижу мир, как мама, как женщина, как атлет, как бизнесмен, влюбленный в свое дело, как работодатель и ответственный гражданин, как творческий человек, как любитель рэпчика, в конце концов.. Как журналист, который хочет описывать мир из каждой из этих точек самоосознания. Как человек, который всегда видит свое несовершенство во всех этих проявлениях и жаждет уже не совершенства, а осознанности.. Осознанности, как четкого ощущения своих рук и ног и всех проявлений своей личности - а не как абстрактного понятия о том, чтобы казаться лучше, чем ты есть на самом деле.\nБесконечный процесс и поиск. Бесконечный (а на самом-то деле вполне конечный в перспективе) колодец, в котором только первую четверть как-то размышляешь об одиночестве и неуютности происходящего. Потом как-то привыкаешь, постигаешь физические законы, перестаешь бороться с непобедимым, наконец-то начинаешь вглядываться в происходящее, картинка каждую секунду меняется, меняешься и ты - и эта бесконечная новизна обстоятельств затягивает.  И знаете, особенное удовольствие в круговороте вдруг обнаружить в этом свободном падении ночь, тихий дом, тропический ливень за окнами, стол, ноутбук, ромашковый чай, невидимого, но такого приятного абстрактного собеседника, с которым хочется поделится мыслями - просто рассказать о том, каким я вижу мир сегодня.. Алиса падает вниз, а рядом падает банка малинового варенья. А как у вас?\nза фото спасибо\nmika_sueno\n"}, {"path": "data/lj_export_clean/posts_md/82835__hard_diving.md", "source": "LiveJournal", "date": "Unknown", "filename": "82835__hard_diving", "content": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один парень умер от наркотиков, и много я прочитала в те дни - о том, что надо было спасать, или о том, что", "full_content": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один парень умер от наркотиков, и много я прочитала в те дни - о том, что надо было спасать, или о том, что надо было предпринимать меры. Я, конечно, в очередной раз примерила на себя эту историю. Никто не мог помочь, никто не мог спасти. Это всегда история только про тебя.\nСтранная это штука, во многом определившая мою жизнь. Это и отличает зависимых людей от независимых -\nв торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы. Остальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\nПо сравнению с настоящими наркоманами фактически я употребляла очень мало. Настолько, что я могу вспомнить каждый раз, количество, обстоятельства. Это были не такие длительные периоды, но каждый раз я встречалась со своим пределом. Когда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\nГоворят, что боль уходит.\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Были разы, дни между месяцами и годами чистоты. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается (или не случается) момент расщепления «я».\nЕсли случается, то ты случайно отделяешь себя от своего желания торчать.\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом. В шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо этого внутри меня стало постепенно оживать что-то. Интерес - вот самое лучшее чувство, за которым уже идет все остальное. Ты осуществляешь действие - видишь результат - радуешься. Я не радуюсь от того, что не является результатом моего труда. Такое у меня устройство. И вот когда я поняла это - я начала делать. Вернее не так, я делала и делала много до этого, но внутри была такая каша, что я не понимала, что именно это меня радует.\nТак я поняла, почему я люблю тренировки. Почему я люблю писать. Почему я люблю вести йогу - мне нравится действие, направленное на что-то хорошее. И дальше все это было уже как снежный ком. Ком, в сердцевине которого был зародившийся интерес к жизни, ко всему тому, что было мне непонятным.\nЯ обязательно напишу еще, и про свои рехабы, и про открытия в самоанализе, и про свои дефекты характера, и про то, как я училась и учусь по мааааленьким ступенькам поступать по-новому в рамках собственного безумия. Я буду писать, потому что гипотетически есть какой-то такой,\nпохожий на меня человек, которому мой опыт будет полезен. А я очень мало им делюсь, самым ценным и тяжелым - а надо бы, надо бы.\nАнастезии нет. Нет и всё. Ты просто начинаешь жить и однажды перестаешь задыхаться. И это невероятно похоже на тренировки - у тебя появляются силы так постепенно, что порой ты этого не замечаешь. Просто ты оглядываешься и понимаешь, что плывешь. Зависимость - это удивительная болезнь, которая может открыть такое зазеркалье твоей реальности, что слов не найдется, чтобы описать. Вот поэтому для меня наркотики - это такая вещь, мало кто поймет, если я скажу, что я благодарна за то, что это было в моей жизни.\nАнастезии нет. И ты все еще являешься собой во всей этой уязвимости. И жизнь все еще похожа на то, как будто ты идешь по канату, или куда-то бесконечно падаешь. Просто теперь уже точно нет никакой иллюзии, что ты можешь что-либо контролировать в этом глобальном процессе, поэтому тебе спокойно, и в процессе падения ты наконец-то можешь открыть глаза, оглядеться по сторонам и начать жить.\n"}, {"path": "data/lj_export_clean/posts_md/1310__тур_закончен.md", "source": "LiveJournal", "date": "Unknown", "filename": "1310__тур_закончен", "content": "# Тур закончен.\n*Date*: 22 декабря 2008, 20:52\n*URL*: https://olymarkes.livejournal.com/1310.html\n*Tags*: alai oli, гастроли, менеджер\n\n\"А тем, кто будет хвалить тебя - кидай в лицо землю, ибо это уничтожит тебя...\"  Из Корана.\n1. Ижевск\nКонцерт был нереальный. Я даже не знала, что нас могут так сильно любить. Паша говорил что стоял в зале, и видел как девочка рядом с ним улыбалась и плакала.\nБольше даже ничего не буду говорить.\n2. Ижевск-Ебург-Москва\nЯ вернулась, чтобы забрать тираж. Парни поех", "full_content": "# Тур закончен.\n*Date*: 22 декабря 2008, 20:52\n*URL*: https://olymarkes.livejournal.com/1310.html\n*Tags*: alai oli, гастроли, менеджер\n\n\"А тем, кто будет хвалить тебя - кидай в лицо землю, ибо это уничтожит тебя...\"  Из Корана.\n1. Ижевск\nКонцерт был нереальный. Я даже не знала, что нас могут так сильно любить. Паша говорил что стоял в зале, и видел как девочка рядом с ним улыбалась и плакала.\nБольше даже ничего не буду говорить.\n2. Ижевск-Ебург-Москва\nЯ вернулась, чтобы забрать тираж. Парни поехали в Москву.  Ощущение нереальности происходящиего догоняло меня каждую секунду. Усугублялось все это осознанием факта, что мир сошел с ума, а ведь я не пила алко и ничего не употребляла... После Ижевска пропал аппетит... На четвертый день без еды организм перешел на внутреннее питание. Мы с Пашей катались на сноуборде. Я была счастлива. Просто так.\nМосква. (парт1)\nВ Точке у нас ничего не работало. Никто не заметил и все говорили, что было круто. От расстройства Бро потерял аппетит почти на 5 часов. Мы волновались.\nДенег было мало. Я искала где бы нам пожить, давая объявления в своём статусе вконтакте. Готовила еду для парней, со специями и любовью. Две ночи были у Серёжи Соколовского из Точки Невозврата.\nПотом он приехал на вокзал, чтобы проводить нас в Питер... Он приехал, ещё приехал Ваня, который делал RML... Я  записала видеообращение для сайта. Обняла Серёжу под ругань проводницы, которая уже чуть ли не пинками загоняла меня в вагон. Поезд тронулся,  и надежда, что парни успеют на поезд растворилась...\n- Он тебе нравится... да...\n- Кто? - я посмотрела на Пашу, удивленно подняв брови\n- Этот. Рэпер.\n- С чего ты взял?\n- Я видел, как ты на него смотрела...\nЗа кулисами. Питер.\nВ общей сложности я не ела 13 дней (пять дней, потом поела и снова не ела 7 суток). Потом аппетит проснулся, и я стала уплетать за обе щеки всё, что мне попадалось под руку. Как раз перед первым концертом в Питере...  Вот это было счастье ) Самая вкусная вещь на свете - постный пирог в Бистро, там где выход из метро на Канал Грибоедова... Радость от пищи - совсем странная и забытая штука...\nБоже, храни менеджера. Этот волшебный человек позволил нам ровно 2 дня ощущать себя нормальными рок-звездами. Прямой эфир на Радио Рокс и три концерта подряд в самых хороших клубах Питера\nПосле концерта в МОДе мы вселились в огромную квартиру. Там был водяной матрас, джакузи, мягкие перины на царских лежбищах, ОЧЕНЬ высокие потолки и длинные коридоры, по которым ходили юные нимфы, подруги моих парней.\nВ этой квартире случился мой срыв на алко после почти 2х месяцев абсолютной трезвости. Мне было одиноко. Я сидела на балконе (он же - зимний садик). Поставила стул в самый тёмный угол и заплакала.\n- Что такое?  - наш менедежер тихо сел на стул на другом конце балкона\n- Знаешь, чо та я щас не в настроении разговаривать.\n- Для разговора такое настроение - самое подходящее...\nИ мы говорили. За окнами Питер никак не хотел окутывать улицы холодом, мир казался мне огромным и очень родным. Я всегда мечтала приехать в этот город вот так. Не чужой, никому не нужной человеко-единицей в потоке на невском, а Важной, Ожидаемой Козявкой. Долго раскачивалась... И самого главного мне уже не догнать. Средство стало целью, я позволила запудрить себе мозги и поверить в важность происходящего со мной относительно вечности. Бред...\nС огромным стаканом глинтвейна я ходила по огромной квартире, читала проникновенные и яростные (как казалось только мне) монологи...  Я пыталась докричаца... (чисто питерский синдром) Я мечтала о лекарстве от боли, но на меня смотрели и слушали меня с ...?? любопытсвом...? снисхождением...? в\nосхищением..? О, типа у Маркес творческие муки. Пакурям, Маркес!\nНа следующий день мы выступали в Грибоедове. Так вот он какой... Я ходила и думала: вот наверняла Филя сидел на этом стуле. Или открывал эту дверь, взявшись за эту ручку. \"Может быть его душа сейчас здесь и слушает меня?\" - думала я, и пропускала начала куплетов... В любом случае, главного уже не догнать, но хоть что то я успела.\nПочти каждый день мы ездили в больницу к Артёму Щекалёву.\nКогда Артём злица на кого-нибудь, с тем человеком случается что-то плохое. В этот раз Артём зачем-то злился на себя...\nНе делай так больше, понял?! Лучше на меня. Хоть повод будет спасать меня... . Помнишь, как это весело?\nЕщё в Питере мне подарили несколько важных подарков. Спасибо за них. Я ценю подарки. Последнюю ночь провели в квартире у менеджера с его братом Мишей и Айваном из Грассхопперс. Боже, храни их, они святые! ))) Я редко так говорю, но так же скажет любой из группы Alai OLi\nМосква. (парт2)\nЭфир на О2 был неплох, только ведущий задавал глупые вопросы. Из серии \"Как ты их моешь.\" Еще были дебаты на тему \"Реггей в России\".... Я вот думаю: да ну всё это. Правдоборцев и хранителей канонов культуры раста и любителей настоящего реггей начинает тошнить от одного названия группы ( ALAI OLI! ALAI OLI! ALAI OLI! стошнило?\nнет? значит вы не ортодоксальный растафарианец!), и мне даже не надо вычитывать это на малочисленных реггей-форумах. Я это и так знаю.  Мало того, мы предвидели эту ситуацию еще тогда, когда всем было насрать на нас и наше неправильное реггей.\nИ если честно, мне даже немного странно что все это VOOBSHE NE PARYT.... Когда то я была очень идейной и гордой, как Искра Полякова из повести \"Завтра Была Война\". Я думала, что все вокруг должны быть честными, сильными, дружными и самоотверженными и прежде всего этими качествами должны обладать раста. Потом я поняла, что никто никому ничего не должен.  Я требовала от людей и от себя высокой нравственности, мучала их, страдала сама, не принимая что человек- это человек. Не Ангел и не Пророк.  Мы все одинаковое дерьмо. Мы все одинаково прекрасны.\nЕсть я. Есть мой путь.  Я иду по нему. Я делаю своё дело. Падаю, обдираю коленки. Жру землю. Взлетаю в небо. Мне не нужно ничье одобрение. Ни в музыке, ни в том, как я живу. Я себе - главный судья и палач. Проблема развития реггей в России? Извините, у меня есть проблемы посерьёзнее.\nЭто лирическое отступление было не для тех, кто обвиняет меня. Для тех кто защищает. Спасибо вам, но не тратьте больше силы на споры.... На моей планете если и есть война, то уж точно не по поводу музыки и Alai Oli в целом.\nREGGAE MUSIC LIFE клуб Табула Раса\n.\nКогда мы начали петь Ману Чао, я не понимала, попадаю ли я в ноты хоть приблизительно. Люди в зале пели так громко, что я не слышала не то что себя из мониторов, я вообще слышала только зал... Я была счастлива и обескуражена. На новой песне мне на сцену передавали бумажных журавликов, ещё цветы, и даже 1 галстук и одну шапку...\nСумашедшая энергетика. Откуда они знали все слова? откуда? Откуда? Ведь даже парни из моей группы не знают всё... А тут люди пели и первый, и второй альбом. .. Знаете, а ведь текстов нет напечатанных. Все они - в моей голове... И на записях в песнях.\nПосле концерта мы разорили блинную Теремок на красной площади. Слова \"блин с творогом\" считаются ругательными. Нам было так весело, что мы ржали и давились блинами, не стесняясь )) Ещё бы - барство! Корпоратив на 4000р в месте, где самое дорогое блюдо стоит 120 р ))))\nПотом мы пошли в кофейню, где торчали до утра и читали рэп про наше музыкальное будущее. Было очень хорошо, пока в пустынный зал не вкатилась(лся) трансвестит Галя Брежнева. Он(а) бы точно кого-нибудь трахнул(а), если бы не наш менеджер.\nСмотрю на менеджера и плачу от радости - он даже сам не знает, какой он офигенный чел. Надеюсь когда узнает - не испортица, как Бро в свое время )) (СЛЫШИШЬ, БРО? ПАФОСНАЯ ЗАДНИЦА!\nВОТ В 9ом КЛАССЕ ТЫ БЫЛ СКРОМНЕЕ! ХА!  ))) А в плане работы - я просто сейчас буду дышать свободно. Я устала быть нянькой, огранизатором и администратором. Это приятные хлопоты,  но силы мои не бесконечны.\nЕкатеринбург.\nДома хорошо. Мы прилетели в день концерта в PV. На входе Ксюша и Ника (Спид-центр) раздавали значки с моим лицом. (что бы подумали вы, увидив свое лицо на значке?) Ещё я потеряла сиреневую шапку бёртон. Это значит вечеринка удалась.... Клуб был забит... Я завороженно слушала, как читает Маэстро из Ворнер Бразерс и носила ему Бэйлис, который покупала за свой кэш. Попробовала - понравилось... Потом Словиковский сказал, что в баре я могу пить бесплатно. Пить, почему то, сразу расхотелось.\nВсю неделю я занималась йогой, спортом, обжорством, пьянством и учебой. Бессонница. И ещё сколько алкоголя выпьешь - опьянения никакого... странно и страшно.\nОмск.\nВ поезде мне не спалось. У титана я читала книжку, потом ко мне подошел реально какой-то гуру. Я много умных людей знаю, начитаных, просветленных, но такого я ещё не встречала. Завороженная, болтала с ним часа два. Подарила один из ключей с подвески на шее...  За несколько дней до этого я говорила Юле: \"Хочу, чтобы мне погадали по руке...\"\nОн предложил сам.\n- У тебя ведь нет парня... ничего серьезного вобщем\n-  Да, - улыбаюсь я, а про себя думаю: \"про меня иначе как \"всесложно\" и не скажешь\"\n- И не будет. И детей тоже. И тебя это не парит, так ведь? Все дело в том, что ты - воин... У тебя другой путь.\nНе знал он, ведь не знал что в голове у Оли уже несколько недель крутятся строчки:\nВоин - это не ОН и не ОНА.\nЯ воин, и если начнется война\nТакие как я побегут на поле боя,\nНа поле боя нет смысла называть имена...\nи (....) садится со мной рядом\nи (...) берет меня за руку\n\"Никто не знает, как ты устала\nНо только на сегодня я стану твоим другом\nА завтра если хочешь - пройдёмся по кругу.\nИ засни с кем угодно - один х.й, проснёшья одна!\"\nОткрываю глаза. Что на мне: Рога или крылья?\nсветлой притворяется каждая сторона.\nУкрепившись в своей позиции я легла спать. Концерт в Омске прошел отлично. Оба концерта.\nПоследние концерты этого года.\nПоследние концерты в рамках тура.\nСколько нужно времени и сил чтобы рассказать обо всем, что происходило со мной и с нами? Я вам скажу, гораздо меньше, чем ответить на 200 сообщений вконтакте. Пойду-ка займусь ими.\nЗавтра или послезавтра в Москву.\n"}, {"path": "data/lj_export_clean/posts_md/84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм.md", "source": "LiveJournal", "date": "Unknown", "filename": "84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм", "content": "# почему надо выходить замуж за бандитов а не за свою космическую любовь (или письмо лизе сидориной)\n*Date*: 17 ноября 2017, 02:23\n*URL*: https://olymarkes.livejournal.com/84723.html\n*Tags*: #000000\n\nСидорина спрашивает меня: почему. И вот пока я лечу от Москвы до Питера у меня есть немного времени.. Постараюсь тебе объяснить, Лизочек.\nКосмическая любовь - она для космоса. Она для вдохновения, для новых песен, для того, чтобы чувствовать всю глубину, силу и боль бытия. «Это все понятно» - скажеш", "full_content": "# почему надо выходить замуж за бандитов а не за свою космическую любовь (или письмо лизе сидориной)\n*Date*: 17 ноября 2017, 02:23\n*URL*: https://olymarkes.livejournal.com/84723.html\n*Tags*: #000000\n\nСидорина спрашивает меня: почему. И вот пока я лечу от Москвы до Питера у меня есть немного времени.. Постараюсь тебе объяснить, Лизочек.\nКосмическая любовь - она для космоса. Она для вдохновения, для новых песен, для того, чтобы чувствовать всю глубину, силу и боль бытия. «Это все понятно» - скажешь ты, и будешь абсолютно права. Но есть еще кое-что. Мне кажется, что она не совместима с жизнью. Не совместима с реальностью, с грубым миром, с твердым миром, с миром вещей, всех остальных людей, миром жэка, паспортного стола, налоговой, мудака соседа, который делает ремонт после 23:00, психа, который следит за тобой и пишет всем твоим и прочего вполне себе некосмического дерьма. А если она совместима - то это уже не космическая любовь, а вполне земная. Я даже думаю так - космическая любовь несовместима с сексом. Потому что секс - это очень земная штука, а наше тонкое тело - не очень. И можно, конечно, все совмещать, но на практике и по факту это мало кому удается, особенно в долгосрочной перспективе.\nЧто касается бандитов. Ты тут спросила меня про Сергея Бодрова, типа не мой ли это гипотетический идеал. А я в этот момент как раз пялилась в глаза Марка Рентона, нарисованного Гордеем, и сказала тебе: «Слушай, ну Сергей все равно был творческим человеком.. А вот Данила Багров - это тот самый типаж». Потому что сложно найти что-то более привлекательное, чем простой парень, который умеет обращаться с оружием и решать вопросы с людьми, сильнее, богаче и влиятельнее. Нет ничего круче характера, который проявляется в реальных делах в этом, твердом мире. Ну что я тебе рассказываю? У меня были и творческие, и космические, но когда дело доходило до каких-то реальных вопросов, где надо было врубить мужскую ответственность, врубалась она быстрее у меня.\nА еще говорят, что это я такая типа телка с яйцами, которая не может играть фэйр плэй. Да нифига, я много могу сама, но не все. И я очень беззащитна во многих вопросах, и иногда хочу на ручки и ничего не хочу решать. Пусть мой мужчина разбирается. И с одной стороны очень дисциплинирует и воспитывает, когда ты все сама, все сама, а твоя космическая любовь только дарит тебе глубину бытия, наполняя тебя силами для всех твоих свершений. Но вот нихуяшечки я не считаю это идеальным раскладом.\nНу и про Рэнтбоя теперь, почему я питаю к нему такую нежность. Его круто рассматривать в контексте остальных персонажей, и только тогда можно увидеть все оттенки - боюсь описать у меня получится крайне топорно, но надеюсь суть ты поймешь. Во-первых зависимость - это с одной только стороны чума и проклятие. Зависимый человек - это система, которая работает определенным образом. И являясь сама зависимым человеком, я всегда предпочту totally addictive\nчеловеку, который может контролировать свою жизнь. Любой контроль - это всего лишь иллюзия, и большинство людей сидят в ней по уши. Зависимый человек знает, что он бессилен. И 12 шагах принять бессилие - это самый первый шаг. Большинство людей никогда не сделают его, и мне их даже отчасти жаль по этому поводу. Рэнтбой - он абсолютно бессилен, и так в этом невероятно мил.\nИ если смотреть постфактум\n- не было плохих периодов, все придумано для чего-то. Когда ты на системе, все в мире относительно. Это даже чем-то похоже на триатлон, только в торче никто не оценит твоих ежедневных подвигов, ибо совершаешь ты их во имя зла, самоуничтожения и тотального деструктива. Но! Ты их все-таки совершаешь, и навыки остаются, и мышление, и границы возможного. Этика как раз таки всегда заложена в характер - и тут у Рэнтбоя как раз все в порядке, с этим. Торчать можно по-разному, и у каждого свое дно. Ну и вообще у большинства людей в моем окружении все в порядке с жизненными принципами, это чтобы ты не думала что абсолютно все бывшие торчки - хорошие. В трезвости зависимые люди тоже бывают редкостными мудаками, и в торче бывают люди хорошие, так что это я не про всех.. Про отдельных людей скорее.\nТак вот, такие люди привыкли надеятся только на себя, но кстати параллельно могут решить и твои вопросы, если ты будешь нуждаться в помощи. Ну и что касается всего остального - помнишь, как Данила Багров вытаскивал эту рашн проститьют Мэрелин? Вот как-то так надо, чтобы человек относился ко всем, кто слабее его. А не только к самым родным. Мужчина чувствует, что если не он - то никто. И просто делает. И знаешь, на самом деле мир полон таких мужчин - только мы с тобой телочки из творческой среды, и как раз здесь их остро не хватает.\nВ детстве моими героями были Робин Гуд и Д’артаньян, со временем в эту историю добавилось много чего еще, начиная от двух высших заканчивая умением делать инъекции, пиздить людей голыми руками и метко стрелять от бедра. Сочетание силы и бессилия, преобладание реального над космическим, но при этом - духовность, основанная на встроенных аспектах характера. То есть не напускная и вышколенная доброта, учтивость и бла бла, а что-то такое, чего человек сам в себе не видит и не осознает, но оно присутствует и очевидно всем окружающим.\nНу и в конце этой истории надо отдать дань и космической любви тоже. Love is not a crime. Преступление - это каждой своей космической любви стараться придать земную форму, пытаясь убить сразу двух зайцев. Помнишь фильм, который мы смотрели сегодня? Так вот, я думаю что эта брюнетка была права: «You totally fucked up, Margo» - потому что все границы только в нашей голове, и они лишают нас счастья чувствовать сразу все: мы разрешаем себе только одну форму любви - вытекающую в обладание. Хотя есть и другие способы. Стоять, и ничего не трогать… В моей жизни были такие встречи, такие люди - и самым чистым образом, через абсолютную, божественную любовь они дотрагивались до моего сердца. И знаешь, я потом уже поняла - люди разные, а космос - он один. И когда мне что-то попадает в сердце, я преклоняю колено перед Богом, а не перед человеком, через которого он мне является. Потому что если опуститься на колени через человеком, вряд ли он будет вести себя корректно - скорее всего, он офигеет от такой чести -\nи будет прав. Нечего путать понятия, моросить и все такое. Любить космос и любить человека - это все таки разные понятия. И вот когда ты встретишь человека и полюбишь в нем человеческое - ты поймешь, о чем я говорила. И, кстати, ему не обязательно быть бандитом. Это я вообще пошутила, если что)\np.s.\nхочу запомнить эту неделю, когда мы ложились в 5 утра, как будто нам всем по 19 - сводили песни, монтировали клипы, смотрели фильмы с Бодровым, пили чай и выбирались из дома только в сааааааааамой крайней необходимости: в кафе через дорогу, на съемку, на студию, на концерт, в перекресток за… ну, короче.\nесли жизнь проходит, то в эту секунду я чувствую, что проходит она правильно. я вижу внизу огни Питера, за сим заканчиваю свое письмо, и до встречи завтра\n"}, {"path": "data/lj_export_clean/posts_md/36262__всё_началось_с_диплома.md", "source": "LiveJournal", "date": "Unknown", "filename": "36262__всё_началось_с_диплома", "content": "# Всё началось с диплома.\n*Date*: 23 января 2010, 15:00\n*URL*: https://olymarkes.livejournal.com/36262.html\n\nЯ вообще не хотела его забирать – меня всегда тошнило от бюрократии и бумажной тягомотины, и Обходной Лист казался мне невыполнимой миссией. Однако, вчера утром я встала с настроем на великие дела.\nУниверситет прекрасен. Я люблю его от первой ступеньки до самого чердака,  я всегда мечтала учиться здесь. Ешё когда я была школьницей, я приходила ночью к крыльцу главного здания и шептала (ил", "full_content": "# Всё началось с диплома.\n*Date*: 23 января 2010, 15:00\n*URL*: https://olymarkes.livejournal.com/36262.html\n\nЯ вообще не хотела его забирать – меня всегда тошнило от бюрократии и бумажной тягомотины, и Обходной Лист казался мне невыполнимой миссией. Однако, вчера утром я встала с настроем на великие дела.\nУниверситет прекрасен. Я люблю его от первой ступеньки до самого чердака,  я всегда мечтала учиться здесь. Ешё когда я была школьницей, я приходила ночью к крыльцу главного здания и шептала (или кричала – в зависимости от состояния) :  «Я буду здесь учиться! Я буду здесь учиться! Я буду здесь учиться!».\nЭто была миссия не из легких – в школе я была троечницей и прогульщицей, курила, пила и употребляла наркотики. Однажды папа сказал мне: «Если ты не поступишь на бюджет – ты не будешь учиться. Я не буду платить за тебя». И это было справедливо. Я хотела быть интеллигентным торчком, а не представителем социального дна без надежды на будущее, так что пришлось поднапрячься.\nВ своей жизни я сделала четыре по-настоящему крутые вещи:\n1, 2  - два наших альбома  - любой музыкант скажет, что довести это дело до конца без помощи продюсеров и т.п. – невероятно сложно.\n3 – я научилась прыгать нормальный такой бани-хоп на bmx’e.\n4 – я поступила на Журфак УрГУ на бюджет.\nОоо… Это было адски сложно для меня – пол года сидеть дома и зубрить русский язык и историю отечества, и все это – в полной уверенности что я гораздо хуже каждого своего конкурента – претендента на бюджетное место.\nКроме того, я писала статьи во ВСЕ возможные журналы и газеты, и к началу экзаменов у меня собралась внушительная пачка материалов, причем большинство из них были почти что Гонзо – особенно статьи для обожаемого мною в то время «Хулигана».\nПомню, как я гордилась и радовалась, когда из Москвы мне присылали гонорар переводом…\nВообще, мое поступление – особая история, будет время – я расскажу все в красках.\nЗа время обучения в универе со мной случалось много приятных и неприятных событий – начиная от судимости, из-за которой меня чуть не выпнули со второго курса, заканчивая моей прошлогодней поездкой в Гоа прямо во время финальной сессии.\nВсе пять лет я проводила очень много времени в разъездах, творческих муках и не всегда в здравом уме. Меня колбасило так, что сложно было понять – как вообще я умудряюсь учится, сдавать сессии и писать работы. Дело в том, что у меня было два мега-бонуса: моя любимая бабушка (она сама выпускница журфака), она очень помогала мне.\nНу, и волшебные преподаватели журфака. Творческие, неординарные, волшебные люди. По-своему сумасшедшие, всегда молодые в душе,  каждый – уникален. Каждый – одно огромное сердце.\n- До свидания, Оля. Удачи тебе. – глаза зам. декана Татьяны Алексеевны такие тёплые, такая искренняя улыбка. Мне становится так… так…\nОни всегда шли мне на встречу. Всегда ободряли меня, поддерживали.\n- Подари диск! – сам просил Лозовский – наш обожествляемый декан.  И для меня это было так важно.\nИ вот, диплом в моих руках. Синенькая корочка, листок с приложением. Я – дипломированный специалист. Вчера в клубе Дима Колезев, звезда уральской журналистики и действующий препод журфака, говорил мне:\n- Ты – мотивирующий фактор для молодых журналистов. Они любят твою музыку, они учатся там, где училась ты. Для них это важно.\nДа, я горжусь этим дипломом. Да. Это важно.\n- Оля, я хочу чтобы для тебя этот диплом был символом того, что ты умеешь доводить до конца то, что начинаешь. – сказал мне папа вечером.\nПрямо сердце щемит, эх.. я такая сентиментальная.\n"}, {"path": "data/lj_export_clean/posts_md/81864__изнанка.md", "source": "LiveJournal", "date": "Unknown", "filename": "81864__изнанка", "content": "# изнанка\n*Date*: 28 апреля 2017, 00:33\n*URL*: https://olymarkes.livejournal.com/81864.html\n*Tags*: #000000\n\nПосле концерта ты выходишь из светящегося моря в такой контрастный коридор. Этот запах и цвет бэкстейджа ни с чем не спутаешь - какая-то смесь пива и еще чего-то.. Клуб, его самая не-парадная часть. Изнанка. Ты идешь по такому коридору, в котором очень мало парадного, в нем вообще ничего нет, что можно было бы пожелать. И я иду по нему с мыслью, насколько это все символично. Люди не видят", "full_content": "# изнанка\n*Date*: 28 апреля 2017, 00:33\n*URL*: https://olymarkes.livejournal.com/81864.html\n*Tags*: #000000\n\nПосле концерта ты выходишь из светящегося моря в такой контрастный коридор. Этот запах и цвет бэкстейджа ни с чем не спутаешь - какая-то смесь пива и еще чего-то.. Клуб, его самая не-парадная часть. Изнанка. Ты идешь по такому коридору, в котором очень мало парадного, в нем вообще ничего нет, что можно было бы пожелать. И я иду по нему с мыслью, насколько это все символично. Люди не видят изнанку, а мы в ней живем.\nМомент встречи - это момент истины, момент соединения времен и судеб, воспоминаний и настоящего момента. Ты встречаешься со всем, что когда-либо было важно для тебя. Концерт - это rush, а все остальное - это мутки и отходняки. Это жизнь;  Но ради этого взрыва ты продолжаешь делать очень много, потому что… Просто потому что.\nЗа сценой происходит очень важная часть шоу - и это я сейчас про Москву и Питер. Ко мне приходят важные для меня люди и создают особенную атмосферу. Юля и Света все в мерче стоят на мерче, Маша красит, парни заходят поздороваться, Лиза громко смеется - значит все на своих местах. Кто-то приходит познакомиться, сектанты тоже тут - обязательно.. И такая приятная суета. Мне не нужно в ней сосредотачиваться. Я хочу в ней раствориться.\nЭти райдерные бутерброды - господи, этот стол с едой -как еще один член группы - повсюду, в любом городе, один и тот же состав. С радостью съедаю один бутер на черном хлебе и пару помидорок черри, остальное - для парней, но никто никогда не съедает это все полностью, и вот этот стол с райдером - это просто бич)) Просто для того, чтобы вы представили себе полностью картинку. Мест, чтобы сидеть, редко бывает достаточно. Из развлечений - разговаривать, ржать, втыкать в телефон. Так выглядят музыканты перед выходом на сцену (если они, как мы, не бухают).\nНо вот время выходить на сцену - здесь, конечно, все собирается в одну точку внимания. И ты выходишь и живешь - даже не на сцене, а в сердце своих эмоций, в своей душе, которая может страдать, а может купаться в радотсти. Мне нравятся отношения в группе - я отношусь с любовью и уважением ко всем: к каждому музыканту и технику. Именно поэтому меня очень много - я со всеми едина, и я под защитой всех этих прекрасных парней. Я очень счастлива, что они за моей спиной и за пультом в зале. И сегодня у всех все получается: я не думаю о звуке, все хорошо;\nМы играем песни, которые не играли сто лет - и я счастлива. Нам понадобилось два года, чтобы выучить и старенькое - и сейчас мы можем снова играть все-все-все, что попадает в настроение. Ну не все… Осталось еще процентов 30. Пусть все постепенно укладывается.\nПесни эти, которые мы поем сегодня,  - это основа, и начало начал. Я писала их, когда вообще не было никакой «публики», и поэтому это самый чистый месседж. Нет адресата, никто не будет оценивать. Можно просто быть собой.\nМногие из этих песен я писала для Фили, и конечно я знала, что совершенно не важно - услышит ли он их. Любовь - это всегда история одного человека. У меня была такая любовь к нему, да и есть до сих пор, которая не про отношения, и даже не про общение. Это про такой мощный заряд, который ты получаешь в самое сердце - и ты начинаешь дышать. Ты понимаешь, что не жил до этого. Когда мы встретились - я начала дышать, и дышу до сих пор, ощущая его душу во всем, что я делаю. И конечно, все эти песни - они до сих пор живы, как живо то чувство. Я до сих пор могу писать и обращаться к нему - это неиссякаемый источник любви.\n«Я пересекаю моря, океаны, горы, чтобы пройти мимо тебя, опустив голову» - ничто лучше не опишет моей любви. Когда ты просто в другой плоскости чувствуешь, где материальное не может выразить - даже взгляд… После того, как я начала дышать, все наши встречи заканчивались очень быстро. Я могла выдавить из себя несколько слов, и убегала, и пряталась, стараясь не увидеть.. Конечно он не знал, как важно было для меня, что мы выступаем на одной сцене. Последний раз подарила ему диск «Барселоны», но продолжаю до сих пор дарить ему каждую из этих песен… Много лет его уже нет, но не для меня. «Люди идут, и машины едут мимо, будто ничего не случилось. Если тебя бы не стало - жизнь бы просто остановилась».\nВ моей внутренней вселенной это - целая галактика. Но есть и другие. Гордей принес мне РентБоя, Марка, в котором тоже так много для меня. Конечно, это символ - и уверена, для меня это что-то совершенно свое. Свое, как причина, по которой каждый из наркоманов убивает себя. Реально, зависимость - одна, но природа - она отличается. Считаю, что мне повезло побыть во всех ролях. Я была Рентоном, и конечно, была его телочкой. И эти роли всегда живы, как trainspotting на паузе. Мне это нравится. Я всегда болтаю ногами над пропастью, и это помогает мне быть свободной в настоящем. Я не выбираю жизнь, я выбираю что-то еще. Я во всем этом «еще» так глубоко, что времени на жизнь просто не остается. Вся моя ответственность, вся моя вселенная крутится, как мяч на пальце. И я ни на секунду не забываю, кто я на самом деле. И это вообще абсолютно нормально - особенно, если другие тоже в курсе.\nПоэтому все мои песни, бэйб, они по большей части об этих двух сторонах внутренней реальности. Потому что все или о любви, или о бездне, над которой я зависаю. Ну и еще о дружбе.\nДружба - это сложная штука. Мне нужно еще лет 10, чтобы понять, что это такое. Но о ней я тоже пою.\nЭтот концерт - он был таким п;здатым, конечно - все эти сюрпризы, они так оживляют меня. Мы готовимся и вы, вы с изнанки тоже готовитесь к нашей встрече. Это уже не потребительство, это уже обмен самый настоящий и равноценный - я чувствую, что я получила не меньше, чем отдала. И эти мелочи играют роль.\nРаньше я выходила со сцены и брала в руки телефон, чтобы посмотреть: как это было?! Какие фотки? Какие отзывы? Парни сидят в гримерке и сразу читают. Я… Я не беру телефон еще долго, наслаждаюсь послевкусием. Наслаждаюсь воспоминанием, чувствами; Они не только о концерте, они обо всем: о пути, прежде всего. Когда ты далеко-далеко уже от начала пути - ты видишь его весь. А раньше видел гораздо меньше. Чем больше ты видишь - тем больше твоя вселенная внутри.\nНичто не умирает. Все множится, становится глубже, лучше, полноценнее, светлее.. Так я вижу мир. Такой у меня складывается паззл.\nКонечно, еще хочется написать много чувств после концерта Jane Air, но я забыла пароль от Дурге. А еще - завтра у меня 5 лет трезвости. 5 удивительных лет, которые начались однажды с большого взрыва, из которого получился.…\nНо об этом, конечно, не в этот раз.\nПс. Кристина твои фотки рассказывают все лучше, чем я. Вот как ты так))\n"}, {"path": "data/lj_export_clean/posts_md/71763__sattamasssssssssssagana_1_журавлики.md", "source": "LiveJournal", "date": "Unknown", "filename": "71763__sattamasssssssssssagana_1_журавлики", "content": "# SattaMasssssssssssagana. 1. Журавлики\n*Date*: 22 сентября 2011, 19:01\n*URL*: https://olymarkes.livejournal.com/71763.html\n\nВчера мы снимали клип на песню «Журавлики».  Это – единственная песня, которую я написала в объебашеном наркотой состоянии. И эта песня войдет в новый альбом.\nМы с Юлей тогда жили на Фрунзе, в квартире с оранжевыми стенами и видом на весь город. Я сидела на балконе, вцепившись в гитару. Пальцы не гнулись, и я просто зажимала аккорд за аккордом, а музыка и слова играли у ме", "full_content": "# SattaMasssssssssssagana. 1. Журавлики\n*Date*: 22 сентября 2011, 19:01\n*URL*: https://olymarkes.livejournal.com/71763.html\n\nВчера мы снимали клип на песню «Журавлики».  Это – единственная песня, которую я написала в объебашеном наркотой состоянии. И эта песня войдет в новый альбом.\nМы с Юлей тогда жили на Фрунзе, в квартире с оранжевыми стенами и видом на весь город. Я сидела на балконе, вцепившись в гитару. Пальцы не гнулись, и я просто зажимала аккорд за аккордом, а музыка и слова играли у меня в голове   - и меня пиздец разрывало, я написала миллиард куплетов и там была тысяча строк – и я не могла выбрать… все было так,
