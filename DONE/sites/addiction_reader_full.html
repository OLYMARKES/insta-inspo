\nНадеюсь лень пройдет и я снова буду писать нормально )\nВот тут всякое смешное видео можете посмотреть:\nhttp://www.youtube.com/user/olymarkes\n"}, {"path": "data/lj_export_clean/posts_md/61871__разве_есть.md", "source": "LiveJournal", "date": "Unknown", "filename": "61871__разве_есть", "content": "# разве есть...\n*Date*: 26 августа 2010, 04:17\n*URL*: https://olymarkes.livejournal.com/61871.html\n\n... я на самом деле?\n- По Вознесенскому проспекту вверх. На Большой Морской - направо.\nНапротив Исаакиевского собора почти это место - Союз Композиторов. Я чуть не попрощалась с остатками рассудка за эти три студийных дня.\n\".. кому нужна эта преданность\" - пишет и старается быть со мной сволочью. А я так устала, что даже это не цепляет меня. Но будет день и будут силы.\nМы курим кальян за белыми за", "full_content": "# разве есть...\n*Date*: 26 августа 2010, 04:17\n*URL*: https://olymarkes.livejournal.com/61871.html\n\n... я на самом деле?\n- По Вознесенскому проспекту вверх. На Большой Морской - направо.\nНапротив Исаакиевского собора почти это место - Союз Композиторов. Я чуть не попрощалась с остатками рассудка за эти три студийных дня.\n\".. кому нужна эта преданность\" - пишет и старается быть со мной сволочью. А я так устала, что даже это не цепляет меня. Но будет день и будут силы.\nМы курим кальян за белыми занавесками летней веранды. Невский 53, на столе ее белый ноутбук ,\nочки RayBan или что-то вроде. И я хочу спросить:\n- Если ты бы знала, что это последний день ваш..вместе. Что бы ты сказала ему тогда? Что бы ты сделала, зная, что есть еще шанс все исправить?\nНо в этот момент машины трогаются с ближайшего перекрестка, и шумом заглушают этот шепот. Дима играет на гитаре мою любимую тему, сидя на спинке кожаного дивана. Вдох - и этот delay из комбика, мягкий и глубокий звук. Его подхватывает ветер, и новый порыв срывает крупные капли с неба.\nЛивень. И красивые люди бегут по Невскому мимо нас. Они бегут, а капли разбиваются о тротуары. И огни разливаются в лужах. А мы сидим в центре вселенной, в центре города, в центре собственных судеб. Музыка окутывает меня и мир вокруг, как выпущенное его пальцами заклинание  - через железные струны и провода, через мембраны динамиков - здесь и сейчас наша музыка рождается и умирает каждую секунду снова и снова, уступая пространство тишине. И не жаль ее, ведь будет новая.\nЯ хочу спросить ее: \"Если бы ты знала...\", а вместо этого говорю:\n- Не знаю что там завтра.. Но мы каждый день жили как последний - отчаянно, без страха и совести. И каждый день прощались, как будто навсегда.\n- и к чему это...?\nкаждый.день.мы.прощаемся. - и это все моя вина, и поэтому я слышу вечерами шепот \"не спи, оля не спи не спи\".\nведь где бы я не проснулась завтра - я проснусь одна. за окнами будет шуметь море:  \"я не люблю никого, я даже не представляю, как это...\"   - этот голос внутри давно перестал быть чужим.\nУтро -  значит пора открыть глаза и ощупать реальность: есть ли я? я ли я? Безумие не так страшно ночью, как при свете дня.  Безумие не так страшно, если о нем писать.\nfotos by\nyellow_krolik\nп.с. Наташ я ее не заставляю, она сама бегает... но ты все равно приезжай. ))\n"}, {"path": "data/lj_export_clean/posts_md/85298__осторожно_текст.md", "source": "LiveJournal", "date": "Unknown", "filename": "85298__осторожно_текст", "content": "# осторожно, текст\n*Date*: 18 декабря 2017, 01:49\n*URL*: https://olymarkes.livejournal.com/85298.html\n\n\"Нет сил писать, но надо\nхроники внутреннего ада\"\n2012,04\nНу ладно. - говорю я, - ладно, ладно.   Я готова открыть этот сундук. Первый раз за столько лет я наконец-то готова посмотреть, что там лежит.\nЭто было больно. Это было действительно больно. Прелесть бытия в 30 лет это то, что ты уже успел прожить несколько циклов всех возможных пиздецов, и когда что-то случается с тобой, ты можешь стрях", "full_content": "# осторожно, текст\n*Date*: 18 декабря 2017, 01:49\n*URL*: https://olymarkes.livejournal.com/85298.html\n\n\"Нет сил писать, но надо\nхроники внутреннего ада\"\n2012,04\nНу ладно. - говорю я, - ладно, ладно.   Я готова открыть этот сундук. Первый раз за столько лет я наконец-то готова посмотреть, что там лежит.\nЭто было больно. Это было действительно больно. Прелесть бытия в 30 лет это то, что ты уже успел прожить несколько циклов всех возможных пиздецов, и когда что-то случается с тобой, ты можешь стряхнуть пыль с архивных папок и посмотреть, как это было в прошлый раз, в позапрошлый раз и в позапозапрошлый. И пиздец больше не кажется таким уж уникальным.\nНу что пиздец? Что пиздец? Да не пиздец это вовсе. Вот сижу в аэропорту, в голубой шапке с розовой хуйнюшкой, положила на красивого мальчика ногу, ноутбук тут же, пишу. Перечитываю Дурге. Это конечно не литературный шедевр, но настолько наполненная болью емкость, что текст вполне может считаться терапевтическим. Что там было?\nУ меня был друг, которого я любила. Отношения с ним были невозможны, потому что мы были как будто двух разных видов, и я сама толком не могла объяснить, как все работало. Для абсолютного счастья мне нужно было от него какое-то космическое уважение, особенное место для меня, чтобы оно было выше одной только женской позиции в системе координат. Мне не нужны были верность, забота, защита - я могла позаботиться о себе сама, я все могла сделать сама, если только дать мне те силы, ключ к которым хранился у него. Мне хотелось быть где-то вне этой системы отношений в реальности, но быть очень близко к нему и в то же время высоко. Рядом с ним я чувствовала космос внутри себя, и дело было реально не в нём, не в человеке, а в том, как я чувствовала себя рядом с ним. Нам нечем было заняться вместе, не о чем поговорить, можно сказать, что я чувствовала себя в его обществе неуютно. С первой нашей встречи я думала - Блин, какая-то это херня. Но.. Опять же с первой нашей встречи, когда он обнял меня, это был чистый торч. Он обнимал меня, и все исчезало: весь этот мир, полный интересных и важных для меня дел и вещей начинал лагать, как матрица. Он обнимал меня, и мне открывалась дверь в другой мир, такой родной и знакомый. Мир, откуда я родом, где все мне известно -  и на самом деле я всегда жила там и только там, а все остальное - это лишь слова, вещи и майя. Они такие несущественные, что мне просто незачем туда возвращаться.\nКакие есть плюсы у такого состояния? Ты попадаешь в лимб. Ты подключен к источнику, который прокачивает золотой свет через реальность, и все детали и образы наливаются этим светом. Там я написала «Долбанный космос», «Главное», «Искры», «Снафф».\nДолбанный космос - это про наши вечные параллельные туры. Мне так спокойно и хорошо, я могу не видеться с тобой вечность, ты в дороге и ты пишешь мне, что скучаешь - и каждый мой концерт дышит этой любовью, я беру ее, преумножаю и отдаю, и пока это искрится во мне, я готова написать лучшие песни в своей жизни. Ты не нужен мне, как человек, но мне нужна эта сила, чтобы жить и делать счастливыми всех этих людей, чьи глаза я вижу со сцены.\nТы научил меня любить музыку, ты показал мне другую сторону всего этого - как мне было кайфово просто лежать на кровати и смотреть, как ты пишешь ее, как рождается эта глубина. Я всегда делала это через слова, а ты - через музыку. И я видела, что мы так похожи с изнанки.. Там темнота и звезды. Одно безграничное черное звездное небо на двоих.\nВ то время у меня было слишком много ролей, мне нужно было доказывать себе, что мне похуй, доказывать тебе, что мне похуй, всем вокруг - что я все контролирую. Я слишком мало говорила правды о своих чувствах, потому что мне сложно было объяснить их словами, сложно было упаковать это в социально-приемлемую форму, ведь там еще были дела, слова, поступки - и все это было как-то не так, все это доставляло мне страшное неудобство и адскую боль. Соприкосновение космического чувства и реальности разрывало меня на части, потому что помимо души я все таки была личностью, и мне всё таки нужен был полный спектр всего на свете. Я доказывала себе и всем вокруг, что я такая пиздец самостоятельная и самодостаточная, и что я могу брать нужную мне любовь у разных людей, один будет обо мне заботиться в реальном мире, другой - обожать на расстоянии, третий - да какая там разница, есть ведь еще мои святые друзья, и мои близкие - например те, кто читает Du, вот им-то можно сказать всю правду, и вроде как бы есть одна реальность, но она разбита на множество осколков.\n«И так я разложу весь мир на спектры, и все сойдется» - думала я. Но нет. Ничего не сошлось, и в итоге все остались, а я умерла от той боли, которую сложно измерить и вынести в этот реальный мир. Нет того человека, которым я была, есть какой-то другой.\nНо давайте вернемся к космосу. Я скажу, как правильно читать. Да, там очень много - людям. Но чтобы свет лился сквозь меня так чисто, мне нужен был он.. Давай лучше так: ты. И вот то, что в этой песне - оно тебе. Знаю, как и многие важные для меня люди, ты не читаешь мой блог, но пусть это просто останется тут.\nМы.. Путали города. И ты, и я. Когда вечером переписывались каждый после своего концерта. - Где ты? - И я уже не знаю где я. Но я рядом с тобой.\nИ то, что всегда оставалось за пределами экрана, только в воздухе: «Никого кроме тебя».\nТы говорил мне так, но я никогда не верила. Я не говорила тебе этого, но ты всегда знал, что так. Мне кажется, что мою любовь невозможно не чувствовать. Мне кажется, что моя любовь пробивает стены.\n«В мире всё так непостижимо, что трудно дышать. И ты снимаешь одежду - вдох.. Но надо бежать» - одна встреча между месяцами или неделями, этого так много, на самом деле, если тебе не нужен человек. И если ты чувствуешь эту связь - тебе не нужны подтверждения. Души умеют танцевать очень высоко в небе, где расстояние в несколько тысяч километров совсем не имеет значения. Это вообще не расстояние. А уже если встреча, особенно где-то посреди заснеженного Урала или Сибири - так это вообще.. Очень много. Еще на половину тура хватит.\n«Долбанный космос». Это все, что я чувствовала рядом с тобой - это невероятное, это огромное, это понятное и мне, и тебе. Эта магия. Чистая магия.\n«Главное» - это тоже об этом. Все эти песни очень круто ложились на моё отношение к музыке и людям, которые на самом деле очень важны в этом процессе. Люди на концертах. Люди, которые здесь из-за музыки. Они всегда были, как будто стояли кольцом за нашими спинами. Потому что музыка - она была так важна и для тебя, и для меня, наверное, тоже - хоть я всегда говорила все это очень извиняющимся тоном. Музыка и люди - вот то, что нас объединяло в реальном мире.\nИ ты много говорил мне о том, как это работает и о том, что будет дальше. У тебя, конечно, больше реальности в этом. У меня - нет. У меня все что касается творчества - полный провал в бессознательное. Никак не могу собраться и сделать все по уму, он как будто выключается, как только дело доходит до песен. Они все делают сами, а я ничего не могу изменить. И здесь, в этой песне я хотела по-пацански так разложить все отличия, которые я вижу в наших мирах.\nНе бывает правды. Всё относительно. Что для тебя - одно, для меня - другое. Но то вдохновение, которое ты мне даришь - оно реально в моем мире. Я ненавижу выдумывать, я - раб правды и настоящих чувств. Только об этом я могу писать, только самый-самый жесткий экстракт реальности мне подойдет, чтобы написать хорошую песню. И для того, чтобы это случилось, важно пройти путь. Нужно сдаться, не смотря на свою силу и волю, сдать всю оборону и отдать себя жизни и потоку - он сварит тебя заживо, и ты знаешь это - но пока ты не снимешь броню и не уйдешь туда с головой, у тебя не получится то творчество, которое наполняет жизнь смыслом. Ты не почувствуешь истину, а для тебя только эта истина является смыслом жизни. Я каждую секунду готова умереть, чтобы почувствовать этот смысл. Я готова все отдать. И я делаю это… В этом моменте настоящая магия, только ты и истина - а дальше начинается бизнес. Если бы я могла жить только в космосе - я была бы только рада. Но вот мое реальное тело, моя личность, вот мир, в котором я живу, и все так живут. Поэтому давай сделаем этот бизнес хорошо.\nСтой, и главное будет вокруг.\nКогда я в этом состоянии, я вижу всё. Все связи и сети, как в аватаре, или в том фильме где у нее в желудке пакет с таблетками порвался и она все поняла. Только такая любовь на пороге смерти открывает мне все грани реальности, когда ты счастлив и одновременно каждую минуту умираешь от боли. Только так. Но как было у Пелевина, самое великое открытие человека в реальном мире звучало так: «Во всей вселенной пахнет нефтью»\nМое «Главное» получилось более поэтичным, но чувствуется ли все то, что я вкладывала в эти строки? Не знаю. Тогда я уже побрилась налысо, сделала ту татуировку на затылке, выпустила Сатту - все это происходило параллельно, и песни из Сатты уже были далеким/недалеким прошлым. Я жила вот в этой реальности, которая была смесью мёда, яда и космоса, и писала эти песни, которые казались мне самым сильным, что со мной происходило.\n«Нет золотой середины: или я одержим, или мне безразлично» - через 5 лет я все таки могу сказать, что этому можно научиться. И настоящая любовь умеет обходиться без крайности, но быть наполнена сутью в своем центре. Мне её подарили за заслуги в космической войне, и я благодарна за то, что теперь умею чувствовать и это. Но, к сожалению, две этих крайности никуда не уходят. Шкала вот такая, и она вся до сих пор во мне, и это сука бесит конечно в какие-то моменты. Сложно всегда пребывать в центре.\n«Не существует покоя кроме той силы, которая гонит за ним» - это моя любовь, которая вечно стремится обладать. И счастье в тот момент, когда ты хватаешь комету за хвост, касаешься тени, только в этот момент ты счастлив на самом деле. Путешествие важнее места назначения. Поиск важнее искомого. Процесс важнее результата.\nКак бы научиться не умирать каждый раз в этой погоне.\nНу и что касается Снаффа - это конечно самая сильная история, потому что ты написал к ней музыку. Ты еще обиделся, что я нигде этого не указала - но вот обида и горечь в моем сердце были тогда сильнее благодарности и ощущения крутости всего происходящего. Может быть, если бы каждая эта строчка не была так пропитана реальной болью, все было бы проще. Но я помню, как я ее написала, там вообще тотальный концентрированный ад.\nМне хотелось ебнуть себя и тебя, честное слово, как в том клипе Guns’nRoses. Потому что я не знала, когда этот пиздец уже закончится. Почему мне все хуже и хуже? И когда я пытаюсь завязать с тобой - вокруг начинает все рушиться и взрываться, и на меня выпадает стекло в поезде, и организм отказывается работать, и вообще не понятно как хуже - с тобой или без тебя, но просто постоянно одинаково плохо. И тебе плохо, и мне плохо, и мы встречаемся только на последнем издыхании, на таком пределе, когда уже не можешь встать с кровати - я помню, как ты приезжал и обнимал меня, и раны затягивались. Потом я вставала, могла говорить, и мы снова находили миллион поводов закончить все это. Потому что в реальности быть невозможно. Вне ее - тоже. Я обезболивалась как могла, срывалась два раза за пол года, у Алины есть видео того дня, когда я, вернее мы… и это была моя последняя марка, вообще последнее что-то. 5 лет, 7 месяцев, 20 дней.\nТы говорил - «Может быть, если уже будет совсем ад, что-то изменится?». И вот было несколько раз, когда я видела ад. Каждую секунду реальности, и ведь надо было делать еще какие-то дела, где-то выступать, с кем-то разговаривать, куда-то ехать. Притворяться, что я не труп без содержимого под кожей. Ты был во всем вокруг - дьявол, который прячется в каждой вещи, чтобы уничтожить меня окончательно. Да да, как в Адвокате Дьявола - все сводило меня с ума, бесконечные происшествия, знаки, связь - когда я говорила «отойди от меня» в космосе я слышала такой оглушительный визг всех бесов мира, и все начинало трястись, вся поверхность земного шара, вся моя жизнь. Я была без сил, и это был замкнутый круг -  я не могла отказаться, потому что у меня не было сил на этот отказ, и не было меня - это уже давно не было хорошо, ни одной секунды хорошего, и уж точно никакого золотого света. Я ужасно выглядела, ужасно себя чувствовала, я ничего не могла делать… Побег в ребцентр - это было лучшее, что я могла сделать для себя тогда.\nТам я спряталась, и как будто в стенах часовни я наконец оторвалась от этой силы, спряталась под куполом. Я все делала, все-все-все делала, и меня отпустило. Но знаешь, я никогда не забуду этого: вот этот момент,  когда я остаюсь в помещении одна и ты - везде. Каждый раз, когда пою эти строчки «и на минуту оставшись в ванной, холодный кафель горячим лбом, я чувствую твое дыхание через все стены» я проживаю это заново. Не было ничего реальнее того, что происходило со мной тогда. Это было страшно, это было страшной силы столкновение.\nНо вот конец... он ведь сбылся на самом деле. У нас были те самые 24 часа под одеялом после страшной войны, когда никто не победил, но все сдались - и мы снова перестали быть людьми и стали душами, и стали драконами высоко в небе над замком, над гольф-клубом с самым красивым двором-колодцем, из которого видно звезды.\nА потом я уехала, и когда вернулась - я была уже другим человеком. Даже не так - я вернулась человеком, и полюбила по-настоящему другого человека, того, кто содержал в себе весь спектр реальной любви, как бы это не было сложно - он был именно таким. И я закрыла дверь в космос на много-много-много ключей, и все их выбросила в разные места.\nМы не могли бы сохранить нашу дружбу, потому что мне было слишком больно всю дорогу - и вот только спустя почти 6 лет и несколько циклов разного рода пиздецов я могу наконец-то поговорить об этом. Сильно, да?? Там было столько энергии внутри всего, СТОЛЬКОООО ЛЮБВИИИИИИ что я не могла об этом говорить и писать больше пяти лет, как будто уровень радиации держался, как будто я все еще слышала отголоски взрыва. Вот так вот все было, вот так… И никак по другому.\nВсе идет по кругу или по спирали, я все еще иду только за своим сердцем, механизм внутренний не меняется, но в 30 лет по любому охуеннее, чем в 25. Все, что у тебя есть не делает тебе тюрьму, если ты не боишься все это потерять - это главный урок, который я хотела бы донести самой себе пару лет назад.\nЖизнь одна, и она слишком короткая, чтобы не говорить правду. Жизнь одна, и она слишком короткая, чтобы быть кем-то другим, а не собой. Жизнь одна, и я ни секунды ни о чем не жалела.\n"}, {"path": "data/lj_export_clean/posts_md/77824__про_то_чем_я_сейчас_занимаюсь.md", "source": "LiveJournal", "date": "Unknown", "filename": "77824__про_то_чем_я_сейчас_занимаюсь", "content": "# Про то, чем я сейчас занимаюсь.\n*Date*: 21 марта 2013, 17:21\n*URL*: https://olymarkes.livejournal.com/77824.html\n\nВот она, моя\n#sekta\n17 марта мы открыли свой первый филиал - Питерский.  Ну а где нам еще открываться? )) Только тут есть MadStyle на Невском, вид на крыши, кирпичные стены, огромные зеркала -  такая атмосфера танцевальных школ Нью-Йорка, что я до сих пор не верю, что нам так повезло с местом...\nВсе сделали, как чувствовали - и систему, и чтобы у человека никаких финансовых преград", "full_content": "# Про то, чем я сейчас занимаюсь.\n*Date*: 21 марта 2013, 17:21\n*URL*: https://olymarkes.livejournal.com/77824.html\n\nВот она, моя\n#sekta\n17 марта мы открыли свой первый филиал - Питерский.  Ну а где нам еще открываться? )) Только тут есть MadStyle на Невском, вид на крыши, кирпичные стены, огромные зеркала -  такая атмосфера танцевальных школ Нью-Йорка, что я до сих пор не верю, что нам так повезло с местом...\nВсе сделали, как чувствовали - и систему, и чтобы у человека никаких финансовых преград не было для занятий. И вот итог: первый набор - 44 абонемента на очное обучение, еще 10 - на заочное. Полный зал каждый вечер, все выкладываются, все работают на полную. По воскресеньям - день открытых дверей, тусовка, чай, бесплатная йога... Всё так, как мы мечтали.\nЯ говорила: да сколько можно - в этих турах всю жизнь можно прожить, и не заметить... И продолжать делать одно и то же годами! А я так хочу, чтобы ко мне приходили люди, с которыми я могу разговаривать, которым я могу помогать, чтобы они удивлялись, анализируя свои успехи: \"ого, я и не знал, что я так могу!\". Я так устала от истории \"обо мне\" - а в музыке по другому не получается..  Я теперь хочу истории о них, о моих учениках... И пускай будет так, если высшим силам будет угодно.\nвот здесь группа, где можно пошерудить:\nhttp://vk.com/sektaschool\nу себя на странице я выкладываю всё, что важно\nhttp://vk.com/olymarkes\nмой инстаграм - olymarkes и в твиттере - так же.\nУ меня все еще есть живот, и быть ему еще два месяца. Все это время я буду вести занятия, в апреле скатаюсь наконец-то в Барселону и вернусь сюда, к питерским крышам, в свой новый дом на Васильевском Острове. Я волнуюсь, какой я буду мамой - но сто пудов могу сказать сейчас, я еще ничего так не ждала в жизни, как рождения этого пацана ))\nЖелаю всем света, ну и закину сюда еще один пост из VK про мою работу с магазином Yogin\nhttp://www.4yoga.ru/\nУ меня всегда была мечта - заниматься любимым делом. Не ради денег, не ради чувства самореализации - мне просто хотелось, чтобы каждый день мой был занят тем, от чего меня прёт.\nИ вот, наконец-то это происходит. Я чувствую себя самым счастливым человеком на свете -\n#sekta\nработает, и я занята ей целиком и полностью. Ну, и мне очень хочется рассказывать вам о своих директорских приключениях.\nИтак, рассказ первый. Еще на прошлой неделе мы решили, что каждое воскресенье у нас будет бесплатная йога и день открытых дверей.\nИ вот, наступает среда, и я осознаю что... у нас нет ковриков для йоги!!! в Мэдстайле есть пенки, но их не хватает даже на нашу группу - многие занимаются на полу, или на своих.\nИ вот, я начинаю искать, где купить в Питере нормальные ковры с оптовой скидкой. Минимум что я нахожу - это \"фрукты\" за 590 на Гороховой 49; Отстой.\nЗвоню в Москву, в магазин Yogin - пару недель назад они просто так (бесплатно и по своей инициативе) взяли и привезли к нам на московское занятие две коробки ковриков, чтобы люди не мучились на пенках.\n- Ребята, мне надо 17 самых базовых ковриков!! Можно мне скидку? И как бы мне их в Питер получить.\n- Щас решим!! - говорят на том конце провода.\nЯ уже готова оплачивать кому-нибудь из московских йогов дорогу, чтобы он по пути зацепил и привез нам эти коврики, но тут выясняется что у Йогина есть отделение в Питере, и там как раз есть нужное количество. От 10 ковриков цена за 1 получается всего 350 р (!!!!!!!), нормальных матов за такую цену вообще не найти.\nЯ тут же пишу своей группе: \"ребята, есть маза взять коврики по 350рэ, приносите мне вечером на занятие деньги, и завтра я вам куплю\".\nВ итоге сегодня я покупала 37 ковриков!!!! ))))))) В магазине меня встретила Наргиз - такая красивая и приветливая девушка с дредами. Пока она подбирала коврики, я ударилась мерить майки, футболки и платья.\n- А хочешь, мы тебе сумку для коврика подарим?\nНу какой йог откажется от такой крутой сумки? )) Я проторчала в магазине часа два, мы пили чай, Наргиз рассказывала мне про все-все-все виды ковриков, я пробовала их на \"липучесть\", и в итоге мы нашли коврик, как у меня - т.к. я его не покупала, я не знала как именно он называется, а ему как бы уже конец приходит - стёрся он практически до дыр сквозных.\nТеперь у моего йогамата будет преемник))\nА еще все из\n#sekta\nтеперь могут покупать там все со скидкой 10 процентов ) вот их сайт -\nhttp://www.4yoga.ru/\n, мне хочется сделать им приятно и рассказать, какие они классные люди:\nВот казалось бы - бизнес и бизнес, в йоге тоже крутятся деньги, люди зарабатывают на йога-турах, центрах, семинарах, на продаже техники для нее.. Все в этом мире создано, чтобы каждый занимался своим делом, и при этом мог кормить себя и семью - я давно поняла, что в этом нет ничего такого... Но вот КАК люди это делают?!\nЯ не говорю там о скидках или подарках... Но хотя бы отношение, забота! В некоторые йога-центры приходишь, и тебе даже не улыбнутся... И я привыкла ожидать, что люди гонятся за своей выгодой и только. А тут, знаете.. Такой, чисто питерский бизнес по настроению: как будто друг делает для друга, помогает, и все счастливы.\n"}, {"path": "data/lj_export_clean/posts_md/76690__поможемникеспастижизнь.md", "source": "LiveJournal", "date": "Unknown", "filename": "76690__поможемникеспастижизнь", "content": "# #ПоможемНикеСпастиЖизнь\n*Date*: 25 сентября 2012, 15:21\n*URL*: https://olymarkes.livejournal.com/76690.html\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офигенно, ну, это я так считала.\nСледующий кадр – я с какими-то пакетами иду по поселку Арамиль и рыдаю в ", "full_content": "# #ПоможемНикеСпастиЖизнь\n*Date*: 25 сентября 2012, 15:21\n*URL*: https://olymarkes.livejournal.com/76690.html\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офигенно, ну, это я так считала.\nСледующий кадр – я с какими-то пакетами иду по поселку Арамиль и рыдаю в три ручья, мне так плохо, что не хочется жить – причем уже давно, даже когда я не торчу, даже когда мне удается прожить без наркотиков несколько дней – ну, по той причине что денег на них уже нет, или потому, что все мои друзья уже отказываются иметь со мной хоть какие-то дела, - мне хочется сдохнуть, потому что жизнь эта не имеет ни цели, ни смысла.\nИ вот – иду я по поселку Арамиль в реабилитационный центр «Зазеркалье», а Ника меня встречает на дороге, обнимает, улыбается и гладит меня: «Ну чегооо ты… Плачешь, девочка? Ну поплачь…» наверное с этого момента Ника всегда была мне мамой.\nОна такая маленькая, такая хрупкая – ниже меня на голову целую, ее можно обхватить и спрятать… Но при этом она – такой ЧЕЛОВЕК. Она как будто находила нас в темном-темном месте и отводила туда, где свет.. Я помню со мной в той реабилитации лежал один парень, ему было 30 лет и кололся он из них половину. И он не мог поверить в Бога, и я помню тот самый момент когда что-то изменилось… Ника всегда находила такие слова, которых не находилось у меня - даже в голове.. И в тот момент она нашла слова для него. И он сказал… «да». Сейчас у него двое детей.\nЕсли бы не она – не было бы этого альбома – Снежная Барселона. На этом диске даже есть ей персональное, огромное СПАСИБО. И за все, что было после – за все наши записи и концерты (а они ведь наши дети) я благодарна ей, она всегда была рядом.\nЕе голос – я так люблю ее слушать, ее вот эту вот манеру смеятся, жестикулировать, что-то показывать. Если ее увидеть один раз – никогда не забудешь, если один раз с ней провести время – подсядешь навсегда.\nПоследние годы она жила на Красных Воротах в маленькой комнате в коммунальной квартире – там никто не мог ужиться из за сумасшедшей соседки Линды Эдмундовны. И только Ника смогла с ней совладать. Так вот – мы с Alai Oli приезжали в Москву выступать, и могли всей группой завалится ночевать к ней – она никогда не отказывала нам, самый терпеливый человек на свете… Как же хочется отплатить тебе, Ника, за все тепло, которое ты дала мне и моим друзьям.\nНика уникальная. Она уникальная, невероятная харизма – такой метр с кепкой, при этом самая настоящая женщина, красивая, нежная, открытая, дерзкая, веселая до разрыва и печенок… и мудрая настолько, что на несколько тысяч человек хватает ее мудрости, и так хочется, чтобы ее узнали еще больше людей… Чтобы она помогла и другим. Чтобы она была здорова, счаслива и всегда, всегда, всегда рядом.\nДля меня это очень, очень важно.\nСейчас у Ники нашли рак, и она конечно никогда не скажет и не попросит сама, но ей очень нужна наша поддержка, наши молитвы, наша помощь. Лечение очень дорогое, но нас много и вместе мы его потянем, и если у вас в сердце отозвалась история моего друга и учителя Ники, то вы тоже можете помочь. Мы все, ее друзья, будем вам очень благодарны.\nВот это реквизиты для финансовой помощи:\nВы можете положить деньги на этот счет: 5331572019702601, в любом салоне связи ЕВРОСЕТЬ.\nА так же, перевести сумму на карту Сбербанка: 4276380066196630.\nА вот группа вконтакте, где вы можете написать Нике слова поддержки!\n"}, {"path": "data/lj_export_clean/posts_md/64702__nesvyaznoe.md", "source": "LiveJournal", "date": "Unknown", "filename": "64702__nesvyaznoe", "content": "# nesvyaznoe\n*Date*: 28 ноября 2010, 01:50\n*URL*: https://olymarkes.livejournal.com/64702.html\n\nя мечтаю о большом дереве, чтобы оно стояло на вершине холма - величественное и одинокое.\nмечтаю о маленькой темно-зеленой травке, которая устилает ковром пологий берег спокойной реки.\nмечтаю снова стать маленькой, чтобы папа рассказывал мне сказки на ночь: \"сейчас у меня в ухе маленький старичок зажигает свет, ставит стул, закуривает трубку и щекочет меня седой бородой. Его ворчливая жена ругается на", "full_content": "# nesvyaznoe\n*Date*: 28 ноября 2010, 01:50\n*URL*: https://olymarkes.livejournal.com/64702.html\n\nя мечтаю о большом дереве, чтобы оно стояло на вершине холма - величественное и одинокое.\nмечтаю о маленькой темно-зеленой травке, которая устилает ковром пологий берег спокойной реки.\nмечтаю снова стать маленькой, чтобы папа рассказывал мне сказки на ночь: \"сейчас у меня в ухе маленький старичок зажигает свет, ставит стул, закуривает трубку и щекочет меня седой бородой. Его ворчливая жена ругается на него, а он не обращает внимания... подожди, он что-то говорит... сейчас.. он рассказывает сказку! Слушай: .... \"\nхочу стереть память, и не знать все эти книжки, чтобы прочитать их заново..\nКто я? Моя жизнь - огрубевшая кожа от встреч и обстоятельств,  и все синяки и раны превращались в шрамы - цинизм, независимость, свобода, опыт... Жизнь сделала меня неимоверно сильным существом -\n\".. ведь в такие моменты просто нужно жить дальше, просто встать и идти \"\nподнимаю себя за шкирку, маленькая, отряхиваю - благодарю Его, только Он всегда подает мне невидимую руку, когда я прячусь от близких - ведь только они умеют по-настоящему сделать больно.\nКто я? Когда я превращусь в большую рыбу никого из вас не будет рядом. Ни тех, кто проклинает меня и ненавидит, ни тех, кто любит меня и хвалит. Я не беру яблок ни с одного из этих деревьев, чтобы не впасть в прелесть и не остановиться на своем пути. Не слушайте и вы никого, и никогда не сдавайтесь.\nЭти города и снег, укутывающий нашу страну - свет фонарей на белом, и такое все игрушечное - мой маленький новогодний подарок. Рождественский пост, декабрьский тур по Сибири - я прошу не сил, чтобы вывезти. Я прошу приключений на мою отчаяную, дерзкую задницу.\nКакие мы все родные - откапываем по утрам машины от снега, греем ладони большими кружками чая, надеваем теплые носочки, влюбляемся, плачем на морозе....\nНе хочу конец света. Хочу еще. Мне нужен кто-то очень важный, прямо чувствую его существование на этой планете.\n"}, {"path": "data/lj_export_clean/posts_md/52416__мультимедиа_пост_про_трудовые_будни_alai_oli.md", "source": "LiveJournal", "date": "Unknown", "filename": "52416__мультимедиа_пост_про_трудовые_будни_alai_oli", "content": "# мультимедиа пост про трудовые будни Alai Oli\n*Date*: 18 мая 2010, 16:53\n*URL*: https://olymarkes.livejournal.com/52416.html\n\n.... или \"Пидоры и Она\"\nи видео номер три:\n1. Мое Ноу-Хау  - накладная задница. Для тех, кого природа обделила. Модель: Катя Павлова, менеджер Alai Oli. Москва, Внуково\n2. Камерой ничо не снимайте девушка!\n4.  Репетиция Комитета Охраны Тепла - Калининград.\n5. Нижний Новгород\n6. Нижний - 2. аллергия на трезвость )\n7. Бро идет на студию ))\n﻿\n", "full_content": "# мультимедиа пост про трудовые будни Alai Oli\n*Date*: 18 мая 2010, 16:53\n*URL*: https://olymarkes.livejournal.com/52416.html\n\n.... или \"Пидоры и Она\"\nи видео номер три:\n1. Мое Ноу-Хау  - накладная задница. Для тех, кого природа обделила. Модель: Катя Павлова, менеджер Alai Oli. Москва, Внуково\n2. Камерой ничо не снимайте девушка!\n4.  Репетиция Комитета Охраны Тепла - Калининград.\n5. Нижний Новгород\n6. Нижний - 2. аллергия на трезвость )\n7. Бро идет на студию ))\n﻿\n"}, {"path": "data/lj_export_clean/posts_md/87992__scar_tissue_автореферат.md", "source": "LiveJournal", "date": "Unknown", "filename": "87992__scar_tissue_автореферат", "content": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу отложить телефон, читая Двач до 2х часов ночи. Когда я одна - я как будто остаюсь дома без родителей", "full_content": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу отложить телефон, читая Двач до 2х часов ночи. Когда я одна - я как будто остаюсь дома без родителей. Когда нет жесткого контроля извне - я как будто разрешаю себе все. Но разве при людях я запрещаю? Разве люди являются гарантом моего правильного поведения? Ну нет же (это я успокаиваю себя). Если бы я чаще была одна - это бы устаканилось. Я бы компенсировала себе все, а потом бы вернулась на привычные рельсы. Но одиночество - это недоступная.. не буду говорить, что роскошь. Опция. Недоступная в длительной продолжительности опция.\nКогда-то анонимные наркоманы сказали мне: может быть торчать ты еще будешь, но удовольствие мы тебе точно попортим. Не сказать, что я получала удовольствие от наркотиков до этого. Во всем этом было очень много истерики - я хочу, хочу так сильно, как ничего на свете не хотела. Даже не так: мне надо. Мне просто надо. Есть? Дайте. Есть сильнее? Дайте. Есть больше? Дайте. Точно так же анонимные наркоманы попортили мне удовольствие от многих других вещей в трезвости- например, от втыкания в телефон или от покупок. Даже если я продолжаю делать что-то подобное - я осознаю, когда мной руководит зависимое поведение. Я не употребляю 6 лет и 7 месяцев, но при этом я каждый день ловлю себя на зависимом поведении. Думаю, именно это помогает мне оставаться в потоке - продолжать писать шаги и не пробовать изменять сознание в надежде, что сейчас это приведет меня куда-то в место поприятнее, чем то, где я была 10 лет назад.\nДля начала я нарисую вам хронологию своей зависимости, я же никогда этого не делала раньше в своих лонгридах, только в тетрадке из реб.центра, которую никто из вас не читал. Все равно придется делать это в мемуарах) Так что подарю вам эксклюзивчик.\nИтак. 12 лет - я начинаю курить сигареты, пробую травку. Мне некомфортно, кажется что я предаю что-то в себе, что-то важное. У меня есть подаренный мне пакет травки - я не пользуюсь им, предлагаю его папиной подруге, которая курит. Она рассказывает папе, он достаточно жестко реагирует, отвозит меня в общественный центр для наркоманов, пол года я на домашнем аресте, ко мне относятся как к наркоманке, мне показывают фильмы про подвалы дыбенко, я вообще не понимаю - за что так со мной. У меня же была своя голова… Была. Когда к тебе относятся, как к наркоману - ты уже в принципе привыкаешь к этому состоянию. Я привыкла. Думаю, когда детям говорят, что Элджей и его музыка может сделать их наркоманами - это работает примерно так же. Моя зависимость была заложена во мне, но всегда есть тот триггер, который запускает этот механизм.\n(на фото уже 9-10 классы, с 7ого класса я курила. К началу универа выкуривала по две пачки в день)\nВ то время у меня пропало желание не-торчать. Я была готова пробовать, я стала открыта для этого мира и людей в нем. Я читала сайт\ndrugusers\nо внутривенном употреблении , я пыталась понять суть зависимости и зависимых. Мне было 13-14 лет. В то время я встала на сторону идеологии «I dont want to choose life. I choose something else». Мне не нравился лживый мир взрослых - они сами не могли быть примерами трезвости или чистоты, они не были эмпатичными, они не старались понять нас и выслушать. Я хотела связать свою жизнь с социальной журналистикой и программами типа «Снижение вреда» - кстати, почти за 20 последующих лет я успела побыть и клиентом подобных центров, и их амбассадором.\nЛет в 16-17 я нашла Ital-идеологию в растафарианстве. Чистота и естественность. Вегетерианство, травка, никакой химии. На тот момент я уже попробовала ряд наркотиков - несколько клубных сетов - я поняла, что танцевать под наркотиками - это не мое. Но лежать с закрытыми глазами - это, пожалуй, да. Мое употребление химии до 16 лет было эпизодичным, раз 10, максимум - 1-2 дня подряд. Не было денег, не было компании, в которой были тяжелые наркотики. Но по поводу легких - все это было, и это было лучше, чем алкоголь.\nАлкоголь иногда все таки появлялся в нашей жизни - но в качестве редкого веселья. Был долгий период отказа от алко, но ни начала ни конца я не могу вспомнить. Скорее всего весь первый курс университета. Тогда мы начали есть грибы, у меня серьезно повернулась сознание. В тот момент я заплела дреды и взяла достаточно строгую аскезу. Рассталась с парнем, с которым встречалась с 9ого класса, много времени проводила в церкви. Мне хотелось очистится, казалось, что я неправильно живу и все вокруг тоже совершают ошибки. Я чувствовала: мы все должны быть чистыми и невинными, как дети. А мы были далеко от этого.\n(2004-2005)\nКогда я нашла идеологию чистоты в I-tal и православие, я была уверена, что это навсегда. Прошло года 3, мы выпустили альбом, попали в реггей среду, я нашла свое место и ощущение правильности всего, что я делаю. Между мной и химией лежала, как мне казалось, целая вечность. Я осуждала тяжелых наркоманов, считая это слабостью и тупостью. Я успела даже осознать зависимость от гашиша - оказавшись без вещества тгк на неделю, я чуть не сошла с ума. Конечно, это не героиновая ломка - это другое, но психологически очень неприятно. Зато после этого перерыва, я перестала нуждаться в тгк каждый день, и начала относиться к этому спокойнее. В то время, мне кажется, я была ближе всего к психологии независимых людей. Могла бухать с друзьями по выходным, когда мы идем в клуб, а в будни ходить в офис, курить время от времени. Меня это не беспокоило. Тогда я начала кататься на велике, знакомиться со своим запущенным здоровьем и телом, экспериментировать с питанием.\n(2006-2007 первые шаги в здоровом образе жизни. Я наконец-то начала выглядеть лучше, бросила курить!)\nПотом что-то пошло не так. Я встретила любовь, my siberian ragga, мне казалось, что это - ваааааааааа бесподобное нечто, и теперь все будет иначе. Я как будто поменяла свою внутреннюю химию, перестала чувствовать себя тем человеком, который жил и устоялся до этого. И когда мы оказались в Питере -  мне захотелось употребить что-то сильное. Мне казалось, что мы несокрушимы, что ничего не сможет нас разлучить или сломать. Отличное решение на этой волне убиться дешевыми влажными питерскими спидами. И когда я это сделала - это убило всё. И нового воздушного человека во мне, и химию, и любовь. Первое употребление после долгого перерыва выжгло меня изнутри, всю мою идеологию и ощущение правильности, и вообще все. Кстати, где-то в этот период я завела жж, может на несколько месяцев позже. И еще песня «Ищу Тебя» о том моменте. Любовь была у меня, но я потеряла ее в себе.\nКто после этого начал употреблять - я не знаю. Какая-то пустая оболочка без смысла и идеологии.\n21-22 года - это время моего самого активного употребления без контроля и понимания, что со мной происходит. Мне было надо. Мне хотелось. Я искала возможности и способы. Мне конечно хотелось при этом контролировать употребление и не терять свою жизнь. И у меня были способы. Например - не торчать в Екатеринбурге. Я продержалась в этой концепции месяцев 7-8, меня откачивали в турах, в итоге я практически переехала в Ижевск.\nсентрябрь 2008, i am so bad\nБыли моменты, когда я пыталась перестать сама. Я не торчала на героине, но стимуляторы тоже подсаживают тебя на систему, хоть и не такую жесткую. Я пробовала так: например - разогнать дозу до такого, чтобы было уже невозможно употреблять (плохой способ). Отказаться от стимуляторов и употреблять только несинтетические наркотики - лсд, грибы, мескалин. В конце уже не было денег на экзотику, мы со Щекалевым съели семена гавайской розы (я совершила эту ошибку второй раз в жизни). Отравление было таким сильным, что почти сутки я падала в обмороки и испытывала боль во всем теле. Было так плохо, что после этого любое состояние было хорошим. Т.е. Меня больше не кумарило.\nМы уехали автостопом на юг, перед этим я познакомилась с Никой Суринович, которая сказала: хехе, у тебя проблемы. Осознаешь - приходи. И я, с трезвостью в неделю или две, усмехалась в ответ: я могу сама. Вот увидишь. Через месяца полтора трезвости я осталась одна и выпила глинтвейн. А что такого? Это же не наркотики. Теперь можно.\nМного раз за эти два года я пыталась заменить наркотики на алкоголь. Это были и веселые вечеринки, и просто несколько термосов глинтвейна с водкой, без которых я не выходила из дома как раз в тот период - вот в один из этих выползок я пела для ВИЧ+ ребят в помещении группы анонимных наркоманов, многие думают что в тот период я была уже трезвая. Видимо в употреблении я не выглядела так, как представляют себе торчков. Просто грустная.\nВообще все относились ко мне нормально. Юля меня поддерживала и всегда была рядом, одногруппники помогали с учебой, моя группа старалась понять меня. Конечно я вела себя безумно, я психовала, сама отталкивала от себя людей - во многом я хотела сама все потерять, чтобы нащупать дно и оттолкнуться от него, но у меня никак не получалось. Возвращение к наркотикам после перерыва, когда «ты сам» - это болезненно. Казалось, что я падала еще ниже. Мне отчасти нравилась эта эстетика дна, мне было больно в душе, но не страшно. Я употребляла внутривенно, я делала это одна. И вот так казалось все и должно закончится. В какой - то момент ты не хочешь никуда выбираться, не хочешь, чтобы тебе становилось лучше. Ты просто жалеешь, что не можешь умереть прямо сейчас.\nТем не менее употреблять больше недели я не могла. То есть когда я пишу о своем торче, многие представляют меня, как Андрея - который 10 лет ежедневно кололся и искал дозу с редкими перерывами на детоксы. У меня была другая система - я могла употреблять 2-3 дня, наркотики заканчивались или я их выбрасывала раньше. Потом я пыталась компенсировать себе выходы - начинала бегать через силу, еле передвигая ноги, по вечерам - заливаться алкоголем, превращая все это в атмосферу праздника - могу, умею, практикую. Друзья = эндорфины. Пару дней - и я была в норме, ничем не отличалась от других людей, которые бухают по выходным. Так можно жить годами, и многие, многие так живут до сих пор. Особенно в Питере, где Северное техно и вся инфраструктура. Но в Питер, кстати, я переезжала уже на другой волне.\nВ целом у меня было все: друзья по всей стране, прогресс во всех сферах жизни, много полезных связей, деньги на все необходимое, независимость от родителей - мой торч был отвратителен или прекрасен тем, что давал моему «я сама» большую веру и моему эго большую подпитку - а это значит, что мне претила сама идея обращения за помощью. Я понимаю Лил Пипа, понимаю всех этих фрешменов, которые умирают до 25ти. В своем первом ребцентре я рисовала картинку: я держу в руках столько дел, людей, все вокруг меня и завязано на мне - а подо мной бездна, а в ней - огонь. И мне уже жжет пятки.  Но я могу писать песни, могу выходить на сцену, черт возьми, я даже могу подготовиться к экзаменам и сдать сессию, написать охрененное эссе, статью в газету факультета. Я все успеваю - и жить, и умирать.\nЭто было самым сложным в том периоде, да и вообще в любом из последующих. Если в этой жизни ты держишься на уровне нормальных людей, держишь свою жизнь в шатком балансе, то что в той, другой жизни без наркотиков и алкоголя? Норма не измеряется твоими успехами, достижениями, положением общества. Норма - это то, что на твоих внутренних приборах. И строить курс надо по этим приборам, а не по внешним ориентирам. Быть в норме, как все другие люди еще не значит быть в твоей личной норме. Тогда я не знала никого, кто жил бы так, как я и испытывал бы подобное. Если бы мне тогда попалась книга Киддиса Scar Tissue - возможно, я бы лучше поняла, что происходит.\nОчередная моя чистота началась решительно: я пообещала Юле - пол года никаких наркотиков, а она подарила мне абонемент в фитнес клуб, где я попала на первую в жизни йогу, а в последствии - вообще прописалась там, пробуя все все виды групповых и индивидуальных программ. Я решила ходить к Нике в реб.центр, изредка оставаясь там на ночь - просто подсмотреть, как лечат зависимых. Но я выполняла все задания. Ужасом для меня было то, что они говорили об алкоголе - что это такой же наркотик. Я не могла и не хотела с этим соглашаться - настолько он бы интегрирован в жизнь.. Это была норма. Все так отдыхали. Когда в компании я пробовала отказаться от алкоголя - я чувствовала себя несчастной, как единственный ребенок из всех, которому запретили мороженное;\n(разговор с Никой, октябрь 2008)\nНу можно я буду пить но не буду торчать? - ну давай, хе-хе-хе… - Вот так примерно мне отвечала Ника. И я пробовала.\nТогда, после очередного разового срыва на наркотики (около месяца я продержалась с алкоголем и на обещании Юле). И вот тогда я пошла на группу. Она была, кажется, на улице Луначарского. Люди мне не понравились. Все было ужасно, меня стебали, кривили лицо - я была там вообще «не от мира сего», но я как-то покорилась. Кажется в тот момент я приняла бессилие: с алкоголем не получится, я устала, я хочу попробовать так, как вы говорите.\nПервым моим шагом в настоящую трезвость без полумер было абсолютное понимание, что контролировать употребление я не могу, понять зачем я употребляю - я тоже не могу. Не было ясности, что будет дальше, как я там буду — но первый раз в жизни я была готова отказаться от всего: от алкоголя и любых видов наркотиков.\nЭто была осень 2008 года. Мой последний год обучения в университете, год, когда мы выпускали Снежную Барселону. За 2008-2009 год мне едва ли удавалось набрать 1-2-3 месяца трезвости без срывов, но во всяком случае уже большую часть времени я проводила абсолютно чистой - без алкоголя и даже легких наркотиков. Проживала день за днем. Это - первая часть рассказа. Остальное напишу в следующий раз.\n"}, {"path": "data/lj_export_clean/posts_md/64363__олди.md", "source": "LiveJournal", "date": "Unknown", "filename": "64363__олди", "content": "# Олди.\n*Date*: 17 ноября 2010, 16:59\n*URL*: https://olymarkes.livejournal.com/64363.html\n\nОлди говорил: тебя уже никакой стафф не вставит, даже самый качественный - и смысла нет. Он говорил: \"не можешь быть отравлена, ни проклята ты. И смеялся так: \"хе хе хе.. Вот так-то, тетя Оля!\"\nОн говорил: \"когда мы Филю хоронили, на небе тучи расступились - это его душа улетела, Бог ее принял.\"  А я как раз Филе так много не успела сказать, так много не успела я ему сказать в последние наши встречи. \"..бе", "full_content": "# Олди.\n*Date*: 17 ноября 2010, 16:59\n*URL*: https://olymarkes.livejournal.com/64363.html\n\nОлди говорил: тебя уже никакой стафф не вставит, даже самый качественный - и смысла нет. Он говорил: \"не можешь быть отравлена, ни проклята ты. И смеялся так: \"хе хе хе.. Вот так-то, тетя Оля!\"\nОн говорил: \"когда мы Филю хоронили, на небе тучи расступились - это его душа улетела, Бог ее принял.\"  А я как раз Филе так много не успела сказать, так много не успела я ему сказать в последние наши встречи. \"..бездонного ленинграда\", русский рутс в моей крови с любовью к этому голубоглазому. В бэкстейдже московских больших клубов - Горбушка, Б1 максимум - \"я пересекаю моря, океаны, горы, чтобы пройти мимо тебя, опустив голову.\", ну хуле - не могла я из себя ничего выдавить в атмосфере фестивального кипиша.\n- Расскажи о нем еще.\nС тех пор я всегда все успевала.  Первая и последняя волна русского реггей встретились в лесах под Калининградом, пели и гуляли вдвоем и я спрашивала все-все-все что придет на ум, и была тем влюбленным подростком с плейлистом из одного  комитета охраны тепла в плеере, и была уже собой - взрослой, циничной, разочаровавшейся во всем и вся, и в русском реггей в том числе, попустившейся и тем счастливой.  Просто квинтессенцией быдла были мы, сидя на газоне Марсова поля. Мимо нас маршировали женщины - милиционеры, мы ждали его дочку из школы было жесть как солнечно и у нас была куча времени.\nЯ все успела - и даже на репетиции Комитета побывала на чердаке раста-комунны.  Мы с Димой остались там ночевать, он накурился в слюни и сопли а я наелась бутиков с домашним маслом и сыром, посидели у костра и легли спать.\nНочью я проснулась, нашла ногами кеды у кровати, и по спящему дому стала тихонько пробираться к выходу. За окнами я увидела утренний туман, он окутал дом странной звенящей тишиной.\nСпустилась по лестнице, повернула на кухню - вот тут-то передо мной вырос Олди.\n- О, это ты... Эта... Регги-певица эта, да? Чо не спишь?\n- Я это, пи-пи . Щас вернусь.\nЯ так и не легла спать в тот день. Промочила кеды в росе, испачкала белые джинсы.  \"Держись!\" - говорил он, оттопыривая локоть руки, торчащей из кармана. Я чувствовала себя неловко, но не решалась ему отказать - хваталась за его руку и мы шли гулять по пустынной деревне.\nВ следующий раз мы встретились в Питере. Оказалось, мы живем чуть ли не в соседних домах - он звонил, и мы шли гулять. И все эти разговоры очень важны для меня. Может быть когда-нибудь я напишу все, что помню из них. Или пускай останутся только моими...\n- А еще Филя мне подарил кольцо, которое когда-то подарил ему ты.  Филя сказал, что у меня все получится.. А когда-то ты сказал ему так же.\nПотом он пришел ночью, позвонил - говорит: у меня для тебя кое-что есть. А я сплю, прямо  сил нет встать.\n- Дим, сходишь? Там Олди у арки ждет.\nВот сейчас смотрю на этот его подарок и думаю: две мои любимые группы - Карибасы и Комитет Охраны Тепла, лидеров обеих нет уже здесь, и не было после них русского реггей для меня. И оба они оставили очень много во мне, и своими песнями и разговорами со мной. Как будто кто-то сверху послал мне учителей, и дал мне немного времени побыть рядом с ними. Мы не знакомились, мы встречались как будто не в первый раз, и сразу много информации обрушивалось на меня. И не важны подарки - вещи. Важны подарки - встречи. Ведь они уже там, а я - здесь, одна.\nПочему я больше не хочу Alai Oli?  Не бойтесь, я не брошу дела. Будет и третий альбом, и будут концерты. Просто время подходит к концу, и я это чувствую. Чутье меня никогда не обманывает.\nНе было у меня никаких амбиций, просто я делала то что хочется и всегда буду  - пока прет музыка, будет музыка. пока прет йога - будет йога. Главное ведь быть с собой честным и делать то, что нравица. Разве нет?\n"}, {"path": "data/lj_export_clean/posts_md/77244__фак_энд_панч.md", "source": "LiveJournal", "date": "Unknown", "filename": "77244__фак_энд_панч", "content": "# фак энд панч\n*Date*: 21 ноября 2012, 11:36\n*URL*: https://olymarkes.livejournal.com/77244.html\n\nВообще-то у меня есть тайный жж, в котором отобранные методом придирчивого айкью тестирования ценители прикасаются к самому ценному, потому что сюда порой забредают бараны, от комментариев которых мне хочется убить себя фэйспалмом. Но я знаю, что есть здесь и такие, которые молчат - но им это нужно, как глоток воздуха.\nТак вот, с разрешения моего самого любимого писателя я покажу вам пару его тексто", "full_content": "# фак энд панч\n*Date*: 21 ноября 2012, 11:36\n*URL*: https://olymarkes.livejournal.com/77244.html\n\nВообще-то у меня есть тайный жж, в котором отобранные методом придирчивого айкью тестирования ценители прикасаются к самому ценному, потому что сюда порой забредают бараны, от комментариев которых мне хочется убить себя фэйспалмом. Но я знаю, что есть здесь и такие, которые молчат - но им это нужно, как глоток воздуха.\nТак вот, с разрешения моего самого любимого писателя я покажу вам пару его текстов. Лютейший эксклюзив, наслаждайтесь.\nPizza time\nУх, как я не люблю вспоминать этот период жизни.Ты бы знал.\nЛадно. Я наконец-то запутался в своем вранье, и стало очевидно, что героин наконец-то победил мое желание заниматься интересными делами. Итог: я словно побитый пес живу у мамы, которая все чаще спрашивает меня, как долго я тут буду, и не хочу ли я наконец уже взять себя в руки пойти найти себе нормальную работу.\nМой внешний вид убог и жалок. У меня есть пятьдесят кило костей и кожи, а также прическа эйнштейна и рыжая борода. Я рассекаю по дому в зеленом халате: в одном кармане фурик и вата, в другом – баян двадцатка. Приехали.\nПравый рукав уже не сгибается от заскорузлой крови из свежих дырок от уколов. Я осознаю свое положение, но мой ебаный гений внутри говорит: - чувак это все хуйня, тебя просто не понимают.\nБлять, мало того, что от меня отвернулись даже малознакомые люди - мой барыга боится встречаться со мной.\n- Ты стал таким агрессивным и я боюсь поворачиваться к тебе спиной. Отныне встречаемся только на улице.\nЯ целыми днями сижу за монитором, клепая какую-то бесполезную хуйню, которую никто так никогда и не увидит. Диски с отснятыми материалами растут в аккуратную стопку, чтобы потом быть раскидаными и разломаными в приступе гнева и жалости к себе и своей бесполезности, когда кайф переданный мне через сигаретную пачку на ниточке, улетит за забор на стройку.\n- Ты должен найти себе работу.\nВодить машину – единственное, что я еще мог вменяемо делать. Я так думал.\n“Требуется доставщик пиццы”. Бля, говно. Я слишком охуителен для такого.\n- Ты на себя в зеркало посмотри, - говорит мама.\n…\n- Вредные привычки - не имею.\nТетка смотрит на меня с сомнением. Прячу руки под стол и ненавижу себя. Я нашел работу, но поделиться с этим не с кем. Все, кто меня знают - перехоят на другую сторону улицы. Я должен уже всем от Восстания до Фонтанки.\n- Смотри, здесь формируется заказ, и ты должен его за пятнадцаь минут доставить. Чаевые твои. Работа не пыльная.\nЯ и сам думал, что хуйня - но можно было быстро накопить на свои цели и отвалить.\nМолодой парень смущенно обьясняет мне кухню. Его лишили прав, и он вынужден искать себе другое занятие.\n- Главное – если нарушать, то осторожно. Сам понимаешь, что по этим пробкам…. блять, дебил ты смотришь куда едешь вообще?!! - мы прорываемся на Мойку через адовую пробку на маленьком и ушатанном дэу матиз - машине, которой суждено стать моим инструментом для добывания денег. Опять же - на доход барыг и в бюджет таджикистана или казахстана, смотря откуда привезен кайф.\n- На случай полной задницы есть мотоцикл. Права не нужны, все равно никто не остановит. Пойдем покажу-научу.\nИтак, я доставляю пиццу. Занятие странное. Ты оголтело едешь на адрес и там какой нибудь педик с кислым ебалом нехотя принимает у тебя коробку типа “не очень хотелось но раз привезли ладно”.\nОсобая статья - офисы.Там люди вырывают у тебя из рук еду и суют крупные купюры, лишь бы ты сьебал и не мешал им делать бизнес.\n- Сдачи не надо.\nСладкие слова. За день я успевал собрать сумму для того, чтобы напоить небольшую компанию в хорошем заведении. Однако, деньги применялись немного в другом направлении.\n- Сдачи не надо.\nУнизительная фраза, определяющая твое положение в этом мире. Твою никчемность и признание поражения в жизни.Тебе дают и ты берешь. Мне до сих пор не очень уютно, когда рассчитываюсь в заведениях и случайно говорю эту фразу. Это оскорбительно. Правда.\nОдин адрес мне очень нравился тем, что чувак постоянно был под кислотой и сделав заказ, через пару часов забывал об этом и делал его снова. Так повторялось до восьми раз за день. Я стал лучше выглядеть, так как регулярные иньекции, имеющие вид системы, приводят в чувство организм и не дают зеленеть, блевать и сраться на каждом углу.\nДождь заебал. На приемке скучно и идет обсуждение погоды.\n- Привет, че как. - голос барыги ленив и высокомерен, - я уеду через двадцать минут за город буду послезавтра, если хочешь чего взять приезжай сейчас.\nБлять. С Казанской на Восстания на машине не доехать.\n- Я возьму двухколесного прокачусь .\n- А, ладно, недолго только, скоро начнут вечерение заказы делать.\nЕбаное говно. Два урока езды толком не научили ничему. Главная подстава для меня в том, что я так и не усвоил где сцепление, а где тормоз. Ладно, времени нет. Не скажу, что мне понравилось ездить на мотоцикле.Может я просто торопился, а может дождь, который прошивал меня насквозь, портил картинку, не знаю.\nК Литейному я уже освоился и лихо повернул на него прямо с Невского, лавируя, чтобы выйти на жуки и домчать до адреса. Сделав поворот, я словил каких-то особо крупных капель, и практически ослеп. Запаниковав, начал хватать руками ручки, и вместо тормоза, естественно, выжал сцепление - остановки не призошло, случайно рванул газ, впереди стоял уаз пэтриот. Это было больно.\nОчень больно и обидно. Очнулся в луже с кровью. Железный конь лежал рядом, а надо мной стоял чувак и удивленно смотрел на мою голову.\n- Ни хуя. Твоя голова как колокол на всю улицу брякнула.Ты как живой-то остался? – недоумевал он.\nДилиньдилинь. Где эта трубка?\n- Да.\n- Ну ты идешь или нет? Я ждать не буду.\nСука, молча я встал на четвереньки и истекая кровью, сжав зубы, сначала полз по дороге, а потом хромал к заветному грамму, который стоил мне всего: моей проебанной жизни, достоинства, самоуважения, в конце концов этого ебаного мотоцикла. Но мне было похуй.\n- Ого,- барыга смотрела на меня испуганно. - ты где так?\n- Воду неси.\nЖадно курил и плакал от отчаяния, понимая,что выхода у меня нет, и то секундное удовольствие от прихода и есть самая главная цель для меня. Но, самое страшное, что оно не стоит на самом деле нихуя. Ни одной самой маленькой жертвы, которую я принес. Так зачем же я?\nМужик возился с передним колесом.\n- О, ты вернулся, смотри, все норм, я крыло выправил тебе, давай довезу, у меня пикап.\nЯ молча закатил искалеченный механизм на склад и пошел домой. В руке сжимал отсыревший порошок, перемещанный с собственной кровью. Забыть, забыть блять.\nНа следующий день в заведение пришел человек, который узнал меня, и сладким шепотом сообщил администратору о моей пагубной привычке. Был неприятный разговор, я сдал ключи и отправился… Не знаю куда я отправился. Даже такая бесполезная ебаная работа и та была не для меня. Все это принимало какие-то странные контуры, и в поиске ответа я дознулся дома на кухне.\nМеня нашел муж мамы и ему потребоавалось немало сил, чтобы восстановить мне дыхание. Я даже не сказал ему спасибо, а просто сидел на подоконнике, как в детстве, и смотрел на башню с часами. Впереди было еще три года.Три года потерь и движения к концу.\nDogz\nДоброе утро. Я говно. Не то,чтобы это стало новостью для меня.\nБудь я сраным фотохудожником, ходил бы сейчас и делал эпические портреты людей с зонтами. У нас в районе весь день идет гаденький такой дождик. Вроде и капель не видно,а все мокрое. От этого раздражаешься,потому что если дождь-так извольте дождь, а не этот насморк. Если снег, то, чтобы занесло по ангела на шпиле Адмиралтейства. А тут какие то полумеры, которые, как известно - нам не помогали.\nСегодня утром у меня одно из тех состояний, в которых я себе очень не нравлюсь. Однако, именно в таком состоянии мне довелось однажды находиться около двух месяцев. Круглосуточно.\n«Период отчуждения был не особо воспринимаем мною. В то время я уже находился на пути к первой реабилитации, а пока мне нужна была работа. Я пиздатый и гениальный, так почему же от меня все в стороны шарахаются. А, понятно, я наркоман.  Прийдя к такому выводу, наугад выбрал обьявление о работе.\n- Смотри, - маленький, коренастый еврейчик отчаянно жестикулировал и мечтательно поднимал глаза к небу - У нас три - ты понимаешь - три машины. Наша фишка, помимо того,что у нас две ветклиники - это перевозка животных. В чем плюсы: животным похуй на комфорт, они всегда трезвые и их хозяева как правило готовы платить сколько угодно, лишь бы ты довез их тварь куда требуется.\nМое лицо выражало следующее - НИЧЕГО.\n- А чаевых тебе будуть давать, мммм. - Моисеич затрясся мелкой дрожью, видимо сожалея, что чаевые будут платить не ему. - Плюс, как у сотрудника нашей фирмы, у тебя будет охуительная желтая жилетка.\nЭтот довод убедил меня, что надо оставаться. Вечером я был уже на работе. Вопрос «какого хуя я тут делаю» возникал все время работы в том заведении, но, еврейчик не спиздел, платили действительно хорошо и при моем зверском наркотическом аппетите я не успевал тратить деньги.\nСуть занятия заключалась в следующем. Помимо ебаной жилетки с псом на спине, я являлся владельцем серого пежо партнер. Ну что партнер, погнали на процедуры - вопрошал я каждый раз, собираясь за кайфом. В мои задачи входило всегда быть на связи, и даже ночью в максимально короткое время добраться до любой страждущей киски, собачки, пичужки, чтобы препроводить ее с почестями до клиники или выставки. Вот и все. Но,нюансов была тьма.\nНапример, время от времени мне в салон загружали полудиких волкодавов и я вез этих тварей в область охранять обьекты. Как правило, кроме меня не было никого в машине, так как этих монстров просто боялись, а за время пути несколько конфеток превращали зверюг в мягких пушистиков и обожателей людей. Поэтому,вместо рычащих охранников принимающая сторона видела виляющих хвостом бесполезных друзей человека.\nОднажды ночью поступил заказ и я, опаздывая на мосты, чуть не влетел в фонарь на повороте. Девочка в слезах и соплях стояла на улице под желтым светилом и рядом с ней стоял огромный аквариум. С половину меня в высоту с зеленой водой.\n- Моей рыбке плохо,нам надо отвезти ее в больницу. -\nна поверхности кверху брюхом плавало то, что осталось от глубинного обитателя.\n- Так он сдох. - вымолвил я.\n- Так и я не трезва, - вымолвила барышня.\n- Могу взбодрить,предложил я и угостил ее порошком,который она вынюхала прямо в машине.\n- Ну, что ж давай тогда пока.\n- Подожди. - Мы взяли большой камень и разьебошили этот чудо аквариум, дабы не тратить силы и не тащить его обратно домой...\n…\n- Доброй ночи, мой Марсик сломал переднюю лапку... - мерзкий,  дрожащий тойтерьер вызывал желание выкинуть его в окно, а его хозяйке хотелось прочитать лекцию о человеческой глупости и ее пагубном влиянии на организм... Марсик скулил и смотрел своими выпученными глазками вокруг...\n- Доброй ночи, мой Марсик...\nЭто повторилось через два дня и через неделю.Мерзкая гадина ломала себе лапы с завидным постоянством...\n- Доброй ночи...Что опять Марсик...Да...Дама, выбросите его в помойку.\nТуда отправили другого водителя... Отдельного внимания заслуживают выставки зверей. Хозяева породистых животных рубят бабки на происхождении и заклеймованных письках питомцев. Если бы питомцы знали об этом, революция была бы неизбежна. А так они вместе с хозяевами бегают по кругу и показывают спеам свою охуительную пушистость, вызывая восторг у первых и слезы радости у владельцев, то есть у вторых. Я жду, пока эта ярмарка тщеславия наконец закончится, чтобы погрузить коробки с мелкими собаками в авто и развезти их по домам.\n- Что я тут делаю. - Внеочередной укол в туалете заставляет на время забыть об этом... Мой телефон молчит уже второй месяц, звонят только на служебный, скоро я изучу язык зверей... Самое неприятное, это когда у тебя в машине умирает пес. Собака умирает благородно и с достоинством. Своим взглядом она словно извиняется, что доставляет неудобство и до последнего вздоха смотрит тебе в глаза. Как то раз я взял такого пациента. Белого бобтейла с раной в животе и торопясь развернулся на сплошной,мне очень хотелось довезти его до больницы.\n- Водитель номер остановитесь.\n- Сука.\nВальяжно и слегка приседая ко мне подошел дпсник.\n- У меня собака умирает,поэтому и нарушил.\n- Собака че освобождает от ответственности чтоле. - Тон был хамоват,и очень захотелось дать в морду.\n- Берите документы,делайте че там надо.\nЯ остался сидеть с псом и пока он не умер, держал руку у него на спине.\n- Ну, ты документы то возьми, извини, что так вышло.\nСлезы душили меня, я молча забрал свои права и поехал, куда, это уже не имело значения. Чем больше я узнаю собак,тем меньше мне нравятся люди. За это время я много видел животных,которых добрые люди обваривали кипятком, отрезали им лапы, выжигали глаза и творили прочие мерзости. Постепенно вопрос что я тут делаю перешел в другой - а зачем так все происходит. Воспаленный от постоянных уколов мозг отказывался принимать информацию и делать хоть какие то выводу. В свободное время я сидел на крутящемся табурете в клинике, запершись в лаборантской,  и вовсю использовал спиртовую горелку.\n- Иди сюда, помоги, тут пса на усыпление привезли. - Старый мастино неаполетано трясся и видимо понимал что сейчас будет. Хозяйка лила слезы в три ручья , - иди отсюда. - она с воем выскочиа в коридор.\n- Так, хороший, успокойся. -  изловчившись мы вкололи ему снотворного. Еще десять минут пес ходил, скулил и прикладывался на пол. В конце концов он заснул.\n- Теперь бери баян вон наполни той жидкостью...\nВсе эти сказки про то что животных усыпляют, и они умирают с улыбкой на морде - пиздеж. Усыпляют их так: сначала накачивают снотворным, потом колят в вену раствор содержащий всякую хрень, забивающую им артерии и сосуды сердца. Если животное не умирает, процедуру повторят. Единственный момент - все это происходит во сне. Но, в моем случае, пес жил еще полчаса. И ему было больно.\n- Все, иди, завтра в крематорий отвезешь.\nЕсть еще одна услуга в зоотакси - это собирать дохлый псов по городу и отправлять их на планомерное сжигание в печи. Я как раз годился для такой работы, ибо уже был похож на смерть и весу во мне было 45 а может 46 кг. Набив машину ароматными трупами, я решил завернуть к барыге и слегка взбодриться. Героин был адов, и добравшись до машины я понял, что если не посплю хотя бы час, то ближайшим адресом куда я приеду, будет стена дома во дворе.\nПсы были словно деревянные и мне пришлось потрудиться,чтобы соорудить из них некое подобие кровати. Запах уже не смущал, поэтому мы поспали заебись. Крематорий был к моменту пробуждения открыт,машину мне надо было отдать сменщику через два часа.\n- Простите мои дохлые друзья.\nВсе отправились в канаву, и я поехал проветривать автомобиль. Я уже написал, что благодаря этой работе как-то по другому стал смотреть на животных и людей. Однако то, как я успел опуститься за эти два месяца, довело меня до желания вздернуться. Глубоко ночью в дороге мой телефон зазвонил\n- Надо приехать в клинику и забрать.....только быстрее...где тебя носит...\nСтоп, дальше притворяться в то что я живу, сил не было. Я резко развернулся и поехал домой. Машину оставил у памятника Пушкину, позвонил сменщику и сообщил где можно забрать авто и деньги. Желтая жилетка отправилась в бак. Я собирался сдохнуть\n________________________________________\n_____\nСпасибо за внимание тем, кто еще умеет читать.\n"}, {"path": "data/lj_export_clean/posts_md/54177__давайте_делится_-_вкусы_они_вообще_разные_или_всем_нравится_одно_и_то_же.md", "source": "LiveJournal", "date": "Unknown", "filename": "54177__давайте_делится_-_вкусы_они_вообще_разные_или_всем_нравится_одно_и_то_же", "content": "# давайте делится - вкусы они вообще разные или всем нравится одно и то же?\n*Date*: 25 мая 2010, 00:42\n*URL*: https://olymarkes.livejournal.com/54177.html\n\nРаз уж тут весна, май, вся фигня - рассказывайте, каков он - ваш идеал.\nНу типа человек, с которым вы бы хотели объявить себя парой и заселится в отдельный домик, ахаха. Ну или хотя бы на кого вы на улице обернетесь ))\nпро мальчика\n1. Внешность\n\"Героиновый шык\" - это не в моем вкусе. Мне нравяцо подтянутые крепкие мальчики, ну чтобы могли мед", "full_content": "# давайте делится - вкусы они вообще разные или всем нравится одно и то же?\n*Date*: 25 мая 2010, 00:42\n*URL*: https://olymarkes.livejournal.com/54177.html\n\nРаз уж тут весна, май, вся фигня - рассказывайте, каков он - ваш идеал.\nНу типа человек, с которым вы бы хотели объявить себя парой и заселится в отдельный домик, ахаха. Ну или хотя бы на кого вы на улице обернетесь ))\nпро мальчика\n1. Внешность\n\"Героиновый шык\" - это не в моем вкусе. Мне нравяцо подтянутые крепкие мальчики, ну чтобы могли медведя голыми руками ну или хотя бы 5 раз подтянуться. Рост около моего.\n2. Обвес\nТатуировки - да, пирсинг - ну так, дреды - ну смотря как он за ними следит.\n3. Прикид.\nХипстеры мне не очень нравяцо - адепты секты журнала Афиша. Главное в человеке это обувь, конечно. И эта обувь - кеды. Gravis, Supra - высший пилотаж. Конверс - классика, любые скейтерские - неплохо, Найк и Рибок в основном арэнбишная попугаечность, но лучше чем туфли.\nМне нравяца парни \"на скейтерском\" - чтобы одежда была простая, удобная, недорогая, но при этом красивая. Animal, Burton, Analog, Volcom, Matix, DC -  все эти бренды делают хорошие вещи и для телок и для мужыков.\nСумка Gravis лучше чем рюкзак Dakine. Часы  Nixon лучше чем  G-shock. Браслеты из кожи лучше чем фенечки. Подвеска из черной кости лучше чем бусики.\n4.  Богатый внутренний мир/род деятельности\nМне нравяца безработные раздолбаи, но не сидящие на родительской шее, а живущие на свои гонорары ))  Нравяца бедные музыканты поэты художники диджеи фотографы прорайдеры звукорежиссеры актеры театров\nесли слушать, то лучше русский рэп чем американский, дабстеп и дансхолл лучше чем транс и минимал, Ленни Кравиц  лучше чем Депеш Мод. Радио Максимум лучше чем Наше радио. АК47 - стопудова нет. 2h company - стопудова да.\nЛюбить книжки лучше, чем ничего не читать. Менс Хелс лучше чем Maxim.\nбыть чистым лучше, чем курить, бухать и торчать.\nно лучше бухать и курить, чем быть занудой.\nВерить в любую высшую силу лучше, чем не верить вообще.\nДевочки.\n1. Внешность\nЗдоровая, мягкая, женственная - минимум косметики и обвеса, телосложение не имеет значения, я люблю в женщинах внутренний свет и ощущение  что это существо спокойно и счастливо.\n2. Обвес\nТатуировки очень редко мне нравятся, только у девушки Бро - Светы. Вот у нее крутые ) Дреды - да, пирсинг - нууу.... Бывает и красивый.\n3. Прикид\nТапочки, мягкие мокасины, кеды конверс, балетки, сапожки  без каблука. Круто когда девушка может побежать за автобусом или за мечтой, там ))\nда все что угодно )) обожаю девушек которые одеваются как девушки, а не как тети. Лучше больше одежды, чем меньше. Девочки на хип хопе - моя особенная страсть, если при этом они не теряют женственности в повадках. Этно наряды мне не очень, но бывают исключения.\n4. Внутренний мир.\nДдя меня женская душа - потемки. Я и в женскую дружбу с трудом верю, и вообще слабый пол не очень хорошо понимаю, у меня всю жизнь с чуваками лучше дружить получалось. Но если бы я выбирала себе девушку - я бы хотела, чтобы она была сильной - это обычно девушки, которые занимались/занимаются спортом или катаются на чем-нибудь.\n﻿\nМожно написать только про противоположный пол! )) или выкладывать фотки, если вы уже нашли.\n"}, {"path": "data/lj_export_clean/posts_md/57908__воруй_убивай.md", "source": "LiveJournal", "date": "Unknown", "filename": "57908__воруй_убивай", "content": "# Воруй! Убивай!\n*Date*: 26 июня 2010, 11:18\n*URL*: https://olymarkes.livejournal.com/57908.html\n\n***\nГород просыпается за окном моей квартиры на Ботанике, а я слушаю сведенную песню «Снег и Пепел». Очень мне нравится. Такая нежная, свежая.\nМеня затянуло в водоворот – поэтому я так долго не писала. Съездила в Ижевск с Юлей. Обратно мы возвращались автостопом. Поймали большую фуру прямо до Екатеринбурга, читали газету Дальнобойщик и ели сухари.\nКогда-нибудь я напишу статью про веселый хичхайкинг.", "full_content": "# Воруй! Убивай!\n*Date*: 26 июня 2010, 11:18\n*URL*: https://olymarkes.livejournal.com/57908.html\n\n***\nГород просыпается за окном моей квартиры на Ботанике, а я слушаю сведенную песню «Снег и Пепел». Очень мне нравится. Такая нежная, свежая.\nМеня затянуло в водоворот – поэтому я так долго не писала. Съездила в Ижевск с Юлей. Обратно мы возвращались автостопом. Поймали большую фуру прямо до Екатеринбурга, читали газету Дальнобойщик и ели сухари.\nКогда-нибудь я напишу статью про веселый хичхайкинг.\n**\nЗдомский дал мне свой\nWe\nThe\nPeople\nи я катаюсь катаюсь катаюсь, торчу на улице, в\nэкстримальном лагере на «Волне»,\nна Уктусе\nили на Драме. Мне как будто снова 16 лет – возвращаюсь домой в 3 часа ночи, встаю в 8 или в 9 утром – то на вокзале ребят встречать, то бегать, короче дома мне не сидится.\n*\n**\nЗато у меня закончился творческий кризис – я написала песню, которую хожу и пою сама себе уже неделю. Такая тема, просто АААААААААА.\nЕще мы за последние месяцы написали несколько ржачных тем, типа «Шевроле Ланос» и «Воруй – Убивай». Сидели в гаражном комплексе на студии\nЛеши Маэстро\n, смеялись, пили халявный Ред Булл , записывали демки – я думаю, надо будет выпустить такой андеграунд-дисочек, там мы по любому будем петь все припевы хором.\n**\n*\nВообще поездка в Екатеринбург вышла плодотворная, у меня уже который день болят все мышцы тушки, еще я ходила жутко злая последние несколько дней, раздражаясь на все на свете – и это так весело сейчас вспоминать свои истерики.\nПро то, как мы с Пашей ссоримся надо снимать кино.\nТо он выходит из машины, снимает с себя всю одежду, кидает ее оземь и идет по трассе в свете фар, под ливнем. То танцует мне крамп, объясняя мне что я не права. А вчера было шоу у входа в «Волну» - это база в заречном, где проходит\nFuture\nFest\nи лагерь\nUral\nOpen\n.\nНа воротах поставили охрану, а Паша забыл браслетики взять у организатора. И вот мы стоим 10 минут ждем, нас типа должны встретить.\n- Мы что сюда, постоять приехали?!*?!?! – я раздуваю ноздри, сжимаю кулаки, из ушей моих идет пар.\n- Да идет он, идет!\n- Никто не идет. ДА ВООБЩЕ Я. НИКОГДА. НЕ ЖДУ. У ВОРОТ. Все пока.\n- Оля, выключи блондинку. – Паша снисходительно улыбается\n- КЛЮЧИ ОТ МАШИНЫ!\nПаша отдает мне ключи и я быстрым шагом иду на стоянку. Сажусь в тачку, разворачиваюсь, проезжаю пару метров до середины перекрестка, тут подходит Паша и начинает что-то говорит в окно справа от меня.\nСлева от меня на обочине стоит машина ДПС, гаишник с палкой. Справа – охрана проходной, народ какой-то. Мы стоим в центре арены )\n- На хоть еду с собой возьми. – он достает из рюкзака пачку творога, бутылку молока и йогурт и через окно складывает мне их на пассажирское сидение\n- ДА БУДЬ ОН ПРОКЛЯТ ЭТОТ ТВОРОГ!!!!!!!!\n- я беру и по очереди выкидываю вышеперечисленные продукты в свое окно, резко даю по газам под крики ДПСника: «ЭЭЭЭЭ ТЫ ЧТО ДЕЛАЕШЬ!?»\nЧешеца лоб – режутся рога, я вдавливаю педаль в пол и смотрю в зеркало заднего вида.\nПаша поднимает с земли бутылку молока\n- АХ ТЫ СУЧКА!!! – с этим криком он запускает мне в след эту бутылку с такой силой – просто претензия на новый рекорд в метании ядра )))\nЯ еду и смеюсь. Паша тоже потом сказал, что он давно так не веселился – потом ДПСник даже помогал ему найти молоко.\nНу это даже не ссора, а наоборот – что то такое настоящее и страстное ))\n)\nЗабрали мелкого сына Леши Маэстро и Ани, съездили на богемный пикник на дне рождения Наташи Втюриной\nvturina\n– это все было вчера. И\nтак каждый день – никакого покоя.\nРубрика «Нам Пишут»\nОт кого:\nДиляра Бадретдинова\nКому:\nОльга здесь никого нет Маркес\nТема:\n...\nСообщение:\nя тебя знаю какбэ, ты меня нет.\nты классная и я тащусь от твоего творчества и тебя. вообще я, наверно, люблю тебя, но не сейчас. циничная дура гавном залила твиттер, жж, все списывает на пмс (может там еще какая-нить херня типа людей-зверей, больного желудка и т.п.).\n\"не плоди ненависть\" забыла??? тебя окружает не это дерьмо.\nты же, блядь, такая счастливая.\nлуна на всех действует: на моря, зверей, женщин и мужчин тоже. взбодриться:\nАудиозапись: ●•●•Nesquik - Shake this●•●•\n___________________________\nМне очень нравица песня 2\nhcompany\n«Мне нужны враги», советую послушать ее всем, кто считает меня ёзовой зайкой с пуфыстыми уфками.\nНа самом деле «циничная дура» - в моем случае это даже комплимент. Я вообще г*вно человек. Мой жж, твиттер, усы и хвост созданы именно для того, чтобы разочаровывать вас, мои уважаемые незнакомые почитатели.\nА как же эти чудесные, добрые песни?! – спросят меня они.\nА песни -\nэто не мои сочинения. Мне их ангелы на ушки нашептывают. От этого я не становлюсь святой – скорее наоборот, легко в такой ситуации стать лицемером и начать врать себе, что я лучше, чем я есть на самом деле.\nХоть в эту блажь я не впадаю, слава Богу.\nЗа окном ни облачка, мы поехали загорать и купаться )) всем чудного лета!\n.\n"}, {"path": "data/lj_export_clean/posts_md/80220__шоутайм.md", "source": "LiveJournal", "date": "Unknown", "filename": "80220__шоутайм", "content": "# Шоутайм\n*Date*: 24 октября 2016, 03:16\n*URL*: https://olymarkes.livejournal.com/80220.html\n\nЛечение заняло много времени. Реабилитация проходит и по сей день. Участники не знают о своей роли, зрители не замечают перемен - быть может только самые внимательные. Главные битвы всегда происходят внутри тебя, парень, и никто не может оценить ни потери, ни преференции. they just донт гив э фак, и слава богу\nОчень важны удобные штаны. Черт возьми, и кроссовки. Осутствие лишних головных уборов на голов", "full_content": "# Шоутайм\n*Date*: 24 октября 2016, 03:16\n*URL*: https://olymarkes.livejournal.com/80220.html\n\nЛечение заняло много времени. Реабилитация проходит и по сей день. Участники не знают о своей роли, зрители не замечают перемен - быть может только самые внимательные. Главные битвы всегда происходят внутри тебя, парень, и никто не может оценить ни потери, ни преференции. they just донт гив э фак, и слава богу\nОчень важны удобные штаны. Черт возьми, и кроссовки. Осутствие лишних головных уборов на голове, мэйка - мы едем и ооооочень громко ржем. Я еду свернувшись улиткой на двух сидениях бусика. У меня есть шерстяные носки и закат за спиной. Я пишу другу фифтиценту, что эта гостиница в Казани почему-то связана с ним, а еще - я проебала его день рождения на один день, черт возьми как важно иногда поздравить кого-то, даже если не вовремя. Мы танцуем две ночи подряд в Соли - это название места, не переживайте так - конечно, не спим - и сразу на концерт. А потом аэро аэроо аээээроооооооууууу…. Две ночи без сна, черт возьми триии да да сразу же три идеальных концерта.\nЯ не знаю, о чем говорит наш фанклуб, но иногда фант\nазирую. Что они такие переписываются: «О, мне кажется Оля ожила и начала получать реальный кайф на сцене, как это было раньше». «О, мы заметили что чуваки стали тусоваться вместе, кажется они притерлись друг к другу и даже чувствуется, что это - группа».. Может быть вообще они не говорят о группе.. Или о том, что с нами происходит. Но я бы говорила.. Я бы очень хотела, чтобы мой любимый бэнд снова играл не ради бабла или расписания или из чувства вины и нежелания что-то разрушить.. Мне бы хотелось, чтобы они любили то, что делают, чтобы это было настоящим от начала до конца.\nЯ вообще не имела никакого представления о музыке так, как видел ее ты, мой дорогой друг из alaioliF. Для меня все эти туры были вообще как в тумане, потому что я была крайне эгоцентрична. По большей части я была сосредоточена на том, какое я говно. И пою я плохо, и выгляжу плохо, и звук говно, и голос постоянно садится… Короче желание было только одно: выжить. Но я, на самом деле, молодец. И была отчасти сама кузнецом своего счастья.. От покупке инэйров (та штука, которая у меня в ухе) и любимой shure 57b до стоившего мне кругленькой суммы и двух
