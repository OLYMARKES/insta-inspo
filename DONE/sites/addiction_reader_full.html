сего дальше ты никуда не пойдешь. Потому что мне некуда тебя звать, кроме этого второго уровня - там все просто, бытовое просветление с принятием себя, других и высшего смысла. Там у тебя все будет получатся - и ты будешь рад и бесконечно успешен, и перед твоим носом всегда будет свежая морковка, принимающая самые разные формы - путешествия, работа над собой, развитие твоих детей, эмиграция - да что твоей душе будет угодно. Тебе хватит на всю жизнь, уверяю.\nДальше я никого не зову.\nЯ просто оставлю это здесь, потому что так принято.\nЗа тобой могут и не прислать - so happy you are! -  и ты успеешь долгое время провести в гамаке матрицы, которая так мягко прогибается под тебя. Но если эти понятия уже клокочут в тебе, ты никак не отвертишься. Просто на этом месте остановись, и не читай дальше -  не надо. Это будет здесь, и оно дождется своего часа.\nСлова - это некая условная договоренность, которая позволяет не выходить за рамки. И тот самый миф о вавилонской башне - он об этом. Пока мы говорим и общаемся словами, мы находимся в крайне узких рамках, в - опять это слово - матрице понятий, где все совпадения и взаимодействия возможны в самой примитивной форме, если конечно think big - да, это все равно самая примитивная форма. Укладывать суть в слова, в предложения, в рифмы - это как пытаться нарисовать картину, не имея нужных красок. Как пытаться сфоткать на айфон небоскребы вдалеке. Да, что-то получается - но получается хуйня, если быть объективным. Так вот, человечество буквально за два десятка лет на моих глазах создало альтернативную реальность, где think big не может проявится никаким образом. Здесь общение возможно только посредством слов и картинок, и для того, чтобы было удобно - мы все приняли молчаливое соглашение о том, что текст и картинка являются абсолютно достоверным отображением реальности. Мы решили «ну в конце концов, мы же все знаем как это - если про это написали и сняли, я могу это почувствовать и понять - и этого достаточно». И я действительно попробовала искренне в этом жить, и погрузится в это на сто процентов - и у меня даже получилось.\nНо потом я стала чувствовать, что что-то не так.\nЯ никогда не дернусь с места, пока мне не станет мучительно неудобно сидеть. Пока нога не затечет до предела, пока не заболит спина. И вот так я переключалась с айфона на ноутбук, с соц.сетей на кино, с твиттера на инстаграм - переминаясь с ноги на ногу, старалась остаться на месте. Потом все вообще разделилось - я начала чувствовать, когда  я просыпаюсь, и внутри меня в моем сознании какой-то хоботок тянет меня к телефону, чтобы присоединится к потоку информации и наполнить мое существо каким-то совершенно не нужным мне треском. Потом я начала видеть, как все что идет через экраны - это иллюзия и проекция. Я перестала чувствовать эту негласную договоренность, что «аккаунт человека и есть человек». Но все это все еще вызывало чувства - чувства и иллюзию работы, развития, включенности. Да, тогда я уже осознала потребность включенности, и увидела, что моя включенность - это включенность не туда.\nИ тогда я начала пробовать включатся в другое. Не во что-то особенное, а вообще во все, что не является монитором. Это не должен быть один процесс, предмет или существо. Это должно быть невербальное многообразие - так я почувствовала. И я увидела что история начинается тогда, когда я выключенна из информационных потоков какое-то продолжительное время.\nМногие чувствуют похожий зов и удаляют все соц.сети, но потом возвращаются - я видела это, это не так работает. Пока ты отказываешься от чего-то - оно владеет тобой. Нет, не так. Не так.\n«Ведь какие идиоты вокруг. Они полагают, что система — это Путин. Или Обама. А если очень уверены, будто система — это ФРС и Йеллен-шмелен.\nА система — это светящийся экран на расстоянии шестидесяти сантиметров от глаз. С которым мы трахаемся, советуемся и интересуемся, какие для нас сегодня будут новости. Путин, Обама, Йеллен — это на нём просто разные картинки. А экран один и тот же... Мы думаем, что экраном управляем наполовину мы, а на другую половину спецслужбы, но на самом деле сам экран уже давно управляет и нами, и спецслужбами. Вот что такое система. И как, спрашивается, с ней бороться, если про борьбу с ней мы читаем на том же экране?»\nЭти и другие интересные вопросы начинает задавать тебе тот голос, который ты уже с интересом слушаешь. Чем больше противоречий и сложных вопросов - тем лучше. Только вот ты совсем перестаешь разговаривать и рожать слова - потому как вопросы в нем уже с трудом умещаются в матрицу. А если бы ты и мог об этом поговорить - тебе бы все равно было бы не с кем, отвечаю. Скорее всего кто-то бы поддакивал тебе на все твои конструкции, а кто-то бы говорил, что это все полная хуйня.\nТак вот, здесь ты остаешься с этим один на один, но тебя это уже совершенно не парит.\nЯ очень не хотела быть отшельником, поэтому с радостью здесь бы посмеялась над всеми нумерологиями и арканами, которые говорили мне о том, что сие ест моя судьба. Все это квазинаука, и хуйня, и методология для исследований ограничена - факт. А почему я не хотела им быть? Вот это самый интересный вопрос, на который я сейчас не могу ответить однозначно.\nТолько вот всплывает в голове статья о йогах, которые в 20 лет объявляют себя садху, а автор статьи их порицает - типа как ты можешь отказаться от чего-то, не поимев это во всей его полноте? Так, мол, не считается. Автор русский, кстати. Так вот, все вещи в этой жизни отваливаются от меня через присутствие, а не через принятие отсутствия.  Боже, неужели кто-то дочитал до этого места? Так вот, ни одна из тех вещей, которыми я обладаю, никогда не были моей морковкой. Ну, разве что тело - но через эту борьбу мне вообще многое открылось, надо было это пройти. А все остальное получилось на другом пути - кстати об этом тоже много историй, даже детская «Дорога с облаками» - на 100% об этом. Львенок (или кто там был?) идет в неведомую пустоту, по пути находит друзей, но возвращается все равно один. И типа немного грустно, но life is at it is. Так вот, может сейчас ты не хочешь остаться в одиночестве на своем пути - но тебе обязательно понравится, когда будет на то время.\nПочему? Потому что там нет слов. Потому что реальность не укладывается в фото и в код, как ты ее не вмещай, и тебя перестает это удовлетворять. Ты не можешь это не производить, ни есть, ни употреблять. Но очень много всего другого - что просто сметает своей волной мусор. Звуки, действия, эфир - то, что невозможно оцифровать и опошлить. То, что люди так и не смогли понять, познать и изучить из-за ограниченной методологии, божественное, непознанное - то, что они не смогли (и тем успокоились) перенести в этот новый уютный ограниченный мир знаков, слов и пикселей - все оно пренадлежит тебе каждую секунду, пока ты готов пропускать это через себя, пока ты готов познавать и чувствовать, не обличая это в текст.\nТут есть и свои издержки - все не так радужно, ни борьба, ни чувства - все никуда не уйдет. Все истории мира - они все еще про тебя. Вся боль - твоя боль. Все такое же беззубая неспособность постоять за себя, потому что не хочешь вляпываться в говно, поэтому ты периодически оказываешься в нем с ног до головы - потому что тебя все еще ненавидят другие, а ты такой стоишь, терпишь и молчишь, хотя всегда есть, что сказать.  Если сила в правде, то я должна добавить - сила в той правде, которая скрыта от всех глаз. В правде, которую не достали как козырь из рукава.\nИ есть, конечно, свои плюсы. Тебя никто и никогда не заставит отказаться от чего-то, что тебе не нужно. Ты продолжаешь этим обладать. Ты не переходишь с уровня на уровень - ты присутствуешь одновременно на всех, более того, ты понимаешь зачем это нужно - и продолжаешь действовать, только уже с кристальной ясностью.\nИ конечно, с каждым, кто тебе интересен и нужен ты всегда сможешь поговорить на его языке, на языке его понятий и суждений - потому что они понятны тебе, потому что ты знаешь, что все они - об одном. И вербальное тебе все еще интересно, и ты все еще привязан и любишь, и хочешь - это никуда не уходит, вся эта прекрасная человеческая природа - никто у тебя ничего не забирает. Почему мне не говорили раньше этот секрет? Ах, да. Просто некому было.\nТы остаешься во всех местах, ты не отказываешься и не уходишь (все эти халдейские маски - всего лишь удачная метафора). Но есть другое место, в котором тебе хочется быть сильнее всего, и ты можешь быть там в любую секунду. Но об этом я вам рассказать уже не смогу.\n"}, {"path": "data/lj_export_clean/posts_md/2017-03-21__81962__0000.md", "source": "LiveJournal", "date": "2017-03-21", "filename": "2017-03-21__81962__0000", "content": "# 0000\n*Date*: 2017-03-21T00:48:00+00:00\n*URL*: https://olymarkes.livejournal.com/81962.html\n*Tags*: #000000, #sekta\n\nО темном рассказать значит. Я могу. Я тоже люблю снафф, но что-то говорить об этом не такой уж кайф. Наверное потому, что слабость показывать не хочется тем, кто будет ей рад, этой слабости. В подобном режиме по любому обрастаешь такого рода хэйтерами, которые вроде как-бы даже не чужие люди, но настолько искренне радуются, когда тебе плохо, что тебе становится даже немного стыдн", "full_content": "# 0000\n*Date*: 2017-03-21T00:48:00+00:00\n*URL*: https://olymarkes.livejournal.com/81962.html\n*Tags*: #000000, #sekta\n\nО темном рассказать значит. Я могу. Я тоже люблю снафф, но что-то говорить об этом не такой уж кайф. Наверное потому, что слабость показывать не хочется тем, кто будет ей рад, этой слабости. В подобном режиме по любому обрастаешь такого рода хэйтерами, которые вроде как-бы даже не чужие люди, но настолько искренне радуются, когда тебе плохо, что тебе становится даже немного стыдно перед ними, когда ты слишком долго счастлив. Я всегда думаю, что у них просто сломался режим нормальной работы: жить своей жизнью, не оглядываясь на других. У меня вот получается, потому что всегда вокруг меня было слишком много людей талантливее, умнее, красивее - в какой-то момент я поняла, что если сравнивать себя с ними - лучше сразу сбросится со скалы. Сравнивать себя с дном вообще не бодрит, а с себе подобными - тем более пустая трата времени. Я придумала себе, что у меня своя игра, и я в ней - Марио, и мир движется под моими пиксельными ножками. И вот мир до сих пор как-то крутится, хотя я никогда не была лучшей певицей, или тем более лучшим учителем йоги, фитнес-гуру, бизнесменом и телочкой - но вот моей доли мне всегда было достаточно. Мне никогда не было мало. Это удовлетворенность имеющимся тоже дико бесит некоторых людей, как я замечаю. То есть некоторым людям кажется, что ты обязательно должен страдать, потому что у тебя мешок, а не два мешка. А если ты рад своему мешку, то ты хвастаешься и пытаешься унизить окружающих своей мерзкой удовлетворенной рожей.\nОптимистов мало, но мне повезло иметь это качество от рождения. Это - естественная анастезия, но она работает, только когда я живу в чистоте и еще до кучи пишу шаги. То есть труда это все таки требует. И вот я замечаю, как раздражает многих мой оптимизм. Как я могу жить, если в перспективе все обязательно скатится в говно? Все, что я делаю, все мои мечты, все мои планы и начинания, и в конце концов и я сама - умру, да. И потом никто обо мне не вспомнит. И меня совершенно это не пугает. Например мысль, что\n#sekta\nне вечна. Или то, что на концерт Alai Oli однажды придет 10 человек. Что возможно в старости дети оставят меня, свалят в LA, а я буду продавать свои книги у метро Восстания - даже это не пугает меня сейчас, и не отравляет мне жизнь. Я знаю, что потом - то потом. И потом я обязательно найду новые смыслы и новую опору: так было всегда. А декорации не имеют значения. То, что происходит сейчас - не про вершину горы, и не про «достигать». Это - про празднование момента, и я его праздную, даже когда ничего не достигаю. Поэтому радость моя никогда не зависит от того, что я имею. Она зависит от того, как я к этому отношусь.\nНо все таки случилось со мной такое, что выбило меня из седла. Вообще с такой силой, что я долго не могла вдохнуть - хотя, конечно, вид старалась не подавать. И конечно я жила, и не кое-как, а даже как-то, и что-то делала, требыхалась, перебирала лапками, бежала.. Когда первая сильная боль прошла, схлынула, показалось даже, что все на своих местах. Потом прошел целый год, и вот только через год ритм стал совсем другой, и получатся стало по другому, и счастье набрало обороты - так, что снова все живое как будто начало само тянуться. Как в диснеевских сказках, знаете? Когда природа играет с тобой. Только со мной не природа играет, а все, что связано с человеческим. То, как я чувствую людей - как я сливаюсь с ними, и развиваю их, и творю с ними, как раскрывается их талант и потенциал, как удается расти с ними и отпускать, чтобы образовать новые связи - все это всегда было, но вот этот год - не было. Этот год меня после нокаута приводили в себя мои настоящие друзья в углу ринга. Андрей, Юля, Лиза, конечно в первую очередь они…  Они, конечно, видели, что со мной было на самом деле. Всю эту открытую рану.\nТы можешь быть каким угодно человеком, но это никак не убережет тебя от боли. Вопрос, наверное, в том, как тебя это изменит.\nВся эта история была связана с близкими мне людьми: с девочками, которые были со мной и в моем сердце еще до\n#sekta\nв том ее виде, в котором она появилась 4 года назад. Но начинали мы ее вместе, и все что мы сделали вместе в самом начале - это было настолько тру, что вот ни на секунду мне не стыдно ни за себя, ни за них.\nНо потом это стало работой, и все что происходило дальше - можно по разному интерпретировать, рассказывать эти истории с обидой или без нее, с моей правдой или с правдой другой стороны. Но для меня это было уже вторично.\nСначала я долгое время жила с предчувствием пиздеца. То есть это наверное когда ты уже в нем, но отказываешься видеть правду. Но потом уже боль становится такой сильной, ты уже не можешь закрывать глаза на все происходящее, и рубишь. Делаешь это, вполне понимая, что будет потом.\nВ тот момент\n#sekta\nбыла главным в моей жизни источником кислорода. И даже не со стороны учеников - а со стороны команды. Каждый, кто работал у нас, был в моих глазах супергероем, монахом шаолинь, немножко святым, немножко волшебником… И когда я смотрела на них, я думала: даже если этот мир существовал бы только для них - это бы того стоило.\nИ когда я уволила девочку, которая была для меня одним из важнейших людей в этой системе, я совершила один из самых важных поступков в своей жизни. Могу ли я работать с человеком, которому я больше не доверяю, зная, что оставить все как есть - это более выгодно, более правильно с точки зрения бизнеса, с точки зрения экологии компании.. Да и конечно, с точки зрения всех людей, которые ни в чем не виноваты. Для которых она - идеальный босс. Самое альтруистичное и правильное - схавать свое дерьмо, прописать условия в трудовом контракте, контролировать и работать дальше. Но я не смогла. Я не смогла поступить конструктивно, потому что в этом деле изначально все было не так… Не на этом построено. А как раз на доверии и любви. Если я не доверяю - ничего не работает, я не могу.\nЯ приняла решение, и я за него расплачивалась. Мне было больно и от него, и от всего, что было вокруг. Меня возненавидела хорошая такая часть этих моих героев и волшебников, я стала для них чистым злом. И было бы пофиг, но эти люди уже были в моем сердце, поэтому было совсем не пофиг. Было больно. И я все понимала, что ненавидят они меня справедливо, и понимала, как это выглядит, и как это вообще на самом деле. У меня - своя правда, и никто не обязан с ней соглашаться.\nСамое дерьмовое во всем этом, что у меня совершенно не было ни сил, ни желания что-то делать в том режиме, в котором мы делали раньше. И я не думаю, что от\n#sekta\nчто-то бы осталось, если бы не Лена Дегтярь, если бы не Женя Копытина.. Ну и еще больше 100 человек, которые просто решили, что для них важно сохранять огонь, даже если Хаул стекает со стула и не может пошевелить пальцем.\nМы теряли учеников, сокращали штат, и все это время я искала новые силы и новые смыслы делать это дальше. Я могу делать и так, но это никогда не будет обладать той же невероятной силой притягивать правильных людей и делать магию на ровном месте. Мне не интересен просто бизнес…Я хочу летать. И это именно про ощущение, про состояние души, когда ты делаешь свое дело и чувствуешь, что все идет правильно.\nЖалею ли я? Конечно жалею. Мне очень больно терять людей навсегда, больно рвать по живому, перечеркивать все хорошее что было, и оставлять в памяти только какую-то открытую рану на месте, где раньше жила радость от мыслей об этих людях.\nСожалею ли я о том, что сделала это сама? Нет, потому что ощущаю неотвратимость всего, что произошло. По другому быть не могло: каждого из нас в один момент ставит перед этим выбором, и я всегда поступаю так, как чувствую. Даже если мир рухнет, я буду знать: в тот момент надо было сделать именно так. Мы молились лишь о знании его воли, и я всегда знаю его волю. Это поступать по своей совести, а не по чужой. Тогда ты получишь свою жизнь, а не чужую.\nЯ знаю, что вместе с этими людьми я была сильнее. Без них - слабее. С ними я была успешнее - без них, возможно, я никому не нужна. Что ж - если так, то так. Я готова, чтобы у меня осталось только моё, даже если моё - это совсем ничего, самый круглый ноль.\nВесь этот год я искала твердую почву под ногами, и благодаря этому успела сделать множество важных вещей. Люди вокруг меня тоже сделали очень много, и конечно есть  побочный эффект, не подпускаю я их слишком близко, любуюсь издалека. Не привязываюсь, но стараюсь давать не меньше, чем давала тем, кого успевала слишком сильно полюбить.\nЗа этот год я еще больше полюбила суть того, что мы делаем в\n#sekta\n, именно любовь к делу помогла мне встать на ноги. Даже если не будет компании и команды, я найду, куда применить эту любовь. Пока будут люди, которым интересно это делать вместе со мной - мы будем это делать. Пока они рядом со мной - они моя опора, они моя основа.\nВажно опираться в этой жизни на тех, кто с тобой. А не на тех, кто не с тобой :) Просто КЭП, но как же тяжело до этого было дойти. Место этих людей в моей жизни - пусто, никто его не занял и не займет. И я знаю, что вы читаете. Не думайте, что я собираю вас по частям, как у Быкова в стихотворении.. Нет. Я знаю вашу уникальность, вас никто никогда не заменит. И все хорошее, что мы сделали, все, что было у нас - оно останется в прошлом, останется в фундаменте. Не обесценится и не потеряет свою значимость. И мне до сих пор больно, и я думаю, что еще не скоро отпустит совсем - потому что первый раз в жизни после большого взрыва я не хочу забетонировать эту рану и поставить на ней табличку «мне насрать». Я не хочу забывать хорошее, и поэтому я готова проживать и все, что является продолжением. И я знаю причину, почему ничего нельзя исправить: все мы стали другими людьми.\nОказывается, у меня все еще много места в сердце - оно не становится меньше, и все еще открыто для новых людей. Я так же влюбляюсь в них, очаровываюсь, просто больше не навешиваю эту любовь тяжкой гирей. Никто не может вынести мою любовь, это факт.\nИ все вышенаписанное никак не отменяет того факта, что я ебанутая баба у которой black list прямо пропорционален размерам эго, и смотреть на меня лучше издалека, и дружба со мной похожа на дистанцию ironman - сомнительное со всех сторон удовольствие. Мой внутренний мир, который я показываю здесь - это крайне субъективная картинка, и лучше верить всему плохому, что говорят обо мне другие - чтобы совсем не отрываться от реальности. Во всяком случае я это повторяю себе, как мантру, чтобы не забывать о том, что мир по другую сторону моего скафандра может выглядеть совершенно по другому.\n"}, {"path": "data/lj_export_clean/posts_md/2014-02-21__79139__если_вдруг_тебе_интересно_как_у_меня_дела.md", "source": "LiveJournal", "date": "2014-02-21", "filename": "2014-02-21__79139__если_вдруг_тебе_интересно_как_у_меня_дела", "content": "# если вдруг тебе интересно, как у меня дела\n*Date*: 2014-02-21T20:07:00+00:00\n*URL*: https://olymarkes.livejournal.com/79139.html\n\nЯ стала мало писать, но истории повторяются. Они повторяются так, будто кто-то переписал их, чтобы я помнила откуда я пришла. Но что бы было уже не так жестко.\nМаленький самолет Милан – Марсель, мне кажется что он так быстро едет по взлетке, но на самом деле он стоит, это у меня шумит в ушах. И капитан стоит рядом со мной в проходе самолета.\n-\nIm really better,  sor", "full_content": "# если вдруг тебе интересно, как у меня дела\n*Date*: 2014-02-21T20:07:00+00:00\n*URL*: https://olymarkes.livejournal.com/79139.html\n\nЯ стала мало писать, но истории повторяются. Они повторяются так, будто кто-то переписал их, чтобы я помнила откуда я пришла. Но что бы было уже не так жестко.\nМаленький самолет Милан – Марсель, мне кажется что он так быстро едет по взлетке, но на самом деле он стоит, это у меня шумит в ушах. И капитан стоит рядом со мной в проходе самолета.\n-\nIm really better,  sorry…\nФранцузы улыбаются мне и подсовывают бисквиты.  Совсем не как те русские стюардессы в огромном белом лайнере Трансаэро, которые заставили меня подписать бумагу перед семичасовым перелетом, что я не возлагаю на них ответственность за свою жизнь. Мне было все равно, лишь бы улететь.\nИ здесь я думала только об одном, стараясь победить темнеющий эфир сознания: мне нужно лететь. Там, там у моря меня ждет маленький смешной человечек. И мне обязательно нужно к нему попасть, потому что я очень скучаю. Мне обязательно нужно обнять его, зарядится от этой теплой батарейки, чтобы снова отправится покорять мир.\nТогда меня никто не ждал. Никто даже не знал, что я приеду. Что я поменяла билет и валю из этой Индии прямиком в уральскую зиму.  Никто не знал, где я.  И тогда,  мне было плохо шесть с половиной часов из семи, я всерьез сомневалась, что я переживу этот перелет.  Меня лихорадило с температурой 41,5. Меня тошнило, как никогда в жизни. Но едва самолет пошел на посадку – меня отпустило, как будто ничего и не было.\nВ этот раз мне было плохо всего 5 минут. Всего пять минут, чтобы вспомнить, что мы приходим в этот мир одни и уходим одни. Что здесь ничего нельзя удержать – даже самого себя, даже свое я. Ты проваливаешься в пустоту, где ты совсем ничего не решаешь, потому что твое Я ускользнуло, как песок сквозь пальцы.\nПять минут, чтобы вспомнить, что как бы ты не привзывался, все твои нити будут разорваны в одну секунду. Поэтому нечего боятся, совсем нечего боятся. Тебе все равно придется, и там никого не будет. Только ты и вечность. Только вечность.\n***\nШанталь плавно выруливает по извилистой дороге вдоль причесанных, будто декоративных, гор. Мы едем в аэропорт Мариньян-Прованс. Ее микроавтобус слишком велик для меня одной, моего рюкзака и крошечной укулеле, но Шанталь – единственный таксист в Марселе, чей телефон записан у меня в записной книжке. Единственная таксист, я бы сказала. Она может встать даже в 4 часа утра, и за 15 минут до назначенного времени ее бусик будет урчать мотором за воротами дома. Ее сосредоточенный хвостик на затылке, очки.. Ей где-то около пятидести.  Как той таксистке из Израиля. Помнишь, Юля?\nКогда я стану старой бабушкой, мои внуки будут знать эту историю наизусть. Они будут говорить: «бабушка, но ведь ты рассказывала уже!», а я буду смеятся и рассказывать об этом дне.\nВ Иерусалиме шел снег. Темнело. Я бы даже сказала, что надвигалась ночь. Тьма, пришедшая со Средиземного Моря, накрыла ненавидимый Прокуратором город.\nМы стояли совсем одни на этой огромной площади перед Великой Стеной. Помнишь, там ведь вообще никого не было?  Шел снег. Снег в Иерусалиме – это катаклизм, если что.  Мы очень замерзли. Думаю у нас, как и у всех жителей этого города, не было теплой одежды. Но в отличии от них нам некуда было спрятаться.\n-\nПойдем в столовую для бездомных?\nТогда, уже на середине площади, повернувшись спиной к Стене, я так искренне пожаловалась тебе, что хочу бесплатного горячего чая, что ты согласилась даже на ту столовую. Но мы не дошли.  На ступенях нас схватил местный блаженный парнишка, даже не поднимается рука назвать его юродивым, который завязывает на запястьях туристов красные ниточки.  Он утащил нас в подвал, в самом сердце старого города, в мастерскую художника, посадил нас на диван и без слов начал колдовать у электрической комфорки, которая стояла у окна. Окно выходило во двор – колодец. На самое его дно.\nЯ оглядывалась вокруг. Это был не подвал. Просто город, который оседал тысячелетиями, ни на секунду не был предан.  Люди не оставляли свои дома,  и то, что могло бы быть археологическими раскопками, здесь все еще дышит теплом человека.\nВ древних камнях – электричество,  вода, телевизионная антена. Художник, не удивленный нашим приходом, мнет гашиш с табаком.\nПо телевизору показывали дорогу, которая ведет к нашему дому на Мертвом Море. Горы размыла вода, и они осыпались прямо на автострады. Некоторые камни лежали на разбитых машинах.\nТакое случается не часто, но все же случается.\n-\nOh, we need to go to the dead sea!\n-\nNo, you cant go, roads are closed… Stay here.  – равнодушно сказал художнк.\nНочью искать автобус было бесполезно. Но мы просто встали на остановке, и даже не успели замерзнуть до полусмерти – подъехал тот старенький белый микроавтобус.\nКажется, будто это была она – Шанталь. Такие же белые волосы с темными корнями, собранные в скромный понитэйл, даже такой же голос – низкий, теплый.\n-\nДороги до мертвого моря закрыты? Только не для меня. Видишь, нас не досматривают на блокпостах. Это потому, что у израильтян особенные номера.\nМы летели по мокрым, черным дорогам туда, где на самой низкой точке земли, ждал наш номер в отеле – самое уютное место в моей вселенной.\nЯ иногда представляю себя в пустоте, во вселенском вакууме, где нет ничего. Когда ничто меня не радует, и нет сил делать все свои огромные и важные дела – я создаю там дверь, я открываю ее и захожу в ту комнату.  Мы смотрим шоу про того скейтера и его лучшего друга, а потом курим кальян на балконе и смотрим на гору.  Помнишь, со второго раза мы все таки забрались на нее.\nШанталь везет меня в аэропорт.  Такая же взрослая, сильная, молчаливая.\nТогда мне казалось, что каждые сто евро – последние. И каждый отель – самый шикарный, и лучше уже не будет в моей жизни. Мне казалось, что праздник закончится, и дальше всегда будет это – беспросветная нужда, бедность, долги, съемные квартиры с вечно давящими на мозги арендодателями..  Тогда я научилась играть в это. Ты показала мне, что бедность ничем не отличается от богатства. В масштабе вечности все это – полная херня. И я начала играть.\nКак нашему поколению можно было миновать наркотики? У нас не было будущего. Ни образование, ни какие-то локальные успехи не могли помочь в том, чтобы выбраться за ту черту. Это не нищета, не бедность, но где-то около. Осознание того, что ты никогда, никогда не сможешь заработать себе на клочок жилплощади в том городе, в котором ты живешь. Да, ты свободен пойти и посидеть в гараже, или на скамейке в парке, или даже собраться с друзьями, чтобы извлекать звуки из музыкальных инструментов. В этом времени было столько внутренней свободы, и столько же страха – может поэтому никто из нас не мог оставаться трезвым даже один день. Зато мы писали классные песни, которые наполняли смыслом наше существование, и давали надежду таким же, как мы.\nНо песни – это не жизнь. Они могут быть жизненными, но они не могут дать тебе ничего, кроме веры.  В нарисованный дом невозможно войти, невозможно съесть нарисованный хлеб.  Когда я прочитала «Вирт» в первый раз, я познала, что мы – наги.  Когда я прочитала его в последний раз я поняла, что ничего не меняется. С наркотиками у меня ничего не получалось. Я не познавала, а забывала. Минус на минус. Просто Вирт всегда был во мне, и чтобы он работал – мне нужно было быть чистой.\nИштар имеет множество имен. Хобарт, вселенское сознание… Когда ты читаешь все эти книги, кажется, что истина где-то рядом, и тебе никогда не дадут к ней прикоснуться. Но потом наступает момент, и ты обнаруживаешь себя в той самой тайной комнате, где тебе говорят, что к сожалению все очень сильно устали, и этот мир нужно строить тебе.  Каждую секунду заново воссоздавать вселенную. Следить за тем, чтобы Она не просыпалась. Следить за тем, чтобы все работало. И ты тоже приготовься к тому, что кроме тебя будет некому – и тогда ты займешь свое место.\nКогда из пухлого, восторженного подростка ты превращаешься во взрослое, бесполое существо в ритуальных одеждах и с посохом, самая веселая история, которая может случится с тобой – это то, как ты забыл о своем предназначении на пару дней, и всё чуть не разрушилось.  Когда ты понимаешь, что, возможно, твои любимые герои книг не зря были твоими любимыми, ведь благодаря им ты уже все немного знаешь заранее.\nОчень многие вещи сразу же встают на свои места. Например, когда я начинаю что-то рассказывать – например вот это – мне начинают говорить: «бедненькая, ты так устала» или «о божэ что с тобой происходит, у тебя верно депрессия» - я, конечно, не спорю.  Не удивительно, что меня никто не понимает. Здесь вообще никто ничего не может понимать. Может только прибывать в иллюзии по этому поводу.\nПомнишь, был такой аттракцион в нашем детстве - «симулятор». Вагончик, который трясется, и экран внутри показывает веселые виражи.\nИстиное счастье имеет совершенно иную природу. Истиный труд совершенно не то, что показывают на этом экранчике. Как и истиная награда.. Она лежит за пределами сладкой маркетинговой реальности.\nКак опытный исследователь, я могу тебе сказать однозначно: истина не похожа на винтовой приход.\nЗнание – это боль. Но это не такая боль, которую ты испытываешь, когда все показывают на тебя пальцем и смеются. Это не та боль, когда у тебя отбирают любимое. Это не та боль, когда ты беспомощен.\nЗнание – это такая боль, как будто ты вытаскиваешь надоевшую занозу, как будто укус наконец-то расчесываешь до крови. Боль, приносящая облегчение.\nСчастье в том, чтобы видеть. Мир настолько же прекрасен, насколько омерзителен. И если ты круглосуточно, словно под капельницей, получаешь дозу знания в кровь – ты не можешь более быть восторженным мудаком. Я живу с этим миром миллионы лет, у нас давно закончился конфетно-букетный период. И знаешь, всегда находятся те люди, которые искренне сочувствуют мне и моей скромной роли – быть обслуживающим персоналом вагончика, знать и то, какой он снаружи, и какой – внутри. И как работают все его механизмы.\nИ правда в том, что как бы это не выглядело со стороны – я не променяла бы это своё место ни на одно другое.  Здесь – все мне знакомо и по силам.  Начальство любит меня и дает мне все инструменты. Когда тебе дают жить и работать – разве можно хотеть чего-то большего?\nДа, я устаю. Но факт в том, что когда я ничего не делаю – я тоже устаю. Да, я человек – и моя природа все так же сильна. Я злюсь, я ошибаюсь, я сожалею. Я боюсь. Но все это больше ничего не значит. Значение имеет только жизнь.\nПомнишь фильм миллионер из трущоб? Зачем мне сочувствовать, ведь я выиграла главный приз. Когда я пришла к той самой двери, я знала ответы на все вопросы не потому, что прочитала все древние тексты, а потому, что просто жила.  И во всем этом… Нет, ты можешь себе представить? Во всем этом нет моей заслуги.\nМожет быть по этому истинное счастье не выглядит, как реклама кукурузных хлопьев по телевизору. Истинное счастье выглядит так, что никто не может тебе позавидовать. Ищи его там, где меньше всего ожидаешь встретить.\nТакие дела, дружок. Такие дела.\n"}, {"path": "data/lj_export_clean/posts_md/2013-03-21__78394__невыносимая_жесткость_бытия.md", "source": "LiveJournal", "date": "2013-03-21", "filename": "2013-03-21__78394__невыносимая_жесткость_бытия", "content": "# невыносимая жесткость бытия\n*Date*: 2013-03-21T05:21:00+00:00\n*URL*: https://olymarkes.livejournal.com/78394.html\n\nЕсть такой миф, что люди с возрастом выдыхаются. Теряют градус, как крепкий алкоголь, оставленный без крышки. Нет, малыш. Мы все те же. Только жестче, в миллион раз жестче.\nУ меня было много классных парней – да да, ты никогда не согласишься с этим, в твоем понимании все мои бывшие должны быть отправлены в печь, но с какой-то стороны они действительно были классными. Даже со всех ", "full_content": "# невыносимая жесткость бытия\n*Date*: 2013-03-21T05:21:00+00:00\n*URL*: https://olymarkes.livejournal.com/78394.html\n\nЕсть такой миф, что люди с возрастом выдыхаются. Теряют градус, как крепкий алкоголь, оставленный без крышки. Нет, малыш. Мы все те же. Только жестче, в миллион раз жестче.\nУ меня было много классных парней – да да, ты никогда не согласишься с этим, в твоем понимании все мои бывшие должны быть отправлены в печь, но с какой-то стороны они действительно были классными. Даже со всех сторон, если оглядывать придирчивым взором только те грани, которые лежат на поверхности.\nКрасавец, душа компании, супер-тусовщик . Те качества, которыми принято обладать, чтобы нравиться людям и девочкам в частности. Но стоит подойти поближе, копнуть поглубже… оуууууууууу соу боринг, соу факин боринг.  Нет нет, ничего личного, мальчики – вы классные, но это не то, не то..\nЯ жесткая. Я очень жесткая. Я не такая жесткая, как Лидия Ланч – секс нельзя записать в перечень моих одержимостей. Я не такая конченая, как Эми Вайнхаус –- из нас двоих героин предпочитаешь ты. Я не такая мудрая, как Улицкая, но работаю над этим, возможно, ближе к старости? Я никогда не буду хорошо петь и писать, и моя жесткость совсем не в этом. О ней никто не знает – все видят лишь ее отголоски, ее отражение в этом мире.\nМне постоянно снится что я лечу. Не «ПОНЕБУЛЕЧУ» а так, немного – на порыве ветра делаю вдох и отрываюсь от земли сантиметров на пять. Могу так секунд 40 продержаться. И вот вся моя жизнь представляется мне таким аттракционом: я сделала вдох, оторвалась от земли,  но скоро это закончится. А все думают, что я неебически воспарила.\nНо ты.. ты!! ТЫЫЫ!!!  Как можно, как можно было переплюнуть меня в моей жесткости? По тебе ведь с виду и не скажешь. Ты, как истиный конспиратор, не создаешь никакой иллюминации. Ты охуительно хитрый лис. Тебе не нужно никому нравится, ты не тратишь силы, чтобы стать всеми желанной бумажкой в сто баксов.\nТы просто берешь и ебашишь.\nНет, сейчас я не про это.. Ты ебашишь, как телеканалы Дискавери, БиБиСи, Энимал Плэнет, Хистори Ченнел, ты ебашишь, как большая советская энциклопедия, как чертова библиотека конгресса. Ты ебашишь тексты, как Паланик и Ирвин Уэлш, но не так занудно.. ты вообще самый незанудный человек из всех, кого я встречала. Ты - невероятная, охуительная бездна. Я – тупая пизда )\nМы с тобой попали в интересную передрягу – как если бы у Тайлера и Марлы родился ребенок и бегал бы по этому полу-разрушенному дому, где с дырявой крыши течет вода, а угрюмые, молчаливые чуваки варят мыло из человеческого жира.  Почему это не сделало нас мягче, спокойнее, скучнее? Визуально – может быть, но там, внутри…  Истиная наша природа не меняется.  Мы с тобой настолько одинаково больны, что даже смешно.  Когда мне снится, что мы торчим вместе (а не по очереди,  навещая друг друга в рехэбах,  как это принято у нас в семье, бгагага) даже во сне всему настает полный феерический пиздец. Еще одного шанса у нас не будет, так что весь треш оставим для следущей жизни.\nЕсли бы мы жили в Вегасе и бухали, я бы выходила за тебя замуж каждый день.  Моя обаятельная мразь, обожаемая сволочь. Веди себя хорошо, ты мне нужен, понял, да??  Пиздец как. Вот.\n"}, {"path": "data/lj_export_clean/posts_md/2011-11-21__71404__-_переверните_паттабхи_джойса_на_спину.md", "source": "LiveJournal", "date": "2011-11-21", "filename": "2011-11-21__71404__-_переверните_паттабхи_джойса_на_спину", "content": "# - переверните Паттабхи Джойса на спину!!\n*Date*: 2011-11-21T09:52:00+00:00\n*URL*: https://olymarkes.livejournal.com/71404.html\n\nУ меня есть друг, можно даже сказать брат – мы лежали с ним вместе в рехэбе под Екатеринбургом несколько лет назад. Я, 20ти летняя пигалица и он –  чувак из Тагила уже за 30, минимум десять из которых он ебашил по вене, вряд ли когда-нибудь стали общаться в другом месте.\nНо там мы стали по-настоящему близки – иначе и не бывает на войне… И у каждого из нас был свой вра", "full_content": "# - переверните Паттабхи Джойса на спину!!\n*Date*: 2011-11-21T09:52:00+00:00\n*URL*: https://olymarkes.livejournal.com/71404.html\n\nУ меня есть друг, можно даже сказать брат – мы лежали с ним вместе в рехэбе под Екатеринбургом несколько лет назад. Я, 20ти летняя пигалица и он –  чувак из Тагила уже за 30, минимум десять из которых он ебашил по вене, вряд ли когда-нибудь стали общаться в другом месте.\nНо там мы стали по-настоящему близки – иначе и не бывает на войне… И у каждого из нас был свой враг.  Он не верил в Бога, а я слишком сильно верила в то, что смогу сама со всем разобраться…. С нами были еще люди там, но они, кажется, заторчали потом. А Виталик – нет. Он вернулся в Тагил и открыл первую группу Анонимных Наркоманов там – я даже ездила на своей старой восьмерочке  на ее открытие, это была первая далекая поездка за рулем, еще и такого драндулета. Еще он женился и у него родилась дочка. Ей уже скоро годик…\nИ он пишет мне: «Мне кажется,  что мы живем в разных измерениях. У тебя жизнь быстрее, что-ли…»\nЯ только усмехаюсь  -  и меня кроет мурашками от радости, что мой брат идет теперь по своей жизни семимильными шагами, наверстывая упущенное. И у него теперь есть семья, и он ЖИВОЙ….  Это ты живешь быстро, бро. А я…\nМалышка на миллион, которая празднует день рождения, хуяча по груше со всей дури. Меняю за неделю по десять городов, мои вещи раскиданы по разным квартирам в Москве и Питере, и я даже примерно уже не знаю, что у меня есть кроме того набора, что в чемодане.\nМузыка музыка музыка.. Еще у меня есть один друг – не побоюсь этого слова )) Вы можете часто видеть его в комментариях к этому жж. Он говорит, что все это – тление напоказ, бесполезный культ моей личности, который рано или поздно закончится и я умру в муках и попаду в ад, и знаете – он прав.\nЯ уже давно на этом пути, и много раз собиралась сваливать –  ну не чувствую я, что занимаюсь я нужным делом. Не чувствую я, что помогаю людям. Ну да – пишут что песни делают их жизнь лучше, но делают ли они лучше их самих?\nМеня гнало по этому пути невиданной силой, розгами и железными тисками на сердце, который заставляли меня оставить все больше и больше вещей, очищаться –  и вот появилась йога, и секта  –  здесь все мои знания и опыт оказались реально полезными,,,, И даже не обязательным мне оказалось идти колотить табуретки,  чтобы приностить людям радость и пользу. Я пошла преподавать йогу и меня вскрыло..\nЯ научилась читать людей, чувствовать их, раскрывать и вытаскивать на новый уровень восприятия себя, своего тела и души… Сложно это объяснить, но вот смотрите: ни одну из благодарностей по поводу музыки я не могу принять на свой счет, а вот эти счастливые глаза… И когда они подходят ко мне и говорят: «Оля, мне так хорошо просто в твоем присутствии! Оно дает мне силу. Ты вдохновляешь меня…»  меня от счастья просто подкидывает. Я чувствую, что им не нужен мой идеализированный образ –  рядом со своими учениками я всегда бесконечно настоящая. Я считаю, что изначально нужно принять свою природу, свою козлиную личность – и только когда ты будешь собой, ты сможешь начинать поступать по-новому, поступать лучше.\nКогда я преподаю и у людей получается, я чувствую себя на своем месте. Чувствую себя безгранично счастливой. И спасибо моей любимой одногрупнице Ане Шубиной за то, что она осуществила эту мою мечту – построила Дом Солнца на море, куда я могу приезжать к своим ученикам и полностью погружаться в практику.\nпосмотреть на успехи моих учеников )\n"}, {"path": "data/lj_export_clean/posts_md/2011-06-21__70771__пц.md", "source": "LiveJournal", "date": "2011-06-21", "filename": "2011-06-21__70771__пц", "content": "# пц\n*Date*: 2011-06-21T04:15:00+00:00\n*URL*: https://olymarkes.livejournal.com/70771.html\n\n-\tВот это да…\nПаром подплывает к причалу. Я сижу на поребрике неподалеку, вытянув ноги вперед – такой вот водный трэйнспоттинг.  В Керчи темная августовская ночь.  На пути непонятно откуда и куда поймала она нас на этой переправе, а я поймала внутри себя это странное чувство – как зверька – и я рассматриваю его с недоверием\n-\tНу… А вот ты по нему когда скучала – это у тебя происходило как долго?  - спраши", "full_content": "# пц\n*Date*: 2011-06-21T04:15:00+00:00\n*URL*: https://olymarkes.livejournal.com/70771.html\n\n-\tВот это да…\nПаром подплывает к причалу. Я сижу на поребрике неподалеку, вытянув ноги вперед – такой вот водный трэйнспоттинг.  В Керчи темная августовская ночь.  На пути непонятно откуда и куда поймала она нас на этой переправе, а я поймала внутри себя это странное чувство – как зверька – и я рассматриваю его с недоверием\n-\tНу… А вот ты по нему когда скучала – это у тебя происходило как долго?  - спрашиваю я Макарову, так кстати оказавшуюся рядом.\n-\tНу….  С декабря… И много месяцев.\n-\tОго.\nМы поднимаемся вверх по железным ступеням.\n-\tА как? Ну… Ты вспоминала о нем в определенное время дня? Или как?\n-  Постоянно.\nНа моей голове белая шапка, в голове белый шум. Сейчас я нахожусь где-то надо водой. Лежу спиной на серой поверхности и смотрю.\nОчень странно встречать кого-то, с кем сразу же настолько охуительно.  Так, что не отлипнуть прямо. Торч торч торч. А потом так странно, что это должно закончится.\n"}, {"path": "data/lj_export_clean/posts_md/2011-06-21__69427__no_title.md", "source": "LiveJournal", "date": "2011-06-21", "filename": "2011-06-21__69427__no_title", "content": "# (no title)\n*Date*: 2011-06-21T03:39:00+00:00\n*URL*: https://olymarkes.livejournal.com/69427.html\n\nЯ становлюсь более чувствительной... Или чувственной? Это хорошо.\nМинус один: я стала реагировать на мудаков и п*дорасов, которых всегда было полно. Раньше льющиеся из их ртов помои я как-то пропускала мимо себя,  а сейчас - рефлексирую, дергаюсь, хочу нахамить в ответ.\nНо это фигня все... Странно и удивительно другое: меня наполняет нежность. Страшное участие по отношению ко многим и многим людям", "full_content": "# (no title)\n*Date*: 2011-06-21T03:39:00+00:00\n*URL*: https://olymarkes.livejournal.com/69427.html\n\nЯ становлюсь более чувствительной... Или чувственной? Это хорошо.\nМинус один: я стала реагировать на мудаков и п*дорасов, которых всегда было полно. Раньше льющиеся из их ртов помои я как-то пропускала мимо себя,  а сейчас - рефлексирую, дергаюсь, хочу нахамить в ответ.\nНо это фигня все... Странно и удивительно другое: меня наполняет нежность. Страшное участие по отношению ко многим и многим людям, которых я встречаю. Например, музыканты.  На \"Усадьбе Джаз\" я слушала Встречу Рыбы и покрывалась мурашками с ног до головы. Я слушала \"Обе Две\" и дышала их музыкой, и воздушным образом Кати, не могла оторвать глаза от ее прозрачной пачки и развивающихся волос...\nЯ смотрю на многие начинающие группы и группы, которые существуют много лет. И сейчас, когда моей банде уже 7ой год, я могу сказать: музыка - это них*я не легкий путь. Это настоящее испытание быть на нем. Настоящее испытание и огромный труд, чем бы это не казалось со стороны.\nВот есть у тебя твое \"эльфийское послание\" - информация из эфира, которая приходит к тебе и заставляет тебя переводить на человеческий язык то, что ты видишь и чувствуешь. Это превращается в песни, слова и музыка - образы, боль, недостаток кислорода - все что угодно - тебе просто нужно расшифровать все это, иначе тебя не отпустит.\nИ вот ты со своими песнями, со своими картинами или историями носишься, бьешься как рыба об лед -сначала об собственную творческую неуклюжесть, потом - об непонимание людей. Всю жизнь все против тебя...  И никогда не знаешь: нужно ли это кому-то - или я зря трачу время и силы? Но \"эльфийское послание\" - оно как ребенок. Каким бы оно ни было - ты его не бросишь. Будешь его нести и умрешь с ним: в признании или в забвении - это как повезет.\nИ вот, сколько сил нужно потратить всем этим музыкантам, всем нам? Сколько сил и времени нужно, чтобы перестать голодать? Сколько сил и времени нужно, чтобы можно было заниматься только любимым делом и не лебезить перед критиками(которые сами них;я не понимают в эльфийских посланиях: если ты чувствуешь ЭТО - ты никогда не позволишь себе судить)  и не подстраиваться под форматы?  Какой есть шанс? - никто и никогда не сможет сказать объективно, потому что творчество - это волшебство, и в нем нет законов и правил.\nИ я смотрю на всех вас, кто талантливые и светлые и мне больно и страшно. Если многие из вас смотрят на меня и на Alai Oli и думают, что это и есть успех,  или что мы чего-то добились - оххх...  Здесь нет ничего -  и только одно чувство стало явным: \"эльфийское послание\", которое выпало расшифровывать именно мне,  оказалось нужным не малому количеству людей - и все эти годы мы с моей бандой оттачиваем мастерство перевода и сражаемся с окружающей действительностью и с собой.  Не сторчаться. Не спиться. Не жениться. Не погрязнуть в быту. Не уйти в карьеру. Не сдохнуть от голода. Не сдаться, когда ничего не выходит. На нашем пути много камней,  и иногда мы спотыкаемся - и каждый раз приходится встать и идти дальше, и нести свое послание. И не забывать при этом, что ты - всего лишь курьер, а не создатель. Вот в чем еще трудность.\nКак только начинаешь присваивать себе плоды своего творчества - обрекаешь себя на страдания. Уж этот пласт я не буду сейчас поднимать ) Но мыслящий читатель этого текста сможет разобраться сам, или дождется  - придет время, и я подробно расскажу о философии эльфийских посланий и медиумов... А пока хватит. Только еще кое-что расскажу:\nТри правила для творческого человека: не останавливаться, не сдаваться, никого не слушать. Никто не знает, какое оно - твое \"эльфийское послание\" - и никто не может учить тебя, как его расшифровывать. Слушай только себя, и Божественное в тебе научит тебя. Еще труд - все эти репетиции, все эти текучки с музыкантами, все эти концерты - это как практика: делает тебя сильнее.\nКогда я стану совсем взрослой тетей, я буду помогать творческим людям - устрою что-то вроде реабилитации, вроде группы взаимопомощи..  Я буду рассказывать им о своем опыте, о тех испытаниях, которые прошли мы, и творческие люди - мои современники, с которыми мне довелось дружить. Я буду учить их тому, как жить с этой огромной зияющей черной дырой внутри. Я буду учить их, как не убить себя. Как быть творческим человеком и не умирать каждый день от этой сверх-чувствительности.... Я уже знаю способы. Я такая сильная, что пиздец  - и я хочу отдавать, защищать, греть...  Только чтобы не было кому-то так плохо, как было мне.\nУчастие, и никакой желчи, и никакого цинизма. Оля, я тебя не узнаю.\n"}, {"path": "data/lj_export_clean/posts_md/2010-10-21__33282__brain_fucking_flow_8_9_10.md", "source": "LiveJournal", "date": "2010-10-21", "filename": "2010-10-21__33282__brain_fucking_flow_8_9_10", "content": "# brain fucking flow 8 9 10\n*Date*: 2010-10-21T17:00:00+00:00\n*URL*: https://olymarkes.livejournal.com/33282.html\n\nНу да, наверное я вела себя грубо. Мне стыдно? Ну так.  Мне кажется, он этого заслуживает. Таким как он вообще палец в рот не клади – голову откусит, или как там говорят? Я не хочу, чтобы мне откусывали голову.  Не хочу вообще сближаться с людьми – они или делают мне больно или сами страдают. Дерьмовая движуха. Слышишь? Это всё изначально – провал. Мне никто не нужен. Мне никто не н", "full_content": "# brain fucking flow 8 9 10\n*Date*: 2010-10-21T17:00:00+00:00\n*URL*: https://olymarkes.livejournal.com/33282.html\n\nНу да, наверное я вела себя грубо. Мне стыдно? Ну так.  Мне кажется, он этого заслуживает. Таким как он вообще палец в рот не клади – голову откусит, или как там говорят? Я не хочу, чтобы мне откусывали голову.  Не хочу вообще сближаться с людьми – они или делают мне больно или сами страдают. Дерьмовая движуха. Слышишь? Это всё изначально – провал. Мне никто не нужен. Мне никто не нужен. Мне никто не нужен. Надо сосредоточится на этой мантре: омммм мне никтоооо не нуууужеееен я хочу побыть однааааа омммммм.\nНу ладно. Я хочу сделать тебе подарок. Нет, что за чушь?! Может без этой банальной херни обойдемся?! Мне никто не нужен и он тем более, а ему не нужна эта штука! Нет. Я хочу ему эту штуку задарить,  и я сделаю так, как я хочу. Я всегда делаю так, как я хочу.\nКолесо пробилось. Может это знак, что это была хреновая идея? По любому.\n***\nоооо золотое время моей графомании.\nНаконец-то меня оставили в покое. Я чувствую какое-то ехидное счастье. Интересно, бывает ли счастье ехидным? Вот сижу дома на Моховой, одна, под одеялом. Слушаю The Sounds. Мне так заебись, что даже чая не хочется.\nПоследнее время я большее количество времени провожу наедине с собой. У меня больше нет собеседников из Вконтакте, и я не читаю все это безумное количество сообщений (последний раз, когда я видела свою страницу их было около 700).\nЧестно, я пытаюсь не разговаривать даже с собой – у меня такая практика. Но получается плохо. Я такая странная девушка – совсем не знаю, где я хочу быть. Приезжаю в Екатеринбург – ООО, зашибись! Горы, Юля, Семья, тачка, квартира, родные улицы, родная тусовка, клубы, ресторанчики  – что еще нужно?\n- Да да да! Я приеду к вам тусить! Будет весело, кутёёёж, бл*!\nПриезжаю в Питер, и тут так охеренно. Пол ночи каталась по городу на машине. По Васильевскому острову, по Петроградке, по центру. Джыпиэс навигатор (я решила назвать его Мисси Элиот) читает мне весёлый рэп про повороты, радио Максимум играет саундтреком. Никого нет и никого не надо.\n- Круто быть одному, когда есть кто-то, кто любит тебя. – говорит мне радио.\n-  Сто пудов. – отвечаю я.\nНа столе лежит билет в Екатеринбург. Я знаю – я приеду, и там мне будет офигенно. Поеду в Индию – будет пепец круто. В Израиле – еще круче. Останусь в Питере – мммм….  Я думаю, мне даже на том свете будет неплохо, даже если там всё так, как в фильме «Самоубийцы: история любви.»\nМне хочется стать черной дырой и засосать себя в небытие. Мне сложно с людьми. А тут ещё этот  - с раздвоением личности своим. Меньше всего я хочу сейчас думать о ком-то, тем более о вас обоих. Это не время сближаться с людьми. Это – время побыть наедине с собой. Только вот я поглядываю на телефон, в ожидании смски и чувствую тревогу, как будто я учусь в восьмом классе – глупее ситуации не придумаешь. Практика независимости и самодостаточности, тьфу!\nМантра омммммм мне никто не нужен омммммм никто мне не нужен омммммм никто мне не нужен омммммм\nКак круто что ты тоже не спишь. Почти три часа ночи, а ты написал и я ответила что-то ехидное а потом ты снова написал, бля как же это охуительно. Кажется, что нет большего удовольствия чем перекидываться с тобой этими ехидными смсками. Да да да. Я думала, что я – серьезная барышня, и такой херней больше не буду заниматься, но нееет….  НЕТ НЕТ НЕТ НЕ ПИШИ МНЕ БОЛЬШЕ!  пиши мне еще еще еще еще еще еще еще\nКонечно, круто будет, если я завтра выключу этот питерский телефон, а свой ебуржский тебе не скажу. Бе бе бе. Вообще, ценно только то, от чего сложнее всего отказываться. Как та штука, которую я хотела тебе подарить -  у меня была даже заготовлена крутая речь. Из серии\n- Знаешь, эта штука такая охеренная, что я её прямо от сердца отрываю, но моё желание подарить тебе её гораздо сильнее моей еврейской сущности. Так что на, вот тебе! Но если тебе вдруг она не нужна или не нравится – отдай обратно, я с радостью буду юзать её сама.\nНо ты оказался где-то в другой точке земного шара.\n«И я скучаю. Я буду в городе завтра вечером. Ты когда уезжаешь? »\nТочно. Всё это была дурацкая затея.  Я кстати не писала, что я скучаю! Я написала «Фак Ю!» и потом весело ехала по Невскому качала головой и пела Лили Ален «Фак юююю». Я не скучала! Нет! Нет! Ни капельки!\nПросто ты как-то так в тему. Как-то вот актуален ты чисто по-человечески. Нет, мне вообще ничего от тебя не нужно. И даже если ты наконец поймешь, что я та еще сука и конченый псих при этом (адская смесь!) и в ужасе убежишь – я буду только рада. Может, напишу грустную песню – хоть какая-то польза.  ААААА бдыжь быдыжь взрыв мозга!!!\nЯ бы поехала с тобой туда, куда ты меня позвал – но зачем?! Я вообще тебя не знаю, я даже не уверена, что ты мне симпатичен. Может, я тебя ненавижу, вообще? Может, ты меня бесишь? Я не знаю, какой вектор у всего этого. Нет, типа сиюминутный порыв у меня такой – да погнали, срать на все!  И Бро говорит\n- Ну не понравится – свалишь через три дня. Ты же умеешь!\nНу ну. Мне кажется, это ничем хорошим не кончится. И вообще, у меня на столе лежит билет в Екатеринбург. И у меня мантра знаешь какая? Мнееее никтоооо не нуууужен.\nИ вообще я сваливаю из Питера на месяц. Приеду – все уже будет по-другому. Так что Маркес давай попустились успокоились глубокий вдох ровный спокойный выдох, ложись в кроватку, утром проснешься пойдём завтракать в «Ботанику» и будем собираться ДООМООООЙ ням ням.\nНет нет нет только не говорите что у меня тоже теперь раздвоение личности.\n*стерто*.\n"}, {"path": "data/lj_export_clean/posts_md/2010-05-21__32590__из_подмосковья_в_подмосковье.md", "source": "LiveJournal", "date": "2010-05-21", "filename": "2010-05-21__32590__из_подмосковья_в_подмосковье", "content": "# из подмосковья в подмосковье\n*Date*: 2010-05-21T02:34:00+00:00\n*URL*: https://olymarkes.livejournal.com/32590.html\n\nя объелась роллов. я обняла стопку старых журналов Men's Health, хожу с ними туда-сюда и роняю скупые слёзы на пол. Эх, были же времена - Алексей Яблоков был главным редактором моего любимого журнала. Но речь не о том.\nВчера был концерт в Москве. Пользуясь случаем, хочу передать привет всем тем, кто говорил, что мы не соберём Икру 3 января. Бе бе бе )) Да ладно, я и сама не ожида", "full_content": "# из подмосковья в подмосковье\n*Date*: 2010-05-21T02:34:00+00:00\n*URL*: https://olymarkes.livejournal.com/32590.html\n\nя объелась роллов. я обняла стопку старых журналов Men's Health, хожу с ними туда-сюда и роняю скупые слёзы на пол. Эх, были же времена - Алексей Яблоков был главным редактором моего любимого журнала. Но речь не о том.\nВчера был концерт в Москве. Пользуясь случаем, хочу передать привет всем тем, кто говорил, что мы не соберём Икру 3 января. Бе бе бе )) Да ладно, я и сама не ожидала настолько полного зала.\nБыло очень круто. Мы сыграли всё - новое и старое, Дима с Жиром даже рэп почитали, а я играла на барабанах..\nНочью была афтапати в большой и красивой квартире на Проспекте Мира. Дима опять зажигал, цыганская морда. Кстати, вам я ещё не рассказывала, как он трахнул буфетчицу вагона-ресторана?\n- Оля. Она мне сказала: \"Корми свою тёлку, пои её кофе, отводи в свой вагон и возвращайся\". Что мне делать?\n- Тёлку это меня чтоли?\n- Ага.\n- Ну дак пои меня кофе, да я пойду! Хоть будет что рассказать!\nНайдется хоть одна женщина, которая покорит его сердце, а не кое-что другое?!?\n***\nСегодня был концерт в Коломне. Это 2 часа на электричке от столицы. Было как-то тяжело мне, и даже часовая программа далась мне с трудом. Потом ещё ехать на электроне обратно...\nСтоим у клуба, ждём такси. Подъезжает чёрный крузак, из него вываливается наш друг Виталик Королёв с очаровательным букетом цветов и с друзьями.\n- ?!?!?! Мы опоздали?! 200 километров ехали, блин, чтобы на концерт попасть!\nВ результате мы с Бро попрощались с алайоли фэмили и поехали в Пушкино, в дом, где живет Виталик.\nМы быстро быстро летели по пустынным трассам, изредка включая сирену. Машины прижимались к обочинам а мы ехали дальше. Я прослушала новый альбом Гуфа, и мне неожиданно понравилось. Разные знакомые поговаривали, что его бросила подруга и он снова начал торчать, так что я как-то не ожидала от него сенсаций... А тут - такое качество. И минуса, и тексты хорошие. Молодец Гуф, крутой альбом жахнул.\nДоехали до Пушкино под такие саундреки, купили роллов в ресторанчике, куда нас не пустили из-за отсутствия каблуков на ногах женской части тусовки.\nПотом у Виталика в комнате я нашла МэнсХэлс, обняла стопку журналов и стало мне счастье. Боже, храни моих друзей во всех концах этой страны и земного шара, их уютные дома, тёплые глаза и руки и добрые души ) И ещё - храни Алексея Яблокова, любимого моего.\nЗавтра утром самолёт в Питер.\n"}, {"path": "data/lj_export_clean/posts_md/2010-05-21__48378__no_title.md", "source": "LiveJournal", "date": "2010-05-21", "filename": "2010-05-21__48378__no_title", "content": "# (no title)\n*Date*: 2010-05-21T12:32:00+00:00\n*URL*: https://olymarkes.livejournal.com/48378.html\n\nОни просыпались в той квартире. Было лето. Были оранжевые стены. Куча наркотиков, оранжевые стены,  любовь такая, что пиздец.\nМногогранные многоугольники любви.\nЧто с нами было тогда? Как мы вообще просыпались если все таки умудрялись заснуть? Я ненавижу вспоминать то время, потому что уж слишком оно кажется прекрасным.\nЯ болела и страдала, но сейчас забыла об этом. И осталась только память яркими", "full_content": "# (no title)\n*Date*: 2010-05-21T12:32:00+00:00\n*URL*: https://olymarkes.livejournal.com/48378.html\n\nОни просыпались в той квартире. Было лето. Были оранжевые стены. Куча наркотиков, оранжевые стены,  любовь такая, что пиздец.\nМногогранные многоугольники любви.\nЧто с нами было тогда? Как мы вообще просыпались если все таки умудрялись заснуть? Я ненавижу вспоминать то время, потому что уж слишком оно кажется прекрасным.\nЯ болела и страдала, но сейчас забыла об этом. И осталась только память яркими красками, какими мы с Ю раскрасили стены в том доме\nГде все спали на полу, обнявшись\nИ Мэтью бегал по квартире, и балкон девятого этажа был открыт  настежь, а за окном – зеленый Екатеринбург , ночной утренний вечерний, сумерки трамваи поливальные машины\nКогда все спали я писала. Дрожащими руками держала гитару,  или мои пальцы стучали по клавиатуре и я боялась хоть что то упустить\nЯ выползала на улицу с гитарой когда все спали, у меня не было голоса чтобы петь – я шептала. Я курила кент 8,  я делала больно всем вокруг, а они меня прощали.\nИ теперь это – наша общая история, навсегда.\nИжевск – Екатеринбург – вся страна автостопом.\nПолные клубы, полное отчаяние и верх эйфории.\nГрызть зубами землю дна, целовать небо с крыш небоскреба в Москве, когда уже месяц – чистая.\nКогда лучшие из лучших – твои друзья, и вас уже ничто и никогда не разделит.\nСлышишь? Нас уже ничто и никогда. Мы – одно. И нами хорошо быть. Только узнаем мы об этом всегда по прошествии времени.\nИ я так рада что Желтый был с нами, он все это поймал в свою фото-машину времени\n"}, {"path": "data/lj_export_clean/posts_md/2010-03-21__32323__no_title.md", "source": "LiveJournal", "date": "2010-03-21", "filename": "2010-03-21__32323__no_title", "content": "# (no title)\n*Date*: 2010-03-21T18:23:00+00:00\n*URL*: https://olymarkes.livejournal.com/32323.html\n\nЯ в Москве. Спасибо братьям из NA - подобрали на вокзале, отвезли в хату на Арбате на машине. Потом Ваня Зенченко повез меня в крутое андеграундное место - чайную на Лубянке.\nТам нет вывески на двери, там нет еды и нельзя курить внутри... Только чай. Зато какой! Это не чайная, это - наркопритон, я вам отвечаю. Еле выползла на улицу под Дахун Пао, с огромной плюхой Пу Эра грамм на 500 всего за 800 ", "full_content": "# (no title)\n*Date*: 2010-03-21T18:23:00+00:00\n*URL*: https://olymarkes.livejournal.com/32323.html\n\nЯ в Москве. Спасибо братьям из NA - подобрали на вокзале, отвезли в хату на Арбате на машине. Потом Ваня Зенченко повез меня в крутое андеграундное место - чайную на Лубянке.\nТам нет вывески на двери, там нет еды и нельзя курить внутри... Только чай. Зато какой! Это не чайная, это - наркопритон, я вам отвечаю. Еле выползла на улицу под Дахун Пао, с огромной плюхой Пу Эра грамм на 500 всего за 800 рублей.\nЕще я е(*)бу себе мозги: что мне делать... 7ого числа последний концерт перед отпуском. Куда податься? В Индию, как планировалось раньше? В Израиль может? Друзья оттуда думают скинуться мне на билет из Питера.  Проблема - я не уверена, что я вообще хочу куда-то ехать. ... кроме Екатеринбурга.\nТам такие снежные парки... С перспективой бесплатного катания в них. Еще в Екб у меня теперь есть вторая машина, т.е. очень круто - просто Швейцария с личной резиденцией. Так что до конца января я буду торчать там. А в феврале будет БГВ - самая классная зимняя вечеринка.\nВсе эти два месяца будет пустовать наша крутющая однокомнатная квартира в центре Питера, я в любом случае отдам за нее квартплату, потому что место это - сказочное.  Так что если кто-то ищет жилье в Питере на январь - февраль, обращайтесь. 15 тонн с коммунальными, в квартире все есть даже инет.\nНу вот еще видяха из Екб\nAlai Oli in Eburg\nfrom\nAlex B\non\nVimeo\n.\n"}, {"path": "data/lj_export_clean/posts_md/2010-02-21__55337__вообще_я_сама_не_могу_поверить_что_я_зануда_-_на_всех_видео_я_ржу_как_конь.md", "source": "LiveJournal", "date": "2010-02-21", "filename": "2010-02-21__55337__вообще_я_сама_не_могу_поверить_что_я_зануда_-_на_всех_видео_я_ржу_как_конь", "content": "# вообще я сама не могу поверить что я зануда - на всех видео я ржу как конь )))\n*Date*: 2010-02-21T00:05:00+00:00\n*URL*: https://olymarkes.livejournal.com/55337.html\n\n- Оля ты употребляешь героин?!\nте кто поскромнее просто исподтешка смотрят на сгибы моих рук.\nВ Екатеринбурге все и так знают, как у меня дела. Говорят: \"ДА Я ЧИТАЛ В ТВОЕМ ЖЖ! а про кого это?\"\nЕкатеринбург - это Сан Франциско. Лучший друг, семья, любимые улицы и небо, и лучшие в мире ресторанчики. В деке моей тачки патриотично ка", "full_content": "# вообще я сама не могу поверить что я зануда - на всех видео я ржу как конь )))\n*Date*: 2010-02-21T00:05:00+00:00\n*URL*: https://olymarkes.livejournal.com/55337.html\n\n- Оля ты употребляешь героин?!\nте кто поскромнее просто исподтешка смотрят на сгибы моих рук.\nВ Екатеринбурге все и так знают, как у меня дела. Говорят: \"ДА Я ЧИТАЛ В ТВОЕМ ЖЖ! а про кого это?\"\nЕкатеринбург - это Сан Франциско. Лучший друг, семья, любимые улицы и небо, и лучшие в мире ресторанчики. В деке моей тачки патриотично качает Восточный Округ, я ложусь спать в пять утра и веду богемный образ жизни - шляюсь по ресторанам, кино и гостям.\nПрочитала \"Беглецы и Бродяги\" Паланика, так вот - я напишу по любому такой же путеводитель по ЕКБ.\nГринвич.\n\"....Когда то здесь был супермаркет МАРИЯ. Он был большой а еды там было мало. Теперь Гринвич огромный, там куча всякого дерьма. По ночам это место становится центром вселенной. Если вы хотите повстречать кого-нибудь из  культовых персонажей Екатеринбурга - отправляйтесь в Гринвич после часа, когда улицы города опустеют. Богема не работает с 9 утра, этим модникам не надо рано вставать, и они медленно гуляют по нарядным рядам дорогой и качественной жратвы, холодно здороваясь с другими представителями богемы....\"\nТак тесно и по-семейному все здесь, все про всех все знают и почему то недолюбливают за глаза. Это просто от того, что уже любить друг друга устали. Истории развиваются циклично, любовь и ненависть, несуетливое творчество, одни и те же названия на разных афишах...\nПочему-то я немного побаиваюсь этих людей. Кажется что в момент моей слабости и боли они просто будут равнодушно скользить глазами по тем, что раньше было мной. Просто с кем-то нужно поздароваться, а с кем-то не обязательно. Это и есть тусовка.\nИ рассказать мне особо нечего всем знакомым - они читают мой жж. Может и правда, к черту эту графоманию?  Буду снимать ролики для ютьюба по сумасшедших людей вокруг меня.\nА еще, кстати, ночью у Гринвича ко мне подошел очень пьяный и при этом очень милый мальчик. Он так мне понравился, что я ему даже написала телефон на бумажке.\n- Оля.\n- Я знаю...\nНо он так и не позвонил. Обломись, Оля, обломись!!! ))))))\nАвторский метод моего младшего брата ))))) хит!!!\n- Паша... У меня нет сил. Я не могу больше идти. Я пойду только если ты наденешь эту кофту.\n- Хорошо. Я пойду в этой кофте и без трусов.\n- !!!!!!\n- Ну ладно. В трусах. - снимая штаны.\n﻿\n"}, {"path": "data/lj_export_clean/posts_md/2010-01-21__38121__во_имя_меня_и_науки_не_проходите_мимо.md", "source": "LiveJournal", "date": "2010-01-21", "filename": "2010-01-21__38121__во_имя_меня_и_науки_не_проходите_мимо", "content": "# Во имя меня и науки, не проходите мимо...\n*Date*: 2010-01-21T13:03:00+00:00\n*URL*: https://olymarkes.livejournal.com/38121.html\n\nВСЕГО\nТРИ\n(3)\nVOPROSA\n1. Имя, возраст, род занятий.\n2. Любите ли вы группу Самое Большое Простое Число?\nДа -  почему?\nНет - почему?\nЕсли не слышали - не обломайтесь, послушайте. Рекомендрую темы \"На два\", \"Динозавр\" ,\"Рождество\"\n3. И пару слов о себе.\nпример ответа:\n1.  Оля Маркес, 22 года, дауншифтер.\n2.  Я очень люблю группу СБПЧ, потому что строчки одна за другой ", "full_content": "# Во имя меня и науки, не проходите мимо...\n*Date*: 2010-01-21T13:03:00+00:00\n*URL*: https://olymarkes.livejournal.com/38121.html\n\nВСЕГО\nТРИ\n(3)\nVOPROSA\n1. Имя, возраст, род занятий.\n2. Любите ли вы группу Самое Большое Простое Число?\nДа -  почему?\nНет - почему?\nЕсли не слышали - не обломайтесь, послушайте. Рекомендрую темы \"На два\", \"Динозавр\" ,\"Рождество\"\n3. И пару слов о себе.\nпример ответа:\n1.  Оля Маркес, 22 года, дауншифтер.\n2.  Я очень люблю группу СБПЧ, потому что строчки одна за другой последовательно нажимают во мне клавиши Alt, ctrl, del и вот здесь *прижимает руки к груди* прямо вот как то ну пипец вот так! А после восьми прослушиваний песни \"На Два\" я перестаю видеть это приведение. Поэтому слушаю семь раз подряд, потом - один трек 2hCO \"Мне нужны враги\", и снова \"На два\" семь раз.\n3. У меня высшее образование и горе от ума. У меня нет денег, работы и сожалений по этому поводу. У меня есть психотерапевт, зависимость от интернета, графомания и ипотеко-фобия. Мой фетиш - автомобили Шевроле Ланос и кеды Gravis.   Я мечтаю однажды проснуться и обнаружить себя в голове Алексея Яблокова, и чтобы мы снова были главным редактором Men's Health. Я боюсь Аркадия Укупника и продуктов с глутаматом натрия, от журнала Афиша у меня портится аппетит и чешутся руки.\nВ раковине моей ванной живёт кокаиновый Ктулху, если не приносить ему жертвы - начинает протекать труба. Я подумала... - проснуться и обнаружить у себя в голове Алексея Яблокова было бы не менее круто.\nНе стесняйтесь, мне нужно узнать вас по-лучше, пишите то, что приходит в голову! Краткость - сестра албанца,  а мне надо понять, как работает ваш мозг, так что не скромничайте. Особенно те, кто не любит СБПЧ. Пишите о чём прёт, не заботьтесь о логике и аргументации!\nна правах рекламы: продам куклу-вуду Кирилла Иванова и номер его мобильного -\n100$.\n"}, {"path": "data/lj_export_clean/posts_md/2010-01-21__32235__странный_пост.md", "source": "LiveJournal", "date": "2010-01-21", "filename": "2010-01-21__32235__странный_пост", "content": "# странный пост\n*Date*: 2010-01-21T00:01:00+00:00\n*URL*: https://olymarkes.livejournal.com/32235.html\n\n- Знаешь кто ты? ...\n- ..Я?! - кокетливо улыбаюсь, убираю прядку волос с его глаза - Кто?\n- Ты - такой маленький домик, красивый такой, аккуратный. С заборчиком, с лужаечкой. Миленький такой домик снаружи. А внутрь заходишь - а там такой огромный зловещий замок, чёрный.... Хочется взять динамита побольше, и на х*й все разъеб*ть там...!\n- ...!!!! ...!!!!!\nВот это лучший комплимент, который я слы", "full_content": "# странный пост\n*Date*: 2010-01-21T00:01:00+00:00\n*URL*: https://olymarkes.livejournal.com/32235.html\n\n- Знаешь кто ты? ...\n- ..Я?! - кокетливо улыбаюсь, убираю прядку волос с его глаза - Кто?\n- Ты - такой маленький домик, красивый такой, аккуратный. С заборчиком, с лужаечкой. Миленький такой домик снаружи. А внутрь заходишь - а там такой огромный зловещий замок, чёрный.... Хочется взять динамита побольше, и на х*й все разъеб*ть там...!\n- ...!!!! ...!!!!!\nВот это лучший комплимент, который я слышала за все последнее время. Спасибо Тебе. Хотя один фиг, ты не читаешь мой жж. Наша страстная цыганская рагга, наша патчанка - то, что лишает меня сна и аппетита и желания быть здесь и сейчас.\nГде мне быть? С кем мне просыпаться? Где мой дом, маленький мой? К чёрту все эти мысли - я счастлива во всех своих состояниях. Депрессия - отлично. Желание свободы - отлично. Одиночество - отлично. Я никогда не успокоюсь. Меня никогда не попустит, детка. е-е-е\nРовно год назад я тусила на кухне ресторана гестхауса в Гоа, готовила еду с индусами, поила их глинтвейном. Потом, обнюханная кокосом, лежала под огромным звездным небом и... я была самым несчастным человеком на свете.\nК чёрту моря, океаны и пальмы. Пускай их забирают те, кого не прёт эта зима и дикий дубарь. Пускай там тусуются те, кому там счастье. А я так счастлива быть здесь.\n9ый этаж, ноутбук стоит на широком подоконнике и я смотрю на огни ночного Екатеринбурга. Он спокойный, в зимней дымке. Мой любимый город, засыпанный снегом, окруженный горами, заселенный моими друзьями, близкими и любимыми, незнакомыми и знакомыми...\nТелек выключен. За моей спиной папа сидит, обнимая гитару - мы поём разные песни по очереди, мой младший брат сидит тут же, на кресле. У моего папы очень уютная квартирка, сплошной фэн-шуй и дизайн мммм - разве можно придумать место лучше? Когда-то мой дом был здесь.\n1 января будет ровно год, как я живу без наркотиков. Это очень важный праздник для меня. Я помню, как мы с Здоми ехали на мопеде, потом остановились у какой-то паромной переправы и я позвонила Паше в Россию\n- ... Паш, я это... ну вобщем. Торчала вчера и сегодня тоже. Мне так плохо. Я ненавижу себя.\n- Не волнуйся, малышка! Ты просто сегодня попробуй, попробуй еще раз жить без этого. У тебя ведь всегда есть шанс. Не вини себя, всё хорошо. Я всегда на твоей стороне.\nИ в тот момент я поняла, где я хочу быть и с кем. Купила билеты в Россию на последние деньги, и больше ни разу не сетовала на холод и отсутствие моря - когда я вернулась в Екб у меня началась новая жизнь, и весь этот год был для меня самым счастливым. Мои друзья - моя семья, спасибо всем вам, родные.\nА сегодня у меня не завелась чёрная машына на литых дисках, и мне пришлось ездить на 23х летней восьмёрке весь день - вот это веселуха )) Ещё мне подарили 1 час в джакузи с парнем у которого ммм такие красивые кубики пресса и ужин в ресторане Папарацци (г*вно ресторан)\nи наконец я дорвалась до инета  и компа е - е -е -е -е поздравляю всех вас чмоге чмоге чмоге и будь проклят зомбоящег )))\n"}, {"path": "data/lj_export_clean/posts_md/2009-12-21__16719__no_title.md", "source": "LiveJournal", "date": "2009-12-21", "filename": "2009-12-21__16719__no_title", "content": "# (no title)\n*Date*: 2009-12-21T22:57:00+00:00\n*URL*: https://olymarkes.livejournal.com/16719.html\n*Tags*: бугага, журналистика, трудовые будни\n\n12.07.09\tJimbo:\tЗдравствуйте, Ольга!\nМы готовим интернет-журнал о музыке в нашем регионе, в связи с этим хотелось бы задать несколько вопросов касательно вашей группы. Ждем вашего согласия\n12.07.09\tОльга:\tПривет! задавайте )\n12.07.09\tJimbo:\tЧем развернутее будут ответы - тем лучше!\n1 - Как давно существует ваша группа?\n2 - На что вы расчитывали создавая", "full_content": "# (no title)\n*Date*: 2009-12-21T22:57:00+00:00\n*URL*: https://olymarkes.livejournal.com/16719.html\n*Tags*: бугага, журналистика, трудовые будни\n\n12.07.09\tJimbo:\tЗдравствуйте, Ольга!\nМы готовим интернет-журнал о музыке в нашем регионе, в связи с этим хотелось бы задать несколько вопросов касательно вашей группы. Ждем вашего согласия\n12.07.09\tОльга:\tПривет! задавайте )\n12.07.09\tJimbo:\tЧем развернутее будут ответы - тем лучше!\n1 - Как давно существует ваша группа?\n2 - На что вы расчитывали создавая группу? Что получилось?\n3 - Можно ли вас назвать популярной успешной группой?\n4 - узнают ли вас на улицах?\n5 - востребована ли ваша музыка?\n6 - Как долго вы собираетесь заниматься музыкой?\n7 - чем вы занимаетесь помимо музыки?\n8 - какие книги вы и другие участники группы считаете лучшими, окозавшими на вас какое-либо влияние?\n9 - какие музыкальные альбомы?\n10 - фильмы, мультфильмы?\n11 - не кажется ли вам что вы сдаете обороты, ведь многие из ваших песен стали похожи друг на друга?\n12 - Что бы вы хотели поменять в группе?\n13 - В городе, в стране, в мире?,?,?\n14 - в ваших песнях встречаются ямайские религиозные мотивы - откуда это в вас??\n15 - ваше отношение к наркотикам, алкоголю\n16 - планы на ближайшее будующее\n17 - пару слов вашим слушателям\n12.07.09\tОльга:\tу меня есть принцип - я закончила журфак, и дала клятву гиппократа что я никогда не буду делать работу за коллег и на вопросы буду отвечать только устно. Но у меня есть моя группа и мы живем вместе и я попросила парней ответить на вопросы, вот\n1-Наша группа Образовалась две недели назад.К Нам пришел новый барабанщик.\n2-Я расчитывал увидеть много голых тёлок.А получилось,что пока увидел только одну(Костя-трубач)\n3-Популярность группы зависит от количества популярных людей в группе!Например у нас недавно опять лишился девственности секс - символ группы, Костя так напился, что поддался на очередное изнасилование,А однояичковый Шапо до сих пор свободный.\n4-Да меня постоянно пытаются увести из группы цыгане.Ходят на каждый концерт и поджидают на улице(Дима-Гитарист)\n5-Как то мы с любовником нашего директора красили его гараж,и я пошёл в киоск за водой.Там встретил молодого чувака который спрашивал,есть ли у меня с собой наша аудио касета.По моему это придел всех мечтаний для музыканта живущего в 21веке.(Дима-гитарист)\n6-Мы не строим планы кто сколько будет этим заниматься,можно задать лишь вопрос кто сколько собирается прожить,потому что жить без музыки для нас полный SUCKS(Дима-гитарист)\n7-В родном городе мы занимались кто чем.В культурной столице мы все вместе занимаемся спортом,бегаем катаем йогу,смотрим как наш друг паша катается на Маунтин Борде,А под вечер когда все ложатся спать мы с костей надираемся в хламину.(Дима-Гитарист)\n8-(Костя)-Я дочитываю седьмую версию камасутры,в сентябре перехожу на практику.На меня оказала влияние только единственная книга Майлса Девиса-(автобиография),может быть,потому что это единственная книга которую я читал.\n9-(Костя)-Мой любимы альбом,и музыкальный совместный проект,это Борис Моисеев И Костя Трубач!!!\n(Дима-гитарист)-Мой любимый альбом 30х годов,цыганского,трёх-палого гитариста Джанго Рейнхарда!!!Когда об это узнали цыгане,они решили отыскать меня и отрезать мне два пальца!!!\n10-(Костя- трубач) С переездом в Петербург у нас показывает канал 2X2 , а телевизор у нас стоит только на кухне, и мы когда вместе завтракаем или обедаем одновременно смотрим мультики, например Скуби ду\n11- Каждая песня Alai Oli живет своей жизнью и для каждого человека она значит что то особое и неповторимое, например для нас песня это что то вроде выращенного вместе ребенка, от зачатия до взросления, у Оли рождаются мысли в голове, а мы с группой стараемся вырастить из этих мыслей что то стоящее.(Костя трубач)\n12-( Костя - трубач) Я бы хотел видеть на каждом концерте трех негритянок на подтанцовках, только не знаю как к этому отнесется наша вокалистка.(Оля Маркес)-Пошёл в вон.\n13-(дима_гитарист)-Больше глутомата натрия!\n14-(Дима-гитарист)-Моя бабушка перед тем как я проснусь напевала мне религиозные ямайские мотивы.Откуда это в нашей музыке только ей известно.\n15-Если мы связываем свою жизнь с музыкой,это значит,что мы постоянно сталкиваемся с наркотиками,так что эта тема актуальна в нашей жизни, но сейчас мы регулярно посещаем собрания анонимных наркоманов и это помогает нам не торчать!\nМы собираемся в ближайшем будущем собрать Олимпийский и потом уехать в Индию, учится йоге в одном из университетов в горах.\nэээээээээээ........ среди вас есть красивые и умные девушки? (Костя) Хотя.... Нафига нам умные? (Дима) )))\n"}, {"path": "data/lj_export_clean/posts_md/2009-11-21__5727__уже_не_шуточки.md", "source": "LiveJournal", "date": "2009-11-21", "filename": "2009-11-21__5727__уже_не_шуточки", "content": "# ...уже не шуточки.\n*Date*: 2009-11-21T17:29:00+00:00\n*URL*: https://olymarkes.livejournal.com/5727.html\n*Tags*: близкие, любовь, молитвы\n\nНу ладно, если честно - я к этому всему не очень серьёзно отнеслась. Мы ж не кровь редкой группы ищем для умирающего ребёнка...  Сейчас даже как-то не по себе, что заварила эту кашу. Наверное и правда проще жить, решая свои проблемы \"втихаря\". Хотя, благодаря этому всему я узнала, как некоторые люди ко мне относятся... Пожалуй, ради этого и правда стоит жить", "full_content": "# ...уже не шуточки.\n*Date*: 2009-11-21T17:29:00+00:00\n*URL*: https://olymarkes.livejournal.com/5727.html\n*Tags*: близкие, любовь, молитвы\n\nНу ладно, если честно - я к этому всему не очень серьёзно отнеслась. Мы ж не кровь редкой группы ищем для умирающего ребёнка...  Сейчас даже как-то не по себе, что заварила эту кашу. Наверное и правда проще жить, решая свои проблемы \"втихаря\". Хотя, благодаря этому всему я узнала, как некоторые люди ко мне относятся... Пожалуй, ради этого и правда стоит жить....\nВот Аня Шубина... Я её знаю ещё со школы юного журналиста, т.е. лет шесть, получается...\n\"Критиковать со всех сторон начинают только тогда, когда ты что-то делаешь. Когда ничего не делаешь - и критиковать нечего! Так что уже хорошо.\nКак я понимаю \"команда фи\" - за независимость от денег. А теперь посмотрите на себя - вам жалко отдать человеку 10 рублей - это проезд на трамвайчике. Это НИЧТО. Это даже не деньги! И посмотрите на себя - независите ли вы от денег?\nВы говорите, что Оля думает о мелких проблемах. А вы после прочтения Бродского в туалет не ходите? После Моцарта не сморкаетесь?\nЭто бред говорить о низком и высоком!\nЯ думаю, киньте в меня камень, что у людей из \"команды фи\" просто нету НАСТОЯЩИХ друзей - и им никогда не понять, когда друг тебы вытащит из такой жопы.... что не многие ее и видали... Значит такие люди и сами не могут быть настоящими друзьями. Им всегда будет жалко 10 рублями помочь!\nОля - самый светлый человек на свете, которого я встречала. Ее музыка и она сама помогают мне жить. И еще тысяче-другой на этой планете. Уже за одно это Оле можно платить зарплату каждый месяц. (это конечно, шутка).\nИ занете что - люди из \"команды фи\" - если вас выгонят из дома и вы скажете об этом Оле - она тут же незадумываясь, даже не зная вас оставит у себя жить! Можете не сомневаться! Потому что она НАСТОЯЩИЙ человек.\nА какой вы человек, когда можете оттолкнуть просто так человека, который просит вас помочь?\nМне вас жаль. Честно.\nКогда мы перед Боженькой предстанем - все деньги, квартиры и т.д. останутся греть на земле. Бог увидит нас только по нашим добрым делам. И вы не сможете ему объяснить почему вы однажды пожалели 10 рублей - он сам все знает. Он знает, что вы продались Дьяволу за эти 10 рублей. Так что с Олей в раю вам не увидеться. (простите за излишнюю религиозность).\nИ еще - подумайте для чего Оля стала заниматься музыкой? Для денег, славы или еще чего-то? Нет. Когда она ездила на гастроли и тысячные залы смотрели на нее глазами, на которых наворачивались слезы, Оля голодала неделями - потому что не было денег.\nОна пошла в музыку только для того, что она особенная и у нее есть что сказать и тебе и мне и всем нам. И она так отлично протрясывает иной раз мозги, что ты понимаешь, что пошел не туда.\nИ она делает это ради нас. И не просит ничего в замен. Просто она \"несущая добро\".\nА мы ей обратно добром не платим...\nПросто когда будете говорить, что мир плох, жесток и несправедлив - подумайте о том, кто делает мир таким. И вы увидите, что по одну сторону барикад \"команда фи\", а по другую - \"несущие добро\".\nЯ завтра не буду обедать на работе и положу Оле денег для квартиры.\nЖду камней.\n\"\nИли вот, совсем незнакомая девушка Аня Белая:\n.\".\nМалыш.!не слушай их!Чем богаче человек тем он жаднее и злее!это есть правда!зачем делиться?Ведь мальчики и девочки в дорогом шмоте и на дорогих папиных тачках не знают голода и отсутствия бабла..И считают что каждый должен зарабатывать сам!..Троекратное ура.И респект ребята!А мы-простые люди знаем как это тяжело!Оли..Я с тобой..Ведь я знаю каково тебе..Ведь сама я в такой же ситуации..Добро порождает добро.И
