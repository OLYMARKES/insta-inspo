и ничего не подходило.\nЯ не могла есть, спать   - на моих руках и лице появлялись язвы, мое тело рассыпалось как Ходячий Замок у Миядзяки – и я обнаруживала себя во дворе, все так же с гитарой – и  с сигаретой в зубах, с английским бульдогом Мэтью у ног – и на меня лился дождь или светило солнце, люди смотрели или проходили мимо – только одно было важным… Эта песня.\nУ меня не было голоса уже много недель. Я как русалка, только наоборот – стоило начать погружаться на дно, как у меня сразу забирали это… Я даже не могла разговаривать толком – ну мои друзья помнят, как это было… на самом деле.\nИ я ничего не могла записать – строчки и куплеты, все было об одном. О том человеке, которого я встретила – и от него уже ничего не оставалось,  но я увидела прекрасную душу, как поцелуй Бога. Она жила в разрушеном теле, изъебаном наркотой,  в мрачном городе,  в больном сознании – ведь мы не могли справится с ЭТИМ и мы убивали себя, потому что были крайне измотаны…\nИ я была готова сделать все, что угодно, чтобы спасти его – ведь в этом я видела шанс и для себя… Что кто-нибудь придумает для меня то лекарство, которое вылечит меня.\nИ я позвонила ему в мае, и я сказала ему: «приезжай. мы вылечимся или сдохнем».  И это было как наваждение… Три ебанутых месяца с географией, растянутой от Екатеринбурга через паутину дорог на юг, автостопом пол страны и самолетом обратно… Первые сольники в Москве, первые робкие попытки трезвости…  В тот период я поняла – нет в этой жизни ничего четкого. Когда он злился – начиналась гроза, когда у меня что-то болело – он лечил меня. И все вокруг было наполнено магией, и мне пришлось  поверить в то, что невозможно увидеть глазами.\nМы не были «вместе», как принято у людей. Но мы были будто с одной планеты, мы охуеть как любили души друг друга. Это было очень сильно.  А потом просто… Кончилось время и мы пошли в разные стороны. Без ощущения пустоты – просто закончилась эта история.  Закончилась одна история и началась другая.\n"}, {"path": "data/lj_export_clean/posts_md/82298__про_разных_рэп-исполнителей_текст_который_можно_не_читать.md", "source": "LiveJournal", "date": "Unknown", "filename": "82298__про_разных_рэп-исполнителей_текст_который_можно_не_читать", "content": "# про разных рэп-исполнителей (текст, который можно не читать)\n*Date*: 31 мая 2017, 01:33\n*URL*: https://olymarkes.livejournal.com/82298.html\n*Tags*: #000000\n\nЯ знаю, как устроена творческая кухня - моя, во всяком случае. Я не придумываю слова под «рыбу», я не думаю о слушателе, о том, как написать хит и собрать зал побольше. Я пишу, когда мне есть о чем написать - и сейчас у меня гораздо меньше глубоких и сильных чувств, потому что я счастлива - к сожалению счастье имеет отвратительный побочный", "full_content": "# про разных рэп-исполнителей (текст, который можно не читать)\n*Date*: 31 мая 2017, 01:33\n*URL*: https://olymarkes.livejournal.com/82298.html\n*Tags*: #000000\n\nЯ знаю, как устроена творческая кухня - моя, во всяком случае. Я не придумываю слова под «рыбу», я не думаю о слушателе, о том, как написать хит и собрать зал побольше. Я пишу, когда мне есть о чем написать - и сейчас у меня гораздо меньше глубоких и сильных чувств, потому что я счастлива - к сожалению счастье имеет отвратительный побочный эффект: ты пишешь гораздо меньше. И я считаю, что нельзя идти против этого естественного ритма. Иногда лучше молчать. Но сегодня речь не обо мне.\nМне не интересно, грубо говоря, о чем пишут счастливые, богатые и красивые. Я считаю, что у этих людей самая скучная жизнь, и там все одинаковое. Поэтому мне не заходит Лван, как бы он не старался, сделав производство «хорошего рэпа» своим ремеслом. Про остальную БлекСтаровскую компанию я даже говорить не буду.\nЯ всегда анализирую, как музыка попадает в цель. Что конкретно меня трогает? Что остается во мне? Почему это происходит? И это - самое интересное.\nГлавное - это общее ощущение. То, что между строк и в воздухе, в пространстве между звуковыми дорожками. То, что можно назвать жизнью человека, написавшего эти треки. Я знаю, что в музыку ты вкладываешь всего себя, и дальше вопрос другой: трогает ли твоя жизнь, задевает ли она другого человека за живое, или нет.\nЯ не фанат\n«ГорГорода» Оксимирона.\nВ этом альбоме слишком мало чувства, мне не хватает «маны», не хватает силы, злости. Мой любимый трек у него «Хитиновый покров». Не из-за слов, а из-за того, что в воздухе над ними. Я вижу в этом треке очень много человеческого. А в «Вечном жиде» так много голода и злости, логичных в ситуации, когда автор чувствует свой потенциал но не видит, как он может быть реализован. В этой неуслышенности рождаются самые лучшие вещи.\nВ этом же была и сила\nХаски\n. Черным-черно - это история о том, что между строк. Оно попало прямо в цель именно этим воздухом, который мне так знаком. Ты еще не знаешь все эти будущие бэнг-бэнг и панельки, но с первого этого трека вспоминаешь все подъезды и остановки, где ты жил, потому что эта была твоя реальность: не рестораны, не клубы, не магазины. У тебя есть свой подземный тоннель, и в этой жизни тебе из него не выбраться на свет, где все эти богатые и красивые, которым ты даже не завидуешь. Их просто нет в твоем мире. У тебя - твой мир, и ты играешься с его образами внутри своей головы. Ты можешь рассуждать о том, кого бы ты убил, а кого бы оставил - как в Догме. Ты разговариваешь про себя с людьми в метро, которые никогда не заговорят с тобой на самом деле. Ты знаешь свое место. Знание своего места делает тебя свободным и ты ныряешь в реальность, как сталкер… В «Бэнг-Бэнг» самая сильная система образов:\nГлотает сенсорный экран глаза твои агатовые\nПоезд ревёт надсадно. Я угадываю\nКто ты есть. Мысленно рву брюшину\nИ крепко позвоночную стискиваю пружину\nПлоть твоя дрожит паутиною капилляров\nМне описать не хватило б вокабуляра\nКак потроха извиваясь тигровым питоном\nРаскрывают утробу бутоном\nЧерез секунду станция - вагон фыркнет, его вырвет\nИ кто-то вынырнет, но ты – останься\nТы внутри пронзительно бедна\nНо только там, под оболочкой, так поразительно видна система\nПочему так грустен хайп вокруг Хаски  - так это предположение, что будучи вырванным из контекста, он перестанет так глубоко видеть эти вещи, и только будет стараться умом повторить сам себя. Эти старания всегда видны, очевидны.. Самоповторы, желание повторить свой же успех, остаться собой, стоять на своем… Бррр.\nПисать так, как будто тебя никто не знает, когда тебя знает каждый - вот это то, что по-настоящему сложно. Не смотря на это я думаю, что лучший альбом Мирона мы услышим чуть позже. Почему-то в этой истории я не сомневаюсь. Может потому, как он ведет себя в публичном пространстве: никак. В отличие от Хаски, который теперь везде.\nГораздо интереснее, когда автор бунтует. Например,\nФараон\n. Нет у меня любимого трека, но сам он мне нравится. Вот кто на самом деле не хочет быть красивым, богатым и популярным. При этом он умен,и старается принять реальность такой, какая она есть - и это тоже видно. Мне кажется он поэтому и выбрал образ Курта - тот тоже не хотел быть красивым, богатым и знаменитым. Потому что это та еще блевотина… Чтобы это вывезти, надо быть к этому готовым. Я думаю, что у Фары есть будущее, потому что в воздухе над ним хорошие вещи.\nСкриптонит\n-  это очень сложная история. Он сделал себя сам, прежде всего, усилив свое творческое начало мастерством. Я думаю, что каждая сильная творческая личность чувствует этот воздух, который вокруг и в нем, и каждый решает сам, как его передавать: простым путем или сложным. Адиль выбрал сложный путь, или путь его выбрал. Он стал первым потому, что замкнул весь цикл на себе: и музыку, и тексты, и весь продакшн. И если Хаски ныряет в семантические образы, то Адиль не ограничивается текстом, а использует все возможные инструменты, краски. Мало того, он сам адекватно оценивает получившийся продукт - он знает, какую силу тот несет: ровно ту, которую он в нее вложил. Поэтому он осознанно создает и более сильные треки, и более - не могу сказать «слабые», скорее однобокие, однозначные, не такие сложные. У него есть вкус, используя этот вкус он может создавать конструкции разного стиля, в том числе и для фанатов именно музыкальной части. Фишка треков с «воздухом» - они затрагивают абсолютно всех.\nНа «Доме» моими любимыми треками были «Сны» и «Я не улыбаюсь». Может быть однажды я напишу, почему - мне нравится трактовать это пространство между строк по-своему. На «36» мне хочется показать на примере«Оставь их». Прежде всего потому, что в нем я вижу  самые близкие к коже маски.. Фишка Адиля, что он в своих текстах не является заложником ситуаций: он как бы за ними наблюдает. То есть у него есть слава, деньги/или даже их отсутствие, женщины - но все это не имеет над ним власти. Он даже не бунтует против своих чувств, он наблюдает за ними. Ему одинаково хорошо везде, и одинаково скучно везде - прежде всего потому, что он знает свое место и свое дело.\nЯ думаю, что он использует окружающий мир, как материал для производство продукта: в том числе и чувств. То есть этот человек осознанно не позволит себе стать счастливым, сытым и однобоким в своем самодовольстве.\nВ «Оставь их» тот человек из «Дома» виден так явно. Даже выбивающееся из ритмики слово «наивный» во втором куплете.  Все для того, чтобы передать цвет и запах, ощущение, как будто ты там, на месте, как будто ты вибрируешь в этой реальности, как в осознанном сне. Чувствуешь кожей.\nТы знаешь, как иронично можно сказать про себя  - ну да, потому что я рокстар)) В этом - без гордыни. Просто такой вечер. Завтра я выйду отсюда и возможно не вернусь - и даже не знаю, на самом ли деле мне насрать, или я просто не разрешаю себе думать об этом, как о чем-то важном. Ничто не может быть слишком важным, иначе можно забыть о главном.\nЧто касается\nЛСП\n- не хочется писать о них, потому что вести себя не умеют. А это важно для меня, как для слушателя. Если честно я предпочитаю, чтобы все, о ком я пишу, не читали всех моих мыслей. Потому что для меня это - как футбол по телевизору. Для них - вся жизнь. Мое мнение просто априори ничего не значит, мне просто нравится им делиться. Так вот, нет совершенно желания писать о них хорошее в повседневном потоке, потому что от их треков и от них самих - совершенно разные ощущения. И по тому, что говорят люди и по тому, как они выглядят в интервью. Но я сделаю вид, что я ничего об этом не знаю, а напишу просто про музыку.\nНемалая часть воздуха принадлежит Англичанину, и совершенно не понятно, какой силы эта харизма, если она одинаково проявляется и в\nJohn Doe\nи в ЛСП, но я чувствую этот почерк и для меня иногда музыкальная часть живет отдельно от текста, как в треке «Канкан», например. Но они с Олегом - очень крепкая семья, это тоже чувствуется. Я не много знаю об их жизни, но во всех альбомах круто сочетается ощущение и дна, и света. И чувствуется влияние самых противоположных стилей музыки и в том числе книжных образов. Это не борьба добра и зла, а скорее их синергия. В этом и есть их очарование их музыки, и как хамелеон автор может прикинуться и чувственным и абсолютно циничным даже внутри одних и тех же слов. Истины просто нет. Мне кажется, что автор не решил для себя сам, каким ему быть. Как выгоднее, как безопаснее, или как честнее.\nОдин из моих любимых треков - «что-то еще». Не знаю, описана реальность, или эти чувства выдуманы - но они мне знакомы. В том числе и тогда, когда я жила в похожей реальности. Да, у меня все было - ну вот все: и фанаты, и наркотики, и выбрать можно кого угодно. И такая пустота, потому что чувствуешь, что тебе нужно что-то еще. Мне понадобилось много лет, чтобы наконец почувствовать, что я в том месте, где должна быть. И что я не разрушаю и не разрушаюсь - хотя и в этом очень много энергии рождалось. В те времена я тоже писала самые сильные треки.\nТак же - второй куплет «Бигги». Один из самых крутых. Что касается Tragic City - в нем есть несколько треков, о которых хочется написать. Но тоже не в этот раз.\nПочему мне нравится\nАТЛ\n- я думаю, что у него очень хорошая и стабильная энергетика в творчестве. Ты как будто ощущаешь зрелую личность, с устоявшимися взглядами. Ты любишь его не за метания и поиск истины, а за то, что он уже нашел ее - и может показывать с разных сторон. Те образы и сюжеты, которые он выбирает - это обертка для сути, которую даже не нужно интерпретировать. Мне нравится в нем все. И то, как он сдержан и то, как он последователен. Мне нравится, что вокруг его личности гораздо меньше суеты, чем вокруг его музыки. Мне нравится, что он не замечен в скандалах, он со всеми на ровном - поддерживать его легко и приятно. Быть его фэном, ходить на его концерты и отрываться от души - это не вызывает никакого отрицания внутри. Ни у меня, ни у других людей. Поэтому солдауты везде - и в регионах, в том числе. Ребята сделали все, чтобы их слушателю ничто не мешало. Они отрабатывают концерты идеально, ты вообще не успеваешь задуматься: и на ВИПе, и в зале. Почему-то такое же ощущение было от концерта Бамбл Бизи, но я слишком мало посмотрела. Надо будет сходить еще раз.\nАТЛ я полюбила не сразу, очень постепенно и как-то рекурсивно. От свежего к старому. От «Пчёлок» к «ЧерепХкости». Но уже потом, в течение года и после первого концерта я полюбила их (потому что там еще Ичи, важная часть всего творчества) - целиком и полностью, безоговорочно.\nТо, что я вижу в творчестве ATL - это что-то еще, что я нашла в себе. Безграничную силу. Смерти нет, потому что она уже здесь. Ты точно умрешь - это единственное, что известно на 100% о твоем будущем. И ты знаешь, как тебе нужно жить: знание рождается вместе с тобой, и это кристально ясно. Ты можешь испытывать любые чувства, и ты никогда не роняешь достоинство, делая это. Если будет нужно - ты будешь защищать то, что тебе нужно. Под шаффл всех его песен я делала самые долгие и тяжелые тренировки - по 3, 4 часа. И я чувствовала, насколько эта музыка созвучна силе: силе духа прежде всего, силе характера. То, что в общем-то, что для меня важнее всего.\nЯ думаю, что хорошая известность ATL будет только расти, и не переполнит чашу -  потому что сложно в таком положении дел что-то испортить. Поэтому в этом случае я могу искренне радоваться за своего любимого исполнителя, в отличие от Хаски, например, в чем творческом будущем я стала сомневаться после последнего клипа.\nЛуперкаль\n- это особенная история. Мне понравилось, как кто-то на the flow назвал его \"играющим тренером\". Я слушаю его треки, читаю его в твиттере и испытываю к нему очень нежное и сильное уважение. Как будто пока есть он - есть что-то настоящее, ценности, которые не были обналичены, образы, которые не были выставлены на публику. Как будто он так аккуратно обращается с культурой - так, чтобы ничего не нарушить в правильной экосистеме. Тебе не надо строить небоскреб, если у тебя все в порядке с самооценкой. Тебе достаточно дома. Ну и еще - постебаться над теми, кого увлекает вся эта игра. Мне очень нравится этот воздух вокруг него. Начните с Sarcasm'а) Он никогда не устареет.\nЕще раз повторюсь: мое мнение абсолютно ничего не значит, я не рэп-аналитик, а всего лишь скромный и благодарный слушатель со своей скромной точкой зрения. Мне еще очень хотелось написать про 5-7 других исполнителей, но текст и так получился слишком длинным)\n"}, {"path": "data/lj_export_clean/posts_md/72404__sattamassagana_ch3_-_мексика.md", "source": "LiveJournal", "date": "Unknown", "filename": "72404__sattamassagana_ch3_-_мексика", "content": "# SATTAMASSAGANA ch3 - Мексика.\n*Date*: 16 октября 2011, 13:11\n*URL*: https://olymarkes.livejournal.com/72404.html\n\nТы просишь меня рассказать тебе про Мексику, мой маленький? Знаешь, знаешь о чем просить.\nНа самом деле здесь все гораздо хитрее, чем ты можешь себе представить. И каждая краска в этой картине имеет свою историю.\nЗдесь переплелось множество нитей из моей жизни. И твоя.\nС чего начнем? Может быть с мескалина?  Мне было лет 14, я возвращалась из ночных рейдов по клубам еще в таком воз", "full_content": "# SATTAMASSAGANA ch3 - Мексика.\n*Date*: 16 октября 2011, 13:11\n*URL*: https://olymarkes.livejournal.com/72404.html\n\nТы просишь меня рассказать тебе про Мексику, мой маленький? Знаешь, знаешь о чем просить.\nНа самом деле здесь все гораздо хитрее, чем ты можешь себе представить. И каждая краска в этой картине имеет свою историю.\nЗдесь переплелось множество нитей из моей жизни. И твоя.\nС чего начнем? Может быть с мескалина?  Мне было лет 14, я возвращалась из ночных рейдов по клубам еще в таком воздушном, розовом кайфе без отходняков, который бывает только в самом начале.\nИ вот, когда город только просыпался – светлым и тихим воскресным утром я  включала гоа-транс и читала Кастанеду. Тогда его мескалиновые трипы под руководством Дона Хуана вызывали во мне острые приступы зависти,  я выкуривала кропаль плана с фольги и меня отпускало.\nПотом было много много много много всего, много лет, наполненных событиями. В числе прочего – несколько лет на ботанике, «золотой век» - начало нашей дружбы, нашей семьи – Наташа, ее братья и сестры, мама, ее огромная квартира –и мне в этой семье нашлось место… Мои странные болезни – одна за другой, и все все все градации физической боли, которые я проживала – и погружалась в такие глубины реальности…. Вы даже не можете представить себе, что может вынести человеческий мозг.\nСовсем не наркотики сделали меня тем, кто я есть. Совсем не желание доказать врагам и родителям, что я могу. Только лишь эта физическая боль, растянувшая минуты до бесконечности, то место, где я всегда была одна – и никто не мог разделить со мной это.\nБоря (младший брат Наташи) очень заботился обо мне. В шкафу-гроубоксе у нас в комнате росло несколько кустов самых прущих сортов саттивы, и когда у меня в глазах совсем темнело от боли, Боря срывал для меня несколько листочков и сушил их утюгом. Я выкуривала колпачок свежей травки с ягодным ароматом, и боль немного отступала. Не зря раковым больным в Америке прописывают это, как лекарство. Ни одно обезболивающее не облегчало моих страданий в то время, а вот травка немного помогала.  Кстати, после этого я уже не могла курить дурь для удовольствия или от скуки. Из всех наркотиков первой меня оставил этот – возможно мой мозг связывал травку и эту боль, и  не хотела больше ничего, что было с ней связано.\nТам, в той комнате, в той кровати со мной происходили самые сакральные вещи. Под одеялом под всеми толщами земли в самой горячей точке ада в самой ледяной точке ада в самой острой точке ада в самой в самой беспощадной точке ада  – он ложился рядом, обнимал меня и мне становилось чуточку легче. И это «чуточку» - это по энергоемкости как вся йога, сделаная мной за всю мою жизнь, как все творчество, как все все все…. На самом деле «чуточку» - это может быть очень много.\nЯ никогда не говорила ему, как я благодарна – слишком тесны для этого слова…   Да и не понять никому, кроме меня.\nПрошли еще месяцы, сложились в годы… Вы смотрели фильм «искусственный разум» про маленького мальчика-робота? Так вот, моя реальность тоже была пустынна и залита водой, затоплена на многие миллиарды километров – и я была на самом самом дне.  Прошлое оставалось в прошлом, я даже и не вспоминала обо всех этих вещах, и совсем другое казалось мне важным.\nИ вот тогда мы с мескалином встретились.  Я и Щекалев  искали хоть-какой-нибудь наркоты, но чтобы этим нельзя было ширяться и это нельзя было бы нюхать, потому что мы старались перестать торчать)  гы гы гы. И вот один нащ друг нашел некое количество «волшебного вещества» из моего кастанедовского детства.\nОни (наши друзья) попробовали его, но ничего особенного не произошло.  Про нас такого сказать нельзя… Не буду устраивать тут трип репорт. Не могу даже.\nЯ открыла глаза, и обнаружила себя на ботанике, в той самой комнате. Мы с Наташей не общались долгое время, и по этому мое нахождение в этой комнате было пиздец каким странным фактом. И у меня было множество мест, куда я могла пойти. Почему я пошла туда???? И в тот момент до меня дошло.  Я лежала на ТОЙ САМОЙ кровати, и… и вокруг меня были обои… обои со светящимися в темноте звездочками. Такие же обои были теперь у меня в комнате.. я из сотен вариантов обоев выбрала именно эти… Бессознательно…  Те же самые обои!!!\nЯ так долго не помнила кто я и где мой дом. И где то место, где меня протащило  по всем кругам ада, и где те люди, которые любили меня тогда, когда я была никому не нужной развалиной… Место, где я умерла первый раз и родилась заново.  Это было здесь.  Гроубокс стоял заброшеным, Боря уже давно жил в Москве…\nЯ вышла из дома на летний бульвар района моей мечты и больше никогда не забывала кто я и где мой дом. Больше никогда не забывала.\n«Я выхожу за дверь,\nВ джунгли Ботаники.\nЧерез двадцать лет эта аллея будет тенистой…\nИ я буду всегда любить тебя, мой маленький.\nНо так, чтобы мы оба не падали вниз.»\nВот, это было про одну строчку…  «Мне бы мескалина, и я доберусь до дома…»\nТак и за многими фразами и образами в песнях скрывается очень много…\n«Здесь у хижины моей кактусы считают на небе звездные точки…Та, другая страна спит под белым покрывалом каждую ночь»\nЯ бывала в очень красивых и энергитически-сильных местах,  я встречала много людей, которые хотели там остаться.  В моей жизни бывали такие моменты – любой бы хотел оказаться на моем месте… Но я в тот момент хотела быть в другом.\nТак и бабки, красота и слава не имеют значения – они бесполезны в тот момент, когда тебе просто хочется уткнуться в шею кому-то за десятки тысяч километров от тебя… И воспоминание о счастье как бесконечная тоска вливается в сердце, побеждая теплый южный воздух,  крики чаек и кокаиновый флер.\nЯ не могу себя наебать. Я всегда буду хотеть к тем, с кем мне было хорошо. И это всегда воспоминание о прошлой жизни, в которую уже никогда не вернуться. Ни за какие деньги… В том консульстве выдают только одну визу на целую жизнь.\nТеперь ты знаешь, что нужно делать, мой маленький.  Только нужно ли? Счастье неуловимо и никому не нужно, вся соль в погоне за ним.. И наша бесконечная драма вполне вписывается в эту концепцию, пока будет она – будут новые песни.\n"}, {"path": "data/lj_export_clean/posts_md/11791__no_title.md", "source": "LiveJournal", "date": "Unknown", "filename": "11791__no_title", "content": "# (no title)\n*Date*: 28 мая 2009, 20:48\n*URL*: https://olymarkes.livejournal.com/11791.html\n\nУтром я проснулась и подумала, что совсем выздоровела. Есть не хотелось, но я проглотила пол плошки каши, и села на байк и поехала в сторону уктуса, чтобы пробежать любимую пятикилометровую трассу.. В районе Екатерининского я развернулась и поехала домой, болеть.\nВот и сейчас температура 38.5, и у меня какой-то бред, чесное слово )))\nВообще хотела рассказать, что у нас сегодня были съёмки. Когда нужно ра", "full_content": "# (no title)\n*Date*: 28 мая 2009, 20:48\n*URL*: https://olymarkes.livejournal.com/11791.html\n\nУтром я проснулась и подумала, что совсем выздоровела. Есть не хотелось, но я проглотила пол плошки каши, и села на байк и поехала в сторону уктуса, чтобы пробежать любимую пятикилометровую трассу.. В районе Екатерининского я развернулась и поехала домой, болеть.\nВот и сейчас температура 38.5, и у меня какой-то бред, чесное слово )))\nВообще хотела рассказать, что у нас сегодня были съёмки. Когда нужно работать, мой организм собирает последние силы - я даже как то раз гастроли оттусовалась с пневманией, правда из квартиры в Москве выходила только на концерты - совсем не было сил. До сих пор когда пересматриваю видео - пугаюсь: я там такая бледная и тощая. Сейчас я медленно приближаюсь к тем же показателям.. Потом опять в форму приходить замучаюсь...\nтак вот. съемки. Вчера ночью ко мне забурились Дима и Бро. Я как раз выпила тера-флю и приготовилась лечь и умереть.\n- Тебе менеджер звонил?\n- Я за телефоном не следила что-то... О. семь пропущеных...\n- Так вот. Завтра.. А, нет, погоди. Получается уже сегодня мы должны снять видео (**** здесь - секретное тех-задание, и менеджер меня отшлёпает, если я всё расскажу раньше времени***)\n- !?!?!?!?!?!?!?!?! ОФИГЕТЬ! Завтра?! За один день?! И где мы найдем нормального оператора?!\nКак там в русских сказках бывает? Призадумались мужики.\n- ооооо....! только бы он согласился!!!\nОператор нашей мечты - это Женя Харченко. Я всегда считала, что его работы по летнему экстримальному видео гораздо выше общего российского уровня. Короче, я большая его фанатка.\nДозвонилась я до него только утром.\n- Я очень занят... Может через пару дней?\n- Нееет! - хнычу я - Менеджер сказал - завтра!\n- Ну ладно, в три позвоню и скажу - смогу ли я.\nТак вот. Сегодня весь день я мечтала о двух вещах: первая - не склеить ласты от своей загадочной болезни\nвторая - выполнить задание менеджера, чтобы он.... ох страшно сказать... чтобы он не расстроился, Боже его храни! ))))))\nТак что когда Жека позвонил и сказал, что он все сделает, у меня сразу пропали предсмертные симтомы, я приняла душ, прыгнула на байк и поехала на съемки.\nЧто получилось - узнаю завтра утром. Если Его Менеджерство позволит, обязательно выложу.\nПо доброму завидую всем, у кто не болеет. Хочу кататься, бегать и торчать целый день на любимых улицах лучшего города на земле....\n"}, {"path": "data/lj_export_clean/posts_md/23836__с_днем_рождения.md", "source": "LiveJournal", "date": "Unknown", "filename": "23836__с_днем_рождения", "content": "# С днем рождения!!!\n*Date*: 29 сентября 2009, 12:47\n*URL*: https://olymarkes.livejournal.com/23836.html\n\nСегодня волшебный день. Ровно шесть лет назад у группы Alai Oli случился первый концерт. Я помню его в малейших подробностях... Прошел первый месяц моей учебы в универе, на моей голове тогда еще не было дредов - зато были черные косички с шерстью, которые мне заплели в Египте - туда меня папа отвез отдыхать в награду за  то, что я поступила на бюджет.\n2003  - 2009\nТусовка проходила в легенда", "full_content": "# С днем рождения!!!\n*Date*: 29 сентября 2009, 12:47\n*URL*: https://olymarkes.livejournal.com/23836.html\n\nСегодня волшебный день. Ровно шесть лет назад у группы Alai Oli случился первый концерт. Я помню его в малейших подробностях... Прошел первый месяц моей учебы в универе, на моей голове тогда еще не было дредов - зато были черные косички с шерстью, которые мне заплели в Египте - туда меня папа отвез отдыхать в награду за  то, что я поступила на бюджет.\n2003  - 2009\nТусовка проходила в легендарном PV в Березовском, и знаете - я безумно гордилась тем, что нам довелось выступать в таком крутом клубе. Аппаратура стояла на первом этаже, мы выступали вторыми или третьими - после занудного этно-шоу немногочисленные гости вечеринки сидели и лежали, и я думала будет невозможно их как-то расшевелить. Когда пришло наше время, музыканты мои (тогда был такой состав Денски Валиулов - гитара, Бро на басу, папа Бро \"Дядя Вова\" за барабанной установкой и Петя на барабане, который я привезла из Египта)  только начали подключатся, а я уже вышла на сцену и... Я говорила, говорила, говорила, говорила.\nРаста вечеринка? Я знала о растафарианстве все, что можно было знать, свободно владея английским языком и интернетом. Я была фанатичным адептом этой культуры, при том не бездумно - я не пыталась принести черную культуру на нашу почву, и понимала: идея репатриации так же нам неактуальна, как и всякие ямайские штучки типа: \"черная девочка да да двигай своей попой крошка, а я возьму пистолет и бах-бах застрелю того мудака из соседнего района\". Уже тогда я знала что нужно быть белым и ценить это, и видеть красоту в начальном, простом, стремится к естественности, быть настоящим, свободным от предубеждений и цепей, которые система накидывает. Для меня всегда ключевыми понятиями были: корни, natural mystic - красота, которая говорит сама за себя, Зион - рай, Вавилон - горькая действительность.\nМне удивительно, как я была права... Только со временем я поняла, как раскрываются эти понятия. Что удивительно - пелена с моих глаз спала, когда я перестала курить дурь. Мой \"Вавилон\" - это мои привычки, болезненная зависимость от всякой херни: сигареты (я курила 7 лет), алкоголь, наркотики, деньги, мясо, всякие продукты со вкусовыми добавками, чужое мнение обо мне, одобрение... Natural Mystic - это такая волшебная штука внутри каждого человека, которая всегда будет рваться на волю... Во всю силу она работает только тогда, когда перестаешь искать мудрость, радость и покой в чем-то кроме себя и своей божественной природы. Мой Зион - это просто быть счастливой, быть среди друзей и чтобы обо мне заботились. И еще - не думать, потому что истина не утешительна и горе от ума, а счастье - это такая штука, до которой додуматься практически невозможно.\nТогда мы спели песен пять - они не вошли даже в первый альбом, потому что после тех пяти я написала еще кучу, и они были лучше, красивее... И еще на той тусовке был первый концерт группы \"Музыка для Чарли\". После концерта мы с Бро и еще кем-то пошли гулять, и встретили ребят из М4С (Music for charlie) где-то на улице Малышева. Мы пошли к ним в плотническую мастерскую, которая была у моста на малышева. Мы сидели, накуривались, пили чай и болтали. Вообще - эта группа долгое время была моей любимой. Я безумно им завидовала - столько таланта, такие тексты, такая энергетика! Я знала все их тексты наизусть, и прыгала на их сетах в первом ряду. Мы были хорошими друзьями... Я помню, как плакала в чиллауте Плейнета, когда на нашем сете в зале было в 2 раза меньше людей, чем на сете М4С через пол часа. Мне было обидно и завидно, а потом... потом я услышала первые аккорды моей любимой песни и пошла в зал, и подпевала громче всех. Так моя зависть лопнула как мыльный пузырь, и больше я не помню ни разу, чтобы я кому-то завидовала.\nПотом что-то менялось, и мы стали играть лучше, и песни у нас появились классные - наша музыка нашла уши и души, и на наши концерты стало ходить много людей... Наша бывшая тусовка стала нас поучать: \"что вы играете?!!?!?! Это же не регги!! Акститесь немедленно или мы с вами не вместе!! И перестаньте играть ска! и подумайте над текстами - что это за фигня?\"\nИ те люди, которых я считала своими братьями, и мне казалось что мы вместе делаем дело, что мы - одна семья и ничто нам не страшно, эти люди реально выкинули нас из движухи - стали делать вечеринки и не звать нас, тогда для меня это было реально ударом... Уж очень я их любила.\n\"Мне казалось - я встречала ангелов в клубах,\nЯ ошибалась, приняв за ангелов птиц.\nОни кричали, что реггей имеет рамки,\nА я - что любовь не имеет границ.\nИ не бывает черного и белого,\nМузыка льется из сердца, смывая берега!\nМне казалось - мы вместе искали истину,\nА они искали врага...\"\nХотя если бы не было этого - что было бы с нами? Мы с Бро научились делать вечеринки, делать промо, мы сами расклеивали афиши, делали свой бизнес и ни от кого не зависили. На всех наших тусовках были полные клубы, и всем все нравилось. И мы научились многому и поняли, кто и кому настоящий друг.\nИстория Alai Oli это слишком длинный рассказ для одного поста, а вообще - это много маленьких рассказов, и я обязательно напишу когда - нибудь их все. А в этом - я поздравляю нас и Музыку для Чарли с такой офигенной датой - 6 лет. Если группа доживает до такого возраста - ей по любому есть, зачем жить.\nА еще - сегодня день рождения Паши Дунаева.\nОн - это лучшее творение природы и чего-то божественного. Сверхчеловеческие способности в таком красивом теле, а то что внутри - это целая вселенная, и невозможно даже ничего рассказать.... И по всем мистическим источникам все сходится: когда-нибудь он спасет эту планету.\nА пока - он всего-лишь вице-чемпион мира по маунтинборд-фристайлу и человек, который даже после страшнючей травмы -  не может выполнить рекомендацию врачей - не кататься. Железная конструкция в спине не мешает ему танцевать крамп, делать всякие сумашедшие асаны на йоге, бегать, прыгать и быть -  главное -  моим самым офигенным другом, самым близким человеком.\nhttp://vkontakte.ru/id17712094\n"}, {"path": "data/lj_export_clean/posts_md/83593__не_про_тебя_надеюсь.md", "source": "LiveJournal", "date": "Unknown", "filename": "83593__не_про_тебя_надеюсь", "content": "# не про тебя, надеюсь\n*Date*: 13 сентября 2017, 00:23\n*URL*: https://olymarkes.livejournal.com/83593.html\n*Tags*: #000000\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и в свободное время я часто приходила туда бухать. Если помните, была у меня такая фотография - где я ", "full_content": "# не про тебя, надеюсь\n*Date*: 13 сентября 2017, 00:23\n*URL*: https://olymarkes.livejournal.com/83593.html\n*Tags*: #000000\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и в свободное время я часто приходила туда бухать. Если помните, была у меня такая фотография - где я грустная в шапке и с тысячной бумажкой, положила подбородок на руки на барной стойке. Вот это оттуда.\nТам Ника рассказала мне про анонимных наркоманов. Я поржала, потому что не знала, что это дерьмо бывает в реальности - это же не мать его фильм про Тайлера Дердена. Потом можно следующий кадр - как я иду по дороге в Арамиле - это такой поселок недалеко от Екатеринбурга. Иду по дороге с какими-то тяжелыми пакетами и плачу от того, как мне себя жалко. Иду в свой первый реб.центр, сама, не потому что кто-то меня туда захотел положить, и даже не потому, что я проторчала все - нет..\nПросто боль была такой невыносимой, и я совершенно не знала с чего начать.\n- Ну как же я не буду бухать по выходным с друзьями в клубах?! Зачем вообще тогда жить, работать, терпеть всю эту херню которая в жизни происходит?\n- Не можешь не бухать - бухай, - сказала Ника. - Иди и бухай.\nИ я конечно пробовала без наркотиков, но с алкоголем. Я помню эти «восемь глинтвейнов, пожалуйста, четыре белых четыре красных». Еще до этого было реально такое лето, когда я смогла. Я бегала каждый день, я отлично выглядела - конечно это было тоже после неприятных событий, крайне неприятных. После очень нехорошего апреля и мая. Там был такой период, когда я очень напугала всех друзей. И вот в конце меня сильно тряхнуло, и я перестала. Там было два месяца абсолютной трезвости, просто чтобы доказать себе, что я могу. Чтобы снова почувствовать себя сильной, светлой, быть в себе.\nЯ до сих пор помню это путешествие: мы с Артемом проехали от Екатеринбурга до Анапы автостопом, жили в палатке на берегу. Потом я выпила бокал глинтвейна в уличном кафе Джемете и все - я вдруг не продолжила, не стала думать о наркотиках. Мне казалось, что я излечилась. Что я наконец-то полностью независимый человек. Но ха-ха-ха, святая наивность.\nНу и вот через месяца полтора эта картина: иду по Арамилю и плачу. И там меня встречает Ника и отводит в такой простой кирпичный коттедж, просто дом. Не больница. И вот там я аккуратно заглядываю в себя одним глазком. Я даже не ложусь в этот реб.центр. Я в него приезжаю, прихожу.. Делаю все, что делают пациенты, но как бы не сдаюсь совсем. Я ведь не такая, я особенная, я сильная, и не проторчала еще свою жизнь.\nВот помню что там я нарисовала такой рисунок: вот стою я, держу в своих руках много ответственности: группа, университет, работу, что-то там еще… А подо мной пылающая бездна. Помню, как рассказывала Нике, как у меня вообще-то нет проблем с наркотиками, зато есть со всем остальным, с восприятием тела, с моей реализацией, с моими недостатками.. Она только грустно усмехалась. Я ее понимаю, сейчас я тоже грустно усмехаюсь, когда смотрю в прошлое… Это было только начало, я вообще ничего не понимала тогда, не умела блять думать тупой своей головой.\nНе смотря на пять последующих лет, не смотря еще на один реб.центр в конце этого периода, я почему-то считаю, что я легко сдалась. Мне как-то очень сильно повезло, что я пошла в эту сторону, что из меня какой-то кувалдой жизнь не только выбивала саму возможность употребления веществ, но и заставила меня нырнуть в саму природу зависимости. К этому я и шла эти 5 лет - до 2012 года.\nКогда меня спрашивают, что такое шаги - я теряюсь, как отвечать на такое. Удивительные есть люди, которые начинают это делать, хотя жизнь не проезжается по ним катком. Возможно ли такое? Можно ли получить от них пользу, если ты хотя бы раз не причинил сам себе пиздец, близкий к смерти? Не знаю, чувак, не знаю, как рассказать тебе, что это такое, эти шаги..\nМожет быть попробуешь юнгианский анализ?\nНика до сих пор лечит наркоманов, вон открыла реб.центр. А я стала таким адептом трезвости, что люди при мне даже бухать стесняются. Кто бы мог подумать. Другая сторона реальности - она такая другая. Ты чёткий, как ретина, и уже забываешь как это - хотеть изменить этот факт. Но твоя личная бездна - она никуда не уходит, ты умеешь черпать из нее такие вещи… Короче, грущу я от того факта, что весь этот огромный опыт невозможно впихнуть ни в пост, ни в разговор, ни даже в книгу, чтобы показать, что решение любой моей проблемы на самом деле было в том, чтобы войти в реальность на 100% и осознать себя на 100%. А для этого нужно было не просто сохранять трезвость, для этого нужно было понять, почему я когда-то начала и продолжила изменять сознание. И это невозможно сделать простым размышлением. Для этого нужно работать по правилам. По правилам, которые ты готов принять, когда чувствуешь, что тебе полный пиздец. У кого-то пиздец не наступает до самой смерти, а кому-то больше везет. Но ты права, все это для чего-то нужно. И у каждого своя «ментальная горсточка». Видимо, я еще до этого целый черпак размутила, так, что мне еще на жизнь вперед хватит.\n"}, {"path": "data/lj_export_clean/posts_md/7237__почему_я_не_люблю_наркоманов_и_алкоголиков.md", "source": "LiveJournal", "date": "Unknown", "filename": "7237__почему_я_не_люблю_наркоманов_и_алкоголиков", "content": "# Почему я не люблю наркоманов и алкоголиков\n*Date*: 25 февраля 2009, 02:48\n*URL*: https://olymarkes.livejournal.com/7237.html\n*Tags*: рэп за жизнь\n\n... особенно тех, которые думают что\n1) это все х.ня, они в любой момент могут бросить и т.д.\n2)  тех, кто думает что алкоголь\\травка\\клубная химия - это ещё типа фигня, и нечего бояца. Вообще - все всегда уверены, что бывает и хуже. Например, многие в\\в употребляющие считают, что всё ещё ништяк, если они в пах не коляца.\nпотому я знаю, насколько гл", "full_content": "# Почему я не люблю наркоманов и алкоголиков\n*Date*: 25 февраля 2009, 02:48\n*URL*: https://olymarkes.livejournal.com/7237.html\n*Tags*: рэп за жизнь\n\n... особенно тех, которые думают что\n1) это все х.ня, они в любой момент могут бросить и т.д.\n2)  тех, кто думает что алкоголь\\травка\\клубная химия - это ещё типа фигня, и нечего бояца. Вообще - все всегда уверены, что бывает и хуже. Например, многие в\\в употребляющие считают, что всё ещё ништяк, если они в пах не коляца.\nпотому я знаю, насколько глубоки такого рода  заблуждения, и как легко в это заблуждение впасть и вводить остальных.  Можно всю жизнь позволять этому дерьму обманывать себя, а себе - обманывать друзей, и барахтаться в луже \"контролируемых\" зависимостей... Барахтаться целыми тусовками, убеждая друг друга что всё это - нормально.\nМне страшно, когда я заглядываю в своё прошлое. Мне страшно, потому что я думаю - а я могла ведь и не увидить всего этого...  Счастья и гармонии в абсолютной трезвости. Мне нравятся очень простые вещи, заполняющие мой день: мне нравиться водить тачку, гулять по городу, ходить в кино, проводить время с лучшими людьми на свете, заниматься музыкой, йогой, вообще - спортом, на байке своём кататься, на борде...  И с каждым новым днём без \"доппингов\" я  чувствую себя сильнее и  счастливее )\nАлко-треш, бесспорно, весело - ...?? Один раз, два.. А потом это превращается в постоянную погоню за весельем, саморазвлечением. Вся жизнь - как х.евый театр...  Я могу по этому поводу долго рассуждать. Не с высоты колокольни 3х недель без алкоголя ))))\nПросто смотрю на себя, на свой опыт - как хорошо, что мне ещё раз не пожалели здравомыслия и сил остановится, сказать \"стоп\", пока я не успела в очередной раз растерять душевную гармонию и любовь внутри меня.\nХочется ли мне иногда? Да, хочется. И самое большое желание моё - чтобы не хотелось никогда. И чтобы друзьям моим не хотелось...\nНу и вдогонку - видяшечка... Посмотрела два раза аж. Реквием по мечте - только всё так сочно, по-голливудски. У нас реальность по-другому пахнет и выглядит, господа...\nhttp://vkontakte.ru/video1964953_40951472?add=1\n"}, {"path": "data/lj_export_clean/posts_md/76515__лучшее_интервью_со_мной_-_от_кати_зыковой_про_йогу_и_главное.md", "source": "LiveJournal", "date": "Unknown", "filename": "76515__лучшее_интервью_со_мной_-_от_кати_зыковой_про_йогу_и_главное", "content": "# Лучшее интервью со мной - от Кати Зыковой. Про йогу и Главное.\n*Date*: 28 августа 2012, 09:19\n*URL*: https://olymarkes.livejournal.com/76515.html\n\nОригинал взят у\nfat_is_dead\nв\nПравила жизни Ольги Маркес\nПравила жизни Ольги Маркес\nЙога - это очаровательный путь.\nКаждое движение снаружи - оно пропитано грацией, красотой. Вот всем, что есть в мире: как ветер качает деревья, как двигаются животные. Не случайно асанам даны названия животных. Все эти естественные движения, вся эта красота, она есть", "full_content": "# Лучшее интервью со мной - от Кати Зыковой. Про йогу и Главное.\n*Date*: 28 августа 2012, 09:19\n*URL*: https://olymarkes.livejournal.com/76515.html\n\nОригинал взят у\nfat_is_dead\nв\nПравила жизни Ольги Маркес\nПравила жизни Ольги Маркес\nЙога - это очаровательный путь.\nКаждое движение снаружи - оно пропитано грацией, красотой. Вот всем, что есть в мире: как ветер качает деревья, как двигаются животные. Не случайно асанам даны названия животных. Все эти естественные движения, вся эта красота, она есть в йоге, а все что происходит внутри - это прекраснее еще во много тысяч раз, но этого никто не видит. Многим этого и не надо видеть.\nЙога - путь для тех, чей живой ум не дает им покоя.\nНапример, если тебе не помогает таблетка от головы - ты начинаешь искать более сильное лекарство. Если тебе не помогает более сильное лекарство - ты идешь к доктору. Если тебе не помогает доктор - ты идешь, ну не знаю, к шаманам. Если тебе не помогают шаманы, ты идешь в церковь. Так же и йога - один из способов поиска душевного покоя. И он работает непонятно почему. Может быть, потому что ему нельзя дать четкого объяснения.\nЕсть люди, у которых своя йога\n. Например, я не могу представить Алину Пязок практикующей Сурью Намаскар. Но ее работа, когда она снимает, когда она в процессе - это йога. Она полностью поглощена, у нее нет никаких посторонних мыслей, она не гоняет в своей голове за что-то. Да, она гоняет потом, но именно в процессе - это ее йога. И есть куча людей, которые поглощены этим. Дальнобойщики те же самые - они ведь то же по сути дела занимаются йогой. Потому что они ведут тачку, и они сосредоточены, и они находятся в этом состоянии медитации. Оно им присуще.\nЙог – это вечно танцующий, вечно поющий в душе человек, что бы он ни делал\n. Мне не всегда удается быть такой. Большую часть времени я гоняю в голове за те же вещи, что и вы.\nВы становитесь совершенным йогом, когда на каком бы месте вы ни были, что бы вы не испытывали – вы ощущаете себя на своем месте.\nИ вам достаточно.\nНевозможно застыть на одном месте, но можно учиться действовать по обстоятельствам.\nИ когда у вас получается круто и красиво - это и есть йога.\nМожно бесконечно копать вглубь и вширь йоги, но самые главные вещи в нашей жизни происходят не на коврике.\nКаждое ваше взаимодействие с этим миром, то, как вы его касаетесь - это и есть результат вашей практики.\nЗнаете, как когда мы не можем быть с тем, кого мы любим. Или как иногда мы любим тех, кто не любит нас. Мы думаем: что тогда делать? Куда девать всю свою любовь? Всю свою нежность, которой так много в каждом человеческом существе? Тогда вы поворачиваетесь спиной к тому, кого вы любите и всю любовь вы направляете в каждое прикосновение к этому миру. Вы прикасаетесь к нему так, вы отдаете ему так - как вы отдаете любимому человеку. И ваша любовь облетает этот мир по кругу. Возвращается к тому, кого вы любите именно в том виде, в котором она ему нужна.\nКогда мы практикуем - мы становимся шире.\nНаша душа становится шире. Мы понимаем, что взаимность не положить в карман. Это не та вещь, которая нас успокоит. И что люди, которые смотрят только друг на друга - не видят очень много.\nКогда ученики не доверяют преподавателю, а такое бывает - это нормально, потому что не может быть один преподаватель на всех.\nКогда люди начинают сомневаться, не принимать, не доверять. Когда кому-то не хочется всё делать, и он жалеет себя и подвергает всё сомнению. Он говорит: «Зачем это нам надо? Зачем это надо мне?». Тогда мне тяжело. Возможно, моего профессионализма просто не хватает, чтобы сглаживать все острые углы, но так бывает. И особенно чувствительно это воспринимается, когда народу не так много.\nТо, что мои ученики улыбаются, то, что я вижу, как они стараются – это показывает мне, что я живу не зря.\nНе что-то другое в моей жизни, что может казаться, важнее, а именно это. То, что я вижу, как они это делают. То, что какой-то мой сердечный порыв позволяет им встать и начать отжиматься по вот этому бипперу в таймере. Я понимаю – значит, что-то здесь есть.\nТо, что мы с Ксюхой сейчас преподаем вместе йогу – это чудо.\nОна была, наверное, единственным врагом в моей жизни. Единственным. Представьте, что вы учитесь в школе и есть девочка, которая постарше и которая вас гнобит постоянно. Это Ксюха. И она была единственным человеком, которого я реально ненавидела просто годами. И время шло, и все настолько странно сложилось, что мы оказались здесь, в Южном. Что мы начали общаться, и «строить нашу любовь заново». И с этим человеком мне сейчас так хорошо вместе, реально. И она преподает йогу, и я тоже, и не смотря на то, что мы очень разные по характеру, мы дополняем друг друга и это очень круто.\nЯ приезжаю на курсы, чтобы показать людям, как много они могут.\nПоказать, какие они на самом деле сильные и смелые. Какие они могут быть великолепные. И я счастлива, когда вижу, что они начинают меньше страдать, что в них появляется больше счастья, больше радости внутри.\nНет цели лучше, чем приносить людям пользу\n. Нет ни у кого из нас никакого другого предназначения в жизни. Ни у одного. Каждый говорит: «Какой смысл жизни у меня? Зачем я живу? Построить бизнес?» Это все бренные вещи. То, что мы можем делать каждую минуту нашей жизни - это помогать другим, избавлять их от страданий. Любыми возможными способами. Шутить, преподавать йогу, делать творчество, переводить бабушек через дорогу, давать списывать соседу, одалживать денег друзьям, прощать тех, кто, поступает с нами по-скотски. Но это сложно делать, пока ты не практикуешь, пока ты не занимаешься самопознанием.\nСамое крутое - это видеть глаза учеников.\nМне ничего не нужно взамен, вообще. Лучшая благодарность - это видеть как они практикуют, когда они берут и делают. А остальное уже придет само. Они – моя семья и семья друг другу. И так будет всегда.\nНа заезде со мной постоянно тусуются мои старые ученики,\nкоторые после каждого занятия облепляют меня кольцом и  никто не смеет подойти, потому что они сразу же делают злобные лица и типа: «рррр!». (смеется) Мне это нравится, потому что у меня остается больше энергии находить какие-то слова и давать знания для всех. Потому что, когда общаешься с каждым отдельно - очень много энергии уходит. Не то чтобы сил каких-то, а именно энергии. Я даже не понимаю, как это происходит, но это происходит. Это факт.\nБольше всего из йога-туров мне нравятся и запоминаются всякие шутки, которые рождаются в процессе.\nТо есть они остаются. Переходят из уст в уста. Например, на этом заезде у нас главная шутка про то, что Катю разнесло: всем вокруг, всем окружающим, очевидно, что Катя - она вообще глиста, просто дрищ! Такая тощая, что на нее просто смотреть страшно. А у нее на лице написано: \"Ой, мне кажется, меня разнесло!\". Это же сразу понятно, кто о чем думает, прикрывая свое прекрасное тело ВОООТ такими вот одеждами!\nМеня никто не короновал в преподаватели.\nНикто не выдал мне допустительную к преподаванию бумажку. У меня нет флага, которым я могу махать перед чужим носом, что я преподаватель. У меня ничего нет кроме моего опыта и желания помочь людям. Раньше у меня был страх, что меня осудят, как преподавателя. Что мне скажут что-нибудь типа: «Это неправильно». Или, как мне однажды сказали: «Ты себе противоречишь». Но этот страх, он ушел вместе с обидой на эти слова. Потому что я признала - да, я не идеальный преподаватель.\nПочему я должна чувствовать себя виноватой за то, что хочу помочь людям, но не всегда знаю, как это сделать?\nМое намерение, оно обретает разные формы, и я надеюсь, что в большинстве своем эти формы успешны. Потому что если нет, то конечно, заниматься тем, чем я занимаюсь - не стоит :)\nЯ умею радоваться простым вещам.\nИ это очень важная вещь, которая подпитывает в любую секунду.\nЯ вообще никогда не могу сказать, что я - один и тот же человек.\nЯ постоянно меняюсь. Я не знаю, кем я была вчера и кем я буду завтра. Но я знаю, кто я есть сейчас.\nНельзя спрятаться от дождя, если он внутри.\nКогда я дохожу до самого эмоционального дна - меня уже ничто не может поддержать. Никакие вещи, никакие места, ничего. Есть инструменты восстановления равновесия. То есть я знаю, что эти вещи мне помогут. Если я схожу в храм, схожу на группу, если я пообщаюсь с друзьями, если я проговорю всё, что я чувствую. Но это не помогает сразу, это инструменты, которые помогают, чтобы это состояние не затянулось...\nМне кажется, я раб эфира.\nНу, то есть меня может просто выключить. Мне могут как будто бы канал кислорода перекрыть и я буду так - пфф! - отъезжать эмоционально. Все может быть хорошо, но мне плохо и я не знаю, когда это кончится. Я стараюсь просто привыкнуть к этому, смириться, но так не получается пока. То есть я счастлива, счастлива, счастлива, пока мне позволяют такой быть. А потом щелк! и всё. И я жду...\nЕсли бы я рассказывала о чем-то, что никогда и никто не мог бы проверить - я бы рассказала о том, каков мой Бог.\nТа высшая сила, с которой я взаимодействую, та любящая сила, которая обо мне заботится. У нее очень хорошее чувство юмора. Очень хорошее. ТАК стебаться надо мной, это надо уметь. Даже все мои отношения с наркотиками - это просто супер шоу. Когда я сорвалась и решила: «Всё, я пойду торчать!» и пыталась найти наркотики - нигде, просто нигде и ничего не было. От меня все попрятались, как мыши. Или поехала вырубать, а сумку со всеми своими вещами, деньгами и документами оставила висеть на вешалке в кафе, и, только доезжая до места, это обнаружила. КАК ТАК?! И мне приходилось ехать обратно, и сумка оставалась на месте. Вот так.\nМоя высшая сила - она меня не карает.\nНо она, подстебывая меня достаточно жестко, показывает, что я делаю неправильно. И она действует через множество разных вещей. Через людей, через то, что они говорят. То, что она заботлива и не скупится на чудеса – это факт и у меня нет возможности не верить.\nЧудеса в моей жизни происходят каждый день.\nНе всё получается в этой жизни так, как я хочу.\nВсё на свете может быть гораздо сильнее меня\n. Конкретные примеры: вчера я решила, что боль уже не сильная, и я не буду пить таблетки, но потом она усилилась, и я не могла больше терпеть. Мне казалось, что боль сильнее меня в этой ситуации. Когда в отношениях я решила, что больше не буду первая звонить и писать, я терпела несколько дней, а потом не сдержалась и позвонила. Так что любовь может быть сильнее меня. Обстоятельства. И, конечно, одержимость.\nЯ счастлива.\nВ тусовке никогда не говорят о главном.\nЗдесь мы каждый день говорим о главном.\nЗнаете, что происходит, когда ты оказываешься с людьми из творческой тусовки: со всеми этими музыкантами...\nТы встаешь напротив этого человека, с которым ты давно мечтал пообщаться, потому что он типа такой же как ты, он тоже творческий человек, тоже вроде умом не дурен и занимается хорошими вещами... Но понимаешь, что не знаешь, о чем говорить. Обсудить новости? Или сказать: \"Давай поговорим о высших материях? Что ты думаешь о Боге, например?\"? Так не происходит.\nБывает, что проходят годы, прежде чем ты с кем-то из знакомых или друзей начинаешь говорить о действительно важных вещах.\nКак у Полозковой: «Почему с нами говорят на любые темы, кроме самых насущных тем?»\nСлова это слишком несовершенная форма.\nМы реально извлекаем изо рта звуки и думаем, что этим можно весь мир объять, но это всего лишь гласные и согласные. Да, это много. Но в тот же момент это – чертовски мало. А вот когда я вижу, что мы делаем 1000reps или 600, я вижу, что человек поглощен вот этим действием, он старается. Ну, то есть я вижу, что девочке реально тяжело, но она старается, она выкладывается – и это всё, что мне нужно взамен от моих учеников. Тогда я понимаю, что не зря сюда приехала.\nМы все хотим быть хорошими, но у нас не получится, пока определенный набор действий не будет осуществлен.\nНевозможно просто встать с утра и сказать: «Всё! С сегодняшнего дня я хороший!» Поэтому мы все собираемся на йога-туры.\nРиторический вопрос - что сильнее: хаос или гармония. То, что происходит здесь в мире - это хаос.\nПредставьте, что в один момент все взорвалось. Что-то было целое, а потом взорвалось, и это что-то разлетелось на огромное количество маленьких частей. Оно разорвалось, но от этого существовать не перестало. И все эти частички, они продолжают существовать рядом. И каждая из них думает, что она отдельное целое. Это хаос. Но так как все это продолжает быть частями одного целого - все чувствуют связь. Это гармония, к которой мы все стремимся. То есть мы все стремимся вернуться к изначальному состоянию единства. И если хаос - это отправная точка, а гармония - это конечная точка, то мы находимся в вечном бесконечном движении к гармонии. Потому что, когда мы ее достигнем - движение остановиться, и мы перестанем существовать, как отдельные единицы и, возможно, это когда-нибудь случится.\nКак только мы станем единым целым, мы перестанем страдать.\nВсе в жизни ошибаются.\nЯ ошибаюсь. Легко быть правым. Легко любить красивых людей и тех, кто поступает по отношению к нам только справедливо. Гораздо сложнее любить тех, кто поступает с нами несправедливо. Знаете, часто кто-нибудь поступает с нами по-скотски, мы начинаем бить себя пяткой в грудь, что: «Это же несправедливо! Как вы можете со мной так поступать?! Я же не заслужил этого! Я не хотел вам зла, а вы поступаете как мудаки». Это нормальная вещь. Все в жизни ошибаются, и вы ошибаетесь, попутно раня других.\nВ мире нет справедливости, но есть милосердие, которое помогает всё сглаживать.\nИ когда вас кто-то обижает, вы поступаете по отношению к этому человеку милосердно и прощаете его. И когда вы ошибаетесь, вы поступаете милосердно по отношению к себе, вы разрешаете себе это, вы понимаете, что другие могут вас простить.\nВы внутри – это ёжик.\nПредставьте, бежит по полянке, и когда он увидит человека или другое животное – он съеживается. Вот ваш ум, он видит разные объекты в этом мире и он реагирует. На шикарную телку из рекламы, на чьи-то слова. Как бы угодно я не выглядела, про меня по-любому говорят какие-нибудь гадости. «Ооо. Похудела! Наверняка, опять на героине!» или «Фу! Как тебя подразнесло!». Люди всегда так говорят. И вот моя душа, которой нормально, которая бежит себе по полянке, к ней поступают всякие такие объекты и она съеживается. Но если раньше она съеживалась сильно и болела долго, то теперь она съеживается все меньше. И я все больше могу над собой посмеяться. И это очень крутое качество, которое помогает идти по жизни с сиянием, со светом.\nЛюди, которые гонимы страхом – они выглядят забитыми.\nВы наверняка встречали очень красивых и успешных людей, которые почему-то были серьезными. Почти всегда такое поведение это страх. Вы можете достигнуть своего желанного состояния в теле и весить 45 килограммов. Или вы можете заработать денег или выйти замуж, если вы мечтаете об этом. Но вместо тяги обрести это приходит страх это потерять.\nВесь гламур, вся эта культура, которая построена на распушении перьев, на показ, на демонстрацию положительных качеств – это когда человек пытается убедить массу людей, что «на моем месте быть хорошо».\nОни думают: «Быть может, если все они поверят, если все они захотят быть на моем месте, может быть мне на нем станет хорошо?» И самое страшное, когда люди начинают в это верить. Но, как у Pink есть песня «I wanna be somebody else», так и они хотят быть кем-то еще. Потому что на их месте не круто.\nЖизнь, это как серф – стихия, и никогда не знаешь, что будет в следующую секунду, невозможно прогнозировать.\nМы не просто стоим, а несемся сквозь время и пространство, сохраняя баланс. Постоянно учимся сохранять в нашей жизни грацию, во всех наших поступках, во всем, что мы делаем.\nВсе испытания надо встречать с благодарностью.\nИбо любая вещь, любая потеря, любая утрата, любая трудность - она заставляет вас думать по-другому.\nПошутить над внешним видом, по сути, то же самое, что сказать: «что-то у твоей тачки бампер покоцанный немного».\nМне не важно - будете ли вы заниматься йогой, будете ли вы заниматься сектой, мне неважно - будете ли вы худы или толсты, накачаны вы или вас разнесет. Меня это абсолютно не беспокоит. Вы можете приехать ко мне в следующем году и весить хоть 400 кг. Я над вами пошучу, конечно, но это будет просто с любовью. Для меня важно только одно - чтобы вы были счастливы. Как можно больше. Это самое важное. Все остальное - это фигня, это всё проходит.\nЕсли я представляю свою старость как-то, то выглядит это примерно так - я сижу и вокруг меня мои любимые ученики, те, кто были со мной в любой ситуации\n. Всё в жизни волнообразно: мы бываем богатыми и бедными, успешными - неуспешными, и со мной такое бывает. Постоянно. Все меняется. Но люди, которые меня не бросили в любой ситуации, мне кажется, что эти люди придут именно из этого круга. Они будут сидеть рядом со мной, и вокруг будут бегать их дети и их внуки, и мы будем учить их чему-нибудь хорошему. Возможно, они не будут нас даже слушать, потому что мы будем старыми занудными старперами, которые будут говорить: «Занимайтесь спортом, дети!», а они нам такие: «Не, не, мы лучше пойдем кундалини возьмем!», но это будет уже не важно..\n"}, {"path": "data/lj_export_clean/posts_md/36816__no_title.md", "source": "LiveJournal", "date": "Unknown", "filename": "36816__no_title", "content": "# (no title)\n*Date*: 24 января 2010, 19:42\n*URL*: https://olymarkes.livejournal.com/36816.html\n\nВ той книге написано: люди умирают, а истории про них остаются.\nА может подождать? Может хотя бы доехать от Кольцово до дома? Или сказать за завтраком в Донне Оливии? Да нет. Чего тянуть. Я опять не спала. Я вспоминаю длинный список опасных состояний. Конечно, я боюсь.\n***\n- И кто он?\n- Мне надо пойти получить багаж.\n- Я получу. Скажи, кто. Ну видишь, я же нормально реагирую. Скажи.\n- …\n- Я его знаю? ", "full_content": "# (no title)\n*Date*: 24 января 2010, 19:42\n*URL*: https://olymarkes.livejournal.com/36816.html\n\nВ той книге написано: люди умирают, а истории про них остаются.\nА может подождать? Может хотя бы доехать от Кольцово до дома? Или сказать за завтраком в Донне Оливии? Да нет. Чего тянуть. Я опять не спала. Я вспоминаю длинный список опасных состояний. Конечно, я боюсь.\n***\n- И кто он?\n- Мне надо пойти получить багаж.\n- Я получу. Скажи, кто. Ну видишь, я же нормально реагирую. Скажи.\n- …\n- Я его знаю? Скажи.\nОн говорит: скажи. Он говорит: скажи. Он говорит: скажи кто.\nДа да да. Ты же такой. Ты же самый лучший. Ты же совершенство. Мы же из одного племени, одной крови. Ты же воин. Ты же здесь для меня. Конечно ты говоришь: «скажи». Потому что ты все ещё не уверен, что я не придумала все это, потому что это место - твое или ничье. Третьего варианта нет.\n- Я не знаю, как это получилось. Я просто чувствую… когда я с ним – глупая улыбка расползается на моём лице, и мне хочется провалиться и я отворачиваюсь прячу глаза\n*лучше хуже ты же помнишь это оценка ума – тут как в йоге, помнишь? Он просто ну совсем другой. Небо и земля – ну как можно сравнить – просто я хочу быть там хочу быть там просто хочу быть там а тут не хочу, ну что теперь делать?\nЯ чувствую, как над Кольцово начинает расползаться зона турбулентности. Я чувствую, как кровь в его венах становится на пару градусов горячее. Я чувствую, как внутри меня запускаются химические процессы – пшшшшшшшшш – мозг впрыскивает в мою кровь нечто, отвечающее за защитные реакции.\nКогда мне страшно, я смеюсь. Чем страшнее – тем громче я смеюсь. Начинается все с маленькой ехидной усмешки. Эта херня вечно не дает мне устроить нормальные человеческие разборки. Я всегда выгляжу как бессердечная падла, которая смеется над чужой болью.\n- .... скажи.\n- …. – я протягиваю свой телефон, и показываю имя в телефонной книжке.\n- …!?!?!?! ХАХАХАХАХАХАХА! ДА?! ДА ЛАДНО?!\n***\nВ машине я смотрю в окно. Он говорит, я ничего не слышу. Дышу глубже, только чтобы не засмеяться в ответ на очередной вопрос - он пытается выяснить насколько я дерьмовое дерьмо.\nОн говорит:\n- Ты на меня ещё дрочить будешь!\nДверь в подъезд. Лестница лифт удар в стену *громко очень громко не кричи пожалуйста нет нет нет только не это моё нервное ахаха у меня нет сил я так устала я давно не спала он же знает он все знает как я знаю эти морщинки у глаз знаю да конечно ну что ты в самом деле ты же родной мне человек да конечно я люблю тебя и всегда буду любить это написано в майянском календаре и во всех остальных календарях на свете мне не стереть предыдущие 13 ступеней когда мы уже стоим на последней ну не врать же мне я слишком тебя уважаю нет нет не из за него – с ним это химия магия и раз это есть, значит тут уже точно – всё. А сначала я же просто хотела быть одна просто быть без тебя потому что с тобой – покой и безопасность, А МНЕ НЕ НУЖЕН ПОКОЙ МНЕ НУЖЕН КАЧ да что угодно, хоть сдохнуть в одиночестве в пустой квартире пусть меня проклянут забудут я буду торчать и гнить заживо а ха ха ха ты ведь слишком хороший а я кусок дерьма видишь тебе больно а… А мне просто было удобно в колыбели твоей любви ну и не хватало сил у меня. А У КОГО БЫ ХВАТИЛО?! ПОСМОТРЕЛА БЫ Я НА ВАС НА МОЕМ МЕСТЕ * но смотри я готова променять тепло от миллиона звёзд на маленький огонёк inside me. Он меня греет сильнее. Я не мерзну. - я просто думаю, а сказать не могу.\nЯ закрываю за ним дверь, раздеваюсь, разбираю одежду. Нет музыки, нет ничего – только я и эти смс, падающие мне в холодные ладони.\nОн говорит:\n- Что ты ржешь, сука, у меня мир рушится.\nВытираю пыль со стеллажа, со стола, с подоконника.\nОн говорит:\n- Конечно, я рад за тебя если все так… Если тебе хорошо. Просто это - моя защитная реакция.\nРаскладываю по полкам книги и журналы. Сюда – Менс Хелс, сюда – Йога и Шэйп, сюда – Джи Кью, Эскваир, Афиша, Банзай, Хулиган.\nОн говорит:\n- Нет нет нет, не поверю – ты никого не любишь. Только себя. Ты просто нашла своей заднице место потеплее. Ты повелась на его звездность или бабки и не говори, что в душу влюбилась хуйня это все. Ты не умеешь любить.\nРазглядываю школьные фотографии. Читаю Юлин дневник. Раскладываю dvd диски, выбрасываю ненужные бумаги. Я прибираюсь в своей старой жизни, которая осталась здесь еще пол года назад. Я аккуратно раскладываю по полочкам всё нужное, ненужное летит в мусорные пакеты.\nОн говорит:\n- Ты и меня никогда не любила. Ты не умеешь.\nЭто мой дзен. Моя медитация. Нет. Меня не мучает совесть. Нет. Мне не стыдно. Я ни о чем не думаю. Я просто прибираюсь в своей квартире на Ботанике. Загружаю кружки в посудомойку.\n• конечно я не умею, я не умею я боюсь да да да мне нельзя давать в руки ничего хорошего я все уничтожаю я плохая ты хороший ты ты ты хороший я плохая ха. Ха. Ха. * а говорю: «прости, я не знаю что тебе написать»\nЗа окном солнце. И улица 8е марта. И улица Шварца. И чуть-чуть улицы Крестинского. Вон Южная. Башни – дома, и крыши и окна повсюду. И бездонное синее небо. И солнце. И ты там. И знаю, что пиздец. И знаю, что ты в зелёной куртке sessions и клечатых штанах discovery и в желтой шапке analog и в кедах gravis со своими вьющимися кончиками золотистых волос у лица, со своей бездонной душой, безусловно достоин всей этой красоты за моим окном, а больше нет у меня ничего. У меня нет лекарства для нас обоих…\nОн говорит:\n- я ненавижу тебя. Тебе любовь чужда. Эгоизм и самовлюбленность это твоя любовь, и еще весело так, тебе придется забыть что такое оргазм и счастье так что иди ты жопу, любимая, ты все убила.\nОн говорит:\n- ничего не надо писать.\nЯ мою пол. Мне хорошо и спокойно. И я не чувствую себя дерьмом. И виноватой – тоже. Сожгите меня на кострах инквизиции, но я ничего не чувствую – только такое молчаливое принятие данности.\nОн говорит:\n- Я понял свою позицию… я уважаю твои чувства, и иди в жопу.\nВот так гораздо лучше. Теперь тут везде чисто. Теперь тут идеальный порядок. Все на своих местах.\n***\n24.10.2010\nОн говорит:\n- Я сегодня провел волшебную, магическую ночь... Был на дне рождения и влюбился. В именинницу.\nЗатягиваюсь кальяном. Очень полезная информация.\n\"Я рада.\"\nОн говорит: её зовут Настя. Она *** в ***\nЗатягиваюсь кальяном. Очень полезная информация.\nОн говорит:\n- Я просто хочу, чтобы  ты узнала это от меня.\nЗатягиваюсь кальяном. Очень полезная информация.\n«Иди в жопу!»\nОн говорит:\n- Ты же рада?\nОн говорит:\n- Относись проще!\nНичего не отвечаю. Ну задело, да. Задело. Но не сильно.\n"}, {"path": "data/lj_export_clean/posts_md/75154__беги_форест.md", "source": "LiveJournal", "date": "Unknown", "filename": "75154__беги_форест", "content": "# Беги, Форест :)\n*Date*: 22 марта 2012, 11:51\n*URL*: https://olymarkes.livejournal.com/75154.html\n\nЯ не профессиональный бегун. Не техничный, не педантичный – но при этом очень страстный )))\nКогда-то бег для меня был чем-то фантастичным. Пока весь мой факультет наматывал круги по Парку Пионеров – я сидела в кустах и курила. На последнем круге я выползала, чтобы пробежать показательные 20 метров до преподавателя. Даже эти 20 метров давались мне нелегко. И это было столь очевидно, что даже препод", "full_content": "# Беги, Форест :)\n*Date*: 22 марта 2012, 11:51\n*URL*: https://olymarkes.livejournal.com/75154.html\n\nЯ не профессиональный бегун. Не техничный, не педантичный – но при этом очень страстный )))\nКогда-то бег для меня был чем-то фантастичным. Пока весь мой факультет наматывал круги по Парку Пионеров – я сидела в кустах и курила. На последнем круге я выползала, чтобы пробежать показательные 20 метров до преподавателя. Даже эти 20 метров давались мне нелегко. И это было столь очевидно, что даже препод меня не ругала.\nМоя любовь к спорту началась с того, что друзья подарили мне бмх – таким образом из абсолютно ленивого животного я превратилась в более-менее подвижного человека. А потом мы с Макаровой начали бегать.\nНачало.\nЕсли вы никогда не бегали – вам будет трудно преодолеть даже смешное расстояние. И это – нормально. То же самое относится к тем, кто делал большой перерыв.\nВаши первые выходы на улицу в кроссовках – это очень важные шаги:\nобозначение намерения БЕГАТЬ.\nКогда начала свою беговую карьеру Алина Пязок – у нее была следующаяя программа: круг по Таврическому саду. В первые разы это выглядело примерно так: 30 метров бежим – 20 идем. То есть бежишь, пока можешь.\nУже через неделю – две паузы очень сильно сократились, а через месяц Алина бегала первый круг без перерыва и второй – с несколькими паузами. Молодец, Алина ))\nПоэтому не стремайтесь, все «крутые» бегуны с серьезными лицами тоже когда-то начинали, и поверьте мне, они с уважением смотрят на вас - понимают, как вам тяжело.\nЙога и Бег.\nЙога появилась в моей жизни значительно позже. И многие встреченные мной преподаватели кривили лицо и говорили о вреде бега для позвоночника и суставов. Говорят, что бег отрицает саму идею йоги. Но и здесь мне было что возразить.\nКак же тяжелый физический труд? Неужели йог не может заниматься работой, которая «изнашивает» его тело? Йога – это не секта, а философия – она применима к любому образу жизни и к любой профессии, и призвана минимизировать любое страдание и любой вред, который наносится вашему существу тем, что вы делаете.\nУ меня есть одна знакомая йогиня – недавно у нее был лютейший запой, затянувшийся на несколько месяцев. И раз в неделю к ней приходили ее ученики – в те дни она начинала пить не с самого утра – и она была так благодарна йоге за этот небольшой островок трезвости…. И это – истиная суть йоги. Уменьшать страдания любого человека!!!\nТак йога протягивает вам руку в сложной ситуации – и ни один человек не может считать себя НЕДОСТОЙНЫМ практиковать, что бы он не делал.\nЙога не требует отказа от чего-либо. Это происходит само собой. Без насилия над своей природой.\nИ я продолжала бегать, оставая честной с собой – мне это нравится, я хочу это делать и я буду это делать )))))\nА потом вопрос снялся сам собой.\nВаранаси – это самый «магический» город из всех, где мне довелось побывать. Я бы хотела пожить там несколько месяцев – практиковать йогу на Гхатах с мальчиками из Монастыря по утрам, медитировать рядом с Tree Бабой.. Кажется, что древние знания там «в эфире»…\nТак вот. Там я познакомилась с милым старичком с дредами и в очках. Он отвел меня в свое жилище – по улочкам шириной едва ли в метр, нам приходилось перешагивать через коров ( «И как они сюда попали? Откуда? Как они выберутся из этих узких лабиринтов??» - думала я). Он живет в доме из камня – кажется, что этому месту тысячи лет – там пахнет сыростью и обезьяны прыгают с крыши на крышу;\nКогда мы зашли в его скромную келью, он достал желтые от сырости дипломы и грамоты – он оказался профессором Аюрведы, много лет преподавал йогу в школах для индийских детей, ездил в Европу – он показывал мне фотографии своих европейских учеников. Я впечатлилась и попросила его провести для меня одно занятие.\nМы встретились на рассвете у Ганги, и…\n- Follow me!! – усмехнулся старичок (ему было лет 70) и устремился легкой трусцой вверх по ступеням.\nЯ офигела уже через пять минут, а он был полон сил, энтузиазма и скакал по Гхатам, как горная лань.\n- Но как же так, - удивлялась я, - в России йоги говорят, что бег – это плохо!\n- Ничего подобного!! Бег – это одна из йогических дисциплин, как и многие другие вещи. Гимнастика, например – в древности йоги использовали деревья, они подтягивались на ветках и делали другие упражнения. Йоги поднимали камни и другие тяжести! Йоги бегали – и на короткие, и на дальние расстояния. Когда – то бег был естественным способом передвижения для йогов.\nТогдая очень обрадовалась. Мое чутье в очередной раз не обмануло меня – и с тех пор я бегала с чистой совестью.\nФилософия Бега.\nДыхание. Музыка. Окружающий мир в движении – созерцание его… Бег это медитация.\nНикогда не позволяйте мозгу засорять чистый эфир чувством превосходства над кем-либо.\nНе смотрите гордо на людей, которые просто идут вам на встречу – с хмурыми лицами, с сигаретами в руках.\nНе смотрите гордо на тех, кому бег дается тяжелее, чем вам.\nНе опускайте глаза, когда видите что кто-то бежит быстрее и легче, чем вы.\nЕсли вы встретились с кем – то взглядом – улыбнитесь ему.\nКивните головой тому, кто бежит вам на встречу.\nМысленно ободряйте всех бегущих и желайте хорошего дня тем, кто просто идет на работу.\nЕсли вы наполняете свое движение и сердце любовью – вселенная даст вам достаточно сил.\nОна даст вам возможность радоваться вашей пробежке – сколько бы вы не пробежали.\nВаше доброе, счастливое лицо будет вдохновлять других людей однажды встать пораньше и.. просто попробовать сделать то, чего они не делали никогда.\nИ разве не в этом самый высший смысл – вдохновлять других людей на хорошие вещи?!?\nСчастливой вам весны, родные )\n"}, {"path": "data/lj_export_clean/posts_md/77798__transsiberian_back2black.md", "source": "LiveJournal", "date": "Unknown", "filename": "77798__transsiberian_back2black", "content": "# Transsiberian back2black\n*Date*: 18 февраля 2013, 14:06\n*URL*: https://olymarkes.livejournal.com/77798.html\n\nMarkes: Тут все спят а я опять не могу\nD: Не можешь?\nD: Ножки крутит?\nMarkes: Крутит всё\nD: Ой\nD: Плохо\nD: Ты в поезде? Щас подумаю что можно сделать.\nD: Меня помню кумарило в поезде, как собаку. Хочешь расскажу?\nMarkes: Да )\nD: Ну, слушай\nЭто произошло, когда я в очередной раз решил соскочить с хмурого.\nСтепень одержимости была такой, что я даже обыскал дознувшегося на лестнице наркома", "full_content": "# Transsiberian back2black\n*Date*: 18 февраля 2013, 14:06\n*URL*: https://olymarkes.livejournal.com/77798.html\n\nMarkes: Тут все спят а я опять не могу\nD: Не можешь?\nD: Ножки крутит?\nMarkes: Крутит всё\nD: Ой\nD: Плохо\nD: Ты в поезде? Щас подумаю что можно сделать.\nD: Меня помню кумарило в поезде, как собаку. Хочешь расскажу?\nMarkes: Да )\nD: Ну, слушай\nЭто произошло, когда я в очередной раз решил соскочить с хмурого.\nСтепень одержимости была такой, что я даже обыскал дознувшегося на лестнице наркомана, совершенно мертвого и очень окоченелого.\nМной найден был шприц с раствором, который тот не успел себе ввести до конца (ибо содержимое представляло из себя смертельную смесь, которая убила его еще по пути к радостному приходу). Я сидел на лестнице рядом с мертвым телом и обдумывал перспективу помереть тут же.\n«Разум или безумие?» - конечно, желание вмазки проникло под кожу и зудело, словно впившийся клещ. Я вмазался из шприца только что покинувшего этот мир очередного неудачника. И...  Я не умер.\nДругой вопрос, что прикорнув на плече жмура, я был обнаружен своими знакомыми, которым ад наркомании был известен исключительно по фильмам с дебильным содержанием.\nМеня вознесли в квартиру и устроили импровизированный консилиум\nПродолжать?\nЛадно, у нас видимо односторонняя связь, ибо в таежной глуши, где следует твой поезд, лампочка Ильича и первое радио появятся лет через сорок.\nD: Итак, правда о твоем муже: продолжение.\nСовещание длилось несколько часов, пока я умиротворенно парил в астрале. Резолюция гласила: сдать негодяя в клинику, запереть дома или отвезти в такое место, где появление человека вызывает бурю эмоций у основных обитателей - белок.\nСперва меня пытались приложить в больницу. Как только мои друзья оплачивали курс детоксикации, я тут же проявлял природную смекалку: через час после ухода обозначенных лиц вваливался в приемную к врачу и писал письменный отказ от лечения.\nИ чудо: деньги, которые за меня платили, я получал на руки, за вычетом тридцати процентов. Это было не плохо, так считал и мой барыга.\nПоэтому, когда после шестого или седьмого раза я высадился в дом с мааааленькими зрачками и любовью к миру,  было принято решение запереть меня в четырех стенах.\nНу что же, длинную нитку и пустую сигаретную пачку никто не отменял, а схему товар - деньги не отменяли и подавно. Тут все было просто: по утрам мои приятели, выпив свой утренний кофе с белым хлебом и слегка вспотевшим ноздреватым сыром, отправлялись по своим делам.\nЯ же оставался на весь день дома, и у меня имелись солидные денежные запасы. Несколько волнительных манипуляций, и искомое оказывалось у меня в руках. Я устроил нехитрый тайничок в ванной, и часами, присев на краешке, игрался со струйкой воды.\nЭто так весело: она бежит, ты ее пытаешься подхватить. А она убегает. И так до бесконечности. Отличная забава могла продолжаться вечно, если бы не моя жадность. Посчитав, что цвет у порошка не тот, бухнул в ложку в два раза больше.\nНашли меня привалившимся к стене с художественной слюной – ниткой. Ванна наполнилась и текла через край, назревал скандал с соседями. Если бы я уронил свое тело в чугунное нутро, я бы попросту захлебнулся, предвосхитив события, произошедшие с винти хьюстон. Но бог берег меня дурака, я упал не в ванну.\nДальнейшие разговоры были бесполезны. У одного из подающих надежды дизайнеров нашелся какой-то дальний родственник, живущий на отшибе уральского полуострова. Бля. Я еду даже не в Мурманск. Я еду до Мурманска, а дальше на машине еще несколько часов. Сбежать оттуда можно только в Норвегию, но что мне там делать? Их язык пугающе напоминает лай.\nИтак,  я в чреве зеленого вагона, постукивающего своими колесами и поскрипывающего фанерными стенками, переборками и прочей мелкой чушью. За окном маленькие городки, больше похожие на деревеньки, глядя на которые хочется удивиться и сказать в сердцах:\n- Ни хера себе, и здесь люди живут. Вот это да.\nВторые сутки пути. Меня дико кумарит.\nКонечно, заветная пятерка была взята с собой, но она кончилась еще вчера вечером: «вроде и нет прихода уже, но я еще немножко, завтра будет завтра»\nВагон полупустой, поэтому я развлекаюсь тем, что меняю места дислокации. Я даже полежал на боковушке у туалета.\nНаступил час че.\nВернее, пиздец мне наступил. У меня адский дозняк, утром мне необходима инъекция нормального весового грамма - не барыжьей куцей херни, а полноценного такого грамма в щи.\nСначала меня пробило в пот. Это предвестник того, что скоро в животе начнет крутить, и усидеть на месте станет довольно-таки сложно. Ты не можешь провести в одной позе даже пяти сраных секунд. Меняешь положение, но облегчения нет.\nЗатем наступает очередь соплей из носа -  обильные вожжи текут ручьями. Кажется, что они сейчас начнут затапливать коридор, а в это время сосед по купе подозрительно смотрит, как его попутчик из веселого паренька - рубахи превращается в разваливающийся кусок дерьма.\nЭто был я.\nЗа окном - миллион деревьев, каждое из которых напоминает о тяжелой судьбине русского народа;\nMarkes: Ыыыыыы, мне уже легче становится, понимаю что мои муки несущественны))\nD: :))\nНеожиданно я понял, что на самом деле я очень несчастен. Есть такая вещь в кумачах: когда наркотик выходит, ты становишься таким чувствительным. Я смотрел на людей и плакал от жалости. Мне было жалко себя, их, их семьи и даже машиниста поезда.За то, что возможно он хотел быть летчиком - испытателем, а занимается тем, что на маленьком отрезке гоняет туда-сюда локомотив.\nИ тут, в процессе твоего осмысления ничтожности и бесполезности жизни приходит он.\nТы должна спросить - кто он?\nMarkes: Кто?))\nD: Адский по своему масштабу ПОНОС. Настолько ужасный, что одновременно с ним приходит и безудержная рвота.\nMarkes: Очень неудобно.\nD: Ты бежишь в туалет, и как в известном фильме попадаешь в отвратительную ситуацию. Но это еще не самое страшное. Напомню тебе, что вынести жгучую боль и неудобство от нахождения в одной позе ты не можешь.\nИ тут жизнь начинает тебя испытывать на прочность по-настоящему. Твои руки и ноги становятся, словно у буратино в детском кино, то есть еще чуть-чуть, и раздастся характерный хруст, после которого ты увидишь свои колени и локти.\nПередышек нет.\nОбычно у среднестатистического наркомана ломка длится до пяти дней. В моем случае все ограничивалось двумя. Но какими!\nПрисовокупив ко всем этим страданиям бесконечное потовыделение в виде липкой и вонючей жидкости, можно себе представить всю картину.\nМимо мелькают деревья, и это еще сильнее усугубляет рвотные позывы. К вечеру я кое-как дополз к проводнику и поросил убить меня. Пожилая женщина прониклась ко мне сочувствием и продала бутылку отвратительно пахнущей водки.\nМерзкое пойло не действует, когда тебя крутит. Вообще. Я высосал ее до последней капли, но облегчения не было. Лишь еще гаже стало в желудке.\nЯ бы отдал любые деньги и даже одну почку, чтобы у меня оказалось то, без чего я не мог, но,с каждой минутой поезд работал на удаление\nD: Тебе интересно?\nMarkes: Мне очень интересно!!! Связь пропадает постоянно.\nD: Проведя бессонную ночь в мокрых поездных простынках и выблевав все свои внутренности, я решил умереть.\nЛегко сказать. Я же не могу лежать спокойно, а покойникам не свойственно вертеться, как юла. Я даже попробовал грызть железную штучку, в которую обычно кладут книги или полотенц
