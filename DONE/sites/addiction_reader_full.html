 пос\nледние 100 ру я не потрачу на пачку сигарет и поездку в метро..Пройдусь пешком..И кину их тебе...:)Просто знай,что твоя музыка,звучащая в моем плеере очень часто спасает от хандры и ударов этого злобного мира..И пока ты с нами-мы никогда о тебе не забудем и придем на помощь в трудную минуту.. Не грусти..Все будет Джа..:-)\n\"\nЮля ещё поругалась... Проще, сами прочитайте, что получилось:\nhttp://vkontakte.ru/note8262445?oid=1129570#comments\nО деньгах.\nНе, я не нищенствую. Деньги приходят и уходят, и всегда так было - бывали и трудные ситуации, и такое, что бабла было дофига. И будет, я думаю. И жертвы мне не нужны совсем, и \"подачки\". А если кто-то хочет просто разделить со мной не только радость, но и небольшой высад - почему бы и нет?\nНу а так-то знаете... я счастлива ) Сегодня приходила хозяйка, я применила все свои дипломатические таланты, и она скинула нам ровно половину квартплаты за этот месяц. А половину можно и занять, до следующего концерта, например.\nО \"НЕТ\"\nИногда хочешь сделать что-то очень плохое, решаешь сделать это во что бы то ни стало. В такие моменты я молюсь. Уже на самом пороге совершения осознанной ошибки, уже почти не имея возможности остановится - всё равно молюсь. О здравомыслии, о силе, о чуде... Даже когда понимаю - всё, вроде бы в моих руках - и в то же время нет - продолжаю молится. И наступает момент, и я говорю \"НЕТ\".  И сама удивляюсь - как это так?\nЯ знаю. Мы, люди - на самом деле лучше, чем многие наши мысли и поступки. Рождаемся чистыми, а потом - что нас пачкает? Разве кто то хочет быть плохим, злым, несчастным, одиноким? Мы такие дети... Импульсивные, наивные (хоть и строим из себя взрослых и серьёзных)... Все ошибаются, просто многие - лицемерят.\nСебя не надо \"держать\", себя надо уметь слушать. Найти хрупкую гармонию с миром, плыть по его волнам, не позволяя стереотипам и привычкам замуровать тебя в спокойную, размеренную жизнь. Как только ты решаешь, что ты себя знаешь - ты практически ставишь крест на всём новом, что рождается в тебе ежесекундно... Что бы не происходило - наблюдай...\nЯ знаю, что есть несколько людей, которые молятся за меня. В моменты, когда я уже давно не верю в себя и даже в искренность своих просьб о здравомыслии - я вспоминаю, представляю голоса этих людей... Близких и далёких... Например, голос Ники Суринович\n\".... и о тех, кто ищет к нам дорогу....\n"}, {"path": "data/lj_export_clean/posts_md/2009-10-21__5475__знаешь_где_фу.md", "source": "LiveJournal", "date": "2009-10-21", "filename": "2009-10-21__5475__знаешь_где_фу", "content": "# Знаешь, где \"Фу\" ?\n*Date*: 2009-10-21T22:53:00+00:00\n*URL*: https://olymarkes.livejournal.com/5475.html\n*Tags*: бубубу, квартира с оранжевыми стенами, факенщщет\n\n- Оль, знаешь кризисную поговорку? – Юля (\njuliez_makarova\n)  хитро улыбалась, - Не имей сто друзей, а имей сто рублей!\n- Ну-ну.\nМой статус в контакте – отличное рекламное место. Попадание в 3 тыс. человек target group – стопроцентное. Последнее время я активно этим пользовалась. Началось всё с того, что одногрупница написала: «Оль, н", "full_content": "# Знаешь, где \"Фу\" ?\n*Date*: 2009-10-21T22:53:00+00:00\n*URL*: https://olymarkes.livejournal.com/5475.html\n*Tags*: бубубу, квартира с оранжевыми стенами, факенщщет\n\n- Оль, знаешь кризисную поговорку? – Юля (\njuliez_makarova\n)  хитро улыбалась, - Не имей сто друзей, а имей сто рублей!\n- Ну-ну.\nМой статус в контакте – отличное рекламное место. Попадание в 3 тыс. человек target group – стопроцентное. Последнее время я активно этим пользовалась. Началось всё с того, что одногрупница написала: «Оль, не знаешь, кому гитара нужна?». Лот номер один ушёл через несколько часов.\n- Пакуряяям! – радостно подумала я и написала в статусе: «Здесь могла бы быть ваша реклама!»\nПотом таким же макаром был отправлен айфон, который Паша выйграл на БГВ. Ещё через несколько дней – место в машине до Магнитки…\nСкорее всего, в этот жж вы забрели, благодаря моему статусу )) А мне всегда говорили: «Ну и нафиг ты их всех добавляешь?», а я просто не могу отказать в дружбе, даже если этот отказ - электронный,  символический.\nЧто там у нас в личных сообщениях? «В Вашем ящике 9056 сообщений. На странице сообщения #1-20.»\nПоследнее время я, правда, удаляю те, на которые отвечаю – так легче ориентироваться.\n«Вы отправили 7343 сообщения. На странице показаны сообщения #1-20.»\n… и почти не отстаю. Больше я нигде не работаю ) Хожу на репетиции, занимаюсь спортом, расплываюсь мыслью по древу, ищу вдохновения, внимательно смотрю по сторонам, слушаю город.. Слушаю, как говорят люди. Как они живут, как любят. Учусь видеть сложное в простом. По-идее, когда это даёт плоды (пример: я музыкант, и мою музыку слушают не только мои родственники)  - кто-то должен сделать так, чтобы мне и моим музыкантам всегда было хотя бы 1. что есть 2. где жить.\nМне, как биг боссу, стыдно перед парнями. Я говорила – вот давайте ещё постараемся, и жизнь изменится к лучшему. И дело нашей жизни начнёт приносить хоть какой-то доход… Конечно, они меня ни в чём не обвиняют. Просто скоро найдут себе «приличные» работы, и времени на гастроли и репетиции не останется.\nБу бу бу. Навеяны мысли тем, что нам с Юлей нечем платить за квартиру. За нашу маленькую любимую квартирку с оранжевыми стенами.\n- Если бы все мои друзья вконтакте скинулись по 8 рублей, нам было бы чем заплатить… О… так и напишу!\nМы с Юлей решили устроить встречу с хозяйкой, попросить её скинуть нам квартплату. Но даже если скинет.. .Следующий концерт, в Гринго – благотворительный. А нам самим, блин, гуманитарная помощь нужна. Юля, как настоящая бедная актриса, целыми днями сидит дома, читает Станиславского и есть одни бичпакеты.\nАня Шубина, моя одногрупница – самая добрая девушка на свете, сразу перешла к конструктивным действиям:\n- Оля, давай создадим группу, организуем сбор денег..! – написала она мне в аську, прочитав статус.\n- Нуууу.. Я не знаю как… Да и вообще…\nПотом я почитала стену – народ помочь хочет.. Почему бы и нет? Нет, не так. Почему не стыдно принять помощь? Альбом «Снежная Барселона» мы записывали за настоящие большие деньги, а выложили, отдали всем-всем абсолютно бесплатно. Я даже не перевожу в бабос человеко-труд (запись, репетиции, творческие процессы). Чисто технически - на студии и на сведение ушло ровно 100 т.р. Ощутимая сумма для молодой группы? Ога. Мы даже не пытались «отбить» эти деньги, потому что тогда финансовый вопрос стоял не так остро. Сейчас другое дело.\nСоздала заметку с реквизитами Яндекс.Деньги, какая-то девочка в комментариях написала «Фу.»\nТак и подмывало ответить: ««Фу!» - у тебя в штанах. Не нравится - проходи мимо.»\nНо я промолчала. Господь терпел и нам велел ) И эти времена пройдут, и может быть буду я вальяжно ездить на лимо, жрать фуа-гра, отращу себе «авторитет» и буду со смехом вспоминать это сложное время. А может – устроюсь журналистом в «Вечерний Екатеринбург», буду носить очки в роговой оправе и писать скучные статьи про озеленение жилых массивов Вторчермета.\nФаккенщет.  Это - лучшее место на земле.\n"}, {"path": "data/lj_export_clean/posts_md/2009-06-21__1904__о_домашних_вечеринках_интернациональной_дружбе_и_плохих_девочках.md", "source": "LiveJournal", "date": "2009-06-21", "filename": "2009-06-21__1904__о_домашних_вечеринках_интернациональной_дружбе_и_плохих_девочках", "content": "# О домашних вечеринках, интернациональной дружбе и плохих девочках\n*Date*: 2009-06-21T14:55:00+00:00\n*URL*: https://olymarkes.livejournal.com/1904.html\n*Tags*: alai oli, Юля, дома, кутёж\n\n\"У меня проблемы\" - подумала я утром в воскресенье, полностью разобрав рюкзак. Банки и след простыл...  ( нууу такая  банка жестяная, типа кокаколы, только она с крышкой секретной. Я там бабло и важные бумажки хранила)\n- Консервы, бл*ть... А ведь там мой билет аэрофлотовский лежал! Как я теперь его сдавать пой", "full_content": "# О домашних вечеринках, интернациональной дружбе и плохих девочках\n*Date*: 2009-06-21T14:55:00+00:00\n*URL*: https://olymarkes.livejournal.com/1904.html\n*Tags*: alai oli, Юля, дома, кутёж\n\n\"У меня проблемы\" - подумала я утром в воскресенье, полностью разобрав рюкзак. Банки и след простыл...  ( нууу такая  банка жестяная, типа кокаколы, только она с крышкой секретной. Я там бабло и важные бумажки хранила)\n- Консервы, бл*ть... А ведь там мой билет аэрофлотовский лежал! Как я теперь его сдавать пойду?! Скажу \"здрасьте, я хочу сдать билет, только я его потеряла...\" ыыыы...\nВ районе обеда нас с Юлей можно было засечь в Нуне, где мы согревали души глинтвейном в ожидании moovie. И как обычно - ничто не предвещало беды..\n- ооооооооооооооо...... - Юля оторвала взгляд от экрана тиви, по которому бежал толстопузый Марио, и уставилась куда-то за мою спину.\n- Что там?\n- Мальчиииик такооой симпатииичный....\n- Где?\n- Да вот, пришёл, встал, поулыбался мне и ушел.\n- Куда?!  - любопытство немедленно смыло меня с диванчика и вынесло в соседний зал, где перед моими глазами предстала следующая картина:\nвозраст: от 20 до 22,\nрост: 180\nвес: около 60\nглаза: голубые, лучезарные\nволосы: светлые (тонкие, волнистые дреды)\nбонусы: милая, скромная улыбка в мою сторону\nминусы: две чики за столиком, рядом с которым стоит сей объект. Одна из них явно запрограмированна на бой за свою добыыычу.\nПодхожу ближе, улыбаюсь в ответ\n- Хаааай! (вернее не так!, а так: HI!)\n\"Ёмаё... буржуй... эххх, вот так всегда\" - подумала я, не сумев скрыть разочарованное выражение лица. \"Ну может хоть Юля приколеца...\"\n- Wanna sit with us?\n- Yes, of course!\nПарень тотчас же был уведен в соседний зал за наш столик. Как только выяснилось, что Юля тоже предпочитает отечественный продукт, мы решили все втроем вернуться к оставленным чикам, чтобы были мирДРУЖБАжвачка, а то у меня уже начинали гореть уши.\nОдна из чик была немкой, по совместительству - гёлфрендой этого парня. Вторая - русская девочка Ирина, приютившая иностранцев в своей квартире (есть какой-то сайт, там регистрируешься, и твой дом становиться интернациональной впиской, как матьиво Артек). Немцы путешествуют по миру, и почти каждый день тусят в новом городе.\n- Oh, and this is Anya. She is a best snowboard rider in our city!  - Аня Отраднова обаятельно улыбнулась нашему буржуйскому ангелочку:\n- Hi! Ой какой симпатичный мальчииик...\n- Ага, г*вна не держим!  - мы с Юлей смеялись, а тем временем немецкая оккупантка становилась всё мрачнее и мрачнее. К её счастью, мы поспешили в кино, оставив пионервожатой Ирине наш телефон.\n****\nВечером мы готовились к Grand Home Party \"ШтаныСмотнёй\". (Всем членам моей банды и Юле я привезла разноцветные шаровары, которые все обязаны были напялить хотя бы на время пьянки) Прибирались, строили китайскую стену из алкогольных напитков\n- Не, мы что правда всё это выпьем?\nКакая я наивная! За ночь магазин Б 52 на Сурикова-Фрунзе подвергался набегам банды в ШТАНАХСМОТНЁЙ ещё 4 раза!  Но это было потом...  А сначала...\n- Алё?\n- Hi! It's me, Felix! We wanna come to you!\n- Ok, ill send you our adress by sms\n- Это кто? Немцы чтоли придут? - Аня и Юля хитро улыбались\n- Дааа... чую будет жарко. Напьёмся и будем кричать : \"А я щас тебя тут как мой дед твоего деда под сталинградом !! \", выгоним немецкую женщину а арийца растерзаем на части, ухаха!\nПотом приехала доставка из Планеты Суши.\nПотом немцы.\nПотом приехала банда Alai Oli полным составом. Все дружно офигели от того, что я настоящая стою тут с ними, а совсем не в Гоа со Здомским. ОТ такого стресса срочно нужно было избавлятся, что мы и делали проверенным веками в России методом, заливая алкоголь за воротники.\nПотом женская часть интернациональной делегации + Ирина и ещё какая-то их подруга свалили, но пришел ещё кто то из наших, стало тесно и весело и начались танцы.\n\"Конечно, блин! как обычно!\" - думала я, дёргая ручку запертого  WC\n- Нука выметатесь кто бы там ни был! - грозно крикнула я за закрытую дверь, и тут дверь открылась. За ней я увидела незнакомца.\n- Ээээ... Ты кто?\n- Антон\n- Мы типа не знакомы? Я не очень люблю встречать у себя в квартире незнакомых людей.\n- Мне уйти?\n- Я подумаю над этим прямо сейчас, - сказала я, закрывая за собой дверь клозета.\nПарень Антон оказался другом подруги пионервожатой наших немцев. \"Длинновата цепочка\" - думала я, жестами показывая Антону и его подруге, где в нашей маленькой квартире выход.\n- Простите, ребята, но я вас не звала и не знаю.\n- Она звала! - девушка указала мне на Юлю. Юля подняла на меня глаза ангела и сказала:\n- Да... ну она сказала я с другом.... ну я и думаю... ну пусть...\n- Короче понятно. Она добрая, а живём мы тут вместе, так что простите.\nНезванные гости проследовали в прихожую, а мы продолжили веселится. Юля погрустнела и пошла их провожать. А мне стыдно не было. В конце концов - это мой дом, моя вечеринка, я хочу чтобы всё было по моему хотению. Придя в чужой дом я готова играть по правилам его хозяина. В своём я устанавливаю правила сама.\n- Она мне сказала, что стоя срать неудобно\n- ???? -  не уловив мысль, я повернулась к Юле\n- Я ей сказала: \"прости, мне так неудобно что так вышло\" а она мне в ответ: \"стоя срать неудобно!\"\n- РРР! Правильно значит мы их выгнали! Обижают тебя, ангела!!!  Тебя, мать терезу которая им отказать не смогла!!! Хорошо, что я не услышала что она так сказала, а то щас она провериляла бы на практике удобно срать стоя или не удобно!  - я разозлилась, а Юля наконец улыбнулась:\n- Да, всё правильно. Нафиг тут левые люди нужны...\nНемец смотрел на этот спектакль с интересом, а потом спросил:\n- You kicked thouse two guys away?\n- Yes. Julia like a promo group of club - she have to make people to come the party, and i like a face control - don't let them come in... ha\n- ITS GREAT! IT'S SO FUCKING COOL!\nИ он поднял свою ладошку, типа \"дай пять!\"\nБыло весело так, что никто даже и не думал уходить часов до 7 утра. Первыми свалили немцы, у которых в 6.30 был поезд в Новосибирск.  К 6ти у Феликса и Ани Отрадновой случился кухонный роман из серии:\n- Maxi is a bad girl. I dont like her. I like you.\nНа этом моменте Аня, и так не говорящая на английском, потеряла дар речи в конец. Хотя зачем тут этот дар? Мы, дети перестройки, выращенные на мексиканских сериалах, знаем назубок: вот тут-то Хуан и Мария должны слиться в страстном и нежном поцелуе!  Границы рухнули. Третий рейх пал.  И тут то в кухню зашла MAXI, которая хоть и бэд гёл, но всё таки не дура.\nКороче, воскресная вечеринка удалась. Около 11 часов в понедельник я проснулась, выпила коктейль здоровье: \"терафлю+нурофен\" и пошла на тренировку. И там то меня озарило: \"Блин, а ведь мне на новый год не подарили ни одного подарка!\"  Хотя.. Даже судя по событиям последних дней\nя - очень, очень, плохая девочка. Деды Морозы таким только на орехи выдают. А тема ореха в моей жизни исчерпана. Я это решила твёрдо 1 января.\n"}, {"path": "data/lj_export_clean/posts_md/2009-06-21__12586__дерзкие_дни.md", "source": "LiveJournal", "date": "2009-06-21", "filename": "2009-06-21__12586__дерзкие_дни", "content": "# Дерзкие дни\n*Date*: 2009-06-21T16:36:00+00:00\n*URL*: https://olymarkes.livejournal.com/12586.html\n*Tags*: Екатеринбург, лето, счастье, трудовые будни alai oli\n\nНу что. Села я, значит, на свою новую тачку и поехала в деревню. Ну типа к прекрасному русскому духу приобщится, побыть вне зоны действия сети и прочие деревенские прелести.\nНовая тачка - это просто жесть. Шевроле Ланос после восьмёрочки-восьмёры это просто какой-то пафос на колёсах. Гидроусилитель руля - величайшее изобретение человече", "full_content": "# Дерзкие дни\n*Date*: 2009-06-21T16:36:00+00:00\n*URL*: https://olymarkes.livejournal.com/12586.html\n*Tags*: Екатеринбург, лето, счастье, трудовые будни alai oli\n\nНу что. Села я, значит, на свою новую тачку и поехала в деревню. Ну типа к прекрасному русскому духу приобщится, побыть вне зоны действия сети и прочие деревенские прелести.\nНовая тачка - это просто жесть. Шевроле Ланос после восьмёрочки-восьмёры это просто какой-то пафос на колёсах. Гидроусилитель руля - величайшее изобретение человечества, я вам отвечаю.\nВ деревне было хорошо. Я гуляла по полям, речным берегам и деревенским улочкам. Смотрела, как солнце медленно садится за макушки деревьев.\n- Эх.. - думала я, - Останусь-ка я тут ещё на денёк! И насрать, что телефон недоступен. Перекурят все, кому я нужна. Замучило меня это коммуникативное море.\nА потом я передумала. Ну что-то дёрнуло меня... А, вспомнила. Я думала - бабушка волноваться будет, что я в аварию попала на новом тазике своём. И поехала я обратно.\nДома телефон включаю - миллион и один пропущеный, от менеждера, Бро и ещё кого-то. Бабушка обо мне даже не вспомнила, блин!\nЕщё смски. От менеджера:\nСобирайся, завтра выезжаешь в Москву. У тебя эфир на Радио \"Россия\" в воскресенье. А и ещё. Вы будете выступать на ********* у **** ***, только пока никому не говори это конфиденциально!\nОт девушки менеджера, Кати:\nПоздравляю!! ЕЕЕЕ!\nНу я сразу обрадовалась, потому что это жесть как круто - выступать на ********* у **** ***. Я всегда мечтала об этом. Я только об этом и мечтала!\n- Ну нифига себе! - думала я в тот момент, когда неожиданно мне стало очень очень неудобно сидеть. - Бл*!!! Куда мне надо ехать?!?!\nЗнаете, какой гемор мутить поездку в Москву на один день?! Надо аргументировать менеджменту, что мне неприменно нужно лететь на самолете, а не трястись в плацкарте, потом нужно найти дешёвые билеты, купить их - оплатить электронной карточкой, которой у меня, естественно, нет. Вот этим я занималась вчера пол дня.\nА теперь, мастер-класс для профессиональных бездельников.\nБездельничать нужно уметь. Слышишь, Бро?! Жрать мороженное на своей же крыше, обложившись чертежами своего диплома - это унылое говно! Делать нужно так. Садишься на велик, и дерзко показывая язык всем неудачникам, стоящим в пробке у Екатерининского (там дорогу перекопали) сипуешь на Уктус. С собой надо обязательно взять 1) Друга 2) коврик для йоги 3)еду для пикника 4) кроссовки для бега (ненужное вычеркнуть).\nНа Уктусе летом просто обалденно. Я готова торчать там целый день - заниматься йогой на вершине горы, бегать по асфальтовым и грунтовым дорожкам, прыгать на дёртах на своём bmx, спать под каким-нибудь деревом, лёжа головой на рюкзаке, смотреть на солнце, которое едва прячется за широкими листьями деревьев, смотреть на упругие и стройные сосны, которые тянутся в небо. Слушать птиц и шум ветра, смотреть на любимый город с высоты птичьего полёта и чувствовать, как бьётся сердце этой земли, которая даёт мне силы. Здесь моё место. Здесь мои корни...\nВот так я провожу солнечную часть дня.\nВчера вечером в теле-клубе выступал Ассаи, и наш менеджер приехал с ним в качестве концертного директора.\n- Эй, педики! Ну вы где?! Почему ещё не в клубе?! - голос менеджера ругал меня из моей же телефонной трубки\n- Ну скоро приедем! Я уже у Шапо, они меня ждут. А я тут важным делом занимаюсь!\nДима и Бро сидели на диване и смотрели, как я сосредоточенно отвечаю на вопросы журналистов, из Кушнир-продакшн меня озадачили.\n- Ну всё, я готова!!\nИ мы поехали в телеклуб. Я прокатила парней на своей машине:\n- Да, ты стала водить аккуратнее... - удивляется Бро\n- Я боюсь её ушатать просто! Так тут всё странно после восмёрки.\nВ Телеклубе было весело. Куча знакомых, друзей - Айфо полным составом, Ваня из Огрызков ну и менеджер наш, конечно. Главная лапочка всех времён и народов. Мы отлично провели время, на обратной дороге заехали в квартиру...\nА сегодня я опять торчала пол дня на Уктусе. Загорела, позанималась йогой - уже третий день, видимо, очень стараюсь, раз так ноги болят. Завтра в Москве хочу пойти на домашнее занятие к Михею, Юго-Западная Намаскар и вся фигня ) Если у меня не будут ноги разгибаться, не ругай меня, учитель!!\nНу и эфир на радио - слушайте, если занятся будет нечем: с 16:30 до 17:00 РАДИО РОССИИ, 66.44 FM мгц УКВ 750 Am\nСамолёт уже скоро. А погода, говорят, в Москве козлянская.\n"}, {"path": "data/lj_export_clean/posts_md/2009-03-21__14962__а_у_нас_в_квартире_глаз_а_у_вас.md", "source": "LiveJournal", "date": "2009-03-21", "filename": "2009-03-21__14962__а_у_нас_в_квартире_глаз_а_у_вас", "content": "# А у нас в квартире глаз. А у вас?!\n*Date*: 2009-03-21T13:17:00+00:00\n*URL*: https://olymarkes.livejournal.com/14962.html\n*Tags*: Питер, трудовые будни alai oli\n\nЯ еще никогда не чувствовала себя настолько свободной... Даже в детстве в летние каникулы невозможно было забыть, что первого сентября начнется школа, а вместе с ней - неминуемые высады.\nВсе, нафиг, сдавать мне больше ничего не нужно. У меня есть диплом, права и даже загранпаспорт ))) Еще у меня есть друзья, которые сейчас спят в сосед", "full_content": "# А у нас в квартире глаз. А у вас?!\n*Date*: 2009-03-21T13:17:00+00:00\n*URL*: https://olymarkes.livejournal.com/14962.html\n*Tags*: Питер, трудовые будни alai oli\n\nЯ еще никогда не чувствовала себя настолько свободной... Даже в детстве в летние каникулы невозможно было забыть, что первого сентября начнется школа, а вместе с ней - неминуемые высады.\nВсе, нафиг, сдавать мне больше ничего не нужно. У меня есть диплом, права и даже загранпаспорт ))) Еще у меня есть друзья, которые сейчас спят в соседних комнатах - самые лучшие на свете друзья.\nЕще у меня есть самый веселый а менеджер\ndertev\nтолько что я позвонила ему по скайпу, чтобы посмотреть на его утренние щщи - ничто так не поднимает настроение )\nТолько что подумала: какие все лентяи!  уже пол двенадцатого, а они еще спят. А там, за песчаной косой, по заливу плавают яхты. И откуда-то с того берега плывут облака. На неделе мы ходили на пляж загорать и купаться. Когда жара спадала, мы ехали в центр, гуляли по этому непостижимо красивому городу.\nЛюди здесь очень красивые, модники такие - с журналом Афиша, торчащим из сумки ))  Я себе в ближайшем киоске купила новый номер + карту Питера, и теперь втыкаю в эту карту больше, чем в телефон. Особенно когда мы есздим на машине. Да, еще здесь все люди здесь еще и приветливые - после Москвы и Екатеринбурга для меня это качество в диковинку.\nПозавчера мы ехали домой и заблудились, в итоге мосты развели - прямо как в песне - и мы остались на час спать в тачке на набережной... Очень романтично, по-моему ))\nА еще мы напряженно репетируем - каждый день по 3 часа. В эти выходные - концерт в Питере, в следующие два концерта в Москве. Потом снова Питер, фестиваль \"Стереолето\" - его я жду с трепетом, потому что очень люблю большие площадки (у меня гигантомания?!?!).\nКстати, можете за нас проголосовать на\nhttp://www.bestfest.ru/page.php?id=52\nможет нам дадут месячный запас консервированных бобов! ))  Потом у нас в планах запись новых песен - скорее бы, я бы сама их слушала )))\nА еще у нас есть канал 2х2.\nИ быстрый интернет.\nИ несколько кг гречки, риса и макарон.\nА еще менеджер купил нам 10 пачек сухарей с изюмом.\nА по утрам я бегаю по берегу финского залива.\nДенег, как обычно, нет - но это тоже своего рода свобода.\nА вы-то как сами?!\nутренние фото на камеру нашего imac\n"}, {"path": "data/lj_export_clean/posts_md/2009-03-21__9489__обо_всём_на_свете.md", "source": "LiveJournal", "date": "2009-03-21", "filename": "2009-03-21__9489__обо_всём_на_свете", "content": "# Обо всём на свете!\n*Date*: 2009-03-21T02:55:00+00:00\n*URL*: https://olymarkes.livejournal.com/9489.html\n\nТри месяца абсолютно трезвого сознания.  Никак не могу перестать считать, для меня каждый такой день праздник. Помню, три месяца назад мне Игорь (Парень из Африки), писал по аське: \"Я молился, чтобы ты ничего не употребляла..\" Тогда я подумала что он - настоящий друг.\n***\nСтолько всего происходит - каждый день наполнен событиями и передвижениями. Последнюю неделю мне срывало крышу по моему ", "full_content": "# Обо всём на свете!\n*Date*: 2009-03-21T02:55:00+00:00\n*URL*: https://olymarkes.livejournal.com/9489.html\n\nТри месяца абсолютно трезвого сознания.  Никак не могу перестать считать, для меня каждый такой день праздник. Помню, три месяца назад мне Игорь (Парень из Африки), писал по аське: \"Я молился, чтобы ты ничего не употребляла..\" Тогда я подумала что он - настоящий друг.\n***\nСтолько всего происходит - каждый день наполнен событиями и передвижениями. Последнюю неделю мне срывало крышу по моему велосипеду, и даже при наличии автомобиля под окном я не могла заставить себя выйти на улицу без байка. В хорошую погоду сидеть в машине и жать на педали мне кажется каким-то маразмом, гораздо круче гонять на 20inches bmx по сухому асфальту - летать, перепрыгивая всякие препятствия, запрыгивать на бортики, прыгать дропы... На машине каждый дурак может, а вот баннихоп прыгать - 'это вам не сцепление плавно отпускать.\nОднако, всё не так просто. Пару дней назад на велике попала под ливень. У Ашана... Пока доехала до дома, у меня ни осталось ни одного сухого пятнышка на одежде, плюс ещё грязевая ванна из-под заднего колеса... С таким удовольствием дома переоделась в сухую и тёплую кишку и поехала на машине в Коляда-театр. В тот вечер там читали пьесу \"Фронтовичка\". В очередной раз чувствую себя так, будто мне повезло прикоснуться к чуду.\nГоняла в Тагил поддержать друга, он открыл там группу NA, что это - можете прочитать\nздесь\n, например\nЧерез несколько дней уезжаем в Питер на неделю. Будет несколько концертов, съёмки видео, фотосессии - мы берём с собой нашего официального фотографа Сергея Никифорова, организаторы даже спонсируют его трансфер, так что Жёлтый теперь совсем как член группы.. Будет снимать не только нас, но и Крека с Чеком и крутого Dj Tonetrack, с ними мы последний раз тусили на квартире нашего (Боже, храни..) Менеджера в Москве.\nВ Питер я собралась ехать автостопом. Благо, погода позволяет. Но наш непостижимо прекрасный Артём сказал: \"Никаких автостопов! Если с тобой что-нибудь случится, мы влетим на бабки!\". Вот такое скоцтво, представляете?! НЕ \"как я буду жить без тебя, родная?!\" и даже не \"Я волнуюсь, что ты не напишешь ещё столько прекрасных песен...!\". Хрен, блин!!! А я каждые пол часа его фотографию тряпочкой протираю, чтобы не запылилась..! О, эта агония неразделённой любви!\nВ Питере мы снова будем жить в той оргоменной хате, где джакузи, водяной матрас и много комнат. Ещё из Москвы на наш концерт собираются несколько тусовок. В числе прочих - Михей\nracoonscrew\n, наш со Здоми учитель йоги из freeflow yoga центра в Индии.\n16 мая придётся вернутся, буду в жюри на\nTeleRock Шоу\n***\nПришла ко мне новая песня -  \"Дельфины\", очень она мне нравится.. Если с Димой постараемся, то сыграем её в акустике в Питере. Не могу не поделится парой строчек из неё.\n\" Помоги мне забыть о дельфинах,\nЛуна отражается в их мокрых спинах.\nНаписала моё имя на стекле. Напротив окна\nЯ каждую ночь просыпаюсь одна.\nВ моём городе нет моря,\nНо куда бы я не шла - моё море со мной.\nпросыпаюсь под нежные звуки прибоя...\n...ах, какая у них нежная кожа,\n...какие там на дне звёзды и крабы\nПобудь ещё немного моим другом,\nПобудь ещё хотя бы в мыслях моих рядом\nЯ не умею дышать под водой.\nСкажи, как мне унять боль?\nСкажу Borron Y Cuento Nuevo\nКогда море придёт за мной.\"\n"}, {"path": "data/lj_export_clean/posts_md/2009-02-21__4566__по_остывающим_следам_бгв-2.md", "source": "LiveJournal", "date": "2009-02-21", "filename": "2009-02-21__4566__по_остывающим_следам_бгв-2", "content": "# По остывающим следам БГВ-2\n*Date*: 2009-02-21T17:45:00+00:00\n*URL*: https://olymarkes.livejournal.com/4566.html\n*Tags*: БГВ\n\nБГВ 09 Первый день. Предлагаю озеру Банное более подходящее название - озеро «Синяя Яма».\nКто бы сомневался, что мы опять накосячим? Началось всё с того, что мы опоздали на регистрацию Этапа Кубка Европы, который проходил в первый день. Паша бегал по всему комплексу в поисках главного судьи, а я – гуляла в поисках чего-нибудь интересного.\nСамым большим ударом для меня ст", "full_content": "# По остывающим следам БГВ-2\n*Date*: 2009-02-21T17:45:00+00:00\n*URL*: https://olymarkes.livejournal.com/4566.html\n*Tags*: БГВ\n\nБГВ 09 Первый день. Предлагаю озеру Банное более подходящее название - озеро «Синяя Яма».\nКто бы сомневался, что мы опять накосячим? Началось всё с того, что мы опоздали на регистрацию Этапа Кубка Европы, который проходил в первый день. Паша бегал по всему комплексу в поисках главного судьи, а я – гуляла в поисках чего-нибудь интересного.\nСамым большим ударом для меня стала стоимость глинтвейна – 150р за пластиковый стаканчик. Обдираловка!!\nЕстественно, я сразу же встретила кучу знакомых из разных городов, и прежде всего – из Екб. Дредастая красотка Вика позвала меня к ним в Уральские Зори на пироги с чаем. Выяснилось так же, что у них есть свободная койка.\n- ООО! Можно мы у вас на ней спать будем? Вчетвером!\n- Конечно!\nГоворят, что брать доску на БГВ – дурной тон. Однако, мы с Викой всё таки решили немного покататься. Сначала она бесплатно провела меня на подъёмник – в Банном такие клеевые закрытые кабинки, со стеклянными стенами. Они поднимают на самую вершину горы, пейзажи там – просто невероятные, и обычные высады – холод и ветер – не мешают наслаждаться.\nN\n.\nb\n. особенно рекомендуется любителям секса в экстримальных местах.\nЗатем мы пошли прыгать на небольших трамплинчиках, находящихся в левой стороне от всего действа. В это время в большом парке взлетали в небо красавцы – буржуи, закручивая семёрки, девятки и тысячи, а на сцене играли пока ещё не очень «звёздные» группы.\nИ всё было бы ништяк, только\nвот по бэйджу «Пресса» в райдер-зону меня не пустили. Если на БГВ у тебя нету чёрной карточки «\nBGV\nTeam\n» – ты постоянно будешь чувствовать себя человеком второго сорта ) Поэтому первый вечер мы тусовались в шатре МТС, где нон-стопом крутили кино «Тариф «Новогодний»» - даже не образец\nproduct\nplacement\nфильма, а тупо полуторачасовой рекламный ролик. Ещё там были мягкие кресла-мешки, Сони Плэй Стэйшн и медленный Интернет на трёх ноутбуках.\nНу и понеслось, конечно. Какие-то новые люди, все что-то пьют и постоянно предлагают всем вокруг – знакомым, не знакомым. На втором этаже проката, там где бар – не протолкнуться. Практически у каждого человека из кармана торчит початая бутылка чего-нибудь 40%, все в классных цветастых\nсноубордических кишках, смеются, танцуют. Откуда-то из колонок транслируется живая музыка со сцены у парка, где идёт панк концерт. Фасахич (традиционный эмси БГВ и наш хороший товарищ) жжет прямо в микрофон:\n- ООоо да раздразни мой анус! Кончи мне на лицо!!\nНе помню, как я оказалась одна – зашла в одну из маленьких кафе внизу и плюхнулась за столик к незнакомым девочкам. Не помню, о чём мы разговаривали, они задавали какие-то вопросы, спрашивали откуда я, а потом… Потом сказали что мне не мешало бы пафоса поубавить.\n- Тааак… - думала я… - а мне то кажется, что я источаю радушие и дружелюбие! Пожалуй, надо поработать над собой.\nВ этот момент в кафе появился Паша. Он вообще с малознакомыми людьми всегда общается очень странно. Чтобы не нажить себе врагов, мы собрали ноги в руки и пошли тусить дальше.\nНа втором этаже проката столкнулась с какой-то знакомой девочкой:\n- Ооо…! Привет! Ты тут самая красивая… - у меня было хорошее настроение и хотелось делать комплименты\n- Привет..\n- А откуда я тебя знаю?! …. Хммм… АААА! Точно! Ты же с моим Бро это… четыре раза!\nЧерез секунду Паша уже тащил меня в глубь тусующейся массы:\n- Щщет! Я это что, вслух сказала?\nПо пути в «Зори» я трогала встречающихся людей за лица,\nчтобы убедится что они – не зомби. Путь наш лежал через заброшенные домики с зияющими дырами в разбитых стёклах. Жутковатая картина, при этом я была совсем не уверена, что мы идём в правильном направлении.\nПотом я обнаружила нас, танцующими на какой-то дискотеке. Мы скакали по всему танцполу, я абсолютно забыла о том, что у меня на ногах не кеды, а бордерские ботинки.\n- Оооо! Это же Вика!\n- увидела я нашу дредастую красавицу рядом с собой на танцполе.\nПотом кто-то вспомнил, что Паше завтра ещё прыгать, и мы пошли в номера.\nВторой день БГВ.\nЯ открыла глаза. На соседней кровати никого не было.\n- Наверное, Вика сняла симпатичного мужика на вчерашней тусовке, и осталась у него.. – думала я, принимая горизонтальное положение. – Да, кстати, а где Костя?\nНаш водитель пропал ещё вчера. Последний раз я видела его в районе сцены в компании каких-то весельчаков и двух бутылок коньяка. По идее, он должен был вписываться в «Зори» вместе с нами, но что-то пошло не так…\nАаа.. Вот что! Официальный оператор на этом празднике жизни – МТС. А у нас с Пахой – Мегафон. И наша связь сказала «пакурям!» где то в середине вечера. Так что бедный Костя элементарно не мог до нас дозвониться.\n- Алё.. А я в сугробе сплю..! Что ж вы меня бросили то?\n- Нууу Костя, у нас связь пропала! Ты в каком сугробе? Давай мы тебе твоё пиво принесём? Оно со вчерашнего дня в рюкзаке болтается!\n- Я не скажу вам, где я!\n«Печальная история» - думала я, потому что все наши доски отдыхали в его\nмашине.\nВика обнаружилась в соседней комнате, и мы вместе пошли на завтрак.\n- А кашу эту вам Уфа подарила! – работница столовой протягивала нам с Пашей тарелки с овсянкой.\n- Всмысле, подарила?!\n- Двадцать человек питание оплатили, и никто не пришёл!\nВот отлично придумали- на БэГэВэ делать завтрак в 9 утра. Люди выглядели больными и помятыми, однако, глядя на нас, они или улыбались, или хихикали. В любом случае, от отсутствия внимания мы не страдали.\n- Что, мы вчера хорошо повеселились?\n-\nО да, особенно на дискотеке в «Экстриме».\n- …. Таааак… дискотека… Ага! Точно!\nКогда мы пришли на гору, уже близилось время первой тренировки перед основными соревнованиями. Все доски, как вы помните, были в машине.\n- Аааа!! Что мне делаааать?!\n-\nmr\n. Дунаев нервничал, и я отправила его в «Тироль», туда, где предположительно отдыхал Костя. Поиски увенчались успехом, но на раскатку наш райдер всё таки не успел.\nНа обеде я увидела какую-то знакомую чику:\n- ООо… Это же «Четыре Раза» - Паха ржал надо мной, а я покраснела и решила не здороваться с ней.\n- Дааа… пятый раз Бро точно не светит.\nПотом уже на горе я встретила грустного Фасахича:\n- А меня вчера уволили… Ты слышала, как я кричал «Раздразни мой анус?» Я ведь не знал что с панк-концерта мои раздувы на всё БГВ транслируют!\n- Ничего они не понимают в настоящем веселье! Ну ничего, мы построим свой лунапарк с блэкджеком и шлюхами!\n***\nВторую тренировку я смотрела уже из Райдер-зоны. Хорошие связи + природная наглость открыли мне двери в эпицентр соревнований – в палатку, где тусовались сноубордические звёзды русского и буржуйского происхождения. В палатке царил кипиш, судьи читали правила, распределение по группам, райдеры слушали, но не очень внимательно..\n- О, ты помнишь Оля мы вчера сидели с ними?\n- показывал мне Паха то ли на Теймурова, то ли на Лапушкина – Ты ещё опять всякую фигню гнала..\n- ?!?!?! Что ты мне ещё не рассказал!?\nУже потом я познакомилась практически со всеми – и с русскими, и с буржуями. Вообще в райдер-зоне я провела практически весь день. Там была еда, горячий чай и тепловая пушка, у которой все грелись, сбившись в тесную стайку. Мне кажется, именно эта пушка так всех сблизила. Вообще атмосфера среди\nвсех участников сорев – весёлая и нифига не чувствуется конкуренция.\nНачалась тренировка. Я взяла в руки камеру и пошла снимать Пашу. По пути мне встретился наш официальный фотограф Сергей Никифоров, и я увлеклась за ним в стафф-зону пить чай. Так что первую попытку нашего друга я пропустила. Как выяснилось позже – к счастью для моих нервов.\nСледующие несколько раз Паша приземлял трюк не очень чисто, а на третий раз вообще воткнулся доской в приземление. Я подумала, что доска сломалась. На этот случай у него был запасной борд, но… запасной головы-то нет!\n- Хорошо, что ты не видела, как я убрался в первый раз… Я даже мультики посмотрел.\nНа завершающей попытке Паха передумал в воздухе делать второй флип, и с огромной высоты убрался прямо на спину. Выглядело это страшно…\n- Тренировка на сегодня окончена. – он двигался и разговаривал очень медленно, пошатываясь,\nа по глазам сразу было видно – ему п*здец как больно.\n- Ты чего, с ума сошёл в воздухе передумывать?!\n- Ну вот… будет мне урок…\nВсе вокруг ходили и спрашивали: «Ты живой?». Буржуи\nподходили\n:\n«May I have a photo with the King of Backflips?»\nКороче, сначала Кинг оф бэкфлипс совершенно справедливо решил, что прыгать ему сегодня не стоит…\n- Какой прыгать нафиг! Ты разговариваешь-то с трудом!\nКуда ты пошёл? – шатающейся походкой наш главный герой направлялся к своим доскам, зажав в руке кусок парафина\n- ….\n- Твой друг – псих.. – сказал кто то из райдеров, а я даже не стала спорить.\n-\nК началу соревнований Пашин взгляд прояснился. А в палатке поставили телевизор, по которому в прямом эфире показывали все попытки. Все райдеры очень болели друг за друга – даже приятно смотреть, какие все дружные ))\n- Только на камеру я тебя снимать не буду, я буду за тебя молится. Совместить это у меня как-то не выходит…\nЯ парилась очень сильно, потому что знала: если он ушатаеца ещё раз, для его здоровья это окончится очень плохо.\n- Да не переживай ты так! – успокаивал меня Малабар, крутой ньюскульщик, тоже из Екб – Я, бл*, оракул! Говорю же тебе – он его приземлит!\nТак и вышло. Обе попытки Паха приземлил и уехал, я радовалась и прыгала, благодарила небеса за услышанные молитвы. Я опять пообещала кучу всего, и теперь с радостью буду выполнять свои обещания Высшей Силе. Кроме живого и довольного друга я обрела ещё кое-что: моя вера стала ещё крепче.\nВ турнирной таблице Паша оказался на 13ом месте, из Русских – пятым. Вообще, для него это – очень круто, даже если вспомнить что его «основное» занятие – это, всё таки, маунтинборд.\n-\nSee you on the Afterparty!!\nМы попрощались со всеми и отправились вниз. Все знакомые, которые встречались нам на пути, поздравляли Паху, обнимали его, пытались с ним выпить\n- Я не пью, - улыбался он.- А вот Оля…\nСкинув катальные шмотки, мы заглянули на афтапати в здании проката, где пока ещё было не особенно весело.\n- Что, поехали на пафосную вечеринку?\nНам поставили печати, и мы пошли на подъёмник, чтобы тот увёз нас на\nVIP\n-афтапати на вершине горы. Фэйс контроль стоял внизу, там, где садятся в кабинки.\n- О, это точно финалист!\nВ ресторане «Горное Ущелье» столы ломились от разнообразной халявной еды. Мы, оголодавшие (в райдер-зоне из вегетерианской хавки был только хлеб) сразу же набросились на неё. Ещё там была куча халявного пива Миллер. Но пива я не пью. Потом подтянулись буржуи. Короче, скучно не было.\nПравда, я опять нажестила – облила какого-то важного дядьку его же пивом, но дружественная атмосфера помогла сгладить острые углы.\nМы немного потанцевали,\n- А что, поехали на тусовку для нормальных людей?\nИ мы снова отправились вниз. Короче, в результате мы веселились пол ночи, шляясь по разным местам. В подробности вдаваться не буду – просто поверьте мне: БГВ – одна из самых весёлых тус, на которых я была.\n***\nУтром третьего дня\nмы выползли из комнаты на завтрак:\n- О, это он! -\nодна тётка (работница «Зорь») показывала пальцем на Пашу, обращаясь к другой тётке\n- А где твоя дама? Ох как они вчера танцевали! О, а вот и она! – тётки увидели меня\n- Уууу… А они это про вчера или про позавчера?\nВ Викиной кровати помимо её самой оказался какой-то магнитогорский красавчик.\n- А он ничего!\n- Ага… У него только девушка на втором этаже в этом же корпусе…\nКутёж удался )))\nС Пашей все фотографировались, хвалили его. Я чувствовала себя подружкой «звезды». Я тоже пару раз слышала в свою сторону:\n- Оля! Отличный альбом!\n-\nAlai Oli!\nРеспект!\nБыло приятно, но за Пашу – приятнее ). Потом он дал интервью для\nRussia\nToday\n, мы погрузились в тачку и поехали домой.\nВот так прошло БГВ.\nP.S.\nпереписка с Бро\nShapka (16:52:42 2/02/2009)\nPoppihead (16:41:23 2/02/2009)\nя там бла ко мне оля подходит ии говорит :Ты с моим бро 4 раза!\nЧё эт значит!?\"?!?!\nShapka (16:53:05 2/02/2009)\nPoppihead (16:39:22 2/02/2009)\nты свиньяя\nMarkes (16:54:10 2/02/2009)\nя напилась прости брат!\nShapka (16:54:33 2/02/2009)\nона обиделась на меня\nShapka (16:55:45 2/02/2009)\nда мне так то похуй\nShapka (16:55:58 2/02/2009)\nнайду другую чтобы не плакала и не обижалась\nMarkes (16:56:04 2/02/2009)\nты бог\nShapka (16:56:14 2/02/2009)\nтока это хоть не пиши в жж!!!!!\nMarkes (16:56:27 2/02/2009)\nМожно напишу?!?!?! НУ ПОЖАЛУЙСТА!\nShapka (16:56:33 2/02/2009)\nбляяяяяяя\n"}];
        
        let currentFilter = 'all';
        let searchQuery = '';

        // Фильтрация постов
        function filterPosts() {
            return allPosts.filter(post => {
                const matchesFilter = currentFilter === 'all' || post.source === currentFilter;
                const matchesSearch = searchQuery === '' ||
                    post.filename.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    post.full_content.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });
        }

        // Извлечение заголовка из имени файла
        function extractTitle(filename) {
            const parts = filename.split('__');
            if (parts.length > 1) {
                return parts.slice(1).join(' ').replace(/_/g, ' ');
            }
            return filename.replace(/_/g, ' ');
        }

        // Рендеринг постов
        function renderPosts() {
            const filtered = filterPosts();
            const grid = document.getElementById('postsGrid');

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">Постов не найдено. Попробуйте изменить фильтры или поисковый запрос.</div>';
                return;
            }

            grid.innerHTML = filtered.map((post, index) => {
                const sourceClass = post.source.toLowerCase().replace(/ /g, '');
                const title = extractTitle(post.filename);
                const preview = post.full_content.substring(0, 300).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '...';

                return `
                    <div class="post-card" onclick="openPost(${allPosts.indexOf(post)})">
                        <div class="post-header">
                            <span class="post-source source-${sourceClass}">${post.source}</span>
                            <span class="post-date">${post.date}</span>
                        </div>
                        <div class="post-title">${title}</div>
                        <div class="post-preview">${preview}</div>
                        <a class="read-more">Читать полностью →</a>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        // Открытие модального окна с полным постом
        function openPost(index) {
            const post = allPosts[index];
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');

            const title = extractTitle(post.filename);
            const sourceClass = post.source.toLowerCase().replace(/ /g, '');

            modalContent.innerHTML = `
                <div class="post-header">
                    <span class="post-source source-${sourceClass}">${post.source}</span>
                    <span class="post-date">${post.date}</span>
                </div>
                <div class="post-title" style="font-size: 2em; margin: 20px 0;">${title}</div>
                <div class="modal-post-content">${post.full_content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
            `;

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Закрытие модального окна
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Обновление статистики
        function updateStats() {
            const filtered = filterPosts();
            const stats = document.getElementById('stats');
            stats.textContent = `Показано постов: ${filtered.length} из ${allPosts.length}`;
        }

        // Обработчики событий
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts();

            // Фильтры
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderPosts();
                });
            });

            // Поиск
            document.getElementById('searchBox').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderPosts();
            });

            // Закрытие модального окна
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            });

            // Кнопка "наверх"
            const scrollBtn = document.getElementById('scrollToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollBtn.classList.add('visible');
                } else {
                    scrollBtn.classList.remove('visible');
                }
            });

            scrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Закрытие модального окна по ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
