а. Без смысла отвлечь себя.\n«Чтобы я когда нибудь еще раз» думал я, ощущая нестерпимую боль в суставах. Вымытый кальций, спущенный в унитаз - его так не хватало моему телу.\nА в мозгу летали баяны с желтоватым раствором, и все выглядело так заманчиво и красиво. В конце концов я решил делать вид, что ничего не происходит. Лишь покрикивал время от времени от нестерпимой боли и кручения в животе.\nПотом устал, и просто поскуливал.\nКогда поезд подошел к перрону, я постарел лет на сто. Упав в руки в принципе незнакомого мне человека, решил, что пусть хоть к медведю в берлогу, лишь бы эти не повторилось.\nКак прошло время до моего возвращения - это другая история.\nD: Тебе стало хоть немножко полегче? Я могу писать пока ты не заснешь.\nMarkes: Спасибо :)\nD: Не за что. Давай сделаем вот что. Ты сейчас, я так думаю, лежишь. Во первых - вытяни ножки, как только можешь. Словно в детстве, когда думаешь, что стоит потянутся - и станешь взрослым.\nДальше расслабься и подумай о левой ножке, о том, как ей хорошо, тепло и как она устала. А сейчас она будет отдыхать. Может быть ее и крутит, но сейчас ты ей разрешишь отдохнуть, и неприятные ощущения пройдут. Не сразу так - раз и все, а медленно угасая. Ножка станет тяжелой и мягкой. Потом так же и с правой ножкой надо поступить. Дальше надо закрыть глазки и подумать о том, как вы с глазастиком поедете отдыхать после Сибири. Вы много работаете, и еще раз поехать на неделю погреться вам необходимо. Папа вас отправит к солнышку. И все будет хорошо. Там вы отдохнете и глазастик опять будет смотреть, как в животике у мамы все фиолетовое.\nMarkes: :) а ты потом расскажешь мне, что было дальше?\nЧасть 2.\nНу, слушай.\nСтупив на крепкую землю кольского полуострова, я тут же был подхвачен под руки дальним родственником моего приятеля. Заднее сидение автомобиля было неопрятным, словно каждый день на нем перевозили кошек, которые мало того, что оставляли свою мерзкую шерсть повсюду, но еще и время от времени гадили, куда им только прийдет в голову.\n- Ничего, - не поворачивая головы говорил Анатольич - прийдешь в себя, места у нас знаешь какие?! А рыбалка… - Анатольич мечательно прикрыл глаза, и его рот растянулся в широкой улыбки.\nИ эта улыбка мне не понравилась. Помня выезды на природу с папой, который обложившись всевозможными снастями и устроившись на раскладном кресле, заставлял сидеть с ним всю ночь и светить фонариком в направлении поплавка.\n- Ты что, смотри как весело!\n«да папа,ты не мог бы пойти и прыгнуть с моста?»\nА тут история может повториться, кто знает этих северных мужиков? Может они тут еще и чего похуже практикуют, например, собирание грибов.\n- А, кстати, - Анатольич подмигнул мне в зеркало заднего вида. - грибов сейчас в лесу - тьма.\nБилять, я слышал про то, что мысли материализуются, но какого хуя так быстро? Решив больше не думать ни о чем, чтобы это не привело к последствиям, я откинулся на пахучее кошачьими экскрементами сиденье и сосредоточился на проплывающих мимо пейзажах.\nВсе как обычно, но в то же время - эксклюзивно. По сути, природа во всех местах, где я побывал за свою жизнь, была представлена следующими позициями: деревья, горы, вода. Всё. Иногда на обочине попадался какой-нибудь раздавленный заяц, хорек, суслик - в зависимости от региона. Там где посуровее - зайцы, там где теплее - еноты или барсуки. Но в этих местах не встречались даже животные. Вместо них время от времени на дороге встречались суровые солдаты, одетые в различную форму. Они провожали автомобиль подозрительными и цепляющимися за детали взглядами.\n- Ты не смотри что они так пялятся, - словно прочитал мои мысли Анатольич. - тут военные городки, без пропуска вообще ездить нельзя. Вот и смотрят, как бы чего не вышло.\nБлять, простите, как бы чего - это чего? Неужели эти терминаторы в форме цвета хаки думают, что я на кумарах тихо проберусь на их базу, поблевывая от слабости где только можно, и стащу какой нибудь секретный танк или еще страшнее - ракету? Да во мне веса - сорок пять килограммов. Сильный порыв ветра способен лишить меня возможности передвигаться.\nТак мы ехали несколько часов. Водитель время от времени шутил. От его острот становилось все хуже и хуже, потому что шутки являлись плагиатом на товарища Петросяна времен перестройки.\nНаконец, мы вьехали в какое то селение: несколько девятиэтажных домов, стоящих в ряд, с гармонично расположенным невдалеке заводом, а может быть - крематорием. Из труб валил такой черный дым, что если грешников и правда жарят на сковородах - происходит это именно здесь.\n- Приехали. - Анатолич сладко потянулся и хрустнул суставами.\nКвартира представляла собой....да ничего она не представляла. Обычное жилье человека: среднестатистический ковер и стенка вдоль стены в зале. Я добрел до отведенного мне места и упал, провалившись в сон. Снилось не пойми что - из серии страны приливов, только вместо оторванных кукольных голов на ступеньках лежали головы солдат, и куда бы я не шел, они зорко отслеживали мои перемещения.\n- Вставай, я поехал. - Анатолич тряс меня за плечо.\nПосмотрев на часы я убедился, что встают здесь рано. Чертовски рано для обычных людей.\n- На кухне разберешься. Давай, погуляй пока. Смотри, местные у нас дружелюбные, но если пьяные, могут и побить.\nОтлично. По крайней мере я не умру от полной трезвости. С этой мыслью я вышел из дома. Городок представлял из себя жалкое зрелище. Две улицы, прямые, как извилины в моей голове, начинались от леса и упирались в него же. Десяток пятиэтажек, столько же высотных домов. Стандартный набор магазинов,пожалуй все.\nЯ разочарованно шел по улице, пока она не кончилась, и обдумывал сложившуюся ситуацию.Торчать мне здесь не меньше месяца. Даже если я решу отсюда сбежать, то мне потребуется как минимум прийти в себя, ибо до ближайшей железнодорожной станции езды никак не меньше шести часов. Разве что если найти наркотики, но.... и тут это случилось.\nМой взгляд зацепился за компанию молодых людей, стайкой сидящих на остановке и всматривающихся куда то вдаль, словно воробьи. Сомнений не было. По характерному виду, эта социальная группа была мне близка.Только оставалось понять, с какой стороны к ним подойти.\nБыл только один проверенный способ, поэтому я решил действовать. Подойдя к ним, я без особых вступлений сообщил им кто я, откуда и почему я здесь. Завершил я свой рассказ тем, что если они мне не помогут, то скорее всего у них будет удовольствие наблюдать, как я издохну у них на глазах. Парни сначала не поняли, что происходит, но критически осмотрев меня с ног до головы осознали: кидание меня на деньги может плохо закончится. Все-таки вид я имел лютый, и нога моя нервно отстукивала вопросительную дробь. Посовещавшись, они приняли меня в свою компанию, предварительно посвятив в тяготы жизни местных наркоманов.\nИтак, это не секрет, что торчать в маленьком городе с одним аптечным пунктом затруднительно. Дело даже не в том, что население знает про твои маленькие слабости, и отжать на улице телефон или совершить банальную кражу - не вариант.\nПроблема таилась в барыгах-дилерах.\nОни в этих местах были - как редкие звери из красной книги. Приезда барыги ждали, как дети ждут нового года. И хотя в городе передвигался враскоряку один милицейский УАЗ, время от времени глохнув и чихая черным дымом, особого противодействия наркоманам никто не оказывал. К ним относились с терпением, как суровой погоде в этих местах.\nМне сказочно повезло. Какие то силы привели меня к этому пятаку именно в тот момент, когда из города должен был приехать маг и кудесник. На рейсовом автобусе, естественно. Такие визиты он наносил раз в неделю, и поэтому если ты не рассчитал свой заказ или по жадности стрескал его преждевренменно – увы. Жди следующей посылки.\nДребезжа стеклами, подьехал вдавший виды икарус. Из него выпрыгнул, поблескивая темными очками, дилер из девяностых. Понятно, что прогресс в этих местах имелся только в виде его обозначения в толковом словаре, но барыга был шикарен: остроносые черные туфли, волной наплывающие треники и черная же майка «босс» не оставляла никаких шансов сомневаться, кто стоит перед тобой.\nМы быстро сговорились, и уже через двадцать минут хлюпающая носами компания двигалась к одному из болезных на хату, а наш костлявый темноочечный друг, загрузив свое тело в икарус, продолжил движение к следующим поселкам, неся с собой радость и надежду.\nМестный порошок был не плох. Конечно, подбодяжен чуть больше чем у нас, но… На трезвый организм меня просто сшибало с ног волной прихода. Напрочь забыв где живет тот, кто меня приютил, я брел по одной из двух улиц в никуда. Рядом остановилась машина и меня окликнули. Конечно, это был хозяин жилища и конечно я спалился.\n- А, ты с нашими значит сразу спелся? - он крутил руль и качал головой. - Ну ,эту проблему мы тоже решим. Завтра едем в пустой город.\nМне было хорошо, и даже запах кошачьей ссанины не мог перебить удовлетворения. Пустой город - так пустой город. Завтра было так далеко, пусть хоть на луну. Я еще не знал, что это такое, а если бы знал, то возможно это бы и послужило неплохим мотивом для ускоренной программы отвыкания от наркотиков.\nMarkes: а дальше?\nD: дальше страшно.\nMarkes: `ну расскажи.\nЧасть 3.\n- Петрович, ну ты можешь не так гнать то, а?\nНаш проводник - местный сталкер Петрович, с натяжкой походил на персонажа из Стругацких. Ну, во всяком случае в моей голове плотно закрепился образ Кайдановского в этой роли, но никак не мужичка, с лопатообразной бородой и ростом метр пятьдесят (последние пятьдесят – крайне сомнительные). Однако, видом и нравом своим Петрович был намного круче сентиментального и склонного к философии сталкера.\nЗа всю дорогу Петрович не произнес ни одной фразы. Лишь изредка он комментировал взлеты и падения автомобиля марки уаз (в простонародии - «буханка»). Отвратительно говнистого цвета автомобиль, способный подбросить вас так, что голова произведет очередной «бооом» об низкий потолок против вашей воли.\n- Ух, бля, ебись конем а! - эту фразу Петрович изрекал, когда мы попадали в яму.\n- Вот жеж блять курва-а! - так он комментировал очередной камень на дороге, вызывающий многобальное автотрясение в отдельно взятом средстве передвижения.\n- Город этот был построен под военных - вещал лекторским, унылым тоном Анатолич, принявший с утра дозу пиртосодержащего напитка в простонародии именующегося «взбодрин» в размере трех граненых стаканов. - Так вот. Место это было засекречено и на картах его не было. Места здесь дикие, но граница рядом. Норвеги, было, сунулись разнюхать, но говорят никто на ту сторону так и не вернулся.\n- Да. Были времена, - неожиданно молвил Петрович, - вот блять, курва! - машину трясло и ей было нехорошо. У меня вообще были все основания полагать, что наша ознакомительно-воспитательная экскурсия закончится за ближайшим поворотом. И хотя настроение было омерзительным, я испытывал интерес к месту, куда мы прорывались излечивать меня от болезни.\n- Позже там построили училище. Элитное, летчицкое - Анатолич был в ударе. Смакуя детали, он плел из рассказа огромный свитер, которым можно было укрыть не только нас, но и пару ближайших поселков.\n- Сам Гагарин учился там, о чем естественно имеется мемориальная доска в домике, где он жил. Дорога туда одна. И все бы ничего, но незадолго до всех этих перестроечных дел город окончательно засекретили и движение по дороге полностью прекратилось. Ну, у военных свои дела, никто туда не лез, но слухи-то - они быстрее, чем птица - поэтому через пару дней уже вовсю обсуждалось вот что: город - не поселок, а целый город! - с населением тридцать тысяч человек - исчез.\nПетрович многозначительно посмотрел на меня, чтобы я оценил важнось полученной информации. Делать нечего, по правилам следовало изобразить удивление. И хотя мне было абсолютно насрать на исчезновение какого-то там гарнизона, я сделал глаза круглыми, а брови соответственно приподнятыми:\n- Да вы что! Что же случилось?\nАнатолич был удовлетворен, и повернувшись вполоборота ко мне, пунцовый от удовольствия, по слогам ответил:\n- Никто этого не знает.\nТо есть по факту - был небольшой городок со своей инфраструктурой, аккуратными домами и даже Домом Культуры. Люди там жили, рождались, умирали. А в какой-то момент просто раз - и никого не стало. Ничего удивительного я в этой истории не увидел.\n- Так и чего?\n- а того! - Петрович разозлился моей тупости. - Ты понимаешь, в город дорога - одна. Вот мы по ней едем. А тогда по ней никто не проезжал. Тридцать тысяч человек - это сколько машин, автобусов должно было быть?\n- Ну так улетели.\n- Да как улетели-то? Там взлетная полоса для военных истребителей, там обычным самолетам ни взлететь, ни сесть.\nИ тут мне стало не по себе. Шутки на этом месте закончились, и мозг в мгновение собрал картинку того, что могло произойти там, куда мы почти уже приехали. У меня чертовски хорошее воображение, и поэтому возможных сценариев развития было около пятидесяти: от безобидного исхода сквозь леса на территорию соседнего государства до внеземного вторжения космических монстров.\n- И что было дальше? - теперь мой вопрос носил действительно практический интерес, потому что эти джентельмены собирались привезти меня в какое-то мифическое место и оставить там ОДНОГО на целые сутки. Мне идея поездки вдруг разонравилась так сильно, что я начал поцарапывать стекло.\n- А ничего. Никого не встретили, понимаешь? Ни одной души! Даже животных не осталось - ни кошки, ни собаки. Говорят что потом уже, несколько лет спустя, видели некоторых знакомых отсюда - но они старались уходить от ответа или делали вид, что не понимают о чем идет речь.\nВ конце концов, подумал я, бывал я и раньше в странных и не очень понятных местах. Почему бы не побывать еще в одном?\nНаконец чудо советского автопрома выплюнуло нас из очередного поворота и глазам представилась странная картина: перед нами, словно на ладони, у подножия небольшой сопки, лежал городок. Слева от горки виднелись постройки военного назначения.\n- Аэродром. - ткнул пальцем Анатолич.\nПравее был непосредственно сам город. Как и все северные городки, вид он имел скорее неряшливый и дома стояли там, где земля позволяла установить сваи.\n- Вот, смотри, - мимо нас проплывал выкрашенный синей, облупившейся от времени краской, бревенчатый домишко. – это - дом Первого Космонавта.\nДействительно, о великом жителе гласила старая мемориальная доска. Далее мы свернули на главную улицу, по обе стороны от нас стояли в ряд кирпичные пятиэтажки. Стекла во многих окнах были выбиты, и через них можно было рассмотреть, что вся мебель оставалась на своих местах, словно хозяева жилищ просто уехали в отпуск, а дворовые хулиганы, побили стекла и теперь прячутся где то за углом.\nВообще создавалось впечатление, что место это было покинуто. Не оставлено, не брошено, а именно покинуто, по каким-то неведомым причинам. Мужики замолчали, и только рев старого двигаеля раздавался вокруг, отражаясь от стен и создавая причудливую какофонию из хрюканья, стука и надрывного гула.\n- Вот он - символ города.\nМы выехали на небольшой пятачок – по-видимому на главную площадь городка. На ражвом постаменте стоял старый истребитель с приваренным к брюху штырем - один из первых реактивных МИГов. Время поработало над ним, и поэтому памятник имел вид очень изношенный.\nПетрович заглушил машину и, открыв скрипнувшую дверь, шагнул на землю.\n- Приехали. - Анатолич засуетился. - Вот смотри, здесь тебе еды до завтра.\nЯ начинал терять связь с реальностью. Если все мои предыдущие поездки в подобного рода места носили чисто рабочий или познавательный характер, то сейчас эти двое привезли меня хер знает зачем в такое, блять, место, где можно и привидение повстречать. Мало того, они собираются меня здесь оставить одного, с одной единственной целью: здесь меня должно попустить. Да в пизду.\n- Слушай, анатолич, а может не надо этого ничего, а? Я как бы впечатлен, и готов ехать обратно.\n- Но, - Петрович шумно открыл капот. - у Валерки помнишь, сын? Мы его возили сюда - пятый год, как бросил дерьмо это. А у Ленки – дочку тоже сюда свезли. Она, правда, потом в психушку попала – но не колется же. - Петрович поднял палец вверх, будто это был ответ на все мои вопросы.\n- Мужики, я не против того, чтобы сделать, как вы говорите, но обьясните мне: какого хера мы приехали сюда, и назовите хоть одну вескую причину, какого хуя я должен здесь остаться? Причем, блять, остаться один.\n- Ты пойми, - Анатолич положил мне руку на плечо, - когда люди-то пропали, сюда повадились молодые ездить. Пьянки, танцы - дело молодое. Никто против не был, да и в гроде тише стало. Так вот: одна компания поехала сюда очередной какой-то праздник отмечать, на двух машинах, семь человек. Что тут произошло – не понятно, но на следующий день они вернулись словно другие.\nПонимаешь, до этого они гудели чуть ли не каждый день, а тут приехали - и все. Тише воды-ниже травы. Ну, тут Петрович и смекнул, что не просто так это. Сел и поехал сюда. Как положено - взял вещей, остался ночевать. Петрович, давай ты теперь расскажи парню!\nПетрович отвлекся наконец от металлических кишочек своей любимицы, и, вытирая руку промасленной тряпкой, начал говорить. И вот что он поведал: ночью Петрович услышал голос, который вступил с ним в диалог. Голос рассказал ему то, в чем Петрович себе признаваться боялся. Например то, что жизнь он свою губит пьянками, а дети его ненавидят за это. И можно – де - все исправить, достаточно прямо сейчас прекратить.\n- И ты понимаешь, я как бы вроде и не вижу никого, а в голове идет разговор. Ну, я тогда понял, что не просто так отсюда люди то ушли. По совести-то жить, не каждый захочет. А тут такое. Бубнилка в голове и давит тебе на мозг, и так давит, что аж до слез пробирает.\nПетрович вроде не был похож на идиота. Да и я не особо верил в подобные сказки.\n- Вот, ну и стал я возить сюда ребятишек, кто по жизни потерялся. А что - никакого обмана, и никакой мистики. - Петрович улыбнулся своими коричневыми от табака зубами и снова ткнул вверх пальцем. – Ты, главное, не робей.\nДверь машины захлопнулась, на прощание меня обдало сизым вонючим дымом, и я остался один. Через какое-то время тишина стала настолько пронзительной, что я начал петь, чтобы заглушить звук ничего. На самом деле мне было ну очень нехорошо, а еще я боялся услышать звук. Любой. Это бы означало, что я тут не один. И хотя рассказ Петровича зародил во мне сомнения во вменяемости моих товарищей, сталкиваться с чем-то, что могло бы как минимум удивить меня - мне не хотелось вовсе.\nЗа полтора часа я обошел весь городок, присматривая место для ночлега, и удостоверился в том, что в город действительно необитаем. Даже маленькой птички не повстречалось на моем пути. Вернувшись на площадь, я без удовольствия съел грубоватую еду, приготовленную заботливым Анатоличем, и стал смотреть на самолет.\nТяжеленная махина висела, пришпиленная нехитрым замыслом к пьедесталу, и небольшие порывы ветра слегка покачивали ее крылья. Разадавался ржавый неприятный звук. Разглядывая его, я испытал какое-то разочарование. Нет, скорее грусть. Какое-то время назад эта штука наверняка радовала детей, внушала надежду людям, которые здесь служили… Не понятно на что, но мне так хотелось, чтобы она давала надежу. А потом люди ушли, или их похитили инопланетяне -  а этот символ теперь стоит тут в одиночестве. И так будет, пока его не изьест ржавчина до такого состояния, что вся конструкция просто рухнет на землю, но никто этого даже не увидит.\nТемнеет на севере поздно. Полярный день - интересная штука, но мне не повезло: тучи затянули небо и быстро сделали всё темнее, а следовательно - тревожнее.\nЯ решил заночевать в одной из квартир в доме, который находился рядом с музеем летчика - испытателя. Хотелось, конечно, лечь на кровати героя и понять, как ему там спалось, но на двери был гигантский ржавый амбарный замок, а в лютой абстиненции у меня сил едва хватало, чтобы сигарету прикурить. Поэтому, не особо обращая внимания на окружающее, я проследовал в первую же открытую квартиру.\nОбстановка там не отличалась от той, что была у того же Анатолича - тот же ковер, стенка на полкомнаты. Единственная разница была в том, что все было пыльное и какое-то дряхлое, плюс ко всему было холодно. Я завалился на кровать и стал ждать сна. Разные мысли обуревали мой мозг, мне мерещилось, что за дверью комнаты кто-то стоит и вот-вот войдет сюда. Тогда я стал смотреть в ту точку, и смотрел так долго, что глаза заболели и стали слезиться, но ни одного постороннего шума или шороха я так и не услышал.\nНеожиданно для себя я впал в сон. Пробуждение было резким и странным, словно я только закрыл глаза, а когда открыл их, вокруг было темно - хотя ночи в этих местах можно было сравнить с четырьмя часами пополудни в Питере. Однако, я не видел абсолютно ничего, лишь угадывал контуры предметов… и эта тишина - она давила в голову так, что в ушах появился нарастающий звон.\n- Блять, блять - мне стало не по себе. И тут в моей голове раздался (только не стоит считать меня клиническим больным) голос. Он не был похож ни на один из тех, что я слышал когда-либо. Тоесть его не было, но он был. Я не понимал произношения, но он был спокойным и каким-то, теплым, что ли.\nС удивлением я обнаружил,что кумарные боли прошли, и я больше не мерзну, как пес на морозе. Прошли даже боли внизу живота, которые сопровождают наркомана всю первую неделю отмены от наркотиков. Постепенно я начал различать смысл, и стал слушать.\nЭто «что-то» говорило мне о том, какой опасности я подвергаю себя и близких мне людей, когда делаю себе иньекции. Каждое проникновение в меня наркотика позволяет проникнуть сюда чему-то плохому, и чем больше я это делаю, тем больше Их здесь. Голос так и сказал - тем больше Их здесь.\nКонечно, блять, я бодрячком. Лежу на кровати неизвестных мне людей, которые лет двадцать назад как по какой-то причине слились из города всем составом, а в голове у меня - хер знает откуда взявшийся голос, который читает мне мораль о греховной составляющей моей жизни. Поэтому я, будучи весьма прагматичным чуваком - решил идти до конца и, преодолевая сомнения, осторожно, в голове же задал вопрос\n- А позвольте спросить, о ком идет речь? - Типа прикинулся дураком. И зря.\nГолос умолк, и звенящая тишина снова сдавила виски. Кроме того я понял, что я лежу на кровати и не могу шевельнуть ни одним мускулом своего тела. Подвижны только глаза.\nИ тут в окно стукнул камень. Если бы я мог, то наверное обгадился бы на месте, но мой желудок был пуст, как и мочевой пузырь, а поэтому я оставался в положении мумии в Эрмитаже и с ужасом ругал себя - на хера я вечно лезу со своими вопросами так не вовремя?!\nЗвук раздался еще раз и еще сильнее. - Так, я не паникую. Это всего лишь камешек в окно, который кто-то или что-то бросает, - волосы на голове зашевелились от представленной картинки, кто это может быть. По спине побежал строй муравьев.\nВдруг деревянная рама скрипнула и приоткрылась. Всё, это уже слишком. Я волевым движением рванулся и ...остался в том же положении. Сказать, что мне стало страшно - это не сказать ничего. Нечто бесформенное, черное и меняющее очертания, проникало в комнату.\nИздавая шипящий звук, неведомая тварь проталкивалась через узкую щель. Тут я понял, что достаточно уже с меня необычного и начал просто повторять, словно заклинание, детскую считалку. Мне очень хотелось закрыть глаза, но я не мог этого сделать. Это было словно в страшном дестком сне, когда ты видишь что-то очень нехорошее, но ты слишком мал, чтобы противостоять этому, а родители спят в соседней комнате, и ты даже не можешь крикнуть, чтобы разбудить их.\nНаконец мерзкая тварь плюхнулась на пол и издавая шипящие звуки поползла к кровати. Она пульсировала и меняла свои формы. Никуда не торопясь, она проползла к моим ногам и с силой сдавила их, поднимаясь все выше и выше.\nЯ чувствовал холод, словно по мне тащили ледяную глыбу. Настолько холодную, что ломило кости. В странном бесформии я начал угадывать какие-то черты. Мерзость меняла очертания, то принимая формы черт чьих-то лиц, то раздуваясь, как мохнатый мяч. Наконец, мразь достигла моей груди и выпустила что-то похожее на хоботок или жало. Он, подрагивая, словно обнюхивал меня, и двигался вверх, вверх.\nВнутри себя я кричал. Ничего сильнее я не переживал никогда, невероятным усилием я попытался вжаться в кровать и ...открыл глаза.\nВ окно светило солнце и раздавался звук клаксона.\n- Эйййй! - Петрович, милый Петрович! Пожалуй, никогда я не радовался так человеческому голосу. Это был сон, просто сон. Вскочив с кровати я схватил сумку и тут я увидел: створка окна была приоткрыта, а на подоконнике лежали два маленьких камешка.\nЕсли бы за скоростное перемещение через брошенные города давали медали, я бы стал чемпионом мира. Всю обратную доррогу я молчал и на все вопросы Петровича отвечал односложно - да или нет.\nЧерез два дня я купил себе билет в кассах и не откладывая сорвался обратно домой. Анатолич передал связку сушеных грибов, рыбы и прочие подарки родственникам, пригласил приехать на следующий год. Весь путь я просидел на полке, боясь закрыть глаза. Шипящий звук то и дело возникал у меня в голове.\nПитер встретил жарой и улыбающимися людьми.\n- Стой, давай-ка сюда. - водитель-таджик, плохо разбирающийся в устройстве улиц, наконец довез меня до знакомой парадной.\n- О, ты где пропал то? - Ча только проснулся и имел скучающий вид.\nМы сидели на маленькой кухне в хрущевке.\n- Че, вмажемся? - Ча протянул мне баян, заряженный прозрачным раствором. Я замер.\nОтчетливый звук стукнувшего камешка в стекло вызвал во мне животный ужас… стоп, я же взрослый человек.\n- Ты чего? -Ча удивленно смотрел на меня.\n- А, ничо, херня всякая в голову лезет.Подержи руку...\nFrom Spb 2 Transsiberian Trains feb. 2013\nот редактора: первая часть текста была написана в сообщениях, по строчке, и с нежностью выписывалась мной из телефона. Мой любимый писатель рассказывает мне истории на ночь, когда я не могу уснуть, некоторыми из них я просто не могу не делится.\n"}, {"path": "data/lj_export_clean/posts_md/75702__muzikalnaya_gonzo_recenzya.md", "source": "LiveJournal", "date": "Unknown", "filename": "75702__muzikalnaya_gonzo_recenzya", "content": "# Muzikalnaya Gonzo Recenzya\n*Date*: 24 июня 2012, 17:05\n*URL*: https://olymarkes.livejournal.com/75702.html\n\nЗдравстуйте, дорогие читатели. Несколько дней назад в железном почтовом ящике у дороги я обнаружила конверт. Содержимое его повергло меня в ужас: организаторы эпического фестиваля «Кубана» умоляли меня оценить творчество молодых российских исполнителей и помочь выбрать лучшего.\n– это, блять, смешно! – ну какой из меня музыкант, и тем более, блять, эксперт? - воскликнула я, и уже собралас", "full_content": "# Muzikalnaya Gonzo Recenzya\n*Date*: 24 июня 2012, 17:05\n*URL*: https://olymarkes.livejournal.com/75702.html\n\nЗдравстуйте, дорогие читатели. Несколько дней назад в железном почтовом ящике у дороги я обнаружила конверт. Содержимое его повергло меня в ужас: организаторы эпического фестиваля «Кубана» умоляли меня оценить творчество молодых российских исполнителей и помочь выбрать лучшего.\n– это, блять, смешно! – ну какой из меня музыкант, и тем более, блять, эксперт? - воскликнула я, и уже собралась выбросить конверт в мусорное ведро под раковиной.. Но меня остановил грозный возглас:\n– Стой! Что там у тебя?\nМой друг – культовая личность, и человек, чьего имени нельзя произносить (связь со мной может запятнать его репутацию в правительственных кругах) – он настоял на том, чтобы мы прослушали все предложенные группы и беспристрастно написали рецензию.\nМы отложили нарды, подкинули дров в камин и приступили к работе.\nГруппа ***1.\nОн предполагает, что группа ***1 – это старые институтские друзья, которые в светлое время дня торгуют опалубкой и алюминивым прутком, а после работы собираются и играют прифанкованую авторскую песню. Безусловно, если бы они выступали на Грушинском Фестивале, их бы закидали камнями, как авангардистов.\nМне же группа понравилась, особенно песня “***1”. Нежные гитарные партии, теплый, скрипучий, как старое седло, голос вокалиста – хороший саундтрек для дождливого питерского вечера.\nПить и блевать под эту музыку мне бы не очень понравилось, так что на Кубане я эту группу представляю с трудом.\nГруппа ***2!\nМой друг, слушая эту группу, плакал, потому что это ввергло его в пучину ностальгических воспоминаний о временах его студенчества. В то время стипендию выдавали советскими рублями, а город, из которого эта группа родом назывался “Горький”. Курт Кобэйн еще не задумывался о самоубийстве, а Мистер Малой во что бы то не стало собирался умереть молодым. Грув бомбил дискотеки песней “Счастье Есть”, а начинающую группу “Сплин” на ее первых выступлениях закидывали банками.\nНе дослушав первую песню до конца, мой друг побежал в магазин за шортами, клечатой рубашкой и плеером Sony Walkman; Я же осталась, чтобы дать музыкальному творчеству группы адекватную оценку.\nМне очень понравилась группа ***2! - такие бодрые, веселые ребята. Я бы с удовольствием порекомендовала бы их к участию на Кубане, но наш барабанщик Ляпа, который по совместительству играет на басу в группе Bzik, заколбасит меня на ближайшей репетиции. Поэтому – простите, ребята.\nГруппа ***3!\nК тому моменту, как я дослушала группу ***2 и перешла к группе ***3 мой друг как раз вернулся – в поп-панк экипировке и первым альбомом группы «Кирпичи» в руке. На третьем треке он разложил все в центре комнаты и устроил ритуальный костер. Стягивая с себя клечатую рубашку и белые носки он плакал – не в силах смирится с тем, как постарел Дима Спирин, что группы I.F.K. больше нет и тех, кто знает группу Scang практически не осталось в живых.\nМне группа ***3 очень понравилась, я бы с радостью пила и блевала бы под них на Кубане… Но боюсь если мы возьмем их – группа ***2 обидится.\nГруппа Scang Sattawood\nУвидев обложку диска я почувствовала неладное, и предчувствие не обмануло меня. Группа оказалась феноменально охуительной.\nПод трек Dark Is Eyed я бы прямо сейчас вмазалась героином, но боюсь тогда выступление группы ТТП на Кубане придется отменить, к тому же напротив сидит мой директор Катя, а справа - нарколог, который присматривает за мной после моего недавнего побега из реабилитационного центра для наркоманов под Псковом. Со слезами на глазах мне пришлось выключить этот гениальный трек и перейти к прослушиванию группы Алоэ Вера.\nМой друг же за это короткое время снова предался воспоминаниям: дождливый ночной лиговский проспект, с его абсолютно депрессивным красным светом фонарей и абсолютным счастьем от качественно вколотой дозы практически неразбавленного героина. Счастье омрачено только косматым неопрятным псом, который пытается вступить с ним в интимную близость сзади, пользуясь его абсолютной беспомощностью и тем, что тело лежит на тротуаре. «Даа, хорошая группа» - грустно вздыхает он.\nГруппа Алоэ Вера.\n- Это демонизированное творчество Иосифа Кобзона! – воскликнул мой друг, заткнул уши и начал раскачиваться, как старые еврей на молитве.\nЯ же не могу адекватно оценивать творчество группы Алоэ Вера, потому что они – наши бывшие друзья.\nГруппа Кактус.\nПосле прослушивания новейшей российской музыки, мы с горя решили заняться сексом. Осталась только группа Кактус и… все прошло неплохо. Так что наш эксперный совет предлагает эту группу в качестве участников самого охуенного фестиваля на свете.\nП.С. Авторы рецензии снимают с себя всю ответственность за написанное ввиду клинического идиотизма.\n"}, {"path": "data/lj_export_clean/posts_md/76137__z.md", "source": "LiveJournal", "date": "Unknown", "filename": "76137__z", "content": "# Z?\n*Date*: 23 августа 2012, 19:55\n*URL*: https://olymarkes.livejournal.com/76137.html\n\nЭта вечная журналистская привычка – из самого центра событий выдыхать вместо дыма эти слова и буквы. Лучше чем фото. Лучше чем пленка.\nНочью над Екатеринбургом ползал по облакам светящийся прожектор, я читала Птюч и мечтала – когда я буду взрослой у меня будет много друзей и пропуск за все закрытые двери. У меня будет хитрый взгляд и такая большая и спокойная птица свободы в груди - как будто я могу взмахнут", "full_content": "# Z?\n*Date*: 23 августа 2012, 19:55\n*URL*: https://olymarkes.livejournal.com/76137.html\n\nЭта вечная журналистская привычка – из самого центра событий выдыхать вместо дыма эти слова и буквы. Лучше чем фото. Лучше чем пленка.\nНочью над Екатеринбургом ползал по облакам светящийся прожектор, я читала Птюч и мечтала – когда я буду взрослой у меня будет много друзей и пропуск за все закрытые двери. У меня будет хитрый взгляд и такая большая и спокойная птица свободы в груди - как будто я могу взмахнуть крыльями и оказаться в любом месте – от Ибицы до Крыма, и нет ни одной причины, чтобы это не сбылось.\nУ меня будут очки с синей оправой, и лучи моей гривы будут касаться солнца – и загорелые плечи, белые кеды и легкое платье – все это будет, и такие маленькие искры в каждом из десяти пальцев – как будто я могу прикоснуться к воздуху, и превратить его в музыку. Как будто я могу взглянуть на человека и превратить его в историю, и другие будут читать и любить его так же, как любила я в эту секунду.\nИ все эти люди, которых я уважаю и знаю – они будут называть мое имя прежде, чем я скажу его сама. И я не буду спрашивать, сколько стоит чай. И я не буду думать в чем нужно себе отказать, чтобы купить себе билеты на большую белую птицу.\nЯ рос, и все происходило незаметно. Я не знал, что делать, когда передо мной открывали эти двери - я заходил в них и что-то искал. Это безумное веселье и люди, которые подходили ко мне и называли мое имя – я терялся и опускал глаза. Я громко смеялся и совсем не умел плакать.\nЯ не спрашивал, сколько стоит чай, алкоголь и стафф – так много, что они теряли вкус и смысл. И большие белые птицы стали душными железными машинами. И я совсем не умел любить – в самых красивых и шумных местах я искал глазами самых красивых и успешных, чтобы подойти и сказать: «Пойдем.». И мы шли. И я думал – почему я выбираю книгу по обложке? Мы сидели рядом и не знали, что сказать друг другу – зарывшись носами в свои девайсы с половиной яблока на задней крышке. И мне было чертовски одиноко.\nИ на все нужно время. Я проснулась и вышла на улицу из маленького домика над обрывом. Каменные скалы на самой западной точке Крыма – и никого, никого, никого – только ветер, я и море там, внизу.\nМой учитель налил мне черного чая в пластиковый стакан. Потом эти плавные формулы Y23 на белых камнях… Дорога вдоль моря и вот сейчас бархатная крымская ночь, нежная музыка обнимает меня и все эти белые купола, белое дерево, мягкие диваны, гамаки, красивые люди – и мне не нужно обладать кем-то, я не ищу того, кто мог бы на время заполнить эту пустоту внутри – только этот покой без алкоголя, стаффа и бездумного веселья – даже в самом шумном месте я чувствую это спокойное море внутри, оно качает меня… Оно качает меня, как этот ветер качает белый тюль занавесок и я в колыбели – нежные руки Художника рисуют меня в этой реальности, воссоздавая меня такой, какой мы когда-то задумали меня.. задумали вместе.\nИ я люблю. Я люблю его сейчас и здесь и хочу любить до самого конца. Четыре шага – и он докурит свою сигарету, а я допишу эту страницу и закрою ноутбук, и подойду к нему и мы снова будем вместе, и так близко – как от Питера до Одессы и дальше на Юг и снова на Север. КаZaнтип ХХ. Республика Щастья. Август 2012. навсегда\n"}, {"path": "data/lj_export_clean/posts_md/778__искренность.md", "source": "LiveJournal", "date": "Unknown", "filename": "778__искренность", "content": "# искренность\n*Date*: 18 декабря 2008, 14:26\n*URL*: https://olymarkes.livejournal.com/778.html\n\nВопрос. Сколько правды о себе можно сказать? А что, если всю?\nНет, серьёзно. Мне ведь уже давно всё равно, что обо мне 1. Думают 2. Говорят за спиной 3. Говорят вообще\nПочему? Потому что до меня доходит и много хорошего и много плохого, а жизнь моя от этого не меняется.\nБыло и такое время, когда я переживала из-за того, что я вдруг окажусь хуже, чем обо мне думают. Да и гадости в мою сторону меня расс", "full_content": "# искренность\n*Date*: 18 декабря 2008, 14:26\n*URL*: https://olymarkes.livejournal.com/778.html\n\nВопрос. Сколько правды о себе можно сказать? А что, если всю?\nНет, серьёзно. Мне ведь уже давно всё равно, что обо мне 1. Думают 2. Говорят за спиной 3. Говорят вообще\nПочему? Потому что до меня доходит и много хорошего и много плохого, а жизнь моя от этого не меняется.\nБыло и такое время, когда я переживала из-за того, что я вдруг окажусь хуже, чем обо мне думают. Да и гадости в мою сторону меня расстраивали. Из за такого диссонанса я чуть не сошла с ума. Пытаться вечно быть хотя бы \"нормальным человеком\"  - это, я скажу вам, полное дерьмо. У меня и так комплекс \"хорошего ребенка\", мне типа нужно чтобы родители меня одобряли, и поэтому я стараюсь делать и то и сё, СООТВЕТСТВОВАТЬ, быть НЕ ХУЖЕ и прочее дерьмо. Если у меня, по моему мнению, не выходит - я наказываю себя сама. Да да, именно такие ёбнутые психи как я втыкают в себя иголки или ищут себе \"госпожу\" в садо-мазо клубах, страдают булимией и анорексией, а так же прочими сдвигами по фазе.\nХо-хо, я не исключение. И наверное не так страшно мне было жить с ощущением своего безумия, насколько страшно было, что оно откроется. Но все тайное становиться явным, и я поняла что есть вещи, которые гораздо легче принять остальным, чем тебе - скрывать. И зачем ждать, пока толпа людей кинет в тебя камень осуждения в тот момент, когда ПРАВДА откроется? Пускай они уже сейчас плюнут в мою сторону, ведь я это я. Не нравицо - не ешьте.\nВ умении принять себя со всем дерьмом, которое в тебе есть - истиное искусство любить себя. И только полюбив себя, ты сможешь полюбить других людей и вообще весь мир. Только так можно познать хитрый замысел творца. И то, что самое гнилое зло в итоге по цепочке рождает добро. И до неба можно допрыгнуть, только оттолкнувшись от дна. Путь принятия себя и познания истиного положения вещей начинается с простой правды, которая оказывается совсем не такой страшной, как кажется.\nНаткнулась тут на реггей-форуме на чей то пост: \"Оля - обычная наркоманка\" ну и чо то в этом духе. Ха ) знаете чо я скажу? 1. Я не курю травку уже давно. Однажды мне надоело, да и вообще, если честно - не прёт.  У меня бывали проблемы с вещами и похуже. Да да, я вам даже могу посоветвать адресок отличного рехэба. Наркотики - дерьмо и ад. Я перегрызу горло любому, кто даст яд любому из моих друзей или моему брату и сестре. Убью, нах.й.  А так - чо скрывать. Один раз попробуешь и все. Ты инфицирован навсегда, так что да да да! Хоть я и не торчу вчера сегодня и (дай бог!) завтра, факт один:  я - наркоманка. И такие как я на правду не обижаюцо.\nБе бе бе\n"}, {"path": "data/daily2025_export/posts_md/2025-07-17__1927__7_дней_коливинге_doma.md", "source": "Daily2025", "date": "2025-07-17", "filename": "2025-07-17__1927__7_дней_коливинге_doma", "content": "# 2025-07-17 — 7 дней коливинге doma\n*Datetime*: 2025-07-17T21:20:29+08:00\n*Message ID*: 1927\n\n7 дней на коливинге Doma\n\nЕсть тусовка предпринимателей S16, в которую я несколько лет назад попала через постель потому что у меня классный бизнес. на самом деле никого из ребят я до этого не знала даже виртуально и не была подписана - я из совсем другого круга, разве что видела тот самый выпуск у Дудя про русских предпринимателей в Долине. Потом мне написал Дима, с которым мы тогда только один раз пе", "full_content": "# 2025-07-17 — 7 дней коливинге doma\n*Datetime*: 2025-07-17T21:20:29+08:00\n*Message ID*: 1927\n\n7 дней на коливинге Doma\n\nЕсть тусовка предпринимателей S16, в которую я несколько лет назад попала через постель потому что у меня классный бизнес. на самом деле никого из ребят я до этого не знала даже виртуально и не была подписана - я из совсем другого круга, разве что видела тот самый выпуск у Дудя про русских предпринимателей в Долине. Потом мне написал Дима, с которым мы тогда только один раз пересекались в Clubhouse и позвал меня на закрытую конфу для фаундеров - туда можно попасть только по приглашению/рекомендации. Там я офигела от того, что так бывает: насколько приятная туса, классные темы, интересные идеи мысли миссии, и никакого там успешного успеха и токсичного достигаторства и ощущения что все пришли друг друга юзать. Наоборот - поддержка и тепло и все очень likeminded.\n\nИ вот последние несколько лет с разной степенью погружения я с удовольствием гоняю на все мероприятия сообщества. Некоммерческие, закрытые ивенты где все друг друга знают и организуют досуг себе и своим семьям по модели бернинг мэн - все скидываются на программу - еду и фасилитис, участники проводят друг для друга активности бесплатно. Если мероприятие семейное - детям организуется досуг, программа лагеря, но в целом взрослые и дети тусуются вместе. То мероприятие, на которое мы ездили сейчас - это летний коливинг сообщества в Doma - это красивейшая Кинта под Лиссабоном, природа, баня. Сама Кинта в прошлом году была куплена на деньги, crowdfunded by community для своих мероприятий активностей. В прошлом году мы тоже организовывали ивенты на Кинте - например там проходила наша тантра, и ADHD коворкинг, и следующая тантра тоже будет там в ноябре. Короче, мы там уже как дома.\n\nНа коливинге было 120 человек, многие семьями. Из активностей - мы с Димой проводили наши практики и ADHD коворкинг, Леша Хахунов вел вайбкодинг буткэмп, Стимолоджи каждый день парили в Бане, Миша Дашкиев разбирал бизнесы, Ваня Замесин рассказывал про продукт, Дима Шаменков - про отношения, Дима Романов вел вечернее камеди шоу, Женя Рид рассказывал про AI для инвестиций, Алена Замесина вела практики для восстановления, No Musician играли концерты, я спела пару песен под фортепиано Насти Урбан. Программа каждый день была насыщенная разнообразная и все было и для работы, и для отдыха, и для души.\n\nМы гуляли, болтали и пили 100500 вкусных безалкогольных коктейлей, ужинали в лесу, обсуждали проекты и будущее сообщества. Я понимаю, что многие люди из этого круга становятся мне близкими, мы проживаем много опытов вместе - и такие ивенты, и тантра, и Куприянов - в основном вся эта туса как из книги 2 жизни путешествует по миру и встречается в разных ситуациях, чтобы прожить что-то важное, при этом - не отвлекаясь от своей миссии. А еще круто что мои друзья, например Лена Дегтярь, тоже становятся частью сообщества и мы можем разделить этот опыт вместе. Вижу, что Лена вообще нашла в этой тусовке свой дом) Лиссабон сейчас стал точкой притяжения. Но на Бали сейчас S16 строят еще одно пространство для сообщества - как раз рядом с нашим домом, так что пока в Лис я не переезжаю))\n\nТакой вот вам немножко журналистский материал\n\nLinks:\n- https://t.me/doma_portugal\n- https://t.me/atmos_portugal\n\nReactions: 🔥328 ❤272 👏19 🍓6 😎3 👍2 🥰2 🤣1\n"}, {"path": "data/daily2025_export/posts_md/2025-03-24__1543__редкое_состояние_когда_не_знаю_написать_неделя.md", "source": "Daily2025", "date": "2025-03-24", "filename": "2025-03-24__1543__редкое_состояние_когда_не_знаю_написать_неделя", "content": "# 2025-03-24 — редкое состояние когда не знаю написать неделя\n*Datetime*: 2025-03-24T15:22:57+08:00\n*Message ID*: 1543\n\nРедкое состояние, когда не знаю, что написать. Уже неделя, как я вернулась, а все еще в каком-то коматозе. Погоды стоят так себе, то дождь, то ураган, и нет серфинга. Мне кажется это вообще важная вещь для качества жизни, просто любой день в океане +100 к настроению, а тут этого нет.\n\nЯ вроде нормально сплю, но все равно просыпаюсь с тяжелой головой. Я не могу похвастаться рабо", "full_content": "# 2025-03-24 — редкое состояние когда не знаю написать неделя\n*Datetime*: 2025-03-24T15:22:57+08:00\n*Message ID*: 1543\n\nРедкое состояние, когда не знаю, что написать. Уже неделя, как я вернулась, а все еще в каком-то коматозе. Погоды стоят так себе, то дождь, то ураган, и нет серфинга. Мне кажется это вообще важная вещь для качества жизни, просто любой день в океане +100 к настроению, а тут этого нет.\n\nЯ вроде нормально сплю, но все равно просыпаюсь с тяжелой головой. Я не могу похвастаться рабочей эффективностью, творческой энергией и новыми свершениями. Зато я посмотрела парочку сериалов, ходила на практики и много много думала о разном.\n\nНапример, история с letting go - я уже писала о том, что мне тяжело даже сдавать недвижку, с которой связаны истории, яркие моменты жизни детей, где лежат мои вещи. В каких-то практиках я прям преисполнилась ненавистью к этому вещичеству, к этим квартирам-памятникам, к этой тяжести, которая как будто не приносит ни радости ни легкости. Я все еще не готова ни продать ни сдать квартиру в Питере, мою самую первую, и наверное когда я что-то сделаю с ней - это будет главная психологическая победа.\n\nКак наверное вы уже заметили, я ненавижу выбирать и от чего-то отказываться. Я не хочу выбирать один карьерный путь, одну страну или даже одного партнера на всю жизнь. Мысль о том чтобы определиться вызывает у меня ужас и ощущение тюрьмы. Я хочу выбирать вообще все, что хочу. Но я не могу прожить параллельные жизни во всех местах, которые я люблю. И сейчас, как минимум пока дети не вырастут, я хочу жить на Бали. А еще мне очень тяжело сдавать, я постоянно в окр-тревоге, так что история с пассивным доходом вроде хороша, но в итоге я сжигаю столько нервных клеток в мыслях что там что-то испортится, что проще не сдавать. Вообще сама глубина жизни даже с одним человеком или slow life в одном месте меня всегда завораживала, я помню как смотрела много раз фильм take this waltz и меня прям переворачивало, почему почему почему я не могу оставаться просто в одном состоянии, почему меня вечно куда-то несет, что это за цыганская жилка такая. Мои брат и сестра до сих пор живут в Екатеринбурге и счастливы. А я уже столько сменила городов и жизней.\n\nВ одной из песен нового альбома написала об этом - как будто есть ощущение последней жизни, за которую я пытаюсь все успеть.  А еще это похоже на сдвг масштаба всей жизни - так и в каждом моменте я чаще всего делаю 2 дела одновременно, а то и 3.\n\nИногда я читаю канал Лены «поорать о материнстве» и испытываю чувство ужаса, потому что с одной стороны мое шило в жопе лишило меня возможности slow life, но с другой стороны дало мне независимость и опору на себя, возможность разгрузить себя от быта и выстроить равные и здоровые отношения с родителями, партнерами и всеми вообще, кто-то говорил что без денег ни мои хорошие отношения с партнерами, ни с родителями были бы невозможны.  И я тут согласна - моя первая мотивация получить образование и ебашить, не завися ни от кого, было это - чтобы никто и никогда не указывал мне, как жить. Мне отвратительна идея финансовой зависимости от мужчины и даже гипотетическая власть надо мной. Причем и в терапии и на Куприянове так мощно это мне открылось - мой бунтующий подросток, который так классно заработал себе право быть независимым и свободным. Я благодарна за эту гиперкомпенсацию, но при этом мне так больно смотреть на истории женщин, которые по сути дела не имели такой травмы и доверились этому миру - быть хорошей девочкой, хорошей женой, хорошей мамой - и часто в этих историях «поорать о материнстве» я вижу, к какой катастрофе и разочарованию это приводит.  А еще я вижу другую крайность - когда девушки сами делают из себя объект, как товар на рынке. И феминизм он о том, что каждая женщина имеет право выбирать свой путь и как ей жить и что делать, но я оглядываясь на свою жизнь и вокруг просто понимаю что я не могу найти другое целевое состояние, другой пример чтобы сказать: «хочу исцелиться и жить вот как она», как будто что бы я не перебирала - лучше Коли и Марины Давыдовых в голове ничего не всплывает.\n\nИ вот эта история, что если бы у меня была дочь, я бы особенно сильно хотела привить ей эту любовь к независимости.\n\nReactions: ❤776 💯111 🔥71 💔29 👍27 👌10 🤔8 💊4 😭4 🥱3 🙈2\n"}, {"path": "data/daily2025_export/posts_md/2025-03-09__1457__люблю_себя_ту_еле_вышла_дома_не.md", "source": "Daily2025", "date": "2025-03-09", "filename": "2025-03-09__1457__люблю_себя_ту_еле_вышла_дома_не", "content": "# 2025-03-09 — люблю себя ту еле вышла дома не\n*Datetime*: 2025-03-09T07:49:48+08:00\n*Message ID*: 1457\ n19:00 ужин семейный\n\n19:30 IFS - терапия с Димой. было весело)) как сказала терапевт: после расставания кажется вам обоим стало лучше и вы оба получили то, что хотели.\n\nСейчас накидала дневничок и собираюсь пораньше лечь спать, чтобы завтра прожить еще один продуктивный балийский день.\n\nПС: ваши комментарии про зависимости - зачиталась! Интересное про чтение комментариев, там многие писали что тоже на этом торчат. Конечно я обожаю читать комментарии не только к своему контенту, но и к чужому. А еще моя любимая соцсеть это твиттер, там одни сплошные мета отсылочки.\n\nКаждого комментатора этого бложика обнимаю, когда вы не только читаете, но и пишете - я вас постепенно узнаю, узнаю ваши аватарки и стиль, а когда больше делитесь - начинаю узнавать и запоминать ваши истории.\n\nReactions: ❤857 🔥120 👍65 🥰55 ❤‍🔥47 🍓7 🌚6 🕊5 😁5 👏4 👀1\n"}, {"path": "data/daily2025_export/posts_md/2025-01-12__1189__одна_практика_лешей_тантре_показала_силу_даосских.md", "source": "Daily2025", "date": "2025-01-12", "filename": "2025-01-12__1189__одна_практика_лешей_тантре_показала_силу_даосских", "content": "# 2025-01-12 — одна практика лешей тантре показала силу даосских\n*Datetime*: 2025-01-12T18:07:18+08:00\n*Message ID*: 1189\n\nОдна практика с Лешей на тантре показала мне силу даосских практик, партнер с таким опытом может тебе показать другой уровень чувствительности энергетической. Первая же групповая терапия с Юлей показала, насколько ультра-честность и смелость могут изменить все групповое пространство. Юля научила меня, как работать у Куприянова, и я с тех пор всегда пользуюсь ее опытом. Ну и ", "full_content": "# 2025-01-12 — одна практика лешей тантре показала силу даосских\n*Datetime*: 2025-01-12T18:07:18+08:00\n*Message ID*: 1189\n\nОдна практика с Лешей на тантре показала мне силу даосских практик, партнер с таким опытом может тебе показать другой уровень чувствительности энергетической. Первая же групповая терапия с Юлей показала, насколько ультра-честность и смелость могут изменить все групповое пространство. Юля научила меня, как работать у Куприянова, и я с тех пор всегда пользуюсь ее опытом. Ну и как пара они - просто космос. Они были вместе, потом расходились, и вот когда встретились после расставания и решили быть вместе - там конечно такое ощущение power couple что не рассказать в тексте, это надо видеть. И мне было классно погреться рядом с ними в этой любви и в кругу их близких друзей.\n\nОткрытие поездки - это сестра Юли, Кристина. Мне было очень хорошо с ней, мы занимались йогой, болтали и вообще ощущалось, что так может продолжаться очень очень долго. И то, что я увожу с собой, что любящая вселенная всегда найдет в любой точке мира человека самой тонкой материи, чтобы прикоснуться ко мне своей любящей рукой, и я не буду чувствовать себя одиноко. С Кристиной я чувствовала, что сама вселенная говорит мне, что я прекрасна, и я любуюсь ей в ответ.\n\nВ ретритном центре ко мне подошло несколько девушек. Одна - доктор восточной медицины, она приехала учится у мастера Монтека Чиа, и знает обо мне от своей пациентки, при этом она сказала, что моего мужчину зовут Педро. Я посмеялась, что он сделал меня более популярной)). Вторая девушка знала меня по ретритам Пемы, она в команде Пемы одна из «хэлперов».  Спросила, будем ли мы делать новый ретрит, и я ей сказала что Пема как раз написала нам утром по поводу наших дат - ждем окончательного согласования, чтобы начать процесс подготовки длинной почти в 9 месяцев.\n\nпро движение:\n\nМного ходила пешком\nсделала 2 тренировки Soft/super power и у меня болят ягодички.\nс Кристиной несколько классных крий кундалини йоги и поняла, чем буду заниматься, пока мои тазобедренные суставы отдыхают от flow практик. Кундалини отлично дает йогическое состояние.\n\nПоследний час последнего перелета слушаю подкаст про дофамин, очень рекомендую всем, кому хочется разобраться в зависимом поведении.\n\nИнтересно послушать, у кого какой drug of choice, расскажу немного про мои:\n\nв наркотиках я всегда предпочитала стимуляторы, видимо, это было self-medication от сдвг, давало мне возможность сосредоточится\n\nСигареты (которые я уже не курю) и кофе (которого я все еще потребляю много) это для меня про успокоение/заземление\n\nВ интернете мой наркотик - это комментарии. Причем я тут вспоминаю раннее время, когда меня никто не знал, я писала на разных форумах, писала рассказы «креативы» и мечтала, чтобы кто-то прочитал и написал мне ответ, отрефлексировал, то есть мой самый вкусный дофаминчик направлен на достижение глубоких резонирующих (при этом не обязательно хвалебных) ответов. И я не залипаю на видосах в интернете, но я могу обновлять соц.сети чтобы прочитать директ и комментарии. И собственно произвожу разный контент и смотрю на него отклик.\n\nВ еде наркотические тенденции были только тогда, когда были ограничения. Я торчала на мороженом и особенно его хотела и особенно от него кайфовала, и его надо было заслужить. Потом когда его стало можно всегда, и я наелась его вдоволь, и отношение стало ровное.\n\nНо конечно главное мое достижение, которым я горжусь - добываю ежедневно дофамин, как советует доктор Лембке - в разнообразном движении. Очень важно встать с дивана и начать двигаться. Ну и благодаря моему СДВГ мы в секте создаем продукт для мне подобных, без однообразия, эффективно расходующий время и силы и тд и тп.\n\nТеперь, когда вы знаете мой главный торч - вы знаете, как сделать мне больно)) Просто НЕ писать комментарии а ставить эти бесполезные реакции. Но мне правда интересно, кто из моих читателей на чем торчит.\n\nLinks:\n- https://youtu.be/R6xbXOp7wDA?si=WGWRypUzsXGEq2lE\n\nReactions: ❤942 😁186 🔥172 ⚡100 👾57 👍25 😎18 🆒9 🥰9 😇5 🙏3\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2025-01-10__255__первые_4_часа_полета_прочитала_300_страниц.md", "source": "Vi Vse Nepr", "date": "2025-01-10", "filename": "2025-01-10__255__первые_4_часа_полета_прочитала_300_страниц", "content": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:06:57+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 255\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. ", "full_content": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:06:57+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 255\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давало мне поддержку в трезвости, но не давало душевного покоя.\n\nВ 24, после рехаба (который состоялся после срыва - 2 года чистоты и снова отчаяние, что надо начинать с нуля), начала собственно работу по «руководству» 12 шагов. Каждый шаг содержит несколько десятков вопросов, на которые ты отвечаешь примерами из своей жизни, и потом зачитываешь их «спонсору» - волонтеру из программы, у которого опыта больше, чем у тебя. Спонсор дает тебе обратную связь. В «Эйфории» классно показаны отношения Ру и ее спонсора.\n\nЯ написала все 12 шагов, причем дольше всего я писала 4й шаг (4 года) и раздел «обиды»  - он занял у меня около 3х лет. Это самая мощная в плане дисциплины и усидчивости терапевтическая работа, которую я проделала в своей жизни. Это исцелило меня от многих навязчивых состояний, которые меня преследовали - прежде всего от болезненных реакций на взаимодействие с миром. Пока я писала шаги - случалось некоторое дерьмо во всех сферах жизни, и все это было отличным полигоном для практики и рефлексии. И когда меня спрашивают, что в жизни дало тебе самый большой буст, я отвечаю: трезвость и шаги. Причем первые 6 лет трезвость без шагов работала плохо, мне надо было разобраться с причиной моей зависимости, чтобы перестать жить ту жизнь, которая доставляла мне боль.\n\nПервый терапевт у меня появился после развода. Я начинала тогда отношения с Вадимом и была в ужасе от перспективы потратить годы жизни прекрасного человека и в итоге как обычно все разрушить, разочаровать его и себя, повторить свой дурге-цикл и остаться с ощущением, что всё говно и я говно. Смешно, что тут вспомнила свое стихотворение школьных времен:\n\n «Брачо ходит злой.\n   На дворе зима.\n   Люди все говно.\n   Да и я сама»\n\nПервый терапевт мужчина неплохо так меня поправил, во-первых я поняла, что для брака моего я сделала очень много, и что не все в отношениях зависит от меня, и все может быть прекрасно, а может и не быть, но в любом случает само по себе имеет смысл, как и то, какая я во всех своих травмах и компенсациях и есть то, в числе прочего, за что меня любят и хотят со мной быть. Я перестала демонизировать и отвергать свою дурге-часть, оставила тревоги и позволила счастью личной жизни быть со мной в моменте, а в терапии перешла к проблемам на работе. Почувствовала, что мой терапевт от этих тем скучает и нет у него такой страсти к этой теме, и это стало толчком для смены терапевта.\n\nПоследние лет 6 я в терапии с опытной женщиной, кандидатом наук и по моим ощущениям очень классическим системным терапевтом. В эту терапию я зашла с непринятием своей жесткой части. У меня была такая метафора: я хочу быть Белоснежкой, а на самом деле я злая королева. В соц сетях я играю в «свет мой зеркальце скажи», постоянно присутствую своей хорошей частью, а плохую стыдливо прячу, я не хочу быть жесткой, я хочу быть мягкой, я хочу быть доброй, я хочу, чтобы меня все любили, а меня не любят и я их за это ненавижу, и себя ненавижу. У меня не было границ на работе, я все принимала очень лично, с сотрудниками я часто была в позиции маленькой девочки и хотела их одобрения, я страдала заискиванием и пипл-плизингом, при этом тень прорывалась заскоками, истериками, жестокостью и неадекватными поступками, за которые я потом себя винила. То есть я понимала, как бы я хотела себя вести и каким боссом я хотела быть, но почему-то у меня не получалось. Я играла роль, с которой я не справлялась. Носила маску из которой торчала неприглядная тень. Это все бесило и создавало лав-хейт отношения с работой.\n\nЛонг стори шорт: эта терапия создала вау-эффект. Вот когда я читаю книги Ялома, мне хочется написать и про мой процесс, а еще лучше - узнать, как это было с другой стороны, как терапевт видит нашу работу.\n\nReactions: 🕊558 💊138\n"}, {"path": "data/daily2025_export/posts_md/2025-01-10__1183__первые_4_часа_полета_прочитала_300_страниц.md", "source": "Daily2025", "date": "2025-01-10", "filename": "2025-01-10__1183__первые_4_часа_полета_прочитала_300_страниц", "content": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:09:40+08:00\n*From*: Olymarkes Daily\n*Message ID*: 1183\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давал", "full_content": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:09:40+08:00\n*From*: Olymarkes Daily\n*Message ID*: 1183\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давало мне поддержку в трезв ях и есть то, в числе прочего, за что меня любят и хотят со мной быть. Я перестала демонизировать и отвергать свою дурге-часть, оставила тревоги и позволила счастью личной жизни быть со мной в моменте, а в терапии перешла к проблемам на работе. Почувствовала, что мой терапевт от этих тем скучает и нет у него такой страсти к этой теме, и это стало толчком для смены терапевта.\n\nПоследние лет 6 я в терапии с опытной женщиной, кандидатом наук и по моим ощущениям очень классическим системным терапевтом. В эту терапию я зашла с непринятием своей жесткой части. У меня была такая метафора: я хочу быть Белоснежкой, а на самом деле я злая королева. В соц сетях я играю в «свет мой зеркальце скажи», постоянно присутствую своей хорошей частью, а плохую стыдливо прячу, я не хочу быть жесткой, я хочу быть мягкой, я хочу быть доброй, я хочу, чтобы меня все любили, а меня не любят и я их за это ненавижу, и себя ненавижу. У меня не было границ на работе, я все принимала очень лично, с сотрудниками я часто была в позиции маленькой девочки и хотела их одобрения, я страдала заискиванием и пипл-плизингом, при этом тень прорывалась заскоками, истериками, жестокостью и неадекватными поступками, за которые я потом себя винила. То есть я понимала, как бы я хотела себя вести и каким боссом я хотела быть, но почему-то у меня не получалось. Я играла роль, с которой я не справлялась. Носила маску из которой торчала неприглядная тень. Это все бесило и создавало лав-хейт отношения с работой.\n\nЛонг стори шорт: эта терапия создала вау-эффект. Вот когда я читаю книги Ялома, мне хочется написать и про мой процесс, а еще лучше - узнать, как это было с другой стороны, как терапевт видит нашу работу.\n\nReactions: ❤723 🔥125 👍53 ❤‍🔥37 🙏22 👀4 🤗2 🤣1\n"}, {"path": "data/daily2025_export/posts_md/2025-01-06__1169__вчера_катя_кейльман_спросила_комментариях_проживала_любовь.md", "source": "Daily2025", "date": "2025-01-06", "filename": "2025-01-06__1169__вчера_катя_кейльман_спросила_комментариях_проживала_любовь", "content": "# 2025-01-06 — вчера катя кейльман спросила комментариях проживала любовь\n*Datetime*: 2025-01-06T21:49:52+08:00\n*Message ID*: 1169\n\nВчера Катя Кейльман спросила меня в комментариях: как бы я проживала любовь, если бы она была не взаимной?\n\nСегодня я весь день качаюсь в колыбели каких-то очень сладких внутренних ощущений присутствия этой моей любви во мне, и я вспоминаю слова кажется Лены Дегтярь. Она сказала: Педро случился не только с тобой, он случился с Димой, и вообще со всеми нами. И сейчас", "full_content": "# 2025-01-06 — вчера катя кейльман спросила комментариях проживала любовь\n*Datetime*: 2025-01-06T21:49:52+08:00\n*Message ID*: 1169\n\nВчера Катя Кейльман спросила меня в комментариях: как бы я проживала любовь, если бы она была не взаимной?\n\nСегодня я весь день качаюсь в колыбели каких-то очень сладких внутренних ощущений присутствия этой моей любви во мне, и я вспоминаю слова кажется Лены Дегтярь. Она сказала: Педро случился не только с тобой, он случился с Димой, и вообще со всеми нами. И сейчас, если оглянуться на все, что происходило, то кажется что в этой истории много участников, но на самом деле все дело в нем и в этой встрече.\n\nУ меня есть хороший пример, Катя, чтобы ответить на твой вопрос. Когда мне было 15 лет, я встретила человека, с которым у меня случилась мнгновенная любовь такой силы, что меня сбило с ног. Я спела ему свою песню в кругу музыкантов регги фестиваля, куда я попала абсолютно случайно, просто шатаясь по Анапе, и он даже записал ее на портативную студию. И еще он подарил мне кольцо, которое когда-то ему подарил Олди. И он сказал мне: у тебя все получится. Он был музыкантом, художником, его рисунки - это татуировки на моих руках, самые мои первые. У него была жена и ребенок, это была всего одна встреча, всего несколько часов вместе - у нас ничего не было, за что надо было бы исповедоваться. Но эта любовь и эта встреча изменила все. Я написала о нем десятки песен, я сделала группу, и все что было после - начинается с него. У меня был его номер, по которому я никогда не позвонила. Но я прожила каждую каплю этой любви, и она до сих пор живет во мне, и всегда будет жить.\n\nТак вот, иногда момент встречи несет в себе весь потенциал будущего, и я его так и ощущаю. И момент, когда я встретила Педро, был таким же. Я ощутила всю эту силу грядущих перемен, и я не знала, о чем это - взаимно ли это, будем ли мы вместе, или это про большую боль и испытания. Я ощутила масштаб, и дальше все только разворачивалось и открывалось. Моя любимая фраза в 12 шагах: «мы молились лишь о знании Его воли». То есть все что происходит с нами - это воля Бога, но ясность об этом, о том, что это значит - не самая простая штука. У меня интересным образом работает вся система, я знаю следующий шаг и действую из этого знания. У меня нет вариантов и выборов: так или так. Я говорила Педро: «У меня нет вариантов НЕ выбрать тебя. Я выбираю тебя всем своим существом. Это сильнее всего. Но если у тебя есть варианты и выборы - я приму любой».\n\nВ моменты после тантры многие говорили, что вообще это все возможно случилось именно для Димы. Это открыло его сердце, он изменился, у него даже черты лица стали мягче. У него наладился контакт с важными людьми, он вообще осознал ценность жизни. Педро случился с ним в первые недели даже больше, чем со мной. Дима взял от этой практики все. Он ехал на тантру, чтобы оживиться. И именно практика с Педро стала самой оживляющей за всю историю.\n\nУ меня не было ясности, выбирают ли меня, и как меня вообще можно выбрать со всем моим багажом, хаосом, я в этом плане реалист. Мне кажется, что если он выберет меня - это будет чудом, и что это мало возможно. Мне кажется, что я люблю сильнее. Мне кажется, ему не нужны такие проблемы. Но потом, когда в каждом контакте я ощущала, что это не только мое, это НАШЕ - любовь только раскрывалась, показывала новые и новые грани.\n\nМне так хочется больше писать о нем - о его энергии, которая похожа на божественный свет с пузырьками шампанского) Как все танцует от его присутствия, как все люди как будто подпитываются от этого источника - и взрослые, и дети, и конечно же совсем особенным образом подпитываюсь я. Я чувствую себя и маленькой девочкой, и любимой женщиной, и чувствую себя шаманкой или богиней разрушения, которая может развернуться в полную силу, и тут я ему абсолютно по плечу. И еще это мой идеальный тантрический партнер. Я хочу с ним практиковать тантру, и не хочу меняться партнерами, я чувствую безопасность, я чувствую себя выбранной, у меня нет страха и поэтому нет желания бросать вызов этому страху, в плане экспозиции к ревности. Я тут вообще в доверии и расслабленности, что бы ни случилось.\n\nИ еще я наблюдаю за кругами по воде - за тем, как наша встреча уже отражается в мире вокруг.\n\nReactions: ❤1097 ❤‍🔥323 😍89 👍37 🔥37 💘22 💊13 🥰10 🤩6 😁1\n"}, {"path": "data/daily2025_export/posts_md/2024-11-28__1018__пока_немножко_прибитом_состоянии_пытаюсь_наполнять_свои.md", "source": "Daily2025", "date": "2024-11-28", "filename": "2024-11-28__1018__пока_немножко_прибитом_состоянии_пытаюсь_наполнять_свои", "content": "# 2024-11-28 — пока немножко прибитом состоянии пытаюсь наполнять свои\n*Datetime*: 2024-11-28T14:51:38+08:00\n*From*: Olymarkes Daily\n*Message ID*: 1018\n\nПока я немножко в прибитом состоянии, и просто пытаюсь наполнять свои дни временем с детьми, друзьями, спортивными активностями и любовью к себе. Но все равно много всяких мыслей у меня по поводу всего, что происходит; Я пытаюсь заземляться, но все равно ощущение будто меня вынесло в другую реальность - она чуть похожа на предыдущую, но все друг", "full_content": "# 2024-11-28 — пока немножко прибитом состоянии пытаюсь наполнять свои\n*Datetime*: 2024-11-28T14:51:38+08:00\n*From*: Olymarkes Daily\n*Message ID*: 1018\n\nПока я немножко в прибитом состоянии, и просто пытаюсь наполнять свои дни временем с детьми, друзьями, спортивными активностями и любовью к себе. Но все равно много всяких мыслей у меня по поводу всего, что происходит; Я пытаюсь заземляться, но все равно ощущение будто меня вынесло в другую реальность - она чуть похожа на предыдущую, но все другое.\n\nНаверное, этих ощущений добавляет еще новый дом. Я уезжала из одного места, где мы прожили вместе год, а вернулась в другое - где мы будем жить другим составом. Дом этот правда много для меня значит. Подарок, который я смогла сделать и себе, и своей семье. Что-то очень заслуженное и результат усердной работы. У меня вообще к себе нет вопросов, я супер молодец. И наверное вообще стараюсь по жизни жить так, чтобы и у близких ко мне не было вопросов. Моя независимость - это моя броня. Некая компенсация. И она часто играет со мной злую шутку. В отношениях я очень мягкая и ничего не требую, и все что мне нужно я всегда стараюсь дать себе сама.\n\nМоя любимая история прошлого года: 8 марта мне никто не подарил цветов. Мне было обидно, поэтому 9 марта я попросила парней: я понимаю что может быть неудобно и все такое, но мне было бы приятно получить цветы в течение этого месяца, потому что чувствую что у меня есть потребность, я хочу через это почувствовать любовь и заботу. И плакать я начала где-то 9 апреля, когда не дождалась своих цветов. А еще мое сердце разбила история, когда я узнала что один из моих любимых подарил цветы другой девушке по чистому импульсу, без напоминаний и просьб. Конечно, мне бы хотелось быть тем человеком, о котором хочется заботиться, которого хочется радовать, поддерживать. Но я сама такой партнер, сильный, на которого можно опереться, рядом с которым можно расслабиться и делать то, что ты хочешь. В этой свободе люди раскрываются и показывают то, что внутри. Потому что я верю что истина раскрывается, когда у тебя нет внешней нужды и мотивации. Что ты будешь делать, если от тебя все отстанут? Если ты сможешь сделать то, что реально хочешь? Будешь ли ты работать на этой же работе, например? Будешь ли ты так же заботиться о близких? Я имею счастье заниматься только тем, что я выбираю сердцем. И хочу этого для близких. Поэтому ничего от них не жду и не требую. И очень редко прошу. И когда все таки прошу и на мою просьбу происходит ничего - это разбивает мне сердце.\n\nИстория с расставанием с Димой напоминает мне песню «Нейт Диаз».\n\nНе сокращай расстояние, оставайся холодным\nОпереди удар в сердце ножом\nБыл не до конца откровенен\nНе до конца с тобой, не до конца погружён\nНе выходил из комы, подавлял крик счастья\nГоворил о нас всегда вскользь\nВедь каждый уже был к кому-то привязан\nТипа слишком рано играть по-взрослому\nТвои чувства притуплены, ревность наиграна\nДистанция - это моя броня\nТы была таблеткой экстази под языком\nИ в последний миг я зассал принять\nОпасаясь, что придётся трезветь\nБуднего дня искал подвох в каждом жесте\nНадо было проебать тебя, как рукопись романа\nИ о его качествах всем напиздеть\n\nЭто все как будто текст про нас. Даже вчера слушала кусочек из их подкаста с Думиком, и там вообще про отношения не слышу ни капли тепла, все про какую-то «конструкцию». И вот только после расставания как будто случилось чудо. Неужели надо расстаться с человеком, чтобы услышать, как много ты для него значишь? Чтобы он начал наконец называть тебя по имени? Чтобы он сказал, что хочет детей с тобой и готов для этого на все? Благодарить за что-то теплое и ценное, что ты все время пытался дать? Почему надо расстаться с человеком, чтобы почувствовать себя увиденным? Почему когда все это происходит - уже не очень то и надо, да и слишком поздно?\n\nЯ не могу сказать, что я страдала, хоть мне часто было больно. Я выбирала счастье и создавала его сама. И мне грустно, что все эти слова и действия я не могу телепортнуть в то время, когда это мне было нужно. Но может быть эта история поможет кому-то ценить настоящее, а не только тогда, когда ты уже все потерял.\n\nLinks:\n- https://www.youtube.com/watch?v=ZViNVkUW8-4\n- https://www.youtube.com/watch?v=6PFhXrT6QPE&t=20s\n\nReactions: 💔2460 ❤996 🕊147 😢75 😭70 👍63 💯41 🙏36 🤗21 😍6 🤔6\n"}, {"path": "data/olydaily_export/posts_md/2024-10-20__921__жизнь_засосала_прямом_переносном_смысле.md", "source": "OlyDaily", "date": "2024-10-20", "filename": "2024-10-20__921__жизнь_засосала_прямом_переносном_смысле", "content": "# 2024-10-20 — жизнь засосала прямом переносном смысле\n*Datetime*: 2024-10-20T20:24:30+08:00\n*Message ID*: 921\n\nЖизнь засосала) в прямом и переносном смысле.\n\nКогда долго не пишешь, накапливается ту мач и не знаешь что выгрузить. Что радует, что беспокоит, что произошло сегодня/вчера/за неделю. О чем думала, что чувствовала.\n\nЯ думала о том, какие качества от меня наследуют дети. Вадим предложил свой вариант: Ежи - любовь к друзьям движухе и невозможность сидеть на месте, при этом способность вс", "full_content": "# 2024-10-20 — жизнь засосала прямом переносном смысле\n*Datetime*: 2024-10-20T20:24:30+08:00\n*Message ID*: 921\n\nЖизнь засосала) в прямом и переносном смысле.\n\nКогда долго не пишешь, накапливается ту мач и не знаешь что выгрузить. Что радует, что беспокоит, что произошло сегодня/вчера/за неделю. О чем думала, что чувствовала.\n\nЯ думала о том, какие качества от меня наследуют дети. Вадим предложил свой вариант: Ежи - любовь к друзьям движухе и невозможность сидеть на месте, при этом способность все успевать и даже сделать домашку за неделю за пару часов. Мирон - творчество, предпринимательский ум и чувствительность. «А Рома… твою агрессию пожалуй!» . Ржу, на самом деле Рома - это прям Вадим, но с моей импульсивностью)))\n\nЯ чувствую, что у меня очень много энергии и на этом вообще все строится. У меня больше энергии чем у всех, кого я знаю. И она выплескивается на разные сферы жизни - сколько держать процессов, проектов, людей в управлении - это оказывается не все могут, даже если им дать это и сказать: ну все, действуй. Так же не все могут генерить идеи, создавать продукты, а еще долго работать с ними, улучшать, а не бросать что-то после первых сложностей.\n\nОткуда это у меня - фиг вообще знает. В какой момент вызрело, что повлияло - я не могу сказать. Но 100% трезвость стала переломным моментом. Я не говорю, что у всех так, но именно у меня употребление и обслуживание своего внутреннего демона съедало всю энергию, которая рвалась наружу. Мне было сложно оседлать этого дракона и научиться на нем летать, но вот сама трезвость и 12 шагов в этом помогли.\n\nЯ смотрю даже на серфинг, как тут проявляется и раскрывается мой характер, как я взаимодействую со сложным, со страхом, с умением анализировать, с эмоциями - это так интересно себя через это осознавать. Во мне много нейтральности, умения не думать ни хорошо ни плохо о явлениях, а скорее рассматривать их бытие с разных сторон.\n\nЧувствительность моя - это про грустить о мелочах или о том, чего я не могу изменить. О людях, которые не рядом, о тех, с кем я в ссоре.  Что я ценю каждый день? То, как мои близкие счастливы и я могу быть свидетелем маленьких моментов этого счастья. И еще я очень люблю индонезийцев. Я просто люблю смотреть как они живут и работают и отдыхают.  Все остальное - галочки, галочки, галочки на чек листе. Мне говорили когда-то получишь диплом, снимешь квартиру, станешь самостоятельной - вот тогда радоваться можно. Потом говорили что надо выйти замуж, родить, сделать бизнес. Потом говорили что надо разные источники дохода. Потом говорили что надо понять, что ты сам хочешь на самом деле. Потом стали говорить, что нужен какой-то другой паспорт, и вот тогда можно будет радоваться\nПодвох сразу был понятен, но я подумала, что не буду бунтовать против галочек. И правда, еще ни разу не пожалела о достигнутом, и о том, что в процессе получалось радоваться, и не откладывать радость на потом.\n\nЖизнь такая красивая и такая хрупкая. Хочется успевать радоваться каждый день, иногда вопреки всему даже. Такое вот у меня сегодня родилось.\n\nReactions: ❤890 ❤‍🔥170 🔥71 🐳30 👍19 🍓5 ✍4 🥰4 🌚2 🕊2\n"}, {"path": "data/olydaily_export/posts_md/2024-09-28__858__йоге_думала_такоооой_пост_вам_напишу_после.md", "source": "OlyDaily", "date": "2024-09-28", "filename": "2024-09-28__858__йоге_думала_такоооой_пост_вам_напишу_после", "content": "# 2024-09-28 — йоге думала такоооой пост вам напишу после\n*Datetime*: 2024-09-28T23:40:29+08:00\n*Message ID*: 858\n\nНа йоге думала - такоооой пост вам напишу. После йоги стало лень) но я собралась.\n\nТема такая:\n\n«как я поняла, что я хорошо выгляжу, но я все равно лох»\n\nС 2012 по 2016 год я фигачила тренировки секты и классно выглядела, и вроде бы была в супер форме. Но за это не дают медалей и ни в какое атлетическое достижение это не конвертируется, хотя однажды я простояла в планке 20 минут на ", "full_content": "# 2024-09-28 — йоге думала такоооой пост вам напишу после\n*Datetime*: 2024-09-28T23:40:29+08:00\n*Message ID*: 858\n\nНа йоге думала - такоооой пост вам напишу. После йоги стало лень) но я собралась.\n\nТема такая:\n\n«как я поняла, что я хорошо выгляжу, но я все равно лох»\n\nС 2012 по 2016 год я фигачила тренировки секты и классно выглядела, и вроде бы была в супер форме. Но за это не дают медалей и ни в какое атлетическое достижение это не конвертируется, хотя однажды я простояла в планке 20 минут на дне рождения московского филиала и мне подарили брокколи.\nТогда мне захотелось понять, могу ли я после сектовской базы сделать еще куда-то шаг. И мне хотелось доказать (кому?), что я не просто выгляжу спортивным человеком, что я им являюсь.\n\nТогда я занялась триатлоном. И это на самом деле было охуенно. Во-первых можно сбежать из дома и от всего на легальные 2-3 часа в день. Во-вторых я прокачала сердце, научившись бегать на низком пульсе часами. Вот в секте мы такого не делаем, и это мало чем можно заменить: час-два-три в неделю на пульсе 130.\n\nЯ пробежала 5 или 6 марафонов (2 в мск, 2 в Нью-Йорке, 1 в Тель Авиве, и кажется было что-то еще но не могу вспомнить), переплыла Босфор, сделала 3 половинки Iron Man, а еще кучу маленьких, средних и длинных забегов - и эстафеты, и городские, и трейлы.\n\nПериод жизни был классный, и там было так много пиздатых моментов с друзьями, так много тренировок по всему миру, часто тоже с друзьями, путешествий с целью и с приключениями - по этому я скучаю. По самой дисциплине - скорее нет, было весело но больше не хочется.\n\nПо итогу достижением стало то, что даже бросив триатлон и бег, я осталась в хорошей форме. Я видела столько людей, которые продолжают это фигачить, только чтобы иметь тело атлета. Я бы точно не смогла продолжать это все только ради формы. Хорошо, что есть способы менее жесткие)) Но кому-то нужна глобальная цель и система, и чувство, что ты упахался.\n\nСейчас у меня новый период торча. Серфинг это конечно пиздец. Боюсь, что с этого я долго не слезу. Тут чаще всего приходится новых друзей заводить))) старые, как в бег, не втягиваются - очень высокий порог входа, и по смелости и по первым шагам - надо искать место, учителей, пробовать, ждать условия - оч сложно.\n\nСпецифическая форма, как и с триатлоном, набирается в процессе. Ни что не подготовит тебя к тому, чтобы ты лежал в прогибе и греб то быстро то медленно несколько часов подряд. Только лежать и грести. Но при этом когда ты спортивный, все происходит быстрее х10. Тут помогает мобильность суставов, растяжка, баланс, координация. Тут гораздо больше пригождается все то, чем я занималась 12 лет в секте - и я рада, потому что в триатлоне были полностью новые активности, и по длительности и в плане цикличных видов спорта, которыми я не занималась до этого.\n\nВ серфинге огромная часть спорта это pattern recognition (когда ты выбираешь волну, свое место для старта, скорость и тд)  - и это так похоже на то, что лежит в основе моей продуктовой работы. Я вижу, как что-то работает, а что-то нет, и я часто вижу то, что не видят другие. Не интуиция, а насмотренность. И еще я знаю, что делать. Тут в серфе ты смотришь и принимаешь решения - и сразу получаешь результат и дофаминчик и сератониновый коктейль, и желание повторить скорее.\n\nВсе что нужно - это сил на еще много попыток ( и тут спасибо триатлону, я навсегда запомнил
