я от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\n\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом.\n\nReactions: ❤33 👍10 🔥3 ❤‍🔥2\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2021-05-02__130__бедными_богатый_дяденька_дал_нам_микроавтобус_поехали.md", "source": "Vi Vse Nepr", "date": "2021-05-02", "filename": "2021-05-02__130__бедными_богатый_дяденька_дал_нам_микроавтобус_поехали", "content": "# 2021-05-02 — бедными богатый дяденька дал нам микроавтобус поехали\n*Datetime*: 2021-05-02T03:49:49+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 130\n\nМы были очень бедными, но богатый дяденька дал нам микроавтобус, чтобы мы поехали в тур по Европе. Тогда я нашла сайт «Couchsurfing», каким то чудом мы умудрялись вписываться вшестером - то в маленькую квартирку Дэвида в Генуе (туда мы приехали специально, чтобы поклониться Генуэзской консерватории), то в горный домик хоббита где-то на ок", "full_content": "# 2021-05-02 — бедными богатый дяденька дал нам микроавтобус поехали\n*Datetime*: 2021-05-02T03:49:49+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 130\n\nМы были очень бедными, но богатый дяденька дал нам микроавтобус, чтобы мы поехали в тур по Европе. Тогда я нашла сайт «Couchsurfing», каким то чудом мы умудрялись вписываться вшестером - то в маленькую квартирку Дэвида в Генуе (туда мы приехали специально, чтобы поклониться Генуэзской консерватории), то в горный домик хоббита где-то на окраине Вероны. Хозяином был очень странный парень, мы приехали уставшие до смерти, искали дорогу во тьме, а утром обалдели - мы были на вершине горы, казалось, так просто быть не может. Обычно в Европе ты видишь туристические маршруты, а Каучсерфинг заставляет тебя сворачивать с протоптанных тропинок, оказываться в странных местах.\n\n Мы покупали самый старый и дешевый сыр - твердющий пармезан, помидоры - и этим питались. Иногда богатый дяденька из России отправлял нам еще немного денег, и мы бежали за едой в супермаркет. На концерте в Швейцарии мы получили хороший гонорар, но очень быстро потратили все на еду. Мы запомнили, что надо было выключать воду в душе, когда намыливаешься - там нас поспать пустила хорошая женщина, и было видно, что она переживает - какой после нас придет счет на воду.\n\nКогда ты беден, мир раскрывает тебе объятья. Он полон взаимопомощи, надо только нырять в него щучкой - так я путешествовала одна по Индии, когда ты без денег - с тебя нечего взять, но тебе всегда есть, что дать. Только тебе всегда кислорода на один вдох. Денег на один месяц аренды. Только на билет в одну сторону.\n\nНадо обязательно что-то делать, когда у тебя нет денег - не чтобы заработать, а чтобы понять, как в мире все устроено, что к любой вещи можно подойти с двух сторон, что материя изгибается во всех плоскостях. Как будто от мира денег тебя отделяет прозрачная перепонка. Ты смотришь на их интерьеры, на технику,  на свободу и непринужденность - как они кидаются суммами, которые для тебя были бы спасением и исполнением мечты, и свободой - но это не твое.\n\nТак мы познакомились с Феликсом из Риги. Мы пришли на группу, и там сидели два человека - потом он подвез нас на крутой тачке и дал 20 лат. Кажется, это было очень много для нас. Просто так бац - и дал денег.\n\nМне иногда пишут: ты обесцениваешь свои достижения. Но я чувствую не так. Как будто перепонка надорвалась и меня всосало в мир денег, я оказалась на другой стороне, где вся эта техника, интерьеры, суммы - это все произошло так спонтанно и неожиданно, как если бы на моем месте была Саша Соколова. Как она, судя по рассказам, снимала что-то в Питере, в районе Коломны. Так и я.. Занимала, чтобы заплатить аренду. Она делала, что любила, умела и могла. Такие люди не могут иначе. И вот у меня так же - я просто делала то, что умела, любила и могла. И сейчас так же - просто Боженька как будто выбирает, кого на какую сторону поместить - труда и старания у меня может быть меньше чем у того, кому его дело не приносит денег. И я это знаю. Поэтому я всегда тянусь к другому миру.  К тем, кто по другую сторону.\n\nБольше всего эмоций от недвижимости я чувствую в квартире Шапо. Человек, у которого появился свой дом. Один единственный. Самый любимый. Человек с пятью домами будет более бездомным чем тот, у кого дом один.\n\nЯ часто слышу от людей, что они переживают трансформации и становятся лучше, находят озарения. Я же вообще не меняюсь - мне кажется я такая статичная, что пиздец. Просто когда я начала писать 12 шагов, я перестала ебать себе мозги в связи с тем, что я не вышла - по своим собственным меркам или по заданной родителями планке - и как-то проще стала относиться к своим недостаткам. Но они никуда не делись. Более того, если я и трансформируюсь - то только в худшую сторону. Меньше читаю, больше втыкаю в телефон, совсем не хочу получать образование, мало пишу. Но это не так страшно, потому что я и до этого ничего особенного не делала. Мне кажется, что я выстраивала жизнь, как будто соединяя кусочки детской железной дороги из Ikea, уровень сложности - начальный, игрушка от 0 до 3 лет.\n\nReactions: 👍12 🔥5 💊1\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2020-11-22__115__антон_многое_открывал_кажется_рассказал_плите_собираются.md", "source": "Vi Vse Nepr", "date": "2020-11-22", "filename": "2020-11-22__115__антон_многое_открывал_кажется_рассказал_плите_собираются", "content": "# 2020-11-22 — антон многое открывал кажется рассказал плите собираются\n*Datetime*: 2020-11-22T22:57:06+08:00\n*Message ID*: 115\n\nАнтон многое мне открывал. Кажется, это он рассказал мне, что на «Плите» собираются неформалы - и что-то в этом меня очень задело. Мне так захотелось стать частью этой тусовки «не таких, как все», что в один день я пришла из школы, закинула рюкзак в ящик для картофеля, который стоял у нас в подъезде, взяла проездной и отправилась на трамвайную остановку.\n\nМеня потряхив", "full_content": "# 2020-11-22 — антон многое открывал кажется рассказал плите собираются\n*Datetime*: 2020-11-22T22:57:06+08:00\n*Message ID*: 115\n\nАнтон многое мне открывал. Кажется, это он рассказал мне, что на «Плите» собираются неформалы - и что-то в этом меня очень задело. Мне так захотелось стать частью этой тусовки «не таких, как все», что в один день я пришла из школы, закинула рюкзак в ящик для картофеля, который стоял у нас в подъезде, взяла проездной и отправилась на трамвайную остановку.\n\nМеня потряхивало от страха. Я еще никогда не пользовалась транспортом без взрослых. Мне казалось, что папа в любой момент может проехать мимо меня на машине, и я торопила трамвай, который все не шел. Меня научили спрашивать у взрослых дорогу, и как-то я узнала, какой именно трамвай мне нужен. А может быть, я села на первый попавшийся, и мне просто повезло.\n\nВ трамвае я ехала пригнувшись, потому что боялась, что папа будет проезжать мимо на машине, и увидит меня в окно, и выдаст мне на орехи. Но все прошло благополучно - я вышла на трамвайной остановке между памятником Ленину и сквером. Этот сквер и называли «плитой». По периметру обычно стояли лотки с неформальскими аксессуарами - браслеты, банданы и торбы с названиями групп, сережки для пирсинга и многое другое, что при правильном применении создавало визуальное отличие - делало тебя не обывателем, а неформалом.\n\nУ памятника Ленину все время шла вялотекущая демонстрация коммунистов с красными флагами, мегафонами и плакатами. Никто не обращал на них внимание, никто не разгонял и уж тем более не воспринимал их как угрозу действующей власти. Это сейчас на контрасте все эти несанкционированные митинги и шествия выглядят даже как-то героически - тогда свобода была во всем, и для нас, детей, она была не в новинку, как для наших родителей. Для нас свобода была данностью. Все эти лотки и палатки с торговлей всем на свете, субкультурность, ставшая разрешенной и массовой - все это родилось у нас на глазах, но быстро стало обыденным - мы совсем не ценили этой свободы, а родители были только рады поменять все это на какую-то уверенность в завтрашнем дне.\n\nЯ стояла в центре сквера и от адреналина у меня срывалось дыхание, я видела группку «неформалов» и понимала, что мне надо подойти к ним и познакомиться - ведь это и было моей целью. Мне было страшно, что меня отвергнут и не возьмут к себе - это уже происходило со мной в школе, и если произойдет и здесь - это бы разбило мне сердце. Но я решила все-таки сделать это: выдохнула и подошла.\n\nСпич мой был какой-то максимально наивный: я сказала, что идентефицировала их, как неформалов, и хотела бы стать частью их тусовки. Девушка, к которой я обращалась, повела себя достаточно снисходительно - спросила, как мое «погоняло» - и когда узнала, что у меня его нет, предложила ряд своих вариантов. Я запомнила только «Бритвочка» - кажется, на нем мы остановились.\n\nМне сразу было предложено выпить немного водки и пойти на «Башню» - заброшенная гигантская телевышка в центре Екатеринбурга, которую снесли несколько лет назад - долгие годы она была символом города, возвышаясь над центром - пустые окна, торчащая арматура и еле различимые фигуры смельчаков, которые залезали на двухсотметровую высоту по внешней лестнице или по арматуре или по наружной лестнице из скоб. Однажды, и я окажусь там. Но не в этот раз.\n\nМы только дошли до башни, я увидела ее огромное основание, утонувшее в зарослях сорняка, в рисунках и в мусоре - мне стало страшно - а вдруг меня изнасилуют? А вдруг эти люди плохие? Но самое страшное - это если папа узнает и будет ругаться. Я попрощалась и побежала в сторону дома.\n\nReactions: 👍4\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2020-11-18__98__каталась_велосипеде_горы_огромными_камнями_приходила_домой.md", "source": "Vi Vse Nepr", "date": "2020-11-18", "filename": "2020-11-18__98__каталась_велосипеде_горы_огромными_камнями_приходила_домой", "content": "# 2020-11-18 — каталась велосипеде горы огромными камнями приходила домой\n*Datetime*: 2020-11-18T00:21:49+08:00\n*Message ID*: 98\n\nЯ каталась на велосипеде с горы с огромными камнями, приходила домой с ободранными коленками, придумывала «мороженное» из жимолости и ревня. Сначала ревень надо было аккуратно очистить, вуаля - и можно наслаждаться. С жимолостью было сложнее: откусить верхнюю часть ягоды, аккуратно выдавить содержимое через дырочку, облизывать, как эскимо. Потом съесть кожурку от ягод", "full_content": "# 2020-11-18 — каталась велосипеде горы огромными камнями приходила домой\n*Datetime*: 2020-11-18T00:21:49+08:00\n*Message ID*: 98\n\nЯ каталась на велосипеде с горы с огромными камнями, приходила домой с ободранными коленками, придумывала «мороженное» из жимолости и ревня. Сначала ревень надо было аккуратно очистить, вуаля - и можно наслаждаться. С жимолостью было сложнее: откусить верхнюю часть ягоды, аккуратно выдавить содержимое через дырочку, облизывать, как эскимо. Потом съесть кожурку от ягоды - как вафельный стаканчик от рожка. Жимолость и ревень до сих пор мои любимые дачные продукты.\n\nДачным праздником для меня были поездки на рынок «Арамильский привоз» - там была сокровищница всякой бесполезной фигни, пластмассовых игрушек - я помню, что бабушка все покупала, но приходилось выпрашивать. Дедушка вел машину, а бабушка всегда комментировала, «командовала», как у нас это называлось. Папа постоянно говорил, что она - как героиня Фаины Раневской «Муля, не нервируй меня!» - и правда, очень похожа.\n\nПо пути с «Привоза» обратно на дачу я выискивала глазами цыган с табунами лошадей. И сильно-сильно загадывала желание, чтобы у меня тоже случился свой цыган и обязательно с конями.\n\nДача - это Лев Кассиль. «Кондуит и швамбрания», «Будьте готовы, ваше высочество!», его книги про войну и мальчишек. Я зачитывалась, и забывала о далеком желанном городе, о дворе. Дача становилась моим миром: особенно пыльный второй этаж, на который так редко ступала чья-то нога.\n\nОднажды мы с соседкой Оксаной играли в королев. По очереди мы сидели на стремянке и «повелевали». Я первый раз в жизни услышала щелчок в голове: «О, это максимально моё». В тот же момент мне стало смешно: королевой в этой жизни мне точно не светит стать.\n\nЕще однажды я играла топором. Изо всех сил размахивалась и втыкала в поленницу. И вот, как в замедленом кино я вижу, как топор летит в моё колено: я уже понимала, что будет страшное количество кровищи и ужасная боль, и знала, что у меня есть немного времени болевого шока - совсем недавно я ободралась на велосипеде, но боль пришла не сразу - я знала, что так будет и здесь, но последствия топора в колене будут серьезнее.\n\nА потом как будто произошла монтажная склейка: я стою, топор в руке и колено абсолютно целое.\n\n - Ого. - подумала я. В очередной раз я знала, что это не та история, которую можно рассказать, и которой поверят - но я в этот момент твердо поверила, что меня защищают какие-то высшие силы, и нельзя этим злоупотреблять. Всю жизнь я буду отмечать про себя эти моменты и всегда буду благодарить высшие силы, защищающие меня, за те моменты, когда они отвели от меня беду.  И в тот момент я положила топор и пошла в дом.\n\nБабушка любила меня и старалась контролировать кажжый мой шаг и пугать меня опасностями, которые подстерегают меня на каждом шагу,  а мне очень хотелось личного пространства и свободы. Проходили недели, и я начинала ужасно скучать по папе - он ассоциировался у меня со свободой, с тайнами ночного города, с какими-то интересными взрослыми тусовками, которые манили меня. Я сидела у телефона и ждала звонка, а потом, когда папа должен был приехать, я могла провести у окна весь день, мечтая, чтобы следующая машина оказалась нашей. И вот, я прыгала на заднее сидение, и машина везла меня в мой мир. Какой он? Изменился ли он? Существует ли он до сих пор, или все изменилось за ту вечность, которую я провела на даче?\n\nЯ не помню, в какой момент я поняла, что я влюбилась. Но я помню лето, свою кровать на Фрунзе 62, двор, который вдруг стал ощущаться по-особенному. Моя компания, к которой я тянулась, наше время вместе - все стало тягучим, как карамель. Мысли стали такими щекочущими, мир постепенно менялся - одинокая качель во дворе, скамейки, кусты вокруг дома напротив - все наполнялось этой упругой энергетикой нового чувства, и я не могла понять, откуда оно исходит и куда направленно.\n\nReactions: ❤7 👍5\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2020-11-17__92__потом_случилось_страшное_одна_девочек_элитной_тусовки.md", "source": "Vi Vse Nepr", "date": "2020-11-17", "filename": "2020-11-17__92__потом_случилось_страшное_одна_девочек_элитной_тусовки", "content": "# 2020-11-17 — потом случилось страшное одна девочек элитной тусовки\n*Datetime*: 2020-11-17T01:38:59+08:00\n*Message ID*: 92\n\nПотом случилось страшное. Одна из девочек из элитной тусовки обратила на меня внимание, но в каком-то негативном ключе. Когда на меня не обращают внимание - это грустно, но не страшно. Когда меня недолюблтвают - вот это действительно мой пунктик. Моему брату, например, было плевать на мнение других. Я же наоборот всегда сосредотачивалась всеми мыслями на моем недоброжелате", "full_content": "# 2020-11-17 — потом случилось страшное одна девочек элитной тусовки\n*Datetime*: 2020-11-17T01:38:59+08:00\n*Message ID*: 92\n\nПотом случилось страшное. Одна из девочек из элитной тусовки обратила на меня внимание, но в каком-то негативном ключе. Когда на меня не обращают внимание - это грустно, но не страшно. Когда меня недолюблтвают - вот это действительно мой пунктик. Моему брату, например, было плевать на мнение других. Я же наоборот всегда сосредотачивалась всеми мыслями на моем недоброжелателе и не могла думать о чем-то другом. Мне казалось, что я в опасности. Что человек, который меня недолюбливает, тоже все время думает обо мне и о том, как испортить мне жизнь.\n\nМарина носила очки, хвостик, еще она была младше нас всех на год, но при этом чувствовала она себя очень уверено. Как-то раз я пришла к маме и рассказала, что Марина меня не любит и мне тревожно. Мама предложила подарить девочке подарок. Так мы и сделали: пошли в ближайший ларек Роспечати и купили пластмассовое кольцо с пластмассовым алмазиком. Марина подарок приняла, я радовалась заключенному перемирию, но потом что-то произошло, и она снова начала меня задирать какими-то обидными словами. И я разбила ей нос.\n\nСо мной пришла разбиратся ее старшая сестра. Конечно, я цепенела перед старшими, и мне не хватило сил объяснить, что она сама виновата. К тому же тот, кто срывается на насилие не может говорить о справедливости - надо уметь постоять за себя словами. Я не умела.\n\nВ следующий раз я разбила Марине очки. Она шла передо мной на физкультуре и повторяла что-то обидное. И я психанула снова. Очки упали, весь класс ползал и искал отлетевший винтик, я смотрела на это и чувствовала себя очень плохой. Я чувствовала, что сейчас Марина - жертва, весь класс - спасители, а я - насильник, и это было полное поражение. Уже тогда я начала понимать, что разбитые очки врага не могут быть победой, победа - это если бы все защищали меня, искали бы мой потеряный винтик и жалели меня. Я очень хотела быть на ее месте, чтобы все были на моей стороне.\n\nМне постоянно было стыдно. Часто чувство, что я какая-то не такая, сменяла злость. Я помню, как шла из школы домой, а за мной шли две мамы девочек из моего класса:\n\n - Хорошая девочка, аккуратная. И колготочки всегда чистые. - что-то такое они обо мне говорили, может быть, хотели подбодрить между делом, а может быть просто обсуждали - но я хотела провалиться под землю, потому что на колготках моих вечно были дырки, за всю жизнь у меня ни разу не было даже хиленькой косы, только хвостик, и любые комплименты я воспринимала скорее как издевательство, потому что никто не хвалил меня за то, в чем я действительно была хороша. Никто не знал, и я сама не знала.\n\nЭто сейчас я понимаю, что в детстве я просто не могла чувствовать себя реализованной - слишком высокий у меня был запрос на качественную обратную связь, на одобрение - это должно было быть глубокое одобрение от человека, который видит мою суть. Мне хотелось встретить учителя, которому будет интересен мой внутренний мир, но я не была интересна. Меня надо было раскрыть, со мной надо было говорить - а кому может быт интересен отдельный ребенок в коллективе из 30, из 120 детей.\n\nШкола у нас, действительно, была сильная. Нам говорили об этом каждый день, и на переферии, видимо, для отстройки от чего-то всегда маячила соседняя - 175ая школа.  Как только что-то шло не так, учитель мог ввернуть:\n\n - Сложно? Ну иди в сто семьдесят пятую, там легко.\n\nИ так - по любому поводу. Пойти учится туда - это значило, признать поражение по жизни. Стать человеком второго сорта. На этом ощущении исключительности строилось очень многое.\n\nОднажды в нашем классе случилось оживление. Наша учительница объявила: «мы едем на Кипр!».  Конечно, едут те, кто запишется и оплатит до определенной даты.  «Поговорите с родителями».\n\nReactions: ❤4 👍3\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2020-11-15__72__бойфренда_диму_был_сыном_сапожника_почему-то_было.md", "source": "Vi Vse Nepr", "date": "2020-11-15", "filename": "2020-11-15__72__бойфренда_диму_был_сыном_сапожника_почему-то_было", "content": "# 2020-11-15 — бойфренда диму был сыном сапожника почему-то было\n*Datetime*: 2020-11-15T02:21:10+08:00\n*Message ID*: 72\n\nбойфренда Диму, он был сыном сапожника (почему-то это было важным) и еще немножко цыганенком (это был плюс). Я мечтала выйти замуж за цыгана, чтобы у меня было много лошадей. Я так любила лошадей, что меня трясло, когда я их видела. С Димой у нас были приятные отношения, и я постоянно думала: ну как так он со мной общается, если меня больше никто из детей не любит?\n\nКогда я то", "full_content": "# 2020-11-15 — бойфренда диму был сыном сапожника почему-то было\n*Datetime*: 2020-11-15T02:21:10+08:00\n*Message ID*: 72\n\nбойфренда Диму, он был сыном сапожника (почему-то это было важным) и еще немножко цыганенком (это был плюс). Я мечтала выйти замуж за цыгана, чтобы у меня было много лошадей. Я так любила лошадей, что меня трясло, когда я их видела. С Димой у нас были приятные отношения, и я постоянно думала: ну как так он со мной общается, если меня больше никто из детей не любит?\n\nКогда я только родилась, мы жили у папиных родителей -у бабушки Нэлы и дедушки Коли. У самых богемных из всех моих бабушек и дедушек. Потом так сложилось, что у маминой мамы (бабушки Нины) подошла очередь получать квартиру в новостройке - в одном из первых домов Ботанического района. А у папы как раз были деньги: они с друзьями с электрофака собирали электрические кофейники, и вот деньгами с этих кофейников они за квартиру расплатились.\n\nПотом дом строили, сдавали. Помню, что папа посадил у подъезда сирень, а еще - как будто сам помогал класть паркет. Помню, когда мы переехали в эту квартиру - папа мастерил шкаф своими руками. А потом я помню, как он этот шкаф сломал, когда мы оттуда уезжали.\n\nКвартира на Ботанике была слишком новой и свежей, в моих воспоминаниях там все светлое, сверкает и вкусно пахнет, восьмой этаж - близко к небу. Всегда буду любить высокие этажи. У меня своя солнечная комната, по вечерам папа рассказывает мне сказки: говорит, что из щели в шкафу ему в ухо прыгает гномик-старичок, закуривает трубку, щекочет ухо своей бородой и начинает рассказывать ему историю, а он мне перессказывает. Папа - невероятный фантазер, его сказки меня завораживают. Я до сих пор помню некоторые из них. Из окон видно кран - район только строится - и папа рассказывает сказку про крановщика.\n\nПо воскресеньям у нас генеральная уборка. Это почему-то очень важно и всегда связано со стрессом. У папиной мамы был «пунктик» на чистоте, у папы - тоже. Мама училась домоводству у своей свекрови, потому что ее мама - бабушка Нина - она журналист, ученый, хаотик, и всегда считала что порядок дома не должен забирать лишний ресурс у по-настоящему важных дел. Так мама практически ничего не умела, но очень хотела научиться.\n\nВ квартире часто были гости, у мамы с папой была компания их студенческих друзей. Я любила гостей, любила наблюдать, как взрослые веселятся, танцуют, сидят за столом.\n\nИз квартиры мы как-то быстро уехали после смерти мамы. Бабушка вдруг начала боятся, что папа отдаст эту квартиру моей новой маме Але. Нашей семье в новом составе пришлось переехать в ту пятиэтажку ближе к окраине. Ботаника, где была наша квартира - это новый район со стройками и пустырями. Алмаатинский переулок, куда мы переехали  - это уютные малоэтажные постройки, бараки, зелень кругом. Двухкомнатная квартира, которая, наверное, была тесной, но мне такой не казалось. И вот была такая фабула, что злая бабушка выгнала семью в эту тесную квартиру, а сама поселилась в новой трёшке вдвоем с дедушкой.\n\nА еще у меня есть брат, но я в то время очень редко о нем вспоминаю. Мое первое воспоминание - я сижу одна в своей темной комнате на ботанике, а папа в соседней комнате укачивает младенца, кормит его. Папа - один с двумя детьми. Я хочу поиграть в надувные шарики, но роняю ящик и бужу брата. Папа сильно срывается, я сильно плачу и обижаюсь. На папу, не на брата. Брат - как-то вообще на переферии сознания. Никак его не воспринимаю.\n\nВаню забрали родители моего папы и он на долгие годы стал смыслом их жизни. К нему еще чуть позже вернусь, вообще его история - это что-то отдельное, но очень важная линия в нашей семье. Но середина девяностых - это время, где его нет.\n\nТам есть только я, моя вторая мама, мой папа - офигевший, как любой взрослый в те годы, но я совсем этого не замечаю. У меня такое счастливое детство - с весенними ручейками, с рекламой несуществующих шоколадок по телевизору, с масленницей во дворе.\n\nПапа ставит машину в гараж. Гаражи стоят над каким-то болотом, там слышно лягушек, надо идти по каким-то холмам. Все это пространство в Екатеринбурге сейчас застроено домами, и мне сложно представить, что на месте этих бульваров, дворов, торговых центров были пустыри, болота, выс\n\nReactions: ❤3 👍3 🕊2\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2020-06-17__63__mgk_всегда_нравился_может_вообще_не_нравиться.md", "source": "Vi Vse Nepr", "date": "2020-06-17", "filename": "2020-06-17__63__mgk_всегда_нравился_может_вообще_не_нравиться", "content": "# 2020-06-17 — mgk всегда нравился может вообще не нравиться\n*Datetime*: 2020-06-17T20:49:28+08:00\n*Message ID*: 63\n\nMGK мне всегда нравился, может он вообще не нравиться, а, девочки? Особенно, после сериала Roadies про техкрю рокгруппы. Про Меган Фокс я вообще ничего не знаю, ну и вот краем глаза поглядывала на всю эту их историю, и как многие истории я примеряла на себя. Бог один знает, что у них там в головах, но дайте мне немного пофантазировать.\n\nВот у нее трое детей. И муж такой был, класс", "full_content": "# 2020-06-17 — mgk всегда нравился может вообще не нравиться\n*Datetime*: 2020-06-17T20:49:28+08:00\n*Message ID*: 63\n\nMGK мне всегда нравился, может он вообще не нравиться, а, девочки? Особенно, после сериала Roadies про техкрю рокгруппы. Про Меган Фокс я вообще ничего не знаю, ну и вот краем глаза поглядывала на всю эту их историю, и как многие истории я примеряла на себя. Бог один знает, что у них там в головах, но дайте мне немного пофантазировать.\n\nВот у нее трое детей. И муж такой был, классный, но не MGK, конечно. Все на флоу уже пошутили в комментариях: «мда, именно так выглядит влюбленная парочка». Я думаю, что даже если они невероятно влюблены друг в друга, такое состояние сейчас у нее, не самое лучшее. Невозможно перестать себя жрать, если ты с мужиком, а не с детьми.\n\nЯ смотрю на ее лицо и мне кажется, что я читаю эти мысли: «Я хуевая мать».\n\nЯ уверена, что серийная моногамия это оптимальная система взаимоотношений для современного мира. Мы живем долго. Мы динамично развиваемся. Мы не нужны друг другу, чтобы выживать, и поэтому «быть вместе»  обуславливается только нашим взаимным желанием быть вместе.  У моего папы было три жены, и мама, и вторая мама, и Татьяна (нынешняя жена) - очень важные люди в моей жизни, и я не думаю, что детская психика страдает от каких-то определенных форм социального статуса родителей больше, чем от неглекта и взаимной холодности партнеров внутри семьи.  - и можно бесконечно так себе рассказывать, но установка: «ты должен быть со вторым родителем своих детей» очень плотно сидит внутри. И в этом плане я знаю что многим помогает полная опека над детьми, полностью (или максимально) исключить второго родителя, чтобы убрать раздражитель, потому что «главное, что дети со мной».\n\nНо вот в моих фантазиях Меган сделала правильно - ее дети сейчас с любящим отцом, она дает себе время насладиться новыми отношениями (понять, серьезны ли они) и не втягивает в эти отношения детей. Я думаю, что это тяжело, даже если ты решил, что это правильно. И счастье тут полюбас с привкусом горечи.\n\nЧто касается MGK - когда я с ним познакомилась, он был крайне обдолбан после своего концерта. Есть два типа зависимых: как Киддис, который будет уёбываться герычем до полусмерти, а потом с пятого раза пойдет выздоравливать по анонимным наркоманам да так, что на него смотришь и думаешь: ты заменил героин спортом, ну что я могу сказать, КРАСАВЧИК. Потому что торчать надо, когда ты молодой. Быть старым торчком -\nЭто зрелище жалкое.  А вот МГК как многие такие молодые торчки выглядит так, как будто так и надо. И с такими людьми можно даже забыть, что тебе 34, уйти во все тяжкие, но реальность всегда позовет обратно. Жить с зависимым, который не выздоравливает - это самая пустая трата времени, которую только может себе представить женщина после 30 лет. При этом влюбляться мы конечно при этом можем в кого угодно. Просто одна Любовь прорастает в что-то прекрасное, а другая - становится уроком на будущее. Но я верю, что любовь - это всегда трансформиющий опыт.\n\nТакие дела, котятки.\n\nReactions: 👍9 ❤5 🤮2\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2020-01-25__52__послушала_под_бег_серию_подкастов_8_историй.md", "source": "Vi Vse Nepr", "date": "2020-01-25", "filename": "2020-01-25__52__послушала_под_бег_серию_подкастов_8_историй", "content": "# 2020-01-25 — послушала под бег серию подкастов 8 историй\n*Datetime*: 2020-01-25T00:46:39+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 52\n\nПослушала под бег серию подкастов «8 историй из 90х». Я вообще историю люблю, а тут ещё и в лицах. Лучший эпизод - это про электронную музыку, конечно. «Счастье есть», я потому что застала всё это, я помню всё, как будто это было вчера. И трек Грува, и Птюч, и свободные СМИ, и телек, который хотелось смотреть.\n\nМы уникальное поколение. В свои 10 мы ", "full_content": "# 2020-01-25 — послушала под бег серию подкастов 8 историй\n*Datetime*: 2020-01-25T00:46:39+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 52\n\nПослушала под бег серию подкастов «8 историй из 90х». Я вообще историю люблю, а тут ещё и в лицах. Лучший эпизод - это про электронную музыку, конечно. «Счастье есть», я потому что застала всё это, я помню всё, как будто это было вчера. И трек Грува, и Птюч, и свободные СМИ, и телек, который хотелось смотреть.\n\nМы уникальное поколение. В свои 10 мы не были такими пиздюками, как все последующие десятилетние. Даже у моих младших братьев и сестёр было уже другое детство, оно точно было дольше. А мы смотрели на девяностые из первого ряда зрительного зала.\n\nДевятнадцатилетние казались нам взрослыми дядьками, они умирали от передоза между этажами в нашем подъезде. Клубные девочки в этой первой модной одежде, почему - то вечно заплаканные. Они курили, мутили что-то и ждали барыгу, они занимали все скамейки во всех дворах, где-то там для них работали клубы, и какой-то совсем недосягаемый Казантип. Если бы у меня был старший брат, он бы попал в замес. Но я была старшей, и только слегка помочила ноги в океане этой реальности.\n\nМеня зацепила история, рассказанная вскользь в этом подкасте: «а вот мы слушаем микс музыканта, в те времена он просто пропал, есть версия, что его убили... так и не нашли»\n\nИ я представила, прям с цветами и запахами того времени, с теми треками, с одеждой, моделями машин - ну что там могло быть? А наверное какая-нибудь девочка бандита влюбилась в модного диджея, или из-за денег, наркотиков... да не, по любому что-то личное.\n\nИ у всех были такие истории, всем угрожали, в лес возили, и выпутывались же. По любому и он до конца думал: «да ну не..., щас по любому попугают и отпустят». Думал наверное что-то такое, когда его везли. А может и не думал, может не успел ничего подумать. Никто уже никогда не узнает, как оно было на самом деле.\n\nСсылончик на выпуск тот:  https://podcasts.apple.com/ru/podcast/8-%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D0%B9-%D0%B8%D0%B7-90-%D1%85/id1470221669?i=1000447409448\n\n«кровь заполнила рот, вот и все, приплыли» (с) кровотосток\n\nLinks:\n- https://podcasts.apple.com/ru/podcast/8-%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D0%B9-%D0%B8%D0%B7-90-%D1%85/id1470221669?i=1000447409448\n\nReactions: 👍2 🕊1\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2019-12-03__44__пришлось_взять_чувство_понести_его_дальше_прощая.md", "source": "Vi Vse Nepr", "date": "2019-12-03", "filename": "2019-12-03__44__пришлось_взять_чувство_понести_его_дальше_прощая", "content": "# 2019-12-03 — пришлось взять чувство понести его дальше прощая\n*Datetime*: 2019-12-03T04:27:24+08:00\n*Message ID*: 44\n\nМне пришлось взять это чувство и понести его дальше, прощая взрослых, потому что это не их вина. Прощая не словом, формально, а всем существом. Исцеляя это проклятие объединением семьи, любовью, направленной к детям и к старшим поколениям - что бы они не делали не так в прошлом или сейчас.\n\nПросто исцелить все это так, чтобы можно было даже посмеяться. И быть своим детям тем ро", "full_content": "# 2019-12-03 — пришлось взять чувство понести его дальше прощая\n*Datetime*: 2019-12-03T04:27:24+08:00\n*Message ID*: 44\n\nМне пришлось взять это чувство и понести его дальше, прощая взрослых, потому что это не их вина. Прощая не словом, формально, а всем существом. Исцеляя это проклятие объединением семьи, любовью, направленной к детям и к старшим поколениям - что бы они не делали не так в прошлом или сейчас.\n\nПросто исцелить все это так, чтобы можно было даже посмеяться. И быть своим детям тем родителем, который был нужен тебе.\n\n- Пиши ущерб, который ты нанесла себе.\n\nИ в этот момент мне стало ясно, что писать.\n\nЕсли перечитать текст, то кажется, что меня не сломало - но на самом деле нифига. Я думаю, что зависимость моя до 20 лет была очень про смерть и про избавление. Просто даже на самом дне я писала очень светлые песни, мне хотелось показать, что душа - это божественная часть в каждом из нас - туда не добирается ни зло других людей, ни даже наша собственная грязь. Какой бы не была наша жизнь или даже наша личность, это божественное - всегда в нас. Это новогодний подарок, который не заберут за плохое поведение. И ты всегда можешь почувствовать его: просто закрой глаза и ощути, как в оболочке черной боли маленький шар с концентрированной радостью и покоем. Живет и дышит.\n\nЯ думаю, что жизнь каждого из нас - такой уникальный коктейль из боли и радости. И   только через искусство, только через творчество мы можем попробовать вкус из другого бокала.\n\nReactions: ❤18 👍2 🕊1\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2019-09-11__29__узнала_многие_люди_думают_словами_думаю_словами.md", "source": "Vi Vse Nepr", "date": "2019-09-11", "filename": "2019-09-11__29__узнала_многие_люди_думают_словами_думаю_словами", "content": "# 2019-09-11 — узнала многие люди думают словами думаю словами\n*Datetime*: 2019-09-11T05:31:58+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 29\n\nЯ узнала, что многие люди думают словами. Я думаю словами только тогда, когда я создаю текст. Может быть, поэтому я люблю создавать текст?\n\nСегодня мне снилось, что я торчу. Сначала я просто накурилась. И это состояние было таким явным. Я помню как это - и мне не нравится.\nМне кажется, что я думаю не словами, а ощущением. Как медуза. Я втягиваю ", "full_content": "# 2019-09-11 — узнала многие люди думают словами думаю словами\n*Datetime*: 2019-09-11T05:31:58+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 29\n\nЯ узнала, что многие люди думают словами. Я думаю словами только тогда, когда я создаю текст. Может быть, поэтому я люблю создавать текст?\n\nСегодня мне снилось, что я торчу. Сначала я просто накурилась. И это состояние было таким явным. Я помню как это - и мне не нравится.\nМне кажется, что я думаю не словами, а ощущением. Как медуза. Я втягиваю в себя происходящее и остаюсь в послевкусии от него. И мой ум вибрирует тревожно или нежно, он гудит или кидает капли нот поверх полупрозрачного фона.\n\nКогда я делаю то, что мне не нравится, мир вокруг меня звучит низко и остро. Это саундтрек к любому действию и любому слову. Я чувствую совесть. Я чувствую вину. Я чувствую страх. Боль. Я не думаю их, они ложатся поверх того, что входит в меня через органы чувств.\n\nКогда я выбирала наркотики, это никогда не было выбором радости (ну, кроме самого начала). Это всегда была грустная пластинка.\n\nКогда я делаю то, что мне нравится, мир молчит или играет мне мои любимые треки, и я танцую. Это происходит, когда я делаю хорошие вещи, когда я чувствую близость к Богу - а это происходит, когда мне удается поступить лучше, чем мне диктует моя природа. Когда я такая, какая я есть.\n\nТак вот, когда я накурилась в моем сне, я оказалась в этом мрачном гуле «как я теперь?» Моя трезвость закончилась, как концепция, и мне теперь придется делать выборы, опираясь на что-то другое»\n\nДаже во сне из этой горечи я знала - через IFCKNDNTWNT - мне придется начать сначала и выйти отсюда. Я здесь, и я здесь почему-то - с этим предстоит разобраться. Мне снова придется не гордиться, а наоборот. Я в темной воде, но есть и другая.\n\nКогда я проснулась, мир снова был таким же, каким я его оставила. Мои сладкие малыши, мой мужчина, мои родители и их родители. Я проснулась в любимой музыке, которая каждой нотой была о том, что мне не стыдно стоять и смотреть каждому из них в глаза. И друзьям. И людям, которые со мной годами. Мир звучал, как будто я такой человек, каким хотела быть (ну, только мне бы хотелось быть умнее, как Аня Нестерова и знать Exel как Женя Копытина, но это уже нюансы)\n\nМожет быть, мы всегда чувствовали иначе? Думали словами только тогда, когда писали? Мы не выбирали жизнь, потому что жизнь - это скучно?  Я встала и вышла в какой-то момент, когда обычно уже не выходят. И по другой стороне сна была такая огромная разница, а внутри сна все было именно таким, каким было раньше.\n\nWe didn’t CAUSE it\nwe cannot CONTROL it\nand\nWe cannot CURE it.\n\nReactions: 👍6 ❤3\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2019-07-09__18__когда_турили_была_игра_или_город_или.md", "source": "Vi Vse Nepr", "date": "2019-07-09", "filename": "2019-07-09__18__когда_турили_была_игра_или_город_или", "content": "# 2019-07-09 — когда турили была игра или город или\n*Datetime*: 2019-07-09T04:44:14+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 18\n\nЕще когда мы турили, у меня была игра: или я город, или он меня. Если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня. Если собираю волю в кулак, иду бегать по незнакомым улицам, думаю о питании, отказываюсь от сладкого и всякой дряни, которую всегда в туре проще найти - значит я его.\n\nМы с городами играли. Питер меня не принимал. ", "full_content": "# 2019-07-09 — когда турили была игра или город или\n*Datetime*: 2019-07-09T04:44:14+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 18\n\nЕще когда мы турили, у меня была игра: или я город, или он меня. Если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня. Если собираю волю в кулак, иду бегать по незнакомым улицам, думаю о питании, отказываюсь от сладкого и всякой дряни, которую всегда в туре проще найти - значит я его.\n\nМы с городами играли. Питер меня не принимал. Однажды я приехала в него на «лечебном голодании» - на самом деле просто не ела две недели, потому что друзья наркоманы сказали, что я поправилась от своего зожа. Ну а как иначе. И вот Питер меня заколбасил особенно в тот раз - после концерта в моде, кажется, я ела на корточках в подворотне ягодное лукошко и запивала ряженкой, потом - горечь, глинтвейн, и дальше - можно было выбрасывать открытку на месяц трезвости от анонимных.. Но потом я вернулась, и я бежала по мостам через два острова и один континент, и все уже было иначе потом.\n\nСейчас как и 10 лет назад я радуюсь, когда выхожу на пробежку в незнакомом городе, и направление выбирает меня, и я просто бегу. За это время я избегала столько городов, сделала столько тренировок в парках, гостиницах и съемных квартирах - этого не сосчитать, даже если сильно стараться.\n\nК чему это я - читала тут алмазного огранщика и думала о правилах успеха. У меня они совсем другие, чем во всяких бизнес-книгах, но когда я слышу в книгах кино или фильмах что-то похожее, буквально фразу одну - это открывает мне мою локальную истину: о, это про меня.\n\n«и так я годами трахала свое тело, пока полностью не подчинила его себе» - услышала я лет в 16, в мультике про Фину (кстати, антимульт.ру делают сейчас портал зожник) когда еще курила сигареты и не только. Какой-то колокольчик прозвенел внутри и я надолго забыла это, но всегда помнила. Когда я ела грибы, моим главным инсайдом было: пиздец я живу неправильно. И все вокруг меня тыкало носом в то, что я живу не так, как нужно - от боли в теле до… Короче неважно.\n\nКогда я начала бегать, тренить, правильно питаться - я срывалась, я уходила в крайности, я допускала много ошибок. Но это был правильный путь. Сначала я трахала свое тело всем этим, и голову свою тоже трахала, а потом.. Не то что бы я его подчинила, но что-то произошло. Все эти вещи - и тренировки, и бег, и хорошая еда - они стали моими союзниками, моим любимым ритуалом, который делает меня сильнее. Это - как обучится единоборству и больше уметь, чем учиться.\n\nИ каждая эта точка - когда я пробежала, когда я делала тренировку - это как в «соедини точки с цифрами и получи картинку». В моем воображении все они светятся и создают карту, которую я нарисовала на своей жизни. Я делала хорошие вещи и они привели меня к хорошему. Такое простое правило получается… Делай хорошие вещи. А плохие вещи не делай.\n\nReactions: ❤8 👍4 🕊3\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2019-07-07__17__поездка_нас_была_классной_особенно_вчера_ночью.md", "source": "Vi Vse Nepr", "date": "2019-07-07", "filename": "2019-07-07__17__поездка_нас_была_классной_особенно_вчера_ночью", "content": "# 2019-07-07 — поездка нас была классной особенно вчера ночью\n*Datetime*: 2019-07-07T03:23:22+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 17\n\nПоездка у нас была классной. Особенно вчера ночью. Мы встретили Женю и Влада на автостанции Валдай, они сели в машину и мне пришла в голову идея: надо, чтобы Влад рассказал о себе - мы все уже давно знакомы, а про него знаем только что то, что его Худстритфуд делает лучшие веганские фишроллы во всей галактике.\nНо чтобы все было органично, мы реши", "full_content": "# 2019-07-07 — поездка нас была классной особенно вчера ночью\n*Datetime*: 2019-07-07T03:23:22+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 17\n\nПоездка у нас была классной. Особенно вчера ночью. Мы встретили Женю и Влада на автостанции Валдай, они сели в машину и мне пришла в голову идея: надо, чтобы Влад рассказал о себе - мы все уже давно знакомы, а про него знаем только что то, что его Худстритфуд делает лучшие веганские фишроллы во всей галактике.\nНо чтобы все было органично, мы решили все по очереди рассказать о себе.\n\nИ вот про Лилю я узнала, что мама отпустила ее в питер благодаря гадалке, а ещё она пела гроулингом в рок-группе в Башкирии и мечтала стать робототехником, но ей не хватило баллов, что рекрутер в модельное агенство поймал ее на улице, и она объездила весь мир как модель, чтобы узнать что для модельного бизнеса у неё слишком длинные ноги.\n\nЖеня рассказывала про все свои увлечения и кружки, она была президентом школы и участвовала во всех возможных съездах типа «мы - будущее России» «дети за путина» «путин за детей», как она занималась реконструкцией, ирландскими танцами, играла в КВН, ЧГК, как работала в майонезе и как попала в секту, Вадимчик рассказывал, как делал бар VNVNC, задумывал его таким местом с вином и тонкой эстетикой, а получился чад кутежа на конюшне, как играл во всяких группах и почему больше не хочет этого делать, Влад рассказывал, как всю школу и универ занимался гандболом, и их команда занимала вторые места (а первые занимал мой универ - Лесгафта), как работал барменом в штакете, как учился готовить, как они открыли первую точку Худа и как они развивались, ну и мы с Шапо рассказали о себе - я так вообще могу бесконечно рассказывать, у меня миллион историй внутри одной.\n\n5 часов дороги прошли незаметно, я думала о том, какие классные люди со мной едут плыть по холоднючему озеру, и как здорово, что мы не бухаем и не торчим, и каждый занимается своим любимым делом: Шапо музыкой, Лиля чаем, Влад едой, Вадим гитарами, Женя - директор секты, а я - всего лишь окно в вечность.\n\nReactions: 👍4 🕊1\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2019-07-03__15__интересная_штука_этот_ущерб_не_совсем_кажется.md", "source": "Vi Vse Nepr", "date": "2019-07-03", "filename": "2019-07-03__15__интересная_штука_этот_ущерб_не_совсем_кажется", "content": "# 2019-07-03 — интересная штука этот ущерб не совсем кажется\n*Datetime*: 2019-07-03T06:09:27+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 15\n\nИнтересная штука этот ущерб. Не совсем то, что кажется большинству. Вот человек что-то сделал, а ты ему сказал: «Блин, круто!» а на самом деле подумал «Хуйня». И ты наносишь ему ущерб. Лучше бы просто промолчал. А так - подкрепил своим авторитетным мнением то, во что на самом деле не веришь… А человек тебя слушает и доверяет. Или когда говоришь «Д", "full_content": "# 2019-07-03 — интересная штука этот ущерб не совсем кажется\n*Datetime*: 2019-07-03T06:09:27+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 15\n\nИнтересная штука этот ущерб. Не совсем то, что кажется большинству. Вот человек что-то сделал, а ты ему сказал: «Блин, круто!» а на самом деле подумал «Хуйня». И ты наносишь ему ущерб. Лучше бы просто промолчал. А так - подкрепил своим авторитетным мнением то, во что на самом деле не веришь… А человек тебя слушает и доверяет. Или когда говоришь «Да нормально все», а на самом деле не нормально. Наступил себе на горло, внутри себя перетерпел - нанес этим человеку ущерб. Потому что он спросил: нормально? а ты ответил что нормально, а про себя подумал: «вот пидорас какой невнимательный, мог бы и догадаться, что ненормально!». Так это ты его пидорасом сделал, когда ответил нечестно на его вопрос.\n\nКогда ты думаешь одно а говоришь другое - это все ущербище, потому что ты не даешь миру принять тебя таким, какой ты есть. Носишь уебские маски, потому что нормальных вообще не бывает. Даже если тебе кажется что твоя маска хорошего человека защищает мир от твоего же зла - тебе так только кажется. Твое лицемерие делает всем только хуже. Но чтобы говорить то что думаешь или молчать - нужна сначала смелость, а потом привычка.\n\nЕще интересен ущерб денежный. Вот свозила я людей куда-то за свой счет - нанесла им ущерб. Дала денег просто так - нанесла ущерб. Если они знают, что это я дала. Или не в деньгах, а помочь. Стоит подумать: а насколько мне благодарны? И все, вместо доброго дела это снова ущерб.\n\nПоэтому благородство без зрителей, широкие жесты без фотокамер, дары без имени дарителя и без возможности отбиться на рекламе… Это то, как я хочу жить, поэтому и живу с 12 шагами уже столько лет. Без них начинаешь думать, что раз ты не делаешь крупного говна, то на мелкое и оглядываться нечего. С шагами видишь каждую какашинку.\n\nReactions: 👍4 🤔2\n"}, {"path": "data/lj_export_clean/posts_md/2018-08-21__86613__null_this_is_the_eeeend.md", "source": "LiveJournal", "date": "2018-08-21", "filename": "2018-08-21__86613__null_this_is_the_eeeend", "content": "# null/ this is the eeeend\n*Date*: 2018-08-21T23:41:00+00:00\n*URL*: https://olymarkes.livejournal.com/86613.html\n*Tags*: #000000\n\nУ меня болит голова. Очень сложно писать в таких нечеловеческих условиях, но тут уже требуют продолжения. Так вот, на чем я закончила? А, на грустном. Так вот, для полноты картины тут наверное надо представить себе все, начиная от бесконечных вопросов про развод - в аск.фм прежде всего, потому что лично спросить все боялись, до собственно временного контекста - это са", "full_content": "# null/ this is the eeeend\n*Date*: 2018-08-21T23:41:00+00:00\n*URL*: https://olymarkes.livejournal.com/86613.html\n*Tags*: #000000\n\nУ меня болит голова. Очень сложно писать в таких нечеловеческих условиях, но тут уже требуют продолжения. Так вот, на чем я закончила? А, на грустном. Так вот, для полноты картины тут наверное надо представить себе все, начиная от бесконечных вопросов про развод - в аск.фм прежде всего, потому что лично спросить все боялись, до собственно временного контекста - это самые первые дни нового года, и тут начинают аккуратно анонимные братья задавать вопросы, типа «беспокоимся за твое выздоровление», и некоторые совсем уж близкие начинают песню из серии «дописала четвертый шаг и ушла в сухой срыв». Это когда ты типа не употребляешь наркотики, но весь такой в зависимом поведении. У всех, собственно, стоял один вопрос на повестке дня: почему я разъебываю свою жизнь. И тут должно было быть какое-то разоблачение, типа муж меня бил, или не любил, или я его не любила - потому что других историй не бывает, видимо. Но тут не так, мы жили душа в душу и любили друг друга, да и любим до сих пор. Но для того, чтобы жизнь шла дальше и шла хорошо - нам надо расстаться. Вот есть же какой-то такой момент переломный на пути,\nот стадии, когда люди любят друг друга и решают быть вместе и делать семью - и до другой крайности, где они ненавидят друг друга и терпят друг друга, или до измены, например. Вот если переломный момент наступает и до крайности еще очень далеко - это самое время что-то изменить, оставаясь честным в отношениях. Я хочу оставить эту историю чистой. Еще один шаг вперед - и этого уже не спасти.\nВ этой ситуации я не жертва, роль жертвы мне знакома и понятна, а вот к роли Дурге-разъебывающей-все я никак не могу привыкнуть. Что чувствовать? Сознание отправило меня в отпуск. Просто ничего, никаких чувств, и из интересов - только сноуборд, танцы и пожрать. Примитивно, как пиздец. Никаких лишних движений и мыслей - кажется что идешь по доске в кипящей лаве, и такой типа: все нормально, я просто иду по полу. Просто иду по линии на полу. Я не бухой, так что пройти по линии - это не проблема для меня. Потому что если свалится в эту лаву - начинаешь жалеть и себя, и множество вещей, которые ты разъебал, и все моменты, и все ритуалы, привычки, воспоминания. Просто нельзя об этом думать, потому что суть и правда не меняются. Я все правильно делаю, главное - не оглядываться назад.\nПоэтому мы танцевали. Сто лет не делала этого, честно говоря. Но потом этот странный плейлист на закрытии Мачт, концерт Сюзанны, потом просто Юнион, потом вся Конюшенная - «Молодость все прощает» на Танц. площадке, и стоишь под ней и ржешь. Потому что если молодость все прощает, то в 30 лет хахах, ой держите меня…\nПотому что в 30 лет ты сделал все, чтобы от тебя наконец отъебались со всеми этими вопросами - А что образование? А когда замуж? А дети? А когда за вторым? А квартиру-то свою покупать будете? Чтобы отстал весь социум, отстал от тебя, от твоих родителей, бабуль и дедуль, чтобы им было что соседям рассказывать. Подарила папе джип с огромным бантом на 50 лет, родила детей не отрываясь от производства, ебашила все - и музло с концертами, и лекции/тренировки по всему миру, и бизнесы всякие пробовала, нанимала/увольняла, ебашила по 12 шагам, чтобы крыша на месте была от всего этого дерьма, и аспирантура, и почему бы мать его IRONMAN не ебануть, у меня ведь так дохера свободного времени. Я все тащила, ничего не бросила. И вот теперь мне хочется чтобы все просто отъебались от меня (хотя на самом деле никто и не доебывался, кроме, собственно, меня самой, это я вам просто пытаюсь передать ощущение). Я ничего не хочу делать. Я просто хочу, чтобы моя голова отстегнулась от меня и осталась дома, а сама я пойду танцевать. Вот, чего я хочу. Конечно, сначала чувство вины немного отравляло мне вкус безалкогольного винишка. Чувство вины за то, что не читаю диссертации и не хожу в офис. Потом я вспомнила, что сейчас новогодние праздники… И мы взяли микроавтобус и уехали в Коробицыно.\nИ мы так танцевали каждый день, как в последний раз, или нет - как в тот раз в PV в Березовском на хэппи хардкоре. Мы танцевали на улице у машины, мы танцевали дома, в магазинах под любую музыку из колонок, на горе, пристегнутые к доскам, по дороге, в машине. Мы танцевали, потому что на самом деле это было самое волшебное ощущение. Когда тебе тридцать лет, и ты наконец-то от себя отъебался.\nВ это время я не писала музыку и альбом стоял на паузе. И Шапо тоже понимал что как-то немного не до этого сейчас. А вот Катя считает, что Алиса - это мощный эгрегор, десятки тысяч Алис воплощенные в этом образе пришли в мою жизнь и все разрушили. Зы считает, что я просто снимаю с себя кожу каждый раз перед таким релизом, который приходит не из головы. Юля считает, что это невероятно - то, что мы сделали… Сделали и не осознали, и что то, что я сделала со своей жизнью - я не осознала это так же, но энергетически все оказалось в балансе. Я принесла жертву и у меня получилось то, что получилось. Мир услышит это чуть позже, но пока я на самых последних неделях, и это ни с чем не сравнится. Об этом потом напишу, сейчас о другом.\nЯ хочу запомнить этот январь, как один из самых счастливых месяцев в моей жизни. Может быть, даже, самый счастливый. И это не связано с тем, что у меня все было хорошо. Нет, все было не так. Странным образом я соединялась эмоционально не с проблемами, которые вокруг меня были, а с правдой, которая победила и была в моем сердце. С какой-то чистотой намерения, с честностью. С пятым шагом, который я практиковала. Я танцевала без горечи, без страха, что будет дальше, не заботясь, что обо мне подумают. С ощущением, что я все уже сделала, сдала сессию, поставила все печати… Короче если вы хотите знать что-то важное про 30 лет - просто постарайтесь работать не выдыхая с 25, и тогда в 30 вы возможно узнаете, что такое настоящие каникулы.\nИ знаете что еще? Во всей этой истории нет никакого трагизма. Только любовь. Поэтому мне немного странно, когда меня жалеют или сочувствуют; Еще понимаю, когда анонимно пишут: «Желаю Андрею счастье и не с такой мозгоебкой, как ты», это хотя бы забавно. Знаете, мозгоебы и мозгоебки - это хотя бы весело. А уж прожить 5 лет душа в душу, будучи совершенно отбитыми и разными - это огромное счастье, гораздо лучше, чем найти себе какое-нибудь УГ и чтобы оно тебя терпело. Я думаю, что жизнь нужно праздновать, а не пытаться пройти ее на легком уровне. Но тут скорее дело вкуса.\nЧто касается будущего - понятия не имею, что там. Надеюсь меня с моими друзьями поместят в один дом престарелых. По крайней мере так я точно готова встретить закат жизни. Остальное пока не знаю.\n"}, {"path": "data/lj_export_clean/posts_md/2018-01-21__86024__nullпризнай_перед_богом_собой_и_другим_человеком_что_ты_говно.md", "source": "LiveJournal", "date": "2018-01-21", "filename": "2018-01-21__86024__nullпризнай_перед_богом_собой_и_другим_человеком_что_ты_говно", "content": "# null/признай перед Богом, собой и другим человеком, что ты говно/\n*Date*: 2018-01-21T00:26:00+00:00\n*URL*: https://olymarkes.livejournal.com/86024.html\n*Tags*: #000000, #sekta\n\nПоследние пять лет я спасала мир. Хех, не будем обсуждать, насколько хорошо у меня это получалось. В иллюзиях я не пребываю. Скорее я про вектор. Нам казалось, что мы делаем очень большое и важное дело и ни в коем случае нельзя отвлекаться. Мы с малышкой Зы сидели на кухне кажется десятой линии васильевского острова и п", "full_content": "# null/признай перед Богом, собой и другим человеком, что ты говно/\n*Date*: 2018-01-21T00:26:00+00:00\n*URL*: https://olymarkes.livejournal.com/86024.html\n*Tags*: #000000, #sekta\n\nПоследние пять лет я спасала мир. Хех, не будем обсуждать, насколько хорошо у меня это получалось. В иллюзиях я не пребываю. Скорее я про вектор. Нам казалось, что мы делаем очень большое и важное дело и ни в коем случае нельзя отвлекаться. Мы с малышкой Зы сидели на кухне кажется десятой линии васильевского острова и принимали первые заявки на\n#sekta\n- дистанс, а по вечерам по очереди, а скорее даже вместе, вели тренировки в Мэдстайле на Невском 32-34, проверяли дневники, придумывали новые задания и лекции. Так все началось. Потом вселенная дала такой ответ, что меня закачало - появились деньги, появились проблемы, появились амбиции и желание развивать все это дело, допиливать, доводить до совершенства. А до совершенства на тот момент было далеко.\nЯ говно. Но у меня есть вектор. Знаете, это такое бесконечное стремление к лучшему с вечным осознанием того, какое я говно. Я говно человек. Поэтому я пишу шаги. Я плохой руководитель, поэтому я всегда искала тех помощников, которые будут хорошими руководителями вместо меня. Я плохая мать, плохая жена, плохой друг. Моя\n#sekta\nбыла ужасным непрофессиональным клубком панковских эклектичных идей с формулировками типа «проеб» и с метафорами уровня «раздражать вкусовые рецепторы - это как слишком часто дрочить». Я необразованное уральское быдло, поэтому я вечно продираюсь через тьму своего невежества, пытаясь окружить себя умными людьми и слушая их. Я говно с тупыми шутками, иногда с тупыми и жестокими шутками. И может быть единственное справедливое во всей этой истории, это то, что все это время я очень-очень-очень хотела стать лучше.\nЧуть ли не на вторую неделю работы моего «бизнеса» мне стало достаточно всего. Во всяком случае было чем платить за квартиру. Я никогда не старалась быть лучше, чтобы «лучше» конвертировалось в бабло. Это было для чего-то еще. Сказать для людей? Возможно для людей. Но я боюсь быть лицемерной, наврать вам, поэтому не буду говорить «для людей», потому что желание стать лучше похоже на зуд. Оно похоже на раздражающий тебя звук, оно похоже на соседа, который делает ремонт в квартире снизу. Оно похоже на долг по кредиту. Оно похоже на все, что не дает тебе спокойно спать. При этом конечно все измерялось относительно довольства людей, которые занимались у нас. И так как цель была, чтобы они ушли с результатом и счастливые, в итоге получалось, что мое «стать лучше» имело прямое влияние на людей.\nЯ старалась бесконечно все улучшить и устранить все косяки (и тут важно написать, что я не одна старалась, и все хорошее было сделано не моими руками, а руками других людей, потому что сама я вообще мало что могу сделать, помните, что в любым навыком я владею крайне посредственно, и таланта у меня нет ни к чему, кроме, пожалуй, выражения своих мыслей в письменной форме), а устранение косяков влияло на качество продукта и общий результат. Стремление все улучшить привлекало в команду самых охуительных людей, потому что они видели, как все рубятся не за бабло и показатели, а за совершенство и за то, чтобы у наших учеников получалось.\nКоманда мне многое прощала и прощает. Им есть, что прощать, потому что я далеко не Джобс, не Дуров, не один из этих блестящих талантливых руководителей, о которых пишут книги. Но я действительно хочу, чтобы все хорошо работало, чтобы все было идеально и правильно.\nНе знаю, что во мне такого хорошего, что все они рядом со мной. Возможно просто другие руководители еще хуже. Другого объяснения у меня нет.\nТак вот, последние пять лет я занималась этим. А до этого я жила творчеством. Это был совсем другой период, и тут о нем очень много можно найти. Все началось с творчества, и с моих друзей. Да, мы мало кому были нужны, просто обычная маленькая компания из города в центре России, даже не столичные ребята. Без амбиций, не мечтая о больших победах - просто хотелось как-то так прожить свою маленькую жизнь, чтобы было что вспомнить.\nМы жили каждый день на максимум, на всю катушку. Мы дружили, мы любили, и вот как-то много было всего этого, и мир мы совсем не спасали. Жили для себя и так и планировали. Из всего этого получались тексты, получались песни, и я чувствовала себя на своем месте - типа такая у меня миссия. Переживала ли? Конечно. Что голос у меня слабый и слуха нет нихрена, что песни я пишу примитивные и на одни и те же аккорды, что не получается сделать нормально ничего - ни записаться, ни выступать. И выглядела я при этом так себе. Любой комментарий на ютубе к нашим трекам выглядел так: «Страшная как пиздец и петь не умеет». Я соглашалась, но при этом жизнь продолжала жить меня, друзья были рядом, мы угорали и любили, и песни рождались сами собой, и концерты и дорога круглый год, и мы танцевали, и путешествовали, и все-все-все делили поровну. Залезали в долги, вылезали из долгов, покупали себе билеты в Гоа на последние деньги, делали первые тренировки в съемных туровых квартирах. Так все было.\nА потом все это произошло, и в жизни появился новый смысл - меня просто переключило на него. Вот это ощущение, что ты спасаешь мир - оно очень вкусное. Типа до этого я прожигал жизнь и делал какое-то непонятное творчество, а вот сейчас-то я наконец нормально живу. Наверное, любой другой человек на моем месте открестился бы от прошлого, но вот не стала. Мой папа считает, что главное мое положительное качество - это умение доводить все до конца. Да, я скорее тащу все это по земле, но не бросаю.\nУже потом, в процессе «спасания мира» я открыла циклы мотивации. У меня они достаточно долгие и однонаправленные. Если я работаю - я работаю. Если я в творчестве - я в творчестве. Но и когда я занималась одной только группой - у меня были периоды застоя, когда я пинала себя и пыталась что-то выдавить, и ничего у меня не получалось. Тут я просто поставила себе задачу: пусть что-то не получается, но ведь вроде и не становится хуже, поэтому я буду просто поддерживать жизненные показатели этой жизненной сферы в норме. Как человека в коме держат на ИВЛ. Так и я держу что-то в своей жизни, на что у меня совсем нет сил. Типа, если что-то не дышит само - еще не время это убивать. Возможно, еще задышит.\nС группой у меня не было сомнений - наоборот, я была уверенна что в свободе моим песням будет лучше. Когда некуда торопиться и не надо мерить свой успех успехом своего творчества. Вообще нахуй успех. Я хочу, чтобы каждый знал и чтобы я не забывала: успех\n- это не равно счастью, для меня во всяком случае. Счастье - это знать волю Бога о том, что он для тебя приготовил. Счастье - это принимать и успех, и неуспех одинаково. Вот настоящая свобода, которой я себе всегда хотела. Хотеть одного успеха - это крайне уязвимая позиция.\nИ вот на самом деле много надо написать - и это всего лишь подводящая часть. Подводящая часть к тому, что началось потом. Но сначала надо еще дать вводных данных, чтобы картина была полной. Не только про работу, не только про близость, не только про детей и желание стать лучше. Кстати, про детей. Смогу ли я стать хорошей матерью? Я не знаю, только если словосочетание «хорошая мать» изменит свое значение в социуме. Я так мало им даю, на самом деле.. Очень мало. Но у них есть жизнь, целая жизнь впереди. Мало ли это? Я не знаю. Моя мама была со мной всего четыре года, но вся жизнь во мне - это гораздо больше… Могла ли она оставить мне более ценный подарок после себя?\nЧетвертый шаг. Личная инвентаризация дефектов характера - это письменная работа по 12 шагам NA, она была спутником всех этих лет. Я разбирала себя по кирпичикам, я разбирала, какое я говно, и училась с этим работать: видеть это, принимать, стараться поступать по новому. Много ли мне удалось изменить в себе? Хуй да маленько. Но польза колоссальная. Я знаю себя. Я действительно знаю себя.\nИ вот, спустя пять лет я подошла к пятому шагу. Мы признали перед Богом, собой и другим человеком истинную природу наших заблуждений.\nГоворить правду про себя только сначала страшно. Потом ты входишь во вкус. Признавать свои заблуждения страшнее всего перед собой - это похоже на то, как тебя обдает жаром стыда, но потом ты говоришь себе: «Ну да, пиздец». И начинаешь что-то с этим делать. Или просто слезаешь с лошади, которая уже сдохла. Оказывается, это все во мне всегда было - эти шаги. Естественным образом я все это делала, но не в таких объемах, конечно. Например жж - это всегда для меня было способом сказать про себя неприятную правду, чтобы очиститься. Нет ничего отвратительнее, чем казаться лучше, чем ты есть на самом деле. Обязательно нужно дать миру посмотреть на тебя такого, какой ты есть. Только так можно найти что-то для себя настоящего, а не подобрать декорации под маску.\nПятый шаг открыл портал в новое измерение, где я совершенно ясно увидела эту картину: я говно, поэтому я старалась всегда во всем стать лучше, приносить пользу и спасать мир так, как у меня это получается. Но вот что касается секты - мы все настолько улучшили и команда настолько самодостаточна и профессиональна, что мои силы и ресурсы могут сделать для компании хуй да маленько. Лучшее, что я могу сделать - это не мешать и добавлять немного панк рока во все происходящее. Но важнее - это конечно не мешать.\nТак куда же деть всю освободившуюся энергию? - подумала я, когда жар стыда и ощущение собственной бесполезности отхлынуло. - Подожди, - сказал внутренний голос, - это еще не пиздец, пиздец будет чуть дальше.\nЧуть раньше со мной случилась Алиса. Где-то на переходном периоде пришли эти песни - такие конкретные, но как будто о событиях, которые только должны произойти. Как это работает? Что это вообще такое? Не знаю.\nМожет мне просто должно было исполниться 30, и вдруг исполнилось.\n9% заряда на ноутбуке, поэтому на сегодня я закончу. Но это если честно даже еще не начало.\n"}, {"path": "data/lj_export_clean/posts_md/2017-10-21__80984__это_-_текст_номер_3_который_должен_идти_после_второго_но_идет_перед.md", "source": "LiveJournal", "date": "2017-10-21", "filename": "2017-10-21__80984__это_-_текст_номер_3_который_должен_идти_после_второго_но_идет_перед", "content": "# Это - текст номер 3, который должен идти после второго, но идет перед.\n*Date*: 2017-10-21T19:14:00+00:00\n*URL*: https://olymarkes.livejournal.com/80984.html\n\nКак читать «Любовь к трем Цукербринам»\nЭто скорее для тех, кто уже читал. Потому что если вы будете читать в первый раз - слишком сольются два уровня повествования, и ум ваш захайлайтит то, что привычнее. И для тех, кто читал, по прошествии времени все превратится в кашу из виртуальной реальности, энгри бердс и биг бада бума.\nВ свое время", "full_content": "# Это - текст номер 3, который должен идти после второго, но идет перед.\n*Date*: 2017-10-21T19:14:00+00:00\n*URL*: https://olymarkes.livejournal.com/80984.html\n\nКак читать «Любовь к трем Цукербринам»\nЭто скорее для тех, кто уже читал. Потому что если вы будете читать в первый раз - слишком сольются два уровня повествования, и ум ваш захайлайтит то, что привычнее. И для тех, кто читал, по прошествии времени все превратится в кашу из виртуальной реальности, энгри бердс и биг бада бума.\nВ свое время именно оттуда я прислала цитату Виталию Акимову, когда он снимал меня для 365 незнакомцев. Эта книга должна была быть прочитана именно в то время, и она должна была остаться в облаке, чтобы я вернулась к ней именно в то время, которое сейчас.\nВо-первых Пелевин всегда пишет так, чтобы было понятно даже второкласснику и домохозяйке - и это не коньюктура, это мастерство - я как раз писала об этом пару дней назад. Об умении рассказывать одну историю разными словами, на разных языках и для разного IQ. Высший пилотаж - делать 10 в 1. Обязательно что-нибудь поймете и почувствуете себя умным.\nКиклоп.\nЭто - самая важная часть, но ее можно читать в конце - если сюжет увлекает вас больше, чем механика, так будет даже прикольнее.\nРассказать об устройстве вселенной в формате angry birds - можно воспринять это, как забавную шутку. Но фишка в том, что любая история в этом мире - история об этом. Устройство вселенной зашифровано в каждом сюжете, во всем - всем - всем. И если ты один раз познаешь эту механику, ты и будешь видеть ее везде, и сможешь рассказать в любом варианте. И что бы ты не хотел сказать - твое повествование будет закручиваться в это кольцо. Можно сказать просто: «Вот так все и есть», а можно написать сто томов - смысл будет один: ты обрисуешь факт движения, а дальше каждый сам додумает в рамках своего понимания, не больше. И кстати «Вот так всё и есть» гораздо сложнее оспорить или обесценить, правда же? Ты не поясняешь как именно и что именно. А это не имеет значения абсолютно, потому что всё.\nЧто нужно знать: мир постоянно обновляется, и он требует усилия божественного, которое не сосредоточено нигде, кроме нас, тех, кто осознает божественное. Это - вектор приложения усилия номер 1. Кто его не осознает, или осознает совершенно иначе (усилие 2) - тот по своему незнанию природы будет бороться со своей причиной. Это как коты, которые бегают за своим хвостом. Незнание, или искаженное с точки зрения (скажем моей, не буду обобщать) заставляет их искренне действовать против усилия номер 1, потому что они - не осознают наличие того, чего не видели и не чувствуют. Они уверены, что 1 все придумали, поэтому не надо слушать, а надо делать так, как прет, и как хочется, и как считается нужным. Где-то был такой сюжет, где люди видели одно и то же с разных сторон, и потому имели разные убеждения и действовали по разному. Так вот, здесь все так и есть. Каждый уверен в своей правоте и каждый по своему прав - и у каждого чиста совесть, потому что понятия о совести и о чистоте у каждого свои. У каждого своя правда.\nИ это как войны в фэйсбуке - как завяжется, так ух - искры во все стороны. Мир так живет, в постоянном развитии,обновлении и противодействии. А энергия для обновления мира берется из единства и борьбы этих двух противоположностей.\nПочти в каждой книге у Киклопа - буду его так называть, чтобы не скатываться в рецензию - повторяется одно и то же, как в учебнике. О замысле гадать не буду, но мне это доставляет истинное удовольствие. Я просто вижу как история рассказывается с еще одной стороны, освещая детали в новых словах. Ох, как бы сказать - слова это только проекция, зная суть изнутри, всегда интересно видеть ее новые формы. Суть одна, а проекция - это и есть искусство.\nТак вот, здесь очень круто показано следующее. То, о чем мало где еще прочитаешь - но это так и есть. Это и есть лично для меня источник дискомфорта. Ты сам выбираешь свой космический поезд, космический - не то слово, такой, трансцендентальный (который через время и границы одной жизни. И вот с какой-то вероятностью это - тот поезд, который несет тебя в мир бесконечного entertainment’а с редкими перерывами на какой-то там геймифицированный труд, как в той серии Черного Зеркала, с быстрыми продажами и быстрым впечталениеми. И даже если ты не будешь таким, то мир вокруг - он к тому и идет. Но есть какая-то вероятность, что осознав важность и найдя другие ценности некоторое количество наших точек самоосознания окажется в другом измерении - где главные ценности будут под защитой. Короче, это - только предположения. Этого мы уже никогда не узнаем. Узнаем, но это будем уже не мы. Вернее мы, но уже в другом качестве.\nТак вот, скажу проще: каждый из нас идет туда, куда он идет лично. Даже если все скатывается в говно, а ты - отказываешься это делать - мир не утянет тебя за собой. Если все вокруг развивается и становится более духовным и правильным, а ты - нет - то тебе лично общая благость не поможет. Вот о чем это.\nТам конечно в Киклопе каждый абзац - это бесконечный кайф. Надо читать все эти книги не как обычные книги с сюжетом и моралью, а как Дао Де Дзын, как набор мудростей. Одна и та же истина закручена в кольца - от маленького смыслового (в одной метафоре или предложения) до сложно и супер-сложно сочиненных - глава, или даже несколько романов в одном.\nЕще там круто про науку. Про то, что это измерение преломления лучей в пространстве, где администрацией разрешены измерения. Очень грустно, что наша методология так ограничена… Наука ограничена тем, что не все в этом мире можно измерить и оценить - цифры, таблица менделеева и другие системы мер - это еще более ограниченый инструментарий. Слова - гораздо богаче. Но ими никому ничего не доказать.\nМыслепреступление.\nFuck the system - это как раз самая простая часть, которая всем понятна - как я считаю. Или нет? Разница между политиком номер 1 и политиком номер 2, один из которых вызывает твое одобрение, а другой - ярость, или твои сексуальные девиации, которые вызывают стыд, страх быть раскрытым и от этого - еще более сильное желание - это инструменты отвлечения тебя от главного, все эти переживания и простые мечты, которые хранятся здесь же - на десктопе, в сохраненных картинках о путешествиях или вещах - это все анастезия, чтобы ты никогда не выходил из под контроля. Система - это удовольствие и страх его утраты. Уже сейчас мы кликаем на то, что нам нравится - и так попадаем в метрики, и выбираем тот контент, который будет нас окружать дальше. Очерчиваем стены своего бокса (представим что наши ленты соц.сетей все таких четырехмерны). И все это - добровольно, и даже с удовольствием - мне кажется вообще все что будет происходить дальше будет построено на наших условных рефлексах удовольствия и ощущения «правильности», а наполнять эти рефлексы смыслом будет тот контент, который мы потребляем - потому что в реальный мир за впечатлениями люди обращаются все меньше. Они просто не знают, как их там получать. Для чего нужен пейзаж, если не для фотки? Мы потребляем и создаем то, что вызывает максимальное одобрение массы. За ощущением правильности мы обращаемся к количеству шеров и лайков. Об этом в черном зеркале тоже уже было, поэтому не буду повторятся.\nЧто здесь самое главное? Концепция того небольшого ментального усилия, которое переносит тебя в новый мир, относительно тебя старого. Когда ты искренне хочешь стать лучше - ты начинаешь новую историю про себя. Это все, что от тебя на самом деле нужно - остальное произойдет, оно найдет свои пути.\nЧто еще страшно. Раньше все смотрели, не все видели. Теперь мало кто смотрит, даже из тех, кто видел раньше. То, что нельзя сфотографировать и уложить в слова потеряло свою ценность в цифровом мире, потому что это не имеет цены и не может стать объектом торговли, поэтому потребность смотреть и видеть уходит, такой душевный атавизм. Утрата, которую мы не заметим.\nПереезд в цифровой мир - как переезд в новый дом, вроде все упаковали, что видели и все принесли и разложили по местам. И хоть убей, не возможно вспомнить, чего именно не хватает.\nСложная и красивая метафора о том, что мы по инерции усиленно пытаемся казаться тем человечеством, которым мы были раньше. Сосредоточившись на том, что продается - постоянно следим за ценностями и подгоняем свои под наиболее релевантные - и это уже общепринято, это уже преподается. Двач, как оплот порицания «социоблядства», по своему прекрасен. Там люди не пытаются казаться лучше, чем они есть на самом деле. Но невозможно отделаться от мысли, которую Мирон Янович произнес в баттле против Дуни: Андегрануд - это не то, когда тебя не покупают, когда ты продаешься.\nКак-то хорошо автор в конце отодвинул свое творческое эго и сказал: все просто, живите по заповедям. А я вижу так: честность и открытость - это лучшее оружие и лекарство.\nБату - это Птицы, это элемент, разрушающий систему и приманка ложных (с позиции силы 1) смыслов. Это то, что манит людей, которых я понимаю, но с которыми я никогда не соглашусь, это вечно ныряющий в глубину внутренний противник, рождающий рябь на воде и наш импульс идти за ним или против него. Это раздражитель или маяк. Это такая же часть системы, така же часть вселенной.\nТо говно, в которое мы скатываемся и те светлые миры, к которым мы тянемся внутренне, оказываясь на дне - это две стороны одной и той же реальности. Поэтому бунт обязателен и в то же время бесполезен, он - элемент системы, и мы находимся одновременно на двух сторонах.\nПоэтому по сути дела все написанное не имеет никакого смысла) Но факт в том, что книга доставляет удовольствие, удовольствие совершенно иного рода, особенно когда перечитываешь ее на обновленную прошивку.\nЧитайте, и помните - в любом непонятном случае молча склоняйся перед вечностью и жди.\n"}, {"path": "data/lj_export_clean/posts_md/2017-07-21__80660__no_title.md", "source": "LiveJournal", "date": "2017-07-21", "filename": "2017-07-21__80660__no_title", "content": "# (no title)\n*Date*: 2017-07-21T22:44:00+00:00\n*URL*: https://olymarkes.livejournal.com/80660.html\n\nИстину сложно обойти стороной, что ты не транслируешь - обязательно попадешь в точку. Потому что все истории - они, по сути, об одном. Но каждому нужен свой подход и свой рассказчик - что-то похожее, как с тональностями в музыке. С одним музыкантом у тебя получается петь в униссон, а чей-то голос для тебя слишком низкий, или высокий. Так и с историями - тебе нужно просто найти свою. Факт: у всех л", "full_content": "# (no title)\n*Date*: 2017-07-21T22:44:00+00:00\n*URL*: https://olymarkes.livejournal.com/80660.html\n\nИстину сложно обойти стороной, что ты не транслируешь - обязательно попадешь в точку. Потому что все истории - они, по сути, об одном. Но каждому нужен свой подход и свой рассказчик - что-то похожее, как с тональностями в музыке. С одним музыкантом у тебя получается петь в униссон, а чей-то голос для тебя слишком низкий, или высокий. Так и с историями - тебе нужно просто найти свою. Факт: у всех людей разные уровни понимания, разные запросы - даже в форме приготовления истины. Одни предпочитают ее в формате фастфуда, другие - в форме эзотерического ассорти. Высшим пилотажем в этом я, конечно же, считаю всеядность. Потому что если смотреть в корень, то у Корана, Библии и романов Дарьи Донцовой одна природа, и все вышеперечисленные семантические замочные скважины показывают одну и ту же реальность, ведут через коридор непознанного, завязывая по пути узелки - чтобы читателю было проще определять хорошее и плохое в темноте и хаосе вселенной, где все так неоднозначно. Через близкие и понятные читателю истории он учится простейшим законам мироздания, наделяя смыслами семантические конструкции «карма», «грех», «харам», «что посеешь - то и пожнешь», «сила - она в правде». Построив первый уровень своей пирамиды принципов и понятий, осознающий встречается со следующей - там его принципы и понятия входят в противоречия, в противодействия друг с другом. Часто это случается в период юношества, а иногда - оперативной памяти у человека не хватает, и он предпочитает просто не видеть противоречия, и это не случается никогда. Но вот если случается, то это - второй уровень - он во многом является стимулом для творчества, и продукты этого процесса осознания бьют в самую цель, причем форма уже не так важна. В этот момент осознающий видит две силы, противостоящие друг другу не на жизнь, а на смерть - здесь к слову очень приходится «Шаги по стеклу» Йена Бенкса, которую, вы конечно же, не читали. Но вот там очень хорошо показаны эти уровни. Что по сути наша жизнь - это бесконечная игра в Го, бесконечный вопрос о непреодолимом препятствии и неостановимой силе, которые сталкиваются, и эта игра - она во всем, от твоего карьерного роста, несчастной любви или мечте о кубиках на животе, до поиска истины, отречения от мирского блага, или информационной войны. Импульс имеет разные триггеры, у каждого ослика - своя морковка. По сути дела твоя морковка - это история про тебя, рассказанная тебе в тех словах, образах или обстоятельствах, которые попали в цель. У каждого своя война, у многих они похожи.\nПоэтому на этом этапе очень приятно находить друзей - они же становятся твоими единомышленниками, дружить проще против кого-то или чего-то. Дружить против явлений, которые твое - а затем и ваше сознание, наделяет значением «зло». Тем самым осознающий находит твердую почву под ногами и достаточно устойчивое счастье.\nВот давайте на этом месте поставим жирную пометку маркером, потому что оно очень важно. Важно, потому что именно на этом этапе сознанием проведена важная работа по созданию и приведению в реальный вид всей системы понятий и принципов, и собственно все в порядке - потому как ближайшее окружение и среда к этому моменту подобраны под устоявшуюся систему мировоззрений. Если вам нужен понятный пример - это ваша тщательно ранжировананная лента в фэйсбуке, состоящая сначала из тех, кого вы выбрали сами, а затем из тех, чьи мысли периодически выделяли. Так вот, когда ты стоишь на твердой почве и чувствуешь повсеместный положительный ответ и молчаливое согласие - как-то с трудом тебе кажется, что что-либо может изменится. И даже окружение себя единомышленниками - это наша собственная защита от возможных перемен в собственном мировоззрении. А вдруг какой-то голосок внутри начнет задавать вопросы? Нет. Если ты веган среди веганов, бывший наркоман среди трезвых, религиозный фанатик среди фанатиков - такой голосок просто утонет в страхе остаться в одиночестве с новыми мыслями, которые даже еще не приняли форму суждения, не устоялись в новую систему, даже не сформировали нужных вопросов.\nДа, чтобы идти дальше - ты должен остаться один. Все человечество пришло к молчаливому согласию, что дальше счастья идти некуда и не за чем. Система - это не зло, а удобный свод правил, или для удобства системой можно назвать что-либо другое, а свой мир и арсенал суждений назвать каким-нибудь более уютным словом. И этих уютных миров множество, ты уже знаешь, по каким социальным правилам нужно играть, чтобы попасть в нужную комнату, или даже переходить из одной в другую - если ты такой, мать твою, классный многогранный сукин сын.\nСкорее в
