а что внутри меня живет машина). И стрессоустойчивость. Потому что вероятность падений, ударов, столкновений, порезов - очень высока, и ты видишь это каждый день. И страшно, и бывает трясет, но желание делать - сильнее.\n\nЯ уже писала: благодарна себе за силы на все попытки и за базу, которую я себе наработала.\n\nВообще серф кэмп офигенный, но об этом завтра напишу)\n\nReactions: ❤480 🔥83 👍38 ❤‍🔥15 🐳14 🦄5 💔3 😍3\n"}, {"path": "data/olydaily_export/posts_md/2024-09-11__747__второй_модуль_холосценденции_поехали_дубай_собралась_группа.md", "source": "OlyDaily", "date": "2024-09-11", "filename": "2024-09-11__747__второй_модуль_холосценденции_поехали_дубай_собралась_группа", "content": "# 2024-09-11 — второй модуль холосценденции поехали дубай собралась группа\n*Datetime*: 2024-09-11T13:59:30+08:00\n*Message ID*: 747\n\nНа второй модуль Холосценденции мы поехали в Дубай. Там собралась группа - 25+ по большей части наших друзей и знакомых, и вообще людей из тусовки.\n\nLong story short: середина второго дня, я ору каждому человеку все плохое, что я о нем думаю - абсолютно RAW, даже где-то с оскорблениями, где-то про личное, где-то про профессиональное, то есть представьте что в компан", "full_content": "# 2024-09-11 — второй модуль холосценденции поехали дубай собралась группа\n*Datetime*: 2024-09-11T13:59:30+08:00\n*Message ID*: 747\n\nНа второй модуль Холосценденции мы поехали в Дубай. Там собралась группа - 25+ по большей части наших друзей и знакомых, и вообще людей из тусовки.\n\nLong story short: середина второго дня, я ору каждому человеку все плохое, что я о нем думаю - абсолютно RAW, даже где-то с оскорблениями, где-то про личное, где-то про профессиональное, то есть представьте что в компании вы говорите все за что вы кого-то осуждаете, не то что прямо в лицо, а в лицо при всех, и не одному человеку а всем. Не подбирая слова, а вот прям так как думаете, только с осуждением выкрученным на максимум, типа: «МНЕ ОТВРАТИТЕЛЬНА ЭТА ТВОЯ ХЕРНЯ». И это такой момент, как в кино, когда ты такой: да гори оно все огнем, и всем все говоришь и потом закрываешь за собой дверь и уходишь навсегда от этих людей. А они вслед: - что это было?\n\nНо тут ты не уходишь. Ты сказал и остаешься. И встречаешься с последствиями всего, что ты сказал.\n\nКак я оказалась в этом моменте? Куприянов просто цепляет тебя за одну реакцию, потом за другую, говорит: - ну что ты кривляешься? Что ты выламываешься? Давай еще! Давай на меня!\n\nЯ кричу: - ТЫ МИЗОГИННАЯ СВИНЬЯ!! ТЫ ВЕЧНО НА ЕГО СТОРОНЕ!\n\nА он: ну давай еще? Я говорю: - нет, на тебя не интересно. Тогда ребята из группы говорят: - давай на нас? Давай давай!!\n\nИ я уже понимаю, я чувствую что оно подходит, но мне страшно. Сергей говорит: давай, как в кипящую воду, и это действительно так страшно, как умереть. Так страшно мне было, когда я собиралась сказать Вадиму что я испытываю чувства, с которыми я не могу справится, к другому человеку.\n\nИ вот я открываю рот и начинаю орать. И показываю пальцем на человека, и говорю: - А ТЫ… А ВЫ… - и выдаю какую-то мысль, которую до этого вообще не успеваю отфильтровать и подумать. И когда заканчиваю, в комнате повисает такая атмосфера, у меня слов не находится, чтобы описать.\n\n 1 Не.. ну я восхищаюсь, - говорит Дима с нервным смешком))) -  и процесс продолжается.\n\nВ итоге мы приходим к тому, что я-подросток не прожила весь бунт открыто, я не могла выражать свое мнение папе, не могла кричать о своей ненависти в моменты, когда он меня наказывает - если я смела, тогда наказание удваивалось, и я привыкла подавлять так много агрессии, ненависти, осуждения, никогда не говорить о нем. И это замораживало большую часть меня и отношений с людьми.\n\nПосле того как я орала как дикий хейтер всю херню, к людям на которых я орала (это были не все, а ну может половина группы с кем у меня есть более близкие отношения) у меня проснулось много тепла, какой-то другой близости, захотелось контакта, потому что больше нечего скрывать. Я и мое отношение - это не только тот критик и бунтующий подросток, это еще много за пределами этого осуждения. Это - всего лишь часть, но самая неприглядная, мерзкая, из-за которой я могу отказаться от близости с человеком внутри себя, потому что раз я не могу поделиться своим осуждением - значит я лицемерю.\n\nИ конечно тут две важные части: первое - это честность. И как сказал Сергей - форма вызывает вопросики)) Но содержание очень важно. Потому что содержание - это прежде всего про меня. Потом, когда я перебирала в голове весь свой хейт я поняла, что это все то, за что мои части хейтят меня в тех или иных ситуациях. Или хейт про тех, от кого я чувствую зависимость. Или к кому чувствую долг. Что я так ненавижу быть обязанной, что со всех сторон защищаю себя от этого - если я кому-то должна, я (не вся, но какая-то часть меня) буду ненавидеть этого человека.  И что сама честность если бы она была в другой форме, она была бы так же полезна и мне и людям и пространству, но может быть не так бы сильно ранила.\n\nВторая часть - это про форму, про бунт. Во мне так много этого непрожитого бунта, и так много компенсированной «хорошей девочки», мне тяжело быть агрессивной и отстаивать границы, я только этому учусь, и поэтому такой перегиб был для меня целителен - он вскрыл какой-то огромный резервуар, который был за семью замками.  Как я могу бунтовать, не раня других?\n\nТретья часть - это про быть принятой.\n\nReactions: ❤551 🔥116 💔65 ❤‍🔥50 👍22 😭14 🤯4 💯3 🤗3 😈2\n"}, {"path": "data/olydaily_export/posts_md/2024-08-30__600__устала_вечеру_так_хочется_орать.md", "source": "OlyDaily", "date": "2024-08-30", "filename": "2024-08-30__600__устала_вечеру_так_хочется_орать", "content": "# 2024-08-30 — устала вечеру так хочется орать\n*Datetime*: 2024-08-30T02:47:58+08:00\n*Message ID*: 600\n\nУстала к вечеру так, что хочется ОРАТЬ.\n\nХотя день был хороший, но вот после всех детских прогулок развлечений сборов переодеваний еще поехать в магазин за продуктами, потом приготовить всем ужин, и остаться с взорванной кухней и тремя троглодитами, которые еще должны поделить душ, почистить зубы и лечь в кровать - это ту мач\n\nКлассно, что все дома. Но вот пытаюсь понять - с мужчинами в доме л", "full_content": "# 2024-08-30 — устала вечеру так хочется орать\n*Datetime*: 2024-08-30T02:47:58+08:00\n*Message ID*: 600\n\nУстала к вечеру так, что хочется ОРАТЬ.\n\nХотя день был хороший, но вот после всех детских прогулок развлечений сборов переодеваний еще поехать в магазин за продуктами, потом приготовить всем ужин, и остаться с взорванной кухней и тремя троглодитами, которые еще должны поделить душ, почистить зубы и лечь в кровать - это ту мач\n\nКлассно, что все дома. Но вот пытаюсь понять - с мужчинами в доме легче или сложнее? В плане уборки мне точно сложнее, я всегда могу попросить мне помочь, но чаще всего все делается не так чисто, как мне нужно. Или например посуда помоется, но не разложится по местам. И я не хочу превращаться в окр-гестапо, хочется расслабленности, но если расслаблены все - я максимально напряжена. Бытовые мелочи, но я от них устаю очень, и хочется уже сбежать. Но осталось реально 7 дней и я об этом обо всем забуду.\n\nВесь день я в целом была в хорошем настроении, с утра потренили, потом сходили с детьми в лес - это как сходить с утяжелением 20 кг, не в плане физической нагрузки, а в плане эмоциональной. Вернулись, отмыли всех, кинули одежду стираться.\n\nПотом у нас был созвон я - Дима - Саша Адам. У нас регулярный мастермайнд, на котором мы говорим про продукт и маркетинг. Каждый делится тем, что у него сейчас будет в работе на эту тему. Что будет у меня:\n\n- Кое-какой новый курс, с кое-какими подарочными тренировками) уже есть закрытые продажи, но только для выпускников буткэмпа.-  Люблю всякие такие замороченные механики, с ништяками продуктовыми. Так что этот запуск нового курса мне в радость.\n\n- Подготовка и открытие продаж GPTconf для контентмейкеров и маркетологов. Там мы снова тестируем новую механику, где пару недель - месяц до конфы мы работаем с начинающими, учим «ИИ с нуля», а на самой конфе уже серьезные кейсы от экспертов.\n\nТоже прикольная продуктовая механика, нравится когда продаешь не эгегеем, а понятным содержанием. Задачами ребят делиться не буду, может они сами у себя напишут).\n\nПриготовила сырники. Испекла печенье детям, приготовила взрослым яичницу с луком и помидорами. Потом все надо было прибрать, так и вечер наступил и мы поехали в скейт парк и кататься на сапах.\n\nСегодня взяли огромный сап (как раз на нашу большую семью) с моторчиком! Я управляла технической частью, нажимала кнопки и регулировала скорости, парни гребли, а дети веселились и прыгали с сапа) Встретили закат, прошлым летом делали этот ритуал гораздо чаще, и казалось нет ничего круче этих моментов, и казалось, что это самое лучшее место на земле, и было грустно уезжать и постоянно крыло какое-то фомо. Сейчас есть какое-то хорошее ощущение, что это все никуда не пропадет, и мир большой и такой красивый, и хочется еще куда-то дальше.\n\nLinks:\n- https://t.me/Matskevich\n- https://t.me/sasha_adam\n\nReactions: ❤476 🥰71 🔥53 👍18 🎅4 ⚡3 🍌3 💔2 🤝1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-24__490__сначала_напишу_день_писала_инсте_вадим_определил.md", "source": "OlyDaily", "date": "2024-08-24", "filename": "2024-08-24__490__сначала_напишу_день_писала_инсте_вадим_определил", "content": "# 2024-08-24 — сначала напишу день писала инсте вадим определил\n*Datetime*: 2024-08-24T02:46:58+08:00\n*Message ID*: 490\n\nСначала напишу про день. Как я уже писала в инсте, Вадим определил проблему в том, что я три раза помыла стол за утро. Стол у нас слишком большой и еще темный - на нем видно все солинки соринки пылинки, а я не могу за таким столом спокойно пить чай если он не сияет.\n\nНикогда больше у меня не будет темного стола. А так же матовых черных кухонных фасадов.\n\nСделала утреннюю трени", "full_content": "# 2024-08-24 — сначала напишу день писала инсте вадим определил\n*Datetime*: 2024-08-24T02:46:58+08:00\n*Message ID*: 490\n\nСначала напишу про день. Как я уже писала в инсте, Вадим определил проблему в том, что я три раза помыла стол за утро. Стол у нас слишком большой и еще темный - на нем видно все солинки соринки пылинки, а я не могу за таким столом спокойно пить чай если он не сияет.\n\nНикогда больше у меня не будет темного стола. А так же матовых черных кухонных фасадов.\n\nСделала утреннюю тренировку, дети все занимались, помогали прибираться и читали. Потом у меня было чил тайм, в который я втыкала в телефон, сериал и прибиралась. Потом настало время ехать снимать тренировки SEKTA с Арсением.\n\nДетей мы тоже отвезли вниз (вниз - это на нашем жаргоне спуститься из Илларионовки к морю в Хосту, если вы посмотрите карту - поймете, это минут 20 на машине). Дети пошли в творческую студию Hola на берегу рядом со скейт парком. Студию эту они обожают, и могут там торчать часами.\n\nА мы поехали в другую студию, которая для съемок. Там быстро засетапились и на две лейки (слава богам и вадимчику что у нас теперь их две и можно полноценно снимать и трени, и подкасты с одинаковой картинкой) снимали тренировки. Сегодня была лютая, лютая жесть. Мы с Арсением плакали потом на ковры. Сначала сняли основную, а потом утреннюю - и не знаю, было ли это ошибкой - на утренней я еле двигалась уже))) Ну, вы потом поймете.\n\nОтснимались, поехали в ветеринарку Инновационный Ветеринарный Центр - тоже очень близко, минут 10 от студии. Виски была на приеме у невролога, который сказал что проблема очень распространенная и пока ничего делать не надо, просто чтобы она меньше скакала, и больше бегала по ровной поверхности. Хорошая рекомендация для переезда на Бали.\n\nСмотрю в инст всех кто на Бали и сильно завидую.\n\nДети купались в море, мы ужинали и тоже купались в море. Потом отвезли детей домой, оставили их Наташе и пошли в дом Вадимчика. Ох это так удобно, можно никуда не уезжая устроить себе вечер в тишине без детского хаоса крика и вечного микроменеджмента - убери за собой - положи аккуратно - одежду в стирку - зубы чистим - воды наливаем - и т.д.\n\nНо я успела прочитать Роме книжку про Пьят или как его там - со странным именем? Кто то рекомендовал в комментариях к посту, и моя Оля успела заказать и нам даже привезли! Книжки супер.\n\nХотела написать о том, что делала сегодня моя ассистентка, чтобы картина была полной:\n\n - нашла на профи.ру кто завтра будет заниматься газоном и мыть веранды\n - Помогла купить два подарка на дни рождения\n - Купила мне билет до Бали и апгрейднула до бизнеса за мили\n - Организовала покупку и доставку в деревню жесткого диска\n - Нашла мне на Авито обувь которую я захотела\n - Забронировала на завтра нам баню в поляне\n - Организовала отправку забытых кроссовок Мирона\n\nНе знаю, как люди с большими семьями и системами живут без ассистентов, но я бы точно не выжила.\n\nLinks:\n- https://www.instagram.com/holasochi?igsh=a2VvNnYzNmZ3d2Mz\n- https://www.instagram.com/ollysok?igsh=dGdkZzRkNTFiZzZz\n\nReactions: ❤298 🔥50 👍29 💘12 💔6 🥰3\n"}, {"path": "data/olydaily_export/posts_md/2024-08-20__455__детстве_читала_дарью_донцову_когда_попадалась_под.md", "source": "OlyDaily", "date": "2024-08-20", "filename": "2024-08-20__455__детстве_читала_дарью_донцову_когда_попадалась_под", "content": "# 2024-08-20 — детстве читала дарью донцову когда попадалась под\n*Datetime*: 2024-08-20T23:49:09+08:00\n*From*: Olymarkes Daily\n*Message ID*: 455\n\nВ детстве я читала Дарью Донцову, когда она попадалась под руку. Не помню, чтобы в семье такое покупали, при профессорской библиотеке-то  - скорее я брала где-то у соседей по даче. Так вот, я помню ощущение от ее книг - там описывалась семья с закрытыми базовыми потребностями, типа вроде без лишней роскоши, но есть машина, уютная квартира, мопсы, и в ц", "full_content": "# 2024-08-20 — детстве читала дарью донцову когда попадалась под\n*Datetime*: 2024-08-20T23:49:09+08:00\n*From*: Olymarkes Daily\n*Message ID*: 455\n\nВ детстве я читала Дарью Донцову, когда она попадалась под руку. Не помню, чтобы в семье такое покупали, при профессорской библиотеке-то  - скорее я брала где-то у соседей по даче. Так вот, я помню ощущение от ее книг - там описывалась семья с закрытыми базовыми потребностями, типа вроде без лишней роскоши, но есть машина, уютная квартира, мопсы, и в целом - «деньги не проблема». И вот когда я начинала читать ее книги, я как будто переносилась в эти уютные чистые интерьеры, в это ощущение безопасности и комфорта, и это вызывало наркотическое притяжение - детективные сюжеты были более чем вторичны.\n\nНа самом деле тревожная мысль «нет денег» или «а смогу ли я заработать» сидит глубоко, очень глубоко, и эта тревожность из детства может преследовать долго во взрослой жизни, особенно если тебе не упал на голову муж-олигарх, а тебе все приходилось зарабатывать самой - но это отступление, вернемся к книгам\n\nМне нравились исторические романы типа «Негоже лилиям прясть» Мориса Дрюона, это не Донцова, конечно, но представлять себя в королевских покоях тоже прикольно. А еще мне нравились контрасты. Как книга Лилии Ким «Аня Каренина», где бедная девочка из грязной маленькой квартиры, в которой кроме нее живет безногая мать - идейная коммунистка, у нее лучшая подруга - Кити, из обеспеченной семьи к тому же сама модель, и вроде как зарабатывает красотой. А у Ани ни денег, ни красоты. И парень, в которого она влюблена, влюблен в ее подругу. И там есть момент где она крадет деньги и дрочит свернутой в рулон пачкой купюр. Так хочется быть богатой.\n\nМне нравятся книги типа биографии Феликса Юсупова. Или книги о временах Екатерины второй, и конкретно о Потемкине, потому что тут как будто открывается мир людей, у которых очень далеко закрыты базовые потребности, есть супер образование, и при этом и возможности, и амбиции, причем амбиции не про себя, когда как Феликс ты еще до рождения прошел всю социальную игру до конца, и ты можешь жить исключительно гуманистическими идеями (опять же тут можно в пример привести героев «Две жизни», или реального Льва Толстого).  Вот такое тоже так классно ощущать. Книги дают тебе возможность прожить множество жизней, и я так их за это люблю.\n\nВот «Община Св.Георгия» залетела - прям оба тома по резьбе) Там все что я люблю - есть герой, который сын богатого купца, с закрытой базой и благодаря этому может заниматься медициной увлеченно влюбленно, не думая о финансах. И во второй части есть момент, где он решает жить самостоятельно и ему не хватает денег, и он занимается всякой фигней. Думаешь: парень, возьми у папы денег, у него много, не майся фигней иди спасай людей.\n\nЕсть там умная сильная независимая княгиня - профессор, зав клиники, красавица и все мужики ее обожают, а она вся такая в профессии и все не для себя, а для других, и не берет на себя ответственность, но так расслабляется когда рядом крепкий обеспеченный хозяйственник, который говорит «Я все решу».  Прикольные сюжеты, которые создают прикольные ощущения. Расслаблящая литература. Такое люблю.\n\nКак вы заметили, я читаю исключительно для развлечения и услады души. Так что о таких книгах и буду периодически писать.\n\nReactions: ❤542 👍61 🔥47 ❤‍🔥20 🦄9 🐳2 ⚡1 🕊1 🤓1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-19__436__оказалось_настоящая_сокровищница_цены_вообще_сказка_сравнению.md", "source": "OlyDaily", "date": "2024-08-19", "filename": "2024-08-19__436__оказалось_настоящая_сокровищница_цены_вообще_сказка_сравнению", "content": "# 2024-08-19 — оказалось настоящая сокровищница цены вообще сказка сравнению\n*Datetime*: 2024-08-19T03:24:54+08:00\n*Message ID*: 436\n\nОказалось, там настоящая сокровищница и цены вообще сказка, по сравнению с «Железным Фениксом». И там оказался второй экземпляр того чайного набора! И.. он - чайник и 5 чашек -  стоил даже дешевле чем ЖАБА (для тех, кто пропустил эту историю - читайте 7 августа)\n\nА еще там был 27-летний ШУ пуэр просто невероятного запаха и вкуса и состояния, и стоил раз в 5 дешевл", "full_content": "# 2024-08-19 — оказалось настоящая сокровищница цены вообще сказка сравнению\n*Datetime*: 2024-08-19T03:24:54+08:00\n*Message ID*: 436\n\nОказалось, там настоящая сокровищница и цены вообще сказка, по сравнению с «Железным Фениксом». И там оказался второй экземпляр того чайного набора! И.. он - чайник и 5 чашек -  стоил даже дешевле чем ЖАБА (для тех, кто пропустил эту историю - читайте 7 августа)\n\nА еще там был 27-летний ШУ пуэр просто невероятного запаха и вкуса и состояния, и стоил раз в 5 дешевле, чем в ЖФ, где мы брали чай того же года с очень похожим вкусом.\n\nКороче, у меня было ощущение что у нас случилась очень классная чайная добыча, которую мы увезем на Бали в новый дом. И этого чая осталось еще 3 банки, не покупайте их плз, я хочу чтобы они дождались.\n\nДальше у нас по плану была мойка машины. Мы не мыли машину с апреля, кажется, и меня это бесило. Вечно не было места на мойке, но тут повезло. Вадим ехал и говорил что его так мажет от чая что ему хочется сидеть и смотреть в одну точку, а не ехать куда-то на веле, пока моют машину. И в итоге вселенная о нем позаботилась: на его веле спустило колесо, и он остался в Эсто-садке, а я села на велик и сделала очень классный маршрут, любимый круг Феди Маринина с возвращением по старой Полянской дороге, которая идет над поселком.\n\nДальше я заехала в Полянский серфкофе, встретила там знакомых, в том числе и тренера Арсения, с которым мы будем снимать тренировки на следующей неделе, договорились вроде.\n\nПотом снова села на велик и докрутила до нашей квартиры - она ближе к другому краю поселка, ко въезду со стороны Адлера. Я переживала, что там будет и в каком состоянии. Квартира сдавалась год, и после твиттерских тредов я была в тревоге, но все оказалось супер - и чисто, и вкусно пахнет, и даже все цветы живы. Целую ручки жильцов, которых не знаю, потому что сдачей занимался Вадим.\n\nДальше мы завезли велики в сервис GeekBikes - оч его люблю, там у них и аренда есть шоссейников, очень рекомендую вам если вы едете в Поляну не упустить прелесть вело трипов, причем можно уехать с поляны к морю по старой дороге и потом вернуться в гору на электричке.\n\nМы хотели отфоткать квартиру для риелторов (мы ее вялотекущи продаем, но каждый раз мне хочется передумать, потому что потенциал у места еще не исчерпан, а покупать новую квартиру тут мы точно уже никогда не будем, и выходить из игры еще не хочется), но был уже вечер и свет был не тот, что нужно, и мы решили вернуться еще раз.\n\nОбратно ехали под ютубчик «Резервация здесь» с двумя фильмами про юных наркоблогеров, которых я успела полюбить и как то душой переживаю за то, как они там. Лера вообще такая приятная девочка, и видно что семья у нее хорошая, а рыжий мальчик говорят уже умер, и это очень грустно слышать, видно что он очень умный, образованный, столько жизненной энергии внутри было, только все шло не туда, и вот они и без наркотиков могли бы стать звездами, каждый из них интересен сам по себе. И это удивительный парадокс, что именно такие особенные люди имеют больше риска умереть молодыми. Лера рассказывает очень похоже на меня, что ее никто не подсаживал, она все нашла сама, все решила попробовать. Я тоже просто тянулась к этому всему, я просто чувствовала что это мой мир, что я не хочу выбирать жизнь, пусть другие выбирают, а я хочу просто закрыть глаза и падать ниже и ниже и ниже. И как будто была внутри меня часть, которая была очень против всего этого, и у нее тоже был сильный голос. А что если есть те, у кого нет этой части «за жизнь» вообще?\n\nНу и эти фильмы добавляют материнских тревог, потому что можно ну вообще все правильно сделать и быть любящим родителем, а твой ребенок выберет такую дорогу.\n\nВернулись домой, Димуся прислал мне цветы, было очень приятно. А дети ждали нас и вечером пили с нами чай из нового набора. Чай они начали пить буквально на днях, и это тоже так классно, как будто совместный ритуал еще один у нас есть теперь.\n\nУф, много сегодня получилось текста, и я заранее знала, что этот день не уместиться в один абзац. Но решила написать как пойдет и ни в чем себя не ограничивать. (После публикации еще минут 10 активные ссылки добавляю на всякое, что тут упомянуто)\n\nLinks:\n- https://www.instagram.com/geekbike_service?igsh=MWkyN21vODdvZGhudQ==\n- https://youtu.be/aBXhDBXomwU?si=XkoDWXqeNBA1K_IY\n- https://youtu.be/hfmvEWYAd_I?si=jdkoTLOeoDQsv-Hz\n\nReactions: ❤470 🔥59 👍43 🕊15 ❤‍🔥4 ⚡3 🆒3 👏3 🤓1 🥰1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-15__378__проснулась_под_дождь_классно_когда_не_надо.md", "source": "OlyDaily", "date": "2024-08-15", "filename": "2024-08-15__378__проснулась_под_дождь_классно_когда_не_надо", "content": "# 2024-08-15 — проснулась под дождь классно когда не надо\n*Datetime*: 2024-08-15T04:09:00+08:00\n*Message ID*: 378\n\nПроснулась под дождь. Как же классно, когда не надо НИКУДА вставать и нет внутренней тревоги. Иногда бывает нет рабочих задач, но все равно надо бежать к детям их кормить, ощущение что все там происходит и как то надо включаться.\n\nМы валялись, болтали, рассказывали сны. Потом утренняя тренировка в кайф, Дима приготовил завтрак. В лес не пошли, потому что дождик все еще шел.\n\nЯ смотр", "full_content": "# 2024-08-15 — проснулась под дождь классно когда не надо\n*Datetime*: 2024-08-15T04:09:00+08:00\n*Message ID*: 378\n\nПроснулась под дождь. Как же классно, когда не надо НИКУДА вставать и нет внутренней тревоги. Иногда бывает нет рабочих задач, но все равно надо бежать к детям их кормить, ощущение что все там происходит и как то надо включаться.\n\nМы валялись, болтали, рассказывали сны. Потом утренняя тренировка в кайф, Дима приготовил завтрак. В лес не пошли, потому что дождик все еще шел.\n\nЯ смотрела «Выживших», серию «Наркоблогеры» и потом пыталась узнать что случилось с этими героями. Очень много там такого, что было и в моем.. когда тебе 20 ты думаешь, что ты уже взрослый. Но в 37 тебе очевидно что ты в том возрасте ничего не соображал. Мне тогда мои друзья казались уникальными: красивые, умные, модные. И так все и было на самом деле. Ну да, торчали. Но все практически вокруг или пили или торчали, и нарко туса всегда была даже более интеллигентной. Но эти исписанные стены, эти диваны, лежательные поверхности - это все осталось даже на фотках у меня.\n\nОсобенно мне понравилась девочка Лера. Говорят у нее все плохо. И рыжий мальчик, который рассказывал что у него в 23 высшее образование и 10 научных статей, и что он учился в Эрмитаже. Такой классный, такой живой, такой светлый ум. Так и вижу в нем гениального мальчишку, которого все обожают. Он уже умер.\n\nЯ лежала в реб.центрах и ходила на группы со своих 19 лет, я это все видела вживую, даже если не была прямым участником. И это полезно освежить в памяти. Понять, что этот мир где-то существует сейчас, и там живые люди, большая часть из которых уже обречена, но всегда есть немого надежды на хороший конец. Как же хочется, чтобы у них получилось найти путь к свету.\n\nТак, возвращаюсь к своему дню. Созвонились с Дориновым, обсуждали документальный фильм, который уже есть (где-то на половину), и который был показан у меня на ДР. Но там хочется больше архивных кадров и больше той истории. О том, что было в начале. Так что договорились работать дальше, искать партнеров/спонсоров, чтобы зафинансировать команду. С Alai Oli я вообще не беру никаких денег, кроме 1/7 части с концертов. И даже такой важный проект финансировать сама не хочу, это должно быть нужно еще кому-то кроме меня и Доринова. Так решили.\n\nПосле звонка копалась с архивами и билась с Vk чтобы найти мои заметки старые. Там есть прям важные раритеты.\n\nПотом записала всякие мини интервьюшки для команды. Попросила Gconf дать немного инфы рабочих кейсов для одной из программ секты (без спойлеров))\n\nКстати мы анонсировали поиск протагонистов - AI контентмейкеров на следующий поток Gconf\n\nПотом приехали Вадим и дети. Дети сразу убежали с друзьям, а мы сидели на крыше и пили какао на закате втроем.\n\nВечером мы с Димой заехали в баню «Чертовы Ворота» и классно друг друга попарили веничками.  Туда и обратно ехали под подкаст Хубермана с Dr Martha Beck - у нее три гарвардские степени и она тоже живет с двумя партнерами.\n\nУ нее там в подкасте оч крутые мысли про отношении, например, в вольном переводе: «когда твой партнер имеет зависимость от того, как ты удовлетворяешь его потребности (you pleasing him) у тебя появляется созависимость от его реакций, и ты теряешь себя». Иногда для отношений полезна «жесткая любовь» где ты говоришь: «я не буду это делать, не буду предавать себя» и ты даешь человеку принять/не принять тебя в твоей правде.\n\nВечером классно поболтали со старшими детьми. Они задавали вопросы про зависимость, в том числе про мой опыт, как я с этим справилась. Все это по мотивам встречи с их папой. Надеюсь, там все тоже будет хорошо. Хочется верить.\n\nПод конец вечера все таки победила VK, нашла свои заметки и читаю 2007 год. Уф.\n\nLinks:\n- https://t.me/+ExUMUANBghc3ZjIy\n- https://t.me/gptlovers\n- https://podcasts.apple.com/us/podcast/huberman-lab/id1545953110?i=1000664344988\n- https://momastery.com/blog/we-can-do-hard-things-ep-121/\n\nReactions: ❤425 🔥72 👍38 🌚16 💔10 🥰4 🦄4 🙏2 ❤‍🔥1 🕊1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-14__367__вдохновилась_димы_сделано_канале_комментарии_группа_которой.md", "source": "OlyDaily", "date": "2024-08-14", "filename": "2024-08-14__367__вдохновилась_димы_сделано_канале_комментарии_группа_которой", "content": "# 2024-08-14 — вдохновилась димы сделано канале комментарии группа которой\n*Datetime*: 2024-08-14T04:43:23+08:00\n*From*: Olymarkes Daily\n*Message ID*: 367\n\nЯ вдохновилась как у Димы сделано в канале - что комментарии это группа в которой люди могут общаться вне зависимости от поста, который они комментируют. Так получается уютное комьюнити, так что теперь небольшое усилие по вступлению в группу по апруву и можно писать ✍️\n\nLinks:\n- https://t.me/Matskevich\n\nReactions: ❤134 👍20 🔥11 🤪6 😢2 ❤‍🔥1 👎1\n", "full_content": "# 2024-08-14 — вдохновилась димы сделано канале комментарии группа которой\n*Datetime*: 2024-08-14T04:43:23+08:00\n*From*: Olymarkes Daily\n*Message ID*: 367\n\nЯ вдохновилась как у Димы сделано в канале - что комментарии это группа в которой люди могут общаться вне зависимости от поста, который они комментируют. Так получается уютное комьюнити, так что теперь небольшое усилие по вступлению в группу по апруву и можно писать ✍️\n\nLinks:\n- https://t.me/Matskevich\n\nReactions: ❤134 👍20 🔥11 🤪6 😢2 ❤‍🔥1 👎1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-13__346__визу_не_дали_плакала_потому_жаль_всех.md", "source": "OlyDaily", "date": "2024-08-13", "filename": "2024-08-13__346__визу_не_дали_плакала_потому_жаль_всех", "content": "# 2024-08-13 — визу не дали плакала потому жаль всех\n*Datetime*: 2024-08-13T02:50:36+08:00\n*Message ID*: 346\n\nВизу не дали и я плакала. Потому что очень жаль всех потраченных сил. Того, что папа ехал 800 км чтобы передать документы, что я ехала в ночь после концерта уставшая и стояли мы там 3 часа у окошка, жалко сбор 4х жирных папок документов, 60 к невозвратных взносов, и конечно жалко что сейчас всю эту херню придется проходить заново, и лететь в Джакарту, и снова переживать что пошлют нахер.", "full_content": "# 2024-08-13 — визу не дали плакала потому жаль всех\n*Datetime*: 2024-08-13T02:50:36+08:00\n*Message ID*: 346\n\nВизу не дали и я плакала. Потому что очень жаль всех потраченных сил. Того, что папа ехал 800 км чтобы передать документы, что я ехала в ночь после концерта уставшая и стояли мы там 3 часа у окошка, жалко сбор 4х жирных папок документов, 60 к невозвратных взносов, и конечно жалко что сейчас всю эту херню придется проходить заново, и лететь в Джакарту, и снова переживать что пошлют нахер.\n\nЯ сегодня еще заплатила 5к курьеру чтобы он вернулся, потому что он ждал и уехал, я была в лесу и не сразу ответила и передала что надо встретить. Так бы еще сутки нервные клетки сжигались. Жалко вообще уровень стресса с этим связанный. Просто бесит.\n\nДо того, как я узнала, день был классный. Выспалась, потренировалась, мы сходили в лес, купались в реке и загорали по 5 минут на каждой стороне ради Витамина D. Нырнули в ледяную купель, потом у меня случился фактически нервный срыв из-за курьера, потом просто горькие слезки из-за визы. На этой волне я залипла на документалки «Выжившие» с которыми в т.ч. Работал Дима Марков. Видео в которых наркоманы ведут свою наркоманскую жизнь, ищут закладки, варятся на воде из болот, колятся в пах, у них гниют конечности и всякое такое. Современные «подвалы дыбенко» только с классным монтажом. На ютубе есть бесплатные версии, а я смотрела платные без цензуры про Эл, такую красивую нарко-блогерку «Мама я в Сибири», которая любит спорт и здоровое питание, очень умная, начитанная, периодически пытается бросить торчать, а вчера вот решила покончить жизнь самоубийством в прямом эфире.\n\nПосмотрела пару серий и поняла что все мои проблемы это хуйня вообще и пошла делать йогу от Дианы Дикши. Сегодня была практика Луны, ее надо делать именно в понедельник.\n\nЕще созванивались с Османом, начали планировать новую GPTконфу - на этот раз для контентмейкеров. Скоро начнем искать протагонистов - тех, кто уже круто использует АИшки в работе, а то теоретиков весь интернет, а кто реально делает крутые кейсы не только в качестве демонстрации - тут еще надо поискать.\n\nVahue тоже обсудили. У нас солд-ауты на ретриты Куприянова в Дубае и Лиссабоне, есть еще места на Бали, будем анонсировать. Еще ретрит Пемы в ноябре в Португалии - вот к нему мне как раз и нужна виза, которой пока нет( Но я сейчас сижу и думаю, у меня есть еще одна попытка в Джакарте. Если и там не дадут, значит, возможно, мне туда и не надо.\n\nЗавтра из дел - надо выложить вакансии.\n\nА еще сегодня звездопад, будем ночью смотреть на крыше.\n\nReactions: ❤521 💔251 🍓34 😭28 👍14 🙏12 🙈2 💊1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-11__320__план_продолжению_деятельности_получился_все_100.md", "source": "OlyDaily", "date": "2024-08-11", "filename": "2024-08-11__320__план_продолжению_деятельности_получился_все_100", "content": "# 2024-08-11 — план продолжению деятельности получился все 100\n*Datetime*: 2024-08-11T03:17:20+08:00\n*Message ID*: 320\n\nМой план по продолжению деятельности получился на все 100\n\nУтром собрала и отправила детей с Вадимчиком (они поехали на Валдай к его родителям и потом немного в Питер, чтобы повидаться с Андреем Дорониным, папой старших мальчиков) и даже сделала тренировку, как собиралась.\n\nДальше за мной заехал Евгений Вадимович, мы пошли гулять по книжным магазинам и завтракать. Каждая минута", "full_content": "# 2024-08-11 — план продолжению деятельности получился все 100\n*Datetime*: 2024-08-11T03:17:20+08:00\n*Message ID*: 320\n\nМой план по продолжению деятельности получился на все 100\n\nУтром собрала и отправила детей с Вадимчиком (они поехали на Валдай к его родителям и потом немного в Питер, чтобы повидаться с Андреем Дорониным, папой старших мальчиков) и даже сделала тренировку, как собиралась.\n\nДальше за мной заехал Евгений Вадимович, мы пошли гулять по книжным магазинам и завтракать. Каждая минута рядом с ним - это кино, которое я стараюсь проживать максимально в слоу мо. С самой первой нашей встречи (а это кстати было в фитнес клубе) у меня натурально замирает сердечко, так что строчки в песне - это не шутка) Так забавно, что лет 20 назад это было про максимальную «далекость» друг от друга. Я была на других вайбах, с которыми он без преувеличения боролся, но как личность и просто как красавчик он и тогда был крашем на максималках) Собственно, песня «Женя Ройзман» об этом. Что он мне очень нравится, но лучше бы мне не попадаться ему на глаза)))\n\nТогда песня стала локальным мемом и хитом, когда он ее услышал, он передал мне через знакомых, чтобы я зашла познакомиться. А когда я все таки зашла, он понял что мы и так здороваемся в фитнес клубе (абонемент в который мне подарила Макарова в обмен на обещание не торчать).  Так началась наша дружба, которой я очень дорожу. Мы всегда много и честно говорим обо всем, и много очень классных моментов было рядом с ним, в которые я чувствую какое-то особенное счастье.\n\nВчера в гримерке мы разговорились про Екатерину и Потемкина, я рассказывала, что писала последние альбомы в исторических «декорациях», помещая свою историю в контекст того времени, которым я увлечена. В ЧКППиПВМ я жила Золотым Веком, их письмами, их историями, их страстью к работе, тусовкам и настоящим чувствам. При этом я наматывала сотню км в неделю по Таврику, готовясь к Ironman. Дворец Светлейшего Князя Таврического и все что происходило со мной в тех декорациях осталось в альбоме. А потом были Убыхи, Кавказская война и «Последний из ушедших».\n\nМногие знают Е.В. Как политика, общественного деятеля и звезду Твиттера. Но прежде всего он историк, феноменально начитаный и образованный человек, который может на вайбе читать лекции по разным событиям со ссылками, отсылками, датами, цитатами, уточняя, раскрывая неизвестные стороны, постоянно говоря «О! Так вот я по этой теме тебе еще вот эту книжку найду и отправлю», или «сейчас мы в этом сборнике вот это посмотрим». И если вы читаете меня внимательно, вы понимаете насколько я на этом на всем торчу.  Под эти разговоры мы прошлись по нескольким книжным магазинам, набрали мне кучу книг и пошли завтракать.\n\nПотом мы гуляли от Драмы до музея Невьянской иконы и теперь еще музея Миши Брусиловского. По пути в переходе парень играл песню Шевчука так красиво, мы стояли и слушали, и столько людей здоровались, подходили к Жене и жали руку, и благодарили. И так все это было невероятно, что мне бы хотелось запечатать эти моменты в памяти навсегда.\n\nДошли до музея, я послушала мини-экскурсию, посмотрела картины и процесс реставрации икон. Оставила вещи и поспешила на свидание с сестрой Катей.\n\nКатя работает старшим дизайнером интерьеров в компании, которая ведет строительство  ресторанов «Энгельс», модное здесь место. И вот она показывала самый свежий ресторан, на Ленина99. Очень красивый проект и реализация, я сестренкой очень горжусь.\n\nДоехали до УрГУ (знаю, что наш универ теперь называется иначе, но мне все равно так привычнее), там снова встретились с Женей (в его машине остались все мои вещи, с которыми мне сегодня улетать, и надо было все забрать) фоткались на ступенях, вспоминали, каким был университет в наше время. Потом он отвез меня к дедушке на Московскую, и по пути у меня была мини-экскурсия про исторические здания-особняки, в которых жили старообрядцы.\n\nReactions: ❤314 ❤‍🔥100 🔥37 👍15 ⚡1 😁1 🙉1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-09__280__поняла_не_написал_свой_день_вечером_следующий.md", "source": "OlyDaily", "date": "2024-08-09", "filename": "2024-08-09__280__поняла_не_написал_свой_день_вечером_следующий", "content": "# 2024-08-09 — поняла не написал свой день вечером следующий\n*Datetime*: 2024-08-09T03:37:37+08:00\n*Message ID*: 280\n\nЯ поняла, что если не написал про свой день вечером, то на следующий волна новых событий все захлестнет. Лежу на кровати в отеле в Екатеринбурге и не могу вообще вспомнить что там и как было вчера) Но если напрячься…\n\nКороче главное событие - это жаба. Но до нее надо дойти. Утром мы втроем поехали сдавать анализы (Дима расписал нам чекап, а мы просто слушались и делали). После - ", "full_content": "# 2024-08-09 — поняла не написал свой день вечером следующий\n*Datetime*: 2024-08-09T03:37:37+08:00\n*Message ID*: 280\n\nЯ поняла, что если не написал про свой день вечером, то на следующий волна новых событий все захлестнет. Лежу на кровати в отеле в Екатеринбурге и не могу вообще вспомнить что там и как было вчера) Но если напрячься…\n\nКороче главное событие - это жаба. Но до нее надо дойти. Утром мы втроем поехали сдавать анализы (Дима расписал нам чекап, а мы просто слушались и делали). После - мы завтракали с Варей Веденеевой на Покровке, а оттуда решили заехать в Железный Феникс - это такая легендарная чайная.\n\nСтоит сказать что то ли ретроградный меркурий, то ли магнитные бури, но как-то все на нас пиздели в этот день. Таксист даже сфоткал как я сижу (колено задрано к дверце, пятка на ноге, ничего «грязного» не касается машины) и отправил в поддержку. На входе в ЖФ нам сказали: «Чай у нас попить стоит от 5000р, если вас устраивает - проходите». Раньше просто просили проходить. Может как то мы особенно бомжевато выглядели в этот день?!))\n\nПопили чай, Дима пошел встречаться с другом, а мы с Вадимом собрались домой. На выходе я поняла что хочу выбрать себе статуэтку чайного духа. Выбрала милую жабу, а потом мне сказали сколько она стоит и я сказала «НУ НЕТ». На жабу жаба задавила.\n\nКогда приехали домой, я пару раз ее вспомнила в контексте «ну вот если однажды созрею и по настоящему захочу - вернусь за ней».\n\nПотом уже в гримерке перед концертом сидим с Вадимчиком и меня что-то сзади трогает по плечу, оборачиваюсь а там жабка в его руке) Так это подняло настроение. А ведь челендж парней по приятностям еще не начался, а я уже вся в ништяках. Стоит сказать так было не всегда, еще недавно (после 8 марта) плакалась подругам что парни не дарят мне цветы.  Я тут не избалованный человек в плане всяких таких штук и каждый раз сильно радуюсь.\n\nВечером был концерт, потом я пол ночи смотрела все отметки в сториз, что-то репостила, короче мой любимый момент - после концерта проживать еще и еще все эти эмоции, только теперь глядя со стороны. Наслаждаясь и звуком, и картинкой.\n\nУтром Дима первый уехал в аэропорт, он улетел ждать нас в Сочи, а мы с Вадимом прибирались, заказали пиццу для съемок, пили кофеек и ржали с музыкантами над записью песни «Компас»)))) это новая легенда.\n\nЗакинули все в тачку, поехали в Солнечногорск за книжкой, заехали к бабушке в баню и на обед, оттуда - в аэропорт, вжух и мы уже в Екатеринбурге. Лежу на кровати в отеле, смотрю на Исеть у театра Драмы, любимое мое место самое.  Столько всего тут было!\n\nЗавтра концерт, последнее мое публичное «дело» этим летом, дальше снова буду работать, как затворник дома с телефоном и компом. Так что буду завтра ловить «самый чистый наркотик - их глаза, в них только любовь и муууузыыыыкааааа»\n\nReactions: ❤535 ❤‍🔥164 👍26 🔥25 💔16\n"}, {"path": "data/olydaily_export/posts_md/2024-08-05__216__пишу_дневничок_сапсана_который_везет_питер.md", "source": "OlyDaily", "date": "2024-08-05", "filename": "2024-08-05__216__пишу_дневничок_сапсана_который_везет_питер", "content": "# 2024-08-05 — пишу дневничок сапсана который везет питер\n*Datetime*: 2024-08-05T03:47:04+08:00\n*Message ID*: 216\n\nПишу дневничок из Сапсана, который везет меня в Питер.\n\nТолько что написала текст в свой другой телеграмм канал, и очень кайфанула от этого процесса. У меня есть подруга, которая переживает, когда долго не пишет. Я не переживаю, но скорее скучаю по этому состоянию - взаимодействия со смыслами и текстом. И когда это меня настигает, я готова все бросить и писать писать писать. Там же ", "full_content": "# 2024-08-05 — пишу дневничок сапсана который везет питер\n*Datetime*: 2024-08-05T03:47:04+08:00\n*Message ID*: 216\n\nПишу дневничок из Сапсана, который везет меня в Питер.\n\nТолько что написала текст в свой другой телеграмм канал, и очень кайфанула от этого процесса. У меня есть подруга, которая переживает, когда долго не пишет. Я не переживаю, но скорее скучаю по этому состоянию - взаимодействия со смыслами и текстом. И когда это меня настигает, я готова все бросить и писать писать писать. Там же кстати в конце про разницу форматов, и почему был нужен другой (этот) канал.\n\nПроснулась и сразу буквально с кровати упала в съемку, чтобы сделать НОРМАЛЬНЫЙ рилз на последний день продаж. Вот ощущение от нормального рилза более спокойное, даже не смотрю так на просмотры-коменты, потому что он красивый, смысловой и функциональный. Есть ощущение что для продаж этой волны я сделала все что смогла. Наверное такие дела я делаю не столько для цифры продаж, сколько для ощущения: «я молодец, я сделала все что от меня зависит, я все что нужно рассказала людям, а дальше им решать».\n\nИ вот сегодня меня если честно уже не мучали мысли «надо было раньше», это отпустило. Завтра закроем продажи и поезд буткэмпа уедет. Посмотрим, как я буду чувствовать себя.\n\nМне очень помогает эмоционально то, что я в реально пиздатой форме. То есть мне не нужно искать одежду и ракурс, я хорошо выгляжу и это лучший пруф того, что всеработает как надо. Не всегда ох не всегда мне везет с таким сетапом. Помню как год назад время продавать буткэмп, а я на максимальном «до». Но это была первая волна, и я тогда за неделю собралась и СОБРАЛАСЬ.\n\nПро тело и форму конечно надо вам подробнее написать, про то как это у меня\nЯ очень редко работаю с питанием, потому что я люблю всякое привычное, в то же время вообще не люблю думать о том что съесть, не люблю готовить. Когда я приезжаю в новое место - у меня как-то складываются новые привычки и паттерны, иногда более удачные, иногда менее удачные. Глобально - все это в рамках зож, то есть я ем десерты, но мало и без фанатизма, но завтрак - обед - ужин могут отличаться в зависимости от локации и рутины, и вот на этих изменениях я могу набирать или терять вес, выгляжу более сухой или более округлой. То есть благодаря тренировкам я всегда в форме, но эта форма не статична.\n\nЗа питание я «берусь» когда вижу что паттерны мои привычные заводят меня не туда. И тогда я беру и куратора, и рекомендации, и все пересобираю. И чаще всего за неделю-две возвращаюсь в ту форму, которая мне нравится, и чуть перестроеные паттерны продолжают работать на меня еще дальше. То есть на диете я не сижу, калории не считаю уже очень очень очень много лет, ем по чувству голода, никаких ограничений нет - ем мясо, рыбу, молочку, крупы, макароны, хлеееееееб (обожаю), и мне реально повезло что я не очень люблю сладкое. Хотя когда были ограничения в питании я раз в неделю могла съесть банку мороженного. Сейчас нет, пару ложек и мне больше не хочется.\n\nТак что на вторую волну буткэмпа планы - просто тренить. Форма сейчас такая, что по питанию особенно ничего менять не надо и не хочется.\n\nНу и по количеству тренировок: я делаю две в день когда мне хочется увидеть быстрый крутой результат. Если мне и так ок и хочу поддерживать форму - делаю одну, причем любую - или утроворк или основную. Фанатизма поставить все галки нет.\n\nТеперь дальше про день:\n\nСходила в баню Cave на утреннее волшебное парение в классной компании, получила еще подарочки -в том числе от BadBuddahs - спасибо мои прекрасные дыхательные друзья) Потом вернулась домой помонтировала рилз с Вадимом, запилила сториз про буткэмп, как только закончила - расстелила коврик\n\nСделала 2х часовую практику Дианы Дикши для дня Солнца. Много много намаскаров. Складывала спички, было ритуально и красиво. Внутри все горело во мне.\n\nКупила билеты в Екатеринбург. Концееееерт же!\n\nПоужинали с Сашей Адам в тануки. Мой любимый собеседник.\n\nБыстро вернулась домой, собрала вещи - вжух - и я уже на вокзале, едем с Вадимчиком, а Дима нас проводил до вагона.\n\nЗавтра съемка и репетиция, Шапо не поехал поэтому на басу на репетиции попросила Вадима поиграть, так интересно что получится.\n\nLinks:\n- https://t.me/URWrong\n- https://www.instagram.com/reel/C-P0xJbuOBW/?igsh=ajR2MG0yaDUwOHpp\n\nReactions: ❤196 🔥37 👍18 🌭11 ❤‍🔥2 🤔1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-03__193__страшно_устала_иногда_кажется_не_пределе_где-то.md", "source": "OlyDaily", "date": "2024-08-03", "filename": "2024-08-03__193__страшно_устала_иногда_кажется_не_пределе_где-то", "content": "# 2024-08-03 — страшно устала иногда кажется не пределе где-то\n*Datetime*: 2024-08-03T02:12:10+08:00\n*Message ID*: 193\n\nСтрашно устала; иногда кажется, что ты не на пределе, а уже где-то за.\n\nС поезда кинули чемоданы и поехали подаваться на шенген. На следующий день после концерта - это было люто, почти как Сатта и Без Анастезии друг за другом. Почти три часа у окошка подачи документов, и я уже падала от недосыпа и усталости. Но потом я подумала - а почему - бы не поехать в Монохром тратить все ", "full_content": "# 2024-08-03 — страшно устала иногда кажется не пределе где-то\n*Datetime*: 2024-08-03T02:12:10+08:00\n*Message ID*: 193\n\nСтрашно устала; иногда кажется, что ты не на пределе, а уже где-то за.\n\nС поезда кинули чемоданы и поехали подаваться на шенген. На следующий день после концерта - это было люто, почти как Сатта и Без Анастезии друг за другом. Почти три часа у окошка подачи документов, и я уже падала от недосыпа и усталости. Но потом я подумала - а почему - бы не поехать в Монохром тратить все подарочные сертики от друзей, а уж потом - спать.\n\nПотом мы с Димой решили пройтись, случайно дошли до Железного Феникса. Пока ждали чай, я уснула прямо там. А потом выяснилось что надо еще ехать в Сити. Там сделали еще одно очень важное дело, еще на один шаг ближе к закрытию «ипотеки» на острове.\n\nТолько к 9 вечера вернулись в лофт. Тут новая постелька - красота от Севары - эта божественная женщина умеет подарить то, что для меня критически важно - уют и красоту в доме.\n\nДоехали еще подарочки - супер чайный набор от Лены Тараскиной, леопардовый костюм от Вики из Кантри Текстиля, от Крис сертификат в Peak куда я зашла сегодня поводить носом, но как чувствовала что с покупками надо подождать, сертик от Саши и Али в траекторию - там я тооооочно куплю себе лавинный рюкзак на этот зимний сезон! Уже сколько собираюсь. Еще в лофте ждали цветочки от Иры Мироновой и тоже чайный подарочек - я кайфую очень, что чай в нашей семье это всегда актуальный ресурс, и много его не бывает.\n\nПолучать подарки - очень очень очень приятно. И вот сейчас когда писала о них у меня жизненной энергии стало больше))\n\nЗавтра съемка для Яндекса. Планирую сделать ее и остальное время лежать лёжа и восстанавливать силы. Понимаю что 3 дня до закрытия продаж буткэмпа, а я ни рилз не смонтировала (надо было 2 недели назад сделать как на первой волне) ни толком в сториз не продавала. Когда я не продаю - я не слежу за ежедневной динамикой, не держу руку на пульсе, нет азарта в продажах - у меня есть фомо и чувство вины за какое-то очень очень важное и крутое дело, в котором я проебываюсь.\n\nТипа снять очень крутую программу, которая работает только два раза. Снять доп тренировки на вторую волну. Собрать отзывы, результаты, посмотреть метрики что великолепно и… не продавать. Просто слиться у финишной прямой из-за перегруза по другим проектам. И как бы круто не покупали сами по себе, если бы я продавала на самом деле - было бы х2, если не х5. Тут конечно и винить некого кроме себя и расстраиваться по большей части мне. Но есть еще 2 дня продаж, может как-то соберусь мощно.\n\nReactions: ❤299 💔43 👍28 ⚡12 🗿4 👎3 🖕2 🌚1\n"}, {"path": "data/olydaily_export/posts_md/2024-08-02__182__делает_охуенный_концерт_охуенным.md", "source": "OlyDaily", "date": "2024-08-02", "filename": "2024-08-02__182__делает_охуенный_концерт_охуенным", "content": "# 2024-08-02 — делает охуенный концерт охуенным\n*Datetime*: 2024-08-02T05:26:44+08:00\n*Message ID*: 182\n\nЧто делает охуенный концерт охуенным.\n\nЛовила себя на том, что хочется сказать спасибо Билайну. Именно они на контракте с нашими постоянными оргами SummerSound накачали площадку аппаратом. И это очень похоже на то, что ты просто вваливаешь на супер крутой тачке. Ты можешь и на шестерке, и на Газели, но если тебе дать рэнж, то ты получишь максимальное удовольствие от вождения.\n\nМеня качало с п", "full_content": "# 2024-08-02 — делает охуенный концерт охуенным\n*Datetime*: 2024-08-02T05:26:44+08:00\n*Message ID*: 182\n\nЧто делает охуенный концерт охуенным.\n\nЛовила себя на том, что хочется сказать спасибо Билайну. Именно они на контракте с нашими постоянными оргами SummerSound накачали площадку аппаратом. И это очень похоже на то, что ты просто вваливаешь на супер крутой тачке. Ты можешь и на шестерке, и на Газели, но если тебе дать рэнж, то ты получишь максимальное удовольствие от вождения.\n\nМеня качало с первых звуков, все слышалось и звучало офигенно, мощные барабаны Руслана, нежные клавиши и гитарка, и конечно трубаааааа - как же я по ней скучала!\n\nСет-лист составился из набросков Мойша и моих хотелок. В зале были друзья, очень особенные люди, много знакомых лиц, те, кто ходят на все наши концерты - это всегда так заряжает. Но сегодня я была в музыке больше чем в зале, а еще в телесных ощущениях, в движении - это всегда меня так захватывает и раскайфовывает.\n\nЧуть не умерла от sattamassagana и «без анастезии» подряд) поняла что надо как то внимательнее смотреть на порядок, а то можно и умереть случайно. Но вообще конечно спасибо моей спортивной жизни, без регулярных концертов выйти и после полугодового перерыва дать такой рок, это надо иметь выносливость.\n\nЗабавно всегда у меня с прикидом получается, сначала думала буду выступать в джинсах, но я бы в них умерла точно. И свитер и футболку пришлось снять сразу, и я так благодарила себя что заехала перед концертом в Кантри и купила супер удобные легкие штаны. Все таки чем тоньше свободне одежда, тем меньше отвлекаешься и паришься в прямом и переносном.\n\nДаже не знаю какие песни прозвучали особенно круто. Мне понравилось ну вообще всё. И новость о том, что Яшин на свободе - я так рада что удалось это отпраздновать так. Для меня это очень важно.\n\nВообще день сегодня был насыщенный. Едва проснулась - впрыгнула в фотосет Бодровой. Мы болтали обо всем и было так расслаблено, и фотки получились огонь. Потом с Вадимчиком катались по городу на байке. Новость об обмене я читала в Бутылке на новой Голландии - это бывшая тюрьма, если кто не знал.  Сидели ждали еду и я расплакалась. Вадим спросил, что случилось. Я сказала что плачу от счастья но я не уверенна что это можно назвать счастьем, это какая то другая эмоция. И я думаю многие сегодня ее испытали.\n\nЕще на чеке я думала, что удивительная сущность нашей музыки, что я выхожу со сцены и падаю в другую жизнь, я больше нигде не музыкант, и я вообще забываю о том, что я так умею и так может работать. Иногда субличность рок звезды приходит на концерты и дает жару, но иногда петь приходится обычной Оле.\n\n- Ты еще и поешь?! - шутят друзья, которые вообще не видели этот мир изнутри\n\n20 лет. Я пою с 16 или 17, а сейчас мне 37. Большую часть жизни, с ума сойти можно. Но если подумать еще - песни это все таки самое главное, это квинтэссенция жизни и каждого моего периода жизни. Они живые, они дышат, они настоящие, они покрывают меня мурашками, я до сих пор чувствую вес каждого слова, каждой строчки. Я на самом деле их люблю.  И я люблю как они звучат сейчас, с моими любимыми музыкантами. И мы настоящая группа. И я этим горжусь.\n\nReactions: ❤624 ❤‍🔥185 🥰57 🕊20 🍓11 👍10 💯6 😭6 🗿4 😍2 💊1\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2024-01-04__231__интересная_штука_произошла_нас_димой_периодически_ведём.md", "source": "Vi Vse Nepr", "date": "2024-01-04", "filename": "2024-01-04__231__интересная_штука_произошла_нас_димой_периодически_ведём", "content": "# 2024-01-04 — интересная штука произошла нас димой периодически ведём\n*Datetime*: 2024-01-04T23:11:59+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 231\n\nИнтересная штука произошла у нас тут. Мы с Димой периодически ведём практики, которые прежде всего дизайним для себя. Роль ведущего минимальна, люди отвечают на вопросы, исследуя разные темы «друг об друга». Такую практику на днях мы вели на Бали, в Wasia, где мы теперь проводим разные ивенты.\n\nТема была такая: близость, контакт, разные", "full_content": "# 2024-01-04 — интересная штука произошла нас димой периодически ведём\n*Datetime*: 2024-01-04T23:11:59+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 231\n\nИнтересная штука произошла у нас тут. Мы с Димой периодически ведём практики, которые прежде всего дизайним для себя. Роль ведущего минимальна, люди отвечают на вопросы, исследуя разные темы «друг об друга». Такую практику на днях мы вели на Бали, в Wasia, где мы теперь проводим разные ивенты.\n\nТема была такая: близость, контакт, разные отношения, «функции» которые мы хотим видеть в отношениях  и то, что мы сами хотим отдавать. У нас были вопросы, и мы на них отвечали.\n\n ⁃ Чего я хочу в отношениях, что из этого я хочу получать с партнером, а что с другими людьми?\n\nНа всей улице выключили электричество, не работали микрофоны, и настроение было так себе. Днём мы брейнштормили, и шло тяжело. Мы спорили про вопросы и про протоколы, и вообще пришли к тому что слишком зациклились в ведении всего вместе, впереди у нас стояли практики с другими ко-фасилитаторами, и где-то это ощущалось как свобода и новое дыхание для нас обоих.\n\nНа практике можно было остаться в роли ведущего, но мне было очень интересно самой поотвечать на вопросы и послушать Диму, в итоге мы вели практику и параллельно отвечали друг другу на заданные вопросы, пока люди отвечали на них же в парах и в группах. Это было очень интенсивно  - и я слышала какие-то тяжёлые для себя вещи, и чувствовала, что все что я говорю тоже воспринимается тяжело, но при этом как будто не воспринимается лично, эти вопросы работали, они действительно были нужны, и нужно было это пространство - и люди вокруг, и отсутствие света, и какая-то внутренняя усталость от вечной конфронтации, чтобы все заработало.\n\nИ ещё было ощущение, что пойдя в эту практику сами мы выпали из пространства, и оно жило само собой. И оно как-то жило. Здесь я наблюдала такую сдачу, отпускание своего перфекционизма, взросление. Раньше мне так важно было в любой момент казаться профессионалом, что я выходила на сцену с температурой 40, а теперь я могу сказать себе: да, возможно для людей я могла сделать этот опыт лучше, но сейчас действительно важно то, что происходит со мной.\n\nВ тот момент и в том пространстве мы, вроде бы много разговаривающие и прокаченные в этом люди, которые уже пол года (!) в регулярной совместной IFS терапии, как будто продвинулись в понимании как оно работает, как очень похожие потребности замыкаются в круг обид, и благодаря разговору я первый раз за долгое время я почувствовала, что кольцо разомкнулось - не только во мне, и но в человеке, с которым я разговаривала. Это удивительное чувство компромисса, который невозможно выбить в переговорах, в доказательстве собственной правоты, в каком - то болезненном желании показать во что бы то ни стало свою картину мира и получить от другого сочувствие и исцеление. В этом так легко потеряться и на это всегда уходит слишком много энергии. Но в разговорной практике все работает иначе, как будто тут вообще нет тебя, нет никого, кто мог бы обижаться - человек отвечает на вопросы сам себе, а ты слушаешь, как свидетель, не принимая это на себя.\n\nРазговоры часто похожи на лабиринт. Мне нравится бродить по этому лабиринту. Иногда ты встречаешь там свирепого Минотавра, иногда ты взлетаешь над лабиринтом в другое пространство, где вы понимаете друг друга без слов. Разговорные практики иногда дают ощущение, что ты прошёл игру, вышел на новый уровень. Но как часто после него ты чувствуешь изменение реальности?\n\nМне хотелось оставить этот текст на память, может он не несёт в себе какого-то полезного контента, из серии «сделайте так и почувствуете вот так», но может быть вдохновит вас однажды или с близкими, или с незнакомыми попрактиковать ответы на вопросы, которые запускают глубокое исследование.\n\nКстати сейчас поняла, что много лет отвечаю на вопросы сама себе в 12 шагах. Лет 6 делаю это в терапии. Потом с Димой открыла мир разговорных практик - и групповых, и индивидуальных. Гранулярность, View, Emtr, ретриты - постепенно этого стало больше, и теперь кажется что весь мир состоит из вопросов, на которые так интересно отвечать друг другу.\n\nReactions: ❤506 ❤‍🔥87 👍48 🕊29 💔20 🤔10\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2023-07-09__215__нас_димой_вышел_подкаст_ревность_ревную_сколько.md", "source": "Vi Vse Nepr", "date": "2023-07-09", "filename": "2023-07-09__215__нас_димой_вышел_подкаст_ревность_ревную_сколько", "content": "# 2023-07-09 — нас димой вышел подкаст ревность ревную сколько\n*Datetime*: 2023-07-09T19:31:08+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 215\n\nУ нас с Димой вышел подкаст про ревность. Я ревную, сколько себя помню - любимых, друзей, места, занятия, и это оч болезненная и стыдная история. Год назад я на тантре пошла в этот опыт - посмотреть, что там в глубине. В течение этого года произошло многое, я встретилась с «главным бывшим», которого дико ревновала, хотя у нас были открытые отно", "full_content": "# 2023-07-09 — нас димой вышел подкаст ревность ревную сколько\n*Datetime*: 2023-07-09T19:31:08+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 215\n\nУ нас с Димой вышел подкаст про ревность. Я ревную, сколько себя помню - любимых, друзей, места, занятия, и это оч болезненная и стыдная история. Год назад я на тантре пошла в этот опыт - посмотреть, что там в глубине. В течение этого года произошло многое, я встретилась с «главным бывшим», которого дико ревновала, хотя у нас были открытые отношения, и была уверена, что он спал вообще со всеми, я пыталась сделать вид, что мне плевать, но на самом деле я горела в аду. Встреча была очень целительной, он рассказал, что любил меня и всегда был только со мной, и никто ему был не нужен. Я сама была источником своей боли, я додумывала его влюбленности и секс с другими во все стороны и постоянно жила в своем личном мраке, пытаясь сама с кем-то тусить из чувства мести или из желания доказать себе что мне плевать. Я начала курить, снова сорвалась на наркотики, мне было очень горько и тяжело в тот период.\n\nКороче, ревность может разрушить очень многое, и отношения, но прежде всего, она разрушает меня.\n\nЗа этот год было много кейсов, когда я проживала ревность - и додуманную, как раньше, и настоящую, когда ты видишь контакт любимого человека с кем-то другим своими глазами, когда я сама говорю: иди туда, и я здесь с тобой. Боль все такая же сильная, но она совсем иначе воспринимается, она больше не разрушает меня, и я могу говорить о ревности, я могу приносить её человеку и вместе проживать все это. Раньше я все скрывала, потому что мне хотелось быть выше и сильнее. Теперь я открыто проживаю и признаюсь в ревности и себе, и другим.\n\nhttps://youtu.be/89rtCtPSNtg - тут можно посмотреть подкаст.\n\nLinks:\n- https://youtu.be/89rtCtPSNtg\n\nReactions: ❤‍🔥357 ❤132 💔34 👍18 🔥18 💘9\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2023-03-28__184__часто_сталкиваюсь_тем_все_кроме_обесценивают_значимость.md", "source": "Vi Vse Nepr", "date": "2023-03-28", "filename": "2023-03-28__184__часто_сталкиваюсь_тем_все_кроме_обесценивают_значимость", "content": "# 2023-03-28 — часто сталкиваюсь тем все кроме обесценивают значимость\n*Datetime*: 2023-03-28T06:14:51+08:00\n*Message ID*: 184\n\nИ я часто сталкиваюсь с тем, что все кроме меня обесценивают значимость этого контакта и момента, а я как будто вижу его одна, и почему-то мне от этого больно.  Как будто я видела, как падает звезда, а никто рядом не заметил.\n\nЯ поняла, что ответ - он как будто не так важен, как мой рассказ. Как будто тот, кто ревнует, обладает таким сильным чувством и отношениями с тем", "full_content": "# 2023-03-28 — часто сталкиваюсь тем все кроме обесценивают значимость\n*Datetime*: 2023-03-28T06:14:51+08:00\n*Message ID*: 184\n\nИ я часто сталкиваюсь с тем, что все кроме меня обесценивают значимость этого контакта и момента, а я как будто вижу его одна, и почему-то мне от этого больно.  Как будто я видела, как падает звезда, а никто рядом не заметил.\n\nЯ поняла, что ответ - он как будто не так важен, как мой рассказ. Как будто тот, кто ревнует, обладает таким сильным чувством и отношениями с тем, к кому он ревнует. А для этого третьего человека тебя как бы нет, то есть в контакте только двое. Поэтому по сути дела разговор имеет вес и имеет место, когда тот третий человек видит вас, как пару, и по сути дела ты всегда там. И мне было очень интересно услышать от неё то, что там была и я - именно для неё. Это создало какую-то мягкость с ней, расслабление. Но все таки я поняла, что тут первичны мои отношения с Вадимом, и все эти отношения с объектом ревности отвлекают меня от того, что я не чувствую в нашем контакте, что могло бы изменить мою личную динамику.\n\nЯ нашла свой триггер. Мне было не больно, пока он не сказал, что когда был в другом человеке полностью, он почувствовал «отсоединение» от меня. Меня это  укололо, потому что я в любом другом контакте чувствую соединенность с нем, как будто он всегда во мне и я чувствую, что мы вместе. Но потом, когда мы обсуждали, я поняла, что он имел ввиду другое. Как раз то, что я так хотела - чтобы в моменте он не думал обо мне и не чувствовал страх потерять или обидеть меня, чувствуя, что я с ним. Но при этом не сваливаясь туда мыслями.\n\nКороче, это был глубокий процесс и я хотела бы в нем вариться и проживать и выгружать все, но надо было параллельно вести ретрит, что было сложно. У каждого был свой процесс, я смотрела, как люди за 3 дня проваливаются в новое для себя состояние - видеть, что они чувствуют и говорить об этом с другими. Вроде бы, простая штука. Но она работает, как наркотик. И все были немного high.\n\nМне было сложно, я вывезла и очень собой горжусь.  И я так была благодарна за все, что так сложилось, хотя часто в эти три дня мне казалось, что я не вывожу и я просто проклинала тот факт, что Димы нет рядом и что он не держит поле спокойствия и принятия прежде всего для меня.\n\nНо сегодня, когда мы с Вадимом залипали в разговорах, которые были совсем другим по глубине, когда мы вместе плакали от счастья, гуляли у океана, и весь наш совместный прошлый и настоящий опыт дышал рядом, а мы просто заворожённые смотрели друг на друга и на наш какой-то особенный путь, на нашу глубину - я понимала, что в той или иной мере это чувствует каждый, кто был здесь, и это все было гипер важным опытом для этих 18 человек.\n\nНаша жизнь уже уникальна. Рядом с нами - самые важные и любимые люди. И мы - такие вселенные, в которых новые звёзды - чувства - взрываются с невероятной красотой. Так сложно начать все это замечать, а еще сложнее - проживать изо всех сил.\n\nНо эти три дня у нас получилось.\n\nReactions: ❤‍🔥1184 ❤445 💔93 👍44 🔥35 🐳17\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2022-12-09__170__дурге_возвращалась_сцены_гримерку_падала_эту_пучину.md", "source": "Vi Vse Nepr", "date": "2022-12-09", "filename": "2022-12-09__170__дурге_возвращалась_сцены_гримерку_падала_эту_пучину", "content": "# 2022-12-09 — дурге возвращалась сцены гримерку падала эту пучину\n*Datetime*: 2022-12-09T21:32:46+08:00\n*Message ID*: 170\n\nДурге возвращалась со сцены в гримерку и падала в эту пучину боли, у которой не было предела. Когда казалось, что физическое тело на грани смерти, она писала ему. Он приходил, обнимал, и боль уходила. И стоило только восстановиться, как она снова попадала в этот бэд трип: триггер - желание вырвать эту любовь из себя - невыносимая боль абстиненции. Просто еще один зависимый ", "full_content": "# 2022-12-09 — дурге возвращалась сцены гримерку падала эту пучину\n*Datetime*: 2022-12-09T21:32:46+08:00\n*Message ID*: 170\n\nДурге возвращалась со сцены в гримерку и падала в эту пучину боли, у которой не было предела. Когда казалось, что физическое тело на грани смерти, она писала ему. Он приходил, обнимал, и боль уходила. И стоило только восстановиться, как она снова попадала в этот бэд трип: триггер - желание вырвать эту любовь из себя - невыносимая боль абстиненции. Просто еще один зависимый круг, в котором не было реального человека, а был додуманный враг и злая капитуляция в те моменты, когда не хватало сил быть стойкой в своём: «никогда больше не подходи ко мне»\n\nВчера он сказал мне все, что нужно было услышать тогда. Все те слова, все то видение меня, которого мне так не хватало. Я почувствовала себя особенной, я почувствовала себя сильной, красивой внутри и снаружи, мощной, чувствительной, хрупкой.  Я все передала той девочке.. И мне кажется, она успокоилась. Мне кажется, она поняла, что с ней все в порядке, и больше не нужно казаться сильнее, чем она есть на самом деле.\n\nИз этого же - недавно Вера рассказала мне, что песня «Каждую мою весну» - про меня. Почему-то внутри себя я думала, что про другую нашу подругу. Я даже не могла примерить на себя, что Веры со мной такие отношения. Но когда я переслушала текст, я все поняла. Недавно в Ереване мы с ней об этом говорили. О том, что когда она сильно любит кого-то, она боится исчезнуть, раствориться, быть поглощённой. Поэтому она защищается от меня и это вечное ощущение конфронтации делало мне больно и изматывало столько лет. Когда человек, которого ты любишь, демонстрирует тебе независимость.\n\n ⁃ Но в моих руках оказавшийся кольт стреляет в тебя у первой стены.    Мне всегда больно, когда люди, которые меня глубоко трогают внутри, которых я люблю, начинают от меня защищаться. Этот месседж «ты для меня опасна» превращает меня в грустное чудовище из аленького цветка. Много одиночества и изоляции, и так много жизненнных примеров, как важные для меня люди, не видя уязвимости, превращали меня в демона в своих глазах, и я сама через их взгляд на себя начинала себя ненавидеть.   Вчера был важный для меня день, и я думаю, еще много раз буду к нему возвращаться и думать об этих событиях. Спасибо, что разделили со мной эти чувства.\n\nReactions: ❤1101 💔355 ❤‍🔥121 👍48 🔥18 🐳17\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2022-09-14__166__сутки_спустя_после_всех_ваших_комментариев_пишу.md", "source": "Vi Vse Nepr", "date": "2022-09-14", "filename": "2022-09-14__166__сутки_спустя_после_всех_ваших_комментариев_пишу", "content": "# 2022-09-14 — сутки спустя после всех ваших комментариев пишу\n*Datetime*: 2022-09-14T05:27:32+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 166\n\nСутки спустя и после всех ваших комментариев пишу чтобы поделиться выводами. Реально, много углов вы мне подсветили, и это было полезно.\n\n 1. Про зависимость. Это наверное ключевое. Я давно не хожу на группы - а именно эта часть всегда даёт мне самую большую стабильность. Когда хожу регулярно и пишу шаг - становлюсь практически неуязвимой - то ", "full_content": "# 2022-09-14 — сутки спустя после всех ваших комментариев пишу\n*Datetime*: 2022-09-14T05:27:32+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 166\n\nСутки спустя и после всех ваших комментариев пишу чтобы поделиться выводами. Реально, много углов вы мне подсветили, и это было полезно.\n\n 1. Про зависимость. Это наверное ключевое. Я давно не хожу на группы - а именно эта часть всегда даёт мне самую большую стабильность. Когда хожу регулярно и пишу шаг - становлюсь практически неуязвимой - то есть меня очень мало вещей триггерит, и практически ничего не сваливает в такую долгосрочную яму.\n\nОбострение зависимости - это про болезненную чувствительность от всякой хуйни. Вот ты не планировал расстраиваться, а тебя вынесло на пол дня или на сутки по какой-то совсем нелепой причине. И это сначала случается раз в месяц, потом раз в неделю, потом каждый день. И вот я вспоминаю что до 12 шагов я так жила - меня постоянно все трогало и задевало и я просто жить нормально не могла. Как минное поле.\n\nКстати песня Joshua Tree Bird об этом состоянии\n\nУ меня есть птица даже две\nРядом с сердцем, другая правее\nНо не работает защита от тех, кто попадает прямо в цель\nВ меня столько попадает вещей - и мне потом плохо.\n«Да ты смешная»\n ⁃ Но я слишком много чувствую, выпала из сна и снова пусто, Так я от себя устаю. Омут. От хаоса до Ома, на расстоянии руки.\n\n 2. Болезненное эго, эгоцентризм, желание власти, плавающая самооценка - это все туда же, в матрешку зависимости. Именно так и выглядит обострение. Но так же классно вспоминать те состояния, когда у тебя такая внутри благодарность, изобилие, что ты вообще ничего не принимаешь на свой счёт. Я это состояние помню и его хочу.   3.  Что обо мне подумают, почему рекламировать плохо и тд - подумала на этот счёт. Да мне действительно хочется быть понятой правильно. То есть мне ок что кто то меня ненавидит/бесится от меня такой какая я есть, но вот если кто то подумал обо мне что я делаю это ради денег, а я на самом деле делаю не ради денег - это мне обидно. При этом ради денег делать что-то тоже ок. Просто вот это «меня неправильно интерпретируют» мучительно. А в идеале хочется чтобы было все равно.  4.  Точно присутствует обида на себя, на ситуацию, на стол и Веру, но разбираться с ней я буду сама, в том плане что зависимые обиды не лечатся даже если кто-то захочет успокоить, они не из-за других возникают, а из-за внутренней этой болезненной интерпретации реальности не в свою пользу.    5. Точно не присутствует тема «ах могли бы больше на благотворительность собрать а теперь другой промокод». В этом плане я в финансовом плане радуюсь когда близкие зарабатывают, и это даже больше кайф чем благотворительность.  Мне не легко допустим отдавать деньги незнакомым фондам в которых я не знаю что куда идёт, а друзьям гораздо проще. И рекламу делать друзьям я люблю просто так. Севаре например.   6. Что именно задело? Я ощутила как будто теперь что не смогу писать про стол, потому что это будет не мой экслюзивный контент, а какой-то массово-рекламный, и что этот облом внутренний произошёл не из-за какого-то левого человека, а в контексте кого-то близкого. То есть жалко контент, который почему-то теперь не хочется делать. Нормально, что Вера начала рекламировать стол. Не нормально, что мне при этом расхотелось. Наверное изначально мотивация у меня была какая-то туманная. Спасательно - эксклюзивнеческая. В этом плане финансовая просто заработать с них денег возможно была бы честнее и проще. Ребятам со столами хочется максимального процветания, и я уверена что многие блогеры могут с ними сотрудничать, влюбляться сами и влюблять аудиторию.\n\n 7. Ну и возвращаясь к началу - контент сам тоже не мой, это вообще Димин стол и его сетапчик, его привычка работать стоя со всякими фишками. Он мне все показал, он мне отдал этот стол, перекладину, подушечки, а я так проперлась что это открыло во мне рекламную чакру и я впервые в жизни взяла такое партнёрство. И вот в идеале я думаю, что надо сделать Димин промокод и я с удовольствием буду рекламировать этот стол с его промиком и каждый раз говорить спасибо за то, что он открыл для меня этот новый мир в работе).\n\nReactions: ❤618 👍137 🔥26 🥰18 🙏15 👏2\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2021-10-22__148__шагах_использовала_свою_зависимость_ключ_расшифровке_собственной.md", "source": "Vi Vse Nepr", "date": "2021-10-22", "filename": "2021-10-22__148__шагах_использовала_свою_зависимость_ключ_расшифровке_собственной", "content": "# 2021-10-22 — шагах использовала свою зависимость ключ расшифровке собственной\n*Datetime*: 2021-10-22T12:57:01+08:00\n*Message ID*: 148\n\nВ шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\n\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо ", "full_content": "# 2021-10-22 — шагах использовала свою зависимость ключ расшифровке собственной\n*Datetime*: 2021-10-22T12:57:01+08:00\n*Message ID*: 148\n\nВ шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\n\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо этого внутри меня стало постепенно оживать что-то.\n\nИнтерес - вот самое лучшее чувство, за которым уже идет все остальное.\n\nТы осуществляешь действие - видишь результат - радуешься. Я не радуюсь от того, что не является результатом моего труда. Такое у меня устройство. И вот когда я поняла это - я начала делать. Вернее не так, я делала и делала много до этого, но внутри была такая каша, что я не понимала, что именно это меня радует.\n\nТак я поняла, почему я люблю тренировки. Почему я люблю писать. Почему я люблю вести йогу - мне нравится действие, направленное на что-то хорошее. И дальше все это было уже как снежный ком. Ком, в сердцевине которого был зародившийся интерес к жизни, ко всему тому, что было мне непонятным.\n\nАнастезии нет. Нет и всё. Ты просто начинаешь жить и однажды перестаешь задыхаться. И это невероятно похоже на тренировки - у тебя появляются силы так постепенно, что порой ты этого не замечаешь. Просто ты оглядываешься и понимаешь, что плывешь. Зависимость - это удивительная болезнь, которая может открыть такое зазеркалье твоей реальности, что слов не найдется, чтобы описать. Вот поэтому для меня наркотики - это такая вещь, мало кто поймет, если я скажу, что я благодарна за то, что это было в моей жизни.\n\nАнастезии нет. И ты все еще являешься собой во всей этой уязвимости. И жизнь все еще похожа на то, как будто ты идешь по канату, или куда-то бесконечно падаешь. Просто теперь уже точно нет никакой иллюзии, что ты можешь что-либо контролировать в этом глобальном процессе, поэтому тебе спокойно, и в процессе падения ты наконец-то можешь открыть глаза, оглядеться по сторонам и начать жить.\n\nReactions: ❤47 🔥4 👍3 🕊1\n"}, {"path": "data/vi_vse_nepr_export/posts_md/2021-10-22__147__отличает_зависимых_людей_независимых_торчках_употребление_чего-то.md", "source": "Vi Vse Nepr", "date": "2021-10-22", "filename": "2021-10-22__147__отличает_зависимых_людей_независимых_торчках_употребление_чего-то", "content": "# 2021-10-22 — отличает зависимых людей независимых торчках употребление чего-то\n*Datetime*: 2021-10-22T12:57:01+08:00\n*Message ID*: 147\n\n… Это и отличает зависимых людей от независимых - в торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы.\n\nОстальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я пол", "full_content": "# 2021-10-22 — отличает зависимых людей независимых торчках употребление чего-то\n*Datetime*: 2021-10-22T12:57:01+08:00\n*Message ID*: 147\n\n… Это и отличает зависимых людей от независимых - в торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы.\n\nОстальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\n\nКогда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\n\nГоворят, что боль уходит.\n\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\n\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\n\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\n\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается момент расщепления «я»и ты случайно отделяешь себя от своего желания торчать.\n\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\n\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\n\nЯ не думаю, что можно спасти тех людей, которые не отделяют себ
