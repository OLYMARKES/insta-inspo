        const data1 = [{"path": "data/lj_export_clean/posts_md/87992__scar_tissue_автореферат.md", "source": "LiveJournal", "filename": "87992__scar_tissue_автореферат", "full_content": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу отложить телефон, читая Двач до 2х часов ночи. Когда я одна - я как будто остаюсь дома без родителей. Когда нет жесткого контроля извне - я как будто разрешаю себе все. Но разве при людях я запрещаю? Разве люди являются гарантом моего правильного поведения? Ну нет же (это я успокаиваю себя). Если бы я чаще была одна - это бы устаканилось. Я бы компенсировала себе все, а потом бы вернулась на привычные рельсы. Но одиночество - это недоступная.. не буду говорить, что роскошь. Опция. Недоступная в длительной продолжительности опция.\nКогда-то анонимные наркоманы сказали мне: может быть торчать ты еще будешь, но удовольствие мы тебе точно попортим. Не сказать, что я получала удовольствие от наркотиков до этого. Во всем этом было очень много истерики - я хочу, хочу так сильно, как ничего на свете не хотела. Даже не так: мне надо. Мне просто надо. Есть? Дайте. Есть сильнее? Дайте. Есть больше? Дайте. Точно так же анонимные наркоманы попортили мне удовольствие от многих других вещей в трезвости- например, от втыкания в телефон или от покупок. Даже если я продолжаю делать что-то подобное - я осознаю, когда мной руководит зависимое поведение. Я не употребляю 6 лет и 7 месяцев, но при этом я каждый день ловлю себя на зависимом поведении. Думаю, именно это помогает мне оставаться в потоке - продолжать писать шаги и не пробовать изменять сознание в надежде, что сейчас это приведет меня куда-то в место поприятнее, чем то, где я была 10 лет назад.\nДля начала я нарисую вам хронологию своей зависимости, я же никогда этого не делала раньше в своих лонгридах, только в тетрадке из реб.центра, которую никто из вас не читал. Все равно придется делать это в мемуарах) Так что подарю вам эксклюзивчик.\nИтак. 12 лет - я начинаю курить сигареты, пробую травку. Мне некомфортно, кажется что я предаю что-то в себе, что-то важное. У меня есть подаренный мне пакет травки - я не пользуюсь им, предлагаю его папиной подруге, которая курит. Она рассказывает папе, он достаточно жестко реагирует, отвозит меня в общественный центр для наркоманов, пол года я на домашнем аресте, ко мне относятся как к наркоманке, мне показывают фильмы про подвалы дыбенко, я вообще не понимаю - за что так со мной. У меня же была своя голова… Была. Когда к тебе относятся, как к наркоману - ты уже в принципе привыкаешь к этому состоянию. Я привыкла. Думаю, когда детям говорят, что Элджей и его музыка может сделать их наркоманами - это работает примерно так же. Моя зависимость была заложена во мне, но всегда есть тот триггер, который запускает этот механизм.\n(на фото уже 9-10 классы, с 7ого класса я курила. К началу универа выкуривала по две пачки в день)\nВ то время у меня пропало желание не-торчать. Я была готова пробовать, я стала открыта для этого мира и людей в нем. Я читала сайт\ndrugusers\nо внутривенном употреблении , я пыталась понять суть зависимости и зависимых. Мне было 13-14 лет. В то время я встала на сторону идеологии «I dont want to choose life. I choose something else». Мне не нравился лживый мир взрослых - они сами не могли быть примерами трезвости или чистоты, они не были эмпатичными, они не старались понять нас и выслушать. Я хотела связать свою жизнь с социальной журналистикой и программами типа «Снижение вреда» - кстати, почти за 20 последующих лет я успела побыть и клиентом подобных центров, и их амбассадором.\nЛет в 16-17 я нашла Ital-идеологию в растафарианстве. Чистота и естественность. Вегетерианство, травка, никакой химии. На тот момент я уже попробовала ряд наркотиков - несколько клубных сетов - я поняла, что танцевать под наркотиками - это не мое. Но лежать с закрытыми глазами - это, пожалуй, да. Мое употребление химии до 16 лет было эпизодичным, раз 10, максимум - 1-2 дня подряд. Не было денег, не было компании, в которой были тяжелые наркотики. Но по поводу легких - все это было, и это было лучше, чем алкоголь.\nАлкоголь иногда все таки появлялся в нашей жизни - но в качестве редкого веселья. Был долгий период отказа от алко, но ни начала ни конца я не могу вспомнить. Скорее всего весь первый курс университета. Тогда мы начали есть грибы, у меня серьезно повернулась сознание. В тот момент я заплела дреды и взяла достаточно строгую аскезу. Рассталась с парнем, с которым встречалась с 9ого класса, много времени проводила в церкви. Мне хотелось очистится, казалось, что я неправильно живу и все вокруг тоже совершают ошибки. Я чувствовала: мы все должны быть чистыми и невинными, как дети. А мы были далеко от этого.\n(2004-2005)\nКогда я нашла идеологию чистоты в I-tal и православие, я была уверена, что это навсегда. Прошло года 3, мы выпустили альбом, попали в реггей среду, я нашла свое место и ощущение правильности всего, что я делаю. Между мной и химией лежала, как мне казалось, целая вечность. Я осуждала тяжелых наркоманов, считая это слабостью и тупостью. Я успела даже осознать зависимость от гашиша - оказавшись без вещества тгк на неделю, я чуть не сошла с ума. Конечно, это не героиновая ломка - это другое, но психологически очень неприятно. Зато после этого перерыва, я перестала нуждаться в тгк каждый день, и начала относиться к этому спокойнее. В то время, мне кажется, я была ближе всего к психологии независимых людей. Могла бухать с друзьями по выходным, когда мы идем в клуб, а в будни ходить в офис, курить время от времени. Меня это не беспокоило. Тогда я начала кататься на велике, знакомиться со своим запущенным здоровьем и телом, экспериментировать с питанием.\n(2006-2007 первые шаги в здоровом образе жизни. Я наконец-то начала выглядеть лучше, бросила курить!)\nПотом что-то пошло не так. Я встретила любовь, my siberian ragga, мне казалось, что это - ваааааааааа бесподобное нечто, и теперь все будет иначе. Я как будто поменяла свою внутреннюю химию, перестала чувствовать себя тем человеком, который жил и устоялся до этого. И когда мы оказались в Питере -  мне захотелось употребить что-то сильное. Мне казалось, что мы несокрушимы, что ничего не сможет нас разлучить или сломать. Отличное решение на этой волне убиться дешевыми влажными питерскими спидами. И когда я это сделала - это убило всё. И нового воздушного человека во мне, и химию, и любовь. Первое употребление после долгого перерыва выжгло меня изнутри, всю мою идеологию и ощущение правильности, и вообще все. Кстати, где-то в этот период я завела жж, может на несколько месяцев позже. И еще песня «Ищу Тебя» о том моменте. Любовь была у меня, но я потеряла ее в себе.\nКто после этого начал употреблять - я не знаю. Какая-то пустая оболочка без смысла и идеологии.\n21-22 года - это время моего самого активного употребления без контроля и понимания, что со мной происходит. Мне было надо. Мне хотелось. Я искала возможности и способы. Мне конечно хотелось при этом контролировать употребление и не терять свою жизнь. И у меня были способы. Например - не торчать в Екатеринбурге. Я продержалась в этой концепции месяцев 7-8, меня откачивали в турах, в итоге я практически переехала в Ижевск.\nсентрябрь 2008, i am so bad\nБыли моменты, когда я пыталась перестать сама. Я не торчала на героине, но стимуляторы тоже подсаживают тебя на систему, хоть и не такую жесткую. Я пробовала так: например - разогнать дозу до такого, чтобы было уже невозможно употреблять (плохой способ). Отказаться от стимуляторов и употреблять только несинтетические наркотики - лсд, грибы, мескалин. В конце уже не было денег на экзотику, мы со Щекалевым съели семена гавайской розы (я совершила эту ошибку второй раз в жизни). Отравление было таким сильным, что почти сутки я падала в обмороки и испытывала боль во всем теле. Было так плохо, что после этого любое состояние было хорошим. Т.е. Меня больше не кумарило.\nМы уехали автостопом на юг, перед этим я познакомилась с Никой Суринович, которая сказала: хехе, у тебя проблемы. Осознаешь - приходи. И я, с трезвостью в неделю или две, усмехалась в ответ: я могу сама. Вот увидишь. Через месяца полтора трезвости я осталась одна и выпила глинтвейн. А что такого? Это же не наркотики. Теперь можно.\nМного раз за эти два года я пыталась заменить наркотики на алкоголь. Это были и веселые вечеринки, и просто несколько термосов глинтвейна с водкой, без которых я не выходила из дома как раз в тот период - вот в один из этих выползок я пела для ВИЧ+ ребят в помещении группы анонимных наркоманов, многие думают что в тот период я была уже трезвая. Видимо в употреблении я не выглядела так, как представляют себе торчков. Просто грустная.\nВообще все относились ко мне нормально. Юля меня поддерживала и всегда была рядом, одногруппники помогали с учебой, моя группа старалась понять меня. Конечно я вела себя безумно, я психовала, сама отталкивала от себя людей - во многом я хотела сама все потерять, чтобы нащупать дно и оттолкнуться от него, но у меня никак не получалось. Возвращение к наркотикам после перерыва, когда «ты сам» - это болезненно. Казалось, что я падала еще ниже. Мне отчасти нравилась эта эстетика дна, мне было больно в душе, но не страшно. Я употребляла внутривенно, я делала это одна. И вот так казалось все и должно закончится. В какой - то момент ты не хочешь никуда выбираться, не хочешь, чтобы тебе становилось лучше. Ты просто жалеешь, что не можешь умереть прямо сейчас.\nТем не менее употреблять больше недели я не могла. То есть когда я пишу о своем торче, многие представляют меня, как Андрея - который 10 лет ежедневно кололся и искал дозу с редкими перерывами на детоксы. У меня была другая система - я могла употреблять 2-3 дня, наркотики заканчивались или я их выбрасывала раньше. Потом я пыталась компенсировать себе выходы - начинала бегать через силу, еле передвигая ноги, по вечерам - заливаться алкоголем, превращая все это в атмосферу праздника - могу, умею, практикую. Друзья = эндорфины. Пару дней - и я была в норме, ничем не отличалась от других людей, которые бухают по выходным. Так можно жить годами, и многие, многие так живут до сих пор. Особенно в Питере, где Северное техно и вся инфраструктура. Но в Питер, кстати, я переезжала уже на другой волне.\nВ целом у меня было все: друзья по всей стране, прогресс во всех сферах жизни, много полезных связей, деньги на все необходимое, независимость от родителей - мой торч был отвратителен или прекрасен тем, что давал моему «я сама» большую веру и моему эго большую подпитку - а это значит, что мне претила сама идея обращения за помощью. Я понимаю Лил Пипа, понимаю всех этих фрешменов, которые умирают до 25ти. В своем первом ребцентре я рисовала картинку: я держу в руках столько дел, людей, все вокруг меня и завязано на мне - а подо мной бездна, а в ней - огонь. И мне уже жжет пятки.  Но я могу писать песни, могу выходить на сцену, черт возьми, я даже могу подготовиться к экзаменам и сдать сессию, написать охрененное эссе, статью в газету факультета. Я все успеваю - и жить, и умирать.\nЭто было самым сложным в том периоде, да и вообще в любом из последующих. Если в этой жизни ты держишься на уровне нормальных людей, держишь свою жизнь в шатком балансе, то что в той, другой жизни без наркотиков и алкоголя? Норма не измеряется твоими успехами, достижениями, положением общества. Норма - это то, что на твоих внутренних приборах. И строить курс надо по этим приборам, а не по внешним ориентирам. Быть в норме, как все другие люди еще не значит быть в твоей личной норме. Тогда я не знала никого, кто жил бы так, как я и испытывал бы подобное. Если бы мне тогда попалась книга Киддиса Scar Tissue - возможно, я бы лучше поняла, что происходит.\nОчередная моя чистота началась решительно: я пообещала Юле - пол года никаких наркотиков, а она подарила мне абонемент в фитнес клуб, где я попала на первую в жизни йогу, а в последствии - вообще прописалась там, пробуя все все виды групповых и индивидуальных программ. Я решила ходить к Нике в реб.центр, изредка оставаясь там на ночь - просто подсмотреть, как лечат зависимых. Но я выполняла все задания. Ужасом для меня было то, что они говорили об алкоголе - что это такой же наркотик. Я не могла и не хотела с этим соглашаться - настолько он бы интегрирован в жизнь.. Это была норма. Все так отдыхали. Когда в компании я пробовала отказаться от алкоголя - я чувствовала себя несчастной, как единственный ребенок из всех, которому запретили мороженное;\n(разговор с Никой, октябрь 2008)\nНу можно я буду пить но не буду торчать? - ну давай, хе-хе-хе… - Вот так примерно мне отвечала Ника. И я пробовала.\nТогда, после очередного разового срыва на наркотики (около месяца я продержалась с алкоголем и на обещании Юле). И вот тогда я пошла на группу. Она была, кажется, на улице Луначарского. Люди мне не понравились. Все было ужасно, меня стебали, кривили лицо - я была там вообще «не от мира сего», но я как-то покорилась. Кажется в тот момент я приняла бессилие: с алкоголем не получится, я устала, я хочу попробовать так, как вы говорите.\nПервым моим шагом в настоящую трезвость без полумер было абсолютное понимание, что контролировать употребление я не могу, понять зачем я употребляю - я тоже не могу. Не было ясности, что будет дальше, как я там буду — но первый раз в жизни я была готова отказаться от всего: от алкоголя и любых видов наркотиков.\nЭто была осень 2008 года. Мой последний год обучения в университете, год, когда мы выпускали Снежную Барселону. За 2008-2009 год мне едва ли удавалось набрать 1-2-3 месяца трезвости без срывов, но во всяком случае уже большую часть времени я проводила абсолютно чистой - без алкоголя и даже легких наркотиков. Проживала день за днем. Это - первая часть рассказа. Остальное напишу в следующий раз.\n", "final_title": "Ника - наставник в программе", "final_annotation": "История знакомства с Никой, которая стала наставником в программе АН.", "display_date": "29 ноября 2018, 17:09"}, {"path": "data/ig_organized/long_200_md/2018-09-07__3.md", "source": "Instagram", "filename": "2018-09-07__3", "full_content": "https://www.instagram.com/p/BnbDOMNFEVx/\n\nЧасть 3. На фото - 2011 год. Я живу без приступов, у меня около года трезвости, #sekta только - только появилась, как сообщество в жж. \nМое желание разобраться с саморазрушением и желанием исчезнуть привело меня в сообщество анонимных наркоманов. Там все было сложно и непонятно, и когда я начала отказываться полностью от наркотиков и алкоголя - моя пищевая зависимость начала возобновляться, я анализировала свои приступы, их причины, училась работать с тревожностью, которая их запускает. Как у любого срыва -у них всегда были причины. Булимия - это проявление болезни зависимости, и есть много материалов, например у Валентины Новиковой, которые помогают разобраться в причинах и механизмах, которые руководят зависимым поведением, компульсивным поведением, тоннельным мышлением. Пришлось очень много в себе проработать - свои обиды, страхи, все, что запускало механизмы тревожности. Я не помню момент, когда приступы прекратились, потому что я перестала фокусироваться на них - я внимательно следила за своими реакциями на мир и на внешние раздражители. Моим фокусом стал душевный покой и все, что ему способствует. Моим\nфокусом стали изменения в моем внутреннем мире, работа с моими дефектами, с моим эгоцентризмом - когда я видела в себе позитивные перемены, у меня не было никаких причин ненавидеть себя и наказывать. До начала работы по 4ому шагу приступы иногда возвращались - в самые стрессовые моменты, но они были разовыми, без запоев, как раньше. Но уже больше 5 лет я живу в абсолютной свободе от этого, столько же я сохраняю абсолютную трезвость - от алкоголя и любых других веществ. Это связанные вещи, они идут рука об руку. \nСейчас я верю в то, булимия излечима, если заниматься этим вопросом и не притворяться, что ничего не происходит. Программа 12 шагов, хороший психолог или психотерапевт, который научит работать не с едой, а зависимостью. Потом - заново учиться есть: чувствовать голод и аппетит, разделять их, кормить себя полноценно и регулярно. Любить себя, находить и создавать новые причины, чтобы любить себя - это все процесс на годы, главное - это запустить его.\n", "final_title": "Работа с программой 12 шагов", "final_annotation": "Личный опыт работы с программой и духовное выздоровление.", "display_date": "2018-09-07"}, {"path": "data/lj_export_clean/posts_md/77798__transsiberian_back2black.md", "source": "LiveJournal", "filename": "77798__transsiberian_back2black", "full_content": "# Transsiberian back2black\n*Date*: 18 февраля 2013, 14:06\n*URL*: https://olymarkes.livejournal.com/77798.html\n\nMarkes: Тут все спят а я опять не могу\nD: Не можешь?\nD: Ножки крутит?\nMarkes: Крутит всё\nD: Ой\nD: Плохо\nD: Ты в поезде? Щас подумаю что можно сделать.\nD: Меня помню кумарило в поезде, как собаку. Хочешь расскажу?\nMarkes: Да )\nD: Ну, слушай\nЭто произошло, когда я в очередной раз решил соскочить с хмурого.\nСтепень одержимости была такой, что я даже обыскал дознувшегося на лестнице наркомана, совершенно мертвого и очень окоченелого.\nМной найден был шприц с раствором, который тот не успел себе ввести до конца (ибо содержимое представляло из себя смертельную смесь, которая убила его еще по пути к радостному приходу). Я сидел на лестнице рядом с мертвым телом и обдумывал перспективу помереть тут же.\n«Разум или безумие?» - конечно, желание вмазки проникло под кожу и зудело, словно впившийся клещ. Я вмазался из шприца только что покинувшего этот мир очередного неудачника. И...  Я не умер.\nДругой вопрос, что прикорнув на плече жмура, я был обнаружен своими знакомыми, которым ад наркомании был известен исключительно по фильмам с дебильным содержанием.\nМеня вознесли в квартиру и устроили импровизированный консилиум\nПродолжать?\nЛадно, у нас видимо односторонняя связь, ибо в таежной глуши, где следует твой поезд, лампочка Ильича и первое радио появятся лет через сорок.\nD: Итак, правда о твоем муже: продолжение.\nСовещание длилось несколько часов, пока я умиротворенно парил в астрале. Резолюция гласила: сдать негодяя в клинику, запереть дома или отвезти в такое место, где появление человека вызывает бурю эмоций у основных обитателей - белок.\nСперва меня пытались приложить в больницу. Как только мои друзья оплачивали курс детоксикации, я тут же проявлял природную смекалку: через час после ухода обозначенных лиц вваливался в приемную к врачу и писал письменный отказ от лечения.\nИ чудо: деньги, которые за меня платили, я получал на руки, за вычетом тридцати процентов. Это было не плохо, так считал и мой барыга.\nПоэтому, когда после шестого или седьмого раза я высадился в дом с мааааленькими зрачками и любовью к миру,  было принято решение запереть меня в четырех стенах.\nНу что же, длинную нитку и пустую сигаретную пачку никто не отменял, а схему товар - деньги не отменяли и подавно. Тут все было просто: по утрам мои приятели, выпив свой утренний кофе с белым хлебом и слегка вспотевшим ноздреватым сыром, отправлялись по своим делам.\nЯ же оставался на весь день дома, и у меня имелись солидные денежные запасы. Несколько волнительных манипуляций, и искомое оказывалось у меня в руках. Я устроил нехитрый тайничок в ванной, и часами, присев на краешке, игрался со струйкой воды.\nЭто так весело: она бежит, ты ее пытаешься подхватить. А она убегает. И так до бесконечности. Отличная забава могла продолжаться вечно, если бы не моя жадность. Посчитав, что цвет у порошка не тот, бухнул в ложку в два раза больше.\nНашли меня привалившимся к стене с художественной слюной – ниткой. Ванна наполнилась и текла через край, назревал скандал с соседями. Если бы я уронил свое тело в чугунное нутро, я бы попросту захлебнулся, предвосхитив события, произошедшие с винти хьюстон. Но бог берег меня дурака, я упал не в ванну.\nДальнейшие разговоры были бесполезны. У одного из подающих надежды дизайнеров нашелся какой-то дальний родственник, живущий на отшибе уральского полуострова. Бля. Я еду даже не в Мурманск. Я еду до Мурманска, а дальше на машине еще несколько часов. Сбежать оттуда можно только в Норвегию, но что мне там делать? Их язык пугающе напоминает лай.\nИтак,  я в чреве зеленого вагона, постукивающего своими колесами и поскрипывающего фанерными стенками, переборками и прочей мелкой чушью. За окном маленькие городки, больше похожие на деревеньки, глядя на которые хочется удивиться и сказать в сердцах:\n- Ни хера себе, и здесь люди живут. Вот это да.\nВторые сутки пути. Меня дико кумарит.\nКонечно, заветная пятерка была взята с собой, но она кончилась еще вчера вечером: «вроде и нет прихода уже, но я еще немножко, завтра будет завтра»\nВагон полупустой, поэтому я развлекаюсь тем, что меняю места дислокации. Я даже полежал на боковушке у туалета.\nНаступил час че.\nВернее, пиздец мне наступил. У меня адский дозняк, утром мне необходима инъекция нормального весового грамма - не барыжьей куцей херни, а полноценного такого грамма в щи.\nСначала меня пробило в пот. Это предвестник того, что скоро в животе начнет крутить, и усидеть на месте станет довольно-таки сложно. Ты не можешь провести в одной позе даже пяти сраных секунд. Меняешь положение, но облегчения нет.\nЗатем наступает очередь соплей из носа -  обильные вожжи текут ручьями. Кажется, что они сейчас начнут затапливать коридор, а в это время сосед по купе подозрительно смотрит, как его попутчик из веселого паренька - рубахи превращается в разваливающийся кусок дерьма.\nЭто был я.\nЗа окном - миллион деревьев, каждое из которых напоминает о тяжелой судьбине русского народа;\nMarkes: Ыыыыыы, мне уже легче становится, понимаю что мои муки несущественны))\nD: :))\nНеожиданно я понял, что на самом деле я очень несчастен. Есть такая вещь в кумачах: когда наркотик выходит, ты становишься таким чувствительным. Я смотрел на людей и плакал от жалости. Мне было жалко себя, их, их семьи и даже машиниста поезда.За то, что возможно он хотел быть летчиком - испытателем, а занимается тем, что на маленьком отрезке гоняет туда-сюда локомотив.\nИ тут, в процессе твоего осмысления ничтожности и бесполезности жизни приходит он.\nТы должна спросить - кто он?\nMarkes: Кто?))\nD: Адский по своему масштабу ПОНОС. Настолько ужасный, что одновременно с ним приходит и безудержная рвота.\nMarkes: Очень неудобно.\nD: Ты бежишь в туалет, и как в известном фильме попадаешь в отвратительную ситуацию. Но это еще не самое страшное. Напомню тебе, что вынести жгучую боль и неудобство от нахождения в одной позе ты не можешь.\nИ тут жизнь начинает тебя испытывать на прочность по-настоящему. Твои руки и ноги становятся, словно у буратино в детском кино, то есть еще чуть-чуть, и раздастся характерный хруст, после которого ты увидишь свои колени и локти.\nПередышек нет.\nОбычно у среднестатистического наркомана ломка длится до пяти дней. В моем случае все ограничивалось двумя. Но какими!\nПрисовокупив ко всем этим страданиям бесконечное потовыделение в виде липкой и вонючей жидкости, можно себе представить всю картину.\nМимо мелькают деревья, и это еще сильнее усугубляет рвотные позывы. К вечеру я кое-как дополз к проводнику и поросил убить меня. Пожилая женщина прониклась ко мне сочувствием и продала бутылку отвратительно пахнущей водки.\nМерзкое пойло не действует, когда тебя крутит. Вообще. Я высосал ее до последней капли, но облегчения не было. Лишь еще гаже стало в желудке.\nЯ бы отдал любые деньги и даже одну почку, чтобы у меня оказалось то, без чего я не мог, но,с каждой минутой поезд работал на удаление\nD: Тебе интересно?\nMarkes: Мне очень интересно!!! Связь пропадает постоянно.\nD: Проведя бессонную ночь в мокрых поездных простынках и выблевав все свои внутренности, я решил умереть.\nЛегко сказать. Я же не могу лежать спокойно, а покойникам не свойственно вертеться, как юла. Я даже попробовал грызть железную штучку, в которую обычно кладут книги или полотенца. Без смысла отвлечь себя.\n«Чтобы я когда нибудь еще раз» думал я, ощущая нестерпимую боль в суставах. Вымытый кальций, спущенный в унитаз - его так не хватало моему телу.\nА в мозгу летали баяны с желтоватым раствором, и все выглядело так заманчиво и красиво. В конце концов я решил делать вид, что ничего не происходит. Лишь покрикивал время от времени от нестерпимой боли и кручения в животе.\nПотом устал, и просто поскуливал.\nКогда поезд подошел к перрону, я постарел лет на сто. Упав в руки в принципе незнакомого мне человека, решил, что пусть хоть к медведю в берлогу, лишь бы эти не повторилось.\nКак прошло время до моего возвращения - это другая история.\nD: Тебе стало хоть немножко полегче? Я могу писать пока ты не заснешь.\nMarkes: Спасибо :)\nD: Не за что. Давай сделаем вот что. Ты сейчас, я так думаю, лежишь. Во первых - вытяни ножки, как только можешь. Словно в детстве, когда думаешь, что стоит потянутся - и станешь взрослым.\nДальше расслабься и подумай о левой ножке, о том, как ей хорошо, тепло и как она устала. А сейчас она будет отдыхать. Может быть ее и крутит, но сейчас ты ей разрешишь отдохнуть, и неприятные ощущения пройдут. Не сразу так - раз и все, а медленно угасая. Ножка станет тяжелой и мягкой. Потом так же и с правой ножкой надо поступить. Дальше надо закрыть глазки и подумать о том, как вы с глазастиком поедете отдыхать после Сибири. Вы много работаете, и еще раз поехать на неделю погреться вам необходимо. Папа вас отправит к солнышку. И все будет хорошо. Там вы отдохнете и глазастик опять будет смотреть, как в животике у мамы все фиолетовое.\nMarkes: :) а ты потом расскажешь мне, что было дальше?\nЧасть 2.\nНу, слушай.\nСтупив на крепкую землю кольского полуострова, я тут же был подхвачен под руки дальним родственником моего приятеля. Заднее сидение ав ятно, что прогресс в этих местах имелся только в виде его обозначения в толковом словаре, но барыга был шикарен: остроносые черные туфли, волной наплывающие треники и черная же майка «босс» не оставляла никаких шансов сомневаться, кто стоит перед тобой.\nМы быстро сговорились, и уже через двадцать минут хлюпающая носами компания двигалась к одному из болезных на хату, а наш костлявый темноочечный друг, загрузив свое тело в икарус, продолжил движение к следующим поселкам, неся с собой радость и надежду.\nМестный порошок был не плох. Конечно, подбодяжен чуть больше чем у нас, но… На трезвый организм меня просто сшибало с ног волной прихода. Напрочь забыв где живет тот, кто меня приютил, я брел по одной из двух улиц в никуда. Рядом остановилась машина и меня окликнули. Конечно, это был хозяин жилища и конечно я спалился.\n- А, ты с нашими значит сразу спелся? - он крутил руль и качал головой. - Ну ,эту проблему мы тоже решим. Завтра едем в пустой город.\nМне было хорошо, и даже запах кошачьей ссанины не мог перебить удовлетворения. Пустой город - так пустой город. Завтра было так далеко, пусть хоть на луну. Я еще не знал, что это такое, а если бы знал, то возможно это бы и послужило неплохим мотивом для ускоренной программы отвыкания от наркотиков.\nMarkes: а дальше?\nD: дальше страшно.\nMarkes: `ну расскажи.\nЧасть 3.\n- Петрович, ну ты можешь не так гнать то, а?\nНаш проводник - местный сталкер Петрович, с натяжкой походил на персонажа из Стругацких. Ну, во всяком случае в моей голове плотно закрепился образ Кайдановского в этой роли, но никак не мужичка, с лопатообразной бородой и ростом метр пятьдесят (последние пятьдесят – крайне сомнительные). Однако, видом и нравом своим Петрович был намного круче сентиментального и склонного к философии сталкера.\nЗа всю дорогу Петрович не произнес ни одной фразы. Лишь изредка он комментировал взлеты и падения автомобиля марки уаз (в простонародии - «буханка»). Отвратительно говнистого цвета автомобиль, способный подбросить вас
