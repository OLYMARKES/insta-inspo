иподнятыми:\n- Да вы что! Что же случилось?\nАнатолич был удовлетворен, и повернувшись вполоборота ко мне, пунцовый от удовольствия, по слогам ответил:\n- Никто этого не знает.\nТо есть по факту - был небольшой городок со своей инфраструктурой, аккуратными домами и даже Домом Культуры. Люди там жили, рождались, умирали. А в какой-то момент просто раз - и никого не стало. Ничего удивительного я в этой истории не увидел.\n- Так и чего?\n- а того! - Петрович разозлился моей тупости. - Ты понимаешь, в город дорога - одна. Вот мы по ней едем. А тогда по ней никто не проезжал. Тридцать тысяч человек - это сколько машин, автобусов должно было быть?\n- Ну так улетели.\n- Да как улетели-то? Там взлетная полоса для военных истребителей, там обычным самолетам ни взлететь, ни сесть.\nИ тут мне стало не по себе. Шутки на этом месте закончились, и мозг в мгновение собрал картинку того, что могло произойти там, куда мы почти уже приехали. У меня чертовски хорошее воображение, и поэтому возможных сценариев развития было около пятидесяти: от безобидного исхода сквозь леса на территорию соседнего государства до внеземного вторжения космических монстров.\n- И что было дальше? - теперь мой вопрос носил действительно практический интерес, потому что эти джентельмены собирались привезти меня в какое-то мифическое место и оставить там ОДНОГО на целые сутки. Мне идея поездки вдруг разонравилась так сильно, что я начал поцарапывать стекло.\n- А ничего. Никого не встретили, понимаешь? Ни одной души! Даже животных не осталось - ни кошки, ни собаки. Говорят что потом уже, несколько лет спустя, видели некоторых знакомых отсюда - но они старались уходить от ответа или делали вид, что не понимают о чем идет речь.\nВ конце концов, подумал я, бывал я и раньше в странных и не очень понятных местах. Почему бы не побывать еще в одном?\nНаконец чудо советского автопрома выплюнуло нас из очередного поворота и глазам представилась странная картина: перед нами, словно на ладони, у подножия небольшой сопки, лежал городок. Слева от горки виднелись постройки военного назначения.\n- Аэродром. - ткнул пальцем Анатолич.\nПравее был непосредственно сам город. Как и все северные городки, вид он имел скорее неряшливый и дома стояли там, где земля позволяла установить сваи.\n- Вот, смотри, - мимо нас проплывал выкрашенный синей, облупившейся от времени краской, бревенчатый домишко. – это - дом Первого Космонавта.\nДействительно, о великом жителе гласила старая мемориальная доска. Далее мы свернули на главную улицу, по обе стороны от нас стояли в ряд кирпичные пятиэтажки. Стекла во многих окнах были выбиты, и через них можно было рассмотреть, что вся мебель оставалась на своих местах, словно хозяева жилищ просто уехали в отпуск, а дворовые хулиганы, побили стекла и теперь прячутся где то за углом.\nВообще создавалось впечатление, что место это было покинуто. Не оставлено, не брошено, а именно покинуто, по каким-то неведомым причинам. Мужики замолчали, и только рев старого двигаеля раздавался вокруг, отражаясь от стен и создавая причудливую какофонию из хрюканья, стука и надрывного гула.\n- Вот он - символ города.\nМы выехали на небольшой пятачок – по-видимому на главную площадь городка. На ражвом постаменте стоял старый истребитель с приваренным к брюху штырем - один из первых реактивных МИГов. Время поработало над ним, и поэтому памятник имел вид очень изношенный.\nПетрович заглушил машину и, открыв скрипнувшую дверь, шагнул на землю.\n- Приехали. - Анатолич засуетился. - Вот смотри, здесь тебе еды до завтра.\nЯ начинал терять связь с реальностью. Если все мои предыдущие поездки в подобного рода места носили чисто рабочий или познавательный характер, то сейчас эти двое привезли меня хер знает зачем в такое, блять, место, где можно и привидение повстречать. Мало того, они собираются меня здесь оставить одного, с одной единственной целью: здесь меня должно попустить. Да в пизду.\n- Слушай, анатолич, а может не надо этого ничего, а? Я как бы впечатлен, и готов ехать обратно.\n- Но, - Петрович шумно открыл капот. - у Валерки помнишь, сын? Мы его возили сюда - пятый год, как бросил дерьмо это. А у Ленки – дочку тоже сюда свезли. Она, правда, потом в психушку попала – но не колется же. - Петрович поднял палец вверх, будто это был ответ на все мои вопросы.\n- Мужики, я не против того, чтобы сделать, как вы говорите, но обьясните мне: какого хера мы приехали сюда, и назовите хоть одну вескую причину, какого хуя я должен здесь остаться? Причем, блять, остаться один.\n- Ты пойми, - Анатолич положил мне руку на плечо, - когда люди-то пропали, сюда повадились молодые ездить. Пьянки, танцы - дело молодое. Никто против не был, да и в гроде тише стало. Так вот: одна компания поехала сюда очередной какой-то праздник отмечать, на двух машинах, семь человек. Что тут произошло – не понятно, но на следующий день они вернулись словно другие.\nПонимаешь, до этого они гудели чуть ли не каждый день, а тут приехали - и все. Тише воды-ниже травы. Ну, тут Петрович и смекнул, что не просто так это. Сел и поехал сюда. Как положено - взял вещей, остался ночевать. Петрович, давай ты теперь расскажи парню!\nПетрович отвлекся наконец от металлических кишочек своей любимицы, и, вытирая руку промасленной тряпкой, начал говорить. И вот что он поведал: ночью Петрович услышал голос, который вступил с ним в диалог. Голос рассказал ему то, в чем Петрович себе признаваться боялся. Например то, что жизнь он свою губит пьянками, а дети его ненавидят за это. И можно – де - все исправить, достаточно прямо сейчас прекратить.\n- И ты понимаешь, я как бы вроде и не вижу никого, а в голове идет разговор. Ну, я тогда понял, что не просто так отсюда люди то ушли. По совести-то жить, не каждый захочет. А тут такое. Бубнилка в голове и давит тебе на мозг, и так давит, что аж до слез пробирает.\nПетрович вроде не был похож на идиота. Да и я не особо верил в подобные сказки.\n- Вот, ну и стал я возить сюда ребятишек, кто по жизни потерялся. А что - никакого обмана, и никакой мистики. - Петрович улыбнулся своими коричневыми от табака зубами и снова ткнул вверх пальцем. – Ты, главное, не робей.\nДверь машины захлопнулась, на прощание меня обдало сизым вонючим дымом, и я остался один. Через какое-то время тишина стала настолько пронзительной, что я начал петь, чтобы заглушить звук ничего. На самом деле мне было ну очень нехорошо, а еще я боялся услышать звук. Любой. Это бы означало, что я тут не один. И хотя рассказ Петровича зародил во мне сомнения во вменяемости моих товарищей, сталкиваться с чем-то, что могло бы как минимум удивить меня - мне не хотелось вовсе.\nЗа полтора часа я обошел весь городок, присматривая место для ночлега, и удостоверился в том, что в город действительно необитаем. Даже маленькой птички не повстречалось на моем пути. Вернувшись на площадь, я без удовольствия съел грубоватую еду, приготовленную заботливым Анатоличем, и стал смотреть на самолет.\nТяжеленная махина висела, пришпиленная нехитрым замыслом к пьедесталу, и небольшие порывы ветра слегка покачивали ее крылья. Разадавался ржавый неприятный звук. Разглядывая его, я испытал какое-то разочарование. Нет, скорее грусть. Какое-то время назад эта штука наверняка радовала детей, внушала надежду людям, которые здесь служили… Не понятно на что, но мне так хотелось, чтобы она давала надежу. А потом люди ушли, или их похитили инопланетяне -  а этот символ теперь стоит тут в одиночестве. И так будет, пока его не изьест ржавчина до такого состояния, что вся конструкция просто рухнет на землю, но никто этого даже не увидит.\nТемнеет на севере поздно. Полярный день - интересная штука, но мне не повезло: тучи затянули небо и быстро сделали всё темнее, а следовательно - тревожнее.\nЯ решил заночевать в одной из квартир в доме, который находился рядом с музеем летчика - испытателя. Хотелось, конечно, лечь на кровати героя и понять, как ему там спалось, но на двери был гигантский ржавый амбарный замок, а в лютой абстиненции у меня сил едва хватало, чтобы сигарету прикурить. Поэтому, не особо обращая внимания на окружающее, я проследовал в первую же открытую квартиру.\nОбстановка там не отличалась от той, что была у того же Анатолича - тот же ковер, стенка на полкомнаты. Единственная разница была в том, что все было пыльное и какое-то дряхлое, плюс ко всему было холодно. Я завалился на кровать и стал ждать сна. Разные мысли обуревали мой мозг, мне мерещилось, что за дверью комнаты кто-то стоит и вот-вот войдет сюда. Тогда я стал смотреть в ту точку, и смотрел так долго, что глаза заболели и стали слезиться, но ни одного постороннего шума или шороха я так и не услышал.\nНеожиданно для себя я впал в сон. Пробуждение было резким и странным, словно я только закрыл глаза, а когда открыл их, вокруг было темно - хотя ночи в этих местах можно было сравнить с четырьмя часами пополудни в Питере. Однако, я не видел абсолютно ничего, лишь угадывал контуры предметов… и эта тишина - она давила в голову так, что в ушах появился нарастающий звон.\n- Блять, блять - мне стало не по себе. И тут в моей голове раздался (только не стоит считать меня клиническим больным) голос. Он не был похож ни на один из тех, что я слышал когда-либо. Тоесть его не было, но он был. Я не понимал произношения, но он был спокойным и каким-то, теплым, что ли.\nС удивлением я обнаружил,что кумарные боли прошли, и я больше не мерзну, как пес на морозе. Прошли даже боли внизу живота, которые сопровождают наркомана всю первую неделю отмены от наркотиков. Постепенно я начал различать смысл, и стал слушать.\nЭто «что-то» говорило мне о том, какой опасности я подвергаю себя и близких мне людей, когда делаю себе иньекции. Каждое проникновение в меня наркотика позволяет проникнуть сюда чему-то плохому, и чем больше я это делаю, тем больше Их здесь. Голос так и сказал - тем больше Их здесь.\nКонечно, блять, я бодрячком. Лежу на кровати неизвестных мне людей, которые лет двадцать назад как по какой-то причине слились из города всем составом, а в голове у меня - хер знает откуда взявшийся голос, который читает мне мораль о греховной составляющей моей жизни. Поэтому я, будучи весьма прагматичным чуваком - решил идти до конца и, преодолевая сомнения, осторожно, в голове же задал вопрос\n- А позвольте спросить, о ком идет речь? - Типа прикинулся дураком. И зря.\nГолос умолк, и звенящая тишина снова сдавила виски. Кроме того я понял, что я лежу на кровати и не могу шевельнуть ни одним мускулом своего тела. Подвижны только глаза.\nИ тут в окно стукнул камень. Если бы я мог, то наверное обгадился бы на месте, но мой желудок был пуст, как и мочевой пузырь, а поэтому я оставался в положении мумии в Эрмитаже и с ужасом ругал себя - на хера я вечно лезу со своими вопросами так не вовремя?!\nЗвук раздался еще раз и еще сильнее. - Так, я не паникую. Это всего лишь камешек в окно, который кто-то или что-то бросает, - волосы на голове зашевелились от представленной картинки, кто это может быть. По спине побежал строй муравьев.\nВдруг деревянная рама скрипнула и приоткрылась. Всё, это уже слишком. Я волевым движением рванулся и ...остался в том же положении. Сказать, что мне стало страшно - это не сказать ничего. Нечто бесформенное, черное и меняющее очертания, проникало в комнату.\nИздавая шипящий звук, неведомая тварь проталкивалась через узкую щель. Тут я понял, что достаточно уже с меня необычного и начал просто повторять, словно заклинание, детскую считалку. Мне очень хотелось закрыть глаза, но я не мог этого сделать. Это было словно в страшном дестком сне, когда ты видишь что-то очень нехорошее, но ты слишком мал, чтобы противостоять этому, а родители спят в соседней комнате, и ты даже не можешь крикнуть, чтобы разбудить их.\nНаконец мерзкая тварь плюхнулась на пол и издавая шипящие звуки поползла к кровати. Она пульсировала и меняла свои формы. Никуда не торопясь, она проползла к моим ногам и с силой сдавила их, поднимаясь все выше и выше.\nЯ чувствовал холод, словно по мне тащили ледяную глыбу. Настолько холодную, что ломило кости. В странном бесформии я начал угадывать какие-то черты. Мерзость меняла очертания, то принимая формы черт чьих-то лиц, то раздуваясь, как мохнатый мяч. Наконец, мразь достигла моей груди и выпустила что-то похожее на хоботок или жало. Он, подрагивая, словно обнюхивал меня, и двигался вверх, вверх.\nВнутри себя я кричал. Ничего сильнее я не переживал никогда, невероятным усилием я попытался вжаться в кровать и ...открыл глаза.\nВ окно светило солнце и раздавался звук клаксона.\n- Эйййй! - Петрович, милый Петрович! Пожалуй, никогда я не радовался так человеческому голосу. Это был сон, просто сон. Вскочив с кровати я схватил сумку и тут я увидел: створка окна была приоткрыта, а на подоконнике лежали два маленьких камешка.\nЕсли бы за скоростное перемещение через брошенные города давали медали, я бы стал чемпионом мира. Всю обратную доррогу я молчал и на все вопросы Петровича отвечал односложно - да или нет.\nЧерез два дня я купил себе билет в кассах и не откладывая сорвался обратно домой. Анатолич передал связку сушеных грибов, рыбы и прочие подарки родственникам, пригласил приехать на следующий год. Весь путь я просидел на полке, боясь закрыть глаза. Шипящий звук то и дело возникал у меня в голове.\nПитер встретил жарой и улыбающимися людьми.\n- Стой, давай-ка сюда. - водитель-таджик, плохо разбирающийся в устройстве улиц, наконец довез меня до знакомой парадной.\n- О, ты где пропал то? - Ча только проснулся и имел скучающий вид.\nМы сидели на маленькой кухне в хрущевке.\n- Че, вмажемся? - Ча протянул мне баян, заряженный прозрачным раствором. Я замер.\nОтчетливый звук стукнувшего камешка в стекло вызвал во мне животный ужас… стоп, я же взрослый человек.\n- Ты чего? -Ча удивленно смотрел на меня.\n- А, ничо, херня всякая в голову лезет.Подержи руку...\nFrom Spb 2 Transsiberian Trains feb. 2013\nот редактора: первая часть текста была написана в сообщениях, по строчке, и с нежностью выписывалась мной из телефона. Мой любимый писатель рассказывает мне истории на ночь, когда я не могу уснуть, некоторыми из них я просто не могу не делится.\n", "final_title": "Ника - наставник в программе", "final_annotation": "История знакомства с Никой, которая стала наставником в программе АН.", "display_date": "18 февраля 2013, 14:06"}, {"path": "data/lj_export_clean/posts_md/82835__hard_diving.md", "source": "LiveJournal", "filename": "82835__hard_diving", "full_content": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один парень умер от наркотиков, и много я прочитала в те дни - о том, что надо было спасать, или о том, что надо было предпринимать меры. Я, конечно, в очередной раз примерила на себя эту историю. Никто не мог помочь, никто не мог спасти. Это всегда история только про тебя.\nСтранная это штука, во многом определившая мою жизнь. Это и отличает зависимых людей от независимых -\nв торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы. Остальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\nПо сравнению с настоящими наркоманами фактически я употребляла очень мало. Настолько, что я могу вспомнить каждый раз, количество, обстоятельства. Это были не такие длительные периоды, но каждый раз я встречалась со своим пределом. Когда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\nГоворят, что боль уходит.\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Были разы, дни между месяцами и годами чистоты. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается (или не случается) момент расщепления «я».\nЕсли случается, то ты случайно отделяешь себя от своего желания торчать.\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом. В шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо этого внутри меня стало постепенно оживать что-то. Интерес - вот самое лучшее чувство, за которым уже идет все остальное. Ты осуществляешь действие - видишь результат - радуешься. Я не радуюсь от того, что не является результатом моего труда. Такое у меня устройство. И вот когда я поняла это - я начала делать. Вернее не так, я делала и делала много до этого, но внутри была такая каша, что я не понимала, что именно это меня радует.\nТак я поняла, почему я люблю тренировки. Почему я люблю писать. Почему я люблю вести йогу - мне нравится действие, направленное на что-то хорошее. И дальше все это было уже как снежный ком. Ком, в сердцевине которого был зародившийся интерес к жизни, ко всему тому, что было мне непонятным.\nЯ обязательно напишу еще, и про свои рехабы, и про открытия в самоанализе, и про свои дефекты характера, и про то, как я училась и учусь по мааааленьким ступенькам поступать по-новому в рамках собственного безумия. Я буду писать, потому что гипотетически есть какой-то такой,\nпохожий на меня человек, которому мой опыт будет полезен. А я очень мало им делюсь, самым ценным и тяжелым - а надо бы, надо бы.\nАнастезии нет. Нет и всё. Ты просто начинаешь жить и однажды перестаешь задыхаться. И это невероятно похоже на тренировки - у тебя появляются силы так постепенно, что порой ты этого не замечаешь. Просто ты оглядываешься и понимаешь, что плывешь. Зависимость - это удивительная болезнь, которая может открыть такое зазеркалье твоей реальности, что слов не найдется, чтобы описать. Вот поэтому для меня наркотики - это такая вещь, мало кто поймет, если я скажу, что я благодарна за то, что это было в моей жизни.\nАнастезии нет. И ты все еще являешься собой во всей этой уязвимости. И жизнь все еще похожа на то, как будто ты идешь по канату, или куда-то бесконечно падаешь. Просто теперь уже точно нет никакой иллюзии, что ты можешь что-либо контролировать в этом глобальном процессе, поэтому тебе спокойно, и в процессе падения ты наконец-то можешь открыть глаза, оглядеться по сторонам и начать жить.\n", "final_title": "Работа с программой 12 шагов", "final_annotation": "Личный опыт работы с программой и духовное выздоровление.", "display_date": "18 августа 2017, 02:55"}, {"path": "data/lj_export_clean/posts_md/84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм.md", "source": "LiveJournal", "filename": "84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм", "full_content": "# почему надо выходить замуж за бандитов а не за свою космическую любовь (или письмо лизе сидориной)\n*Date*: 17 ноября 2017, 02:23\n*URL*: https://olymarkes.livejournal.com/84723.html\n*Tags*: #000000\n\nСидорина спрашивает меня: почему. И вот пока я лечу от Москвы до Питера у меня есть немного времени.. Постараюсь тебе объяснить, Лизочек.\nКосмическая любовь - она для космоса. Она для вдохновения, для новых песен, для того, чтобы чувствовать всю глубину, силу и боль бытия. «Это все понятно» - скажешь ты, и будешь абсолютно права. Но есть еще кое-что. Мне кажется, что она не совместима с жизнью. Не совместима с реальностью, с грубым миром, с твердым миром, с миром вещей, всех остальных людей, миром жэка, паспортного стола, налоговой, мудака соседа, который делает ремонт после 23:00, психа, который следит за тобой и пишет всем твоим и прочего вполне себе некосмического дерьма. А если она совместима - то это уже не космическая любовь, а вполне земная. Я даже думаю так - космическая любовь несовместима с сексом. Потому что секс - это очень земная штука, а наше тонкое тело - не очень. И можно, конечно, все совмещать, но на практике и по факту это мало кому удается, особенно в долгосрочной перспективе.\nЧто касается бандитов. Ты тут спросила меня про Сергея Бодрова, типа не мой ли это гипотетический идеал. А я в этот момент как раз пялилась в глаза Марка Рентона, нарисованного Гордеем, и сказала тебе: «Слушай, ну Сергей все равно был творческим человеком.. А вот Данила Багров - это тот самый типаж». Потому что сложно найти что-то более привлекательное, чем простой парень, который умеет обращаться с оружием и решать вопросы с людьми, сильнее, богаче и влиятельнее. Нет ничего круче характера, который проявляется в реальных делах в этом, твердом мире. Ну что я тебе рассказываю? У меня были и творческие, и космические, но когда дело доходило до каких-то реальных вопросов, где надо было врубить мужскую ответственность, врубалась она быстрее у меня.\nА еще говорят, что это я такая типа телка с яйцами, которая не может играть фэйр плэй. Да нифига, я много могу сама, но не все. И я очень беззащитна во многих вопросах, и иногда хочу на ручки и ничего не хочу решать. Пусть мой мужчина разбирается. И с одной стороны очень дисциплинирует и воспитывает, когда ты все сама, все сама, а твоя космическая любовь только дарит тебе глубину бытия, наполняя тебя силами для всех твоих свершений. Но вот нихуяшечки я не считаю это идеальным раскладом.\nНу и про Рэнтбоя теперь, почему я питаю к нему такую нежность. Его круто рассматривать в контексте остальных персонажей, и только тогда можно увидеть все оттенки - боюсь описать у меня получится крайне топорно, но надеюсь суть ты поймешь. Во-первых зависимость - это с одной только стороны чума и проклятие. Зависимый человек - это система, которая работает определенным образом. И являясь сама зависимым человеком, я всегда предпочту totally addictive\nчеловеку, который может контролировать свою жизнь. Любой контроль - это всего лишь иллюзия, и большинство людей сидят в ней по уши. Зависимый человек знает, что он бессилен. И 12 шагах принять бессилие - это самый первый шаг. Большинство людей никогда не сделают его, и мне их даже отчасти жаль по этому поводу. Рэнтбой - он абсолютно бессилен, и так в этом невероятно мил.\nИ если смотреть постфактум\n- не было плохих периодов, все придумано для чего-то. Когда ты на системе, все в мире относительно. Это даже чем-то похоже на триатлон, только в торче никто не оценит твоих ежедневных подвигов, ибо совершаешь ты их во имя зла, самоуничтожения и тотального деструктива. Но! Ты их все-таки совершаешь, и навыки остаются, и мышление, и границы возможного. Этика как раз таки всегда заложена в характер - и тут у Рэнтбоя как раз все в порядке, с этим. Торчать можно по-разному, и у каждого свое дно. Ну и вообще у большинства людей в моем окружении все в порядке с жизненными принципами, это чтобы ты не думала что абсолютно все бывшие торчки - хорошие. В трезвости зависимые люди тоже бывают редкостными мудаками, и в торче бывают люди хорошие, так что это я не про всех.. Про отдельных людей скорее.\nТак вот, такие люди привыкли надеятся только на себя, но кстати параллельно могут решить и твои вопросы, если ты будешь нуждаться в помощи. Ну и что касается всего остального - помнишь, как Данила Багров вытаскивал эту рашн проститьют Мэрелин? Вот как-то так надо, чтобы человек относился ко всем, кто слабее его. А не только к самым родным. Мужчина чувствует, что если не он - то никто. И просто делает. И знаешь, на самом деле мир полон таких мужчин - только мы с тобой телочки из творческой среды, и как раз здесь их остро не хватает.\nВ детстве моими героями были Робин Гуд и Д’артаньян, со временем в эту историю добавилось много чего еще, начиная от двух высших заканчивая умением делать инъекции, пиздить людей голыми руками и метко стрелять от бедра. Сочетание силы и бессилия, преобладание реального над космическим, но при этом - духовность, основанная на встроенных аспектах характера. То есть не напускная и вышколенная доброта, учтивость и бла бла, а что-то такое, чего человек сам в себе не видит и не осознает, но оно присутствует и очевидно всем окружающим.\nНу и в конце этой истории надо отдать дань и космической любви тоже. Love is not a crime. Преступление - это каждой своей космической любви стараться придать земную форму, пытаясь убить сразу двух зайцев. Помнишь фильм, который мы смотрели сегодня? Так вот, я думаю что эта брюнетка была права: «You totally fucked up, Margo» - потому что все границы только в нашей голове, и они лишают нас счастья чувствовать сразу все: мы разрешаем себе только одну форму любви - вытекающую в обладание. Хотя есть и другие способы. Стоять, и ничего не трогать… В моей жизни были такие встречи, такие люди - и самым чистым образом, через абсолютную, божественную любовь они дотрагивались до моего сердца. И знаешь, я потом уже поняла - люди разные, а космос - он один. И когда мне что-то попадает в сердце, я преклоняю колено перед Богом, а не перед человеком, через которого он мне является. Потому что если опуститься на колени через человеком, вряд ли он будет вести себя корректно - скорее всего, он офигеет от такой чести -\nи будет прав. Нечего путать понятия, моросить и все такое. Любить космос и любить человека - это все таки разные понятия. И вот когда ты встретишь человека и полюбишь в нем человеческое - ты поймешь, о чем я говорила. И, кстати, ему не обязательно быть бандитом. Это я вообще пошутила, если что)\np.s.\nхочу запомнить эту неделю, когда мы ложились в 5 утра, как будто нам всем по 19 - сводили песни, монтировали клипы, смотрели фильмы с Бодровым, пили чай и выбирались из дома только в сааааааааамой крайней необходимости: в кафе через дорогу, на съемку, на студию, на концерт, в перекресток за… ну, короче.\nесли жизнь проходит, то в эту секунду я чувствую, что проходит она правильно. я вижу внизу огни Питера, за сим заканчиваю свое письмо, и до встречи завтра\n", "final_title": "Работа с программой 12 шагов", "final_annotation": "Личный опыт работы с программой и духовное выздоровление.", "display_date": "17 ноября 2017, 02:23"}];
        const data2 = [{"path": "data/vi_vse_nepr_export/posts_md/2020-11-22__115__антон_многое_открывал_кажется_рассказал_плите_собираются.md", "source": "Vi Vse Nepr", "filename": "2020-11-22__115__антон_многое_открывал_кажется_рассказал_плите_собираются", "full_content": "# 2020-11-22 — антон многое открывал кажется рассказал плите собираются\n*Datetime*: 2020-11-22T22:57:06+08:00\n*Message ID*: 115\n\nАнтон многое мне открывал. Кажется, это он рассказал мне, что на «Плите» собираются неформалы - и что-то в этом меня очень задело. Мне так захотелось стать частью этой тусовки «не таких, как все», что в один день я пришла из школы, закинула рюкзак в ящик для картофеля, который стоял у нас в подъезде, взяла проездной и отправилась на трамвайную остановку.\n\nМеня потряхивало от страха. Я еще никогда не пользовалась транспортом без взрослых. Мне казалось, что папа в любой момент может проехать мимо меня на машине, и я торопила трамвай, который все не шел. Меня научили спрашивать у взрослых дорогу, и как-то я узнала, какой именно трамвай мне нужен. А может быть, я села на первый попавшийся, и мне просто повезло.\n\nВ трамвае я ехала пригнувшись, потому что боялась, что папа будет проезжать мимо на машине, и увидит меня в окно, и выдаст мне на орехи. Но все прошло благополучно - я вышла на трамвайной остановке между памятником Ленину и сквером. Этот сквер и называли «плитой». По периметру обычно стояли лотки с неформальскими аксессуарами - браслеты, банданы и торбы с названиями групп, сережки для пирсинга и многое другое, что при правильном применении создавало визуальное отличие - делало тебя не обывателем, а неформалом.\n\nУ памятника Ленину все время шла вялотекущая демонстрация коммунистов с красными флагами, мегафонами и плакатами. Никто не обращал на них внимание, никто не разгонял и уж тем более не воспринимал их как угрозу действующей власти. Это сейчас на контрасте все эти несанкционированные митинги и шествия выглядят даже как-то героически - тогда свобода была во всем, и для нас, детей, она была не в новинку, как для наших родителей. Для нас свобода была данностью. Все эти лотки и палатки с торговлей всем на свете, субкультурность, ставшая разрешенной и массовой - все это родилось у нас на глазах, но быстро стало обыденным - мы совсем не ценили этой свободы, а родители были только рады поменять все это на какую-то уверенность в завтрашнем дне.\n\nЯ стояла в центре сквера и от адреналина у меня срывалось дыхание, я видела группку «неформалов» и понимала, что мне надо подойти к ним и познакомиться - ведь это и было моей целью. Мне было страшно, что меня отвергнут и не возьмут к себе - это уже происходило со мной в школе, и если произойдет и здесь - это бы разбило мне сердце. Но я решила все-таки сделать это: выдохнула и подошла.\n\nСпич мой был какой-то максимально наивный: я сказала, что идентефицировала их, как неформалов, и хотела бы стать частью их тусовки. Девушка, к которой я обращалась, повела себя достаточно снисходительно - спросила, как мое «погоняло» - и когда узнала, что у меня его нет, предложила ряд своих вариантов. Я запомнила только «Бритвочка» - кажется, на нем мы остановились.\n\nМне сразу было предложено выпить немного водки и пойти на «Башню» - заброшенная гигантская телевышка в центре Екатеринбурга, которую снесли несколько лет назад - долгие годы она была символом города, возвышаясь над центром - пустые окна, торчащая арматура и еле различимые фигуры смельчаков, которые залезали на двухсотметровую высоту по внешней лестнице или по арматуре или по наружной лестнице из скоб. Однажды, и я окажусь там. Но не в этот раз.\n\nМы только дошли до башни, я увидела ее огромное основание, утонувшее в зарослях сорняка, в рисунках и в мусоре - мне стало страшно - а вдруг меня изнасилуют? А вдруг эти люди плохие? Но самое страшное - это если папа узнает и будет ругаться. Я попрощалась и побежала в сторону дома.\n\nReactions: 👍4\n", "final_title": "# 2020-11-22 — антон многое открывал кажется рассказал плите", "final_annotation": "Творческий текст о жизни и внутренних переживаниях.", "display_date": "Дата неизвестна"}, {"path": "data/lj_export_clean/posts_md/2009-10-21__5475__знаешь_где_фу.md", "source": "LiveJournal", "filename": "2009-10-21__5475__знаешь_где_фу", "full_content": "# Знаешь, где \"Фу\" ?\n*Date*: 2009-10-21T22:53:00+00:00\n*URL*: https://olymarkes.livejournal.com/5475.html\n*Tags*: бубубу, квартира с оранжевыми стенами, факенщщет\n\n- Оль, знаешь кризисную поговорку? – Юля (\njuliez_makarova\n)  хитро улыбалась, - Не имей сто друзей, а имей сто рублей!\n- Ну-ну.\nМой статус в контакте – отличное рекламное место. Попадание в 3 тыс. человек target group – стопроцентное. Последнее время я активно этим пользовалась. Началось всё с того, что одногрупница написала: «Оль, не знаешь, кому гитара нужна?». Лот номер один ушёл через несколько часов.\n- Пакуряяям! – радостно подумала я и написала в статусе: «Здесь могла бы быть ваша реклама!»\nПотом таким же макаром был отправлен айфон, который Паша выйграл на БГВ. Ещё через несколько дней – место в машине до Магнитки…\nСкорее всего, в этот жж вы забрели, благодаря моему статусу )) А мне всегда говорили: «Ну и нафиг ты их всех добавляешь?», а я просто не могу отказать в дружбе, даже если этот отказ - электронный,  символический.\nЧто там у нас в личных сообщениях? «В Вашем ящике 9056 сообщений. На странице сообщения #1-20.»\nПоследнее время я, правда, удаляю те, на которые отвечаю – так легче ориентироваться.\n«Вы отправили 7343 сообщения. На странице показаны сообщения #1-20.»\n… и почти не отстаю. Больше я нигде не работаю ) Хожу на репетиции, занимаюсь спортом, расплываюсь мыслью по древу, ищу вдохновения, внимательно смотрю по сторонам, слушаю город.. Слушаю, как говорят люди. Как они живут, как любят. Учусь видеть сложное в простом. По-идее, когда это даёт плоды (пример: я музыкант, и мою музыку слушают не только мои родственники)  - кто-то должен сделать так, чтобы мне и моим музыкантам всегда было хотя бы 1. что есть 2. где жить.\nМне, как биг боссу, стыдно перед парнями. Я говорила – вот давайте ещё постараемся, и жизнь изменится к лучшему. И дело нашей жизни начнёт приносить хоть какой-то доход… Конечно, они меня ни в чём не обвиняют. Просто скоро найдут себе «приличные» работы, и времени на гастроли и репетиции не останется.\nБу бу бу. Навеяны мысли тем, что нам с Юлей нечем платить за квартиру. За нашу маленькую любимую квартирку с оранжевыми стенами.\n- Если бы все мои друзья вконтакте скинулись по 8 рублей, нам было бы чем заплатить… О… так и напишу!\nМы с Юлей решили устроить встречу с хозяйкой, попросить её скинуть нам квартплату. Но даже если скинет.. .Следующий концерт, в Гринго – благотворительный. А нам самим, блин, гуманитарная помощь нужна. Юля, как настоящая бедная актриса, целыми днями сидит дома, читает Станиславского и есть одни бичпакеты.\nАня Шубина, моя одногрупница – самая добрая девушка на свете, сразу перешла к конструктивным действиям:\n- Оля, давай создадим группу, организуем сбор денег..! – написала она мне в аську, прочитав статус.\n- Нуууу.. Я не знаю как… Да и вообще…\nПотом я почитала стену – народ помочь хочет.. Почему бы и нет? Нет, не так. Почему не стыдно принять помощь? Альбом «Снежная Барселона» мы записывали за настоящие большие деньги, а выложили, отдали всем-всем абсолютно бесплатно. Я даже не перевожу в бабос человеко-труд (запись, репетиции, творческие процессы). Чисто технически - на студии и на сведение ушло ровно 100 т.р. Ощутимая сумма для молодой группы? Ога. Мы даже не пытались «отбить» эти деньги, потому что тогда финансовый вопрос стоял не так остро. Сейчас другое дело.\nСоздала заметку с реквизитами Яндекс.Деньги, какая-то девочка в комментариях написала «Фу.»\nТак и подмывало ответить: ««Фу!» - у тебя в штанах. Не нравится - проходи мимо.»\nНо я промолчала. Господь терпел и нам велел ) И эти времена пройдут, и может быть буду я вальяжно ездить на лимо, жрать фуа-гра, отращу себе «авторитет» и буду со смехом вспоминать это сложное время. А может – устроюсь журналистом в «Вечерний Екатеринбург», буду носить очки в роговой оправе и писать скучные статьи про озеленение жилых массивов Вторчермета.\nФаккенщет.  Это - лучшее место на земле.\n", "final_title": "Снежная Барселона", "final_annotation": "О периоде создания альбома и пути к трезвости.", "display_date": "2009-10-21T22:53:00+00:00"}, {"path": "data/lj_export_clean/posts_md/8142__no_title.md", "source": "LiveJournal", "filename": "8142__no_title", "full_content": "# (no title)\n*Date*: 18 марта 2009, 02:38\n*URL*: https://olymarkes.livejournal.com/8142.html\n*Tags*: Паша, Юля, менеджер, репортаж с места событий\n\nТут очень высокие потолки… Высокие потолки и обшрапанные стены, а ещё – окно. На окне длинная зелёная штора. А за окном – лёд тает и блестит на солнце, по нему шагают люди без шапок. Я сижу на стуле рядом с кроватью, скрестив ноги. Я смотрю на Пашу.\nПаша ещё находится где-то в параллельной реальности. Минуту назад он приоткрыл один глаз и еле слышно прошептал: «…что…операции…не было…?»\n- Была, Паш.. – я улыбаюсь и беру его за руку, - доктор сказал, что всё хорошо.\nНо он уже не слышит. Снова спит. Но это – такой болезненный сон, когда человек чувствует боль, но ещё не осознаёт её. Может к утру проснётся – обнаружит все эти бинты на себе,  торчащие из тела трубки, какие-то пластиковые баночки с кровью. И каково ему будет – одному, в этой большой больничной палате? Даже некого попросить, чтобы воды принесли. Вот он, минус VIP – одноместного размещения.\nНо я смотрю на него и улыбаюсь. Я спокойна и счастлива, потому что сейчас уже всё хорошо. И можно выдохнуть и перестать боятся.\n***\nК нам приезжал Парень из Африки.\n«Красивый город, но может ты скажешь, куда мне ехать…?!»  - прочитала я смс и офигела.\nМы с Юлей сидели в нашем новом доме на Мамина-Сибиряка 126. На вечер того дня у нас была запланирована фотосессия в джакузи с дискоболом, мы ждали в гости Сергея Никифорова (нашего оф. фотографа) и самые сливки группы Alai Oli – Бро и Диму.\nФотосессия прошла отлично. Пока что у меня есть только одна картинка (см. вконтакте аватар), но позже вы всё увидите. Ещё решили сделать нашему менеджеру приятно (см. вконтакте фотоальбом Боже Храни Менеджера!).\nСледующий день гуляли с Парнем из Африки по городу, а потом я ходила на читку  пьесы «Китайская Стена»  в театр Коляды. Вдохновилась…\nПеред концертом мы с Игорем (пареньизафрики – слишком длинно) и Бро съездили на студию к Тополю, чтобы бахнуть пару совместных треков. По пути зашли в Спид-центр, сделали экспресс-тесты на ВИЧ  (ну это входит в программу развлечений для гостей нашего города). Отличный саундтрек – песня Noize MC «Кантемировская»,  как раз на днях закачала музыки в телефон, чтобы слушать через новые блютуз наушники. К слову – все результаты - отрицательные.\nТусовка в 2КУ прошла отлично. И самая жесть была, когда я увидела в зале нашего менеджера. Он специально прилетел из Питера… или из Москвы? Отправил на концерт  KREC&CHEK своего заместителя, а сам приехал к нам… Неожиданно и очень радостно. Во время концерта находила его взглядом в толпе, и было мне так хорошо от этого!  Ещё я познакомилась с одной из своих подруг по переписке: она подарила мне маленького золотого львёнка на шею. Типа на 8е марта…  Тоже – с ума сойти как приятно )\nПотом, как обычно, менеджер превратил нашу жизнь в праздник. Накупил кучу еды и выпивки для тех, кто пьёт (половина Alai Oli постится, а я – не пью вообще), у нас на Мамина Сибиряка собралась огромная компания, я приготовила макароны по-флотски, Костю напоили водкой. Все кричали «ПЕЙ! ПЕЙ! ПЕЙ!» и наливали рюмку за рюмкой. Наш московский хэдлайнер Игорь тоже нормально принял на грудь ) Потом все отправились в Квартиру. Я оставила Бро ответственным за москвича и свалила домой.\nВ воскресенье мы с нашим менеджером и его девушкой Катей отправились кататься на Ежовую. Ещё с нами поехал Паша. Он вообще все эти дни «тусовался». Ходил на своих двух ногах, ожидая, что после выходных его положат в больницу, и всё-таки сделают операцию.\nПозвонил Бро. Рассказал, что еле донёс Игоря до поезда в Омск. Потом, уже из Омска Игорь написал: «Тут меня тоже не встретили. На вокзале мне дали по почкам и отобрали все вещи. А гитара у вас?». Гитару, как выяснилось позже, Бро положил на полку в поезде. Пакурям, гитара! Ну, о приключениях Парня из Африки на гастролях можно написать отдельный пост, или целый иронический детектив в стиле Дарьи Донцовой. Не мой стайл.\n***\nВ понедельник Паше сказали, что надо ехать в Челябинск и делать операцию по месту прописки. Во вторник он приехал в Челябинск, где ему сказали: «Ну ты, чувак, даёшь… Тусуешься, а у тебя всё это время позвонок проседает и разрушается!». Потыкали указкой в снимки МРТ, чтобы Паша понял: где осколки позвонка, а где – спинной мозг, И ещё популярно объяснили, что будет, если осколки и спинной мозг встретятся  – ноги откажут и всё в этом роде. А если не сделать операцию прямо сейчас (130 тысяч), то всё будет плохо.\nНа следующий день  Паша вернулся в Екатеринбург, и я позвонила Жене Ройзману. Если почитать его ЖЖ можно понять ход моих мыслей – я не могу даже представить, кого ещё я могла попросить о помощи. Изначально, просьба была такая – позвонить глав. Врачу 36ой больницы (там сказали – операция стоит всего 30 тысяч!) и попросить его, чтобы хирурги починили неместного Пашу. Если позвоню я – меня пошлют куда подальше, сами понимаете. А если позвонит Ройзман, его как минимум послушают, и он успеет сказать что Паша –  многократный чемпион России по маунтинборду, плюс ещё вице-чемпион мира, и вообще – не последний человек в экстримальном спорте.\nДва дня Женя нянчился с нами, обзванивал врачей, мы пробовали сделать Паше временную прописку и страховой полис – но всё это слишком растягивалось по времени, а тянуть было уже нельзя. В пятницу мы снова съездили с утра на Компрессорный в 36ую, а потом Женя договорился с Институтом травматологии, мы приехали туда и Пашу, наконец, оформили. Без полиса и паспорта. В отличную одноместную палату с холодильником(!!). И отпустили на выходные домой, потому что в понедельник – все анализы, а операция – только во вторник.\n***\nЕщё приехал Михей – учитель йоги. Мы со Здоми занимались у него, когда были на ГОА. И Здоми организовал ему семинар. Два дня – четыре занятия. Хорошо, конечно, но в Индии мне нравилось больше…\n***\nВ понедельник я ходила на «Амиго», куда меня позвала Саша Чичканова – помощник режиссера Коляды-театра. Она сказала, что именно этот спектакль по настроению схож с моим творчеством. И знаете – да… Плакать и улыбаться.\nРазговаривали с ней потом в коридоре – я всякие истории про себя рассказывала. Актёры уходили домой, проходя мимо нас – прощались с Сашей. Поймала себя на том, что я  многих из них знаю по именам. А Ягодина я раньше даже и представить не могла в амплуа гениального актёра – хоть мы и были знакомы: с Курарой мы нередко оказывались на одной сцене, а вот в театр этот я как-то не попадала.\nПотом за мной пришла Юля и мы пошли домойс. Просыпаюсь рядом с лучшим другом – и весь день потом хожу заряженная. А ещё лучше – весь день не расставаться. Раньше мы с Юю всё-всё делали вместе, а сейчас – стали ещё ближе. И никакие расстояния нас не смогут разделить. И никакие временные промежутки. Слышишь, Юль..? Я люблю тебя.\n***\nОчень много хороших новостей.\n«… записывать альбомы, снимать клипы.. Смотри: перед нами все двери сейчас открыты»  (с) Крэк\n", "final_title": "*Date*: 18 марта 2009, 02:38", "final_annotation": "Творческий текст о жизни и внутренних переживаниях.", "display_date": "18 марта 2009, 02:38"}, {"path": "data/lj_export_clean/posts_md/72404__sattamassagana_ch3_-_мексика.md", "source": "LiveJournal", "filename": "72404__sattamassagana_ch3_-_мексика", "full_content": "# SATTAMASSAGANA ch3 - Мексика.\n*Date*: 16 октября 2011, 13:11\n*URL*: https://olymarkes.livejournal.com/72404.html\n\nТы просишь меня рассказать тебе про Мексику, мой маленький? Знаешь, знаешь о чем просить.\nНа самом деле здесь все гораздо хитрее, чем ты можешь себе представить. И каждая краска в этой картине имеет свою историю.\nЗдесь переплелось множество нитей из моей жизни. И твоя.\nС чего начнем? Может быть с мескалина?  Мне было лет 14, я возвращалась из ночных рейдов по клубам еще в таком воздушном, розовом кайфе без отходняков, который бывает только в самом начале.\nИ вот, когда город только просыпался – светлым и тихим воскресным утром я  включала гоа-транс и читала Кастанеду. Тогда его мескалиновые трипы под руководством Дона Хуана вызывали во мне острые приступы зависти,  я выкуривала кропаль плана с фольги и меня отпускало.\nПотом было много много много много всего, много лет, наполненных событиями. В числе прочего – несколько лет на ботанике, «золотой век» - начало нашей дружбы, нашей семьи – Наташа, ее братья и сестры, мама, ее огромная квартира –и мне в этой семье нашлось место… Мои странные болезни – одна за другой, и все все все градации физической боли, которые я проживала – и погружалась в такие глубины реальности…. Вы даже не можете представить себе, что может вынести человеческий мозг.\nСовсем не наркотики сделали меня тем, кто я есть. Совсем не желание доказать врагам и родителям, что я могу. Только лишь эта физическая боль, растянувшая минуты до бесконечности, то место, где я всегда была одна – и никто не мог разделить со мной это.\nБоря (младший брат Наташи) очень заботился обо мне. В шкафу-гроубоксе у нас в комнате росло несколько кустов самых прущих сортов саттивы, и когда у меня в глазах совсем темнело от боли, Боря срывал для меня несколько листочков и сушил их утюгом. Я выкуривала колпачок свежей травки с ягодным ароматом, и боль немного отступала. Не зря раковым больным в Америке прописывают это, как лекарство. Ни одно обезболивающее не облегчало моих страданий в то время, а вот травка немного помогала.  Кстати, после этого я уже не могла курить дурь для удовольствия или от скуки. Из всех наркотиков первой меня оставил этот – возможно мой мозг связывал травку и эту боль, и  не хотела больше ничего, что было с ней связано.\nТам, в той комнате, в той кровати со мной происходили самые сакральные вещи. Под одеялом под всеми толщами земли в самой горячей точке ада в самой ледяной точке ада в самой острой точке ада в самой в самой беспощадной точке ада  – он ложился рядом, обнимал меня и мне становилось чуточку легче. И это «чуточку» - это по энергоемкости как вся йога, сделаная мной за всю мою жизнь, как все творчество, как все все все…. На самом деле «чуточку» - это может быть очень много.\nЯ никогда не говорила ему, как я благодарна – слишком тесны для этого слова…   Да и не понять никому, кроме меня.\nПрошли еще месяцы, сложились в годы… Вы смотрели фильм «искусственный разум» про маленького мальчика-робота? Так вот, моя реальность тоже была пустынна и залита водой, затоплена на многие миллиарды километров – и я была на самом самом дне.  Прошлое оставалось в прошлом, я даже и не вспоминала обо всех этих вещах, и совсем другое казалось мне важным.\nИ вот тогда мы с мескалином встретились.  Я и Щекалев  искали хоть-какой-нибудь наркоты, но чтобы этим нельзя было ширяться и это нельзя было бы нюхать, потому что мы старались перестать торчать)  гы гы гы. И вот один нащ друг нашел некое количество «волшебного вещества» из моего кастанедовского детства.\nОни (наши друзья) попробовали его, но ничего особенного не произошло.  Про нас такого сказать нельзя… Не буду устраивать тут трип репорт. Не могу даже.\nЯ открыла глаза, и обнаружила себя на ботанике, в той самой комнате. Мы с Наташей не общались долгое время, и по этому мое нахождение в этой комнате было пиздец каким странным фактом. И у меня было множество мест, куда я могла пойти. Почему я пошла туда???? И в тот момент до меня дошло.  Я лежала на ТОЙ САМОЙ кровати, и… и вокруг меня были обои… обои со светящимися в темноте звездочками. Такие же обои были теперь у меня в комнате.. я из сотен вариантов обоев выбрала именно эти… Бессознательно…  Те же самые обои!!!\nЯ так долго не помнила кто я и где мой дом. И где то место, где меня протащило  по всем кругам ада, и где те люди, которые любили меня тогда, когда я была никому не нужной развалиной… Место, где я умерла первый раз и родилась заново.  Это было здесь.  Гроубокс стоял заброшеным, Боря уже давно жил в Москве…\nЯ вышла из дома на летний бульвар района моей мечты и больше никогда не забывала кто я и где мой дом. Больше никогда не забывала.\n«Я выхожу за дверь,\nВ джунгли Ботаники.\nЧерез двадцать лет эта аллея будет тенистой…\nИ я буду всегда любить тебя, мой маленький.\nНо так, чтобы мы оба не падали вниз.»\nВот, это было про одну строчку…  «Мне бы мескалина, и я доберусь до дома…»\nТак и за многими фразами и образами в песнях скрывается очень много…\n«Здесь у хижины моей кактусы считают на небе звездные точки…Та, другая страна спит под белым покрывалом каждую ночь»\nЯ бывала в очень красивых и энергитически-сильных местах,  я встречала много людей, которые хотели там остаться.  В моей жизни бывали такие моменты – любой бы хотел оказаться на моем месте… Но я в тот момент хотела быть в другом.\nТак и бабки, красота и слава не имеют значения – они бесполезны в тот момент, когда тебе просто хочется уткнуться в шею кому-то за десятки тысяч километров от тебя… И воспоминание о счастье как бесконечная тоска вливается в сердце, побеждая теплый южный воздух,  крики чаек и кокаиновый флер.\nЯ не могу себя наебать. Я всегда буду хотеть к тем, с кем мне было хорошо. И это всегда воспоминание о прошлой жизни, в которую уже никогда не вернуться. Ни за какие деньги… В том консульстве выдают только одну визу на целую жизнь.\nТеперь ты знаешь, что нужно делать, мой маленький.  Только нужно ли? Счастье неуловимо и никому не нужно, вся соль в погоне за ним.. И наша бесконечная драма вполне вписывается в эту концепцию, пока будет она – будут новые песни.\n", "final_title": "# SATTAMASSAGANA ch3 - Мексика.", "final_annotation": "Творческий текст о жизни и внутренних переживаниях.", "display_date": "16 октября 2011, 13:11"}, {"path": "data/lj_export_clean/posts_md/2009-03-21__9489__обо_всём_на_свете.md", "source": "LiveJournal", "filename": "2009-03-21__9489__обо_всём_на_свете", "full_content": "# Обо всём на свете!\n*Date*: 2009-03-21T02:55:00+00:00\n*URL*: https://olymarkes.livejournal.com/9489.html\n\nТри месяца абсолютно трезвого сознания.  Никак не могу перестать считать, для меня каждый такой день праздник. Помню, три месяца назад мне Игорь (Парень из Африки), писал по аське: \"Я молился, чтобы ты ничего не употребляла..\" Тогда я подумала что он - настоящий друг.\n***\nСтолько всего происходит - каждый день наполнен событиями и передвижениями. Последнюю неделю мне срывало крышу по моему велосипеду, и даже при наличии автомобиля под окном я не могла заставить себя выйти на улицу без байка. В хорошую погоду сидеть в машине и жать на педали мне кажется каким-то маразмом, гораздо круче гонять на 20inches bmx по сухому асфальту - летать, перепрыгивая всякие препятствия, запрыгивать на бортики, прыгать дропы... На машине каждый дурак может, а вот баннихоп прыгать - 'это вам не сцепление плавно отпускать.\nОднако, всё не так просто. Пару дней назад на велике попала под ливень. У Ашана... Пока доехала до дома, у меня ни осталось ни одного сухого пятнышка на одежде, плюс ещё грязевая ванна из-под заднего колеса... С таким удовольствием дома переоделась в сухую и тёплую кишку и поехала на машине в Коляда-театр. В тот вечер там читали пьесу \"Фронтовичка\". В очередной раз чувствую себя так, будто мне повезло прикоснуться к чуду.\nГоняла в Тагил поддержать друга, он открыл там группу NA, что это - можете прочитать\nздесь\n, например\nЧерез несколько дней уезжаем в Питер на неделю. Будет несколько концертов, съёмки видео, фотосессии - мы берём с собой нашего официального фотографа Сергея Никифорова, организаторы даже спонсируют его трансфер, так что Жёлтый теперь совсем как член группы.. Будет снимать не только нас, но и Крека с Чеком и крутого Dj Tonetrack, с ними мы последний раз тусили на квартире нашего (Боже, храни..) Менеджера в Москве.\nВ Питер я собралась ехать автостопом. Благо, погода позволяет. Но наш непостижимо прекрасный Артём сказал: \"Никаких автостопов! Если с тобой что-нибудь случится, мы влетим на бабки!\". Вот такое скоцтво, представляете?! НЕ \"как я буду жить без тебя, родная?!\" и даже не \"Я волнуюсь, что ты не напишешь ещё столько прекрасных песен...!\". Хрен, блин!!! А я каждые пол часа его фотографию тряпочкой протираю, чтобы не запылилась..! О, эта агония неразделённой любви!\nВ Питере мы снова будем жить в той оргоменной хате, где джакузи, водяной матрас и много комнат. Ещё из Москвы на наш концерт собираются несколько тусовок. В числе прочих - Михей\nracoonscrew\n, наш со Здоми учитель йоги из freeflow yoga центра в Индии.\n16 мая придётся вернутся, буду в жюри на\nTeleRock Шоу\n***\nПришла ко мне новая песня -  \"Дельфины\", очень она мне нравится.. Если с Димой постараемся, то сыграем её в акустике в Питере. Не могу не поделится парой строчек из неё.\n\" Помоги мне забыть о дельфинах,\nЛуна отражается в их мокрых спинах.\nНаписала моё имя на стекле. Напротив окна\nЯ каждую ночь просыпаюсь одна.\nВ моём городе нет моря,\nНо куда бы я не шла - моё море со мной.\nпросыпаюсь под нежные звуки прибоя...\n...ах, какая у них нежная кожа,\n...какие там на дне звёзды и крабы\nПобудь ещё немного моим другом,\nПобудь ещё хотя бы в мыслях моих рядом\nЯ не умею дышать под водой.\nСкажи, как мне унять боль?\nСкажу Borron Y Cuento Nuevo\nКогда море придёт за мной.\"\n", "final_title": "*Date*: 2009-03-21T02:55:00+00:00", "final_annotation": "Творческий текст о жизни и внутренних переживаниях.", "display_date": "2009-03-21T02:55:00+00:00"}];
