ье - это знать волю Бога о том, что он для тебя приготовил. Счастье - это принимать и успех, и неуспех одинаково. Вот настоящая свобода, которой я себе всегда хотела. Хотеть одного успеха - это крайне уязвимая позиция.\nИ вот на самом деле много надо написать - и это всего лишь подводящая часть. Подводящая часть к тому, что началось потом. Но сначала надо еще дать вводных данных, чтобы картина была полной. Не только про работу, не только про близость, не только про детей и желание стать лучше. Кстати, про детей. Смогу ли я стать хорошей матерью? Я не знаю, только если словосочетание «хорошая мать» изменит свое значение в социуме. Я так мало им даю, на самом деле.. Очень мало. Но у них есть жизнь, целая жизнь впереди. Мало ли это? Я не знаю. Моя мама была со мной всего четыре года, но вся жизнь во мне - это гораздо больше… Могла ли она оставить мне более ценный подарок после себя?\nЧетвертый шаг. Личная инвентаризация дефектов характера - это письменная работа по 12 шагам NA, она была спутником всех этих лет. Я разбирала себя по кирпичикам, я разбирала, какое я говно, и училась с этим работать: видеть это, принимать, стараться поступать по новому. Много ли мне удалось изменить в себе? Хуй да маленько. Но польза колоссальная. Я знаю себя. Я действительно знаю себя.\nИ вот, спустя пять лет я подошла к пятому шагу. Мы признали перед Богом, собой и другим человеком истинную природу наших заблуждений.\nГоворить правду про себя только сначала страшно. Потом ты входишь во вкус. Признавать свои заблуждения страшнее всего перед собой - это похоже на то, как тебя обдает жаром стыда, но потом ты говоришь себе: «Ну да, пиздец». И начинаешь что-то с этим делать. Или просто слезаешь с лошади, которая уже сдохла. Оказывается, это все во мне всегда было - эти шаги. Естественным образом я все это делала, но не в таких объемах, конечно. Например жж - это всегда для меня было способом сказать про себя неприятную правду, чтобы очиститься. Нет ничего отвратительнее, чем казаться лучше, чем ты есть на самом деле. Обязательно нужно дать миру посмотреть на тебя такого, какой ты есть. Только так можно найти что-то для себя настоящего, а не подобрать декорации под маску.\nПятый шаг открыл портал в новое измерение, где я совершенно ясно увидела эту картину: я говно, поэтому я старалась всегда во всем стать лучше, приносить пользу и спасать мир так, как у меня это получается. Но вот что касается секты - мы все настолько улучшили и команда настолько самодостаточна и профессиональна, что мои силы и ресурсы могут сделать для компании хуй да маленько. Лучшее, что я могу сделать - это не мешать и добавлять немного панк рока во все происходящее. Но важнее - это конечно не мешать.\nТак куда же деть всю освободившуюся энергию? - подумала я, когда жар стыда и ощущение собственной бесполезности отхлынуло. - Подожди, - сказал внутренний голос, - это еще не пиздец, пиздец будет чуть дальше.\nЧуть раньше со мной случилась Алиса. Где-то на переходном периоде пришли эти песни - такие конкретные, но как будто о событиях, которые только должны произойти. Как это работает? Что это вообще такое? Не знаю.\nМожет мне просто должно было исполниться 30, и вдруг исполнилось.\n9% заряда на ноутбуке, поэтому на сегодня я закончу. Но это если честно даже еще не начало.\n", "preview": "# null/признай перед Богом, собой и другим человеком, что ты говно/\n*Date*: 2018-01-21T00:26:00+00:00\n*URL*: https://olymarkes.livejournal.com/86024.html\n*Tags*: #000000, #sekta\n\nПоследние пять лет я спасала мир. Хех, не будем обсуждать, насколько хорошо у меня это получалось. В иллюзиях я не пребываю. Скорее я про вектор. Нам казалось, что мы делаем очень большое и важное дело и ни в коем случае ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2017-11-13.md", "source": "Instagram", "date": "2017-11-13", "filename": "2017-11-13", "title": "2017-11-13", "full_content": "https://www.instagram.com/p/Bbb32BDllar/\n\nДавайте вернём немного спорта в мою отлетевшую в творчество жизнь 😅 \nЛена выпустила наш подкаст (разговорную передачу) из Нью Йорка, там я рассказываю о своём бега, марафонах, о зависимости, о том, какие я делала ошибки и почему можно ненавидеть бег, и как его потом полюбить)) Мне кажется что очень круто, что мы с Леной хорошо знакомы. Это даже не интервью, это беседа. Напишите потом, как вам 😎\n\nСсылка у @tzarapina в аккаунте\n", "preview": "https://www.instagram.com/p/Bbb32BDllar/\n\nДавайте вернём немного спорта в мою отлетевшую в творчество жизнь 😅 \nЛена выпустила наш подкаст (разговорную передачу) из Нью Йорка, там я рассказываю о своём бега, марафонах, о зависимости, о том, какие я делала ошибки и почему можно ненавидеть бег, и как его потом полюбить)) Мне кажется что очень круто, что мы с Леной хорошо знакомы. Это даже не интервью", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/ig_organized/long_200_md/2017-01-20__2.md", "source": "Instagram", "date": "2017-01-20", "filename": "2017-01-20__2", "title": "2", "full_content": "https://www.instagram.com/p/BPfTJ32lRcb/\n\nМы с Леной победили прокрастинацию и телефонную зависимость 😀 теперь сажаем деревья в приложении Forest))) Кристина даже нарисовала нашу радость от этого.\n\nА ещё мы открыли наборы во всех филиалах @sektaschool \nПопасть к нам на занятия, в руки самых классных кураторов можно в следующих городах:\n\nМосква, Санкт-Петербург, Екатеринбург, Минск, Киев, Ростов-На-Дону, Нижний Новгород, Омск, Казань, Челябинск, Самара, Новосибирск 🎉 #appforest\n", "preview": "https://www.instagram.com/p/BPfTJ32lRcb/\n\nМы с Леной победили прокрастинацию и телефонную зависимость 😀 теперь сажаем деревья в приложении Forest))) Кристина даже нарисовала нашу радость от этого.\n\nА ещё мы открыли наборы во всех филиалах @sektaschool \nПопасть к нам на занятия, в руки самых классных кураторов можно в следующих городах:\n\nМосква, Санкт-Петербург, Екатеринбург, Минск, Киев, Ростов-На", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/ig_organized/long_200_md/2016-12-21__2.md", "source": "Instagram", "date": "2016-12-21", "filename": "2016-12-21__2", "title": "2", "full_content": "https://www.instagram.com/p/BOR-m41lXyw/\n\n#bigsektabattle2 \nПосле моей первой неудачной Индии жить стало как-то полегче. Я первый раз в жизни признала, что вредные привычки свои я ненавижу. Кажется, что это очевидно - но на самом деле все было не так. Тяжело жить, когда с одной стороны ты любишь здоровый и спортивный вид своего тела, а с другой стороны ты любишь алкоголь, наркотики и сигареты. Мне казалось, что я люблю все вредное - но той зимой я окончательно приняла, что любовь и зависимость - это совершенно разные вещи, хотя по ощущениям они похожи. Любовь тебя не разрушает и не заставляет тебя страдать. А зависимость - заставляет. И так я наконец-то обрела почву под ногами. Конечно, она все еще шаталась…\n\nПол года в фитнес-клубе, несколько месяцев шаткой полной трезвости.. Тогда мы как-раз только -только выпустили альбом «Снежная Барселона», и поехали в небольшой тур в его поддержку. Во-первых я была жутко недовольна альбомом, и очень горько плакала. Во-вторых в одном из городов я встретила моих друзей-наркоманов, один из которых поднял мою футболку и, защипнув жирок на животе, сказал: «Ооооо… Кто-то поправился!». Я помню как в тот вечер я не могла заснуть из-за страшной боли в груди. А как же все мои усилия? Я пол года не вылезала из зала, стараясь оставаться в форме и в трезвости… Но неужели это невозможно?! Боль была такой сильной, что я нашла только один способ, как ее снять. Я просто перестала есть. Вообще. Прочитала про «лечебное голодание» и все его прелести и подумала, что это - очень хорошая идея. Но это была очень, очень, очень плохая идея… Особенно для тех обстоятельств, в которых я находилась. \nНу и немного фактов: я поправилась с 49 до 56 кг. И это фото сделано в 56. Эта фотосессия была для меня психотерапией, я убеждала себя в том, что у меня - красивое и сильное тело, что я люблю его и могу им гордиться.. Но внешний голос иногда может быть громче внутреннего, поэтому моя терапия не сработала в тот момент.. Но она была важным началом, фундаментом, который я оценила уже сильно после… #mysektaway\n", "preview": "https://www.instagram.com/p/BOR-m41lXyw/\n\n#bigsektabattle2 \nПосле моей первой неудачной Индии жить стало как-то полегче. Я первый раз в жизни признала, что вредные привычки свои я ненавижу. Кажется, что это очевидно - но на самом деле все было не так. Тяжело жить, когда с одной стороны ты любишь здоровый и спортивный вид своего тела, а с другой стороны ты любишь алкоголь, наркотики и сигареты. Мне", "annotation": "Празднование периода трезвости и размышления о чистоте."}, {"path": "data/ig_organized/long_200_md/2016-12-14.md", "source": "Instagram", "date": "2016-12-14", "filename": "2016-12-14", "title": "2016-12-14", "full_content": "https://www.instagram.com/p/BOAQBgbj0S9/\n\nЭтот пост, наверное, больше для тех, кто знает песню дельфины Alai Oli. Это - та самая квартира, где черно-белые фото, оранжевые стены - просто эта фотография сделана еще до ремонта. Вы спрашиваете, как поддержать тех, кого вы любите в сложной ситуации. Иногда нужно быть рядом. А иногда нужно уйти совсем, чтобы человек понял, что так больше нельзя. Юля не просто искала мне лекарство от боли, это действительно было так «Он еще не был на солнце, ему говорили там жарко.. Если ты достанешь билеты, он сможет жить и без джанка».. Найти билеты в то место, которого не существует. Включить ту самую песню в winamp, которая попадет в цель, и ты не будешь чувствовать боли.. Когда Эми получила свою награду, и все были рады вокруг, и только подруга ее спросила - ну что, Эми? А она плакала: «без наркотиков так грустно…». Я оставалась трезвой гораздо больше времени, чем торчала. Но жизнь моя не имела смысла. Я видела и чувствовала, что ничего в жизни не удержать и не продлить. Уйдут люди, каждый момент жизни, и мы.. И все утекает. И вообще - вся жизнь она о движении к концу. И молодость и красота, которая нам кажется вечной - это валюта с самой дикой инфляцией. Только творчество имеет смысл, но на него совершенно нет никаких душевных сил. И в то время я писала так, как будто завтра меня не будет. \nНо Юля не бросала меня. В то время в Екатеринбурге уже был фитнес, но хороших фитнес-клубов было только два. И в один из них Юля подарила мне абонемент на пол года, он стоил каких-то невероятных денег, как билет в космос.. Она знала, что во многом моя тоска связана с тем, что я не могу хорошо выглядеть без ... Но может я просто неправильно все делала, и стоило обратиться к профессионалам? А еще в моей жизни появилась Ника - человек, который работал с зависимыми людьми. От нее я узнала, что зависимость не лечится. И как кто-то написал мне, бывших наркоманов не бывает. Это правда. Но есть наркоманы, которые больше не употребляют наркотики, алкоголь, и вообще ничего, что изменяет сознание. В то время я думала, что такая категоричность мне не подойдет. Что мне достаточно просто не ЗЛОупотреблять. И как бы мне хотелось, чтобы на горизонте уже маячил хэппи-энд.. #mysektaway\n", "preview": "https://www.instagram.com/p/BOAQBgbj0S9/\n\nЭтот пост, наверное, больше для тех, кто знает песню дельфины Alai Oli. Это - та самая квартира, где черно-белые фото, оранжевые стены - просто эта фотография сделана еще до ремонта. Вы спрашиваете, как поддержать тех, кого вы любите в сложной ситуации. Иногда нужно быть рядом. А иногда нужно уйти совсем, чтобы человек понял, что так больше нельзя. Юля не ", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/lj_export_clean/posts_md/2011-11-21__71404__-_переверните_паттабхи_джойса_на_спину.md", "source": "LiveJournal", "date": "2011-11-21", "filename": "2011-11-21__71404__-_переверните_паттабхи_джойса_на_спину", "title": "71404 - переверните паттабхи джойса на спину", "full_content": "# - переверните Паттабхи Джойса на спину!!\n*Date*: 2011-11-21T09:52:00+00:00\n*URL*: https://olymarkes.livejournal.com/71404.html\n\nУ меня есть друг, можно даже сказать брат – мы лежали с ним вместе в рехэбе под Екатеринбургом несколько лет назад. Я, 20ти летняя пигалица и он –  чувак из Тагила уже за 30, минимум десять из которых он ебашил по вене, вряд ли когда-нибудь стали общаться в другом месте.\nНо там мы стали по-настоящему близки – иначе и не бывает на войне… И у каждого из нас был свой враг.  Он не верил в Бога, а я слишком сильно верила в то, что смогу сама со всем разобраться…. С нами были еще люди там, но они, кажется, заторчали потом. А Виталик – нет. Он вернулся в Тагил и открыл первую группу Анонимных Наркоманов там – я даже ездила на своей старой восьмерочке  на ее открытие, это была первая далекая поездка за рулем, еще и такого драндулета. Еще он женился и у него родилась дочка. Ей уже скоро годик…\nИ он пишет мне: «Мне кажется,  что мы живем в разных измерениях. У тебя жизнь быстрее, что-ли…»\nЯ только усмехаюсь  -  и меня кроет мурашками от радости, что мой брат идет теперь по своей жизни семимильными шагами, наверстывая упущенное. И у него теперь есть семья, и он ЖИВОЙ….  Это ты живешь быстро, бро. А я…\nМалышка на миллион, которая празднует день рождения, хуяча по груше со всей дури. Меняю за неделю по десять городов, мои вещи раскиданы по разным квартирам в Москве и Питере, и я даже примерно уже не знаю, что у меня есть кроме того набора, что в чемодане.\nМузыка музыка музыка.. Еще у меня есть один друг – не побоюсь этого слова )) Вы можете часто видеть его в комментариях к этому жж. Он говорит, что все это – тление напоказ, бесполезный культ моей личности, который рано или поздно закончится и я умру в муках и попаду в ад, и знаете – он прав.\nЯ уже давно на этом пути, и много раз собиралась сваливать –  ну не чувствую я, что занимаюсь я нужным делом. Не чувствую я, что помогаю людям. Ну да – пишут что песни делают их жизнь лучше, но делают ли они лучше их самих?\nМеня гнало по этому пути невиданной силой, розгами и железными тисками на сердце, который заставляли меня оставить все больше и больше вещей, очищаться –  и вот появилась йога, и секта  –  здесь все мои знания и опыт оказались реально полезными,,,, И даже не обязательным мне оказалось идти колотить табуретки,  чтобы приностить людям радость и пользу. Я пошла преподавать йогу и меня вскрыло..\nЯ научилась читать людей, чувствовать их, раскрывать и вытаскивать на новый уровень восприятия себя, своего тела и души… Сложно это объяснить, но вот смотрите: ни одну из благодарностей по поводу музыки я не могу принять на свой счет, а вот эти счастливые глаза… И когда они подходят ко мне и говорят: «Оля, мне так хорошо просто в твоем присутствии! Оно дает мне силу. Ты вдохновляешь меня…»  меня от счастья просто подкидывает. Я чувствую, что им не нужен мой идеализированный образ –  рядом со своими учениками я всегда бесконечно настоящая. Я считаю, что изначально нужно принять свою природу, свою козлиную личность – и только когда ты будешь собой, ты сможешь начинать поступать по-новому, поступать лучше.\nКогда я преподаю и у людей получается, я чувствую себя на своем месте. Чувствую себя безгранично счастливой. И спасибо моей любимой одногрупнице Ане Шубиной за то, что она осуществила эту мою мечту – построила Дом Солнца на море, куда я могу приезжать к своим ученикам и полностью погружаться в практику.\nпосмотреть на успехи моих учеников )\n", "preview": "# - переверните Паттабхи Джойса на спину!!\n*Date*: 2011-11-21T09:52:00+00:00\n*URL*: https://olymarkes.livejournal.com/71404.html\n\nУ меня есть друг, можно даже сказать брат – мы лежали с ним вместе в рехэбе под Екатеринбургом несколько лет назад. Я, 20ти летняя пигалица и он –  чувак из Тагила уже за 30, минимум десять из которых он ебашил по вене, вряд ли когда-нибудь стали общаться в другом месте", "annotation": "Размышления об участии в программе АА/НА и сообществе."}, {"path": "data/lj_export_clean/posts_md/2009-12-21__16719__no_title.md", "source": "LiveJournal", "date": "2009-12-21", "filename": "2009-12-21__16719__no_title", "title": "16719 no title", "full_content": "# (no title)\n*Date*: 2009-12-21T22:57:00+00:00\n*URL*: https://olymarkes.livejournal.com/16719.html\n*Tags*: бугага, журналистика, трудовые будни\n\n12.07.09\tJimbo:\tЗдравствуйте, Ольга!\nМы готовим интернет-журнал о музыке в нашем регионе, в связи с этим хотелось бы задать несколько вопросов касательно вашей группы. Ждем вашего согласия\n12.07.09\tОльга:\tПривет! задавайте )\n12.07.09\tJimbo:\tЧем развернутее будут ответы - тем лучше!\n1 - Как давно существует ваша группа?\n2 - На что вы расчитывали создавая группу? Что получилось?\n3 - Можно ли вас назвать популярной успешной группой?\n4 - узнают ли вас на улицах?\n5 - востребована ли ваша музыка?\n6 - Как долго вы собираетесь заниматься музыкой?\n7 - чем вы занимаетесь помимо музыки?\n8 - какие книги вы и другие участники группы считаете лучшими, окозавшими на вас какое-либо влияние?\n9 - какие музыкальные альбомы?\n10 - фильмы, мультфильмы?\n11 - не кажется ли вам что вы сдаете обороты, ведь многие из ваших песен стали похожи друг на друга?\n12 - Что бы вы хотели поменять в группе?\n13 - В городе, в стране, в мире?,?,?\n14 - в ваших песнях встречаются ямайские религиозные мотивы - откуда это в вас??\n15 - ваше отношение к наркотикам, алкоголю\n16 - планы на ближайшее будующее\n17 - пару слов вашим слушателям\n12.07.09\tОльга:\tу меня есть принцип - я закончила журфак, и дала клятву гиппократа что я никогда не буду делать работу за коллег и на вопросы буду отвечать только устно. Но у меня есть моя группа и мы живем вместе и я попросила парней ответить на вопросы, вот\n1-Наша группа Образовалась две недели назад.К Нам пришел новый барабанщик.\n2-Я расчитывал увидеть много голых тёлок.А получилось,что пока увидел только одну(Костя-трубач)\n3-Популярность группы зависит от количества популярных людей в группе!Например у нас недавно опять лишился девственности секс - символ группы, Костя так напился, что поддался на очередное изнасилование,А однояичковый Шапо до сих пор свободный.\n4-Да меня постоянно пытаются увести из группы цыгане.Ходят на каждый концерт и поджидают на улице(Дима-Гитарист)\n5-Как то мы с любовником нашего директора красили его гараж,и я пошёл в киоск за водой.Там встретил молодого чувака который спрашивал,есть ли у меня с собой наша аудио касета.По моему это придел всех мечтаний для музыканта живущего в 21веке.(Дима-гитарист)\n6-Мы не строим планы кто сколько будет этим заниматься,можно задать лишь вопрос кто сколько собирается прожить,потому что жить без музыки для нас полный SUCKS(Дима-гитарист)\n7-В родном городе мы занимались кто чем.В культурной столице мы все вместе занимаемся спортом,бегаем катаем йогу,смотрим как наш друг паша катается на Маунтин Борде,А под вечер когда все ложатся спать мы с костей надираемся в хламину.(Дима-Гитарист)\n8-(Костя)-Я дочитываю седьмую версию камасутры,в сентябре перехожу на практику.На меня оказала влияние только единственная книга Майлса Девиса-(автобиография),может быть,потому что это единственная книга которую я читал.\n9-(Костя)-Мой любимы альбом,и музыкальный совместный проект,это Борис Моисеев И Костя Трубач!!!\n(Дима-гитарист)-Мой любимый альбом 30х годов,цыганского,трёх-палого гитариста Джанго Рейнхарда!!!Когда об это узнали цыгане,они решили отыскать меня и отрезать мне два пальца!!!\n10-(Костя- трубач) С переездом в Петербург у нас показывает канал 2X2 , а телевизор у нас стоит только на кухне, и мы когда вместе завтракаем или обедаем одновременно смотрим мультики, например Скуби ду\n11- Каждая песня Alai Oli живет своей жизнью и для каждого человека она значит что то особое и неповторимое, например для нас песня это что то вроде выращенного вместе ребенка, от зачатия до взросления, у Оли рождаются мысли в голове, а мы с группой стараемся вырастить из этих мыслей что то стоящее.(Костя трубач)\n12-( Костя - трубач) Я бы хотел видеть на каждом концерте трех негритянок на подтанцовках, только не знаю как к этому отнесется наша вокалистка.(Оля Маркес)-Пошёл в вон.\n13-(дима_гитарист)-Больше глутомата натрия!\n14-(Дима-гитарист)-Моя бабушка перед тем как я проснусь напевала мне религиозные ямайские мотивы.Откуда это в нашей музыке только ей известно.\n15-Если мы связываем свою жизнь с музыкой,это значит,что мы постоянно сталкиваемся с наркотиками,так что эта тема актуальна в нашей жизни, но сейчас мы регулярно посещаем собрания анонимных наркоманов и это помогает нам не торчать!\nМы собираемся в ближайшем будущем собрать Олимпийский и потом уехать в Индию, учится йоге в одном из университетов в горах.\nэээээээээээ........ среди вас есть красивые и умные девушки? (Костя) Хотя.... Нафига нам умные? (Дима) )))\n", "preview": "# (no title)\n*Date*: 2009-12-21T22:57:00+00:00\n*URL*: https://olymarkes.livejournal.com/16719.html\n*Tags*: бугага, журналистика, трудовые будни\n\n12.07.09\tJimbo:\tЗдравствуйте, Ольга!\nМы готовим интернет-журнал о музыке в нашем регионе, в связи с этим хотелось бы задать несколько вопросов касательно вашей группы. Ждем вашего согласия\n12.07.09\tОльга:\tПривет! задавайте )\n12.07.09\tJimbo:\tЧем развернуте", "annotation": "Размышления об участии в программе АА/НА и сообществе."}];

        let currentFilter = 'all';
        let searchQuery = '';

        function filterPosts() {
            return allPosts.filter(post => {
                const matchesFilter = currentFilter === 'all' || post.source === currentFilter;
                const searchLower = searchQuery.toLowerCase();
                const matchesSearch = searchQuery === '' ||
                    post.title.toLowerCase().includes(searchLower) ||
                    (post.annotation && post.annotation.toLowerCase().includes(searchLower)) ||
                    post.full_content.toLowerCase().includes(searchLower);
                return matchesFilter && matchesSearch;
            });
        }

        function renderPosts() {
            const filtered = filterPosts();
            const grid = document.getElementById('postsGrid');

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">Постов не найдено. Попробуйте изменить фильтры или поисковый запрос.</div>';
                return;
            }

            grid.innerHTML = filtered.map((post, index) => {
                const sourceClass = post.source.toLowerCase().replace(/ /g, '');
                const preview = (post.preview || post.full_content.substring(0, 200)).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, ' ').substring(0, 200);

                return `
                    <div class="post-card" onclick="openPost(${allPosts.indexOf(post)})">
                        <div class="post-header">
                            <span class="post-source source-${sourceClass}">${post.source}</span>
                            <span class="post-date">${post.date}</span>
                        </div>
                        <div class="post-title">${post.title}</div>
                        <div class="post-annotation">${post.annotation}</div>
                        <div class="post-preview">${preview}...</div>
                        <a class="read-more">Читать полностью →</a>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        function openPost(index) {
            const post = allPosts[index];
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');

            const sourceClass = post.source.toLowerCase().replace(/ /g, '');

            modalContent.innerHTML = `
                <div class="post-header">
                    <span class="post-source source-${sourceClass}">${post.source}</span>
                    <span class="post-date">${post.date}</span>
                </div>
                <div class="post-title" style="font-size: 2em; margin: 20px 0;">${post.title}</div>
                <div class="post-annotation" style="font-size: 1.1em; margin-bottom: 20px;">${post.annotation}</div>
                <div class="modal-post-content">${post.full_content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
            `;

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function updateStats() {
            const filtered = filterPosts();
            const stats = document.getElementById('stats');
            stats.textContent = `Показано постов: ${filtered.length} из ${allPosts.length}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPosts();

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderPosts();
                });
            });

            document.getElementById('searchBox').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderPosts();
            });

            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            });

            const scrollBtn = document.getElementById('scrollToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollBtn.classList.add('visible');
                } else {
                    scrollBtn.classList.remove('visible');
                }
            });

            scrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
