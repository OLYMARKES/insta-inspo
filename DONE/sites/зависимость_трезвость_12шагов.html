    <script>
        const allPosts = [{"path": "data/lj_export_clean/posts_md/85298__осторожно_текст.md", "source": "LiveJournal", "date": "Unknown", "filename": "85298__осторожно_текст", "title": "осторожно текст", "full_content": "# осторожно, текст\n*Date*: 18 декабря 2017, 01:49\n*URL*: https://olymarkes.livejournal.com/85298.html\n\n\"Нет сил писать, но надо\nхроники внутреннего ада\"\n2012,04\nНу ладно. - говорю я, - ладно, ладно.   Я готова открыть этот сундук. Первый раз за столько лет я наконец-то готова посмотреть, что там лежит.\nЭто было больно. Это было действительно больно. Прелесть бытия в 30 лет это то, что ты уже успел прожить несколько циклов всех возможных пиздецов, и когда что-то случается с тобой, ты можешь стряхнуть пыль с архивных папок и посмотреть, как это было в прошлый раз, в позапрошлый раз и в позапозапрошлый. И пиздец больше не кажется таким уж уникальным.\nНу что пиздец? Что пиздец? Да не пиздец это вовсе. Вот сижу в аэропорту, в голубой шапке с розовой хуйнюшкой, положила на красивого мальчика ногу, ноутбук тут же, пишу. Перечитываю Дурге. Это конечно не литературный шедевр, но настолько наполненная болью емкость, что текст вполне может считаться терапевтическим. Что там было?\nУ меня был друг, которого я любила. Отношения с ним были невозможны, потому что мы были как будто двух разных видов, и я сама толком не могла объяснить, как все работало. Для абсолютного счастья мне нужно было от него какое-то космическое уважение, особенное место для меня, чтобы оно было выше одной только женской позиции в системе координат. Мне не нужны были верность, забота, защита - я могла позаботиться о себе сама, я все могла сделать сама, если только дать мне те силы, ключ к которым хранился у него. Мне хотелось быть где-то вне этой системы отношений в реальности, но быть очень близко к нему и в то же время высоко. Рядом с ним я чувствовала космос внутри себя, и дело было реально не в нём, не в человеке, а в том, как я чувствовала себя рядом с ним. Нам нечем было заняться вместе, не о чем поговорить, можно сказать, что я чувствовала себя в его обществе неуютно. С первой нашей встречи я думала - Блин, какая-то это херня. Но.. Опять же с первой нашей встречи, когда он обнял меня, это был чистый торч. Он обнимал меня, и все исчезало: весь этот мир, полный интересных и важных для меня дел и вещей начинал лагать, как матрица. Он обнимал меня, и мне открывалась дверь в другой мир, такой родной и знакомый. Мир, откуда я родом, где все мне известно -  и на самом деле я всегда жила там и только там, а все остальное - это лишь слова, вещи и майя. Они такие несущественные, что мне просто незачем туда возвращаться.\nКакие есть плюсы у такого состояния? Ты попадаешь в лимб. Ты подключен к источнику, который прокачивает золотой свет через реальность, и все детали и образы наливаются этим светом. Там я написала «Долбанный космос», «Главное», «Искры», «Снафф».\nДолбанный космос - это про наши вечные параллельные туры. Мне так спокойно и хорошо, я могу не видеться с тобой вечность, ты в дороге и ты пишешь мне, что скучаешь - и каждый мой концерт дышит этой любовью, я беру ее, преумножаю и отдаю, и пока это искрится во мне, я готова написать лучшие песни в своей жизни. Ты не нужен мне, как человек, но мне нужна эта сила, чтобы жить и делать счастливыми всех этих людей, чьи глаза я вижу со сцены.\nТы научил меня любить музыку, ты показал мне другую сторону всего этого - как мне было кайфово просто лежать на кровати и смотреть, как ты пишешь ее, как рождается эта глубина. Я всегда делала это через слова, а ты - через музыку. И я видела, что мы так похожи с изнанки.. Там темнота и звезды. Одно безграничное черное звездное небо на двоих.\nВ то время у меня было слишком много ролей, мне нужно было доказывать себе, что мне похуй, доказывать тебе, что мне похуй, всем вокруг - что я все контролирую. Я слишком мало говорила правды о своих чувствах, потому что мне сложно было объяснить их словами, сложно было упаковать это в социально-приемлемую форму, ведь там еще были дела, слова, поступки - и все это было как-то не так, все это доставляло мне страшное неудобство и адскую боль. Соприкосновение космического чувства и реальности разрывало меня на части, потому что помимо души я все таки была личностью, и мне всё таки нужен был полный спектр всего на свете. Я доказывала себе и всем вокруг, что я такая пиздец самостоятельная и самодостаточная, и что я могу брать нужную мне любовь у разных людей, один будет обо мне заботиться в реальном мире, другой - обожать на расстоянии, третий - да какая там разница, есть ведь еще мои святые друзья, и мои близкие - например те, кто читает Du, вот им-то можно сказать всю правду, и вроде как бы есть одна реальность, но она разбита на множество осколков.\n«И так я разложу весь мир на спектры, и все сойдется» - думала я. Но нет. Ничего не сошлось, и в итоге все остались, а я умерла от той боли, которую сложно измерить и вынести в этот реальный мир. Нет того человека, которым я была, есть какой-то другой.\nНо давайте вернемся к космосу. Я скажу, как правильно читать. Да, там очень много - людям. Но чтобы свет лился сквозь меня так чисто, мне нужен был он.. Давай лучше так: ты. И вот то, что в этой песне - оно тебе. Знаю, как и многие важные для меня люди, ты не читаешь мой блог, но пусть это просто останется тут.\nМы.. Путали города. И ты, и я. Когда вечером переписывались каждый после своего концерта. - Где ты? - И я уже не знаю где я. Но я рядом с тобой.\nИ то, что всегда оставалось за пределами экрана, только в воздухе: «Никого кроме тебя».\nТы говорил мне так, но я никогда не верила. Я не говорила тебе этого, но ты всегда знал, что так. Мне кажется, что мою любовь невозможно не чувствовать. Мне кажется, что моя любовь пробивает стены.\n«В мире всё так непостижимо, что трудно дышать. И ты снимаешь одежду - вдох.. Но надо бежать» - одна встреча между месяцами или неделями, этого так много, на самом деле, если тебе не нужен человек. И если ты чувствуешь эту связь - тебе не нужны подтверждения. Души умеют танцевать очень высоко в небе, где расстояние в несколько тысяч километров совсем не имеет значения. Это вообще не расстояние. А уже если встреча, особенно где-то посреди заснеженного Урала или Сибири - так это вообще.. Очень много. Еще на половину тура хватит.\n«Долбанный космос». Это все, что я чувствовала рядом с тобой - это невероятное, это огромное, это понятное и мне, и тебе. Эта магия. Чистая магия.\n«Главное» - это тоже об этом. Все эти песни очень круто ложились на моё отношение к музыке и людям, которые на самом деле очень важны в этом процессе. Люди на концертах. Люди, которые здесь из-за музыки. Они всегда были, как будто стояли кольцом за нашими спинами. Потому что музыка - она была так важна и для тебя, и для меня, наверное, тоже - хоть я всегда говорила все это очень извиняющимся тоном. Музыка и люди - вот то, что нас объединяло в реальном мире.\nИ ты много говорил мне о том, как это работает и о том, что будет дальше. У тебя, конечно, больше реальности в этом. У меня - нет. У меня все что касается творчества - полный провал в бессознательное. Никак не могу собраться и сделать все по уму, он как будто выключается, как только дело доходит до песен. Они все делают сами, а я ничего не могу изменить. И здесь, в этой песне я хотела по-пацански так разложить все отличия, которые я вижу в наших мирах.\nНе бывает правды. Всё относительно. Что для тебя - одно, для меня - другое. Но то вдохновение, которое ты мне даришь - оно реально в моем мире. Я ненавижу выдумывать, я - раб правды и настоящих чувств. Только об этом я могу писать, только самый-самый жесткий экстракт реальности мне подойдет, чтобы написать хорошую песню. И для того, чтобы это случилось, важно пройти путь. Нужно сдаться, не смотря на свою силу и волю, сдать всю оборону и отдать себя жизни и потоку - он сварит тебя заживо, и ты знаешь это - но пока ты не снимешь броню и не уйдешь туда с головой, у тебя не получится то творчество, которое наполняет жизнь смыслом. Ты не почувствуешь истину, а для тебя только эта истина является смыслом жизни. Я каждую секунду готова умереть, чтобы почувствовать этот смысл. Я готова все отдать. И я делаю это… В этом моменте настоящая магия, только ты и истина - а дальше начинается бизнес. Если бы я могла жить только в космосе - я была бы только рада. Но вот мое реальное тело, моя личность, вот мир, в котором я живу, и все так живут. Поэтому давай сделаем этот бизнес хорошо.\nСтой, и главное будет вокруг.\nКогда я в этом состоянии, я вижу всё. Все связи и сети, как в аватаре, или в том фильме где у нее в желудке пакет с таблетками порвался и она все поняла. Только такая любовь на пороге смерти открывает мне все грани реальности, когда ты счастлив и одновременно каждую минуту умираешь от боли. Только так. Но как было у Пелевина, самое великое открытие человека в реальном мире звучало так: «Во всей вселенной пахнет нефтью»\nМое «Главное» получилось более поэтичным, но чувствуется ли все то, что я вкладывала в эти строки? Не знаю. Тогда я уже побрилась налысо, сделала ту татуировку на затылке, выпустила Сатту - все это происходило параллельно, и песни из Сатты уже были далеким/недалеким прошлым. Я жила вот в этой реальности, которая была смесью мёда, яда и космоса, и писала эти песни, которые казались мне самым сильным, что со мной происходило.\n«Нет золотой середины: или я одержим, или мне безразлично» - через 5 лет я все таки могу сказать, что этому можно научиться. И настоящая любовь умеет обходиться без крайности, но быть наполнена сутью в своем центре. Мне её подарили за заслуги в космической войне, и я благодарна за то, что теперь умею чувствовать и это. Но, к сожалению, две этих крайности никуда не уходят. Шкала вот такая, и она вся до сих пор во мне, и это сука бесит конечно в какие-то моменты. Сложно всегда пребывать в центре.\n«Не существует покоя кроме той силы, которая гонит за ним» - это моя любовь, которая вечно стремится обладать. И счастье в тот момент, когда ты хватаешь комету за хвост, касаешься тени, только в этот момент ты счастлив на самом деле. Путешествие важнее места назначения. Поиск важнее искомого. Процесс важнее результата.\nКак бы научиться не умирать каждый раз в этой погоне.\nНу и что касается Снаффа - это конечно самая сильная история, потому что ты написал к ней музыку. Ты еще обиделся, что я нигде этого не указала - но вот обида и горечь в моем сердце были тогда сильнее благодарности и ощущения крутости всего происходящего. Может быть, если бы каждая эта строчка не была так пропитана реальной болью, все было бы проще. Но я помню, как я ее написала, там вообще тотальный концентрированный ад.\nМне хотелось ебнуть себя и тебя, честное слово, как в том клипе Guns’nRoses. Потому что я не знала, когда этот пиздец уже закончится. Почему мне все хуже и хуже? И когда я пытаюсь завязать с тобой - вокруг начинает все рушиться и взрываться, и на меня выпадает стекло в поезде, и организм отказывается работать, и вообще не понятно как хуже - с тобой или без тебя, но просто постоянно одинаково плохо. И тебе плохо, и мне плохо, и мы встречаемся только на последнем издыхании, на таком пределе, когда уже не можешь встать с кровати - я помню, как ты приезжал и обнимал меня, и раны затягивались. Потом я вставала, могла говорить, и мы снова находили миллион поводов закончить все это. Потому что в реальности быть невозможно. Вне ее - тоже. Я обезболивалась как могла, срывалась два раза за пол года, у Алины есть видео того дня, когда я, вернее мы… и это была моя последняя марка, вообще последнее что-то. 5 лет, 7 месяцев, 20 дней.\nТы говорил - «Может быть, если уже будет совсем ад, что-то изменится?». И вот было несколько раз, когда я видела ад. Каждую секунду реальности, и ведь надо было делать еще какие-то дела, где-то выступать, с кем-то разговаривать, куда-то ехать. Притворяться, что я не труп без содержимого под кожей. Ты был во всем вокруг - дьявол, который прячется в каждой вещи, чтобы уничтожить меня окончательно. Да да, как в Адвокате Дьявола - все сводило меня с ума, бесконечные происшествия, знаки, связь - когда я говорила «отойди от меня» в космосе я слышала такой оглушительный визг всех бесов мира, и все начинало трястись, вся поверхность земного шара, вся моя жизнь. Я была без сил, и это был замкнутый круг -  я не могла отказаться, потому что у меня не было сил на этот отказ, и не было меня - это уже давно не было хорошо, ни одной секунды хорошего, и уж точно никакого золотого света. Я ужасно выглядела, ужасно себя чувствовала, я ничего не могла делать… Побег в ребцентр - это было лучшее, что я могла сделать для себя тогда.\nТам я спряталась, и как будто в стенах часовни я наконец оторвалась от этой силы, спряталась под куполом. Я все делала, все-все-все делала, и меня отпустило. Но знаешь, я никогда не забуду этого: вот этот момент,  когда я остаюсь в помещении одна и ты - везде. Каждый раз, когда пою эти строчки «и на минуту оставшись в ванной, холодный кафель горячим лбом, я чувствую твое дыхание через все стены» я проживаю это заново. Не было ничего реальнее того, что происходило со мной тогда. Это было страшно, это было страшной силы столкновение.\nНо вот конец... он ведь сбылся на самом деле. У нас были те самые 24 часа под одеялом после страшной войны, когда никто не победил, но все сдались - и мы снова перестали быть людьми и стали душами, и стали драконами высоко в небе над замком, над гольф-клубом с самым красивым двором-колодцем, из которого видно звезды.\nА потом я уехала, и когда вернулась - я была уже другим человеком. Даже не так - я вернулась человеком, и полюбила по-настоящему другого человека, того, кто содержал в себе весь спектр реальной любви, как бы это не было сложно - он был именно таким. И я закрыла дверь в космос на много-много-много ключей, и все их выбросила в разные места.\nМы не могли бы сохранить нашу дружбу, потому что мне было слишком больно всю дорогу - и вот только спустя почти 6 лет и несколько циклов разного рода пиздецов я могу наконец-то поговорить об этом. Сильно, да?? Там было столько энергии внутри всего, СТОЛЬКОООО ЛЮБВИИИИИИ что я не могла об этом говорить и писать больше пяти лет, как будто уровень радиации держался, как будто я все еще слышала отголоски взрыва. Вот так вот все было, вот так… И никак по другому.\nВсе идет по кругу или по спирали, я все еще иду только за своим сердцем, механизм внутренний не меняется, но в 30 лет по любому охуеннее, чем в 25. Все, что у тебя есть не делает тебе тюрьму, если ты не боишься все это потерять - это главный урок, который я хотела бы донести самой себе пару лет назад.\nЖизнь одна, и она слишком короткая, чтобы не говорить правду. Жизнь одна, и она слишком короткая, чтобы быть кем-то другим, а не собой. Жизнь одна, и я ни секунды ни о чем не жалела.\n", "preview": "# осторожно, текст\n*Date*: 18 декабря 2017, 01:49\n*URL*: https://olymarkes.livejournal.com/85298.html\n\n\"Нет сил писать, но надо\nхроники внутреннего ада\"\n2012,04\nНу ладно. - говорю я, - ладно, ладно.   Я готова открыть этот сундук. Первый раз за столько лет я наконец-то готова посмотреть, что там лежит.\nЭто было больно. Это было действительно больно. Прелесть бытия в 30 лет это то, что ты уже успел", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/lj_export_clean/posts_md/76690__поможемникеспастижизнь.md", "source": "LiveJournal", "date": "Unknown", "filename": "76690__поможемникеспастижизнь", "title": "поможемникеспастижизнь", "full_content": "# #ПоможемНикеСпастиЖизнь\n*Date*: 25 сентября 2012, 15:21\n*URL*: https://olymarkes.livejournal.com/76690.html\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офигенно, ну, это я так считала.\nСледующий кадр – я с какими-то пакетами иду по поселку Арамиль и рыдаю в три ручья, мне так плохо, что не хочется жить – причем уже давно, даже когда я не торчу, даже когда мне удается прожить без наркотиков несколько дней – ну, по той причине что денег на них уже нет, или потому, что все мои друзья уже отказываются иметь со мной хоть какие-то дела, - мне хочется сдохнуть, потому что жизнь эта не имеет ни цели, ни смысла.\nИ вот – иду я по поселку Арамиль в реабилитационный центр «Зазеркалье», а Ника меня встречает на дороге, обнимает, улыбается и гладит меня: «Ну чегооо ты… Плачешь, девочка? Ну поплачь…» наверное с этого момента Ника всегда была мне мамой.\nОна такая маленькая, такая хрупкая – ниже меня на голову целую, ее можно обхватить и спрятать… Но при этом она – такой ЧЕЛОВЕК. Она как будто находила нас в темном-темном месте и отводила туда, где свет.. Я помню со мной в той реабилитации лежал один парень, ему было 30 лет и кололся он из них половину. И он не мог поверить в Бога, и я помню тот самый момент когда что-то изменилось… Ника всегда находила такие слова, которых не находилось у меня - даже в голове.. И в тот момент она нашла слова для него. И он сказал… «да». Сейчас у него двое детей.\nЕсли бы не она – не было бы этого альбома – Снежная Барселона. На этом диске даже есть ей персональное, огромное СПАСИБО. И за все, что было после – за все наши записи и концерты (а они ведь наши дети) я благодарна ей, она всегда была рядом.\nЕе голос – я так люблю ее слушать, ее вот эту вот манеру смеятся, жестикулировать, что-то показывать. Если ее увидеть один раз – никогда не забудешь, если один раз с ней провести время – подсядешь навсегда.\nПоследние годы она жила на Красных Воротах в маленькой комнате в коммунальной квартире – там никто не мог ужиться из за сумасшедшей соседки Линды Эдмундовны. И только Ника смогла с ней совладать. Так вот – мы с Alai Oli приезжали в Москву выступать, и могли всей группой завалится ночевать к ней – она никогда не отказывала нам, самый терпеливый человек на свете… Как же хочется отплатить тебе, Ника, за все тепло, которое ты дала мне и моим друзьям.\nНика уникальная. Она уникальная, невероятная харизма – такой метр с кепкой, при этом самая настоящая женщина, красивая, нежная, открытая, дерзкая, веселая до разрыва и печенок… и мудрая настолько, что на несколько тысяч человек хватает ее мудрости, и так хочется, чтобы ее узнали еще больше людей… Чтобы она помогла и другим. Чтобы она была здорова, счаслива и всегда, всегда, всегда рядом.\nДля меня это очень, очень важно.\nСейчас у Ники нашли рак, и она конечно никогда не скажет и не попросит сама, но ей очень нужна наша поддержка, наши молитвы, наша помощь. Лечение очень дорогое, но нас много и вместе мы его потянем, и если у вас в сердце отозвалась история моего друга и учителя Ники, то вы тоже можете помочь. Мы все, ее друзья, будем вам очень благодарны.\nВот это реквизиты для финансовой помощи:\nВы можете положить деньги на этот счет: 5331572019702601, в любом салоне связи ЕВРОСЕТЬ.\nА так же, перевести сумму на карту Сбербанка: 4276380066196630.\nА вот группа вконтакте, где вы можете написать Нике слова поддержки!\n", "preview": "# #ПоможемНикеСпастиЖизнь\n*Date*: 25 сентября 2012, 15:21\n*URL*: https://olymarkes.livejournal.com/76690.html\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офиген", "annotation": "Размышления об участии в программе АА/НА и сообществе."}, {"path": "data/lj_export_clean/posts_md/52416__мультимедиа_пост_про_трудовые_будни_alai_oli.md", "source": "LiveJournal", "date": "Unknown", "filename": "52416__мультимедиа_пост_про_трудовые_будни_alai_oli", "title": "мультимедиа пост про трудовые будни alai oli", "full_content": "# мультимедиа пост про трудовые будни Alai Oli\n*Date*: 18 мая 2010, 16:53\n*URL*: https://olymarkes.livejournal.com/52416.html\n\n.... или \"Пидоры и Она\"\nи видео номер три:\n1. Мое Ноу-Хау  - накладная задница. Для тех, кого природа обделила. Модель: Катя Павлова, менеджер Alai Oli. Москва, Внуково\n2. Камерой ничо не снимайте девушка!\n4.  Репетиция Комитета Охраны Тепла - Калининград.\n5. Нижний Новгород\n6. Нижний - 2. аллергия на трезвость )\n7. Бро идет на студию ))\n﻿\n", "preview": "# мультимедиа пост про трудовые будни Alai Oli\n*Date*: 18 мая 2010, 16:53\n*URL*: https://olymarkes.livejournal.com/52416.html\n\n.... или \"Пидоры и Она\"\nи видео номер три:\n1. Мое Ноу-Хау  - накладная задница. Для тех, кого природа обделила. Модель: Катя Павлова, менеджер Alai Oli. Москва, Внуково\n2. Камерой ничо не снимайте девушка!\n4.  Репетиция Комитета Охраны Тепла - Калининград.\n5. Нижний Новгор", "annotation": "Размышления о жизни в трезвости."}, {"path": "data/lj_export_clean/posts_md/87992__scar_tissue_автореферат.md", "source": "LiveJournal", "date": "Unknown", "filename": "87992__scar_tissue_автореферат", "title": "scar tissue автореферат", "full_content": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу отложить телефон, читая Двач до 2х часов ночи. Когда я одна - я как будто остаюсь дома без родителей. Когда нет жесткого контроля извне - я как будто разрешаю себе все. Но разве при людях я запрещаю? Разве люди являются гарантом моего правильного поведения? Ну нет же (это я успокаиваю себя). Если бы я чаще была одна - это бы устаканилось. Я бы компенсировала себе все, а потом бы вернулась на привычные рельсы. Но одиночество - это недоступная.. не буду говорить, что роскошь. Опция. Недоступная в длительной продолжительности опция.\nКогда-то анонимные наркоманы сказали мне: может быть торчать ты еще будешь, но удовольствие мы тебе точно попортим. Не сказать, что я получала удовольствие от наркотиков до этого. Во всем этом было очень много истерики - я хочу, хочу так сильно, как ничего на свете не хотела. Даже не так: мне надо. Мне просто надо. Есть? Дайте. Есть сильнее? Дайте. Есть больше? Дайте. Точно так же анонимные наркоманы попортили мне удовольствие от многих других вещей в трезвости- например, от втыкания в телефон или от покупок. Даже если я продолжаю делать что-то подобное - я осознаю, когда мной руководит зависимое поведение. Я не употребляю 6 лет и 7 месяцев, но при этом я каждый день ловлю себя на зависимом поведении. Думаю, именно это помогает мне оставаться в потоке - продолжать писать шаги и не пробовать изменять сознание в надежде, что сейчас это приведет меня куда-то в место поприятнее, чем то, где я была 10 лет назад.\nДля начала я нарисую вам хронологию своей зависимости, я же никогда этого не делала раньше в своих лонгридах, только в тетрадке из реб.центра, которую никто из вас не читал. Все равно придется делать это в мемуарах) Так что подарю вам эксклюзивчик.\nИтак. 12 лет - я начинаю курить сигареты, пробую травку. Мне некомфортно, кажется что я предаю что-то в себе, что-то важное. У меня есть подаренный мне пакет травки - я не пользуюсь им, предлагаю его папиной подруге, которая курит. Она рассказывает папе, он достаточно жестко реагирует, отвозит меня в общественный центр для наркоманов, пол года я на домашнем аресте, ко мне относятся как к наркоманке, мне показывают фильмы про подвалы дыбенко, я вообще не понимаю - за что так со мной. У меня же была своя голова… Была. Когда к тебе относятся, как к наркоману - ты уже в принципе привыкаешь к этому состоянию. Я привыкла. Думаю, когда детям говорят, что Элджей и его музыка может сделать их наркоманами - это работает примерно так же. Моя зависимость была заложена во мне, но всегда есть тот триггер, который запускает этот механизм.\n(на фото уже 9-10 классы, с 7ого класса я курила. К началу универа выкуривала по две пачки в день)\nВ то время у меня пропало желание не-торчать. Я была готова пробовать, я стала открыта для этого мира и людей в нем. Я читала сайт\ndrugusers\nо внутривенном употреблении , я пыталась понять суть зависимости и зависимых. Мне было 13-14 лет. В то время я встала на сторону идеологии «I dont want to choose life. I choose something else». Мне не нравился лживый мир взрослых - они сами не могли быть примерами трезвости или чистоты, они не были эмпатичными, они не старались понять нас и выслушать. Я хотела связать свою жизнь с социальной журналистикой и программами типа «Снижение вреда» - кстати, почти за 20 последующих лет я успела побыть и клиентом подобных центров, и их амбассадором.\nЛет в 16-17 я нашла Ital-идеологию в растафарианстве. Чистота и естественность. Вегетерианство, травка, никакой химии. На тот момент я уже попробовала ряд наркотиков - несколько клубных сетов - я поняла, что танцевать под наркотиками - это не мое. Но лежать с закрытыми глазами - это, пожалуй, да. Мое употребление химии до 16 лет было эпизодичным, раз 10, максимум - 1-2 дня подряд. Не было денег, не было компании, в которой были тяжелые наркотики. Но по поводу легких - все это было, и это было лучше, чем алкоголь.\nАлкоголь иногда все таки появлялся в нашей жизни - но в качестве редкого веселья. Был долгий период отказа от алко, но ни начала ни конца я не могу вспомнить. Скорее всего весь первый курс университета. Тогда мы начали есть грибы, у меня серьезно повернулась сознание. В тот момент я заплела дреды и взяла достаточно строгую аскезу. Рассталась с парнем, с которым встречалась с 9ого класса, много времени проводила в церкви. Мне хотелось очистится, казалось, что я неправильно живу и все вокруг тоже совершают ошибки. Я чувствовала: мы все должны быть чистыми и невинными, как дети. А мы были далеко от этого.\n(2004-2005)\nКогда я нашла идеологию чистоты в I-tal и православие, я была уверена, что это навсегда. Прошло года 3, мы выпустили альбом, попали в реггей среду, я нашла свое место и ощущение правильности всего, что я делаю. Между мной и химией лежала, как мне казалось, целая вечность. Я осуждала тяжелых наркоманов, считая это слабостью и тупостью. Я успела даже осознать зависимость от гашиша - оказавшись без вещества тгк на неделю, я чуть не сошла с ума. Конечно, это не героиновая ломка - это другое, но психологически очень неприятно. Зато после этого перерыва, я перестала нуждаться в тгк каждый день, и начала относиться к этому спокойнее. В то время, мне кажется, я была ближе всего к психологии независимых людей. Могла бухать с друзьями по выходным, когда мы идем в клуб, а в будни ходить в офис, курить время от времени. Меня это не беспокоило. Тогда я начала кататься на велике, знакомиться со своим запущенным здоровьем и телом, экспериментировать с питанием.\n(2006-2007 первые шаги в здоровом образе жизни. Я наконец-то начала выглядеть лучше, бросила курить!)\nПотом что-то пошло не так. Я встретила любовь, my siberian ragga, мне казалось, что это - ваааааааааа бесподобное нечто, и теперь все будет иначе. Я как будто поменяла свою внутреннюю химию, перестала чувствовать себя тем человеком, который жил и устоялся до этого. И когда мы оказались в Питере -  мне захотелось употребить что-то сильное. Мне казалось, что мы несокрушимы, что ничего не сможет нас разлучить или сломать. Отличное решение на этой волне убиться дешевыми влажными питерскими спидами. И когда я это сделала - это убило всё. И нового воздушного человека во мне, и химию, и любовь. Первое употребление после долгого перерыва выжгло меня изнутри, всю мою идеологию и ощущение правильности, и вообще все. Кстати, где-то в этот период я завела жж, может на несколько месяцев позже. И еще песня «Ищу Тебя» о том моменте. Любовь была у меня, но я потеряла ее в себе.\nКто после этого начал употреблять - я не знаю. Какая-то пустая оболочка без смысла и идеологии.\n21-22 года - это время моего самого активного употребления без контроля и понимания, что со мной происходит. Мне было надо. Мне хотелось. Я искала возможности и способы. Мне конечно хотелось при этом контролировать употребление и не терять свою жизнь. И у меня были способы. Например - не торчать в Екатеринбурге. Я продержалась в этой концепции месяцев 7-8, меня откачивали в турах, в итоге я практически переехала в Ижевск.\nсентрябрь 2008, i am so bad\nБыли моменты, когда я пыталась перестать сама. Я не торчала на героине, но стимуляторы тоже подсаживают тебя на систему, хоть и не такую жесткую. Я пробовала так: например - разогнать дозу до такого, чтобы было уже невозможно употреблять (плохой способ). Отказаться от стимуляторов и употреблять только несинтетические наркотики - лсд, грибы, мескалин. В конце уже не было денег на экзотику, мы со Щекалевым съели семена гавайской розы (я совершила эту ошибку второй раз в жизни). Отравление было таким сильным, что почти сутки я падала в обмороки и испытывала боль во всем теле. Было так плохо, что после этого любое состояние было хорошим. Т.е. Меня больше не кумарило.\nМы уехали автостопом на юг, перед этим я познакомилась с Никой Суринович, которая сказала: хехе, у тебя проблемы. Осознаешь - приходи. И я, с трезвостью в неделю или две, усмехалась в ответ: я могу сама. Вот увидишь. Через месяца полтора трезвости я осталась одна и выпила глинтвейн. А что такого? Это же не наркотики. Теперь можно.\nМного раз за эти два года я пыталась заменить наркотики на алкоголь. Это были и веселые вечеринки, и просто несколько термосов глинтвейна с водкой, без которых я не выходила из дома как раз в тот период - вот в один из этих выползок я пела для ВИЧ+ ребят в помещении группы анонимных наркоманов, многие думают что в тот период я была уже трезвая. Видимо в употреблении я не выглядела так, как представляют себе торчков. Просто грустная.\nВообще все относились ко мне нормально. Юля меня поддерживала и всегда была рядом, одногруппники помогали с учебой, моя группа старалась понять меня. Конечно я вела себя безумно, я психовала, сама отталкивала от себя людей - во многом я хотела сама все потерять, чтобы нащупать дно и оттолкнуться от него, но у меня никак не получалось. Возвращение к наркотикам после перерыва, когда «ты сам» - это болезненно. Казалось, что я падала еще ниже. Мне отчасти нравилась эта эстетика дна, мне было больно в душе, но не страшно. Я употребляла внутривенно, я делала это одна. И вот так казалось все и должно закончится. В какой - то момент ты не хочешь никуда выбираться, не хочешь, чтобы тебе становилось лучше. Ты просто жалеешь, что не можешь умереть прямо сейчас.\nТем не менее употреблять больше недели я не могла. То есть когда я пишу о своем торче, многие представляют меня, как Андрея - который 10 лет ежедневно кололся и искал дозу с редкими перерывами на детоксы. У меня была другая система - я могла употреблять 2-3 дня, наркотики заканчивались или я их выбрасывала раньше. Потом я пыталась компенсировать себе выходы - начинала бегать через силу, еле передвигая ноги, по вечерам - заливаться алкоголем, превращая все это в атмосферу праздника - могу, умею, практикую. Друзья = эндорфины. Пару дней - и я была в норме, ничем не отличалась от других людей, которые бухают по выходным. Так можно жить годами, и многие, многие так живут до сих пор. Особенно в Питере, где Северное техно и вся инфраструктура. Но в Питер, кстати, я переезжала уже на другой волне.\nВ целом у меня было все: друзья по всей стране, прогресс во всех сферах жизни, много полезных связей, деньги на все необходимое, независимость от родителей - мой торч был отвратителен или прекрасен тем, что давал моему «я сама» большую веру и моему эго большую подпитку - а это значит, что мне претила сама идея обращения за помощью. Я понимаю Лил Пипа, понимаю всех этих фрешменов, которые умирают до 25ти. В своем первом ребцентре я рисовала картинку: я держу в руках столько дел, людей, все вокруг меня и завязано на мне - а подо мной бездна, а в ней - огонь. И мне уже жжет пятки.  Но я могу писать песни, могу выходить на сцену, черт возьми, я даже могу подготовиться к экзаменам и сдать сессию, написать охрененное эссе, статью в газету факультета. Я все успеваю - и жить, и умирать.\nЭто было самым сложным в том периоде, да и вообще в любом из последующих. Если в этой жизни ты держишься на уровне нормальных людей, держишь свою жизнь в шатком балансе, то что в той, другой жизни без наркотиков и алкоголя? Норма не измеряется твоими успехами, достижениями, положением общества. Норма - это то, что на твоих внутренних приборах. И строить курс надо по этим приборам, а не по внешним ориентирам. Быть в норме, как все другие люди еще не значит быть в твоей личной норме. Тогда я не знала никого, кто жил бы так, как я и испытывал бы подобное. Если бы мне тогда попалась книга Киддиса Scar Tissue - возможно, я бы лучше поняла, что происходит.\nОчередная моя чистота началась решительно: я пообещала Юле - пол года никаких наркотиков, а она подарила мне абонемент в фитнес клуб, где я попала на первую в жизни йогу, а в последствии - вообще прописалась там, пробуя все все виды групповых и индивидуальных программ. Я решила ходить к Нике в реб.центр, изредка оставаясь там на ночь - просто подсмотреть, как лечат зависимых. Но я выполняла все задания. Ужасом для меня было то, что они говорили об алкоголе - что это такой же наркотик. Я не могла и не хотела с этим соглашаться - настолько он бы интегрирован в жизнь.. Это была норма. Все так отдыхали. Когда в компании я пробовала отказаться от алкоголя - я чувствовала себя несчастной, как единственный ребенок из всех, которому запретили мороженное;\n(разговор с Никой, октябрь 2008)\nНу можно я буду пить но не буду торчать? - ну давай, хе-хе-хе… - Вот так примерно мне отвечала Ника. И я пробовала.\nТогда, после очередного разового срыва на наркотики (около месяца я продержалась с алкоголем и на обещании Юле). И вот тогда я пошла на группу. Она была, кажется, на улице Луначарского. Люди мне не понравились. Все было ужасно, меня стебали, кривили лицо - я была там вообще «не от мира сего», но я как-то покорилась. Кажется в тот момент я приняла бессилие: с алкоголем не получится, я устала, я хочу попробовать так, как вы говорите.\nПервым моим шагом в настоящую трезвость без полумер было абсолютное понимание, что контролировать употребление я не могу, понять зачем я употребляю - я тоже не могу. Не было ясности, что будет дальше, как я там буду — но первый раз в жизни я была готова отказаться от всего: от алкоголя и любых видов наркотиков.\nЭто была осень 2008 года. Мой последний год обучения в университете, год, когда мы выпускали Снежную Барселону. За 2008-2009 год мне едва ли удавалось набрать 1-2-3 месяца трезвости без срывов, но во всяком случае уже большую часть времени я проводила абсолютно чистой - без алкоголя и даже легких наркотиков. Проживала день за днем. Это - первая часть рассказа. Остальное напишу в следующий раз.\n", "preview": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу ", "annotation": "Размышления об участии в программе АА/НА и сообществе."}, {"path": "data/lj_export_clean/posts_md/77244__фак_энд_панч.md", "source": "LiveJournal", "date": "Unknown", "filename": "77244__фак_энд_панч", "title": "фак энд панч", "full_content": "# фак энд панч\n*Date*: 21 ноября 2012, 11:36\n*URL*: https://olymarkes.livejournal.com/77244.html\n\nВообще-то у меня есть тайный жж, в котором отобранные методом придирчивого айкью тестирования ценители прикасаются к самому ценному, потому что сюда порой забредают бараны, от комментариев которых мне хочется убить себя фэйспалмом. Но я знаю, что есть здесь и такие, которые молчат - но им это нужно, как глоток воздуха.\nТак вот, с разрешения моего самого любимого писателя я покажу вам пару его текстов. Лютейший эксклюзив, наслаждайтесь.\nPizza time\nУх, как я не люблю вспоминать этот период жизни.Ты бы знал.\nЛадно. Я наконец-то запутался в своем вранье, и стало очевидно, что героин наконец-то победил мое желание заниматься интересными делами. Итог: я словно побитый пес живу у мамы, которая все чаще спрашивает меня, как долго я тут буду, и не хочу ли я наконец уже взять себя в руки пойти найти себе нормальную работу.\nМой внешний вид убог и жалок. У меня есть пятьдесят кило костей и кожи, а также прическа эйнштейна и рыжая борода. Я рассекаю по дому в зеленом халате: в одном кармане фурик и вата, в другом – баян двадцатка. Приехали.\nПравый рукав уже не сгибается от заскорузлой крови из свежих дырок от уколов. Я осознаю свое положение, но мой ебаный гений внутри говорит: - чувак это все хуйня, тебя просто не понимают.\nБлять, мало того, что от меня отвернулись даже малознакомые люди - мой барыга боится встречаться со мной.\n- Ты стал таким агрессивным и я боюсь поворачиваться к тебе спиной. Отныне встречаемся только на улице.\nЯ целыми днями сижу за монитором, клепая какую-то бесполезную хуйню, которую никто так никогда и не увидит. Диски с отснятыми материалами растут в аккуратную стопку, чтобы потом быть раскидаными и разломаными в приступе гнева и жалости к себе и своей бесполезности, когда кайф переданный мне через сигаретную пачку на ниточке, улетит за забор на стройку.\n- Ты должен найти себе работу.\nВодить машину – единственное, что я еще мог вменяемо делать. Я так думал.\n“Требуется доставщик пиццы”. Бля, говно. Я слишком охуителен для такого.\n- Ты на себя в зеркало посмотри, - говорит мама.\n…\n- Вредные привычки - не имею.\nТетка смотрит на меня с сомнением. Прячу руки под стол и ненавижу себя. Я нашел работу, но поделиться с этим не с кем. Все, кто меня знают - перехоят на другую сторону улицы. Я должен уже всем от Восстания до Фонтанки.\n- Смотри, здесь формируется заказ, и ты должен его за пятнадцаь минут доставить. Чаевые твои. Работа не пыльная.\nЯ и сам думал, что хуйня - но можно было быстро накопить на свои цели и отвалить.\nМолодой парень смущенно обьясняет мне кухню. Его лишили прав, и он вынужден искать себе другое занятие.\n- Главное – если нарушать, то осторожно. Сам понимаешь, что по этим пробкам…. блять, дебил ты смотришь куда едешь вообще?!! - мы прорываемся на Мойку через адовую пробку на маленьком и ушатанном дэу матиз - машине, которой суждено стать моим инструментом для добывания денег. Опять же - на доход барыг и в бюджет таджикистана или казахстана, смотря откуда привезен кайф.\n- На случай полной задницы есть мотоцикл. Права не нужны, все равно никто не остановит. Пойдем покажу-научу.\nИтак, я доставляю пиццу. Занятие странное. Ты оголтело едешь на адрес и там какой нибудь педик с кислым ебалом нехотя принимает у тебя коробку типа “не очень хотелось но раз привезли ладно”.\nОсобая статья - офисы.Там люди вырывают у тебя из рук еду и суют крупные купюры, лишь бы ты сьебал и не мешал им делать бизнес.\n- Сдачи не надо.\nСладкие слова. За день я успевал собрать сумму для того, чтобы напоить небольшую компанию в хорошем заведении. Однако, деньги применялись немного в другом направлении.\n- Сдачи не надо.\nУнизительная фраза, определяющая твое положение в этом мире. Твою никчемность и признание поражения в жизни.Тебе дают и ты берешь. Мне до сих пор не очень уютно, когда рассчитываюсь в заведениях и случайно говорю эту фразу. Это оскорбительно. Правда.\nОдин адрес мне очень нравился тем, что чувак постоянно был под кислотой и сделав заказ, через пару часов забывал об этом и делал его снова. Так повторялось до восьми раз за день. Я стал лучше выглядеть, так как регулярные иньекции, имеющие вид системы, приводят в чувство организм и не дают зеленеть, блевать и сраться на каждом углу.\nДождь заебал. На приемке скучно и идет обсуждение погоды.\n- Привет, че как. - голос барыги ленив и высокомерен, - я уеду через двадцать минут за город буду послезавтра, если хочешь чего взять приезжай сейчас.\nБлять. С Казанской на Восстания на машине не доехать.\n- Я возьму двухколесного прокачусь .\n- А, ладно, недолго только, скоро начнут вечерение заказы делать.\nЕбаное говно. Два урока езды толком не научили ничему. Главная подстава для меня в том, что я так и не усвоил где сцепление, а где тормоз. Ладно, времени нет. Не скажу, что мне понравилось ездить на мотоцикле.Может я просто торопился, а может дождь, который прошивал меня насквозь, портил картинку, не знаю.\nК Литейному я уже освоился и лихо повернул на него прямо с Невского, лавируя, чтобы выйти на жуки и домчать до адреса. Сделав поворот, я словил каких-то особо крупных капель, и практически ослеп. Запаниковав, начал хватать руками ручки, и вместо тормоза, естественно, выжал сцепление - остановки не призошло, случайно рванул газ, впереди стоял уаз пэтриот. Это было больно.\nОчень больно и обидно. Очнулся в луже с кровью. Железный конь лежал рядом, а надо мной стоял чувак и удивленно смотрел на мою голову.\n- Ни хуя. Твоя голова как колокол на всю улицу брякнула.Ты как живой-то остался? – недоумевал он.\nДилиньдилинь. Где эта трубка?\n- Да.\n- Ну ты идешь или нет? Я ждать не буду.\nСука, молча я встал на четвереньки и истекая кровью, сжав зубы, сначала полз по дороге, а потом хромал к заветному грамму, который стоил мне всего: моей проебанной жизни, достоинства, самоуважения, в конце концов этого ебаного мотоцикла. Но мне было похуй.\n- Ого,- барыга смотрела на меня испуганно. - ты где так?\n- Воду неси.\nЖадно курил и плакал от отчаяния, понимая,что выхода у меня нет, и то секундное удовольствие от прихода и есть самая главная цель для меня. Но, самое страшное, что оно не стоит на самом деле нихуя. Ни одной самой маленькой жертвы, которую я принес. Так зачем же я?\nМужик возился с передним колесом.\n- О, ты вернулся, смотри, все норм, я крыло выправил тебе, давай довезу, у меня пикап.\nЯ молча закатил искалеченный механизм на склад и пошел домой. В руке сжимал отсыревший порошок, перемещанный с собственной кровью. Забыть, забыть блять.\nНа следующий день в заведение пришел человек, который узнал меня, и сладким шепотом сообщил администратору о моей пагубной привычке. Был неприятный разговор, я сдал ключи и отправился… Не знаю куда я отправился. Даже такая бесполезная ебаная работа и та была не для меня. Все это принимало какие-то странные контуры, и в поиске ответа я дознулся дома на кухне.\nМеня нашел муж мамы и ему потребоавалось немало сил, чтобы восстановить мне дыхание. Я даже не сказал ему спасибо, а просто сидел на подоконнике, как в детстве, и смотрел на башню с часами. Впереди было еще три года.Три года потерь и движения к концу.\nDogz\nДоброе утро. Я говно. Не то,чтобы это стало новостью для меня.\nБудь я сраным фотохудожником, ходил бы сейчас и делал эпические портреты людей с зонтами. У нас в районе весь день идет гаденький такой дождик. Вроде и капель не видно,а все мокрое. От этого раздражаешься,потому что если дождь-так извольте дождь, а не этот насморк. Если снег, то, чтобы занесло по ангела на шпиле Адмиралтейства. А тут какие то полумеры, которые, как известно - нам не помогали.\nСегодня утром у меня одно из тех состояний, в которых я себе очень не нравлюсь. Однако, именно в таком состоянии мне довелось однажды находиться около двух месяцев. Круглосуточно.\n«Период отчуждения был не особо воспринимаем мною. В то время я уже находился на пути к первой реабилитации, а пока мне нужна была работа. Я пиздатый и гениальный, так почему же от меня все в стороны шарахаются. А, понятно, я наркоман.  Прийдя к такому выводу, наугад выбрал обьявление о работе.\n- Смотри, - маленький, коренастый еврейчик отчаянно жестикулировал и мечтательно поднимал глаза к небу - У нас три - ты понимаешь - три машины. Наша фишка, помимо того,что у нас две ветклиники - это перевозка животных. В чем плюсы: животным похуй на комфорт, они всегда трезвые и их хозяева как правило готовы платить сколько угодно, лишь бы ты довез их тварь куда требуется.\nМое лицо выражало следующее - НИЧЕГО.\n- А чаевых тебе будуть давать, мммм. - Моисеич затрясся мелкой дрожью, видимо сожалея, что чаевые будут платить не ему. - Плюс, как у сотрудника нашей фирмы, у тебя будет охуительная желтая жилетка.\nЭтот довод убедил меня, что надо оставаться. Вечером я был уже на работе. Вопрос «какого хуя я тут делаю» возникал все время работы в том заведении, но, еврейчик не спиздел, платили действительно хорошо и при моем зверском наркотическом аппетите я не успевал тратить деньги.\nСуть занятия заключалась в следующем. Помимо ебаной жилетки с псом на спине, я являлся владельцем серого пежо партнер. Ну что партнер, погнали на процедуры - вопрошал я каждый раз, собираясь за кайфом. В мои задачи входило всегда быть на связи, и даже ночью в максимально короткое время добраться до любой страждущей киски, собачки, пичужки, чтобы препроводить ее с почестями до клиники или выставки. Вот и все. Но,нюансов была тьма.\nНапример, время от времени мне в салон загружали полудиких волкодавов и я вез этих тварей в область охранять обьекты. Как правило, кроме меня не было никого в машине, так как этих монстров просто боялись, а за время пути несколько конфеток превращали зверюг в мягких пушистиков и обожателей людей. Поэтому,вместо рычащих охранников принимающая сторона видела виляющих хвостом бесполезных друзей человека.\nОднажды ночью поступил заказ и я, опаздывая на мосты, чуть не влетел в фонарь на повороте. Девочка в слезах и соплях стояла на улице под желтым светилом и рядом с ней стоял огромный аквариум. С половину меня в высоту с зеленой водой.\n- Моей рыбке плохо,нам надо отвезти ее в больницу. -\nна поверхности кверху брюхом плавало то, что осталось от глубинного обитателя.\n- Так он сдох. - вымолвил я.\n- Так и я не трезва, - вымолвила барышня.\n- Могу взбодрить,предложил я и угостил ее порошком,который она вынюхала прямо в машине.\n- Ну, что ж давай тогда пока.\n- Подожди. - Мы взяли большой камень и разьебошили этот чудо аквариум, дабы не тратить силы и не тащить его обратно домой...\n…\n- Доброй ночи, мой Марсик сломал переднюю лапку... - мерзкий,  дрожащий тойтерьер вызывал желание выкинуть его в окно, а его хозяйке хотелось прочитать лекцию о человеческой глупости и ее пагубном влиянии на организм... Марсик скулил и смотрел своими выпученными глазками вокруг...\n- Доброй ночи, мой Марсик...\nЭто повторилось через два дня и через неделю.Мерзкая гадина ломала себе лапы с завидным постоянством...\n- Доброй ночи...Что опять Марсик...Да...Дама, выбросите его в помойку.\nТуда отправили другого водителя... Отдельного внимания заслуживают выставки зверей. Хозяева породистых животных рубят бабки на происхождении и заклеймованных письках питомцев. Если бы питомцы знали об этом, революция была бы неизбежна. А так они вместе с хозяевами бегают по кругу и показывают спеам свою охуительную пушистость, вызывая восторг у первых и слезы радости у владельцев, то есть у вторых. Я жду, пока эта ярмарка тщеславия наконец закончится, чтобы погрузить коробки с мелкими собаками в авто и развезти их по домам.\n- Что я тут делаю. - Внеочередной укол в туалете заставляет на время забыть об этом... Мой телефон молчит уже второй месяц, звонят только на служебный, скоро я изучу язык зверей... Самое неприятное, это когда у тебя в машине умирает пес. Собака умирает благородно и с достоинством. Своим взглядом она словно извиняется, что доставляет неудобство и до последнего вздоха смотрит тебе в глаза. Как то раз я взял такого пациента. Белого бобтейла с раной в животе и торопясь развернулся на сплошной,мне очень хотелось довезти его до больницы.\n- Водитель номер остановитесь.\n- Сука.\nВальяжно и слегка приседая ко мне подошел дпсник.\n- У меня собака умирает,поэтому и нарушил.\n- Собака че освобождает от ответственности чтоле. - Тон был хамоват,и очень захотелось дать в морду.\n- Берите документы,делайте че там надо.\nЯ остался сидеть с псом и пока он не умер, держал руку у него на спине.\n- Ну, ты документы то возьми, извини, что так вышло.\nСлезы душили меня, я молча забрал свои права и поехал, куда, это уже не имело значения. Чем больше я узнаю собак,тем меньше мне нравятся люди. За это время я много видел животных,которых добрые люди обваривали кипятком, отрезали им лапы, выжигали глаза и творили прочие мерзости. Постепенно вопрос что я тут делаю перешел в другой - а зачем так все происходит. Воспаленный от постоянных уколов мозг отказывался принимать информацию и делать хоть какие то выводу. В свободное время я сидел на крутящемся табурете в клинике, запершись в лаборантской,  и вовсю использовал спиртовую горелку.\n- Иди сюда, помоги, тут пса на усыпление привезли. - Старый мастино неаполетано трясся и видимо понимал что сейчас будет. Хозяйка лила слезы в три ручья , - иди отсюда. - она с воем выскочиа в коридор.\n- Так, хороший, успокойся. -  изловчившись мы вкололи ему снотворного. Еще десять минут пес ходил, скулил и прикладывался на пол. В конце концов он заснул.\n- Теперь бери баян вон наполни той жидкостью...\nВсе эти сказки про то что животных усыпляют, и они умирают с улыбкой на морде - пиздеж. Усыпляют их так: сначала накачивают снотворным, потом колят в вену раствор содержащий всякую хрень, забивающую им артерии и сосуды сердца. Если животное не умирает, процедуру повторят. Единственный момент - все это происходит во сне. Но, в моем случае, пес жил еще полчаса. И ему было больно.\n- Все, иди, завтра в крематорий отвезешь.\nЕсть еще одна услуга в зоотакси - это собирать дохлый псов по городу и отправлять их на планомерное сжигание в печи. Я как раз годился для такой работы, ибо уже был похож на смерть и весу во мне было 45 а может 46 кг. Набив машину ароматными трупами, я решил завернуть к барыге и слегка взбодриться. Героин был адов, и добравшись до машины я понял, что если не посплю хотя бы час, то ближайшим адресом куда я приеду, будет стена дома во дворе.\nПсы были словно деревянные и мне пришлось потрудиться,чтобы соорудить из них некое подобие кровати. Запах уже не смущал, поэтому мы поспали заебись. Крематорий был к моменту пробуждения открыт,машину мне надо было отдать сменщику через два часа.\n- Простите мои дохлые друзья.\nВсе отправились в канаву, и я поехал проветривать автомобиль. Я уже написал, что благодаря этой работе как-то по другому стал смотреть на животных и людей. Однако то, как я успел опуститься за эти два месяца, довело меня до желания вздернуться. Глубоко ночью в дороге мой телефон зазвонил\n- Надо приехать в клинику и забрать.....только быстрее...где тебя носит...\nСтоп, дальше притворяться в то что я живу, сил не было. Я резко развернулся и поехал домой. Машину оставил у памятника Пушкину, позвонил сменщику и сообщил где можно забрать авто и деньги. Желтая жилетка отправилась в бак. Я собирался сдохнуть\n________________________________________\n_____\nСпасибо за внимание тем, кто еще умеет читать.\n", "preview": "# фак энд панч\n*Date*: 21 ноября 2012, 11:36\n*URL*: https://olymarkes.livejournal.com/77244.html\n\nВообще-то у меня есть тайный жж, в котором отобранные методом придирчивого айкью тестирования ценители прикасаются к самому ценному, потому что сюда порой забредают бараны, от комментариев которых мне хочется убить себя фэйспалмом. Но я знаю, что есть здесь и такие, которые молчат - но им это нужно, к", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/lj_export_clean/posts_md/82835__hard_diving.md", "source": "LiveJournal", "date": "Unknown", "filename": "82835__hard_diving", "title": "hard diving", "full_content": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один парень умер от наркотиков, и много я прочитала в те дни - о том, что надо было спасать, или о том, что надо было предпринимать меры. Я, конечно, в очередной раз примерила на себя эту историю. Никто не мог помочь, никто не мог спасти. Это всегда история только про тебя.\nСтранная это штука, во многом определившая мою жизнь. Это и отличает зависимых людей от независимых -\nв торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы. Остальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\nПо сравнению с настоящими наркоманами фактически я употребляла очень мало. Настолько, что я могу вспомнить каждый раз, количество, обстоятельства. Это были не такие длительные периоды, но каждый раз я встречалась со своим пределом. Когда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\nГоворят, что боль уходит.\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Были разы, дни между месяцами и годами чистоты. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается (или не случается) момент расщепления «я».\nЕсли случается, то ты случайно отделяешь себя от своего желания торчать.\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом. В шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо этого внутри меня стало постепенно оживать что-то. Интерес - вот самое лучшее чувство, за которым уже идет все остальное. Ты осуществляешь действие - видишь результат - радуешься. Я не радуюсь от того, что не является результатом моего труда. Такое у меня устройство. И вот когда я поняла это - я начала делать. Вернее не так, я делала и делала много до этого, но внутри была такая каша, что я не понимала, что именно это меня радует.\nТак я поняла, почему я люблю тренировки. Почему я люблю писать. Почему я люблю вести йогу - мне нравится действие, направленное на что-то хорошее. И дальше все это было уже как снежный ком. Ком, в сердцевине которого был зародившийся интерес к жизни, ко всему тому, что было мне непонятным.\nЯ обязательно напишу еще, и про свои рехабы, и про открытия в самоанализе, и про свои дефекты характера, и про то, как я училась и учусь по мааааленьким ступенькам поступать по-новому в рамках собственного безумия. Я буду писать, потому что гипотетически есть какой-то такой,\nпохожий на меня человек, которому мой опыт будет полезен. А я очень мало им делюсь, самым ценным и тяжелым - а надо бы, надо бы.\nАнастезии нет. Нет и всё. Ты просто начинаешь жить и однажды перестаешь задыхаться. И это невероятно похоже на тренировки - у тебя появляются силы так постепенно, что порой ты этого не замечаешь. Просто ты оглядываешься и понимаешь, что плывешь. Зависимость - это удивительная болезнь, которая может открыть такое зазеркалье твоей реальности, что слов не найдется, чтобы описать. Вот поэтому для меня наркотики - это такая вещь, мало кто поймет, если я скажу, что я благодарна за то, что это было в моей жизни.\nАнастезии нет. И ты все еще являешься собой во всей этой уязвимости. И жизнь все еще похожа на то, как будто ты идешь по канату, или куда-то бесконечно падаешь. Просто теперь уже точно нет никакой иллюзии, что ты можешь что-либо контролировать в этом глобальном процессе, поэтому тебе спокойно, и в процессе падения ты наконец-то можешь открыть глаза, оглядеться по сторонам и начать жить.\n", "preview": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один па", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/lj_export_clean/posts_md/1310__тур_закончен.md", "source": "LiveJournal", "date": "Unknown", "filename": "1310__тур_закончен", "title": "тур закончен", "full_content": "# Тур закончен.\n*Date*: 22 декабря 2008, 20:52\n*URL*: https://olymarkes.livejournal.com/1310.html\n*Tags*: alai oli, гастроли, менеджер\n\n\"А тем, кто будет хвалить тебя - кидай в лицо землю, ибо это уничтожит тебя...\"  Из Корана.\n1. Ижевск\nКонцерт был нереальный. Я даже не знала, что нас могут так сильно любить. Паша говорил что стоял в зале, и видел как девочка рядом с ним улыбалась и плакала.\nБольше даже ничего не буду говорить.\n2. Ижевск-Ебург-Москва\nЯ вернулась, чтобы забрать тираж. Парни поехали в Москву.  Ощущение нереальности происходящиего догоняло меня каждую секунду. Усугублялось все это осознанием факта, что мир сошел с ума, а ведь я не пила алко и ничего не употребляла... После Ижевска пропал аппетит... На четвертый день без еды организм перешел на внутреннее питание. Мы с Пашей катались на сноуборде. Я была счастлива. Просто так.\nМосква. (парт1)\nВ Точке у нас ничего не работало. Никто не заметил и все говорили, что было круто. От расстройства Бро потерял аппетит почти на 5 часов. Мы волновались.\nДенег было мало. Я искала где бы нам пожить, давая объявления в своём статусе вконтакте. Готовила еду для парней, со специями и любовью. Две ночи были у Серёжи Соколовского из Точки Невозврата.\nПотом он приехал на вокзал, чтобы проводить нас в Питер... Он приехал, ещё приехал Ваня, который делал RML... Я  записала видеообращение для сайта. Обняла Серёжу под ругань проводницы, которая уже чуть ли не пинками загоняла меня в вагон. Поезд тронулся,  и надежда, что парни успеют на поезд растворилась...\n- Он тебе нравится... да...\n- Кто? - я посмотрела на Пашу, удивленно подняв брови\n- Этот. Рэпер.\n- С чего ты взял?\n- Я видел, как ты на него смотрела...\nЗа кулисами. Питер.\nВ общей сложности я не ела 13 дней (пять дней, потом поела и снова не ела 7 суток). Потом аппетит проснулся, и я стала уплетать за обе щеки всё, что мне попадалось под руку. Как раз перед первым концертом в Питере...  Вот это было счастье ) Самая вкусная вещь на свете - постный пирог в Бистро, там где выход из метро на Канал Грибоедова... Радость от пищи - совсем странная и забытая штука...\nБоже, храни менеджера. Этот волшебный человек позволил нам ровно 2 дня ощущать себя нормальными рок-звездами. Прямой эфир на Радио Рокс и три концерта подряд в самых хороших клубах Питера\nПосле концерта в МОДе мы вселились в огромную квартиру. Там был водяной матрас, джакузи, мягкие перины на царских лежбищах, ОЧЕНЬ высокие потолки и длинные коридоры, по которым ходили юные нимфы, подруги моих парней.\nВ этой квартире случился мой срыв на алко после почти 2х месяцев абсолютной трезвости. Мне было одиноко. Я сидела на балконе (он же - зимний садик). Поставила стул в самый тёмный угол и заплакала.\n- Что такое?  - наш менедежер тихо сел на стул на другом конце балкона\n- Знаешь, чо та я щас не в настроении разговаривать.\n- Для разговора такое настроение - самое подходящее...\nИ мы говорили. За окнами Питер никак не хотел окутывать улицы холодом, мир казался мне огромным и очень родным. Я всегда мечтала приехать в этот город вот так. Не чужой, никому не нужной человеко-единицей в потоке на невском, а Важной, Ожидаемой Козявкой. Долго раскачивалась... И самого главного мне уже не догнать. Средство стало целью, я позволила запудрить себе мозги и поверить в важность происходящего со мной относительно вечности. Бред...\nС огромным стаканом глинтвейна я ходила по огромной квартире, читала проникновенные и яростные (как казалось только мне) монологи...  Я пыталась докричаца... (чисто питерский синдром) Я мечтала о лекарстве от боли, но на меня смотрели и слушали меня с ...?? любопытсвом...? снисхождением...? в\nосхищением..? О, типа у Маркес творческие муки. Пакурям, Маркес!\nНа следующий день мы выступали в Грибоедове. Так вот он какой... Я ходила и думала: вот наверняла Филя сидел на этом стуле. Или открывал эту дверь, взявшись за эту ручку. \"Может быть его душа сейчас здесь и слушает меня?\" - думала я, и пропускала начала куплетов... В любом случае, главного уже не догнать, но хоть что то я успела.\nПочти каждый день мы ездили в больницу к Артёму Щекалёву.\nКогда Артём злица на кого-нибудь, с тем человеком случается что-то плохое. В этот раз Артём зачем-то злился на себя...\nНе делай так больше, понял?! Лучше на меня. Хоть повод будет спасать меня... . Помнишь, как это весело?\nЕщё в Питере мне подарили несколько важных подарков. Спасибо за них. Я ценю подарки. Последнюю ночь провели в квартире у менеджера с его братом Мишей и Айваном из Грассхопперс. Боже, храни их, они святые! ))) Я редко так говорю, но так же скажет любой из группы Alai OLi\nМосква. (парт2)\nЭфир на О2 был неплох, только ведущий задавал глупые вопросы. Из серии \"Как ты их моешь.\" Еще были дебаты на тему \"Реггей в России\".... Я вот думаю: да ну всё это. Правдоборцев и хранителей канонов культуры раста и любителей настоящего реггей начинает тошнить от одного названия группы ( ALAI OLI! ALAI OLI! ALAI OLI! стошнило?\nнет? значит вы не ортодоксальный растафарианец!), и мне даже не надо вычитывать это на малочисленных реггей-форумах. Я это и так знаю.  Мало того, мы предвидели эту ситуацию еще тогда, когда всем было насрать на нас и наше неправильное реггей.\nИ если честно, мне даже немного странно что все это VOOBSHE NE PARYT.... Когда то я была очень идейной и гордой, как Искра Полякова из повести \"Завтра Была Война\". Я думала, что все вокруг должны быть честными, сильными, дружными и самоотверженными и прежде всего этими качествами должны обладать раста. Потом я поняла, что никто никому ничего не должен.  Я требовала от людей и от себя высокой нравственности, мучала их, страдала сама, не принимая что человек- это человек. Не Ангел и не Пророк.  Мы все одинаковое дерьмо. Мы все одинаково прекрасны.\nЕсть я. Есть мой путь.  Я иду по нему. Я делаю своё дело. Падаю, обдираю коленки. Жру землю. Взлетаю в небо. Мне не нужно ничье одобрение. Ни в музыке, ни в том, как я живу. Я себе - главный судья и палач. Проблема развития реггей в России? Извините, у меня есть проблемы посерьёзнее.\nЭто лирическое отступление было не для тех, кто обвиняет меня. Для тех кто защищает. Спасибо вам, но не тратьте больше силы на споры.... На моей планете если и есть война, то уж точно не по поводу музыки и Alai Oli в целом.\nREGGAE MUSIC LIFE клуб Табула Раса\n.\nКогда мы начали петь Ману Чао, я не понимала, попадаю ли я в ноты хоть приблизительно. Люди в зале пели так громко, что я не слышала не то что себя из мониторов, я вообще слышала только зал... Я была счастлива и обескуражена. На новой песне мне на сцену передавали бумажных журавликов, ещё цветы, и даже 1 галстук и одну шапку...\nСумашедшая энергетика. Откуда они знали все слова? откуда? Откуда? Ведь даже парни из моей группы не знают всё... А тут люди пели и первый, и второй альбом. .. Знаете, а ведь текстов нет напечатанных. Все они - в моей голове... И на записях в песнях.\nПосле концерта мы разорили блинную Теремок на красной площади. Слова \"блин с творогом\" считаются ругательными. Нам было так весело, что мы ржали и давились блинами, не стесняясь )) Ещё бы - барство! Корпоратив на 4000р в месте, где самое дорогое блюдо стоит 120 р ))))\nПотом мы пошли в кофейню, где торчали до утра и читали рэп про наше музыкальное будущее. Было очень хорошо, пока в пустынный зал не вкатилась(лся) трансвестит Галя Брежнева. Он(а) бы точно кого-нибудь трахнул(а), если бы не наш менеджер.\nСмотрю на менеджера и плачу от радости - он даже сам не знает, какой он офигенный чел. Надеюсь когда узнает - не испортица, как Бро в свое время )) (СЛЫШИШЬ, БРО? ПАФОСНАЯ ЗАДНИЦА!\nВОТ В 9ом КЛАССЕ ТЫ БЫЛ СКРОМНЕЕ! ХА!  ))) А в плане работы - я просто сейчас буду дышать свободно. Я устала быть нянькой, огранизатором и администратором. Это приятные хлопоты,  но силы мои не бесконечны.\nЕкатеринбург.\nДома хорошо. Мы прилетели в день концерта в PV. На входе Ксюша и Ника (Спид-центр) раздавали значки с моим лицом. (что бы подумали вы, увидив свое лицо на значке?) Ещё я потеряла сиреневую шапку бёртон. Это значит вечеринка удалась.... Клуб был забит... Я завороженно слушала, как читает Маэстро из Ворнер Бразерс и носила ему Бэйлис, который покупала за свой кэш. Попробовала - понравилось... Потом Словиковский сказал, что в баре я могу пить бесплатно. Пить, почему то, сразу расхотелось.\nВсю неделю я занималась йогой, спортом, обжорством, пьянством и учебой. Бессонница. И ещё сколько алкоголя выпьешь - опьянения никакого... странно и страшно.\nОмск.\nВ поезде мне не спалось. У титана я читала книжку, потом ко мне подошел реально какой-то гуру. Я много умных людей знаю, начитаных, просветленных, но такого я ещё не встречала. Завороженная, болтала с ним часа два. Подарила один из ключей с подвески на шее...  За несколько дней до этого я говорила Юле: \"Хочу, чтобы мне погадали по руке...\"\nОн предложил сам.\n- У тебя ведь нет парня... ничего серьезного вобщем\n-  Да, - улыбаюсь я, а про себя думаю: \"про меня иначе как \"всесложно\" и не скажешь\"\n- И не будет. И детей тоже. И тебя это не парит, так ведь? Все дело в том, что ты - воин... У тебя другой путь.\nНе знал он, ведь не знал что в голове у Оли уже несколько недель крутятся строчки:\nВоин - это не ОН и не ОНА.\nЯ воин, и если начнется война\nТакие как я побегут на поле боя,\nНа поле боя нет смысла называть имена...\nи (....) садится со мной рядом\nи (...) берет меня за руку\n\"Никто не знает, как ты устала\nНо только на сегодня я стану твоим другом\nА завтра если хочешь - пройдёмся по кругу.\nИ засни с кем угодно - один х.й, проснёшья одна!\"\nОткрываю глаза. Что на мне: Рога или крылья?\nсветлой притворяется каждая сторона.\nУкрепившись в своей позиции я легла спать. Концерт в Омске прошел отлично. Оба концерта.\nПоследние концерты этого года.\nПоследние концерты в рамках тура.\nСколько нужно времени и сил чтобы рассказать обо всем, что происходило со мной и с нами? Я вам скажу, гораздо меньше, чем ответить на 200 сообщений вконтакте. Пойду-ка займусь ими.\nЗавтра или послезавтра в Москву.\n", "preview": "# Тур закончен.\n*Date*: 22 декабря 2008, 20:52\n*URL*: https://olymarkes.livejournal.com/1310.html\n*Tags*: alai oli, гастроли, менеджер\n\n\"А тем, кто будет хвалить тебя - кидай в лицо землю, ибо это уничтожит тебя...\"  Из Корана.\n1. Ижевск\nКонцерт был нереальный. Я даже не знала, что нас могут так сильно любить. Паша говорил что стоял в зале, и видел как девочка рядом с ним улыбалась и плакала.\nБоль", "annotation": "Рассказ о срыве и возвращении к употреблению после периода трезвости."}, {"path": "data/lj_export_clean/posts_md/84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм.md", "source": "LiveJournal", "date": "Unknown", "filename": "84723__почему_надо_выходить_замуж_за_бандитов_а_не_за_свою_космическую_любовь_или_письм", "title": "почему надо выходить замуж за бандитов а не за свою космическую любовь или письм", "full_content": "# почему надо выходить замуж за бандитов а не за свою космическую любовь (или письмо лизе сидориной)\n*Date*: 17 ноября 2017, 02:23\n*URL*: https://olymarkes.livejournal.com/84723.html\n*Tags*: #000000\n\nСидорина спрашивает меня: почему. И вот пока я лечу от Москвы до Питера у меня есть немного времени.. Постараюсь тебе объяснить, Лизочек.\nКосмическая любовь - она для космоса. Она для вдохновения, для новых песен, для того, чтобы чувствовать всю глубину, силу и боль бытия. «Это все понятно» - скажешь ты, и будешь абсолютно права. Но есть еще кое-что. Мне кажется, что она не совместима с жизнью. Не совместима с реальностью, с грубым миром, с твердым миром, с миром вещей, всех остальных людей, миром жэка, паспортного стола, налоговой, мудака соседа, который делает ремонт после 23:00, психа, который следит за тобой и пишет всем твоим и прочего вполне себе некосмического дерьма. А если она совместима - то это уже не космическая любовь, а вполне земная. Я даже думаю так - космическая любовь несовместима с сексом. Потому что секс - это очень земная штука, а наше тонкое тело - не очень. И можно, конечно, все совмещать, но на практике и по факту это мало кому удается, особенно в долгосрочной перспективе.\nЧто касается бандитов. Ты тут спросила меня про Сергея Бодрова, типа не мой ли это гипотетический идеал. А я в этот момент как раз пялилась в глаза Марка Рентона, нарисованного Гордеем, и сказала тебе: «Слушай, ну Сергей все равно был творческим человеком.. А вот Данила Багров - это тот самый типаж». Потому что сложно найти что-то более привлекательное, чем простой парень, который умеет обращаться с оружием и решать вопросы с людьми, сильнее, богаче и влиятельнее. Нет ничего круче характера, который проявляется в реальных делах в этом, твердом мире. Ну что я тебе рассказываю? У меня были и творческие, и космические, но когда дело доходило до каких-то реальных вопросов, где надо было врубить мужскую ответственность, врубалась она быстрее у меня.\nА еще говорят, что это я такая типа телка с яйцами, которая не может играть фэйр плэй. Да нифига, я много могу сама, но не все. И я очень беззащитна во многих вопросах, и иногда хочу на ручки и ничего не хочу решать. Пусть мой мужчина разбирается. И с одной стороны очень дисциплинирует и воспитывает, когда ты все сама, все сама, а твоя космическая любовь только дарит тебе глубину бытия, наполняя тебя силами для всех твоих свершений. Но вот нихуяшечки я не считаю это идеальным раскладом.\nНу и про Рэнтбоя теперь, почему я питаю к нему такую нежность. Его круто рассматривать в контексте остальных персонажей, и только тогда можно увидеть все оттенки - боюсь описать у меня получится крайне топорно, но надеюсь суть ты поймешь. Во-первых зависимость - это с одной только стороны чума и проклятие. Зависимый человек - это система, которая работает определенным образом. И являясь сама зависимым человеком, я всегда предпочту totally addictive\nчеловеку, который может контролировать свою жизнь. Любой контроль - это всего лишь иллюзия, и большинство людей сидят в ней по уши. Зависимый человек знает, что он бессилен. И 12 шагах принять бессилие - это самый первый шаг. Большинство людей никогда не сделают его, и мне их даже отчасти жаль по этому поводу. Рэнтбой - он абсолютно бессилен, и так в этом невероятно мил.\nИ если смотреть постфактум\n- не было плохих периодов, все придумано для чего-то. Когда ты на системе, все в мире относительно. Это даже чем-то похоже на триатлон, только в торче никто не оценит твоих ежедневных подвигов, ибо совершаешь ты их во имя зла, самоуничтожения и тотального деструктива. Но! Ты их все-таки совершаешь, и навыки остаются, и мышление, и границы возможного. Этика как раз таки всегда заложена в характер - и тут у Рэнтбоя как раз все в порядке, с этим. Торчать можно по-разному, и у каждого свое дно. Ну и вообще у большинства людей в моем окружении все в порядке с жизненными принципами, это чтобы ты не думала что абсолютно все бывшие торчки - хорошие. В трезвости зависимые люди тоже бывают редкостными мудаками, и в торче бывают люди хорошие, так что это я не про всех.. Про отдельных людей скорее.\nТак вот, такие люди привыкли надеятся только на себя, но кстати параллельно могут решить и твои вопросы, если ты будешь нуждаться в помощи. Ну и что касается всего остального - помнишь, как Данила Багров вытаскивал эту рашн проститьют Мэрелин? Вот как-то так надо, чтобы человек относился ко всем, кто слабее его. А не только к самым родным. Мужчина чувствует, что если не он - то никто. И просто делает. И знаешь, на самом деле мир полон таких мужчин - только мы с тобой телочки из творческой среды, и как раз здесь их остро не хватает.\nВ детстве моими героями были Робин Гуд и Д’артаньян, со временем в эту историю добавилось много чего еще, начиная от двух высших заканчивая умением делать инъекции, пиздить людей голыми руками и метко стрелять от бедра. Сочетание силы и бессилия, преобладание реального над космическим, но при этом - духовность, основанная на встроенных аспектах характера. То есть не напускная и вышколенная доброта, учтивость и бла бла, а что-то такое, чего человек сам в себе не видит и не осознает, но оно присутствует и очевидно всем окружающим.\nНу и в конце этой истории надо отдать дань и космической любви тоже. Love is not a crime. Преступление - это каждой своей космической любви стараться придать земную форму, пытаясь убить сразу двух зайцев. Помнишь фильм, который мы смотрели сегодня? Так вот, я думаю что эта брюнетка была права: «You totally fucked up, Margo» - потому что все границы только в нашей голове, и они лишают нас счастья чувствовать сразу все: мы разрешаем себе только одну форму любви - вытекающую в обладание. Хотя есть и другие способы. Стоять, и ничего не трогать… В моей жизни были такие встречи, такие люди - и самым чистым образом, через абсолютную, божественную любовь они дотрагивались до моего сердца. И знаешь, я потом уже поняла - люди разные, а космос - он один. И когда мне что-то попадает в сердце, я преклоняю колено перед Богом, а не перед человеком, через которого он мне является. Потому что если опуститься на колени через человеком, вряд ли он будет вести себя корректно - скорее всего, он офигеет от такой чести -\nи будет прав. Нечего путать понятия, моросить и все такое. Любить космос и любить человека - это все таки разные понятия. И вот когда ты встретишь человека и полюбишь в нем человеческое - ты поймешь, о чем я говорила. И, кстати, ему не обязательно быть бандитом. Это я вообще пошутила, если что)\np.s.\nхочу запомнить эту неделю, когда мы ложились в 5 утра, как будто нам всем по 19 - сводили песни, монтировали клипы, смотрели фильмы с Бодровым, пили чай и выбирались из дома только в сааааааааамой крайней необходимости: в кафе через дорогу, на съемку, на студию, на концерт, в перекресток за… ну, короче.\nесли жизнь проходит, то в эту секунду я чувствую, что проходит она правильно. я вижу внизу огни Питера, за сим заканчиваю свое письмо, и до встречи завтра\n", "preview": "# почему надо выходить замуж за бандитов а не за свою космическую любовь (или письмо лизе сидориной)\n*Date*: 17 ноября 2017, 02:23\n*URL*: https://olymarkes.livejournal.com/84723.html\n*Tags*: #000000\n\nСидорина спрашивает меня: почему. И вот пока я лечу от Москвы до Питера у меня есть немного времени.. Постара
