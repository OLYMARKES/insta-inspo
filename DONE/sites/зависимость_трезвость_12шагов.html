отали, они действительно были нужны, и нужно было это пространство - и люди вокруг, и отсутствие света, и какая-то внутренняя усталость от вечной конфронтации, чтобы все заработало.\n\nИ ещё было ощущение, что пойдя в эту практику сами мы выпали из пространства, и оно жило само собой. И оно как-то жило. Здесь я наблюдала такую сдачу, отпускание своего перфекционизма, взросление. Раньше мне так важно было в любой момент казаться профессионалом, что я выходила на сцену с температурой 40, а теперь я могу сказать себе: да, возможно для людей я могла сделать этот опыт лучше, но сейчас действительно важно то, что происходит со мной.\n\nВ тот момент и в том пространстве мы, вроде бы много разговаривающие и прокаченные в этом люди, которые уже пол года (!) в регулярной совместной IFS терапии, как будто продвинулись в понимании как оно работает, как очень похожие потребности замыкаются в круг обид, и благодаря разговору я первый раз за долгое время я почувствовала, что кольцо разомкнулось - не только во мне, и но в человеке, с которым я разговаривала. Это удивительное чувство компромисса, который невозможно выбить в переговорах, в доказательстве собственной правоты, в каком - то болезненном желании показать во что бы то ни стало свою картину мира и получить от другого сочувствие и исцеление. В этом так легко потеряться и на это всегда уходит слишком много энергии. Но в разговорной практике все работает иначе, как будто тут вообще нет тебя, нет никого, кто мог бы обижаться - человек отвечает на вопросы сам себе, а ты слушаешь, как свидетель, не принимая это на себя.\n\nРазговоры часто похожи на лабиринт. Мне нравится бродить по этому лабиринту. Иногда ты встречаешь там свирепого Минотавра, иногда ты взлетаешь над лабиринтом в другое пространство, где вы понимаете друг друга без слов. Разговорные практики иногда дают ощущение, что ты прошёл игру, вышел на новый уровень. Но как часто после него ты чувствуешь изменение реальности?\n\nМне хотелось оставить этот текст на память, может он не несёт в себе какого-то полезного контента, из серии «сделайте так и почувствуете вот так», но может быть вдохновит вас однажды или с близкими, или с незнакомыми попрактиковать ответы на вопросы, которые запускают глубокое исследование.\n\nКстати сейчас поняла, что много лет отвечаю на вопросы сама себе в 12 шагах. Лет 6 делаю это в терапии. Потом с Димой открыла мир разговорных практик - и групповых, и индивидуальных. Гранулярность, View, Emtr, ретриты - постепенно этого стало больше, и теперь кажется что весь мир состоит из вопросов, на которые так интересно отвечать друг другу.\n\nReactions: ❤506 ❤‍🔥87 👍48 🕊29 💔20 🤔10\n", "preview": "# 2024-01-04 — интересная штука произошла нас димой периодически ведём\n*Datetime*: 2024-01-04T23:11:59+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 231\n\nИнтересная штука произошла у нас тут. Мы с Димой периодически ведём практики, которые прежде всего дизайним для себя. Роль ведущего минимальна, люди отвечают на вопросы, исследуя разные темы «друг об друга». Такую практику на днях мы вели", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2023-09-12.md", "source": "Instagram", "date": "2023-09-12", "filename": "2023-09-12", "title": "2023-09-12", "full_content": "https://www.instagram.com/p/CxGF-pMrD01/\n\nОсень 2023, actual me\n⠀\nЯ поняла, что во мне сломался достигатор. Помните тот период, когда я одновременно училась в аспирантуре, готовилась к триатлону, ездила по научным конференциям, по городам с концертами и по командировкам? Вот и я с трудом вспоминаю)\n⠀\nЧто изменилось? Как будто само понятие «цель» растворилось в тумане, и мне стало кайфово не от большого количества дел, а от небольшого количества полезных и приятных мне процессов.\n⠀\nНапример, в секте я с удовольствием занимаюсь продуктом: последний буткэмп, новый superhuman, который в процессе - все это принесло мне огромное чувство удовлетворения работой и собой. И цифры растут, и нет ощущения лишней суеты: я сосредоточилась на главном, на том, с чем соприкасаются наши клиенты.\n⠀\nВошла в несколько других проектов как co-founder, появилось окружение IT предпринимателей, с которыми хочется сотворчества, и впервые в жизни я так наслаждаюсь коллабами. При этом в секте партнерок тоже стало больше: мы выпустили линейку одежды с Gri, плотно работали с Вкусвиллом, в маркетинговой команде #sekta почти 30 человек, и даже в месяцы когда я вообще не продаю ничего в инст, ребята делают максимальные планы.\n⠀\nПро музыку: не самые частые концерты, но при этом - стабильные релизы и работа boosty, которая дает возможность музыкантам получать сравнимую зарплату, без сложных туров. А мне дает творческую свободу, и я пишу новые песни. Вот, опять написала на целый новый релиз.\n⠀\nЯ все еще в терапии и в 12 шагах, уже года 4 с одним терапевтом. Исследую разные практики: тантру, психологические тренинги, сейчас начала проходить курс по психологической системе IFS. В прошлом году я после перерыва почти в 10 лет снова начала вести ретриты, только теперь не с йога практиками, а с разговорными и телесными - это интересно мне самой, и мне очень нравится, когда есть среда и приятная компания для практик.\n⠀\nУ меня вырос инст, и в этом мне не хочется останавливаться - я кайфую от ведения блога и общения с аудиторией, и хорошо, когда людей с похожими ценностями становится больше.\n⠀\nТак что спасибо всем, кто давно со мной. Спасибо всем, кто пришел и остался ❤️ 📸 @anastasiyavolosovich\n", "preview": "https://www.instagram.com/p/CxGF-pMrD01/\n\nОсень 2023, actual me\n⠀\nЯ поняла, что во мне сломался достигатор. Помните тот период, когда я одновременно училась в аспирантуре, готовилась к триатлону, ездила по научным конференциям, по городам с концертами и по командировкам? Вот и я с трудом вспоминаю)\n⠀\nЧто изменилось? Как будто само понятие «цель» растворилось в тумане, и мне стало кайфово не от бол", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/vi_vse_nepr_export/posts_md/2022-12-09__170__дурге_возвращалась_сцены_гримерку_падала_эту_пучину.md", "source": "Vi Vse Nepr", "date": "2022-12-09", "filename": "2022-12-09__170__дурге_возвращалась_сцены_гримерку_падала_эту_пучину", "title": "170 дурге возвращалась сцены гримерку падала эту пучину", "full_content": "# 2022-12-09 — дурге возвращалась сцены гримерку падала эту пучину\n*Datetime*: 2022-12-09T21:32:46+08:00\n*Message ID*: 170\n\nДурге возвращалась со сцены в гримерку и падала в эту пучину боли, у которой не было предела. Когда казалось, что физическое тело на грани смерти, она писала ему. Он приходил, обнимал, и боль уходила. И стоило только восстановиться, как она снова попадала в этот бэд трип: триггер - желание вырвать эту любовь из себя - невыносимая боль абстиненции. Просто еще один зависимый круг, в котором не было реального человека, а был додуманный враг и злая капитуляция в те моменты, когда не хватало сил быть стойкой в своём: «никогда больше не подходи ко мне»\n\nВчера он сказал мне все, что нужно было услышать тогда. Все те слова, все то видение меня, которого мне так не хватало. Я почувствовала себя особенной, я почувствовала себя сильной, красивой внутри и снаружи, мощной, чувствительной, хрупкой.  Я все передала той девочке.. И мне кажется, она успокоилась. Мне кажется, она поняла, что с ней все в порядке, и больше не нужно казаться сильнее, чем она есть на самом деле.\n\nИз этого же - недавно Вера рассказала мне, что песня «Каждую мою весну» - про меня. Почему-то внутри себя я думала, что про другую нашу подругу. Я даже не могла примерить на себя, что Веры со мной такие отношения. Но когда я переслушала текст, я все поняла. Недавно в Ереване мы с ней об этом говорили. О том, что когда она сильно любит кого-то, она боится исчезнуть, раствориться, быть поглощённой. Поэтому она защищается от меня и это вечное ощущение конфронтации делало мне больно и изматывало столько лет. Когда человек, которого ты любишь, демонстрирует тебе независимость.\n\n ⁃ Но в моих руках оказавшийся кольт стреляет в тебя у первой стены.    Мне всегда больно, когда люди, которые меня глубоко трогают внутри, которых я люблю, начинают от меня защищаться. Этот месседж «ты для меня опасна» превращает меня в грустное чудовище из аленького цветка. Много одиночества и изоляции, и так много жизненнных примеров, как важные для меня люди, не видя уязвимости, превращали меня в демона в своих глазах, и я сама через их взгляд на себя начинала себя ненавидеть.   Вчера был важный для меня день, и я думаю, еще много раз буду к нему возвращаться и думать об этих событиях. Спасибо, что разделили со мной эти чувства.\n\nReactions: ❤1101 💔355 ❤‍🔥121 👍48 🔥18 🐳17\n", "preview": "# 2022-12-09 — дурге возвращалась сцены гримерку падала эту пучину\n*Datetime*: 2022-12-09T21:32:46+08:00\n*Message ID*: 170\n\nДурге возвращалась со сцены в гримерку и падала в эту пучину боли, у которой не было предела. Когда казалось, что физическое тело на грани смерти, она писала ему. Он приходил, обнимал, и боль уходила. И стоило только восстановиться, как она снова попадала в этот бэд трип: три", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/vi_vse_nepr_export/posts_md/2022-09-14__166__сутки_спустя_после_всех_ваших_комментариев_пишу.md", "source": "Vi Vse Nepr", "date": "2022-09-14", "filename": "2022-09-14__166__сутки_спустя_после_всех_ваших_комментариев_пишу", "title": "166 сутки спустя после всех ваших комментариев пишу", "full_content": "# 2022-09-14 — сутки спустя после всех ваших комментариев пишу\n*Datetime*: 2022-09-14T05:27:32+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 166\n\nСутки спустя и после всех ваших комментариев пишу чтобы поделиться выводами. Реально, много углов вы мне подсветили, и это было полезно.\n\n 1. Про зависимость. Это наверное ключевое. Я давно не хожу на группы - а именно эта часть всегда даёт мне самую большую стабильность. Когда хожу регулярно и пишу шаг - становлюсь практически неуязвимой - то есть меня очень мало вещей триггерит, и практически ничего не сваливает в такую долгосрочную яму.\n\nОбострение зависимости - это про болезненную чувствительность от всякой хуйни. Вот ты не планировал расстраиваться, а тебя вынесло на пол дня или на сутки по какой-то совсем нелепой причине. И это сначала случается раз в месяц, потом раз в неделю, потом каждый день. И вот я вспоминаю что до 12 шагов я так жила - меня постоянно все трогало и задевало и я просто жить нормально не могла. Как минное поле.\n\nКстати песня Joshua Tree Bird об этом состоянии\n\nУ меня есть птица даже две\nРядом с сердцем, другая правее\nНо не работает защита от тех, кто попадает прямо в цель\nВ меня столько попадает вещей - и мне потом плохо.\n«Да ты смешная»\n ⁃ Но я слишком много чувствую, выпала из сна и снова пусто, Так я от себя устаю. Омут. От хаоса до Ома, на расстоянии руки.\n\n 2. Болезненное эго, эгоцентризм, желание власти, плавающая самооценка - это все туда же, в матрешку зависимости. Именно так и выглядит обострение. Но так же классно вспоминать те состояния, когда у тебя такая внутри благодарность, изобилие, что ты вообще ничего не принимаешь на свой счёт. Я это состояние помню и его хочу.   3.  Что обо мне подумают, почему рекламировать плохо и тд - подумала на этот счёт. Да мне действительно хочется быть понятой правильно. То есть мне ок что кто то меня ненавидит/бесится от меня такой какая я есть, но вот если кто то подумал обо мне что я делаю это ради денег, а я на самом деле делаю не ради денег - это мне обидно. При этом ради денег делать что-то тоже ок. Просто вот это «меня неправильно интерпретируют» мучительно. А в идеале хочется чтобы было все равно.  4.  Точно присутствует обида на себя, на ситуацию, на стол и Веру, но разбираться с ней я буду сама, в том плане что зависимые обиды не лечатся даже если кто-то захочет успокоить, они не из-за других возникают, а из-за внутренней этой болезненной интерпретации реальности не в свою пользу.    5. Точно не присутствует тема «ах могли бы больше на благотворительность собрать а теперь другой промокод». В этом плане я в финансовом плане радуюсь когда близкие зарабатывают, и это даже больше кайф чем благотворительность.  Мне не легко допустим отдавать деньги незнакомым фондам в которых я не знаю что куда идёт, а друзьям гораздо проще. И рекламу делать друзьям я люблю просто так. Севаре например.   6. Что именно задело? Я ощутила как будто теперь что не смогу писать про стол, потому что это будет не мой экслюзивный контент, а какой-то массово-рекламный, и что этот облом внутренний произошёл не из-за какого-то левого человека, а в контексте кого-то близкого. То есть жалко контент, который почему-то теперь не хочется делать. Нормально, что Вера начала рекламировать стол. Не нормально, что мне при этом расхотелось. Наверное изначально мотивация у меня была какая-то туманная. Спасательно - эксклюзивнеческая. В этом плане финансовая просто заработать с них денег возможно была бы честнее и проще. Ребятам со столами хочется максимального процветания, и я уверена что многие блогеры могут с ними сотрудничать, влюбляться сами и влюблять аудиторию.\n\n 7. Ну и возвращаясь к началу - контент сам тоже не мой, это вообще Димин стол и его сетапчик, его привычка работать стоя со всякими фишками. Он мне все показал, он мне отдал этот стол, перекладину, подушечки, а я так проперлась что это открыло во мне рекламную чакру и я впервые в жизни взяла такое партнёрство. И вот в идеале я думаю, что надо сделать Димин промокод и я с удовольствием буду рекламировать этот стол с его промиком и каждый раз говорить спасибо за то, что он открыл для меня этот новый мир в работе).\n\nReactions: ❤618 👍137 🔥26 🥰18 🙏15 👏2\n", "preview": "# 2022-09-14 — сутки спустя после всех ваших комментариев пишу\n*Datetime*: 2022-09-14T05:27:32+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 166\n\nСутки спустя и после всех ваших комментариев пишу чтобы поделиться выводами. Реально, много углов вы мне подсветили, и это было полезно.\n\n 1. Про зависимость. Это наверное ключевое. Я давно не хожу на группы - а именно эта часть всегда даёт мне с", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/vi_vse_nepr_export/posts_md/2021-10-22__147__отличает_зависимых_людей_независимых_торчках_употребление_чего-то.md", "source": "Vi Vse Nepr", "date": "2021-10-22", "filename": "2021-10-22__147__отличает_зависимых_людей_независимых_торчках_употребление_чего-то", "title": "147 отличает зависимых людей независимых торчках употребление чего-то", "full_content": "# 2021-10-22 — отличает зависимых людей независимых торчках употребление чего-то\n*Datetime*: 2021-10-22T12:57:01+08:00\n*Message ID*: 147\n\n… Это и отличает зависимых людей от независимых - в торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы.\n\nОстальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\n\nКогда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\n\nГоворят, что боль уходит.\n\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\n\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\n\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\n\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается момент расщепления «я»и ты случайно отделяешь себя от своего желания торчать.\n\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\n\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\n\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\n\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом.\n\nReactions: ❤33 👍10 🔥3 ❤‍🔥2\n", "preview": "# 2021-10-22 — отличает зависимых людей независимых торчках употребление чего-то\n*Datetime*: 2021-10-22T12:57:01+08:00\n*Message ID*: 147\n\n… Это и отличает зависимых людей от независимых - в торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы.\n\nОстальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо,", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-09-02.md", "source": "Instagram", "date": "2021-09-02", "filename": "2021-09-02", "title": "2021-09-02", "full_content": "https://www.instagram.com/p/CTT0mtsIZw3/\n\nЧетверг - день зависимости.\n⠀\nНу что сказать, я на дне. Телефонная зависимость победила меня, и только изредка мне удаётся выдохнуть и на чем-то сосредоточиться.\n⠀\nМожно было сказать, что это - трансфер зависимости, но интернет появился в моей жизни чуть ли не раньше, чем вещества, и если бы мне пришлось выбирать - наркотики или интернет - я бы выбрала интернет.\n⠀\nЕщё лет в 12 я мечтала только об одном, чтобы карточка интернета не кончалась и можно было всегда носить с собой компьютер. И вот, все мои мечты сбылись. Я могу писать, меня читают (для юного графомана наличие читателей тогда было главной радостью). Я втыкала в телефон, когда ещё не было айфона, у меня был кнопочный е51 и мобильный интернет.\n⠀\nЯ совершенно точно деградирую и изматываю свой мозг телефоном, не могу дописать книгу, и все медитации и дыхание помогают, примерно как мёртвому припарка - только тем, что в это время я не втыкаю в телефон. Я прочитала много книг на эту тему, но знание методов не рождает действие. Телефон мешает мне проживать важные моменты моей жизни, я просто не могу отложить его, даже если внутри я полна решимости и пытаюсь это сделать.\n⠀\nМой психотерапевт говорит, что мои попытки контроля только усугубляют компульсив, спонсор в 12 шагах говорит, что надо говорить на группах не о том, какой мудрости и успехов я добилась в других сферах, а о том, на каком дне я нахожусь касаемо телефона и как я мечтаю просто отложить его от себя и не брать неделями.\n⠀\nВсе лето я не боролась и просто так жила на телефонном дне. На удивление - даже прочитала за лето больше книг, чем за два года до этого, что-то даже писала, но по ощущениям мозг мой все равно похож на желе. Возможно, я драматизирую проблему, но мне кажется, все ещё хуже. Я даже не в состоянии адекватно оценить ситуацию, как любой человек в активной фазе зависимости.\n⠀\nКогда закончу писать 12 шаг, начну снова первый - но уже по телефонной зависимости.  Есть бессилие, есть надежда, что мне все таки что-то сможет помочь. Делитесь опытом, если он у вас есть.\n⠀\nPs. Каждый раз после этих постов куча вопросов про шаги - загляните в IGTV там есть эфир с ответами на вопросы.\n", "preview": "https://www.instagram.com/p/CTT0mtsIZw3/\n\nЧетверг - день зависимости.\n⠀\nНу что сказать, я на дне. Телефонная зависимость победила меня, и только изредка мне удаётся выдохнуть и на чем-то сосредоточиться.\n⠀\nМожно было сказать, что это - трансфер зависимости, но интернет появился в моей жизни чуть ли не раньше, чем вещества, и если бы мне пришлось выбирать - наркотики или интернет - я бы выбрала инт", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-08-19.md", "source": "Instagram", "date": "2021-08-19", "filename": "2021-08-19", "title": "2021-08-19", "full_content": "https://www.instagram.com/p/CSxJM1OocMq/\n\nПо четвергам я пишу о зависимости.\n⠀\nПрограмма 12 шагов заставляет тебя смотреть на себя честно и беспристрастно. Если ты не работаешь по программе - жизнь начинает преподавать тебе болезненные уроки. Тебе все равно приходится смотреть на себя, но уже не в «учебной» среде. \n⠀\nПисать ответы на «шаговые» вопросы - дело не самое легкое и приятное, но проживать жизненные уроки гораздо, гораздо неприятнее.\n⠀\nЯ помню, как однажды у меня были серьезные проблемы на работе, и мой друг из 12шагового сообщества, опытный бизнесмен, траблшуттер, был тем человеком, к которому я обратилась за консультацией по своей проблеме. Он сказал тогда что-то вроде: «я бы мог тебе долго рассказывать всякое, но скажу тебе главное: начни уже писать шаги. Когда ты этого не делаешь - ты постоянно совершаешь ошибки, ты сама будто вставляешь палку в колесо своего велосипеда. Так работает мозг зависимого человека». Я тогда хотела других рецептов, и мне было не до шагов. И совершенно зря.\n⠀\nЧерез несколько лет просто трезвости, я поняла, что дело не в ней. Если не работать с головой, я постоянно делаю все не так, говорю не так, совершаю ошибку за ошибкой, обижаю людей, сама обижаюсь и остаюсь в изоляции. Естественно, это проникает во все сферы жизни. Зависимость похожа на черный спрут, и самое страшное в какой-то момент ты перестаешь отделять зависимое поведение от самого себя. Поэтому многие не хотят работать с собой и бросать вещества - им кажется, что без всего этого они потеряют себя.\n⠀\nПотом, когда начинаешь писать шаги, ум очень очищается, ты уверен в каждом своем действии, тебя сложно обидеть или задеть, и самое главное - ты начинаешь делать одно правильное решение за другим. Это не про то, что шаги гарантируют успешный успех. Для этого нужно слишком много факторов. Но ты трезво оцениваешь себя, свои возможности и можешь делать действия, а не гонять в голове из пустого в порожнее, ничего не предпринимая.\n⠀\nСейчас я не пишу шаги регулярно, и явно наблюдаю, как с чердака начинает подкапывать. Такое уже бывало в моей жизни, и когда становилось совсем фигово - начинала писать снова. Я говорю про такие процессы - боль, как регулятор баланса. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CSxJM1OocMq/\n\nПо четвергам я пишу о зависимости.\n⠀\nПрограмма 12 шагов заставляет тебя смотреть на себя честно и беспристрастно. Если ты не работаешь по программе - жизнь начинает преподавать тебе болезненные уроки. Тебе все равно приходится смотреть на себя, но уже не в «учебной» среде. \n⠀\nПисать ответы на «шаговые» вопросы - дело не самое легкое и приятное, но проживат", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-07-29.md", "source": "Instagram", "date": "2021-07-29", "filename": "2021-07-29", "title": "2021-07-29", "full_content": "https://www.instagram.com/p/CR52GRDnWWz/\n\nЧетверг - тема «зависимости»\n⠀\nВ 12 шаговых программах есть система наставничества. Наставник «Спонсор» - это такой же зависимый, который имеет больше опыта в программе, при этом - человек, одного пола с тобой или одной сексуальной ориентации (это важно, чтобы отношения оставались чистыми и никак не сексуализировались). Нет условий, чтобы «спонсор» прошел все 12 шагов, или чтобы у него было много лет трезвости - каждый сам решает, когда он готов брать подопечных. Но надо, чтобы тебя еще и выбрали.\n⠀\nНовичок в программе сам ищет себе спонсора -  слушает на собраниях высказывания, если чей-то опыт особенно отзывается, если думаешь: «мы с этим человеком похожи» или «хотел бы я мыслить так же» - после собрания можно подойти к человеку и попросить его стать наставником. Это не значит, что человек сразу согласится. Иногда приходится искать своего спонсора какое-то время.\n⠀\nЕсть еще система рекомендаций - твои друзья из 12-шагового сообщества могут посоветовать человека, который классно ведет по шагам и может тебе подойти. Ты получишь контакт и можешь попросить о встрече.\n⠀\nУ разных спонсоров могут быть разные системы ведения. Один будет более авторитарен, скажет: ты должен звонить мне каждый день и раз в неделю мы читаем шаг. Другой скажет: ты двигаешься в своем потоке, раз в несколько месяцев мы встречаемся и обсуждаем твои выводы по шагу. Мой спонсор ведет меня в свободном стиле, с авторитарным я бы не смогла работать, но я знаю людей, которые ищут именно таких.  Я сама веду своих подопечных без строгих правил. Они сами решают, как быстро им писать, когда мне звонить.\n⠀\nЛюди могут брать паузы и возвращаться к написанию шагов - я не тороплю и просто даю ощущение, что я буду рядом и через пол года, и через год.\n⠀\nМои подопечные со мной годами, и это - очень важные для меня отношения.\n⠀\nКогда они пишут шаги, я проживаю все вместе с ними, получаю их опыт себе в копилочку, напоминаю себе о важных вещах. Я как будто укрепляю свои знания и веру, идя путь вместе с ними. Моя наставница дает мне ощущение твердого плеча и кладези опыта - я могу делиться с ней самыми сложными вещами, это - 100% доверия. (Продолжение - листайте фото!) ⏯ #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CR52GRDnWWz/\n\nЧетверг - тема «зависимости»\n⠀\nВ 12 шаговых программах есть система наставничества. Наставник «Спонсор» - это такой же зависимый, который имеет больше опыта в программе, при этом - человек, одного пола с тобой или одной сексуальной ориентации (это важно, чтобы отношения оставались чистыми и никак не сексуализировались). Нет условий, чтобы «спонсор» прошел ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-06-03.md", "source": "Instagram", "date": "2021-06-03", "filename": "2021-06-03", "title": "2021-06-03", "full_content": "https://www.instagram.com/p/CPqdexeHDu7/\n\n12 шагов научили меня брать ответственность за свои ошибки.\n⠀\nЕсть целый шаг, девятый, который посвящён исправлению причин и последствий своих ошибок.\n⠀\nНапример, раньше я истерила внутри себя из-за критики, злилась, если мои идеи оказались кому-то не полезны или вреды, я готова была орать: «Мы -то молодцы! Это вы все неправильно поняли!».\n⠀\nЯ перечитывала недавно свой «четвёртый шаг» - ещё лет 5 назад меня разъедали обиды на комментаторов в соц.сетях, на тех, кому не нравилось мое дело, кому не нравилась я и моя музыка.\n⠀\nПотом был следующий этап: я осознавала ошибки, но не могла о них говорить. Казалось, что я сгорю в огне стыда, что надо спрятать голову в песок и просто не делать больше плохо, а делать хорошо.\n⠀\nВо всем в этом - сплошное желание приносить только пользу, быть только хорошей, нравится всем.\n⠀\nНо если ты что-то делаешь, очень сложно не совершать ошибок. Если ты работаешь с людьми - очень сложно помочь всем, оправдать все ожидания.\n⠀\nВ какой-то момент мое понимание изменилось. Я поняла, что я готова взять ответственность и признать, что я была не права, что я могу разделить боль другого человека, показать, что я уважаю его чувства и хочу ему помочь, если я могу это сделать.\n⠀\nМне понравилось брать ответственность. Это стало давать мне силы. Это не значит, что я перестала расстраиваться из-за критики или в моменты, когда что-то не зашло, когда у кого-то с сектой не получилось то, что он планировал. Все ещё меня может затопить эмоциями.\n⠀\nНо потом я выдыхаю и беру ответственность: да, это была наша недоработка. Мне очень жаль.\n⠀\nЭто гораздо короче, кстати, чем оправдываться, объяснять, что мы имели ввиду, отбиваться, говорить что все индивидуально и «дело не в нас, дело в них». Не всегда что-то можно исправить сразу, иногда нужны годы. Но если признать, что ты не божество, и даже лучшие твои намерения могут навредить, становится легче.\n⠀\nСначала кажется, что отключив защиту, ты стал слабее, но потом приходит чувство, что ты обнимаешь весь мир. Как будто раньше в тебя летели штыки «ты не прав!», «ты плохо сделал!», а теперь ты слышишь в этом боль человека и стараешься дать ему лекарство, слыша его. Желание помочь даёт силы делать всё ещё лучше.\n", "preview": "https://www.instagram.com/p/CPqdexeHDu7/\n\n12 шагов научили меня брать ответственность за свои ошибки.\n⠀\nЕсть целый шаг, девятый, который посвящён исправлению причин и последствий своих ошибок.\n⠀\nНапример, раньше я истерила внутри себя из-за критики, злилась, если мои идеи оказались кому-то не полезны или вреды, я готова была орать: «Мы -то молодцы! Это вы все неправильно поняли!».\n⠀\nЯ перечитывала", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/vi_vse_nepr_export/posts_md/2021-05-02__130__бедными_богатый_дяденька_дал_нам_микроавтобус_поехали.md", "source": "Vi Vse Nepr", "date": "2021-05-02", "filename": "2021-05-02__130__бедными_богатый_дяденька_дал_нам_микроавтобус_поехали", "title": "130 бедными богатый дяденька дал нам микроавтобус поехали", "full_content": "# 2021-05-02 — бедными богатый дяденька дал нам микроавтобус поехали\n*Datetime*: 2021-05-02T03:49:49+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 130\n\nМы были очень бедными, но богатый дяденька дал нам микроавтобус, чтобы мы поехали в тур по Европе. Тогда я нашла сайт «Couchsurfing», каким то чудом мы умудрялись вписываться вшестером - то в маленькую квартирку Дэвида в Генуе (туда мы приехали специально, чтобы поклониться Генуэзской консерватории), то в горный домик хоббита где-то на окраине Вероны. Хозяином был очень странный парень, мы приехали уставшие до смерти, искали дорогу во тьме, а утром обалдели - мы были на вершине горы, казалось, так просто быть не может. Обычно в Европе ты видишь туристические маршруты, а Каучсерфинг заставляет тебя сворачивать с протоптанных тропинок, оказываться в странных местах.\n\n Мы покупали самый старый и дешевый сыр - твердющий пармезан, помидоры - и этим питались. Иногда богатый дяденька из России отправлял нам еще немного денег, и мы бежали за едой в супермаркет. На концерте в Швейцарии мы получили хороший гонорар, но очень быстро потратили все на еду. Мы запомнили, что надо было выключать воду в душе, когда намыливаешься - там нас поспать пустила хорошая женщина, и было видно, что она переживает - какой после нас придет счет на воду.\n\nКогда ты беден, мир раскрывает тебе объятья. Он полон взаимопомощи, надо только нырять в него щучкой - так я путешествовала одна по Индии, когда ты без денег - с тебя нечего взять, но тебе всегда есть, что дать. Только тебе всегда кислорода на один вдох. Денег на один месяц аренды. Только на билет в одну сторону.\n\nНадо обязательно что-то делать, когда у тебя нет денег - не чтобы заработать, а чтобы понять, как в мире все устроено, что к любой вещи можно подойти с двух сторон, что материя изгибается во всех плоскостях. Как будто от мира денег тебя отделяет прозрачная перепонка. Ты смотришь на их интерьеры, на технику,  на свободу и непринужденность - как они кидаются суммами, которые для тебя были бы спасением и исполнением мечты, и свободой - но это не твое.\n\nТак мы познакомились с Феликсом из Риги. Мы пришли на группу, и там сидели два человека - потом он подвез нас на крутой тачке и дал 20 лат. Кажется, это было очень много для нас. Просто так бац - и дал денег.\n\nМне иногда пишут: ты обесцениваешь свои достижения. Но я чувствую не так. Как будто перепонка надорвалась и меня всосало в мир денег, я оказалась на другой стороне, где вся эта техника, интерьеры, суммы - это все произошло так спонтанно и неожиданно, как если бы на моем месте была Саша Соколова. Как она, судя по рассказам, снимала что-то в Питере, в районе Коломны. Так и я.. Занимала, чтобы заплатить аренду. Она делала, что любила, умела и могла. Такие люди не могут иначе. И вот у меня так же - я просто делала то, что умела, любила и могла. И сейчас так же - просто Боженька как будто выбирает, кого на какую сторону поместить - труда и старания у меня может быть меньше чем у того, кому его дело не приносит денег. И я это знаю. Поэтому я всегда тянусь к другому миру.  К тем, кто по другую сторону.\n\nБольше всего эмоций от недвижимости я чувствую в квартире Шапо. Человек, у которого появился свой дом. Один единственный. Самый любимый. Человек с пятью домами будет более бездомным чем тот, у кого дом один.\n\nЯ часто слышу от людей, что они переживают трансформации и становятся лучше, находят озарения. Я же вообще не меняюсь - мне кажется я такая статичная, что пиздец. Просто когда я начала писать 12 шагов, я перестала ебать себе мозги в связи с тем, что я не вышла - по своим собственным меркам или по заданной родителями планке - и как-то проще стала относиться к своим недостаткам. Но они никуда не делись. Более того, если я и трансформируюсь - то только в худшую сторону. Меньше читаю, больше втыкаю в телефон, совсем не хочу получать образование, мало пишу. Но это не так страшно, потому что я и до этого ничего особенного не делала. Мне кажется, что я выстраивала жизнь, как будто соединяя кусочки детской железной дороги из Ikea, уровень сложности - начальный, игрушка от 0 до 3 лет.\n\nReactions: 👍12 🔥5 💊1\n", "preview": "# 2021-05-02 — бедными богатый дяденька дал нам микроавтобус поехали\n*Datetime*: 2021-05-02T03:49:49+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 130\n\nМы были очень бедными, но богатый дяденька дал нам микроавтобус, чтобы мы поехали в тур по Европе. Тогда я нашла сайт «Couchsurfing», каким то чудом мы умудрялись вписываться вшестером - то в маленькую квартирку Дэвида в Генуе (туда мы прие", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-04-22.md", "source": "Instagram", "date": "2021-04-22", "filename": "2021-04-22", "title": "2021-04-22", "full_content": "https://www.instagram.com/p/CN9h75ZnySn/\n\nПо четвергам я пишу про зависимость.\n⠀\nСегодня дам небольшую вводную для новичков, которые часто пишут мне:\n⠀\n- Так от чего у вас зависимость?\n⠀\n15 лет назад я думала, что у меня проблемы с наркотиками. Я хотела завязать с ними, и оставить все остальное - косячок, бокал вина по вечерам, тусовки с текилой по выходным. В те моменты, когда я методом силы воли бросала употреблять, просыпалась моя булимия и я начинала напиваться гораздо чаще, чем хотелось - я не связывала все это воедино, пока не узнала, что зависимость всегда найдет лазейку, чтобы проявиться - и надо постоянно работать с ней, как будто у тебя диабет.\n⠀\nПотом я начала видеть, как мое зависимое поведение проявляется во всем - в дружбе, отношениях, в работе. Зависимость - это эгоцентризм, и как следствие - обидчивость, ранимость, сосредоточенность на своих чувствах, невозможность выходить из круговорота боли.\n⠀\nПросто трезвость не решала эти проблемы - я срывалась после года чистоты, после 2х лет чистоты, пока не поняла, что дело не в трезвости самой по себе а в том, что мне нужно разобраться в причинах.\n⠀\nТогда я начала письменную работу по программе «12 шагов» - изначально ее создали алкоголики, но она была адаптирована сначала для наркоманов, а потом - для многих других видов зависимости, да и вообще - для многих ситуаций, которые вроде бы не связаны с зависимостью. С 12 шагами люди переживают утрату, поддерживают себя в болезнях - короче, как в бойцовском клубе. Есть много групп, но суть не в группах а в письменной работе.\n⠀\nЯ пишу 12 шагов уже 9 лет, не тороплюсь, стараюсь прописать каждую мелочь, прожить каждый раздел. Сейчас я - в середине 11 шага. По сути - это просто ответы на вопросы из книги, я пишу свой опыт, примеры из жизни и потом обсуждаю со «спонсором» - это волонтер из программы, у которого опыта больше, чем у меня. Это бесплатно, анонимно и не требует много времени. Кажется, что это сложная работа, но сложно только начать: найти подходящее сообщество, спонсора и впрыгнуть в работу. Когда я допишу 12 шаг, я просто начну заново. Потому что суть в процессе, и нет конечной точки. Есть просто жизнь без желания самоуничтожится, и это - ценность. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CN9h75ZnySn/\n\nПо четвергам я пишу про зависимость.\n⠀\nСегодня дам небольшую вводную для новичков, которые часто пишут мне:\n⠀\n- Так от чего у вас зависимость?\n⠀\n15 лет назад я думала, что у меня проблемы с наркотиками. Я хотела завязать с ними, и оставить все остальное - косячок, бокал вина по вечерам, тусовки с текилой по выходным. В те моменты, когда я методом силы воли", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-04-15.md", "source": "Instagram", "date": "2021-04-15", "filename": "2021-04-15", "title": "2021-04-15", "full_content": "https://www.instagram.com/p/CNsPVwfntF5/\n\nПо четвергам я пишу о зависимости.\n⠀\nКонечно, честность - это ключ в работе с черной дырой внутри, как бы она не проявлялась. Но у правды, будто бы, есть  много уровней. Ты снимаешь слой за слоем с этой луковицы, и с каждым разом ты вроде ближе к истине о себе, но всегда есть, куда копнуть глубже, о чем еще можно рассказать и себе, и другим.\n⠀\nВ чем правда? Рассказать, что каждый раз я втягиваю живот для фотографии, сфоткать складку: «Вот как годами я обманывала своих подписчиков, чтобы казаться спортивнее, чем я есть». Или правда в том, что вот это самое я делаю это для того, чтобы получить много «спасибо, вы так вдохновляете своей честностью!», потому что сейчас - лавина честного фитнеса, и мне хочется влиться в нее, хочется тоже кусок от пирога одобрения, которые все эти честные блогеры едят без меня. Что я готова трусами махать, лишь бы получить побольше комментариев. \n⠀\nНеприятная правда в том, что я на многое готова ради роста инстаграма, действительно расстраиваюсь, когда вижу отрицательную статистику и динамику - и мне тошно от себя в эти моменты, почему я просто не могу делать свое дело, писать интересные мне вещи, не взирая на отклик? Может потому, что 4 года делала это - и количество все уменьшалось и уменьшалось, И Я РАССТРАИВАЛАСЬ. А вот когда я поставила цель на рост, когда новые люди стали приходить, я испытала реальную радость. ТАК ВОТ КАКОЙ Я МЕЛКИЙ ЧЕЛОВЕЧИШКА, А СТРОЮ ИЗ СЕБЯ ТУТ МИСС ДУХОВНОСТЬ.\n⠀\n12 шагов заставляют каждый день смотреть на себя без прикрас. Они не заставляют рассказывать о себе то, что ты не готов рассказывать. Но шаг за шагом ты понимаешь, что чем ты честнее - тем ценнее для тебя принятие мира.\n⠀\nПисьменная работа по шагам заставляет описать себя досконально, со всех духовных и нравственных ракурсов, понять свои намерения и мотивы, что тобой движет, что тебя задевает. Я вот очень хотела ( да и хочу) быть сверхдуховным суперсуществом, но по факту я просто человек с мелкими желаниями. И вот если такое существо можно полюбить, то и весь мир достоин любви. Таким вот удивительным путем шаги ведут через тернии честности к звездам любви и принятия. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CNsPVwfntF5/\n\nПо четвергам я пишу о зависимости.\n⠀\nКонечно, честность - это ключ в работе с черной дырой внутри, как бы она не проявлялась. Но у правды, будто бы, есть  много уровней. Ты снимаешь слой за слоем с этой луковицы, и с каждым разом ты вроде ближе к истине о себе, но всегда есть, куда копнуть глубже, о чем еще можно рассказать и себе, и другим.\n⠀\nВ чем правда", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-03-25.md", "source": "Instagram", "date": "2021-03-25", "filename": "2021-03-25", "title": "2021-03-25", "full_content": "https://www.instagram.com/p/CM2WfaGHNct/\n\nПо четвергам я пишу о зависимости, как о хроническом заболевании, которое затрагивает все сферы нашей жизни.\n⠀\nСегодня говорила с подругой, которая с января находится в реабилитационном центре. Я в один из четвергов о ней писала. Сегодня она сказала, что хочет остаться еще на несколько месяцев.\n⠀\nКак? Серьезно?! - сказали многие близкие, - ведь у нее не было ТАКИХ проблем. - Да и сложно представить извне, что там такого происходит за стенами РЦ, что ты внезапно хочешь остаться.\n⠀\nВчера я писала о бизнесе, о моем подходе к делам: что я стараюсь приносить пользу и радость ближним. Отчасти, так было всегда, но с «изнанки» это отличалось.\n⠀\nСчитается, что зависимые люди очень эгоцентричны, и в любое действие мы делаем, закручивая реальность вокруг себя\n⠀\nЧтобы МЕНЯ полюбили\nМЕНЯ оценили\nМЕНЯ заметили\n⠀\nИ мне, и многим моим друзьям, похожим на меня, никогда не было достаточно, неутолимое Я всегда было недовольно\n⠀\n«Я» ведь могу лучше\nЯ недостаточно стараюсь\nЯ сам во всем виноват\nЯ мог бы жить и вести себя иначе\n⠀\nПостоянно Я. Ничего кроме бесконечного Я, МЕНЯ, МНЕ - и все это связано с болью несбыточности.\n⠀\n12 шагов, по моему опыту, с одной стороны заставляют глубоко копать в себя, а с другой стороны - очень отвлекают от «Я», и помогают сосредоточится на служении близким, на простой ответственности за простые действия. Ты заправляешь кровать, подметаешь дом, помогаешь новичку, ведешь группу - и в помощи другим ты становишься спокойным и счастливым, даже если никто не замечает твоего труда. Возможно мои дети, собаки, работы - это все мой личный реб.центр. Ответственность и труд - это мое освобождение от мук эгоцентризма.\n⠀\nМоя подруга сказала, что после РЦ хочет стать волонтером, помогать зависимым людям, поучиться на консультанта по работе с зависимыми. Я слышу в ее голосе, что из этого может получится что-то классное. Мы с ней обе очень любим отдавать, и я помню, как сама пыталась отдавать последнее, когда во мне все было пусто и выжжено. С тех пор мало что изменилось для людей снаружи, но внутри я совсем другой человек. Даже когда я устаю, я больше никогда не бываю такой опустошенной как 10 или 15 лет назад, до появления 12 шагов в моей жизни. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CM2WfaGHNct/\n\nПо четвергам я пишу о зависимости, как о хроническом заболевании, которое затрагивает все сферы нашей жизни.\n⠀\nСегодня говорила с подругой, которая с января находится в реабилитационном центре. Я в один из четвергов о ней писала. Сегодня она сказала, что хочет остаться еще на несколько месяцев.\n⠀\nКак? Серьезно?! - сказали многие близкие, - ведь у нее не бы", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-03-11.md", "source": "Instagram", "date": "2021-03-11", "filename": "2021-03-11", "title": "2021-03-11", "full_content": "https://www.instagram.com/p/CMRTmLdHb-A/\n\nПо четвергам я пишу о зависимости. В начале января я писала, как отвезла подругу на реабилитацию. Думала - на две недели, но она решила остаться там на три месяца, чему я несказанно рада. Почему я думала, что она останется на две недели? У нее не было проблем с веществами, а алкоголь - это слишком легкая и очень социально приемлемая история, и всем кажется, что ничего в этом страшного нет. Но в зависимости употребение чего-то - это всего лишь следствие. Работать по 12 шагам помогает, когда ты умираешь внутри, чувствуешь пустоту, и пытаешься заполнить эту пустоту разными способами.\n⠀\nЧерез месяц у меня будет 9 лет трезвости и чистоты от любых веществ. О «12 шагах» и разных «анонимных сообществах», я узнала 13 лет назад. Я думала, что такое бывает только в кино, в моем любимом «Бойцовском клубе», но оказалось, что группы есть даже в Екатеринбурге. У меня тогда не было социальных проблем - я училась в универе, в который поступила сама, у меня уже была известная в наших кругах музыкальная группа, все считали меня классной, многие хотели дружить, я нравилась парням. Мне было весело пить с друзьями по выходным, я была уверена, что я могу жить без наркотиков - мое употребление было эпизодическим, скорее - форс-мажоры, что-то случайное, а в целом я считала себя абсолютно нормальной. Я никак не связывала свою булимию со всем этим, а постоянный клубок напряжения, обид и страхов внутри меня - это казалось мне структурной частью моей личности.\n⠀\nОбычно люди смотрели на меня и не догадывались, как больно мне внутри. И вот когда я случайно познакомилась с Никой (у нее тогда уже было чуть меньше 10 лет чистоты, как у меня сейчас), она разглядела во мне все это. Она никогда не навязывала мне помощь, просто она рассказала мне кратко о зависимости и о том, почему мне все это может помочь, если станет совсем плохо. И прежде чем обратиться за помощью, я прошла несколько циклов «я все могу сама», и потом, следующие годы я уже без сомнения пользовалась инструментами 12 шагов, потому что поняла, что сама я не могу.\n⠀\n(Продолжение в фото) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CMRTmLdHb-A/\n\nПо четвергам я пишу о зависимости. В начале января я писала, как отвезла подругу на реабилитацию. Думала - на две недели, но она решила остаться там на три месяца, чему я несказанно рада. Почему я думала, что она останется на две недели? У нее не было проблем с веществами, а алкоголь - это слишком легкая и очень социально приемлемая история, и всем кажется", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2021-01-07.md", "source": "Instagram", "date": "2021-01-07", "filename": "2021-01-07", "title": "2021-01-07", "full_content": "https://www.instagram.com/p/CJvV_9yn99_/\n\nПо четвергам я пишу о зависимости, и я ждала этого дня, чтобы написать пост о своем недавнем приключении. Я собиралась в Питер на каникулы, но внезапно планы изменились: мой близкий друг сказал, что готов к реабилитации. В такие моменты нельзя откладывать, надо все бросать и ехать.\n⠀\nРеб.центр, в который мы всегда отправляем наших знакомых и тех, кто спрашивает совета, находится в четырех часах езды от Москвы, дорога не легкая, и я попросила разрешения переночевать там. Меня попросили провести спикерское собрание - рассказать о своем опыте трезвости.\n⠀\nЯ ожидала, что в центре будет человек 15-20, но когда я зашла в помещение, я была шокирована: в зале было человек 60 -70, и большинство из них - подростки, были даже дети 10 - 11 лет.\n⠀\nПочему именно этот центр? Его основательница - моя подруга. Вернее не так, она стала моей подругой, а сначала - это она рассказала мне о 12-шаговых группах. Лет четырнадцать назад я была в ее реабилитационном центре еще в Екатеринбурге, поэтому я доверяю ей на все сто. Хоть последние годы мы редко общаемся, и я пишу ей в основном по делу - когда надо кого-то привезти - у нас огромная история вместе.\n⠀\nНика ночевала со мной в комнате, мы говорили пол ночи. Она рассказывала, как сделала детское отделение, куда привозят совсем трудных зависимых подростков. Есть и детдомовские, которых отправляют фонды, а рядом с ними - дети влиятельных и очень богатых людей. Я спрашиваю: - почему так? Чего этим детям не хватает?\n⠀\n- Ответственности, чаще всего. У многих детей есть все, кроме рамок, дисциплины, их части работы. Позволяют все, все у них есть, но они не знают цены деньгам, вещам, чистоте.\n⠀\nТак же кстати и у детдомовских: система все делает за них: приготовление еды, (продолжение текста - в карусели) 📍 #12шагов_olymarkes , на фото я отметила Нику - если вам понадобится реабилитация для близких, пишите ей. Если даже у неё нет мест - она посоветует другой хороший.\n", "preview": "https://www.instagram.com/p/CJvV_9yn99_/\n\nПо четвергам я пишу о зависимости, и я ждала этого дня, чтобы написать пост о своем недавнем приключении. Я собиралась в Питер на каникулы, но внезапно планы изменились: мой близкий друг сказал, что готов к реабилитации. В такие моменты нельзя откладывать, надо все бросать и ехать.\n⠀\nРеб.центр, в который мы всегда отправляем наших знакомых и тех, кто спраш", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/ig_organized/long_200_md/2020-12-31.md", "source": "Instagram", "date": "2020-12-31", "filename": "2020-12-31", "title": "2020-12-31", "full_content": "https://www.instagram.com/p/CJdR4xEH_Rr/\n\nСимволично, что год заканчивается в этот день. Что это утро я провела на собрании зависимых с одним из моих sponsee. У меня в душе очень хорошо от этого финального аккорда.\n⠀\nВ этом году я начала свои «чистые четверги» - писала о зависимом поведении и о своем пути в этой теме. Вчера рождественский выпуск сериала «Эйфория» на нетфликсе, и вся серия - это разговор главной героини со своим «спонсором» (так называются наставники -волонтеры в 12 шаговых сообществах). Я думала: так удивительно слышать это с экрана, и так здорово. И у меня были такие разговоры. И я была и на месте Ру, и через годы - уже на месте ее спонсора. У меня не на все есть ответы, но у меня есть мой опыт, и я им делюсь.\n⠀\nЗнаете, какой шаг является двенадцатым? Несение вести тем зависимым, которые все еще страдают. Кто написал сценарий этой серии «Эйфории» - они тоже сделали свой 12 шаг, и мы не узнаем, кто именно - в этом и есть принцип «анонимности». Но когда звезды рассказывают о своем пути в 12 шагах - например, Киддис в своей биографии, это тоже помогает многим. Я в свое время оказалась  в программе, потому что девушка рассказала мне о музыкантах, которые выздоравливали от употребления с помощью 12 шагов.\n⠀\nНесколько лет до этого я служила иначе: вела группы, общалась с подопечными. В этом году этого не хватало. Я не хотела нарушать принцип «анонимности», поэтому я рассказывала обо всех 12-шаговых программах в целом, не акцентируя внимания на конкретно своей проблеме. И это сработало очень интересным образом.\n⠀\nЗа этот год многие мне писали в личку: «я пошла на анонимных переедающих», «я узнала о сообществе CODA и хожу на группы созависимых», «я начал писать шаги по ВДА(взрослые дети алкоголиков». Это важно для меня, и у меня есть ощущение, что я все делала правильно, не стесняясь писать на эту тему.\n⠀\nМне писали и родственники зависимых - благодарили за мои посты, что они помогли лучше понять близких, понять, как поддерживать после реабилитации - я очень рада, что это было полезным. У постов есть тег и все их можно найти и прочитать в любой нужный момент.\n⠀\nВ этой сфере моей жизни в этом году главное - это весть, которая нашла своего адресата. Спасибо, что читали и делились ❤️\n", "preview": "https://www.instagram.com/p/CJdR4xEH_Rr/\n\nСимволично, что год заканчивается в этот день. Что это утро я провела на собрании зависимых с одним из моих sponsee. У меня в душе очень хорошо от этого финального аккорда.\n⠀\nВ этом году я начала свои «чистые четверги» - писала о зависимом поведении и о своем пути в этой теме. Вчера рождественский выпуск сериала «Эйфория» на нетфликсе, и вся серия - это ра", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-11-12.md", "source": "Instagram", "date": "2020-11-12", "filename": "2020-11-12", "title": "2020-11-12", "full_content": "https://www.instagram.com/p/CHf_udjHUab/\n\nПо четвергам я пишу о зависимости, и сегодня будут мои мысли на тему материнства.\n⠀\nЯ часто слышу на группах, что у зависимых мам плохо с материнском инстинктом. Зависимость - это про эгоцентризм, а родительство - это про служение. Тут даже проще созависимым - они любят собой жертвовать, посвящать всю свою жизнь, растворяться в других и жить чужим счастьем (естественно, так как они его понимают) 😅\n⠀\nМожет быть, я скажу ужасную вещь, но эгоцентризм родителей в здоровых пределах - это хорошо для детей. Да, у взрослых есть свои дела, свои интересы. Когда вы станете взрослыми - и у вас будет так. Быть взрослым классно, и дети не забирают твою жизнь - они приходят, чтобы разделить ее.\n⠀\nРодители не принадлежат тебе, их жизнь не принадлежит тебе - это не отменяет того, что они будут заботиться о тебе - но это не значит, что они должны перестать жить свою жизнь, оставаться вместе любой ценой или «согласовывать» с вами новых партнёров - особенно, если вам уже 30 😆.\n⠀\nБабушка постоянно говорила, что оставит мне наследство. Что квартира, которую она забрала у моего папы и прожила в ней 30 лет - это мой капитал. Всё только ради детей, ничего для себя. И сейчас, когда ей 80 и я покупаю ей дачу в нужном ЕЙ месте, она опять говорит: «не для себя беру, для тебя!». А я так хочу, чтобы она делала для себя. Чтобы она сказала: «да, эта дача - то, что надо. Она МЕНЯ радует».\n⠀\nМой папа это умеет. Наслаждаться жизнью, выбирать то, что хочется ему. В моем детстве он много работал и много веселились с друзьями, и не осталось у меня ни капли ощущения, что его не было рядом или что я чего-то не получила. Я видела, что когда я буду взрослой, я смогу совмещать и веселую жизнь и детей - собственно, так и получается.\n⠀\nНу и что касается зависимости и материнского инстинкта - 10 лет я смотрю на все эти истории, и резюме у меня такое: если Мама не пьёт и не торчит - она справляется со своими обязанностями не хуже. Да, может ей тяжелее, может она не находит в этом столько кайфа, сколько прирождённые к служению, но детям это всё не так важно. Им нужна любовь, а не вся наша жизнь. Мне кажется, что мои дети счастливые. Но посмотрим, что они расскажут своим психотерапевтам лет через 30 😆\n", "preview": "https://www.instagram.com/p/CHf_udjHUab/\n\nПо четвергам я пишу о зависимости, и сегодня будут мои мысли на тему материнства.\n⠀\nЯ часто слышу на группах, что у зависимых мам плохо с материнском инстинктом. Зависимость - это про эгоцентризм, а родительство - это про служение. Тут даже проще созависимым - они любят собой жертвовать, посвящать всю свою жизнь, растворяться в других и жить чужим счастьем", "annotation": "Работа с созависимостью в отношениях и выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-10-22.md", "source": "Instagram", "date": "2020-10-22", "filename": "2020-10-22", "title": "2020-10-22", "full_content": "https://www.instagram.com/p/CGo3kYbnHVs/\n\nПо четвергам я пишу про зависимость, еще я сделала хайлайт «четверг» - буду собирать туда что-то из сториз, или писать подводки к старым постам - например, там есть пост «с чего начать».\n⠀\nСегодня я хотела бы собрать у вас вопросы для будущих постов или темы, которые вы бы хотели увидеть глазами зависимого человека. Например, вчера я рассказывала друзьям о том, какая поддержка нужна человеку, выходящему из реабилитационного центра.\n⠀\nПишите, что вам интересно, о чем вам еще рассказать! #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CGo3kYbnHVs/\n\nПо четвергам я пишу про зависимость, еще я сделала хайлайт «четверг» - буду собирать туда что-то из сториз, или писать подводки к старым постам - например, там есть пост «с чего начать».\n⠀\nСегодня я хотела бы собрать у вас вопросы для будущих постов или темы, которые вы бы хотели увидеть глазами зависимого человека. Например, вчера я рассказывала друзьям о", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/ig_organized/long_200_md/2020-10-22__2.md", "source": "Instagram", "date": "2020-10-22", "filename": "2020-10-22__2", "title": "2", "full_content": "https://www.instagram.com/p/CGo7ec8HCIu/\n\nКак поддержать человека после реабилитации?\n⠀\nСамое главное - это новая среда. Если человек вернется туда, где пьют/употребляет - даже после года в реб.центре ему будет сложно удержаться.\n⠀\nМне в свое время очень помогло, что мои друзья перестали употреблять даже алкоголь, чтобы поддержать меня в первые годы трезвости. Да, алкоголь - это тоже наркотик, и для зависимого человека необходима полная трезвость, поэтому никаких «ну бокальчик-то тебе можно!». Мои друзья были готовы растерзать каждого, кто предлагал мне алкоголь.\n⠀\nЧеловеку после реб. центра надо посещать собрания - первые годы особенно. Зачем? Во-первых, чтобы впитывать опыт других зависимых, во-вторых для создания новой среды общения, новой нормы, где люди работают с эмоциями в трезвости, а не глушат их. Собрания - это не веселье, это - труд. И сначала человеку нужна поддержка, чтобы была возможность посещать эти собрания.\n⠀\nЧеловеку после реб.центра нужна вера. Он сам может быть атеистом, вся семья/друзья могут быть атеистами, но никак нельзя обесценивать эту часть выздоровления от активной зависимости. Можно не говорить слово «Бог», можно говорить «вселенная» или «высшая сила», важно знать, что зависимому нужен внешний конструкт, на который можно положиться, обозначая свое намерение оставаться в трезвости. У зависимых не работает сила воли, но если они будут полагаться на внешнюю силу, то у них все будет получаться.\n⠀\nЭто сложная концепция бессилия и веры, но она работает для миллионов завсисимых уже десятки лет, поэтому задача близких - это не высмеивать и не обесценивать (даже если человек сам пытается это сделать) а попытаться понять эту часть программы.\n⠀\nКогда человек выходит из реб.центра - ему надо научиться простой работе, полагаться только на себя, не ставить перед собой сложных задач и не брать ответственность за других. Нужен годик-другой, чтобы окрепнуть, утвердиться. Хорошо, если человек будет стремиться помогать в работе по дому, выстроит себе рутину - простые повторяющиеся действия на каждый день. Тогда через какое-то время он заново научится «ходить» и быстро наберет силы.\n⠀\nЭто все - исключительно мой опыт, мнение и видение. Точно не истина для всех, но то, чем я хотела поделиться.\n", "preview": "https://www.instagram.com/p/CGo7ec8HCIu/\n\nКак поддержать человека после реабилитации?\n⠀\nСамое главное - это новая среда. Если человек вернется туда, где пьют/употребляет - даже после года в реб.центре ему будет сложно удержаться.\n⠀\nМне в свое время очень помогло, что мои друзья перестали употреблять даже алкоголь, чтобы поддержать меня в первые годы трезвости. Да, алкоголь - это тоже наркотик, и д", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/ig_organized/long_200_md/2020-10-09.md", "source": "Instagram", "date": "2020-10-09", "filename": "2020-10-09", "title": "2020-10-09", "full_content": "https://www.instagram.com/p/CGHWatdn_K5/\n\nВчера был четверг, и я хотела написать о том, как зависимое поведение проявляется в отношениях. Я не успела вчера написать пост, поэтому сделаю это сегодня.\n⠀\nСначала про паттерны поведения, которые я встречала в своей жизни, и о которых рассказвают многие зависимые.\n⠀\nНам свойственно:\n⠀\n🚩 Требовать любовь в определенных проявлениях\n🚩Мстить партнеру за негативные чувства\n🚩Создавать конфликтные ситуации, чтобы партнер доказывал: «нет, я тебя правда люблю!»\n🚩Манипуляцией или придуманной  ревностью добиваться подтверждения чувств (реальная ревность к этому не относится)\n🚩Обиды и эмоциональное отвержение (то есть когда человек поступает не так, как хотелось бы, и это становится причиной того, что мы отрекаемся внутри себя от партнера).\n⠀\nОбиды и месть, даже если это действительно наш близкий и любимый человек - это самый частый паттерн.\n⠀\n«Подтверждай, подтверждай, подтверждай, что ты меня любишь - но мне никогда не будет достаточно» (просто потому, что у меня не достаточно любви к себе - твоя любовь тоже не сможет меня исцелить). Кстати, тут и происходит сцепка зависимых/созависимых людей, потому что созависимые уверены, что своей любовью они могут спасти кого угодно.\n⠀\nУ зависимых людей внутри - черный клубок нераспутанных чувств, и мы всегда ждем, что партнер вместе с нами разделит ответственность за него. Что другой человек заставит нас чувствовать себя любимыми, полноценными. А если он в этом не помогает - значит, он плохо делает свою работу, и его надо наказать.\n⠀\n«Если мне плохо - пусть тебе тоже будет плохо»\n⠀\nВ отстутствии негативных чувств зависимым тоже сложно, поэтому иногда они любят сами создавать конфликтные ситуации, и тогда контраст «конфликт - примирение» дает нужную палитру ощущений.\n⠀\nЗависимый человек может расставаться и возвращаться к партнеру: «С тобой плохо, но без тебя еще хуже».\n⠀\nЧем острее и непроработаннее в человеке зависимое поведение - тем более эмоционально опустошающими будут отношения с ним.\n⠀\n(Продолжение в карусели) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CGHWatdn_K5/\n\nВчера был четверг, и я хотела написать о том, как зависимое поведение проявляется в отношениях. Я не успела вчера написать пост, поэтому сделаю это сегодня.\n⠀\nСначала про паттерны поведения, которые я встречала в своей жизни, и о которых рассказвают многие зависимые.\n⠀\nНам свойственно:\n⠀\n🚩 Требовать любовь в определенных проявлениях\n🚩Мстить партнеру за нег", "annotation": "Работа с созависимостью в отношениях и выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-08-13.md", "source": "Instagram", "date": "2020-08-13", "filename": "2020-08-13", "title": "2020-08-13", "full_content": "https://www.instagram.com/p/CD08LFqnxbr/\n\nСпасибо всем, кто вчера рассказал мне о нашем знакомстве - для меня это важный заряд. Я рада, что вас вдохновляют мои рассказы о разных сферах жизни, и здорово, что вы так любите четверги и мои посты про зависимое поведение - сегодня и продолжу об этом.\n⠀\nЧто самое сложно в пути зависимого человека? Сначала сложно понять, почему тебе нужно отказаться от всех веществ, изменяющих сознание. Особенно сложно, если в твоей среде это - норма. Но многие мои друзья могли остановиться - а я не могла, так я поняла, что я не могу контролировать употребление.\n⠀\nВторое - это вопрос, чем заполнить пустоту, которая приходит, когда отказываешься от алкоголя, наркотиков, сигарет. Это сложно, потому что похоже на жажду, и потому что кажется, что мир бесконечно скучный. Часть этих ощущений проходит со временем, но частично пустота остается - и вот здесь как раз без 12 шагов я постоянно срывалась и возвращалась к прежнему.\n⠀\nЯ умею держаться на силе воли, но терпение - это ограниченный ресурс, и поэтому меня возвращало к прежнему режиму, пока я не начала разбираться в глубоких причинах.\n⠀\n12 шагов - это бесплатно, добровольно и поэтому - так сложно. Иногда совершенно невозможно заставить себя помогать самому себе. Кажется - ну такая чушь, такая мелочь - задать себе пару вопросов и ответить на них письменно, зайти на группу в Зуме. А нет, сложнее этого ничего нет.\n⠀\nДаже долгая трезвость не гарантирует счастья и душевного покоя, если ты не задаешь себе правильные вопросы. Если не работать со своим внутренним миром, зависимость найдет лазейки: еда, отношения, работа, деньги, интернет - все будет доведено до крайности и станет оружием саморазрушения.\n⠀\nКогда в жизни есть шаги и работа по ним - есть ощущение, что ты держишь свою жизнь в своих руках. Когда зависимость берет верх - кажется, что ты падаешь в свою жизнь, как в бурную реку, и она несет тебя - а ты только барахтаешься и пытаешься вдохнуть.\n⠀\nПоэтому главное в работе с зависимостью - это не трезвость, а состояние. Вот за ним приходится постоянно наблюдать и в случае чего - сразу искать причины и работать с ними. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CD08LFqnxbr/\n\nСпасибо всем, кто вчера рассказал мне о нашем знакомстве - для меня это важный заряд. Я рада, что вас вдохновляют мои рассказы о разных сферах жизни, и здорово, что вы так любите четверги и мои посты про зависимое поведение - сегодня и продолжу об этом.\n⠀\nЧто самое сложно в пути зависимого человека? Сначала сложно понять, почему тебе нужно отказаться от вс", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-07-21__2.md", "source": "Instagram", "date": "2020-07-21", "filename": "2020-07-21__2", "title": "2", "full_content": "https://www.instagram.com/p/CC5TZGwn2JR/\n\nЯ тысячи раз в своей жизни начинала «с нуля». Так часто, что привыкла к этому. Это стало моей нормой.\n⠀\nВ 20 лет я употребляла наркотики, чтобы быть тощей, но приходил момент, когда я не могла больше этого делать - тело сдавалось, и были дни, когда я не могла пошевелить руками и ногами, но я сползала с кровати и начинала качать пресс. Потом были такие периоды, когда мне выкручивало все конечности, а я надевала кроссовки и выходила на пробежку - сложно было назвать это бегом, но я двигалась.\n⠀\nЯ не знала никого, кто делал бы так же. Все предпочитали «отлежаться» и потом начать что-то делать. У меня всегда было ощущение: если ты в большом минусе, то нужен огромный плюс, чтобы вернуться к нулю, к точке, где ты просто чувствуешь себя нормально.\n⠀\nДвижение стало моей палочкой - выручалочкой задолго до секты, даже не так: оно было моим спасательным кругом. Но само по себе движение - это еще не зож. Это способ выравнить баланс, способ перестать умирать, грубо говоря, и начать жить.\n⠀\nВот сейчас, когда я возвращаюсь из отпуска, это как маленькая смерть. Думаешь: и как я справлялась до отпуска? И в тренировках сниматься, и трое детей, и еще прибраться надо, и поесть как-то надо три раза в день, и работа, и группа, и песни дописать, и 12 шагов со всеми моими подспонсорными. Я устала даже пока думала об этом - как начать делать?\n⠀\nИ я сползаю на коврик и делаю самую простую тренировку. И потом через нехочу-немогу беру велосипед и делаю первую триатлонную тренировку. Возвращаюсь домой, и вот она, знакомая мысль: «Так, что там у нас дальше. Я сделаю все, что смогу сегодня». И я делаю много. И включаю французский подкаст на пробежке. И читаю детям сказку вечером. И даже разбираю стирку.\n⠀\nА начинается все с такой легкой тренировки, которую я и за тренировку не считаю. Просто ногами и руками подрыгать)) И не для тела, не для рельефа.. Для того, чтобы жить свою жизнь и кайфовать от нее, а не ох@евать)\n⠀\nЕсли хотите потренироваться со мной сегодня и взять от меня кусочек силы:\n⠀\n1. 9 минут shortwork в @sektaschool - за 9 минут успеете раз 9 умереть и воскреснуть)\n\n⠀\n\n 2. 30 минут под русский рэпчик у меня на стене в VK, искать как olymarkes\n⠀\n", "preview": "https://www.instagram.com/p/CC5TZGwn2JR/\n\nЯ тысячи раз в своей жизни начинала «с нуля». Так часто, что привыкла к этому. Это стало моей нормой.\n⠀\nВ 20 лет я употребляла наркотики, чтобы быть тощей, но приходил момент, когда я не могла больше этого делать - тело сдавалось, и были дни, когда я не могла пошевелить руками и ногами, но я сползала с кровати и начинала качать пресс. Потом были такие ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-07-09__2.md", "source": "Instagram", "date": "2020-07-09", "filename": "2020-07-09__2", "title": "2", "full_content": "https://www.instagram.com/p/CCaQLMYnHC8/\n\nЕженедельная рубрика «Зависимость» в эфире.\n⠀\nКаждый четверг после моих постов мне заваливают Директ с вопросами: «Посоветуй специалиста по 12 шагам» «куда бежать кому платить». Сложность в том, что никуда и никому, потому что «Шаги» - это бесплатная история, а это значит, что никому не будет нужно больше, чем тебе.\n⠀\nИтак, я накидала для вас инструкцию. Что делать, если вы поняли, что вы - зависимый человек?\n⠀\n1. Определите основную «проблему»: алкоголь, наркотики, игромания, переедание, депрессия, сексоголизм, созависимость, или может быть вы - взрослый ребенок алкоголиков/наркоманов? Если что-нибудь из этого про вас - идем дальше. Нет - возможно, с вашей проблемой вам лучше к психологу/психотерапевту.\n⠀\n2. Найдите группу взаимопомощи по вашей зависимости в своем городе или онлайн. Как гуглить: «Анонимные Алкоголики (ващ город)», «Анонимные Наркоманы (ваш город)», Анонимные Созависимые. И т.д. Нашли в своем городе - идите на живое собрание. Не нашли - ищите собрания онлайн, подключайтесь на него.\n⠀\n3. Что делать на группе? Вы должны представится и сказать, что вы - новичок. Вам не надо обязательно говорить что-то еще, рассказывать о своей проблеме и о жизни. Можно просто молчать. По одному собранию невозможно составить представление о шагах и сообществе, поэтому надо просто начать ходить. Обычно рекомендуют ходить на собрания три месяца, не пропуская.\n⠀\n4. На собрании надо слушать высказывания, и когда вам понравится кто-то из группы, кто-то вдохновит (человек одного с вами пола, или тот, к которому у вас не будет влечения) - вы можете подойти и попросить стать вашим «спонсором». Так называются волонтеры-впередиидущие по программе, которые помогают новичкам, и часто делают это годами. Если он согласится - вы становитесь его «подспонсорным», он делится опытом о том, как он писал и проходил шаги. Он дает вам задания по книге/руководству. Например: напиши ответы на три вопроса по три примера на каждый.  Спонсор может поставить условия: сдавай задания раз в неделю, или я не буду с тобой работать. Спонсора можно менять в любой момент.\n⠀\nСложно, но если прижмет и ничего больше не помогает - и не такое освоишь 🙂 Сегодня на этом всё! #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CCaQLMYnHC8/\n\nЕженедельная рубрика «Зависимость» в эфире.\n⠀\nКаждый четверг после моих постов мне заваливают Директ с вопросами: «Посоветуй специалиста по 12 шагам» «куда бежать кому платить». Сложность в том, что никуда и никому, потому что «Шаги» - это бесплатная история, а это значит, что никому не будет нужно больше, чем тебе.\n⠀\nИтак, я накидала для вас инструкцию. Ч", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-07-02.md", "source": "Instagram", "date": "2020-07-02", "filename": "2020-07-02", "title": "2020-07-02", "full_content": "https://www.instagram.com/p/CCIu9nrnOqJ/\n\nПо четвергам я пишу о своем зависимом поведении, и сегодня отвечу на частые вопросы.\n⠀\n❓О какой зависимости идет речь?\n⠀\nРаньше я разделяла на «от чего ты зависим», но потом я поняла, что в основе лежит один и тот же механизм.\n⠀\nС 12 лет я начала курить и курила без перерывов до 20 лет\nС 12 лет я употребляла легкие наркотики (ТГК) с различной периодичностью + регулярный алкоголь\n16-19 лет - редкие эксперименты с химией, в основном все - натурально, но зато очень регулярно. Галлюциногены, курительные - это все было частью моей жизни и я просто не считала это наркотиками.\n⠀\nС 20 лет я периодически употребляла, в т.ч. и внутривенно, но самой главной моей проблемой были нарушения пищевого поведения, булимия - все эти эпизоды чередовались с долгим временем «чистоты».\n⠀\nЯ боролась, я пыталась оставаться трезвой, и все равно периодически возвращалась к эпизодам употребления. С 20 лет я в программе 12 шагов, и это помогало мне поддерживать самые продолжительные периоды абсолютной трезвости. Когда я начала более активную часть программы с «написанием шагов» - у меня стали уходить и другие проявления компульсива: с отношениями, с деньгами, с едой. Чтобы проработать все письменные задания, я ездила в 12 шаговый ребцентр. То есть у меня была задача не просто прекратить употреблять (это я уже умела), но отойти далеко от этой границы, где я срываюсь, как начать жить качественно и реализовывать весь свой потенциал.\n⠀\nПоследний «срыв» у меня был 8,5 лет назад. До этого я оставалсь чистой 2 года. До этого - еще год. То есть не смотря на срывы, у меня было 99,9% чистых дней в отличие от моего тинейджерства, где таких дней было по пальцам пересчитать.\n⠀\n❓Мешает ли то, что я рассказываю о своей зависимости?\n⠀\nЯ открыта, ведь мой опыт может быть полезен другим людям. Это моя жизнь, мой путь проб и ошибок, и я не хочу его стесняться. Принимать себя со своим опытом - это тоже результат многолетней работы.\n⠀\nМногие из нас не совершенны, но это не значит, что мы должы перестать стремиться к лучшей жизни для себя. Зависимость - это огромная сила, которую ты направляешь на саморазрушение, и эту силу можно направить в другое русло. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CCIu9nrnOqJ/\n\nПо четвергам я пишу о своем зависимом поведении, и сегодня отвечу на частые вопросы.\n⠀\n❓О какой зависимости идет речь?\n⠀\nРаньше я разделяла на «от чего ты зависим», но потом я поняла, что в основе лежит один и тот же механизм.\n⠀\nС 12 лет я начала курить и курила без перерывов до 20 лет\nС 12 лет я употребляла легкие наркотики (ТГК) с различной периодичнос", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-06-28.md", "source": "Instagram", "date": "2020-06-28", "filename": "2020-06-28", "title": "2020-06-28", "full_content": "https://www.instagram.com/p/CB-Eg6iHgkZ/\n\nДоброе утро, дорогие мои подписчики! Я благодарю вас за поддержку и за теплые слова, и приветствую всех, кто недавно ко мне присоединился. Давайте немного познакомимся, а в конце поста я расскажу, кто выиграл сертификаты на обучение в #sekta\n⠀\nМеня зовут Оля, мне в этом году будет 33 года. Я родилась в Екатеринбурге, после окончания университета переехала в Питер, а последний год живу между Питером и Москвой.\n⠀\nЧем я занимаюсь? Еще в школе мы с лучшим другом сделали музыкальную группу Alai Oli - в этом году ей 18 лет. Если вы хотите послушать нас - завтра вечером будет онлайн-концерт, на котором будет звук и картинка просто космос. Лучше, чем на наших записях.\n⠀\nЕще у меня есть #sekta - 10 лет назад я начала ее, как сообщество в ЖЖ. Я искала компанию, чтобы вместе тренироваться и правильно питаться, а потом выросло что выросло: сегодня это - школа, которой я горжусь. Не просто марафон для похудении, а настоящий образовательно-просветительский проект с тоннами бесплатной информации.\n⠀\nУ меня есть дети - три мальчика. У меня есть любимый мужчина, он классный и у него нет инстаграма, но я иногда выкладываю его фотографии))\n⠀\nВ своем аккаунте я посвящаю каждый день определенной теме: в понедельник я пишу о детях, во вторник делюсь полезным о том, как работать с телом и питанием. По средам я пишу о бизнесе, по четвергам - о работе с моим зависимым поведением - с психотерапевтом или по 12 шагам. По пятницам я пишу о своих отношениях с людьми и явлениями. Когда мне нечего рассказать - я молчу, потому что самое важное для меня здесь - это делиться тем, что может быть полезным людям.\n⠀\nНу и по традиции - расскажите, какая тема их всех вышеперечисленных ваша любимая. Или может быть нужен еще один специальный день, посвященный ремонту?)))\n⠀\nА наши счастливчики-победители на эту неделю:\n⠀\n🌟 @mazina_tatyana\n🌟@o_zhenja\n🌟@chikova_masha\n🌟 @vilisova_yli\n🌟 @greshulya\n🌟@irinkabuzina\n🌟@Alena056\n🌟@katyasvetlaya\n🌟 @svetka4885\n🌟 @thereisbrodskyinmyheart\n", "preview": "https://www.instagram.com/p/CB-Eg6iHgkZ/\n\nДоброе утро, дорогие мои подписчики! Я благодарю вас за поддержку и за теплые слова, и приветствую всех, кто недавно ко мне присоединился. Давайте немного познакомимся, а в конце поста я расскажу, кто выиграл сертификаты на обучение в #sekta\n⠀\nМеня зовут Оля, мне в этом году будет 33 года. Я родилась в Екатеринбурге, после окончания университета переехала", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-06-25.md", "source": "Instagram", "date": "2020-06-25", "filename": "2020-06-25", "title": "2020-06-25", "full_content": "https://www.instagram.com/p/CB3HbTuHZdM/\n\nПо четвергам я расказываю о своей работе с головой (с психотерапевтом, по «12 шагам» и т.д)\n⠀\nУ людей с зависимым поведением есть такое понятие: «я приболел»: обостряются чувствительность, из любой мухи вырастает слон, за любым поворотом поджидают неприятности, а каждый новый человек - потенциальный подлец и вообще опасность, а к себе - одни претензии.\n⠀\nКогда я в нормальном состоянии - любая проблема мне по плечу. Я вообще не думаю о том, что я не могу сейчас решить или исправить. Я не перебираю варианты «а если бы» и не грущу об утраченом. Когда я «приболела» - все в негативном свете, все плохо, все враги.\n⠀\nИ такие волны у меня всю жизнь, просто раньше, когда они наступали мне казалось, что все, это конец и мир всегда теперь будет мрачным.\n⠀\nНо потом к такому состоянию я научилась относиться, как к ОРВИ - то есть не стоит ждать от себя подвигов и делать вид, что все в порядке. Надо лечиться.\n⠀\nКак я лечусь:\n⠀\nРефлексирую (пишу обо всем, что чувствую), работаю в терапии и в 12 шагах. Я стараюсь больше слушать других людей и больше помогать. Рефлексия опустошает сосуд с темной водой, служение - наполняет его светом.\n⠀\nЯ даю себе время. Даже если все хорошо, я никому не обязана быть счастливой.  Даже себе. То же самое, как и в трудностях - я не обязана быть несчастной. И вот это «что ты паришься все же хорошо» надо гнать метлой, потому что человек - существо сложное, и наши чувства устроены невероятным образом и уж точно не поддаются нашему контролю: они с нами просто случаются.\n⠀\nГлавный инсайт: когда я вижу все в темных тонах, я не проецирую это на мир и себя, не говорю: я плохой, все плохо, все плохие. Я обращаю внимание на темное стеклышко, через которое я вижу мир, и я не просто жду, пока затмение закончится, я как могу приближаю этот момент.\n⠀\nЯ стараюсь жить с абсолютным знанием о том, что мир - невероятно светлый, просто моё стеклышко иногда надо протирать, если вдруг через него я вижу только серость и тьму. До тьмы уже давно не доходило, потому что действовать я начинаю, как только появляется серость.\n⠀\nДелитесь, как оно проходит у вас - само, или приходится как-то помогать?) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CB3HbTuHZdM/\n\nПо четвергам я расказываю о своей работе с головой (с психотерапевтом, по «12 шагам» и т.д)\n⠀\nУ людей с зависимым поведением есть такое понятие: «я приболел»: обостряются чувствительность, из любой мухи вырастает слон, за любым поворотом поджидают неприятности, а каждый новый человек - потенциальный подлец и вообще опасность, а к себе - одни претензии.\n⠀\nК", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-06-18.md", "source": "I
