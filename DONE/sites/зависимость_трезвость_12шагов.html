nstagram", "date": "2020-06-18", "filename": "2020-06-18", "title": "2020-06-18", "full_content": "https://www.instagram.com/p/CBkfKwUHEd2/\n\nПо четвергам я пишу о психотерапевтических открытиях и о том, как я работаю с зависимым поведением.\n⠀\nМеня спросили: а как переживать неудачи? Как перестать бояться, что ничего не получится?\n⠀\nКто вообще сказал, что все должно получаться? Еще в школе мы впитываем догму: хорошие оценки - это норма, а плохие оценки - это катастрофа и крест на жизни.\n⠀\nНет, нет, нет и еще раз нет. Жизнь полна неудач и начинаний, которые никто не оценит. Жизнь полна моделей самолетов, которые мы с любовью собираем в своих гаражах, и эти модели никогда не взлетят. И вот если один взлетит - это будет счастье и большая удача, а еще - результат упорного труда.\n⠀\nКогда я начинаю любое дело - я не делаю все ставки на то, что у меня получится. Любое начинание - это гипотеза, которую надо проверить. Когда мы создаем программы, нам кажется, что вот именно такая нужна людям, но потом оказывается - нет, такая программа не зашла. Или мы не правильно о ней рассказали. Или дизайн не тот. Или цена.  Да все что угодно - скорее всего, мы никогда не узнаем, почему у нас не получилось. Но у меня уже есть новые идеи, и я готова пробовать их. Я не думаю о разбившихся моделях, меня вдохновляет те, которые взлетали и будут взлетать в будущем.\n⠀\nМои неудачи говорят не о том, что я неудачник, а о том, что я пробовала. Чем больше было неудач - тем больше попыток, больше опыта.\n⠀\nЭта часть - она философская. Есть еще часть про чувства. Конечно, мне больно в моменте и я сильно расстраиваюсь, хочу рвать на себе волосы и кричать на людей. 12 шагов и психотерапия научили меня анализировать ситуацию и свои чувства: я нахожу свою ответственность и думаю, что я могу изменить. Я нахожу часть ситуации, которую мне надо просто принять и прожить вместе с неприятными чувствами. Я ныряю в свои сложные чувства, чтобы выпить их до дна. Я знаю, о чем они - если самолет не взлетел, надо разрешить себе погоревать об этом. Невозможно искренне верить в свое дело и потом не горевать в такие моменты. Важно знать, что эти чувства - они нормальны. Это - обратная сторона любви и надежды, которую мы вкладываем в то, что мы делаем. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CBkfKwUHEd2/\n\nПо четвергам я пишу о психотерапевтических открытиях и о том, как я работаю с зависимым поведением.\n⠀\nМеня спросили: а как переживать неудачи? Как перестать бояться, что ничего не получится?\n⠀\nКто вообще сказал, что все должно получаться? Еще в школе мы впитываем догму: хорошие оценки - это норма, а плохие оценки - это катастрофа и крест на жизни.\n⠀\nНет, н", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-05-28.md", "source": "Instagram", "date": "2020-05-28", "filename": "2020-05-28", "title": "2020-05-28", "full_content": "https://www.instagram.com/p/CAvdpwcn10M/\n\nНельзя так сказать: «зависимые испытывают более сильные чувства, и поэтому не могут с ними справиться». Никто не измеряет уровень чувств, нет такого градусника, чтобы измерить и сравнить нас всех.\n⠀\nЧто можно сказать более уверенно: зависимые люди видят проблемы под увеличительным стеклом, причем часто выбирая из всех проблем в своей жизни совершенно рандомную. Например, у меня было так: все в жизни было максимально нестабильно, я не знала, куда себя деть, но вся моя ненависть при этом была направлена на мое тело. Мне казалось, что если я изменю тело - я изменю всё. Всю боль и потерянность я выплескивала в эту сферу своей жизни.\n⠀\nЗависимые люди делают из мухи слона, и часто слон этот занимает все пространство перед глазами. Невозможно даже разглядеть все остальное в своей жизни, все, за что можно быть благодарным, чему можно радоваться. Зависимый человек всегда найдет повод, чтобы побыть несчастным. И не сказать, что это личный выбор - страдать. Никто не хочет страдать, просто не все знают, как именно от этого страдания вылечиться.\n⠀\nВ 12 шагах часто всплывают задания про благодарность. Писать благодарности за день, благодарности высшей силе за какие-то хорошие вещи - это приходится тренировать, как любую привычку. Невозможно стать счастливым и благодарным по щелчку пальцев, это - работа.\n⠀\nКогда у меня есть проблемы на работе, я часто теряю стабильность и снова скатываюсь в тоннельное мышление - вижу только проблему, и ничего кроме.\n⠀\n- Что я могу изменить? - Ты можешь перестать на это реагировать.\n⠀\nПроблема в том, что я не могу перестать реагировать - ведь overreaction - это моя суть. Во всяком случае, это - 30 лет моей жизни поведения в определенном паттерне, и если изменения будут, то явно не сегодня и не завтра. Самое сложное в работе с зависимым поведением - это отделить вещи, поддающиеся контролю от тех, которые являются исходным кодом моего характера. Об попытки изменить себя в этих местах можно сильно поломаться.\n⠀\n(Продолжение в комментах) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CAvdpwcn10M/\n\nНельзя так сказать: «зависимые испытывают более сильные чувства, и поэтому не могут с ними справиться». Никто не измеряет уровень чувств, нет такого градусника, чтобы измерить и сравнить нас всех.\n⠀\nЧто можно сказать более уверенно: зависимые люди видят проблемы под увеличительным стеклом, причем часто выбирая из всех проблем в своей жизни совершенно ранд", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-04-09.md", "source": "Instagram", "date": "2020-04-09", "filename": "2020-04-09", "title": "2020-04-09", "full_content": "https://www.instagram.com/p/B-w1tc8Hiy3/\n\n«Чистый» четверг. По четвергам я пишу о «12 шагах» - это письменная работа, которую делают люди, у которых есть разные зависимости или сложные состояния. Я уже 7 лет пишу шаги, и это очень важная часть моей жизни.\n⠀\nСейчас я начала десятый шаг. Он звучит так: “Мы продолжали самоанализ и когда допускали ошибки, сразу признавали это”\n⠀\nЗа все время глубоких самокопаний я поняла, что самую большую боль я испытываю тогда, когда мои действия расходятся с моим же внутренним компасом. То есть все это началось с простого определения этого когнитивного диссонанса: я употребляю алкоголь/наркотики, и мне это мне не нравится, но я не могу остановиться.\n⠀\nКазалось, что ничего не употреблять - этого достаточно, но потом я поняла, что проблема в целом лежит в моем компульсивном поведении, когда я испытываю обиду, страх, боль, я часто начинаю творить то, за что мне потом бывает стыдно. Я могу рубить с плеча, расставаться с людьми, обрубать связи. Мне иногда проще перестать общаться с человеком, притвориться, что его не существует, только чтобы не встречаться со своими чувствами.\n⠀\nКогда я не права - я часто начинаю убеждать себя в обратном, я не умею отлавливать эти расхождения с внутренним компасом на первых этапах, и мне постоянно приходится возвращаться к себе к вопросом:\n⠀\n- Как на самом деле ты хочешь поступить?\n⠀\nИногда я отвечаю себе так:\n⠀\n- Мне просто хочется извиниться. Мне просто хочется сказать, что не смотря на конфликт интересов, мне важны эти отношения.\n⠀\nИногда я думаю:\n⠀\n- На самом деле я не хочу общаться с этим человеком, я продолжаю это делать, потому что мне страшно, что он разозлится/обидится.\n⠀\nКогда я начинаю отслеживать свои истинные состояния, следующая часть - это начать поступать так, как считаешь нужным. Классно, что ты работаешь с этим в своем темпе, и начинаешь поступать по-другому именно тогда, когда ты реально готов.\n⠀\nЖить в соответствии с собственным компасом - это огромное облегчение. Вот о чем я хотела поговорить с вами сегодня 🙂 #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/B-w1tc8Hiy3/\n\n«Чистый» четверг. По четвергам я пишу о «12 шагах» - это письменная работа, которую делают люди, у которых есть разные зависимости или сложные состояния. Я уже 7 лет пишу шаги, и это очень важная часть моей жизни.\n⠀\nСейчас я начала десятый шаг. Он звучит так: “Мы продолжали самоанализ и когда допускали ошибки, сразу признавали это”\n⠀\nЗа все время глубоких ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-03-26.md", "source": "Instagram", "date": "2020-03-26", "filename": "2020-03-26", "title": "2020-03-26", "full_content": "https://www.instagram.com/p/B-MMY3-HKsw/\n\nПо четвергам я пишу о 12 шагах, терапии и внутренних метаниях.\n⠀\n«Дай мне разум и душевный покой принять то, что я не в силах изменить, мужество, изменить то, что могу и мудрость отделить одно от другого» - такой молитвой на разных языках молятся люди разных религий, пришедшие на собрания групп взаимоподдержки.\n⠀\nДве вещи, которые чаще всего пугают и отталкивают в 12 шаговой программе - это Бог и Бессилие. Но по сути дела ты можешь быть очень сильным и волевым неверующим человеком и так же эффективно использовать все инструменты программы, правильно определив для себя эти концепции.\n⠀\nРасскажу на примере: завтра я должна была лететь в Сочи. Мне очень хотелось поехать на каталку, ухватить последний снег в горах. Я читала миллион статей о том, что надо сидеть дома, сократить контакты и не путешествовать. И у меня внутри постоянно шли торги: но ведь я соблюдаю правила предосторожности, но ведь эпид.ситуация не такая серьезная и т.д. Все внутри меня искало аргументы «чтобы полететь». И так я вспомнила, что при общении действующие наркоманы делают так же: ищут 10 причин, почему именно им не нужно прекращать употребление наркотиков.\nЗавс-мость - это болезнь эгоизма. И я бессильна перед своим эгоизмом. Я не могу взять и стать сверх-эмпатичным активистом, который упорнее всех сортирует мусор, первым садится на карантин и первым выступает по всем важным вопросам. У меня чаще всего нет вообще никакого мнения о том, что не касается меня конкретно. Мне понадобилось время, чтобы понять, что это - не меняется, и в глубине души я себя за это ненавижу.\n⠀\nВ тот момент, когда я понимаю свой компульсивный порыв думать только о себе, я обращаюсь к чему-то высшему. Я могу использовать обращение к Богу, но покажу вам как это работает без него. Я прошу:\n⠀\n«Пусть во мне созреет или на меня свалится готовность, решимость поступить так, как я бы поступила, если бы я не была таким эгоистичным человеком. Пусть в моей голове хорошие намерения победят эгоистичные».\n(продолжение во 2 фото)\n", "preview": "https://www.instagram.com/p/B-MMY3-HKsw/\n\nПо четвергам я пишу о 12 шагах, терапии и внутренних метаниях.\n⠀\n«Дай мне разум и душевный покой принять то, что я не в силах изменить, мужество, изменить то, что могу и мудрость отделить одно от другого» - такой молитвой на разных языках молятся люди разных религий, пришедшие на собрания групп взаимоподдержки.\n⠀\nДве вещи, которые чаще всего пугают и оттал", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-03-19.md", "source": "Instagram", "date": "2020-03-19", "filename": "2020-03-19", "title": "2020-03-19", "full_content": "https://www.instagram.com/p/B96soJfne12/\n\nЧетверг - день, когда я рассказываю о зависимости и о том, как с ней жить 😄\n⠀\nСобрания разных групп часто показывают в кино, обычно это - просторные комнаты или залы. Однажды во Франции я была на группе в очень красивом соборе. В России помещения у большинства групп неказистые, маленькие и мрачные. Группы живут на добровольные пожертвования членов, денег у них не много, и они снимают комнаты у различных социальных центров помощи гражданам.\n⠀\nГруппы ведут волонтеры. Обычно те, кто сами ходят в это помещение/на это время. Пока я жила в Питере, я вела свою «домашнюю» группу по вторникам. Брала ключ, открывала помещение за 10 минут до собрания. В назначенное время я начинала читать приветственный текст. Во всех сообществах есть некая «преамбула» - она читается перед каждым собранием в одном и том же виде. Там содержится информация о сообществе, о 12 шагах, кто и зачем собирается. Группа состоится, если придет еще хотя бы один человек. Если нет - я посижу час, подожду, потому что вдруг где-то идет новичок, которому это собрание очень нужно.\n⠀\nОднажды мы в Риге приехали на такую группу. Мы с моим другом были единственными гостями, кроме нас был только ведущий и девушка, они просто сидели и ждали. Они были нам очень рады, и для нас провели собрание на русском. Я стараюсь посещать собрания в разных странах, даже если не знаю языка. Во всех странах люди с похожими проблемами - похожи.\n⠀\nПосле преамбулы читается ежедневник, его я часто выкладываю в сториз. Там - размышления на разные темы, всего - 365, на каждый день. Там всегда есть о чем задуматься.\n⠀\nПосле ежедневника ведущий разрешает высказываться. И вот в течение 2-3-5-7 минут (зависит от количества людей) каждый говорит о своем радостном или наболевшем. Можно задать тему, чтобы другие делились опытом. Можно не говорить ничего, а только слушать. Если на собрании новичок - есть тема «Для новичка», и все рассказывают о том, как они сюда попали и что им это дало. Никто не комментирует высказывания других и не дает советов. Важно говорить о себе и своем опыте. Градус откровенности ты задаешь сам. (Продолжение в фото) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/B96soJfne12/\n\nЧетверг - день, когда я рассказываю о зависимости и о том, как с ней жить 😄\n⠀\nСобрания разных групп часто показывают в кино, обычно это - просторные комнаты или залы. Однажды во Франции я была на группе в очень красивом соборе. В России помещения у большинства групп неказистые, маленькие и мрачные. Группы живут на добровольные пожертвования членов, денег у", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-03-12.md", "source": "Instagram", "date": "2020-03-12", "filename": "2020-03-12", "title": "2020-03-12", "full_content": "https://www.instagram.com/p/B9oVs10HX8I/\n\nЧетверг, а значит - рассказываю вам о 12 шагах. Если вы пропустили начало и не понимаете что это такое - тег в конце поста, там моя история.\n⠀\nПервые 3 шага моей письменной работы - это выписывание примеров из жизни, где я очень хотела справится сама, но не смогла. Это - убирает тревогу, о которой я писала вчера. Не все зависит от меня, многое случается вопреки моей воле, я очень хотела быть идеальным человеком, не делать ничего плохого, не думать ничего плохого, но моей воли не достаточно. Ты пишешь и пишешь, на собственных примерах убеждаясь, что это так, и что на твою жизнь влияет множество других обстоятельств.\n⠀\nА вот четвертый шаг - это уже совсем другая работа, здесь ты как будто подходишь к зеркалу и долго и внимательно на себя смотришь. В 4м шаге есть разделы: обиды, страхи, вина, стыд. Сам шаг звучит так «мы глубоко и бесстрашно исследовали себя с нравственной точки зрения». Собственно, вся эта работа направлена на то, чтобы узнать себя достаточно глубоко, и это не всегда радостный процесс, но зато приходит понимание всех твоих реакций.\n⠀\nЯ писала раздел «Обиды» четыре года. От детских обид (у меня очень хорошая память), до обид на комментарии в инстаграме, на каждый отзыв о концерте или о курсе #sekta. До работы над обидами я не понимала, что я живу, как будто у меня нет кожи - меня так глубоко ранит всякая фигня, и чтобы унять эту боль, я делаю еще большую фигню, вместо того, чтобы как-то по другому переживать это. Я очень хотела всем нравиться, мне было важно иметь хорошие отношения со всеми, делать очень хорошее дело, вкладываясь максимально. Можно просто сказать себе: «Запомни, ты не 100$, чтобы всем нравится», но как действительно стать тем человеком, который не реагирует на то, что его кто-то не любит и не принимает?\n⠀\n(Продолжение в фото) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/B9oVs10HX8I/\n\nЧетверг, а значит - рассказываю вам о 12 шагах. Если вы пропустили начало и не понимаете что это такое - тег в конце поста, там моя история.\n⠀\nПервые 3 шага моей письменной работы - это выписывание примеров из жизни, где я очень хотела справится сама, но не смогла. Это - убирает тревогу, о которой я писала вчера. Не все зависит от меня, многое случается во", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-03-07.md", "source": "Instagram", "date": "2020-03-07", "filename": "2020-03-07", "title": "2020-03-07", "full_content": "https://www.instagram.com/p/B9bhe2Xntq_/\n\nВосемь лет назад в моей жизни все начало рушиться. Была уже секта в жж, была йога, много концертов, много друзей, и казалось, что все должно получаться, но во мне что-то сломалось. Сначала случились очень болезненные отношения, потом я сорвалась после двух лет трезвости.\n⠀\nТогда я приняла решение уехать в реб.центр, чтобы проработать причины срыва. Из таких центров люди обычно выходят, как будто никогда не жили раньше - приходится обрастать новой кожей, учиться взаимодействовать с миром, сохраняя свет, который ты нашел в себе.\n⠀\nТак и я. Мне хотелось оставаться среде, где люди не употребляют, говорят о своих чувствах честно. Там я особенно яростно писала терапевтические задания, раскапывая свои истинные желания, секреты, страхи - оказалось, что я так много себе не разрешаю, стремясь быть хорошей и никому не вредить, что практически не живу.\n⠀\nОткуда берется целостность? Во-первых от глубокого знания себя: мотивов, паттернов, реакций. Во-вторых от знания, что с этим делать, как проживать сложные чувства.\n⠀\nДо того периода я была уверена: я против брака, потому что у меня он вряд ли будет навсегда. Я не хочу детей, потому что я не смогу посвятить им свою жизнь, и много всего такого.. Я не ошибалась в своем характере: мне действительно сложно сохранить одни отношения на долгой дистанции. Я быстро живу, и люди не успевают за мной. Я действительно не смогла посвятить себя детям, но я и представить не могла, как гармонично смогут переплестись в моей жизни музыка, секта, семья - всё, что я люблю. Я думала: раз я не совершенный человек - мне нельзя ничего начинать. Но оказалось, что можно начинать, и можно заканчивать. Если что-то не получается идеально - это тоже нормально, это не повод лечь и умереть.\n⠀\nТогда все сильно изменилось: я вышла замуж, я узнала, что у меня будет ребенок, я сменила свою основную деятельность - вместо музыки, которая была моей работой, я решила больше заниматься #sekta, которая была моим хобби. И вот так, уже на 7ом месяце беременности ровно 7 лет назад, таким же холодным мартом, я готовилась к открытию первой настоящей группы Школы #SEKTA.\n⠀\nК чему это я?) К тому, что иногда нам кажется: это конец. Но на самом деле это - только начало.\n", "preview": "https://www.instagram.com/p/B9bhe2Xntq_/\n\nВосемь лет назад в моей жизни все начало рушиться. Была уже секта в жж, была йога, много концертов, много друзей, и казалось, что все должно получаться, но во мне что-то сломалось. Сначала случились очень болезненные отношения, потом я сорвалась после двух лет трезвости.\n⠀\nТогда я приняла решение уехать в реб.центр, чтобы проработать причины срыва. Из таки", "annotation": "Рассказ о срыве и возвращении к употреблению после периода трезвости."}, {"path": "data/ig_organized/long_200_md/2020-03-05.md", "source": "Instagram", "date": "2020-03-05", "filename": "2020-03-05", "title": "2020-03-05", "full_content": "https://www.instagram.com/p/B9WzTZgnta2/\n\nО самой зависимости я писала, это - более-менее понятно всем. Но вот что такое эти загадочные «12 шагов» и почему там все так сложно? Я почитала ваши ответы в сториз, и меня очень тронул один вариант: «Это - поэтапное познание 1. Себя 2. Зависимости и понимание совместимости 1 и 2».\n⠀\nТехнически «шаги» - это список вопросов по темам, по которым зависимый описывает разные ситуации из жизни, свои чувства. Мы говорим: «Я пишу шаг» - это значит что я сижу и пишу примеры из своей жизни, отвечая на вопросы из «Руководства к работе по шагам» - его, кстати, можно найти в интернете и посмотреть, какие там вопросы. Самому начать сложно, потому что ты не всегда понимаешь, правильно ли ты понял вопрос, или достаточно честно ли ты ответил. Поэтому зависимые ищут себе помощника - в программе это называется «спонсор», им может стать для тебя любой зависимый, который продвинулся в написании шагов чуть дальше, чем ты. У меня есть и спонсор (наставница) и подспонсорные (те, для кого наставник - я), периодически мы встречаемся, чтобы прочитать или послушать ответы на эти вопросы - почему-то работает не только процесс написания, но и процесс чтения - даже если твой наставник ничего не говорит (он может сказать просто «Ок! Идем дальше»). - ты чувствуешь, что проработал ту тему, на которую ты писал.\n⠀\nКаждый из шагов имеет свое описание. Шаг 1, например, это: «Мы признали свое бессилие». Многих отпугивает этот странный конструкт, потому что бессилие - это некомфортно)) Но представьте, что смысл этого шага такой: «Кажется, есть проблема, которую я не могу решить сам, применив свою волю». Такой бывает безответная любовь - когда мы хотели бы не думать о человеке, но никак не получается перестать. И алкоголь, и наркотики, и переедание, азартные игры, долги, отношения - все это может стать такой проблемой, поэтому по 12 шагам работают со многими проблемами. В первом шаге мы описываем те ситуации, которые навели нас на мысль о том, что мы не можем решить свою проблему самостоятельно. (продолжение в фото) #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/B9WzTZgnta2/\n\nО самой зависимости я писала, это - более-менее понятно всем. Но вот что такое эти загадочные «12 шагов» и почему там все так сложно? Я почитала ваши ответы в сториз, и меня очень тронул один вариант: «Это - поэтапное познание 1. Себя 2. Зависимости и понимание совместимости 1 и 2».\n⠀\nТехнически «шаги» - это список вопросов по темам, по которым зависимый о", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-02-22.md", "source": "Instagram", "date": "2020-02-22", "filename": "2020-02-22", "title": "2020-02-22", "full_content": "https://www.instagram.com/p/B83cEB9Hirl/\n\nМНЕ НУЖНО СТРУКТУРИРОВАТЬ СВОЙ ХАОС\n⠀\nЯ долго определялась с самим отношением к этой странице, и в какой-то момент я поняла что это - моё маленькое СМИ. Мое первое высшее - это журналистика, я всегда любила писать, и любила, когда мои тексты находили отклик. Я не могу писать о чём-то одном, потому что мне интересно слишком много: и спорт, и дети, и бизнес, и творчество. У меня много рефлексии, интересных размышлений на самые разные темы - что я могу сделать, чтобы этот хаотичный поток обрел правильный ритм?\n⠀\nЯ выделила темы, на которые мне всегда есть, что сказать. Те, в которых есть интересные находки, наблюдения. Те, которые всегда можно зарисовать в моменте - как период взросления детей, отношения, или путь в программе 12 шагов. Теперь, когда я знаю, на какую тему я буду писать в определенный день, мне интереснее садиться за текст. Структура не ограничила поток, а направила его в нужное русло. Так же было с системой планирования Bullet Journal - я упорядочила хаос расписания и стала успевать больше, и правильнее расставлять приоритеты.\n⠀\nЧто я поняла за эту неделю: мне не так важен прирост подписчиков и шэры/сэйвы, как качественная обратная связь и жизнь в моем аккаунте в целом. По комментариям людей можно понять, что текст попал в цель и вызвал чувства - они пишут не потому, что я попросила, а потому что текст реально крутой - и вот это прет. А когда пытаешься искусственно создать активность, в инсту потом заходить не хочется. «Выберите фотку: 1 или 2?» - меня так надолго не хватит. Когда я говорю, что хочу роста и развития - я говорю именно о качественном росте. В основе качественного роста должно лежать моё развитие, мой труд, мой вклад. И сейчас я буду писать сюда то, что я действительно считаю важным. И я буду стараться писать так, чтобы читателям было интересно. А на результат мы посмотрим вместе.\n", "preview": "https://www.instagram.com/p/B83cEB9Hirl/\n\nМНЕ НУЖНО СТРУКТУРИРОВАТЬ СВОЙ ХАОС\n⠀\nЯ долго определялась с самим отношением к этой странице, и в какой-то момент я поняла что это - моё маленькое СМИ. Мое первое высшее - это журналистика, я всегда любила писать, и любила, когда мои тексты находили отклик. Я не могу писать о чём-то одном, потому что мне интересно слишком много: и спорт, и дети, и бизнес,", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-02-20.md", "source": "Instagram", "date": "2020-02-20", "filename": "2020-02-20", "title": "2020-02-20", "full_content": "https://www.instagram.com/p/B8yxGaMH0fS/\n\nВ четверг я буду писать о зависимости и о 12 шагах. Это - первый пост, и это письмо мне в прошлое. То, что мне так важно было услышать в 2007 году.\n⠀\nЗависимость - это следствие. Причина в твоей природе: когда чувства и реакции на мир настолько сильны, что тебя вышибает из тела. Ты думаешь, что так живут все люди, что все чувствуют одинаковый диапазон, просто ты - слабее, обидчивее, принимаешь все слишком близко к сердцу. Но потом ты находишь вещи, как анестезию - еда, компьютерные игры, сигареты, алкоголь - что угодно, чтобы прожить день, еще один день - и вроде все люди делают все эти вещи, только у тебя есть отличие: ты не можешь остановиться, даже когда ты хочешь, и тебе всегда мало.\n⠀\nЕсли ты когда-нибудь поймешь, что ты хочешь остановиться, но не можешь - тебе придется признать свою зависимость и заниматься ей. Научиться жить с ней, как люди живут с сахарным диабетом или с ВИЧ. Если зависимостью не заниматься - она разрушает всё.\n⠀\nЯ признала свою зависимость в 20 лет. Дело было не в том, что я курила, употребляла наркотики, алкоголь, компульсивно переедала и ненавидела свое тело - все это было следствием моего неумения справляться с чувствами. Внутри меня постоянно был черный ком страха, тревоги и обид. Страх перед будущим - быть одной, быть нелюбимой, ненужной, нереализованной. Тревога от того, что я все делаю неправильно, принимаю неправильные решения, делаю не те поступки. Обиды - что люди и мир вокруг несправедливы ко мне. Но я не могла даже различить эти чувства - это все было одной сплошной сосущей дырой, которую я пыталась заполнить всем, что попадало под руку.\n⠀\nОт сильных чувств рождались песни, но было совершенно невозможно жить. В какой-то момент я поняла, что все мои действия направлены на саморазрушение: я пытаюсь спасти других и сделать хорошо им, но я не хочу делать хорошо себе. В тот момент я совсем запуталась, и когда я решила разобраться в себе и найти ответы - мне вовремя попался зависимый человек, который сказал: «Дело не в алкоголе и в наркотиках. Но тебе придется прекратить их употреблять, чтобы твоя жизнь изменилась к лучшему. Тебе придется признать что ты бессильна - и тогда все изменится». #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/B8yxGaMH0fS/\n\nВ четверг я буду писать о зависимости и о 12 шагах. Это - первый пост, и это письмо мне в прошлое. То, что мне так важно было услышать в 2007 году.\n⠀\nЗависимость - это следствие. Причина в твоей природе: когда чувства и реакции на мир настолько сильны, что тебя вышибает из тела. Ты думаешь, что так живут все люди, что все чувствуют одинаковый диапазон, про", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-02-17__2.md", "source": "Instagram", "date": "2020-02-17", "filename": "2020-02-17__2", "title": "2", "full_content": "https://www.instagram.com/p/B8q5PKZHThO/\n\nНа один месяц я хочу попробовать новый стиль ведения инсты. С четким расписанием, чтобы определенному дню была посвящена определённая тема.\n⠀\nОдин день я буду писать о детях\nВторой - о работе, бизнес-процессах, о секте с позиции фаундера, третий - о музыке и о Alai Oli\n⠀\nДля других дней у меня есть такие идеи:\n⠀\nО спорте/упражнение недели для какой-нибудь зоны/\n⠀\nОб отношениях / в семье, с другими людьми\n⠀\nО зависимости/12 шагах\n⠀\nО питании/ научном подходе/ личном опыте или личной практике\n⠀\nИ обязательно один свободный день) Если захочется просто делиться фото - это будет идти вторым постом в день. Может буду писать про ремонт 😅\n⠀\nВы, как читатели, можете поучаствовать в честном референдуме 😄 Надо выбрать 6 тем из вышепредложенных в порядке убывания вашего интереса и написать здесь в комментариях! Среди всех, потративших на это дело время, разыграю неделю любого курса @sektaschool 🤞 @lizaonair\n", "preview": "https://www.instagram.com/p/B8q5PKZHThO/\n\nНа один месяц я хочу попробовать новый стиль ведения инсты. С четким расписанием, чтобы определенному дню была посвящена определённая тема.\n⠀\nОдин день я буду писать о детях\nВторой - о работе, бизнес-процессах, о секте с позиции фаундера, третий - о музыке и о Alai Oli\n⠀\nДля других дней у меня есть такие идеи:\n⠀\nО спорте/упражнение недели для какой-нибудь ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2020-01-17.md", "source": "Instagram", "date": "2020-01-17", "filename": "2020-01-17", "title": "2020-01-17", "full_content": "https://www.instagram.com/p/B7aVRUMHONQ/\n\nВторая часть знакомства - это про мою личную жизнь, раз уж 85% по итогу опроса интересна эта тема. Зажмуриваюсь и публикую.\n⠀\nВ 2012 году я вышла замуж за своего друга - Андрея Доронина, мы оба раньше употребляли наркотики, но никогда не делали это вместе. Нас связало выздоровление от наркомании, у зависимых людей очень много общего, и это очень объединяет. Мы были очень близки, у нас родилось два мальчика - Ежи и Мирон. В брак я вступала уже с готовностью стать мамой, все происходило очень вовремя и органично. Когда я была беременна Ежи, мы жили в съемной комнате и спали на матрасе. Потом Андрей еще раз лег в реабилитационный центр, а я отредактировала его письма и мы издали первую его книгу: Transsiberian back 2 black. Она стала хитом, ее издали в других странах, он стал лауреатом различных премий, ему даже дали вид на жительство во Франции за культурные заслуги. Короче, я им горжусь.\n⠀\nПочему мы развелись? Наши таргетологи ржут, что «Оля Маркес развод» - это самый популярный поисковой запрос. Мне казалось, что это навсегда. Я решила, что это навсегда, и я пыталась сделать все, чтобы так и было. Нам правда было хорошо вместе, не смотря на то, что мы очень разные -  у нас разный характер, разная история, разные увлечения, интересы, я старалась все сглаживать, все амортизировать и все принимать. Раз уж решила - нельзя нарушать обещание.\n⠀\nА потом я поняла, что я живу в какой-то параллельной реальности, как будто моя жизнь стоит на паузе, как будто я уже жду смерти, при этом я продолжала себя убеждать, что все у меня в порядке в личной жизни, просто дело в моей внутренней пустоте. Потом я влюбилась, причем так по-глупому, без всяких перспектив. (Продолжение в фото)\n", "preview": "https://www.instagram.com/p/B7aVRUMHONQ/\n\nВторая часть знакомства - это про мою личную жизнь, раз уж 85% по итогу опроса интересна эта тема. Зажмуриваюсь и публикую.\n⠀\nВ 2012 году я вышла замуж за своего друга - Андрея Доронина, мы оба раньше употребляли наркотики, но никогда не делали это вместе. Нас связало выздоровление от наркомании, у зависимых людей очень много общего, и это очень объединяет", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/vi_vse_nepr_export/posts_md/2019-12-03__43__нас_анонимных_наркоманах_система_наставничества_наставник_нас.md", "source": "Vi Vse Nepr", "date": "2019-12-03", "filename": "2019-12-03__43__нас_анонимных_наркоманах_система_наставничества_наставник_нас", "title": "43 нас анонимных наркоманах система наставничества наставник нас", "full_content": "# 2019-12-03 — нас анонимных наркоманах система наставничества наставник нас\n*Datetime*: 2019-12-03T04:27:24+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 43\n\nУ нас в анонимных наркоманах есть система наставничества. Наставник у нас называется «спонсор», ну и соответственно есть «подспонсорные». Нет одного стиля ведения человека по шагам, есть совершенно разные подходы. Кто-то любит держать подспонсорных в жесткой дисциплине, типа - звони раз в неделю, или я тебя не веду. Кто-то может указывать, что делать, а что не делать.  У меня и со спонсором, и с моими подопечными - полная свобода. Каждый несет ответственность за свою жизнь, я переживаю, если мои мне долго не звонять, моя спонсор переживает, когда не звоню я.\n\nЯ долго не звонила, потому что в шаге у меня ступор. И мне надо как-то себя пересилить, перевернуть все смыслы и найти выход из этой комнаты: нужны еще люди, которым я нанесла ущерб. Какой это ущерб? В чем? Все ситуации, которые пришли на ум, я написала.  Но это слишком мало, этого не хватает.\n\nПроблема в том, что я терпила. Даже в ситуации с астрологом, знаете что я думаю? А вдруг она читает как меня защищают и ей плохо от этого? Вдруг она с хорошими помыслами? Вот я бы могла потерпеть и промолчать. Я ведь привыкла амортизировать и вывозить все своим ресурсом, поэтому обычно я говорю себе сама: нихуя тебе не тяжело, раз справляешься.\n\nКонечно, иногда моему терпению приходит конец, и вот когда я посылаю человека подальше, я начинаю умирать от чувства вины. И это такое дискомфортное чувство, что терпеть, пожалуй, даже приятнее. Я привыкла терпеть, и каждый раз в Екб меня макает в мое детство, и я вспоминаю, откуда растут ноги.\n\nОбычно я просто рассказываю спонсору: у меня так и так, вот так я это проживаю. И первый раз за четыре года было не так. Я позвонила, чтобы жаловаться. Я жаловалась и жаловалась. Я взяла и вывалила все, с чем не могла справиться. И мне так полегчало, вы даже не представляете. Вроде такая очевидная вещь - но для меня она совсем не стандартная. Обычно я как будто немного над ситуацией. Есть у меня ощущение: ну ведь я живу? А это значит, я справляюсь.\n\nКогда я разводилась, я просто сказала: я развожусь. Когда у нас были конфликты я говорила: мне тяжело, мне страшно, это пиздец, но в целом я в порядке. Обычно у меня нет сомнений в том, что я делаю, и у меня почти всегда есть решение.\n\nМоя главная проблема - мне может не хватать сил, я постоянно выпадаю из ресурса, но не могу отменить свои дела и расписание, я ненавижу подводить людей, а себя мне вообще не жалко.\n\nТак можно пробежать марафон, или отъездить тур с младенцем и дырой с палец в челюсти. И в целом сделать это так, что никто и думать не будет о том, что тебе сложно. Мне пиздец, но я ебашу. И в целом я не падаю в эмоциональную яму. То есть даже когда мне пиздец, я в общем-то бодрячком. Я знаю людей в депрессии, я умею сравнивать, так вот я прежде всего вывожу все это эмоционально, а потом уже - все остальное.\n\nДа, люди видят во мне сверхчеловека, но не видят механизмы внутри меня, которые толкают по зеленому полю этот ходячий замок. А механизмы эти не то что бы здоровые.\n\nВ Екб я думала - как мне удалось выжить? Я помню это ощущение, когда хочется щипать себя и царапать, чтобы отвлечь от душевной боли. Или повторять «сдохнутьсдохнутьсдохнуть» миллион раз подряд.\n\nВзрослые научили меня терпеть. Наверное во многом так. Рецепт успеха в том, чтобы стереть свои границы и личность и ни на что никогда не претендовать. Рецепт счастья в том, чтобы никогда не забывать о том, какое ты ничтожество - ты просто уверен, что счастье невозможно заработать такому человеку, как ты. Но его можно взрастить в себе и передать другим, потому что даже капля для тебя - это много. Если повезет, можешь стать настоящим монахом, если тебя, конечно, не сломает. Меня просто не сломало.\n\n«И больше всего я ненавижу утро, когда ты не принадлежишь себе, но в середине уже не так трудно» - пела я в Уфе «Бесконечное Го», и эти строчки о моем детстве.\n\nМне казалось, что если я пережила это, я смогу пережить все. Чтобы быть счастливым человеком, мне пришлось не только научится видеть свет, когда я закрываю глаза, сидя внутри своего тела, как в одиночной камере. Видеть Бога там, где нет ничего кроме боли.\n\nReactions: 🕊3 👍2\n", "preview": "# 2019-12-03 — нас анонимных наркоманах система наставничества наставник нас\n*Datetime*: 2019-12-03T04:27:24+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 43\n\nУ нас в анонимных наркоманах есть система наставничества. Наставник у нас называется «спонсор», ну и соответственно есть «подспонсорные». Нет одного стиля ведения человека по шагам, есть совершенно разные подходы. Кто-то любит держат", "annotation": "Размышления об участии в программе АА/НА и сообществе."}, {"path": "data/ig_organized/long_200_md/2019-11-07.md", "source": "Instagram", "date": "2019-11-07", "filename": "2019-11-07", "title": "2019-11-07", "full_content": "https://www.instagram.com/p/B4j-bMtH0Rh/\n\nОткровенно поговорили с @larsentut о вере. Тутта - один из лучших интервьюеров в моей жизни. Она была так подготовлена, так тактична, рядом с таким человеком раскрываешься, делаешь это с удовольствием и без страха. Я рассказала о 12 шагах, о том, как я постепенно осознавала свою зависимость и училась с ней жить. Разговор получился очень классный. Ссылка будет в сториз!\n", "preview": "https://www.instagram.com/p/B4j-bMtH0Rh/\n\nОткровенно поговорили с @larsentut о вере. Тутта - один из лучших интервьюеров в моей жизни. Она была так подготовлена, так тактична, рядом с таким человеком раскрываешься, делаешь это с удовольствием и без страха. Я рассказала о 12 шагах, о том, как я постепенно осознавала свою зависимость и училась с ней жить. Разговор получился очень классный. Ссылка бу", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2019-09-18.md", "source": "Instagram", "date": "2019-09-18", "filename": "2019-09-18", "title": "2019-09-18", "full_content": "https://www.instagram.com/p/B2jaCsbHRzw/\n\nСегодня читаю лекцию в одной корпорации, сложно это назвать именно лекцией - скорее, это встреча с разговором о главном. Мне очень понравился такой формат, делиться своим жизненным опытом и тем, что я считаю важным.\n⠀\nЯ подготовила тезисы: это - выводы и умозаключения, к которым я приходила на разных этапах моей жизни. Эти выводы мне помогали, эти мысли помогали мне совершить прорыв. На лекции, естественно, будет много примеров из моей жизни, реальные истории... но тезисами я с вами  поделюсь. Возможно, они в вас откликнутся:\n⠀\n1. Если много и тяжело работать - не обязательно будет много денег. И с этим надо жить.\n⠀\n2. Беден не тот, у кого мало, а тот, кому недостаточно.\n⠀\n3. Если ты ни в чем не лучший - ты можешь стать кем угодно.\n⠀\n4.Не иди за своей мечтой. Подожди, пока она придет за тобой сама.\n⠀\n5. Старайся делать хорошо любую работу.\n⠀\n6. Занимайся самообразованием.\n⠀\n7. Переключайся.\n⠀\n8.Если у тебя есть обиды и страхи или зависимое поведение— работай с ними (с психотерапевтом или по программе 12 шагов).\n⠀\n9. Всегда заботься о других людях. Щедрость открывает новые горизонты, перспективы и возможности.\n⠀\n10. Не бойся стать родителем. В этом - целая вселенная.\n", "preview": "https://www.instagram.com/p/B2jaCsbHRzw/\n\nСегодня читаю лекцию в одной корпорации, сложно это назвать именно лекцией - скорее, это встреча с разговором о главном. Мне очень понравился такой формат, делиться своим жизненным опытом и тем, что я считаю важным.\n⠀\nЯ подготовила тезисы: это - выводы и умозаключения, к которым я приходила на разных этапах моей жизни. Эти выводы мне помогали, эти мысли по", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/vi_vse_nepr_export/posts_md/2019-07-09__18__когда_турили_была_игра_или_город_или.md", "source": "Vi Vse Nepr", "date": "2019-07-09", "filename": "2019-07-09__18__когда_турили_была_игра_или_город_или", "title": "18 когда турили была игра или город или", "full_content": "# 2019-07-09 — когда турили была игра или город или\n*Datetime*: 2019-07-09T04:44:14+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 18\n\nЕще когда мы турили, у меня была игра: или я город, или он меня. Если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня. Если собираю волю в кулак, иду бегать по незнакомым улицам, думаю о питании, отказываюсь от сладкого и всякой дряни, которую всегда в туре проще найти - значит я его.\n\nМы с городами играли. Питер меня не принимал. Однажды я приехала в него на «лечебном голодании» - на самом деле просто не ела две недели, потому что друзья наркоманы сказали, что я поправилась от своего зожа. Ну а как иначе. И вот Питер меня заколбасил особенно в тот раз - после концерта в моде, кажется, я ела на корточках в подворотне ягодное лукошко и запивала ряженкой, потом - горечь, глинтвейн, и дальше - можно было выбрасывать открытку на месяц трезвости от анонимных.. Но потом я вернулась, и я бежала по мостам через два острова и один континент, и все уже было иначе потом.\n\nСейчас как и 10 лет назад я радуюсь, когда выхожу на пробежку в незнакомом городе, и направление выбирает меня, и я просто бегу. За это время я избегала столько городов, сделала столько тренировок в парках, гостиницах и съемных квартирах - этого не сосчитать, даже если сильно стараться.\n\nК чему это я - читала тут алмазного огранщика и думала о правилах успеха. У меня они совсем другие, чем во всяких бизнес-книгах, но когда я слышу в книгах кино или фильмах что-то похожее, буквально фразу одну - это открывает мне мою локальную истину: о, это про меня.\n\n«и так я годами трахала свое тело, пока полностью не подчинила его себе» - услышала я лет в 16, в мультике про Фину (кстати, антимульт.ру делают сейчас портал зожник) когда еще курила сигареты и не только. Какой-то колокольчик прозвенел внутри и я надолго забыла это, но всегда помнила. Когда я ела грибы, моим главным инсайдом было: пиздец я живу неправильно. И все вокруг меня тыкало носом в то, что я живу не так, как нужно - от боли в теле до… Короче неважно.\n\nКогда я начала бегать, тренить, правильно питаться - я срывалась, я уходила в крайности, я допускала много ошибок. Но это был правильный путь. Сначала я трахала свое тело всем этим, и голову свою тоже трахала, а потом.. Не то что бы я его подчинила, но что-то произошло. Все эти вещи - и тренировки, и бег, и хорошая еда - они стали моими союзниками, моим любимым ритуалом, который делает меня сильнее. Это - как обучится единоборству и больше уметь, чем учиться.\n\nИ каждая эта точка - когда я пробежала, когда я делала тренировку - это как в «соедини точки с цифрами и получи картинку». В моем воображении все они светятся и создают карту, которую я нарисовала на своей жизни. Я делала хорошие вещи и они привели меня к хорошему. Такое простое правило получается… Делай хорошие вещи. А плохие вещи не делай.\n\nReactions: ❤8 👍4 🕊3\n", "preview": "# 2019-07-09 — когда турили была игра или город или\n*Datetime*: 2019-07-09T04:44:14+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 18\n\nЕще когда мы турили, у меня была игра: или я город, или он меня. Если я приезжаю и плыву по волнам, жру как все, чилю как все - значит он меня. Если собираю волю в кулак, иду бегать по незнакомым улицам, думаю о питании, отказываюсь от сладкого и всякой дрян", "annotation": "Рассказ о срыве и возвращении к употреблению после периода трезвости."}, {"path": "data/vi_vse_nepr_export/posts_md/2019-07-03__15__интересная_штука_этот_ущерб_не_совсем_кажется.md", "source": "Vi Vse Nepr", "date": "2019-07-03", "filename": "2019-07-03__15__интересная_штука_этот_ущерб_не_совсем_кажется", "title": "15 интересная штука этот ущерб не совсем кажется", "full_content": "# 2019-07-03 — интересная штука этот ущерб не совсем кажется\n*Datetime*: 2019-07-03T06:09:27+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 15\n\nИнтересная штука этот ущерб. Не совсем то, что кажется большинству. Вот человек что-то сделал, а ты ему сказал: «Блин, круто!» а на самом деле подумал «Хуйня». И ты наносишь ему ущерб. Лучше бы просто промолчал. А так - подкрепил своим авторитетным мнением то, во что на самом деле не веришь… А человек тебя слушает и доверяет. Или когда говоришь «Да нормально все», а на самом деле не нормально. Наступил себе на горло, внутри себя перетерпел - нанес этим человеку ущерб. Потому что он спросил: нормально? а ты ответил что нормально, а про себя подумал: «вот пидорас какой невнимательный, мог бы и догадаться, что ненормально!». Так это ты его пидорасом сделал, когда ответил нечестно на его вопрос.\n\nКогда ты думаешь одно а говоришь другое - это все ущербище, потому что ты не даешь миру принять тебя таким, какой ты есть. Носишь уебские маски, потому что нормальных вообще не бывает. Даже если тебе кажется что твоя маска хорошего человека защищает мир от твоего же зла - тебе так только кажется. Твое лицемерие делает всем только хуже. Но чтобы говорить то что думаешь или молчать - нужна сначала смелость, а потом привычка.\n\nЕще интересен ущерб денежный. Вот свозила я людей куда-то за свой счет - нанесла им ущерб. Дала денег просто так - нанесла ущерб. Если они знают, что это я дала. Или не в деньгах, а помочь. Стоит подумать: а насколько мне благодарны? И все, вместо доброго дела это снова ущерб.\n\nПоэтому благородство без зрителей, широкие жесты без фотокамер, дары без имени дарителя и без возможности отбиться на рекламе… Это то, как я хочу жить, поэтому и живу с 12 шагами уже столько лет. Без них начинаешь думать, что раз ты не делаешь крупного говна, то на мелкое и оглядываться нечего. С шагами видишь каждую какашинку.\n\nReactions: 👍4 🤔2\n", "preview": "# 2019-07-03 — интересная штука этот ущерб не совсем кажется\n*Datetime*: 2019-07-03T06:09:27+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 15\n\nИнтересная штука этот ущерб. Не совсем то, что кажется большинству. Вот человек что-то сделал, а ты ему сказал: «Блин, круто!» а на самом деле подумал «Хуйня». И ты наносишь ему ущерб. Лучше бы просто промолчал. А так - подкрепил своим авторитетным ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2019-04-30.md", "source": "Instagram", "date": "2019-04-30", "filename": "2019-04-30", "title": "2019-04-30", "full_content": "https://www.instagram.com/p/Bw4eM_dHFhV/\n\nВот она, дата, важнее многих. Для многих зависимых юбилей чистого времени - это второй день рождения. Так же и у меня.\n⠀\nЯ считаю, что это день моей души. 7 лет без капли веществ, изменяющих сознание. Ни алкоголя, ни легких наркотиков, ничего. На этой медальке могло бы быть написано “Х”, но срывы, которые были на первых годах - это тоже важный опыт.\n⠀\nМногие люди могут употреблять наркотики и алкоголь, и это никак не влияет на их жизнь. Кому - то надо быть абсолютно чистым. Кто-то нормально живет и так, а кому-то нужна постоянная работа с личностью и характером. Поэтому уже 7 лет я пишу шаги - бесплатную терапию для зависимых людей.\n⠀\nМне важно говорить об этом, о моём пути и моём опыте, потому что есть люди, похожие на меня, и их не мало.\n⠀\nЕсли однажды вы почувствуете себя зависимым - от наркотиков, алкоголя, людей, еды - знайте, есть 12-шаговые группы, которые помогают понять причины своего поведения и перестать страдать. Это бесплатно, анонимно и добровольно от начала до конца. Ты идёшь по этому пути сам, но никогда не чувствуешь себя одиноким.\n⠀\nPs: в комментариях много вопросов, как найти группы. Ищите в интернете «Анонимные Наркоманы», «Анонимные Алкоголики», «Анонимные Созависимые», «Анонимные Переедающие», «Анонимные булимики и анорексики», есть ещё сексоголики, игроки, депрессивные и другие группы взаимопомощи. Ищите в своём городе собрания, приходите на них. Сейчас так же есть группы в скайпе, их тоже можно найти в интернете.\n", "preview": "https://www.instagram.com/p/Bw4eM_dHFhV/\n\nВот она, дата, важнее многих. Для многих зависимых юбилей чистого времени - это второй день рождения. Так же и у меня.\n⠀\nЯ считаю, что это день моей души. 7 лет без капли веществ, изменяющих сознание. Ни алкоголя, ни легких наркотиков, ничего. На этой медальке могло бы быть написано “Х”, но срывы, которые были на первых годах - это тоже важный опыт.\n⠀\nМног", "annotation": "Рассказ о срыве и возвращении к употреблению после периода трезвости."}, {"path": "data/ig_organized/long_200_md/2019-04-22.md", "source": "Instagram", "date": "2019-04-22", "filename": "2019-04-22", "title": "2019-04-22", "full_content": "https://www.instagram.com/p/BwjDUlaHvPu/\n\nКак найти себя? Понять, где твое место, в чем твой потенциал? Многие называет это «добиться успеха», но мне вообще не нравится концепция «успеха», потому что счастье не измеряется деньгами, вещами, одобрением других людей, годовым оборотом твоей компании.\n⠀\nНедавно девочки попросили меня записать с ними подкаст о медитации. И я немного их обманула - в подкасте этом не так много о медитации - зачем сотый раз повторять одно и то же? Я говорила о сути, которая заложена в процесс, как я ее вижу.\n⠀\nЯ убеждена, что огромное влияние на мою жизнь оказали 12 шагов и йога. У них очень много общего. С того момента, как я встала на этот путь, два этих процесса в моей жизни заставляли меня работать над несколькими вещами, одна из которых важнее прочих.\n⠀\nЭто - чистота намерения: «пусть это будет и живет, если это нужно не только мне, но и людям. если я задумываю это для личной выгоды - я готова, чтобы вселенная не дала этому развиваться». Йога (медитация) научили меня смотреть вглубь вещей и процессов, видеть, куда я могу приложить свой потенциал. Это приходит дождем идей и решений. Чтобы идти по своему пути и раскрывать свой потенциал - тебе нужна не одна идея, тебе нужен постоянный поток, постоянный источник. И этот источник - в окружающем мире, в способности видеть текущий момент, а не перебирать внутри себя уже произошедшие события. Люди привыкли оринтироваться на то, что уже произошло, на прошлый опыт. Но прошлое остается в прошлом, а ваша задача - органично встроиться в текущий момент.\n⠀\nКатя Кляйн подарила мне книгу «Алмазный Огранщик», и с первых страниц - там именно об этом. Если вам откликнулось - найдите и послушайте мой подкаст, и почитайте книгу. Я считаю, что если каждый человек найдет свое место в жизни и будет счастлив - мы будем жить в удивительном мире.\n", "preview": "https://www.instagram.com/p/BwjDUlaHvPu/\n\nКак найти себя? Понять, где твое место, в чем твой потенциал? Многие называет это «добиться успеха», но мне вообще не нравится концепция «успеха», потому что счастье не измеряется деньгами, вещами, одобрением других людей, годовым оборотом твоей компании.\n⠀\nНедавно девочки попросили меня записать с ними подкаст о медитации. И я немного их обманула - в подк", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2019-01-28.md", "source": "Instagram", "date": "2019-01-28", "filename": "2019-01-28", "title": "2019-01-28", "full_content": "https://www.instagram.com/p/BtLqOv-nZkz/\n\nПо горячим следам отвечаю на вопрос прошлого поста: Зачем и как прописывать обиды?\n⠀\nКонечно, иногда я жалею, что программа 12 шагов не так доступна и адаптирована для большинства людей - настолько это мощный инструмент самостоятельной психологической помощи... Но к счастью, в России становятся популярны 12 шагов для пищевых зависимых, для созависимых, для детей зависимых. Если что - все эти группы бесплатны.\n⠀\nС обид начинается работа над четвертым шагом. Сначала ты описываешь ситуацию, свои чувства, свое поведение, а потом - ищешь свою нечестность, свою сторону в этой обиде. Эта работа настолько многогранна, она дает множество уроков - и чем дольше ты в этом процессе - тем больше ты узнаешь о себе и о других.\n⠀\nОбиды запускают разные процессы в нашей жизни. Мы не знаем, как себя вести, кто на самом деле виноват, прощать или прожить - все эти вопросы занимают кучу оперативной памяти, какие-то события портят настроение, какие -то портят отношения. Есть обиды, которые тянутся годами, есть такие, которые раз за разом бьют нас в больное место.\n⠀\nВ процессе мы узнаем не только то, какие вещи обижают нас, но и то, как себя чувствуют другие от нашего поведения. Мы начинаем понимать, что часто ждем от других любви, принятия, чтобы нас слушали, чтобы нас слушались - но сами мы не готовы отдавать это во многих ситуациях с другими людьми. Мы обнаруживаем, что зависли между низкой самооценкой и критическим уровнем эгоцентризма. Мы отстаиваем право на свое мнение, но не всегда даем это право другим людям.\n⠀\nМы обнаруживаем, что наша самооценка зависит от оценки других людей.\nМы обнаруживаем, что ожидаем от людей определенного поведения и не готовы сталкиваться с реальностью.\nМы обнаруживаем, что хотим получать, хотим, чтобы все было легко и спокойно. И совсем не хотим проходить трудные уроки, которые на самом деле и делают нас сильнее и мудрее.\n⠀\nПрописывать каждую обиду - это сначала боль и труд, а потом -  невероятный кайф. Сначала ты вычищаешь авгиевы конюшни, скопившиеся за всю жизнь. Вдоволь себя жалеешь и поддерживаешь, а потом - ⤵️⤵️\n", "preview": "https://www.instagram.com/p/BtLqOv-nZkz/\n\nПо горячим следам отвечаю на вопрос прошлого поста: Зачем и как прописывать обиды?\n⠀\nКонечно, иногда я жалею, что программа 12 шагов не так доступна и адаптирована для большинства людей - настолько это мощный инструмент самостоятельной психологической помощи... Но к счастью, в России становятся популярны 12 шагов для пищевых зависимых, для созависимых, для", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2019-01-17.md", "source": "Instagram", "date": "2019-01-17", "filename": "2019-01-17", "title": "2019-01-17", "full_content": "https://www.instagram.com/p/Bsv71B5n-7n/\n\n10 лет назад меня швыряло из стороны в сторону. Я уже мечтала жить иначе, но совершенно не понимала - как. Я воевала со своим телом, грусть на моем лице - это вечные качели +-10 кг, срывы на алкоголь и сигареты, первые попытки жить полностью трезво - а потом и срывы на наркотики. Я начала заниматься йогой, чтобы сбежать от зависимости. Не помогло, но йога осталась в моей жизни как путь, она помогла мне найти себя и свое призвание. Я встретила своего учителя @yoga_method и до сих пор чувствую его руку на своем плече. Защитила диплом, переехала в Питер. Начала работать по программе 12 шагов - вот это как раз и помогло мне с зависимостью. Вот уже 10 лет я на этом пути.\n⠀\nЯ занималась музыкой, хоть это и приносило мне достаточно внутренней боли и напряжения - я не чувствовала себя профессионалом, мне постоянно казалось, что я плохо пою и плохо выгляжу, и не достойна стоять перед людьми вот в таком вот виде. Рядом со мной были мои невероятные друзья - они и сейчас рядом, мы все еще вместе, мы все еще делаем музыку - только теперь у меня внутри все не сжимается от напряжения. Я поняла, что своим творчеством я не приношу в мир зло, и я никогда не требовала признания, чего -то большего, чем то, что мне и так давали - так почему бы не продолжать, если что-то внутри меня просит.\n⠀\nЯ жила в съемной однушке с лучшей подругой @juliez_makaravee , где мы сделали ремонт и оранжевые обои. Написала все песни для SattaMassagana, путешествовала на юг автостопом. Потом была наша квартира в Питере - одна для всей группы, зато на берегу залива. Мы покупали продукты в Ленте и хватало впритык только на самое необходимое.. В конце года Питер не принимал, я терялась в мостах и Советских улицах, по ночам мы таксовали на Ланосе, все вокруг отдавало каким-то холодным, неприветливым космосом. Но мы грели друг друга - с друзьями все по плечу, ничего не страшно.\n", "preview": "https://www.instagram.com/p/Bsv71B5n-7n/\n\n10 лет назад меня швыряло из стороны в сторону. Я уже мечтала жить иначе, но совершенно не понимала - как. Я воевала со своим телом, грусть на моем лице - это вечные качели +-10 кг, срывы на алкоголь и сигареты, первые попытки жить полностью трезво - а потом и срывы на наркотики. Я начала заниматься йогой, чтобы сбежать от зависимости. Не помогло, но йога ", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2018-09-07__3.md", "source": "Instagram", "date": "2018-09-07", "filename": "2018-09-07__3", "title": "3", "full_content": "https://www.instagram.com/p/BnbDOMNFEVx/\n\nЧасть 3. На фото - 2011 год. Я живу без приступов, у меня около года трезвости, #sekta только - только появилась, как сообщество в жж. \nМое желание разобраться с саморазрушением и желанием исчезнуть привело меня в сообщество анонимных наркоманов. Там все было сложно и непонятно, и когда я начала отказываться полностью от наркотиков и алкоголя - моя пищевая зависимость начала возобновляться, я анализировала свои приступы, их причины, училась работать с тревожностью, которая их запускает. Как у любого срыва -у них всегда были причины. Булимия - это проявление болезни зависимости, и есть много материалов, например у Валентины Новиковой, которые помогают разобраться в причинах и механизмах, которые руководят зависимым поведением, компульсивным поведением, тоннельным мышлением. Пришлось очень много в себе проработать - свои обиды, страхи, все, что запускало механизмы тревожности. Я не помню момент, когда приступы прекратились, потому что я перестала фокусироваться на них - я внимательно следила за своими реакциями на мир и на внешние раздражители. Моим фокусом стал душевный покой и все, что ему способствует. Моим\nфокусом стали изменения в моем внутреннем мире, работа с моими дефектами, с моим эгоцентризмом - когда я видела в себе позитивные перемены, у меня не было никаких причин ненавидеть себя и наказывать. До начала работы по 4ому шагу приступы иногда возвращались - в самые стрессовые моменты, но они были разовыми, без запоев, как раньше. Но уже больше 5 лет я живу в абсолютной свободе от этого, столько же я сохраняю абсолютную трезвость - от алкоголя и любых других веществ. Это связанные вещи, они идут рука об руку. \nСейчас я верю в то, булимия излечима, если заниматься этим вопросом и не притворяться, что ничего не происходит. Программа 12 шагов, хороший психолог или психотерапевт, который научит работать не с едой, а зависимостью. Потом - заново учиться есть: чувствовать голод и аппетит, разделять их, кормить себя полноценно и регулярно. Любить себя, находить и создавать новые причины, чтобы любить себя - это все процесс на годы, главное - это запустить его.\n", "preview": "https://www.instagram.com/p/BnbDOMNFEVx/\n\nЧасть 3. На фото - 2011 год. Я живу без приступов, у меня около года трезвости, #sekta только - только появилась, как сообщество в жж. \nМое желание разобраться с саморазрушением и желанием исчезнуть привело меня в сообщество анонимных наркоманов. Там все было сложно и непонятно, и когда я начала отказываться полностью от наркотиков и алкоголя - моя пищевая", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/lj_export_clean/posts_md/2018-08-21__86613__null_this_is_the_eeeend.md", "source": "LiveJournal", "date": "2018-08-21", "filename": "2018-08-21__86613__null_this_is_the_eeeend", "title": "86613 null this is the eeeend", "full_content": "# null/ this is the eeeend\n*Date*: 2018-08-21T23:41:00+00:00\n*URL*: https://olymarkes.livejournal.com/86613.html\n*Tags*: #000000\n\nУ меня болит голова. Очень сложно писать в таких нечеловеческих условиях, но тут уже требуют продолжения. Так вот, на чем я закончила? А, на грустном. Так вот, для полноты картины тут наверное надо представить себе все, начиная от бесконечных вопросов про развод - в аск.фм прежде всего, потому что лично спросить все боялись, до собственно временного контекста - это самые первые дни нового года, и тут начинают аккуратно анонимные братья задавать вопросы, типа «беспокоимся за твое выздоровление», и некоторые совсем уж близкие начинают песню из серии «дописала четвертый шаг и ушла в сухой срыв». Это когда ты типа не употребляешь наркотики, но весь такой в зависимом поведении. У всех, собственно, стоял один вопрос на повестке дня: почему я разъебываю свою жизнь. И тут должно было быть какое-то разоблачение, типа муж меня бил, или не любил, или я его не любила - потому что других историй не бывает, видимо. Но тут не так, мы жили душа в душу и любили друг друга, да и любим до сих пор. Но для того, чтобы жизнь шла дальше и шла хорошо - нам надо расстаться. Вот есть же какой-то такой момент переломный на пути,\nот стадии, когда люди любят друг друга и решают быть вместе и делать семью - и до другой крайности, где они ненавидят друг друга и терпят друг друга, или до измены, например. Вот если переломный момент наступает и до крайности еще очень далеко - это самое время что-то изменить, оставаясь честным в отношениях. Я хочу оставить эту историю чистой. Еще один шаг вперед - и этого уже не спасти.\nВ этой ситуации я не жертва, роль жертвы мне знакома и понятна, а вот к роли Дурге-разъебывающей-все я никак не могу привыкнуть. Что чувствовать? Сознание отправило меня в отпуск. Просто ничего, никаких чувств, и из интересов - только сноуборд, танцы и пожрать. Примитивно, как пиздец. Никаких лишних движений и мыслей - кажется что идешь по доске в кипящей лаве, и такой типа: все нормально, я просто иду по полу. Просто иду по линии на полу. Я не бухой, так что пройти по линии - это не проблема для меня. Потому что если свалится в эту лаву - начинаешь жалеть и себя, и множество вещей, которые ты разъебал, и все моменты, и все ритуалы, привычки, воспоминания. Просто нельзя об этом думать, потому что суть и правда не меняются. Я все правильно делаю, главное - не оглядываться назад.\nПоэтому мы танцевали. Сто лет не делала этого, честно говоря. Но потом этот странный плейлист на закрытии Мачт, концерт Сюзанны, потом просто Юнион, потом вся Конюшенная - «Молодость все прощает» на Танц. площадке, и стоишь под ней и ржешь. Потому что если молодость все прощает, то в 30 лет хахах, ой держите меня…\nПотому что в 30 лет ты сделал все, чтобы от тебя наконец отъебались со всеми этими вопросами - А что образование? А когда замуж? А дети? А когда за вторым? А квартиру-то свою покупать будете? Чтобы отстал весь социум, отстал от тебя, от твоих родителей, бабуль и дедуль, чтобы им было что соседям рассказывать. Подарила папе джип с огромным бантом на 50 лет, родила детей не отрываясь от производства, ебашила все - и музло с концертами, и лекции/тренировки по всему миру, и бизнесы всякие пробовала, нанимала/увольняла, ебашила по 12 шагам, чтобы крыша на месте была от всего этого дерьма, и аспирантура, и почему бы мать его IRONMAN не ебануть, у меня ведь так дохера свободного времени. Я все тащила, ничего не бросила. И вот теперь мне хочется чтобы все просто отъебались от меня (хотя на самом деле никто и не доебывался, кроме, собственно, меня самой, это я вам просто пытаюсь передать ощущение). Я ничего не хочу делать. Я просто хочу, чтобы моя голова отстегнулась от меня и осталась дома, а сама я пойду танцевать. Вот, чего я хочу. Конечно, сначала чувство вины немного отравляло мне вкус безалкогольного винишка. Чувство вины за то, что не читаю диссертации и не хожу в офис. Потом я вспомнила, что сейчас новогодние праздники… И мы взяли микроавтобус и уехали в Коробицыно.\nИ мы так танцевали каждый день, как в последний раз, или нет - как в тот раз в PV в Березовском на хэппи хардкоре. Мы танцевали на улице у машины, мы танцевали дома, в магазинах под любую музыку из колонок, на горе, пристегнутые к доскам, по дороге, в машине. Мы танцевали, потому что на самом деле это было самое волшебное ощущение. Когда тебе тридцать лет, и ты наконец-то от себя отъебался.\nВ это время я не писала музыку и альбом стоял на паузе. И Шапо тоже понимал что как-то немного не до этого сейчас. А вот Катя считает, что Алиса - это мощный эгрегор, десятки тысяч Алис воплощенные в этом образе пришли в мою жизнь и все разрушили. Зы считает, что я просто снимаю с себя кожу каждый раз перед таким релизом, который приходит не из головы. Юля считает, что это невероятно - то, что мы сделали… Сделали и не осознали, и что то, что я сделала со своей жизнью - я не осознала это так же, но энергетически все оказалось в балансе. Я принесла жертву и у меня получилось то, что получилось. Мир услышит это чуть позже, но пока я на самых последних неделях, и это ни с чем не сравнится. Об этом потом напишу, сейчас о другом.\nЯ хочу запомнить этот январь, как один из самых счастливых месяцев в моей жизни. Может быть, даже, самый счастливый. И это не связано с тем, что у меня все было хорошо. Нет, все было не так. Странным образом я соединялась эмоционально не с проблемами, которые вокруг меня были, а с правдой, которая победила и была в моем сердце. С какой-то чистотой намерения, с честностью. С пятым шагом, который я практиковала. Я танцевала без горечи, без страха, что будет дальше, не заботясь, что обо мне подумают. С ощущением, что я все уже сделала, сдала сессию, поставила все печати… Короче если вы хотите знать что-то важное про 30 лет - просто постарайтесь работать не выдыхая с 25, и тогда в 30 вы возможно узнаете, что такое настоящие каникулы.\nИ знаете что еще? Во всей этой истории нет никакого трагизма. Только любовь. Поэтому мне немного странно, когда меня жалеют или сочувствуют; Еще понимаю, когда анонимно пишут: «Желаю Андрею счастье и не с такой мозгоебкой, как ты», это хотя бы забавно. Знаете, мозгоебы и мозгоебки - это хотя бы весело. А уж прожить 5 лет душа в душу, будучи совершенно отбитыми и разными - это огромное счастье, гораздо лучше, чем найти себе какое-нибудь УГ и чтобы оно тебя терпело. Я думаю, что жизнь нужно праздновать, а не пытаться пройти ее на легком уровне. Но тут скорее дело вкуса.\nЧто касается будущего - понятия не имею, что там. Надеюсь меня с моими друзьями поместят в один дом престарелых. По крайней мере так я точно готова встретить закат жизни. Остальное пока не знаю.\n", "preview": "# null/ this is the eeeend\n*Date*: 2018-08-21T23:41:00+00:00\n*URL*: https://olymarkes.livejournal.com/86613.html\n*Tags*: #000000\n\nУ меня болит голова. Очень сложно писать в таких нечеловеческих условиях, но тут уже требуют продолжения. Так вот, на чем я закончила? А, на грустном. Так вот, для полноты картины тут наверное надо представить себе все, начиная от бесконечных вопросов про развод - в аск", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2018-08-02.md", "source": "Instagram", "date": "2018-08-02", "filename": "2018-08-02", "title": "2018-08-02", "full_content": "https://www.instagram.com/p/Bl-QANtlgbz/\n\nВчера меня спросили: зачем мне психотерапевт? Мне интересно ответить на этот вопрос. \nВо-первых после развода у меня есть страхи - что я не могу построить отношения, что я сама все порчу, и т.д. Моя задача - проработать все, что скопилось в моей голове, отделить истину от домыслов, и конечно проработать свою сторону. Отношения - это всегда дело двух человек, и у меня были ошибки и неправильное поведение - я хочу исправить их и больше не повторять. \nВторой запрос - это материнство. Я хочу быть более чуткой мамой, проводить с детьми больше времени и делать это более качественно. И мне хочется поработать с глубокими причинами этого и я верю, что это возможно. Здоровый образ жизни тоже не был естественным для меня, но я научилась и полюбила этот процесс. Так и в материнстве - мне не дано от природы быть такой идеальной мамой, как моя подруга @nemalinka , например , но я хочу стать лучше. \nТретий запрос - это деньги. У меня не все просто с этой материей. Я часто нарушаю границы других людей, когда плачу за них, в целом деньги могут испортить любые замечательные отношения, когда ты не умеешь ими пользоваться. Я не могу сказать, что я умею. И здесь очень много моментов психологических. Умение оценивать свою работу по достоинству, осознание ценности в денежном эквиваленте - у меня с этим тоже беда. Курсы #sekta стоят очень мало по сравнению со всем, что в них вложено - в том числе и человеческий труд. Обесценивая свою работу, я обесцениваю работу других. Я такой знаете бизнесмен - по - неволе, а мне надо войти в свою роль и начать грамотно ее выполнять. \nЯ работала со своим характером и паттернами поведения и до этого, в 12 шагах много личной терапии, ответов на собственные вопросы, но теперь мне хочется услышать взгляд со стороны, увидеть новый угол зрения. Как говорит Лена @tzarapina - нырнуть в свою глубину с кем-то - это удивительное путешествие.\n", "preview": "https://www.instagram.com/p/Bl-QANtlgbz/\n\nВчера меня спросили: зачем мне психотерапевт? Мне интересно ответить на этот вопрос. \nВо-первых после развода у меня есть страхи - что я не могу построить отношения, что я сама все порчу, и т.д. Моя задача - проработать все, что скопилось в моей голове, отделить истину от домыслов, и конечно проработать свою сторону. Отношения - это всегда дело двух челове", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2018-07-20__2.md", "source": "Instagram", "date": "2018-07-20", "filename": "2018-07-20__2", "title": "2", "full_content": "https://www.instagram.com/p/BlcgZ4JlHqH/\n\n6 лет я работаю над собой по программе 12 шагов. Куча исписанных тетрадок, сотни посещенных собраний. На самом деле в программе я уже лет 10, но писать и работать начала далеко не сразу. Вообще последнее время меня чаще жалеют или наоборот, критикуют что я стала больше ныть, а не писать о счастье. На самом деле я просто стала честнее, и пишу про обратную сторону жизни. Так вот, счастье и эмоции - это о разные вещи. И я помню период реального несчастья: я ненавидела себя, своё тело, меня задевала любая критика, мне казалось, что я ни на что не способна, но в то же время - что меня никто не ценит. У меня было много эмоций, которые я не могла, но пыталась контролировать. Я компульсивно переедала, я наказывала себя спортом, я срывалась на наркотики и алкоголь, чтобы почувствовать себя хуже всего, в надежде что это изменит мою жизнь. Но это было давно. \nСейчас счастье - это норма. Я была счастлива в браке, как только счастье закончилось - пришлось делать перемены. Если обстоятельства меняется, я действую. Если мне что-то в себе не нравится, у меня всегда есть два взгляда: взгляд моей болезни, где я неконструктивна, и взгляд здравомыслия - там я понимаю, какие моменты я реально могу улучшить, и какую работу придётся проделать. \nПример такой: я осознаю чувство вины в своём материнстве, и я не могу его убрать, но я знаю, что есть действия, которыми я могу помочь себе: обратиться за помощью, услышать опыт других матерей, стараться больше раскрывать в себе действия через любовь, а не через жертву. Но все эти вещи - они не убирают чувство, потому что чувства надо проживать, а не стараться забить. Иногда это требует времени. Порой на это уходят годы - как на установление мира со своим телом. Но в итоге ты становишься счастлив, и счастье - это не про отсутствие негатива и негативных чувств в жизни. Например, когда у меня в жизни тяжелый период и события - я счастлива, что у меня рядом есть друзья, которые поддерживают меня. Моя точка самосознания там, где у меня есть друзья, дети, и благодарность за всё, но моё «я» и там, где мне больно, где я виню себя за то, что недостаточно вложилась во что-то, поленилась, не доделала. (Продолжение ниже) #olymarkes_главное\n", "preview": "https://www.instagram.com/p/BlcgZ4JlHqH/\n\n6 лет я работаю над собой по программе 12 шагов. Куча исписанных тетрадок, сотни посещенных собраний. На самом деле в программе я уже лет 10, но писать и работать начала далеко не сразу. Вообще последнее время меня чаще жалеют или наоборот, критикуют что я стала больше ныть, а не писать о счастье. На самом деле я просто стала честнее, и пишу про обратную с", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/ig_organized/long_200_md/2018-04-02.md", "source": "Instagram", "date": "2018-04-02", "filename": "2018-04-02", "title": "2018-04-02", "full_content": "https://www.instagram.com/p/BhFULTiFC9W/\n\nДень 3. \nКатались, прыгали в парке - наконец-то! Потом мы с продакшн-тим Рокси поехали снимать красоту на водопад, а наш #sekta - продакшн в это время снимал тренировки у озера. Поужинали во флаконе, вернулись в Долину и пошел ливень. Мы с Леной сели и наконец-то записали подкаст про зависимость. Вечер, уже падаю от усталости, но все таки хочу написать этот пост, чтобы каждый год этот удивительный день радовал меня в таймхопе.\n\n#newstarcamp\n", "preview": "https://www.instagram.com/p/BhFULTiFC9W/\n\nДень 3. \nКатались, прыгали в парке - наконец-то! Потом мы с продакшн-тим Рокси поехали снимать красоту на водопад, а наш #sekta - продакшн в это время снимал тренировки у озера. Поужинали во флаконе, вернулись в Долину и пошел ливень. Мы с Леной сели и наконец-то записали подкаст про зависимость. Вечер, уже падаю от усталости, но все таки хочу написать это", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/lj_export_clean/posts_md/2018-01-21__86024__nullпризнай_перед_богом_собой_и_другим_человеком_что_ты_говно.md", "source": "LiveJournal", "date": "2018-01-21", "filename": "2018-01-21__86024__nullпризнай_перед_богом_собой_и_другим_человеком_что_ты_говно", "title": "86024 nullпризнай перед богом собой и другим человеком что ты говно", "full_content": "# null/признай перед Богом, собой и другим человеком, что ты говно/\n*Date*: 2018-01-21T00:26:00+00:00\n*URL*: https://olymarkes.livejournal.com/86024.html\n*Tags*: #000000, #sekta\n\nПоследние пять лет я спасала мир. Хех, не будем обсуждать, насколько хорошо у меня это получалось. В иллюзиях я не пребываю. Скорее я про вектор. Нам казалось, что мы делаем очень большое и важное дело и ни в коем случае нельзя отвлекаться. Мы с малышкой Зы сидели на кухне кажется десятой линии васильевского острова и принимали первые заявки на\n#sekta\n- дистанс, а по вечерам по очереди, а скорее даже вместе, вели тренировки в Мэдстайле на Невском 32-34, проверяли дневники, придумывали новые задания и лекции. Так все началось. Потом вселенная дала такой ответ, что меня закачало - появились деньги, появились проблемы, появились амбиции и желание развивать все это дело, допиливать, доводить до совершенства. А до совершенства на тот момент было далеко.\nЯ говно. Но у меня есть вектор. Знаете, это такое бесконечное стремление к лучшему с вечным осознанием того, какое я говно. Я говно человек. Поэтому я пишу шаги. Я плохой руководитель, поэтому я всегда искала тех помощников, которые будут хорошими руководителями вместо меня. Я плохая мать, плохая жена, плохой друг. Моя\n#sekta\nбыла ужасным непрофессиональным клубком панковских эклектичных идей с формулировками типа «проеб» и с метафорами уровня «раздражать вкусовые рецепторы - это как слишком часто дрочить». Я необразованное уральское быдло, поэтому я вечно продираюсь через тьму своего невежества, пытаясь окружить себя умными людьми и слушая их. Я говно с тупыми шутками, иногда с тупыми и жестокими шутками. И может быть единственное справедливое во всей этой истории, это то, что все это время я очень-очень-очень хотела стать лучше.\nЧуть ли не на вторую неделю работы моего «бизнеса» мне стало достаточно всего. Во всяком случае было чем платить за квартиру. Я никогда не старалась быть лучше, чтобы «лучше» конвертировалось в бабло. Это было для чего-то еще. Сказать для людей? Возможно для людей. Но я боюсь быть лицемерной, наврать вам, поэтому не буду говорить «для людей», потому что желание стать лучше похоже на зуд. Оно похоже на раздражающий тебя звук, оно похоже на соседа, который делает ремонт в квартире снизу. Оно похоже на долг по кредиту. Оно похоже на все, что не дает тебе спокойно спать. При этом конечно все измерялось относительно довольства людей, которые занимались у нас. И так как цель была, чтобы они ушли с результатом и счастливые, в итоге получалось, что мое «стать лучше» имело прямое влияние на людей.\nЯ старалась бесконечно все улучшить и устранить все косяки (и тут важно написать, что я не одна старалась, и все хорошее было сделано не моими руками, а руками других людей, потому что сама я вообще мало что могу сделать, помните, что в любым навыком я владею крайне посредственно, и таланта у меня нет ни к чему, кроме, пожалуй, выражения своих мыслей в письменной форме), а устранение косяков влияло на качество продукта и общий результат. Стремление все улучшить привлекало в команду самых охуительных людей, потому что они видели, как все рубятся не за бабло и показатели, а за совершенство и за то, чтобы у наших учеников получалось.\nКоманда мне многое прощала и прощает. Им есть, что прощать, потому что я далеко не Джобс, не Дуров, не один из этих блестящих талантливых руководителей, о которых пишут книги. Но я действительно хочу, чтобы все хорошо работало, чтобы все было идеально и правильно.\nНе знаю, что во мне такого хорошего, что все они рядом со мной. Возможно просто другие руководители еще хуже. Другого объяснения у меня нет.\nТак вот, последние пять лет я занималась этим. А до этого я жила творчеством. Это был совсем другой период, и тут о нем очень много можно найти. Все началось с творчества, и с моих друзей. Да, мы мало кому были нужны, просто обычная маленькая компания из города в центре России, даже не столичные ребята. Без амбиций, не мечтая о больших победах - просто хотелось как-то так прожить свою маленькую жизнь, чтобы было что вспомнить.\nМы жили каждый день на максимум, на всю катушку. Мы дружили, мы любили, и вот как-то много было всего этого, и мир мы совсем не спасали. Жили для себя и так и планировали. Из всего этого получались тексты, получались песни, и я чувствовала себя на своем месте - типа такая у меня миссия. Переживала ли? Конечно. Что голос у меня слабый и слуха нет нихрена, что песни я пишу примитивные и на одни и те же аккорды, что не получается сделать нормально ничего - ни записаться, ни выступать. И выглядела я при этом так себе. Любой комментарий на ютубе к нашим трекам выглядел так: «Страшная как пиздец и петь не умеет». Я соглашалась, но при этом жизнь продолжала жить меня, друзья были рядом, мы угорали и любили, и песни рождались сами собой, и концерты и дорога круглый год, и мы танцевали, и путешествовали, и все-все-все делили поровну. Залезали в долги, вылезали из долгов, покупали себе билеты в Гоа на последние деньги, делали первые тренировки в съемных туровых квартирах. Так все было.\nА потом все это произошло, и в жизни появился новый смысл - меня просто переключило на него. Вот это ощущение, что ты спасаешь мир - оно очень вкусное. Типа до этого я прожигал жизнь и делал какое-то непонятное творчество, а вот сейчас-то я наконец нормально живу. Наверное, любой другой человек на моем месте открестился бы от прошлого, но вот не стала. Мой папа считает, что главное мое положительное качество - это умение доводить все до конца. Да, я скорее тащу все это по земле, но не бросаю.\nУже потом, в процессе «спасания мира» я открыла циклы мотивации. У меня они достаточно долгие и однонаправленные. Если я работаю - я работаю. Если я в творчестве - я в творчестве. Но и когда я занималась одной только группой - у меня были периоды застоя, когда я пинала себя и пыталась что-то выдавить, и ничего у меня не получалось. Тут я просто поставила себе задачу: пусть что-то не получается, но ведь вроде и не становится хуже, поэтому я буду просто поддерживать жизненные показатели этой жизненной сферы в норме. Как человека в коме держат на ИВЛ. Так и я держу что-то в своей жизни, на что у меня совсем нет сил. Типа, если что-то не дышит само - еще не время это убивать. Возможно, еще задышит.\nС группой у меня не было сомнений - наоборот, я была уверенна что в свободе моим песням будет лучше. Когда некуда торопиться и не надо мерить свой успех успехом своего творчества. Вообще нахуй успех. Я хочу, чтобы каждый знал и чтобы я не забывала: успех\n- это не равно счастью, для меня во всяком случае. Счаст
