юсь тебе объяснить, Лизочек.\nКосмическая любовь - она для космоса. Она для вдохновения, для", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/lj_export_clean/posts_md/36262__всё_началось_с_диплома.md", "source": "LiveJournal", "date": "Unknown", "filename": "36262__всё_началось_с_диплома", "title": "всё началось с диплома", "full_content": "# Всё началось с диплома.\n*Date*: 23 января 2010, 15:00\n*URL*: https://olymarkes.livejournal.com/36262.html\n\nЯ вообще не хотела его забирать – меня всегда тошнило от бюрократии и бумажной тягомотины, и Обходной Лист казался мне невыполнимой миссией. Однако, вчера утром я встала с настроем на великие дела.\nУниверситет прекрасен. Я люблю его от первой ступеньки до самого чердака,  я всегда мечтала учиться здесь. Ешё когда я была школьницей, я приходила ночью к крыльцу главного здания и шептала (или кричала – в зависимости от состояния) :  «Я буду здесь учиться! Я буду здесь учиться! Я буду здесь учиться!».\nЭто была миссия не из легких – в школе я была троечницей и прогульщицей, курила, пила и употребляла наркотики. Однажды папа сказал мне: «Если ты не поступишь на бюджет – ты не будешь учиться. Я не буду платить за тебя». И это было справедливо. Я хотела быть интеллигентным торчком, а не представителем социального дна без надежды на будущее, так что пришлось поднапрячься.\nВ своей жизни я сделала четыре по-настоящему крутые вещи:\n1, 2  - два наших альбома  - любой музыкант скажет, что довести это дело до конца без помощи продюсеров и т.п. – невероятно сложно.\n3 – я научилась прыгать нормальный такой бани-хоп на bmx’e.\n4 – я поступила на Журфак УрГУ на бюджет.\nОоо… Это было адски сложно для меня – пол года сидеть дома и зубрить русский язык и историю отечества, и все это – в полной уверенности что я гораздо хуже каждого своего конкурента – претендента на бюджетное место.\nКроме того, я писала статьи во ВСЕ возможные журналы и газеты, и к началу экзаменов у меня собралась внушительная пачка материалов, причем большинство из них были почти что Гонзо – особенно статьи для обожаемого мною в то время «Хулигана».\nПомню, как я гордилась и радовалась, когда из Москвы мне присылали гонорар переводом…\nВообще, мое поступление – особая история, будет время – я расскажу все в красках.\nЗа время обучения в универе со мной случалось много приятных и неприятных событий – начиная от судимости, из-за которой меня чуть не выпнули со второго курса, заканчивая моей прошлогодней поездкой в Гоа прямо во время финальной сессии.\nВсе пять лет я проводила очень много времени в разъездах, творческих муках и не всегда в здравом уме. Меня колбасило так, что сложно было понять – как вообще я умудряюсь учится, сдавать сессии и писать работы. Дело в том, что у меня было два мега-бонуса: моя любимая бабушка (она сама выпускница журфака), она очень помогала мне.\nНу, и волшебные преподаватели журфака. Творческие, неординарные, волшебные люди. По-своему сумасшедшие, всегда молодые в душе,  каждый – уникален. Каждый – одно огромное сердце.\n- До свидания, Оля. Удачи тебе. – глаза зам. декана Татьяны Алексеевны такие тёплые, такая искренняя улыбка. Мне становится так… так…\nОни всегда шли мне на встречу. Всегда ободряли меня, поддерживали.\n- Подари диск! – сам просил Лозовский – наш обожествляемый декан.  И для меня это было так важно.\nИ вот, диплом в моих руках. Синенькая корочка, листок с приложением. Я – дипломированный специалист. Вчера в клубе Дима Колезев, звезда уральской журналистики и действующий препод журфака, говорил мне:\n- Ты – мотивирующий фактор для молодых журналистов. Они любят твою музыку, они учатся там, где училась ты. Для них это важно.\nДа, я горжусь этим дипломом. Да. Это важно.\n- Оля, я хочу чтобы для тебя этот диплом был символом того, что ты умеешь доводить до конца то, что начинаешь. – сказал мне папа вечером.\nПрямо сердце щемит, эх.. я такая сентиментальная.\n", "preview": "# Всё началось с диплома.\n*Date*: 23 января 2010, 15:00\n*URL*: https://olymarkes.livejournal.com/36262.html\n\nЯ вообще не хотела его забирать – меня всегда тошнило от бюрократии и бумажной тягомотины, и Обходной Лист казался мне невыполнимой миссией. Однако, вчера утром я встала с настроем на великие дела.\nУниверситет прекрасен. Я люблю его от первой ступеньки до самого чердака,  я всегда мечтала у", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/lj_export_clean/posts_md/81864__изнанка.md", "source": "LiveJournal", "date": "Unknown", "filename": "81864__изнанка", "title": "изнанка", "full_content": "# изнанка\n*Date*: 28 апреля 2017, 00:33\n*URL*: https://olymarkes.livejournal.com/81864.html\n*Tags*: #000000\n\nПосле концерта ты выходишь из светящегося моря в такой контрастный коридор. Этот запах и цвет бэкстейджа ни с чем не спутаешь - какая-то смесь пива и еще чего-то.. Клуб, его самая не-парадная часть. Изнанка. Ты идешь по такому коридору, в котором очень мало парадного, в нем вообще ничего нет, что можно было бы пожелать. И я иду по нему с мыслью, насколько это все символично. Люди не видят изнанку, а мы в ней живем.\nМомент встречи - это момент истины, момент соединения времен и судеб, воспоминаний и настоящего момента. Ты встречаешься со всем, что когда-либо было важно для тебя. Концерт - это rush, а все остальное - это мутки и отходняки. Это жизнь;  Но ради этого взрыва ты продолжаешь делать очень много, потому что… Просто потому что.\nЗа сценой происходит очень важная часть шоу - и это я сейчас про Москву и Питер. Ко мне приходят важные для меня люди и создают особенную атмосферу. Юля и Света все в мерче стоят на мерче, Маша красит, парни заходят поздороваться, Лиза громко смеется - значит все на своих местах. Кто-то приходит познакомиться, сектанты тоже тут - обязательно.. И такая приятная суета. Мне не нужно в ней сосредотачиваться. Я хочу в ней раствориться.\nЭти райдерные бутерброды - господи, этот стол с едой -как еще один член группы - повсюду, в любом городе, один и тот же состав. С радостью съедаю один бутер на черном хлебе и пару помидорок черри, остальное - для парней, но никто никогда не съедает это все полностью, и вот этот стол с райдером - это просто бич)) Просто для того, чтобы вы представили себе полностью картинку. Мест, чтобы сидеть, редко бывает достаточно. Из развлечений - разговаривать, ржать, втыкать в телефон. Так выглядят музыканты перед выходом на сцену (если они, как мы, не бухают).\nНо вот время выходить на сцену - здесь, конечно, все собирается в одну точку внимания. И ты выходишь и живешь - даже не на сцене, а в сердце своих эмоций, в своей душе, которая может страдать, а может купаться в радотсти. Мне нравятся отношения в группе - я отношусь с любовью и уважением ко всем: к каждому музыканту и технику. Именно поэтому меня очень много - я со всеми едина, и я под защитой всех этих прекрасных парней. Я очень счастлива, что они за моей спиной и за пультом в зале. И сегодня у всех все получается: я не думаю о звуке, все хорошо;\nМы играем песни, которые не играли сто лет - и я счастлива. Нам понадобилось два года, чтобы выучить и старенькое - и сейчас мы можем снова играть все-все-все, что попадает в настроение. Ну не все… Осталось еще процентов 30. Пусть все постепенно укладывается.\nПесни эти, которые мы поем сегодня,  - это основа, и начало начал. Я писала их, когда вообще не было никакой «публики», и поэтому это самый чистый месседж. Нет адресата, никто не будет оценивать. Можно просто быть собой.\nМногие из этих песен я писала для Фили, и конечно я знала, что совершенно не важно - услышит ли он их. Любовь - это всегда история одного человека. У меня была такая любовь к нему, да и есть до сих пор, которая не про отношения, и даже не про общение. Это про такой мощный заряд, который ты получаешь в самое сердце - и ты начинаешь дышать. Ты понимаешь, что не жил до этого. Когда мы встретились - я начала дышать, и дышу до сих пор, ощущая его душу во всем, что я делаю. И конечно, все эти песни - они до сих пор живы, как живо то чувство. Я до сих пор могу писать и обращаться к нему - это неиссякаемый источник любви.\n«Я пересекаю моря, океаны, горы, чтобы пройти мимо тебя, опустив голову» - ничто лучше не опишет моей любви. Когда ты просто в другой плоскости чувствуешь, где материальное не может выразить - даже взгляд… После того, как я начала дышать, все наши встречи заканчивались очень быстро. Я могла выдавить из себя несколько слов, и убегала, и пряталась, стараясь не увидеть.. Конечно он не знал, как важно было для меня, что мы выступаем на одной сцене. Последний раз подарила ему диск «Барселоны», но продолжаю до сих пор дарить ему каждую из этих песен… Много лет его уже нет, но не для меня. «Люди идут, и машины едут мимо, будто ничего не случилось. Если тебя бы не стало - жизнь бы просто остановилась».\nВ моей внутренней вселенной это - целая галактика. Но есть и другие. Гордей принес мне РентБоя, Марка, в котором тоже так много для меня. Конечно, это символ - и уверена, для меня это что-то совершенно свое. Свое, как причина, по которой каждый из наркоманов убивает себя. Реально, зависимость - одна, но природа - она отличается. Считаю, что мне повезло побыть во всех ролях. Я была Рентоном, и конечно, была его телочкой. И эти роли всегда живы, как trainspotting на паузе. Мне это нравится. Я всегда болтаю ногами над пропастью, и это помогает мне быть свободной в настоящем. Я не выбираю жизнь, я выбираю что-то еще. Я во всем этом «еще» так глубоко, что времени на жизнь просто не остается. Вся моя ответственность, вся моя вселенная крутится, как мяч на пальце. И я ни на секунду не забываю, кто я на самом деле. И это вообще абсолютно нормально - особенно, если другие тоже в курсе.\nПоэтому все мои песни, бэйб, они по большей части об этих двух сторонах внутренней реальности. Потому что все или о любви, или о бездне, над которой я зависаю. Ну и еще о дружбе.\nДружба - это сложная штука. Мне нужно еще лет 10, чтобы понять, что это такое. Но о ней я тоже пою.\nЭтот концерт - он был таким п;здатым, конечно - все эти сюрпризы, они так оживляют меня. Мы готовимся и вы, вы с изнанки тоже готовитесь к нашей встрече. Это уже не потребительство, это уже обмен самый настоящий и равноценный - я чувствую, что я получила не меньше, чем отдала. И эти мелочи играют роль.\nРаньше я выходила со сцены и брала в руки телефон, чтобы посмотреть: как это было?! Какие фотки? Какие отзывы? Парни сидят в гримерке и сразу читают. Я… Я не беру телефон еще долго, наслаждаюсь послевкусием. Наслаждаюсь воспоминанием, чувствами; Они не только о концерте, они обо всем: о пути, прежде всего. Когда ты далеко-далеко уже от начала пути - ты видишь его весь. А раньше видел гораздо меньше. Чем больше ты видишь - тем больше твоя вселенная внутри.\nНичто не умирает. Все множится, становится глубже, лучше, полноценнее, светлее.. Так я вижу мир. Такой у меня складывается паззл.\nКонечно, еще хочется написать много чувств после концерта Jane Air, но я забыла пароль от Дурге. А еще - завтра у меня 5 лет трезвости. 5 удивительных лет, которые начались однажды с большого взрыва, из которого получился.…\nНо об этом, конечно, не в этот раз.\nПс. Кристина твои фотки рассказывают все лучше, чем я. Вот как ты так))\n", "preview": "# изнанка\n*Date*: 28 апреля 2017, 00:33\n*URL*: https://olymarkes.livejournal.com/81864.html\n*Tags*: #000000\n\nПосле концерта ты выходишь из светящегося моря в такой контрастный коридор. Этот запах и цвет бэкстейджа ни с чем не спутаешь - какая-то смесь пива и еще чего-то.. Клуб, его самая не-парадная часть. Изнанка. Ты идешь по такому коридору, в котором очень мало парадного, в нем вообще ничего не", "annotation": "Празднование периода трезвости и размышления о чистоте."}, {"path": "data/lj_export_clean/posts_md/83593__не_про_тебя_надеюсь.md", "source": "LiveJournal", "date": "Unknown", "filename": "83593__не_про_тебя_надеюсь", "title": "не про тебя надеюсь", "full_content": "# не про тебя, надеюсь\n*Date*: 13 сентября 2017, 00:23\n*URL*: https://olymarkes.livejournal.com/83593.html\n*Tags*: #000000\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и в свободное время я часто приходила туда бухать. Если помните, была у меня такая фотография - где я грустная в шапке и с тысячной бумажкой, положила подбородок на руки на барной стойке. Вот это оттуда.\nТам Ника рассказала мне про анонимных наркоманов. Я поржала, потому что не знала, что это дерьмо бывает в реальности - это же не мать его фильм про Тайлера Дердена. Потом можно следующий кадр - как я иду по дороге в Арамиле - это такой поселок недалеко от Екатеринбурга. Иду по дороге с какими-то тяжелыми пакетами и плачу от того, как мне себя жалко. Иду в свой первый реб.центр, сама, не потому что кто-то меня туда захотел положить, и даже не потому, что я проторчала все - нет..\nПросто боль была такой невыносимой, и я совершенно не знала с чего начать.\n- Ну как же я не буду бухать по выходным с друзьями в клубах?! Зачем вообще тогда жить, работать, терпеть всю эту херню которая в жизни происходит?\n- Не можешь не бухать - бухай, - сказала Ника. - Иди и бухай.\nИ я конечно пробовала без наркотиков, но с алкоголем. Я помню эти «восемь глинтвейнов, пожалуйста, четыре белых четыре красных». Еще до этого было реально такое лето, когда я смогла. Я бегала каждый день, я отлично выглядела - конечно это было тоже после неприятных событий, крайне неприятных. После очень нехорошего апреля и мая. Там был такой период, когда я очень напугала всех друзей. И вот в конце меня сильно тряхнуло, и я перестала. Там было два месяца абсолютной трезвости, просто чтобы доказать себе, что я могу. Чтобы снова почувствовать себя сильной, светлой, быть в себе.\nЯ до сих пор помню это путешествие: мы с Артемом проехали от Екатеринбурга до Анапы автостопом, жили в палатке на берегу. Потом я выпила бокал глинтвейна в уличном кафе Джемете и все - я вдруг не продолжила, не стала думать о наркотиках. Мне казалось, что я излечилась. Что я наконец-то полностью независимый человек. Но ха-ха-ха, святая наивность.\nНу и вот через месяца полтора эта картина: иду по Арамилю и плачу. И там меня встречает Ника и отводит в такой простой кирпичный коттедж, просто дом. Не больница. И вот там я аккуратно заглядываю в себя одним глазком. Я даже не ложусь в этот реб.центр. Я в него приезжаю, прихожу.. Делаю все, что делают пациенты, но как бы не сдаюсь совсем. Я ведь не такая, я особенная, я сильная, и не проторчала еще свою жизнь.\nВот помню что там я нарисовала такой рисунок: вот стою я, держу в своих руках много ответственности: группа, университет, работу, что-то там еще… А подо мной пылающая бездна. Помню, как рассказывала Нике, как у меня вообще-то нет проблем с наркотиками, зато есть со всем остальным, с восприятием тела, с моей реализацией, с моими недостатками.. Она только грустно усмехалась. Я ее понимаю, сейчас я тоже грустно усмехаюсь, когда смотрю в прошлое… Это было только начало, я вообще ничего не понимала тогда, не умела блять думать тупой своей головой.\nНе смотря на пять последующих лет, не смотря еще на один реб.центр в конце этого периода, я почему-то считаю, что я легко сдалась. Мне как-то очень сильно повезло, что я пошла в эту сторону, что из меня какой-то кувалдой жизнь не только выбивала саму возможность употребления веществ, но и заставила меня нырнуть в саму природу зависимости. К этому я и шла эти 5 лет - до 2012 года.\nКогда меня спрашивают, что такое шаги - я теряюсь, как отвечать на такое. Удивительные есть люди, которые начинают это делать, хотя жизнь не проезжается по ним катком. Возможно ли такое? Можно ли получить от них пользу, если ты хотя бы раз не причинил сам себе пиздец, близкий к смерти? Не знаю, чувак, не знаю, как рассказать тебе, что это такое, эти шаги..\nМожет быть попробуешь юнгианский анализ?\nНика до сих пор лечит наркоманов, вон открыла реб.центр. А я стала таким адептом трезвости, что люди при мне даже бухать стесняются. Кто бы мог подумать. Другая сторона реальности - она такая другая. Ты чёткий, как ретина, и уже забываешь как это - хотеть изменить этот факт. Но твоя личная бездна - она никуда не уходит, ты умеешь черпать из нее такие вещи… Короче, грущу я от того факта, что весь этот огромный опыт невозможно впихнуть ни в пост, ни в разговор, ни даже в книгу, чтобы показать, что решение любой моей проблемы на самом деле было в том, чтобы войти в реальность на 100% и осознать себя на 100%. А для этого нужно было не просто сохранять трезвость, для этого нужно было понять, почему я когда-то начала и продолжила изменять сознание. И это невозможно сделать простым размышлением. Для этого нужно работать по правилам. По правилам, которые ты готов принять, когда чувствуешь, что тебе полный пиздец. У кого-то пиздец не наступает до самой смерти, а кому-то больше везет. Но ты права, все это для чего-то нужно. И у каждого своя «ментальная горсточка». Видимо, я еще до этого целый черпак размутила, так, что мне еще на жизнь вперед хватит.\n", "preview": "# не про тебя, надеюсь\n*Date*: 13 сентября 2017, 00:23\n*URL*: https://olymarkes.livejournal.com/83593.html\n*Tags*: #000000\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и ", "annotation": "Размышления об участии в программе АА/НА и сообществе."}, {"path": "data/lj_export_clean/posts_md/7237__почему_я_не_люблю_наркоманов_и_алкоголиков.md", "source": "LiveJournal", "date": "Unknown", "filename": "7237__почему_я_не_люблю_наркоманов_и_алкоголиков", "title": "почему я не люблю наркоманов и алкоголиков", "full_content": "# Почему я не люблю наркоманов и алкоголиков\n*Date*: 25 февраля 2009, 02:48\n*URL*: https://olymarkes.livejournal.com/7237.html\n*Tags*: рэп за жизнь\n\n... особенно тех, которые думают что\n1) это все х.ня, они в любой момент могут бросить и т.д.\n2)  тех, кто думает что алкоголь\\травка\\клубная химия - это ещё типа фигня, и нечего бояца. Вообще - все всегда уверены, что бывает и хуже. Например, многие в\\в употребляющие считают, что всё ещё ништяк, если они в пах не коляца.\nпотому я знаю, насколько глубоки такого рода  заблуждения, и как легко в это заблуждение впасть и вводить остальных.  Можно всю жизнь позволять этому дерьму обманывать себя, а себе - обманывать друзей, и барахтаться в луже \"контролируемых\" зависимостей... Барахтаться целыми тусовками, убеждая друг друга что всё это - нормально.\nМне страшно, когда я заглядываю в своё прошлое. Мне страшно, потому что я думаю - а я могла ведь и не увидить всего этого...  Счастья и гармонии в абсолютной трезвости. Мне нравятся очень простые вещи, заполняющие мой день: мне нравиться водить тачку, гулять по городу, ходить в кино, проводить время с лучшими людьми на свете, заниматься музыкой, йогой, вообще - спортом, на байке своём кататься, на борде...  И с каждым новым днём без \"доппингов\" я  чувствую себя сильнее и  счастливее )\nАлко-треш, бесспорно, весело - ...?? Один раз, два.. А потом это превращается в постоянную погоню за весельем, саморазвлечением. Вся жизнь - как х.евый театр...  Я могу по этому поводу долго рассуждать. Не с высоты колокольни 3х недель без алкоголя ))))\nПросто смотрю на себя, на свой опыт - как хорошо, что мне ещё раз не пожалели здравомыслия и сил остановится, сказать \"стоп\", пока я не успела в очередной раз растерять душевную гармонию и любовь внутри меня.\nХочется ли мне иногда? Да, хочется. И самое большое желание моё - чтобы не хотелось никогда. И чтобы друзьям моим не хотелось...\nНу и вдогонку - видяшечка... Посмотрела два раза аж. Реквием по мечте - только всё так сочно, по-голливудски. У нас реальность по-другому пахнет и выглядит, господа...\nhttp://vkontakte.ru/video1964953_40951472?add=1\n", "preview": "# Почему я не люблю наркоманов и алкоголиков\n*Date*: 25 февраля 2009, 02:48\n*URL*: https://olymarkes.livejournal.com/7237.html\n*Tags*: рэп за жизнь\n\n... особенно тех, которые думают что\n1) это все х.ня, они в любой момент могут бросить и т.д.\n2)  тех, кто думает что алкоголь\\травка\\клубная химия - это ещё типа фигня, и нечего бояца. Вообще - все всегда уверены, что бывает и хуже. Например, многие ", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/lj_export_clean/posts_md/77798__transsiberian_back2black.md", "source": "LiveJournal", "date": "Unknown", "filename": "77798__transsiberian_back2black", "title": "transsiberian back2black", "full_content": "# Transsiberian back2black\n*Date*: 18 февраля 2013, 14:06\n*URL*: https://olymarkes.livejournal.com/77798.html\n\nMarkes: Тут все спят а я опять не могу\nD: Не можешь?\nD: Ножки крутит?\nMarkes: Крутит всё\nD: Ой\nD: Плохо\nD: Ты в поезде? Щас подумаю что можно сделать.\nD: Меня помню кумарило в поезде, как собаку. Хочешь расскажу?\nMarkes: Да )\nD: Ну, слушай\nЭто произошло, когда я в очередной раз решил соскочить с хмурого.\nСтепень одержимости была такой, что я даже обыскал дознувшегося на лестнице наркомана, совершенно мертвого и очень окоченелого.\nМной найден был шприц с раствором, который тот не успел себе ввести до конца (ибо содержимое представляло из себя смертельную смесь, которая убила его еще по пути к радостному приходу). Я сидел на лестнице рядом с мертвым телом и обдумывал перспективу помереть тут же.\n«Разум или безумие?» - конечно, желание вмазки проникло под кожу и зудело, словно впившийся клещ. Я вмазался из шприца только что покинувшего этот мир очередного неудачника. И...  Я не умер.\nДругой вопрос, что прикорнув на плече жмура, я был обнаружен своими знакомыми, которым ад наркомании был известен исключительно по фильмам с дебильным содержанием.\nМеня вознесли в квартиру и устроили импровизированный консилиум\nПродолжать?\nЛадно, у нас видимо односторонняя связь, ибо в таежной глуши, где следует твой поезд, лампочка Ильича и первое радио появятся лет через сорок.\nD: Итак, правда о твоем муже: продолжение.\nСовещание длилось несколько часов, пока я умиротворенно парил в астрале. Резолюция гласила: сдать негодяя в клинику, запереть дома или отвезти в такое место, где появление человека вызывает бурю эмоций у основных обитателей - белок.\nСперва меня пытались приложить в больницу. Как только мои друзья оплачивали курс детоксикации, я тут же проявлял природную смекалку: через час после ухода обозначенных лиц вваливался в приемную к врачу и писал письменный отказ от лечения.\nИ чудо: деньги, которые за меня платили, я получал на руки, за вычетом тридцати процентов. Это было не плохо, так считал и мой барыга.\nПоэтому, когда после шестого или седьмого раза я высадился в дом с мааааленькими зрачками и любовью к миру,  было принято решение запереть меня в четырех стенах.\nНу что же, длинную нитку и пустую сигаретную пачку никто не отменял, а схему товар - деньги не отменяли и подавно. Тут все было просто: по утрам мои приятели, выпив свой утренний кофе с белым хлебом и слегка вспотевшим ноздреватым сыром, отправлялись по своим делам.\nЯ же оставался на весь день дома, и у меня имелись солидные денежные запасы. Несколько волнительных манипуляций, и искомое оказывалось у меня в руках. Я устроил нехитрый тайничок в ванной, и часами, присев на краешке, игрался со струйкой воды.\nЭто так весело: она бежит, ты ее пытаешься подхватить. А она убегает. И так до бесконечности. Отличная забава могла продолжаться вечно, если бы не моя жадность. Посчитав, что цвет у порошка не тот, бухнул в ложку в два раза больше.\nНашли меня привалившимся к стене с художественной слюной – ниткой. Ванна наполнилась и текла через край, назревал скандал с соседями. Если бы я уронил свое тело в чугунное нутро, я бы попросту захлебнулся, предвосхитив события, произошедшие с винти хьюстон. Но бог берег меня дурака, я упал не в ванну.\nДальнейшие разговоры были бесполезны. У одного из подающих надежды дизайнеров нашелся какой-то дальний родственник, живущий на отшибе уральского полуострова. Бля. Я еду даже не в Мурманск. Я еду до Мурманска, а дальше на машине еще несколько часов. Сбежать оттуда можно только в Норвегию, но что мне там делать? Их язык пугающе напоминает лай.\nИтак,  я в чреве зеленого вагона, постукивающего своими колесами и поскрипывающего фанерными стенками, переборками и прочей мелкой чушью. За окном маленькие городки, больше похожие на деревеньки, глядя на которые хочется удивиться и сказать в сердцах:\n- Ни хера себе, и здесь люди живут. Вот это да.\nВторые сутки пути. Меня дико кумарит.\nКонечно, заветная пятерка была взята с собой, но она кончилась еще вчера вечером: «вроде и нет прихода уже, но я еще немножко, завтра будет завтра»\nВагон полупустой, поэтому я развлекаюсь тем, что меняю места дислокации. Я даже полежал на боковушке у туалета.\nНаступил час че.\nВернее, пиздец мне наступил. У меня адский дозняк, утром мне необходима инъекция нормального весового грамма - не барыжьей куцей херни, а полноценного такого грамма в щи.\nСначала меня пробило в пот. Это предвестник того, что скоро в животе начнет крутить, и усидеть на месте станет довольно-таки сложно. Ты не можешь провести в одной позе даже пяти сраных секунд. Меняешь положение, но облегчения нет.\nЗатем наступает очередь соплей из носа -  обильные вожжи текут ручьями. Кажется, что они сейчас начнут затапливать коридор, а в это время сосед по купе подозрительно смотрит, как его попутчик из веселого паренька - рубахи превращается в разваливающийся кусок дерьма.\nЭто был я.\nЗа окном - миллион деревьев, каждое из которых напоминает о тяжелой судьбине русского народа;\nMarkes: Ыыыыыы, мне уже легче становится, понимаю что мои муки несущественны))\nD: :))\nНеожиданно я понял, что на самом деле я очень несчастен. Есть такая вещь в кумачах: когда наркотик выходит, ты становишься таким чувствительным. Я смотрел на людей и плакал от жалости. Мне было жалко себя, их, их семьи и даже машиниста поезда.За то, что возможно он хотел быть летчиком - испытателем, а занимается тем, что на маленьком отрезке гоняет туда-сюда локомотив.\nИ тут, в процессе твоего осмысления ничтожности и бесполезности жизни приходит он.\nТы должна спросить - кто он?\nMarkes: Кто?))\nD: Адский по своему масштабу ПОНОС. Настолько ужасный, что одновременно с ним приходит и безудержная рвота.\nMarkes: Очень неудобно.\nD: Ты бежишь в туалет, и как в известном фильме попадаешь в отвратительную ситуацию. Но это еще не самое страшное. Напомню тебе, что вынести жгучую боль и неудобство от нахождения в одной позе ты не можешь.\nИ тут жизнь начинает тебя испытывать на прочность по-настоящему. Твои руки и ноги становятся, словно у буратино в детском кино, то есть еще чуть-чуть, и раздастся характерный хруст, после которого ты увидишь свои колени и локти.\nПередышек нет.\nОбычно у среднестатистического наркомана ломка длится до пяти дней. В моем случае все ограничивалось двумя. Но какими!\nПрисовокупив ко всем этим страданиям бесконечное потовыделение в виде липкой и вонючей жидкости, можно себе представить всю картину.\nМимо мелькают деревья, и это еще сильнее усугубляет рвотные позывы. К вечеру я кое-как дополз к проводнику и поросил убить меня. Пожилая женщина прониклась ко мне сочувствием и продала бутылку отвратительно пахнущей водки.\nМерзкое пойло не действует, когда тебя крутит. Вообще. Я высосал ее до последней капли, но облегчения не было. Лишь еще гаже стало в желудке.\nЯ бы отдал любые деньги и даже одну почку, чтобы у меня оказалось то, без чего я не мог, но,с каждой минутой поезд работал на удаление\nD: Тебе интересно?\nMarkes: Мне очень интересно!!! Связь пропадает постоянно.\nD: Проведя бессонную ночь в мокрых поездных простынках и выблевав все свои внутренности, я решил умереть.\nЛегко сказать. Я же не могу лежать спокойно, а покойникам не свойственно вертеться, как юла. Я даже попробовал грызть железную штучку, в которую обычно кладут книги или полотенца. Без смысла отвлечь себя.\n«Чтобы я когда нибудь еще раз» думал я, ощущая нестерпимую боль в суставах. Вымытый кальций, спущенный в унитаз - его так не хватало моему телу.\nА в мозгу летали баяны с желтоватым раствором, и все выглядело так заманчиво и красиво. В конце концов я решил делать вид, что ничего не происходит. Лишь покрикивал время от времени от нестерпимой боли и кручения в животе.\nПотом устал, и просто поскуливал.\nКогда поезд подошел к перрону, я постарел лет на сто. Упав в руки в принципе незнакомого мне человека, решил, что пусть хоть к медведю в берлогу, лишь бы эти не повторилось.\nКак прошло время до моего возвращения - это другая история.\nD: Тебе стало хоть немножко полегче? Я могу писать пока ты не заснешь.\nMarkes: Спасибо :)\nD: Не за что. Давай сделаем вот что. Ты сейчас, я так думаю, лежишь. Во первых - вытяни ножки, как только можешь. Словно в детстве, когда думаешь, что стоит потянутся - и станешь взрослым.\nДальше расслабься и подумай о левой ножке, о том, как ей хорошо, тепло и как она устала. А сейчас она будет отдыхать. Может быть ее и крутит, но сейчас ты ей разрешишь отдохнуть, и неприятные ощущения пройдут. Не сразу так - раз и все, а медленно угасая. Ножка станет тяжелой и мягкой. Потом так же и с правой ножкой надо поступить. Дальше надо закрыть глазки и подумать о том, как вы с глазастиком поедете отдыхать после Сибири. Вы много работаете, и еще раз поехать на неделю погреться вам необходимо. Папа вас отправит к солнышку. И все будет хорошо. Там вы отдохнете и глазастик опять будет смотреть, как в животике у мамы все фиолетовое.\nMarkes: :) а ты потом расскажешь мне, что было дальше?\nЧасть 2.\nНу, слушай.\nСтупив на крепкую землю кольского полуострова, я тут же был подхвачен под руки дальним родственником моего приятеля. Заднее сидение автомобиля было неопрятным, словно каждый день на нем перевозили кошек, которые мало того, что оставляли с шикарен: остроносые черные туфли, волной наплывающие треники и черная же майка «босс» не оставляла никаких шансов сомневаться, кто стоит перед тобой.\nМы быстро сговорились, и уже через двадцать минут хлюпающая носами компания двигалась к одному из болезных на хату, а наш костлявый темноочечный друг, загрузив свое тело в икарус, продолжил движение к следующим поселкам, неся с собой радость и надежду.\nМестный порошок был не плох. Конечно, подбодяжен чуть больше чем у нас, но… На трезвый организм меня просто сшибало с ног волной прихода. Напрочь забыв где живет тот, кто меня приютил, я брел по одной из двух улиц в никуда. Рядом остановилась машина и меня окликнули. Конечно, это был хозяин жилища и конечно я спалился.\n- А, ты с нашими значит сразу спелся? - он крутил руль и качал головой. - Ну ,эту проблему мы тоже решим. Завтра едем в пустой город.\nМне было хорошо, и даже запах кошачьей ссанины не мог перебить удовлетворения. Пустой город - так пустой город. Завтра было так далеко, пусть хоть на луну. Я еще не знал, что это такое, а если бы знал, то возможно это бы и послужило неплохим мотивом для ускоренной программы отвыкания от наркотиков.\nMarkes: а дальше?\nD: дальше страшно.\nMarkes: `ну расскажи.\nЧасть 3.\n- Петрович, ну ты можешь не так гнать то, а?\nНаш проводник - местный сталкер Петрович, с натяжкой походил на персонажа из Стругацких. Ну, во всяком случае в моей голове плотно закрепился образ Кайдановского в этой роли, но никак не мужичка, с лопатообразной бородой и ростом метр пятьдесят (последние пятьдесят – крайне сомнительные). Однако, видом и нравом своим Петрович был намного круче сентиментального и склонного к философии сталкера.\nЗа всю дорогу Петрович не произнес ни одной фразы. Лишь изредка он комментировал взлеты и падения автомобиля марки уаз (в простонародии - «буханка»). Отвратительно говнистого цвета автомобиль, способный подбросить вас так, что голова произведет очередной «бооом» об низкий потолок против вашей воли.\n- Ух, бля, ебись конем а! - эту фразу Петрович изрекал, когда мы попадали в яму.\n- Вот жеж блять курва-а! - так он комментировал очередной камень на дороге, вызывающий многобальное автотрясение в отдельно взятом средстве передвижения.\n- Город этот был построен под военных - вещал лекторским, унылым тоном Анатолич, принявший с утра дозу пиртосодержащего напитка в простонародии именующегося «взбодрин» в размере трех граненых стаканов. - Так вот. Место это было засекречено и на картах его не было. Места здесь дикие, но граница рядом. Норвеги, было, сунулись разнюхать, но говорят никто на ту сторону так и не вернулся.\n- Да. Были времена, - неожиданно молвил Петрович, - вот блять, курва! - машину трясло и ей было нехорошо. У меня вообще были все основания полагать, что наша ознакомительно-воспитательная экскурсия закончится за ближайшим поворотом. И хотя настроение было омерзительным, я испытывал интерес к месту, куда мы прорывались излечивать меня от болезни.\n- Позже там построили училище. Элитное, летчицкое - Анатолич был в ударе. Смакуя детали, он плел из рассказа огромный свитер, которым можно было укрыть не только нас, но и пару ближайших поселков.\n- Сам Гагарин учился там, о чем естественно имеется мемориальная доска в домике, где он жил. Дорога туда одна. И все бы ничего, но незадолго до всех этих перестроечных дел город окончательно засекретили и движение по дороге полностью прекратилось. Ну, у военных свои дела, никто туда не лез, но слухи-то - они быстрее, чем птица - поэтому через пару дней уже вовсю обсуждалось вот что: город - не поселок, а целый город! - с населением тридцать тысяч человек - исчез.\nПетрович многозначительно посмотрел на меня, чтобы я оценил важнось полученной информации. Делать нечего, по правилам следовало изобразить удивление. И хотя мне было абсолютно насрать на исчезновение какого-то там гарнизона, я сделал глаза круглыми, а брови соответственно приподнятыми:\n- Да вы что! Что же случилось?\nАнатолич был удовлетворен, и повернувшись вполоборота ко мне, пунцовый от удовольствия, по слогам ответил:\n- Никто этого не знает.\nТо есть по факту - был небольшой городок со своей инфраструктурой, аккуратными домами и даже Домом Культуры. Люди там жили, рождались, умирали. А в какой-то момент просто раз - и никого не стало. Ничего удивительного я в этой истории не увидел.\n- Так и чего?\n- а того! - Петрович разозлился моей тупости. - Ты понимаешь, в город дорога - одна. Вот мы по ней едем. А тогда по ней никто не проезжал. Тридцать тысяч человек - это сколько машин, автобусов должно было быть?\n- Ну так улетели.\n- Да как улетели-то? Там взлетная полоса для военных истребителей, там обычным самолетам ни взлететь, ни сесть.\nИ тут мне стало не по себе. Шутки на этом месте закончились, и мозг в мгновение собрал картинку того, что могло произойти там, куда мы почти уже приехали. У меня чертовски хорошее воображение, и поэтому возможных сценариев развития было около пятидесяти: от безобидного исхода сквозь леса на территорию соседнего государства до внеземного вторжения космических монстров.\n- И что было дальше? - теперь мой вопрос носил действительно практический интерес, потому что эти джентельмены собирались привезти меня в какое-то мифическое место и оставить там ОДНОГО на целые сутки. Мне идея поездки вдруг разонравилась так сильно, что я начал поцарапывать стекло.\n- А ничего. Никого не встретили, понимаешь? Ни одной души! Даже животных не осталось - ни кошки, ни собаки. Говорят что потом уже, несколько лет спустя, видели некоторых знакомых отсюда - но они старались уходить от ответа или делали вид, что не понимают о чем идет речь.\nВ конце концов, подумал я, бывал я и раньше в странных и не очень понятных местах. Почему бы не побывать еще в одном?\nНаконец чудо советского автопрома выплюнуло нас из очередного поворота и глазам представилась странная картина: перед нами, словно на ладони, у подножия небольшой сопки, лежал городок. Слева от горки виднелись постройки военного назначения.\n- Аэродром. - ткнул пальцем Анатолич.\nПравее был непосредственно сам город. Как и все северные городки, вид он имел скорее неряшливый и дома стояли там, где земля позволяла установить сваи.\n- Вот, смотри, - мимо нас проплывал выкрашенный синей, облупившейся от времени краской, бревенчатый домишко. – это - дом Первого Космонавта.\nДействительно, о великом жителе гласила старая мемориальная доска. Далее мы свернули на главную улицу, по обе стороны от нас стояли в ряд кирпичные пятиэтажки. Стекла во многих окнах были выбиты, и через них можно было рассмотреть, что вся мебель оставалась на своих местах, словно хозяева жилищ просто уехали в отпуск, а дворовые хулиганы, побили стекла и теперь прячутся где то за углом.\nВообще создавалось впечатление, что место это было покинуто. Не оставлено, не брошено, а именно покинуто, по каким-то неведомым причинам. Мужики замолчали, и только рев старого двигаеля раздавался вокруг, отражаясь от стен и создавая причудливую какофонию из хрюканья, стука и надрывного гула.\n- Вот он - символ города.\nМы выехали на небольшой пятачок – по-видимому на главную площадь городка. На ражвом постаменте стоял старый истребитель с приваренным к брюху штырем - один из первых реактивных МИГов. Время поработало над ним, и поэтому памятник имел вид очень изношенный.\nПетрович заглушил машину и, открыв скрипнувшую дверь, шагнул на землю.\n- Приехали. - Анатолич засуетился. - Вот смотри, здесь тебе еды до завтра.\nЯ начинал терять связь с реальностью. Если все мои предыдущие поездки в подобного рода места носили чисто рабочий или познавательный характер, то сейчас эти двое привезли меня хер знает зачем в такое, блять, место, где можно и привидение повстречать. Мало того, они собираются меня здесь оставить одного, с одной единственной целью: здесь меня должно попустить. Да в пизду.\n- Слушай, анатолич, а может не надо этого ничего, а? Я как бы впечатлен, и готов ехать обратно.\n- Но, - Петрович шумно открыл капот. - у Валерки помнишь, сын? Мы его возили сюда - пятый год, как бросил дерьмо это. А у Ленки – дочку тоже сюда свезли. Она, правда, потом в психушку попала – но не колется же. - Петрович поднял палец вверх, будто это был ответ на все мои вопросы.\n- Мужики, я не против того, чтобы сделать, как вы говорите, но обьясните мне: какого хера мы приехали сюда, и назовите хоть одну вескую причину, какого хуя я должен здесь остаться? Причем, блять, остаться один.\n- Ты пойми, - Анатолич положил мне руку на плечо, - когда люди-то пропали, сюда повадились молодые ездить. Пьянки, танцы - дело молодое. Никто против не был, да и в гроде тише стало. Так вот: одна компания поехала сюда очередной какой-то праздник отмечать, на двух машинах, семь человек. Что тут произошло – не понятно, но на следующий день они вернулись словно другие.\nПонимаешь, до этого они гудели чуть ли не каждый день, а тут приехали - и все. Тише воды-ниже травы. Ну, тут Петрович и смекнул, что не просто так это. Сел и поехал сюда. Как положено - взял вещей, остался ночевать. Петрович, давай ты теперь расскажи парню!\nПетрович отвлекся наконец от металлических кишочек своей любимицы, и, вытирая руку промасленной тряпкой, начал говорить. И вот что он поведал: ночью Петрович услышал голос, который вступил с ним в диалог. Голос рассказал ему то, в чем Петрович себе признаваться боялся. Например то, что жизнь он свою губит пьянками, а дети его ненавидят за это. И можно – де - все исправить, достаточно прямо сейчас прекратить.\n- И ты понимаешь, я как бы вроде и не вижу никого, а в голове идет разговор. Ну, я тогда понял, что не просто так отсюда люди то ушли. По совести-то жить, не каждый захочет. А тут такое. Бубнилка в голове и давит тебе на мозг, и так давит, что аж до слез пробирает.\nПетрович вроде не был похож на идиота. Да и я не особо верил в подобные сказки.\n- Вот, ну и стал я возить сюда ребятишек, кто по жизни потерялся. А что - никакого обмана, и никакой мистики. - Петрович улыбнулся своими коричневыми от табака зубами и снова ткнул вверх пальцем. – Ты, главное, не робей.\nДверь машины захлопнулась, на прощание меня обдало сизым вонючим дымом, и я остался один. Через какое-то время тишина стала настолько пронзительной, что я начал петь, чтобы заглушить звук ничего. На самом деле мне было ну очень нехорошо, а еще я боялся услышать звук. Любой. Это бы означало, что я тут не один. И хотя рассказ Петровича зародил во мне сомнения во вменяемости моих товарищей, сталкиваться с чем-то, что могло бы как минимум удивить меня - мне не хотелось вовсе.\nЗа полтора часа я обошел весь городок, присматривая место для ночлега, и удостоверился в том, что в город действительно необитаем. Даже маленькой птички не повстречалось на моем пути. Вернувшись на площадь, я без удовольствия съел грубоватую еду, приготовленную заботливым Анатоличем, и стал смотреть на самолет.\nТяжеленная махина висела, пришпиленная нехитрым замыслом к пьедесталу, и небольшие порывы ветра слегка покачивали ее крылья. Разадавался ржавый неприятный звук. Разглядывая его, я испытал какое-то разочарование. Нет, скорее грусть. Какое-то время назад эта штука наверняка радовала детей, внушала надежду людям, которые здесь служили… Не понятно на что, но мне так хотелось, чтобы она давала надежу. А потом люди ушли, или их похитили инопланетяне -  а этот символ теперь стоит тут в одиночестве. И так будет, пока его не изьест ржавчина до такого состояния, что вся конструкция просто рухнет на землю, но никто этого даже не увидит.\nТемнеет на севере поздно. Полярный день - интересная штука, но мне не повезло: тучи затянули небо и быстро сделали всё темнее, а следовательно - тревожнее.\nЯ решил заночевать в одной из квартир в доме, который находился рядом с музеем летчика - испытателя. Хотелось, конечно, лечь на кровати героя и понять, как ему там спалось, но на двери был гигантский ржавый амбарный замок, а в лютой абстиненции у меня сил едва хватало, чтобы сигарету прикурить. Поэтому, не особо обращая внимания на окружающее, я проследовал в первую же открытую квартиру.\nОбстановка там не отличалась от той, что была у того же Анатолича - тот же ковер, стенка на полкомнаты. Единственная разница была в том, что все было пыльное и какое-то дряхлое, плюс ко всему было холодно. Я завалился на кровать и стал ждать сна. Разные мысли обуревали мой мозг, мне мерещилось, что за дверью комнаты кто-то стоит и вот-вот войдет сюда. Тогда я стал смотреть в ту точку, и смотрел так долго, что глаза заболели и стали слезиться, но ни одного постороннего шума или шороха я так и не услышал.\nНеожиданно для себя я впал в сон. Пробуждение было резким и странным, словно я только закрыл глаза, а когда открыл их, вокруг было темно - хотя ночи в этих местах можно было сравнить с четырьмя часами пополудни в Питере. Однако, я не видел абсолютно ничего, лишь угадывал контуры предметов… и эта тишина - она давила в голову так, что в ушах появился нарастающий звон.\n- Блять, блять - мне стало не по себе. И тут в моей голове раздался (только не стоит считать меня клиническим больным) голос. Он не был похож ни на один из тех, что я слышал когда-либо. Тоесть его не было, но он был. Я не понимал произношения, но он был спокойным и каким-то, теплым, что ли.\nС удивлением я обнаружил,что кумарные боли прошли, и я больше не мерзну, как пес на морозе. Прошли даже боли внизу живота, которые сопровождают наркомана всю первую неделю отмены от наркотиков. Постепенно я начал различать смысл, и стал слушать.\nЭто «что-то» говорило мне о том, какой опасности я подвергаю себя и близких мне людей, когда делаю себе иньекции. Каждое проникновение в меня наркотика позволяет проникнуть сюда чему-то плохому, и чем больше я это делаю, тем больше Их здесь. Голос так и сказал - тем больше Их здесь.\nКонечно, блять, я бодрячком. Лежу на кровати неизвестных мне людей, которые лет двадцать назад как по какой-то причине слились из города всем составом, а в голове у меня - хер знает откуда взявшийся голос, который читает мне мораль о греховной составляющей моей жизни. Поэтому я, будучи весьма прагматичным чуваком - решил идти до конца и, преодолевая сомнения, осторожно, в голове же задал вопрос\n- А позвольте спросить, о ком идет речь? - Типа прикинулся дураком. И зря.\nГолос умолк, и звенящая тишина снова сдавила виски. Кроме того я понял, что я лежу на кровати и не могу шевельнуть ни одним мускулом своего тела. Подвижны только глаза.\nИ тут в окно стукнул камень. Если бы я мог, то наверное обгадился бы на месте, но мой желудок был пуст, как и мочевой пузырь, а поэтому я оставался в положении мумии в Эрмитаже и с ужасом ругал себя - на хера я вечно лезу со своими вопросами так не вовремя?!\nЗвук раздался еще раз и еще сильнее. - Так, я не паникую. Это всего лишь камешек в окно, который кто-то или что-то бросает, - волосы на голове зашевелились от представленной картинки, кто это может быть. По спине побежал строй муравьев.\nВдруг деревянная рама скрипнула и приоткрылась. Всё, это уже слишком. Я волевым движением рванулся и ...остался в том же положении. Сказать, что мне стало страшно - это не сказать ничего. Нечто бесформенное, черное и меняющее очертания, проникало в комнату.\nИздавая шипящий звук, неведомая тварь проталкивалась через узкую щель. Тут я понял, что достаточно уже с меня необычного и начал просто повторять, словно заклинание, детскую считалку. Мне очень хотелось закрыть глаза, но я не мог этого сделать. Это было словно в страшном дестком сне, когда ты видишь что-то очень нехорошее, но ты слишком мал, чтобы противостоять этому, а родители спят в соседней комнате, и ты даже не можешь крикнуть, чтобы разбудить их.\nНаконец мерзкая тварь плюхнулась на пол и издавая шипящие звуки поползла к кровати. Она пульсировала и меняла свои формы. Никуда не торопясь, она проползла к моим ногам и с силой сдавила их, поднимаясь все выше и выше.\nЯ чувствовал холод, словно по мне тащили ледяную глыбу. Настолько холодную, что ломило кости. В странном бесформии я начал угадывать какие-то черты. Мерзость меняла очертания, то принимая формы черт чьих-то лиц, то раздуваясь, как мохнатый мяч. Наконец, мразь достигла моей груди и выпустила что-то похожее на хоботок или жало. Он, подрагивая, словно обнюхивал меня, и двигался вверх, вверх.\nВнутри себя я кричал. Ничего сильнее я не переживал никогда, невероятным усилием я попытался вжаться в кровать и ...открыл глаза.\nВ окно светило солнце и раздавался звук клаксона.\n- Эйййй! - Петрович, милый Петрович! Пожалуй, никогда я не радовался так человеческому голосу. Это был сон, просто сон. Вскочив с кровати я схватил сумку и тут я увидел: створка окна была приоткрыта, а на подоконнике лежали два маленьких камешка.\nЕсли бы за скоростное перемещение через брошенные города давали медали, я бы стал чемпионом мира. Всю обратную доррогу я молчал и на все вопросы Петровича отвечал односложно - да или нет.\nЧерез два дня я купил себе билет в кассах и не откладывая сорвался обратно домой. Анатолич передал связку сушеных грибов, рыбы и прочие подарки родственникам, пригласил приехать на следующий год. Весь путь я просидел на полке, боясь закрыть глаза. Шипящий звук то и дело возникал у меня в голове.\nПитер встретил жарой и улыбающимися людьми.\n- Стой, давай-ка сюда. - водитель-таджик, плохо разбирающийся в устройстве улиц, наконец довез меня до знакомой парадной.\n- О, ты где пропал то? - Ча только проснулся и имел скучающий вид.\nМы сидели на маленькой кухне в хрущевке.\n- Че, вмажемся? - Ча протянул мне баян, заряженный прозрачным раствором. Я замер.\nОтчетливый звук стукнувшего камешка в стекло вызвал во мне животный ужас… стоп, я же взрослый человек.\n- Ты чего? -Ча удивленно смотрел на меня.\n- А, ничо, херня всякая в голову лезет.Подержи руку...\nFrom Spb 2 Transsiberian Trains feb. 2013\nот редактора: первая часть текста была написана в сообщениях, по строчке, и с нежностью выписывалась мной из телефона. Мой любимый писатель рассказывает мне истории на ночь, когда я не могу уснуть, некоторыми из них я просто не могу не делится.\n", "preview": "# Transsiberian back2black\n*Date*: 18 февраля 2013, 14:06\n*URL*: https://olymarkes.livejournal.com/77798.html\n\nMarkes: Тут все спят а я опять не могу\nD: Не можешь?\nD: Ножки крутит?\nMarkes: Крутит всё\nD: Ой\nD: Плохо\nD: Ты в поезде? Щас подумаю что можно сделать.\nD: Меня помню кумарило в поезде, как собаку. Хочешь расскажу?\nMarkes: Да )\nD: Ну, слушай\nЭто произошло, когда я в очередной раз решил соск", "annotation": "Рассказ о срыве и возвращении к употреблению после периода трезвости."}, {"path": "data/lj_export_clean/posts_md/75702__muzikalnaya_gonzo_recenzya.md", "source": "LiveJournal", "date": "Unknown", "filename": "75702__muzikalnaya_gonzo_recenzya", "title": "muzikalnaya gonzo recenzya", "full_content": "# Muzikalnaya Gonzo Recenzya\n*Date*: 24 июня 2012, 17:05\n*URL*: https://olymarkes.livejournal.com/75702.html\n\nЗдравстуйте, дорогие читатели. Несколько дней назад в железном почтовом ящике у дороги я обнаружила конверт. Содержимое его повергло меня в ужас: организаторы эпического фестиваля «Кубана» умоляли меня оценить творчество молодых российских исполнителей и помочь выбрать лучшего.\n– это, блять, смешно! – ну какой из меня музыкант, и тем более, блять, эксперт? - воскликнула я, и уже собралась выбросить конверт в мусорное ведро под раковиной.. Но меня остановил грозный возглас:\n– Стой! Что там у тебя?\nМой друг – культовая личность, и человек, чьего имени нельзя произносить (связь со мной может запятнать его репутацию в правительственных кругах) – он настоял на том, чтобы мы прослушали все предложенные группы и беспристрастно написали рецензию.\nМы отложили нарды, подкинули дров в камин и приступили к работе.\nГруппа ***1.\nОн предполагает, что группа ***1 – это старые институтские друзья, которые в светлое время дня торгуют опалубкой и алюминивым прутком, а после работы собираются и играют прифанкованую авторскую песню. Безусловно, если бы они выступали на Грушинском Фестивале, их бы закидали камнями, как авангардистов.\nМне же группа понравилась, особенно песня “***1”. Нежные гитарные партии, теплый, скрипучий, как старое седло, голос вокалиста – хороший саундтрек для дождливого питерского вечера.\nПить и блевать под эту музыку мне бы не очень понравилось, так что на Кубане я эту группу представляю с трудом.\nГруппа ***2!\nМой друг, слушая эту группу, плакал, потому что это ввергло его в пучину ностальгических воспоминаний о временах его студенчества. В то время стипендию выдавали советскими рублями, а город, из которого эта группа родом назывался “Горький”. Курт Кобэйн еще не задумывался о самоубийстве, а Мистер Малой во что бы то не стало собирался умереть молодым. Грув бомбил дискотеки песней “Счастье Есть”, а начинающую группу “Сплин” на ее первых выступлениях закидывали банками.\nНе дослушав первую песню до конца, мой друг побежал в магазин за шортами, клечатой рубашкой и плеером Sony Walkman; Я же осталась, чтобы дать музыкальному творчеству группы адекватную оценку.\nМне очень понравилась группа ***2! - такие бодрые, веселые ребята. Я бы с удовольствием порекомендовала бы их к участию на Кубане, но наш барабанщик Ляпа, который по совместительству играет на басу в группе Bzik, заколбасит меня на ближайшей репетиции. Поэтому – простите, ребята.\nГруппа ***3!\nК тому моменту, как я дослушала группу ***2 и перешла к группе ***3 мой друг как раз вернулся – в поп-панк экипировке и первым альбомом группы «Кирпичи» в руке. На третьем треке он разложил все в центре комнаты и устроил ритуальный костер. Стягивая с себя клечатую рубашку и белые носки он плакал – не в силах смирится с тем, как постарел Дима Спирин, что группы I.F.K. больше нет и тех, кто знает группу Scang практически не осталось в живых.\nМне группа ***3 очень понравилась, я бы с радостью пила и блевала бы под них на Кубане… Но боюсь если мы возьмем их – группа ***2 обидится.\nГруппа Scang Sattawood\nУвидев обложку диска я почувствовала неладное, и предчувствие не обмануло меня. Группа оказалась феноменально охуительной.\nПод трек Dark Is Eyed я бы прямо сейчас вмазалась героином, но боюсь тогда выступление группы ТТП на Кубане придется отменить, к тому же напротив сидит мой директор Катя, а справа - нарколог, который присматривает за мной после моего недавнего побега из реабилитационного центра для наркоманов под Псковом. Со слезами на глазах мне пришлось выключить этот гениальный трек и перейти к прослушиванию группы Алоэ Вера.\nМой друг же за это короткое время снова предался воспоминаниям: дождливый ночной лиговский проспект, с его абсолютно депрессивным красным светом фонарей и абсолютным счастьем от качественно вколотой дозы практически неразбавленного героина. Счастье омрачено только косматым неопрятным псом, который пытается вступить с ним в интимную близость сзади, пользуясь его абсолютной беспомощностью и тем, что тело лежит на тротуаре. «Даа, хорошая группа» - грустно вздыхает он.\nГруппа Алоэ Вера.\n- Это демонизированное творчество Иосифа Кобзона! – воскликнул мой друг, заткнул уши и начал раскачиваться, как старые еврей на молитве.\nЯ же не могу адекватно оценивать творчество группы Алоэ Вера, потому что они – наши бывшие друзья.\nГруппа Кактус.\nПосле прослушивания новейшей российской музыки, мы с горя решили заняться сексом. Осталась только группа Кактус и… все прошло неплохо. Так что наш эксперный совет предлагает эту группу в качестве участников самого охуенного фестиваля на свете.\nП.С. Авторы рецензии снимают с себя всю ответственность за написанное ввиду клинического идиотизма.\n", "preview": "# Muzikalnaya Gonzo Recenzya\n*Date*: 24 июня 2012, 17:05\n*URL*: https://olymarkes.livejournal.com/75702.html\n\nЗдравстуйте, дорогие читатели. Несколько дней назад в железном почтовом ящике у дороги я обнаружила конверт. Содержимое его повергло меня в ужас: организаторы эпического фестиваля «Кубана» умоляли меня оценить творчество молодых российских исполнителей и помочь выбрать лучшего.\n– это, блят", "annotation": "История реабилитации и лечения от зависимости."}, {"path": "data/ig_organized/long_200_md/2025-11-06.md", "source": "Instagram", "date": "2025-11-06", "filename": "2025-11-06", "title": "2025-11-06", "full_content": "https://www.instagram.com/p/DQtrUJsgkSF/\n\nЙоооу, сектанты! Кто стоит за тренировками, которые заставляют влюбиться в спорт снова и снова?\n\nОля Маркес — наш двигатель. Человек, который не просто тренируется, а живёт этим. Она умеет зажигать людей так, что здоровый образ жизни становится естественным, как утренний кофе.\n\nПознакомимся поближе? 10 зависимостей основателя #Sekta уже в карусели 💪🏼\n", "preview": "https://www.instagram.com/p/DQtrUJsgkSF/\n\nЙоооу, сектанты! Кто стоит за тренировками, которые заставляют влюбиться в спорт снова и снова?\n\nОля Маркес — наш двигатель. Человек, который не просто тренируется, а живёт этим. Она умеет зажигать людей так, что здоровый образ жизни становится естественным, как утренний кофе.\n\nПознакомимся поближе? 10 зависимостей основателя #Sekta уже в карусели 💪🏼\n", "annotation": "Личный опыт борьбы с зависимостью и путь к выздоровлению."}, {"path": "data/daily2025_export/posts_md/2025-01-22__1253__приветики_столько_всего_хочется_написать_столько_идей.md", "source": "Daily2025", "date": "2025-01-22", "filename": "2025-01-22__1253__приветики_столько_всего_хочется_написать_столько_идей", "title": "1253 приветики столько всего хочется написать столько идей", "full_content": "# 2025-01-22 — приветики столько всего хочется написать столько идей\n*Datetime*: 2025-01-22T22:51:11+08:00\n*Message ID*: 1253\n\nПриветики. Столько всего хочется написать, столько идей приходит в течение дня, но к вечеру остается мало сил на рефлексию.\n\nЧувствую себя сверх продуктивной. У меня в чате нового альбома 10 песен, в которых мне очень нравится главное: тексты. Мне осталось дописать один припев про который я думаю - нужен он вообще или нет? Сегодня одну песню слушала на повторе и просто не могла переключить. А песня про Таню наконец-то стала такая прямо танина, вся искрится.\n\nЯ много времени провожу в шкафу (где записываю вокал). А еще много ем. У меня ПМС и мне не очень нравится, как я выгляжу, и еще живот постоянно то ли полный, то ли bloated, но при этом все мышцы в тонусе и я чувствую себя спорт-машиной.\n\nВчера было смешно, мы гуляли на закате и я рассказывала про все, что я успеваю сделать - просто супер движение по всем проектам. И Дима с Вадимом угорали, что я должна написать песню про сверх продуктивность. Я сразу же предложила мою любимую фразу с которой я берусь за все, надо представлять ее в стиле дэдметал: «ЯЯЯЯ ВЫ@БУ ЭТИ ДЕЛАААА» - а потом мы подумали что надо выпустить альбом с 8 версиями этого трека в разных жанрах, от LoFi и реггей до металла) И везде одна строчка. Надо включать перед рабочим днем, чтобы все получилось сделать)\n\nИнтересно еще про хейт. Я вот не понимаю, это эффект терапии, Куприянова или всего сразу - но мне что-то в этом даже нравится. Раньше мне было сложно выдерживать волны негатива в мой адрес, когда не один человек, а прям много людей осуждают меня. Я могла плохо спать, тело было в тревоге. Сейчас вообще ничего такого нет (тут выходили всякие разборы на подкасты, юморист какой-то делал рилз, впервые можно сказать такое внимание от левых людей), и мне с этим нормально, я могу почитать даже самые оскорбительные комментарии, мне интересно). Вообще ушла иллюзия, что люди про меня что-то думают постоянно плохое, в основном люди думают о себе, а чужая жизнь их если и отвлекает от себя - то крайне ненадолго. Возможно, если бы я была еще честнее - меня осуждали бы еще больше. И у меня есть такая цель, открываться этому миру без страха, чтобы не влияло это мелочное желание чтобы меня все любили, чтобы оно не владело мной.\n\nПри этом мне кажется у этого захода в уязвимость есть и хороший эффект - я чувствую очень близкий контакт с моим читателем, с моей аудиторией. И это даже не про мои каналы - как будто даже к хейту и других комментариев много, и люди не просто защищают меня, они как-то очень круто пишут о своем мнении (например, что им не близка полиамория), но они знают меня давно и хорошо чувствуют и понимают, и нет причины загонять меня в привычные рамки - типа «дайте Оле жить, как она живет)». И многие пишут, что читают меня давно, и слушают мои песни, и что в целом ничего нового - я давно ищу ответы на все эти вопросы и пытаюсь быть честной, и делюсь этим со всеми, кто читает.\n\nА так день хороший. Серфинг, тренировочка, закат - все было, не только работа. А еще вечером ужинала с Ирис (хозяйкой Muka, из которой все мои супер штаны шелковые и много всего) и с Никой Суринович, оказывается они давние подруги. Ника - важный человек в моей жизни, в мои 18 лет она рассказала мне про «анонимных наркоманов», она открывала ребцентр в Екатеринбурге и это был мой первый ребцентр. Но это отдельная история, не для моего маленького дневника.\n\nReactions: ❤826 ❤‍🔥192 🔥78 👍37 🕊16 😁15 🏆7 ⚡4 🗿2 🥰1 🦄1\n", "preview": "# 2025-01-22 — приветики столько всего хочется написать столько идей\n*Datetime*: 2025-01-22T22:51:11+08:00\n*Message ID*: 1253\n\nПриветики. Столько всего хочется написать, столько идей приходит в течение дня, но к вечеру остается мало сил на рефлексию.\n\nЧувствую себя сверх продуктивной. У меня в чате нового альбома 10 песен, в которых мне очень нравится главное: тексты. Мне осталось дописать один пр", "annotation": "Размышления об участии в программе АА/НА и сообществе."}, {"path": "data/vi_vse_nepr_export/posts_md/2025-01-10__255__первые_4_часа_полета_прочитала_300_страниц.md", "source": "Vi Vse Nepr", "date": "2025-01-10", "filename": "2025-01-10__255__первые_4_часа_полета_прочитала_300_страниц", "title": "255 первые 4 часа полета прочитала 300 страниц", "full_content": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:06:57+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 255\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давало мне поддержку в трезвости, но не давало душевного покоя.\n\nВ 24, после рехаба (который состоялся после срыва - 2 года чистоты и снова отчаяние, что надо начинать с нуля), начала собственно работу по «руководству» 12 шагов. Каждый шаг содержит несколько десятков вопросов, на которые ты отвечаешь примерами из своей жизни, и потом зачитываешь их «спонсору» - волонтеру из программы, у которого опыта больше, чем у тебя. Спонсор дает тебе обратную связь. В «Эйфории» классно показаны отношения Ру и ее спонсора.\n\nЯ написала все 12 шагов, причем дольше всего я писала 4й шаг (4 года) и раздел «обиды»  - он занял у меня около 3х лет. Это самая мощная в плане дисциплины и усидчивости терапевтическая работа, которую я проделала в своей жизни. Это исцелило меня от многих навязчивых состояний, которые меня преследовали - прежде всего от болезненных реакций на взаимодействие с миром. Пока я писала шаги - случалось некоторое дерьмо во всех сферах жизни, и все это было отличным полигоном для практики и рефлексии. И когда меня спрашивают, что в жизни дало тебе самый большой буст, я отвечаю: трезвость и шаги. Причем первые 6 лет трезвость без шагов работала плохо, мне надо было разобраться с причиной моей зависимости, чтобы перестать жить ту жизнь, которая доставляла мне боль.\n\nПервый терапевт у меня появился после развода. Я начинала тогда отношения с Вадимом и была в ужасе от перспективы потратить годы жизни прекрасного человека и в итоге как обычно все разрушить, разочаровать его и себя, повторить свой дурге-цикл и остаться с ощущением, что всё говно и я говно. Смешно, что тут вспомнила свое стихотворение школьных времен:\n\n «Брачо ходит злой.\n   На дворе зима.\n   Люди все говно.\n   Да и я сама»\n\nПервый терапевт мужчина неплохо так меня поправил, во-первых я поняла, что для брака моего я сделала очень много, и что не все в отношениях зависит от меня, и все может быть прекрасно, а может и не быть, но в любом случает само по себе имеет смысл, как и то, какая я во всех своих травмах и компенсациях и есть то, в числе прочего, за что меня любят и хотят со мной быть. Я перестала демонизировать и отвергать свою дурге-часть, оставила тревоги и позволила счастью личной жизни быть со мной в моменте, а в терапии перешла к проблемам на работе. Почувствовала, что мой терапевт от этих тем скучает и нет у него такой страсти к этой теме, и это стало толчком для смены терапевта.\n\nПоследние лет 6 я в терапии с опытной женщиной, кандидатом наук и по моим ощущениям очень классическим системным терапевтом. В эту терапию я зашла с непринятием своей жесткой части. У меня была такая метафора: я хочу быть Белоснежкой, а на самом деле я злая королева. В соц сетях я играю в «свет мой зеркальце скажи», постоянно присутствую своей хорошей частью, а плохую стыдливо прячу, я не хочу быть жесткой, я хочу быть мягкой, я хочу быть доброй, я хочу, чтобы меня все любили, а меня не любят и я их за это ненавижу, и себя ненавижу. У меня не было границ на работе, я все принимала очень лично, с сотрудниками я часто была в позиции маленькой девочки и хотела их одобрения, я страдала заискиванием и пипл-плизингом, при этом тень прорывалась заскоками, истериками, жестокостью и неадекватными поступками, за которые я потом себя винила. То есть я понимала, как бы я хотела себя вести и каким боссом я хотела быть, но почему-то у меня не получалось. Я играла роль, с которой я не справлялась. Носила маску из которой торчала неприглядная тень. Это все бесило и создавало лав-хейт отношения с работой.\n\nЛонг стори шорт: эта терапия создала вау-эффект. Вот когда я читаю книги Ялома, мне хочется написать и про мой процесс, а еще лучше - узнать, как это было с другой стороны, как терапевт видит нашу работу.\n\nReactions: 🕊558 💊138\n", "preview": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:06:57+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 255\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по се", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/daily2025_export/posts_md/2025-01-10__1183__первые_4_часа_полета_прочитала_300_страниц.md", "source": "Daily2025", "date": "2025-01-10", "filename": "2025-01-10__1183__первые_4_часа_полета_прочитала_300_страниц", "title": "1183 первые 4 часа полета прочитала 300 страниц", "full_content": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:09:40+08:00\n*From*: Olymarkes Daily\n*Message ID*: 1183\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе является терапевтичным, не совсем групповая терапия, но штука, которая работает похожим образом. Это давало мне поддержку в трезвости, но не давало душевного покоя.\n\nВ 24, после рехаба (который состоялся после срыва - 2 года чистоты и снова отчаяние, что надо начинать с нуля), начала собственно работу по «руководству» 12 шагов. Каждый шаг содержит несколько десятков вопросов, на которые ты отвечаешь примерами из своей жизни, и потом зачитываешь их «спонсору» - волонтеру из программы, у которого опыта больше, чем у тебя. Спонсор дает тебе обратную связь. В «Эйфории» классно показаны отношения Ру и ее спонсора.\n\nЯ написала все 12 шагов, причем дольше всего я писала 4й шаг (4 года) и раздел «обиды»  - он занял у меня около 3х лет. Это самая мощная в плане дисциплины и усидчивости терапевтическая работа, которую я проделала в своей жизни. Это исцелило меня от многих навязчивых состояний, кот чу быть жесткой, я хочу быть мягкой, я хочу быть доброй, я хочу, чтобы меня все любили, а меня не любят и я их за это ненавижу, и себя ненавижу. У меня не было границ на работе, я все принимала очень лично, с сотрудниками я часто была в позиции маленькой девочки и хотела их одобрения, я страдала заискиванием и пипл-плизингом, при этом тень прорывалась заскоками, истериками, жестокостью и неадекватными поступками, за которые я потом себя винила. То есть я понимала, как бы я хотела себя вести и каким боссом я хотела быть, но почему-то у меня не получалось. Я играла роль, с которой я не справлялась. Носила маску из которой торчала неприглядная тень. Это все бесило и создавало лав-хейт отношения с работой.\n\nЛонг стори шорт: эта терапия создала вау-эффект. Вот когда я читаю книги Ялома, мне хочется написать и про мой процесс, а еще лучше - узнать, как это было с другой стороны, как терапевт видит нашу работу.\n\nReactions: ❤723 🔥125 👍53 ❤‍🔥37 🙏22 👀4 🤗2 🤣1\n", "preview": "# 2025-01-10 — первые 4 часа полета прочитала 300 страниц\n*Datetime*: 2025-01-10T20:09:40+08:00\n*From*: Olymarkes Daily\n*Message ID*: 1183\n\nЗа первые 4 часа полета я прочитала 300 страниц книги Ялома «палач любви». Он всегда меня погружает в мысли о моей терапии. Базой своей терапии я считаю работу по шагам - с 19 до 24 лет я просто посещала собрания 12-шагового сообщества, что само по себе являет", "annotation": "Опыт работы с программой 12 шагов и духовное выздоровление."}, {"path": "data/daily2025_export/posts_md/2025-01-06__1169__вчера_катя_кейльман_спросила_комментариях_проживала_любовь.md", "source": "Daily2025", "date": "2025-01-06", "filename": "2025-01-06__1169__вчера_катя_кейльман_спросила_комментариях_проживала_любовь", "title": "1169 вчера катя кейльман спросила комментариях проживала любовь", "full_content": "# 2025-01-06 — вчера катя кейльман спросила комментариях проживала любовь\n*Datetime*: 2025-01-06T21:49:52+08:00\n*Message ID*: 1169\n\nВчера Катя Кейльман спросила меня в комментариях: как бы я проживала любовь, если бы она была не взаимной?\n\nСегодня я весь день качаюсь в колыбели каких-то очень сладких внутренних ощущений присутствия этой моей любви во мне, и я вспоминаю слова кажется Лены Дегтярь. Она сказала: Педро случился не только с тобой, он случился с Димой, и вообще со всеми нами. И сейчас, если оглянуться на все, что происходило, то кажется что в этой истории много участников, но на самом деле все дело в нем и в этой встрече.\n\nУ меня есть хороший пример, Катя, чтобы ответить на твой вопрос. Когда мне было 15 лет, я встретила человека, с которым у меня случилась мнгновенная любовь такой силы, что меня сбило с ног. Я спела ему свою песню в кругу музыкантов регги фестиваля, куда я попала абсолютно случайно, просто шатаясь по Анапе, и он даже записал ее на портативную студию. И еще он подарил мне кольцо, которое когда-то ему подарил Олди. И он сказал мне: у тебя все получится. Он был музыкантом, художником, его рисунки - это татуировки на моих руках, самые мои первые. У него была жена и ребенок, это была всего одна встреча, всего несколько часов вместе - у нас ничего не было, за что надо было бы исповедоваться. Но эта любовь и эта встреча изменила все. Я написала о нем десятки песен, я сделала группу, и все что было после - начинается с него. У меня был его номер, по которому я никогда не позвонила. Но я прожила каждую каплю этой любви, и она до сих пор живет во мне, и всегда будет жить.\n\nТак вот, иногда момент встречи несет в себе весь потенциал будущего, и я его так и ощущаю. И момент, когда я встретила Педро, был таким же. Я ощутила всю эту силу грядущих перемен, и я не знала, о чем это - взаимно ли это, будем ли мы вместе, или это про большую боль и испытания. Я ощутила масштаб, и дальше все только разворачивалось и открывалось. Моя любимая фраза в 12 шагах: «мы молились лишь о знании Его воли». То есть все что происходит с нами - это воля Бога, но ясность об этом, о том, что это значит - не самая простая штука. У меня интересным образом работает вся система, я знаю следующий шаг и действую из этого знания. У меня нет вариантов и выборов: так или так. Я говорила Педро: «У меня нет вариантов НЕ выбрать тебя. Я выбираю тебя всем своим существом. Это сильнее всего. Но если у тебя есть варианты и выборы - я приму любой».\n\nВ моменты после тантры многие говорили, что вообще это все возможно случилось именно для Димы. Это открыло его сердце, он изменился, у него даже черты лица стали мягче. У него наладился контакт с важными людьми, он вообще осознал ценность жизни. Педро случился с ним в первые недели даже больше, чем со мной. Дима взял от этой практики все. Он ехал на тантру, чтобы оживиться. И именно практика с Педро стала самой оживляющей за всю историю.\n\nУ меня не было ясности, выбирают ли меня, и как меня вообще можно выбрать со всем моим багажом, хаосом, я в этом плане реалист. Мне кажется, что если он выберет меня - это будет чудом, и что это мало возможно. Мне кажется, что я люблю сильнее. Мне кажется, ему не нужны такие проблемы. Но потом, когда в каждом контакте я ощущала, что это не только мое, это НАШЕ - любовь только раскрывалась, показывала новые и новые грани.\n\nМне так хочется больше писать о нем - о его энергии, которая похожа на божественный свет с пузырьками шампанского) Как все танцует от его присутствия, как все люди как будто подпитываются от этого источника - и взрослые, и дети, и конечно же совсем особенным образом подпитываюсь я. Я чувствую себя и маленькой девочкой, и любимой женщиной, и чувствую себя шаманкой или богиней разрушения, которая может развернуться в полную силу, и тут я ему абсолютно по плечу. И еще это мой идеальный тантрический партнер. Я хочу с ним практиковать тантру, и не хочу меняться партнерами, я чувствую безопасность, я чувствую себя выбранной, у меня нет страха и поэтому нет желания бросать вызов этому страху, в плане экспозиции к ревности. Я тут вообще в доверии и расслабленности, что бы ни случилось.\n\nИ еще я наблюдаю за кругами по в зывал что у него в 23 высшее образование и 10 научных статей, и что он учился в Эрмитаже. Такой классный, такой живой, такой светлый ум. Так и вижу в нем гениального мальчишку, которого все обожают. Он уже умер.\n\nЯ лежала в реб.центрах и ходила на группы со своих 19 лет, я это все видела вживую, даже если не была прямым участником. И это полезно освежить в памяти. Понять, что этот мир где-то существует сейчас, и там живые люди, большая часть из которых уже обречена, но всегда есть немого надежды на хороший конец. Как же хочется, чтобы у них получилось найти путь к свету.\n\nТак, возвращаюсь к своему дню. Созвонились с Дориновым, обсуждали документальный фильм, который уже есть (где-то на половину), и который был показан у меня на ДР. Но там хочется больше архивных кадров и больше той истории. О том, что было в начале. Так что договорились работать дальше, искать партнеров/спонсоров, чтобы зафинансировать команду. С Alai Oli я вообще не беру никаких денег, кроме 1/7 части с концертов. И даже такой важный проект финансировать сама не хочу, это должно быть нужно еще кому-то кроме меня и Доринова. Так решили.\n\nПосле звонка копалась с архивами и билась с Vk чтобы найти мои заметки старые. Там есть прям важные раритеты.\n\nПотом записала всякие мини интервьюшки для команды. Попросила Gconf дать немного инфы рабочих кейсов для одной из программ секты (без спойлеров))\n\nКстати мы анонсировали поиск протагонистов - AI контентмейкеров на следующий поток Gconf\n\nПотом приехали Вадим и дети. Дети сразу убежали с друзьям, а мы сидели на крыше и пили какао на закате втроем.\n\nВечером мы с Димой заехали в баню «Чертовы Ворота» и классно друг друга попарили веничками.  Туда и обратно ехали под подкаст Хубермана с Dr Martha Beck - у нее три гарвардские степени и она тоже живет с двумя партнерами.\n\nУ нее там в подкасте оч крутые мысли про отношении, например, в вольном переводе: «когда твой партнер имеет зависимость от того, как ты удовлетворяешь его потребности (you pleasing him) у тебя появляется созависимость от его реакций, и ты теряешь себя». Иногда для отношений полезна «жесткая любовь» где ты говоришь: «я не буду это делать, не буду предавать себя» и ты даешь человеку принять/не принять тебя в твоей правде.\n\nВечером классно поболтали со старшими детьми. Они задавали вопросы про зависимость, в том числе про мой опыт, как я с этим справилась. Все это по мотивам встречи с их папой. Надеюсь, там все тоже будет хорошо. Хочется верить.\n\nПод конец вечера все таки победила VK, нашла свои заметки и читаю 2007 год. Уф.\n\nLinks:\n- https://t.me/+ExUMUANBghc3ZjIy\n- https://t.me/gptlovers\n- https://podcasts.apple.com/us/podcast/huberman-lab/id1545953110?i=1000664344988\n- https://momastery.com/blog/we-can-do-hard-things-ep-121/\n\nReactions: ❤425 🔥72 👍38 🌚16 💔10 🥰4 🦄4 🙏2 ❤‍🔥1 🕊1\n", "preview": "# 2024-08-15 — проснулась под дождь классно когда не надо\n*Datetime*: 2024-08-15T04:09:00+08:00\n*Message ID*: 378\n\nПроснулась под дождь. Как же классно, когда не надо НИКУДА вставать и нет внутренней тревоги. Иногда бывает нет рабочих задач, но все равно надо бежать к детям их кормить, ощущение что все там происходит и как то надо включаться.\n\nМы валялись, болтали, рассказывали сны. Потом утренняя", "annotation": "Работа с созависимостью в отношениях и выздоровление."}, {"path": "data/olydaily_export/posts_md/2024-08-14__367__вдохновилась_димы_сделано_канале_комментарии_группа_которой.md", "source": "OlyDaily", "date": "2024-08-14", "filename": "2024-08-14__367__вдохновилась_димы_сделано_канале_комментарии_группа_которой", "title": "367 вдохновилась димы сделано канале комментарии группа которой", "full_content": "# 2024-08-14 — вдохновилась димы сделано канале комментарии группа которой\n*Datetime*: 2024-08-14T04:43:23+08:00\n*From*: Olymarkes Daily\n*Message ID*: 367\n\nЯ вдохновилась как у Димы сделано в канале - что комментарии это группа в которой люди могут общаться вне зависимости от поста, который они комментируют. Так получается и из-за визы. На этой волне я залипла на документалки «Выжившие» с которыми в т.ч. Работал Дима Марков. Видео в которых наркоманы ведут свою наркоманскую жизнь, ищут закладки, варятся на воде из болот, колятся в пах, у них гниют конечности и всякое такое. Современные «подвалы дыбенко» только с классным монтажом. На ютубе есть бесплатные версии, а я смотрела платные без цензуры про Эл, такую красивую нарко-блогерку «Мама я в Сибири», которая любит спорт и здоровое питание, очень умная, начитанная, периодически пытается бросить торчать, а вчера вот решила покончить жизнь самоубийством в прямом эфире.\n\nПосмотрела пару серий и поняла что все мои проблемы это хуйня вообще и пошла делать йогу от Дианы Дикши. Сегодня была практика Луны, ее надо делать именно в понедельник.\n\nЕще созванивались с Османом, начали планировать новую GPTконфу - на этот раз для контентмейкеров. Скоро начнем искать протагонистов - тех, кто уже круто использует АИшки в работе, а то теоретиков весь интернет, а кто реально делает крутые кейсы не только в качестве демонстрации - тут еще надо поискать.\n\nVahue тоже обсудили. У нас солд-ауты на ретриты Куприянова в Дубае и Лиссабоне, есть еще места на Бали, будем анонсировать. Еще ретрит Пемы в ноябре в Португалии - вот к нему мне как раз и нужна виза, которой пока нет( Но я сейчас сижу и думаю, у меня есть еще одна попытка в Джакарте. Если и там не дадут, значит, возможно, мне туда и не надо.\n\nЗавтра из дел - надо выложить вакансии.\n\nА еще сегодня звездопад, будем ночью смотреть на крыше.\n\nReactions: ❤521 💔251 🍓34 😭28 👍14 🙏12 🙈2 💊1\n", "preview": "# 2024-08-13 — визу не дали плакала потому жаль всех\n*Datetime*: 2024-08-13T02:50:36+08:00\n*Message ID*: 346\n\nВизу не дали и я плакала. Потому что очень жаль всех потраченных сил. Того, что папа ехал 800 км чтобы передать документы, что я ехала в ночь после концерта уставшая и стояли мы там 3 часа у окошка, жалко сбор 4х жирных папок документов, 60 к невозвратных взносов, и конечно жалко что сейча", "annotation": "Рассказ о срыве и возвращении к употреблению после периода трезвости."}, {"path": "data/vi_vse_nepr_export/posts_md/2024-01-04__231__интересная_штука_произошла_нас_димой_периодически_ведём.md", "source": "Vi Vse Nepr", "date": "2024-01-04", "filename": "2024-01-04__231__интересная_штука_произошла_нас_димой_периодически_ведём", "title": "231 интересная штука произошла нас димой периодически ведём", "full_content": "# 2024-01-04 — интересная штука произошла нас димой периодически ведём\n*Datetime*: 2024-01-04T23:11:59+08:00\n*From*: Вы все живёте неправильно\n*Message ID*: 231\n\nИнтересная штука произошла у нас тут. Мы с Димой периодически ведём практики, которые прежде всего дизайним для себя. Роль ведущего минимальна, люди отвечают на вопросы, исследуя разные темы «друг об друга». Такую практику на днях мы вели на Бали, в Wasia, где мы теперь проводим разные ивенты.\n\nТема была такая: близость, контакт, разные отношения, «функции» которые мы хотим видеть в отношениях  и то, что мы сами хотим отдавать. У нас были вопросы, и мы на них отвечали.\n\n ⁃ Чего я хочу в отношениях, что из этого я хочу получать с партнером, а что с другими людьми?\n\nНа всей улице выключили электричество, не работали микрофоны, и настроение было так себе. Днём мы брейнштормили, и шло тяжело. Мы спорили про вопросы и про протоколы, и вообще пришли к тому что слишком зациклились в ведении всего вместе, впереди у нас стояли практики с другими ко-фасилитаторами, и где-то это ощущалось как свобода и новое дыхание для нас обоих.\n\nНа практике можно было остаться в роли ведущего, но мне было очень интересно самой поотвечать на вопросы и послушать Диму, в итоге мы вели практику и параллельно отвечали друг другу на заданные вопросы, пока люди отвечали на них же в парах и в группах. Это было очень интенсивно  - и я слышала какие-то тяжёлые для себя вещи, и чувствовала, что все что я говорю тоже воспринимается тяжело, но при этом как будто не воспринимается лично, эти вопросы раб
