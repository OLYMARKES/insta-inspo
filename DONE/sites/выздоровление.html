    <script>
        const posts = [{"path": "data/lj_export_clean/posts_md/76690__поможемникеспастижизнь.md", "source": "LiveJournal", "date": "Unknown", "filename": "76690__поможемникеспастижизнь", "title": "поможемникеспастижизнь", "full_content": "# #ПоможемНикеСпастиЖизнь\n*Date*: 25 сентября 2012, 15:21\n*URL*: https://olymarkes.livejournal.com/76690.html\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офигенно, ну, это я так считала.\nСледующий кадр – я с какими-то пакетами иду по поселку Арамиль и рыдаю в три ручья, мне так плохо, что не хочется жить – причем уже давно, даже когда я не торчу, даже когда мне удается прожить без наркотиков несколько дней – ну, по той причине что денег на них уже нет, или потому, что все мои друзья уже отказываются иметь со мной хоть какие-то дела, - мне хочется сдохнуть, потому что жизнь эта не имеет ни цели, ни смысла.\nИ вот – иду я по поселку Арамиль в реабилитационный центр «Зазеркалье», а Ника меня встречает на дороге, обнимает, улыбается и гладит меня: «Ну чегооо ты… Плачешь, девочка? Ну поплачь…» наверное с этого момента Ника всегда была мне мамой.\nОна такая маленькая, такая хрупкая – ниже меня на голову целую, ее можно обхватить и спрятать… Но при этом она – такой ЧЕЛОВЕК. Она как будто находила нас в темном-темном месте и отводила туда, где свет.. Я помню со мной в той реабилитации лежал один парень, ему было 30 лет и кололся он из них половину. И он не мог поверить в Бога, и я помню тот самый момент когда что-то изменилось… Ника всегда находила такие слова, которых не находилось у меня - даже в голове.. И в тот момент она нашла слова для него. И он сказал… «да». Сейчас у него двое детей.\nЕсли бы не она – не было бы этого альбома – Снежная Барселона. На этом диске даже есть ей персональное, огромное СПАСИБО. И за все, что было после – за все наши записи и концерты (а они ведь наши дети) я благодарна ей, она всегда была рядом.\nЕе голос – я так люблю ее слушать, ее вот эту вот манеру смеятся, жестикулировать, что-то показывать. Если ее увидеть один раз – никогда не забудешь, если один раз с ней провести время – подсядешь навсегда.\nПоследние годы она жила на Красных Воротах в маленькой комнате в коммунальной квартире – там никто не мог ужиться из за сумасшедшей соседки Линды Эдмундовны. И только Ника смогла с ней совладать. Так вот – мы с Alai Oli приезжали в Москву выступать, и могли всей группой завалится ночевать к ней – она никогда не отказывала нам, самый терпеливый человек на свете… Как же хочется отплатить тебе, Ника, за все тепло, которое ты дала мне и моим друзьям.\nНика уникальная. Она уникальная, невероятная харизма – такой метр с кепкой, при этом самая настоящая женщина, красивая, нежная, открытая, дерзкая, веселая до разрыва и печенок… и мудрая настолько, что на несколько тысяч человек хватает ее мудрости, и так хочется, чтобы ее узнали еще больше людей… Чтобы она помогла и другим. Чтобы она была здорова, счаслива и всегда, всегда, всегда рядом.\nДля меня это очень, очень важно.\nСейчас у Ники нашли рак, и она конечно никогда не скажет и не попросит сама, но ей очень нужна наша поддержка, наши молитвы, наша помощь. Лечение очень дорогое, но нас много и вместе мы его потянем, и если у вас в сердце отозвалась история моего друга и учителя Ники, то вы тоже можете помочь. Мы все, ее друзья, будем вам очень благодарны.\nВот это реквизиты для финансовой помощи:\nВы можете положить деньги на этот счет: 5331572019702601, в любом салоне связи ЕВРОСЕТЬ.\nА так же, перевести сумму на карту Сбербанка: 4276380066196630.\nА вот группа вконтакте, где вы можете написать Нике слова поддержки!\n", "preview": "# #ПоможемНикеСпастиЖизнь\n*Date*: 25 сентября 2012, 15:21\n*URL*: https://olymarkes.livejournal.com/76690.html\n\nПервый раз я увидела Нику в тот период моей жизни, когда я думала, что у меня все хорошо. Это было раннее лето, Екатеринбург, зеленая лужайка у клуба 2КУ. Тогда Ника первый раз рассказала мне про анонимных наркоманов – я посмеялась, конечно. Какие там наркоманы – у меня в жизни все офиген", "meaningful_title": "История Ники - спасение через реабилитацию", "final_title": "Ника - наставник из Анонимных Наркоманов", "final_annotation": "История Ники, которая помогала автору в реабилитации и стала наставником в программе АН.", "display_date": "25 сентября 2012, 15:21"}, {"path": "data/lj_export_clean/posts_md/87992__scar_tissue_автореферат.md", "source": "LiveJournal", "date": "Unknown", "filename": "87992__scar_tissue_автореферат", "title": "scar tissue автореферат", "full_content": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу отложить телефон, читая Двач до 2х часов ночи. Когда я одна - я как будто остаюсь дома без родителей. Когда нет жесткого контроля извне - я как будто разрешаю себе все. Но разве при людях я запрещаю? Разве люди являются гарантом моего правильного поведения? Ну нет же (это я успокаиваю себя). Если бы я чаще была одна - это бы устаканилось. Я бы компенсировала себе все, а потом бы вернулась на привычные рельсы. Но одиночество - это недоступная.. не буду говорить, что роскошь. Опция. Недоступная в длительной продолжительности опция.\nКогда-то анонимные наркоманы сказали мне: может быть торчать ты еще будешь, но удовольствие мы тебе точно попортим. Не сказать, что я получала удовольствие от наркотиков до этого. Во всем этом было очень много истерики - я хочу, хочу так сильно, как ничего на свете не хотела. Даже не так: мне надо. Мне просто надо. Есть? Дайте. Есть сильнее? Дайте. Есть больше? Дайте. Точно так же анонимные наркоманы попортили мне удовольствие от многих других вещей в трезвости- например, от втыкания в телефон или от покупок. Даже если я продолжаю делать что-то подобное - я осознаю, когда мной руководит зависимое поведение. Я не употребляю 6 лет и 7 месяцев, но при этом я каждый день ловлю себя на зависимом поведении. Думаю, именно это помогает мне оставаться в потоке - продолжать писать шаги и не пробовать изменять сознание в надежде, что сейчас это приведет меня куда-то в место поприятнее, чем то, где я была 10 лет назад.\nДля начала я нарисую вам хронологию своей зависимости, я же никогда этого не делала раньше в своих лонгридах, только в тетрадке из реб.центра, которую никто из вас не читал. Все равно придется делать это в мемуарах) Так что подарю вам эксклюзивчик.\nИтак. 12 лет - я начинаю курить сигареты, пробую травку. Мне некомфортно, кажется что я предаю что-то в себе, что-то важное. У меня есть подаренный мне пакет травки - я не пользуюсь им, предлагаю его папиной подруге, которая курит. Она рассказывает папе, он достаточно жестко реагирует, отвозит меня в общественный центр для наркоманов, пол года я на домашнем аресте, ко мне относятся как к наркоманке, мне показывают фильмы про подвалы дыбенко, я вообще не понимаю - за что так со мной. У меня же была своя голова… Была. Когда к тебе относятся, как к наркоману - ты уже в принципе привыкаешь к этому состоянию. Я привыкла. Думаю, когда детям говорят, что Элджей и его музыка может сделать их наркоманами - это работает примерно так же. Моя зависимость была заложена во мне, но всегда есть тот триггер, который запускает этот механизм.\n(на фото уже 9-10 классы, с 7ого класса я курила. К началу универа выкуривала по две пачки в день)\nВ то время у меня пропало желание не-торчать. Я была готова пробовать, я стала открыта для этого мира и людей в нем. Я читала сайт\ndrugusers\nо внутривенном употреблении , я пыталась понять суть зависимости и зависимых. Мне было 13-14 лет. В то время я встала на сторону идеологии «I dont want to choose life. I choose something else». Мне не нравился лживый мир взрослых - они сами не могли быть примерами трезвости или чистоты, они не были эмпатичными, они не старались понять нас и выслушать. Я хотела связать свою жизнь с социальной журналистикой и программами типа «Снижение вреда» - кстати, почти за 20 последующих лет я успела побыть и клиентом подобных центров, и их амбассадором.\nЛет в 16-17 я нашла Ital-идеологию в растафарианстве. Чистота и естественность. Вегетерианство, травка, никакой химии. На тот момент я уже попробовала ряд наркотиков - несколько клубных сетов - я поняла, что танцевать под наркотиками - это не мое. Но лежать с закрытыми глазами - это, пожалуй, да. Мое употребление химии до 16 лет было эпизодичным, раз 10, максимум - 1-2 дня подряд. Не было денег, не было компании, в которой были тяжелые наркотики. Но по поводу легких - все это было, и это было лучше, чем алкоголь.\nАлкоголь иногда все таки появлялся в нашей жизни - но в качестве редкого веселья. Был долгий период отказа от алко, но ни начала ни конца я не могу вспомнить. Скорее всего весь первый курс университета. Тогда мы начали есть грибы, у меня серьезно повернулась сознание. В тот момент я заплела дреды и взяла достаточно строгую аскезу. Рассталась с парнем, с которым встречалась с 9ого класса, много времени проводила в церкви. Мне хотелось очистится, казалось, что я неправильно живу и все вокруг тоже совершают ошибки. Я чувствовала: мы все должны быть чистыми и невинными, как дети. А мы были далеко от этого.\n(2004-2005)\nКогда я нашла идеологию чистоты в I-tal и православие, я была уверена, что это навсегда. Прошло года 3, мы выпустили альбом, попали в реггей среду, я нашла свое место и ощущение правильности всего, что я делаю. Между мной и химией лежала, как мне казалось, целая вечность. Я осуждала тяжелых наркоманов, считая это слабостью и тупостью. Я успела даже осознать зависимость от гашиша - оказавшись без вещества тгк на неделю, я чуть не сошла с ума. Конечно, это не героиновая ломка - это другое, но психологически очень неприятно. Зато после этого перерыва, я перестала нуждаться в тгк каждый день, и начала относиться к этому спокойнее. В то время, мне кажется, я была ближе всего к психологии независимых людей. Могла бухать с друзьями по выходным, когда мы идем в клуб, а в будни ходить в офис, курить время от времени. Меня это не беспокоило. Тогда я начала кататься на велике, знакомиться со своим запущенным здоровьем и телом, экспериментировать с питанием.\n(2006-2007 первые шаги в здоровом образе жизни. Я наконец-то начала выглядеть лучше, бросила курить!)\nПотом что-то пошло не так. Я встретила любовь, my siberian ragga, мне казалось, что это - ваааааааааа бесподобное нечто, и теперь все будет иначе. Я как будто поменяла свою внутреннюю химию, перестала чувствовать себя тем человеком, который жил и устоялся до этого. И когда мы оказались в Питере -  мне захотелось употребить что-то сильное. Мне казалось, что мы несокрушимы, что ничего не сможет нас разлучить или сломать. Отличное решение на этой волне убиться дешевыми влажными питерскими спидами. И когда я это сделала - это убило всё. И нового воздушного человека во мне, и химию, и любовь. Первое употребление после долгого перерыва выжгло меня изнутри, всю мою идеологию и ощущение правильности, и вообще все. Кстати, где-то в этот период я завела жж, может на несколько месяцев позже. И еще песня «Ищу Тебя» о том моменте. Любовь была у меня, но я потеряла ее в себе.\nКто после этого начал употреблять - я не знаю. Какая-то пустая оболочка без смысла и идеологии.\n21-22 года - это время моего самого активного употребления без контроля и понимания, что со мной происходит. Мне было надо. Мне хотелось. Я искала возможности и способы. Мне конечно хотелось при этом контролировать употребление и не терять свою жизнь. И у меня были способы. Например - не торчать в Екатеринбурге. Я продержалась в этой концепции месяцев 7-8, меня откачивали в турах, в итоге я практически переехала в Ижевск.\nсентрябрь 2008, i am so bad\nБыли моменты, когда я пыталась перестать сама. Я не торчала на героине, но стимуляторы тоже подсаживают тебя на систему, хоть и не такую жесткую. Я пробовала так: например - разогнать дозу до такого, чтобы было уже невозможно употреблять (плохой способ). Отказаться от стимуляторов и употреблять только несинтетические наркотики - лсд, грибы, мескалин. В конце уже не было денег на экзотику, мы со Щекалевым съели семена гавайской розы (я совершила эту ошибку второй раз в жизни). Отравление было таким сильным, что почти сутки я падала в обмороки и испытывала боль во всем теле. Было так плохо, что после этого любое состояние было хорошим. Т.е. Меня больше не кумарило.\nМы уехали автостопом на юг, перед этим я познакомилась с Никой Суринович, которая сказала: хехе, у тебя проблемы. Осознаешь - приходи. И я, с трезвостью в неделю или две, усмехалась в ответ: я могу сама. Вот увидишь. Через месяца полтора трезвости я осталась одна и выпила глинтвейн. А что такого? Это же не наркотики. Теперь можно.\nМного раз за эти два года я пыталась заменить наркотики на алкоголь. Это были и веселые вечеринки, и просто несколько термосов глинтвейна с водкой, без которых я не выходила из дома как раз в тот период - вот в один из этих выползок я пела для ВИЧ+ ребят в помещении группы анонимных наркоманов, многие думают что в тот период я была уже трезвая. Видимо в употреблении я не выглядела так, как представляют себе торчков. Просто грустная.\nВообще все относились ко мне нормально. Юля меня поддерживала и всегда была рядом, одногруппники помогали с учебой, моя группа старалась понять меня. Конечно я вела себя безумно, я психовала, сама отталкивала от себя людей - во многом я хотела сама все потерять, чтобы нащупать дно и оттолкнуться от него, но у меня никак не получалось. Возвращение к наркотикам после перерыва, когда «ты сам» - это болезненно. Казалось, что я падала еще ниже. Мне отчасти нравилась эта эстетика дна, мне было больно в душе, но не страшно. Я употребляла внутривенно, я делала это одна. И вот так казалось все и должно закончится. В какой - то момент ты не хочешь никуда выбираться, не хочешь, чтобы тебе становилось лучше. Ты просто жалеешь, что не можешь умереть прямо сейчас.\nТем не менее употреблять больше недели я не могла. То есть когда я пишу о своем торче, многие представляют меня, как Андрея - который 10 лет ежедневно кололся и искал дозу с редкими перерывами на детоксы. У меня была другая система - я могла употреблять 2-3 дня, наркотики заканчивались или я их выбрасывала раньше. Потом я пыталась компенсировать себе выходы - начинала бегать через силу, еле передвигая ноги, по вечерам - заливаться алкоголем, превращая все это в атмосферу праздника - могу, умею, практикую. Друзья = эндорфины. Пару дней - и я была в норме, ничем не отличалась от других людей, которые бухают по выходным. Так можно жить годами, и многие, многие так живут до сих пор. Особенно в Питере, где Северное техно и вся инфраструктура. Но в Питер, кстати, я переезжала уже на другой волне.\nВ целом у меня было все: друзья по всей стране, прогресс во всех сферах жизни, много полезных связей, деньги на все необходимое, независимость от родителей - мой торч был отвратителен или прекрасен тем, что давал моему «я сама» большую веру и моему эго большую подпитку - а это значит, что мне претила сама идея обращения за помощью. Я понимаю Лил Пипа, понимаю всех этих фрешменов, которые умирают до 25ти. В своем первом ребцентре я рисовала картинку: я держу в руках столько дел, людей, все вокруг меня и завязано на мне - а подо мной бездна, а в ней - огонь. И мне уже жжет пятки.  Но я могу писать песни, могу выходить на сцену, черт возьми, я даже могу подготовиться к экзаменам и сдать сессию, написать охрененное эссе, статью в газету факультета. Я все успеваю - и жить, и умирать.\nЭто было самым сложным в том периоде, да и вообще в любом из последующих. Если в этой жизни ты держишься на уровне нормальных людей, держишь свою жизнь в шатком балансе, то что в той, другой жизни без наркотиков и алкоголя? Норма не измеряется твоими успехами, достижениями, положением общества. Норма - это то, что на твоих внутренних приборах. И строить курс надо по этим приборам, а не по внешним ориентирам. Быть в норме, как все другие люди еще не значит быть в твоей личной норме. Тогда я не знала никого, кто жил бы так, как я и испытывал бы подобное. Если бы мне тогда попалась книга Киддиса Scar Tissue - возможно, я бы лучше поняла, что происходит.\nОчередная моя чистота началась решительно: я пообещала Юле - пол года никаких наркотиков, а она подарила мне абонемент в фитнес клуб, где я попала на первую в жизни йогу, а в последствии - вообще прописалась там, пробуя все все виды групповых и индивидуальных программ. Я решила ходить к Нике в реб.центр, изредка оставаясь там на ночь - просто подсмотреть, как лечат зависимых. Но я выполняла все задания. Ужасом для меня было то, что они говорили об алкоголе - что это такой же наркотик. Я не могла и не хотела с этим соглашаться - настолько он бы интегрирован в жизнь.. Это была норма. Все так отдыхали. Когда в компании я пробовала отказаться от алкоголя - я чувствовала себя несчастной, как единственный ребенок из всех, которому запретили мороженное;\n(разговор с Никой, октябрь 2008)\nНу можно я буду пить но не буду торчать? - ну давай, хе-хе-хе… - Вот так примерно мне отвечала Ника. И я пробовала.\nТогда, после очередного разового срыва на наркотики (около месяца я продержалась с алкоголем и на обещании Юле). И вот тогда я пошла на группу. Она была, кажется, на улице Луначарского. Люди мне не понравились. Все было ужасно, меня стебали, кривили лицо - я была там вообще «не от мира сего», но я как-то покорилась. Кажется в тот момент я приняла бессилие: с алкоголем не получится, я устала, я хочу попробовать так, как вы говорите.\nПервым моим шагом в настоящую трезвость без полумер было абсолютное понимание, что контролировать употребление я не могу, понять зачем я употребляю - я тоже не могу. Не было ясности, что будет дальше, как я там буду — но первый раз в жизни я была готова отказаться от всего: от алкоголя и любых видов наркотиков.\nЭто была осень 2008 года. Мой последний год обучения в университете, год, когда мы выпускали Снежную Барселону. За 2008-2009 год мне едва ли удавалось набрать 1-2-3 месяца трезвости без срывов, но во всяком случае уже большую часть времени я проводила абсолютно чистой - без алкоголя и даже легких наркотиков. Проживала день за днем. Это - первая часть рассказа. Остальное напишу в следующий раз.\n", "preview": "# Scar Tissue автореферат\n*Date*: 29 ноября 2018, 17:09\n*URL*: https://olymarkes.livejournal.com/87992.html\n\nМеня тут попросили написать даже не о срывах, а скорее о возвращении к трезвости. О том, как я останавливалась. Тема интересная, в голове сразу куча картинок. И я вспоминаю. Зависимость - как механизм - до сих пор со мной, не важно, как давно я не употребляю. Когда я остаюсь одна и не могу ", "meaningful_title": "История Ники - спасение через реабилитацию", "final_title": "Scar Tissue: хронология зависимости и первые шаги к трезвости", "final_annotation": "Подробная автобиография пути от первого употребления в 12 лет до первых шагов в программе. Честный рассказ о механизмах зависимости.", "display_date": "29 ноября 2018, 17:09"}, {"path": "data/lj_export_clean/posts_md/82835__hard_diving.md", "source": "LiveJournal", "date": "Unknown", "filename": "82835__hard_diving", "title": "hard diving", "full_content": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один парень умер от наркотиков, и много я прочитала в те дни - о том, что надо было спасать, или о том, что надо было предпринимать меры. Я, конечно, в очередной раз примерила на себя эту историю. Никто не мог помочь, никто не мог спасти. Это всегда история только про тебя.\nСтранная это штука, во многом определившая мою жизнь. Это и отличает зависимых людей от независимых -\nв торчках употребление чего-то изменяющего сознание - это всего лишь следствие прописанной программы. Остальные могут просто жить. Наркоманы не могут просто жить. Жизнь похожа на то, как будто тебя варят заживо, но постоянно дают возможность осуществить Ice Bucked Challenge. Не сказать, что от наркотиков я получала какое-то удовольствие. Это просто был способ, метод продолжаться, не сходить с ума, не сходить с дистанции. Жизнь сама по себе является причиной желания умереть - не что-то в ней, а она сама. Поэтому тогда, еще лет в 16, я не хотела выбирать жизнь и ее атрибуты: детей, работу, достигательство, бабки, успех, одобрение других, участие в соц.соревнованиях, сраный спорт, настольные игры, туризм по выходным. Я заранее знала, что меня все это не сможет сделать счастливой. Я все это априори презирала.\nПо сравнению с настоящими наркоманами фактически я употребляла очень мало. Настолько, что я могу вспомнить каждый раз, количество, обстоятельства. Это были не такие длительные периоды, но каждый раз я встречалась со своим пределом. Когда я сравниваю свое употребление с тем, как это делал Андрей, я начинаю понимать разницу: он получал удовольствие, я - нет. Он мог продолжать долго - я сыпалась очень быстро. Думаю, что если бы я могла выстроить свое употребление более системно - у меня не получилось бы остановиться. В моем случае я была на грани с самого первого употребления. Я всегда превышала дозу. Я не делала перерывов ни на один день. Каждый раз я чувствовала в какой-то момент тот потусторонний холодок - в смерти не было зла, она обещала мне выбор. Выбор, который освобождает. Почему так легко отталкиваться от дна? Дно - это свобода, которая по сути дает тебе только одно направление. И ты выбираешь жизнь, и ты выбираешь попробовать еще раз поиграть по ее правилам.\nГоворят, что боль уходит.\nКогда ты торчишь и потом типа не торчишь - ты попадаешь в замкнутый круг. Самая интересная фишка, когда ты абсолютно чист, свеж, но нихрена не светел. Даже если прошло три месяца с последнего раза, три месяца, которые на самом деле длинной в вечность - и ничего не меняется к лучшему. Мрачные декорации для всего происходящего никуда не уходят. И говорят, что боль уйдет, но когда? Ты ждешь, ждешь, ждешь, что-то делаешь.. Но ничего не меняется. Ни-че-го. Вот это настоящее дерьмо. И очень сложно вариться в этом котле зная, что твое ведро со льдом всегда стоит на расстоянии вытянутой руки.\nТы просто не понимаешь, ради чего отказываться от анастезии. Ни один из мотивирующих социальных плакатов не вызывает у тебя желания стать его героем. Все предлагают тебе какие-то атрибуты, но не предлагают суть. Не предлагают то, чем можно заполнить пустоту внутри - вот что самое страшное.\nВся моя жизнь до определенного момента состояла из таких отрезков. Я смотрела, как долго я могу терпеть все это дерьмо. И если нормальные люди торчат годами, то у меня не было этих лет, не было даже долгих месяцев употребления. Были разы, дни между месяцами и годами чистоты. Что я чувствовала в те моменты, когда срывалась? Я чувствовала покой и отчаяние. Мне было хорошо, потому что больше не надо было терпеть это напряжение. Мне было невозможно, потому что торчать я тоже не могла.\nВот сейчас, собственно, будет главная мысль, ради которой я вообще все это писала. Случается (или не случается) момент расщепления «я».\nЕсли случается, то ты случайно отделяешь себя от своего желания торчать.\nВот она, та маленькая шестеренка, которая вращала мой механизм в другую сторону. Я всегда слушала желания, внутренний голос, и вот в какой-то момент я увидела что желание перестать жить - это не мое желание, а некий системный баг.\nКогда я смотрела в себя, я видела заброшенный мир. Как завод, который стоит. Как оставленный людьми город со всей инфраструктурой. Я настолько была одержима желанием все это уничтожить, что никогда не обращала внимание на внутренний дизайн. Мне хотелось снести все разом, а тут я увидела, что конкретно я хотела сносить. И оно мне понравилось.\nЯ не думаю, что можно спасти тех людей, которые не отделяют себя от своего желания торчать. Их может спасти только чудо. Для небольшого количества тех, кто говорит «меня», а не «я», есть инструменты.\nЖаль, для 12 шагов не придумать никакой хорошей метафоры - слишком это сложная история. Возможно, я бы могла не торчать и без их помощи, но фишка не в этом. В шагах я использовала свою зависимость как ключ к расшифровке собственной личности. Это помогло постепенно включить весь механизм, и он стал работать в другом направлении.\nНе то что бы мне сильно захотелось жить. Не то что бы у меня ушла эта невероятная тоска. Просто я оставила все это картинкой на десктопе, это перестало быть руководством к действию. Вместо этого внутри меня стало постепенно оживать что-то. Интерес - вот самое лучшее чувство, за которым уже идет все остальное. Ты осуществляешь действие - видишь результат - радуешься. Я не радуюсь от того, что не является результатом моего труда. Такое у меня устройство. И вот когда я поняла это - я начала делать. Вернее не так, я делала и делала много до этого, но внутри была такая каша, что я не понимала, что именно это меня радует.\nТак я поняла, почему я люблю тренировки. Почему я люблю писать. Почему я люблю вести йогу - мне нравится действие, направленное на что-то хорошее. И дальше все это было уже как снежный ком. Ком, в сердцевине которого был зародившийся интерес к жизни, ко всему тому, что было мне непонятным.\nЯ обязательно напишу еще, и про свои рехабы, и про открытия в самоанализе, и про свои дефекты характера, и про то, как я училась и учусь по мааааленьким ступенькам поступать по-новому в рамках собственного безумия. Я буду писать, потому что гипотетически есть какой-то такой,\nпохожий на меня человек, которому мой опыт будет полезен. А я очень мало им делюсь, самым ценным и тяжелым - а надо бы, надо бы.\nАнастезии нет. Нет и всё. Ты просто начинаешь жить и однажды перестаешь задыхаться. И это невероятно похоже на тренировки - у тебя появляются силы так постепенно, что порой ты этого не замечаешь. Просто ты оглядываешься и понимаешь, что плывешь. Зависимость - это удивительная болезнь, которая может открыть такое зазеркалье твоей реальности, что слов не найдется, чтобы описать. Вот поэтому для меня наркотики - это такая вещь, мало кто поймет, если я скажу, что я благодарна за то, что это было в моей жизни.\nАнастезии нет. И ты все еще являешься собой во всей этой уязвимости. И жизнь все еще похожа на то, как будто ты идешь по канату, или куда-то бесконечно падаешь. Просто теперь уже точно нет никакой иллюзии, что ты можешь что-либо контролировать в этом глобальном процессе, поэтому тебе спокойно, и в процессе падения ты наконец-то можешь открыть глаза, оглядеться по сторонам и начать жить.\n", "preview": "# hard diving\n*Date*: 18 августа 2017, 02:55\n*URL*: https://olymarkes.livejournal.com/82835.html\n*Tags*: #000000\n\nУ меня была какая-то охрененная главная мысль этого текста, она пришла мне в голову на пробежке, когда я поворачивала со второй советской улицы на греческий проспект. До этого мне нужно было кучу всего написать, записать, прочитать - и вот остался в голове только топик. Недавно один па", "meaningful_title": "5-й шаг: признание перед Богом, собой и другим человеком", "final_title": "Механизм зависимости и работа с 12 шагами", "final_annotation": "О том, как зависимость работает изнутри. 12 шагов как ключ к расшифровке собственной личности и выздоровлению.", "display_date": "18 августа 2017, 02:55"}, {"path": "data/lj_export_clean/posts_md/83593__не_про_тебя_надеюсь.md", "source": "LiveJournal", "date": "Unknown", "filename": "83593__не_про_тебя_надеюсь", "title": "не про тебя надеюсь", "full_content": "# не про тебя, надеюсь\n*Date*: 13 сентября 2017, 00:23\n*URL*: https://olymarkes.livejournal.com/83593.html\n*Tags*: #000000\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и в свободное время я часто приходила туда бухать. Если помните, была у меня такая фотография - где я грустная в шапке и с тысячной бумажкой, положила подбородок на руки на барной стойке. Вот это оттуда.\nТам Ника рассказала мне про анонимных наркоманов. Я поржала, потому что не знала, что это дерьмо бывает в реальности - это же не мать его фильм про Тайлера Дердена. Потом можно следующий кадр - как я иду по дороге в Арамиле - это такой поселок недалеко от Екатеринбурга. Иду по дороге с какими-то тяжелыми пакетами и плачу от того, как мне себя жалко. Иду в свой первый реб.центр, сама, не потому что кто-то меня туда захотел положить, и даже не потому, что я проторчала все - нет..\nПросто боль была такой невыносимой, и я совершенно не знала с чего начать.\n- Ну как же я не буду бухать по выходным с друзьями в клубах?! Зачем вообще тогда жить, работать, терпеть всю эту херню которая в жизни происходит?\n- Не можешь не бухать - бухай, - сказала Ника. - Иди и бухай.\nИ я конечно пробовала без наркотиков, но с алкоголем. Я помню эти «восемь глинтвейнов, пожалуйста, четыре белых четыре красных». Еще до этого было реально такое лето, когда я смогла. Я бегала каждый день, я отлично выглядела - конечно это было тоже после неприятных событий, крайне неприятных. После очень нехорошего апреля и мая. Там был такой период, когда я очень напугала всех друзей. И вот в конце меня сильно тряхнуло, и я перестала. Там было два месяца абсолютной трезвости, просто чтобы доказать себе, что я могу. Чтобы снова почувствовать себя сильной, светлой, быть в себе.\nЯ до сих пор помню это путешествие: мы с Артемом проехали от Екатеринбурга до Анапы автостопом, жили в палатке на берегу. Потом я выпила бокал глинтвейна в уличном кафе Джемете и все - я вдруг не продолжила, не стала думать о наркотиках. Мне казалось, что я излечилась. Что я наконец-то полностью независимый человек. Но ха-ха-ха, святая наивность.\nНу и вот через месяца полтора эта картина: иду по Арамилю и плачу. И там меня встречает Ника и отводит в такой простой кирпичный коттедж, просто дом. Не больница. И вот там я аккуратно заглядываю в себя одним глазком. Я даже не ложусь в этот реб.центр. Я в него приезжаю, прихожу.. Делаю все, что делают пациенты, но как бы не сдаюсь совсем. Я ведь не такая, я особенная, я сильная, и не проторчала еще свою жизнь.\nВот помню что там я нарисовала такой рисунок: вот стою я, держу в своих руках много ответственности: группа, университет, работу, что-то там еще… А подо мной пылающая бездна. Помню, как рассказывала Нике, как у меня вообще-то нет проблем с наркотиками, зато есть со всем остальным, с восприятием тела, с моей реализацией, с моими недостатками.. Она только грустно усмехалась. Я ее понимаю, сейчас я тоже грустно усмехаюсь, когда смотрю в прошлое… Это было только начало, я вообще ничего не понимала тогда, не умела блять думать тупой своей головой.\nНе смотря на пять последующих лет, не смотря еще на один реб.центр в конце этого периода, я почему-то считаю, что я легко сдалась. Мне как-то очень сильно повезло, что я пошла в эту сторону, что из меня какой-то кувалдой жизнь не только выбивала саму возможность употребления веществ, но и заставила меня нырнуть в саму природу зависимости. К этому я и шла эти 5 лет - до 2012 года.\nКогда меня спрашивают, что такое шаги - я теряюсь, как отвечать на такое. Удивительные есть люди, которые начинают это делать, хотя жизнь не проезжается по ним катком. Возможно ли такое? Можно ли получить от них пользу, если ты хотя бы раз не причинил сам себе пиздец, близкий к смерти? Не знаю, чувак, не знаю, как рассказать тебе, что это такое, эти шаги..\nМожет быть попробуешь юнгианский анализ?\nНика до сих пор лечит наркоманов, вон открыла реб.центр. А я стала таким адептом трезвости, что люди при мне даже бухать стесняются. Кто бы мог подумать. Другая сторона реальности - она такая другая. Ты чёткий, как ретина, и уже забываешь как это - хотеть изменить этот факт. Но твоя личная бездна - она никуда не уходит, ты умеешь черпать из нее такие вещи… Короче, грущу я от того факта, что весь этот огромный опыт невозможно впихнуть ни в пост, ни в разговор, ни даже в книгу, чтобы показать, что решение любой моей проблемы на самом деле было в том, чтобы войти в реальность на 100% и осознать себя на 100%. А для этого нужно было не просто сохранять трезвость, для этого нужно было понять, почему я когда-то начала и продолжила изменять сознание. И это невозможно сделать простым размышлением. Для этого нужно работать по правилам. По правилам, которые ты готов принять, когда чувствуешь, что тебе полный пиздец. У кого-то пиздец не наступает до самой смерти, а кому-то больше везет. Но ты права, все это для чего-то нужно. И у каждого своя «ментальная горсточка». Видимо, я еще до этого целый черпак размутила, так, что мне еще на жизнь вперед хватит.\n", "preview": "# не про тебя, надеюсь\n*Date*: 13 сентября 2017, 00:23\n*URL*: https://olymarkes.livejournal.com/83593.html\n*Tags*: #000000\n\nГоворишь все для чего-то нужно. А я грущу. Грущу, потому что не получается у меня в разговоре, не получается словом печатным. А у Ники как-то получилось.\nВсе тогда крутилось вокруг 2Ку. Так заведение называлось у нас в Екатеринбурге. У нас постоянно в нем были концерты, ну и ", "meaningful_title": "Программа Анонимных Наркоманов - путь выздоровления", "final_title": "Первый реабилитационный центр и начало пути", "final_annotation": "Как автор попала в первый реб-центр 'Зазеркалье' и начала понимать природу своей зависимости.", "display_date": "13 сентября 2017, 00:23"}, {"path": "data/ig_organized/long_200_md/2021-08-19.md", "source": "Instagram", "date": "2021-08-19", "filename": "2021-08-19", "title": "2021-08-19", "full_content": "https://www.instagram.com/p/CSxJM1OocMq/\n\nПо четвергам я пишу о зависимости.\n⠀\nПрограмма 12 шагов заставляет тебя смотреть на себя честно и беспристрастно. Если ты не работаешь по программе - жизнь начинает преподавать тебе болезненные уроки. Тебе все равно приходится смотреть на себя, но уже не в «учебной» среде. \n⠀\nПисать ответы на «шаговые» вопросы - дело не самое легкое и приятное, но проживать жизненные уроки гораздо, гораздо неприятнее.\n⠀\nЯ помню, как однажды у меня были серьезные проблемы на работе, и мой друг из 12шагового сообщества, опытный бизнесмен, траблшуттер, был тем человеком, к которому я обратилась за консультацией по своей проблеме. Он сказал тогда что-то вроде: «я бы мог тебе долго рассказывать всякое, но скажу тебе главное: начни уже писать шаги. Когда ты этого не делаешь - ты постоянно совершаешь ошибки, ты сама будто вставляешь палку в колесо своего велосипеда. Так работает мозг зависимого человека». Я тогда хотела других рецептов, и мне было не до шагов. И совершенно зря.\n⠀\nЧерез несколько лет просто трезвости, я поняла, что дело не в ней. Если не работать с головой, я постоянно делаю все не так, говорю не так, совершаю ошибку за ошибкой, обижаю людей, сама обижаюсь и остаюсь в изоляции. Естественно, это проникает во все сферы жизни. Зависимость похожа на черный спрут, и самое страшное в какой-то момент ты перестаешь отделять зависимое поведение от самого себя. Поэтому многие не хотят работать с собой и бросать вещества - им кажется, что без всего этого они потеряют себя.\n⠀\nПотом, когда начинаешь писать шаги, ум очень очищается, ты уверен в каждом своем действии, тебя сложно обидеть или задеть, и самое главное - ты начинаешь делать одно правильное решение за другим. Это не про то, что шаги гарантируют успешный успех. Для этого нужно слишком много факторов. Но ты трезво оцениваешь себя, свои возможности и можешь делать действия, а не гонять в голове из пустого в порожнее, ничего не предпринимая.\n⠀\nСейчас я не пишу шаги регулярно, и явно наблюдаю, как с чердака начинает подкапывать. Такое уже бывало в моей жизни, и когда становилось совсем фигово - начинала писать снова. Я говорю про такие процессы - боль, как регулятор баланса. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CSxJM1OocMq/\n\nПо четвергам я пишу о зависимости.\n⠀\nПрограмма 12 шагов заставляет тебя смотреть на себя честно и беспристрастно. Если ты не работаешь по программе - жизнь начинает преподавать тебе болезненные уроки. Тебе все равно приходится смотреть на себя, но уже не в «учебной» среде. \n⠀\nПисать ответы на «шаговые» вопросы - дело не самое легкое и приятное, но проживат", "meaningful_title": "Работа по программе 12 шагов", "final_title": "Работа по программе 12 шагов", "final_annotation": "Рассказ о личном опыте зависимости и выздоровления.", "display_date": "Дата неизвестна"}, {"path": "data/ig_organized/long_200_md/2021-04-22.md", "source": "Instagram", "date": "2021-04-22", "filename": "2021-04-22", "title": "2021-04-22", "full_content": "https://www.instagram.com/p/CN9h75ZnySn/\n\nПо четвергам я пишу про зависимость.\n⠀\nСегодня дам небольшую вводную для новичков, которые часто пишут мне:\n⠀\n- Так от чего у вас зависимость?\n⠀\n15 лет назад я думала, что у меня проблемы с наркотиками. Я хотела завязать с ними, и оставить все остальное - косячок, бокал вина по вечерам, тусовки с текилой по выходным. В те моменты, когда я методом силы воли бросала употреблять, просыпалась моя булимия и я начинала напиваться гораздо чаще, чем хотелось - я не связывала все это воедино, пока не узнала, что зависимость всегда найдет лазейку, чтобы проявиться - и надо постоянно работать с ней, как будто у тебя диабет.\n⠀\nПотом я начала видеть, как мое зависимое поведение проявляется во всем - в дружбе, отношениях, в работе. Зависимость - это эгоцентризм, и как следствие - обидчивость, ранимость, сосредоточенность на своих чувствах, невозможность выходить из круговорота боли.\n⠀\nПросто трезвость не решала эти проблемы - я срывалась после года чистоты, после 2х лет чистоты, пока не поняла, что дело не в трезвости самой по себе а в том, что мне нужно разобраться в причинах.\n⠀\nТогда я начала письменную работу по программе «12 шагов» - изначально ее создали алкоголики, но она была адаптирована сначала для наркоманов, а потом - для многих других видов зависимости, да и вообще - для многих ситуаций, которые вроде бы не связаны с зависимостью. С 12 шагами люди переживают утрату, поддерживают себя в болезнях - короче, как в бойцовском клубе. Есть много групп, но суть не в группах а в письменной работе.\n⠀\nЯ пишу 12 шагов уже 9 лет, не тороплюсь, стараюсь прописать каждую мелочь, прожить каждый раздел. Сейчас я - в середине 11 шага. По сути - это просто ответы на вопросы из книги, я пишу свой опыт, примеры из жизни и потом обсуждаю со «спонсором» - это волонтер из программы, у которого опыта больше, чем у меня. Это бесплатно, анонимно и не требует много времени. Кажется, что это сложная работа, но сложно только начать: найти подходящее сообщество, спонсора и впрыгнуть в работу. Когда я допишу 12 шаг, я просто начну заново. Потому что суть в процессе, и нет конечной точки. Есть просто жизнь без желания самоуничтожится, и это - ценность. #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CN9h75ZnySn/\n\nПо четвергам я пишу про зависимость.\n⠀\nСегодня дам небольшую вводную для новичков, которые часто пишут мне:\n⠀\n- Так от чего у вас зависимость?\n⠀\n15 лет назад я думала, что у меня проблемы с наркотиками. Я хотела завязать с ними, и оставить все остальное - косячок, бокал вина по вечерам, тусовки с текилой по выходным. В те моменты, когда я методом силы воли", "meaningful_title": "5-й шаг: признание перед Богом, собой и другим человеком", "final_title": "5-й шаг: признание перед Богом, собой и другим человеком", "final_annotation": "Рассказ о личном опыте зависимости и выздоровления.", "display_date": "Дата неизвестна"}, {"path": "data/ig_organized/long_200_md/2020-12-31.md", "source": "Instagram", "date": "2020-12-31", "filename": "2020-12-31", "title": "2020-12-31", "full_content": "https://www.instagram.com/p/CJdR4xEH_Rr/\n\nСимволично, что год заканчивается в этот день. Что это утро я провела на собрании зависимых с одним из моих sponsee. У меня в душе очень хорошо от этого финального аккорда.\n⠀\nВ этом году я начала свои «чистые четверги» - писала о зависимом поведении и о своем пути в этой теме. Вчера рождественский выпуск сериала «Эйфория» на нетфликсе, и вся серия - это разговор главной героини со своим «спонсором» (так называются наставники -волонтеры в 12 шаговых сообществах). Я думала: так удивительно слышать это с экрана, и так здорово. И у меня были такие разговоры. И я была и на месте Ру, и через годы - уже на месте ее спонсора. У меня не на все есть ответы, но у меня есть мой опыт, и я им делюсь.\n⠀\nЗнаете, какой шаг является двенадцатым? Несение вести тем зависимым, которые все еще страдают. Кто написал сценарий этой серии «Эйфории» - они тоже сделали свой 12 шаг, и мы не узнаем, кто именно - в этом и есть принцип «анонимности». Но когда звезды рассказывают о своем пути в 12 шагах - например, Киддис в своей биографии, это тоже помогает многим. Я в свое время оказалась  в программе, потому что девушка рассказала мне о музыкантах, которые выздоравливали от употребления с помощью 12 шагов.\n⠀\nНесколько лет до этого я служила иначе: вела группы, общалась с подопечными. В этом году этого не хватало. Я не хотела нарушать принцип «анонимности», поэтому я рассказывала обо всех 12-шаговых программах в целом, не акцентируя внимания на конкретно своей проблеме. И это сработало очень интересным образом.\n⠀\nЗа этот год многие мне писали в личку: «я пошла на анонимных переедающих», «я узнала о сообществе CODA и хожу на группы созависимых», «я начал писать шаги по ВДА(взрослые дети алкоголиков». Это важно для меня, и у меня есть ощущение, что я все делала правильно, не стесняясь писать на эту тему.\n⠀\nМне писали и родственники зависимых - благодарили за мои посты, что они помогли лучше понять близких, понять, как поддерживать после реабилитации - я очень рада, что это было полезным. У постов есть тег и все их можно найти и прочитать в любой нужный момент.\n⠀\nВ этой сфере моей жизни в этом году главное - это весть, которая нашла своего адресата. Спасибо, что читали и делились ❤️\n", "preview": "https://www.instagram.com/p/CJdR4xEH_Rr/\n\nСимволично, что год заканчивается в этот день. Что это утро я провела на собрании зависимых с одним из моих sponsee. У меня в душе очень хорошо от этого финального аккорда.\n⠀\nВ этом году я начала свои «чистые четверги» - писала о зависимом поведении и о своем пути в этой теме. Вчера рождественский выпуск сериала «Эйфория» на нетфликсе, и вся серия - это ра", "meaningful_title": "4-й шаг: инвентаризация дефектов характера", "final_title": "4-й шаг: инвентаризация дефектов характера", "final_annotation": "Рассказ о личном опыте зависимости и выздоровления.", "display_date": "Дата неизвестна"}, {"path": "data/ig_organized/long_200_md/2020-10-22.md", "source": "Instagram", "date": "2020-10-22", "filename": "2020-10-22", "title": "2020-10-22", "full_content": "https://www.instagram.com/p/CGo3kYbnHVs/\n\nПо четвергам я пишу про зависимость, еще я сделала хайлайт «четверг» - буду собирать туда что-то из сториз, или писать подводки к старым постам - например, там есть пост «с чего начать».\n⠀\nСегодня я хотела бы собрать у вас вопросы для будущих постов или темы, которые вы бы хотели увидеть глазами зависимого человека. Например, вчера я рассказывала друзьям о том, какая поддержка нужна человеку, выходящему из реабилитационного центра.\n⠀\nПишите, что вам интересно, о чем вам еще рассказать! #12шагов_olymarkes\n", "preview": "https://www.instagram.com/p/CGo3kYbnHVs/\n\nПо четвергам я пишу про зависимость, еще я сделала хайлайт «четверг» - буду собирать туда что-то из сториз, или писать подводки к старым постам - например, там есть пост «с чего начать».\n⠀\nСегодня я хотела бы собрать у вас вопросы для будущих постов или темы, которые вы бы хотели увидеть глазами зависимого человека. Например, вчера я рассказывала друзьям о", "meaningful_title": "Опыт реабилитации от зависимости", "final_title": "Опыт реабилитации от зависимости", "final_annotation": "Рассказ о личном опыте зависимости и выздоровления.", "display_date": "Дата неизвестна"}];
        document.getElementById('grid').innerHTML = posts.map((p, i) => `
            <div class="post-card" onclick="show(${i})">
